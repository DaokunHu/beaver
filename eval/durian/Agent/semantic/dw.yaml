  source_entity_id: TIP_DETAIL
  target_entity_type: table
  target_entity_id: TIP_DETAIL
  relation_type: joins
  desc: TIP_DETAIL self-join on SUBJECT_ID and TERM_CODE to relate textbook material
    records of the same subject across terms or to combine filtered material subsets
    (e.g. status 'RQ' versus status 'U' scopes) for the same subject.
  columns:
  - source_column: SUBJECT_ID
    target_column: SUBJECT_ID
  - source_column: TERM_CODE
    target_column: TERM_CODE
