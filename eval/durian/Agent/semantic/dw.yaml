  - source_column: BUILDING_KEY
    target_column: FCLT_BUILDING_KEY
- id: join_spacedetail_spacefloor
  source_entity_type: table
  source_entity_id: SPACE_DETAIL
  target_entity_type: table
  target_entity_id: SPACE_FLOOR
  relation_type: joins
  desc: SPACE_DETAIL joins SPACE_FLOOR on FLOOR_KEY to obtain floor name/label for
    each assigned room.
  columns:
  - source_column: FLOOR_KEY
    target_column: FLOOR_KEY
- id: join_spacedetail_spaceusage
  source_entity_type: table
  source_entity_id: SPACE_DETAIL
  target_entity_type: table
  target_entity_id: SPACE_USAGE
  relation_type: joins
  desc: SPACE_DETAIL joins SPACE_USAGE on SPACE_USAGE_KEY to decode the room usage
    classification (e.g. classroom, office, lab) for each assigned room.
  columns:
  - source_column: SPACE_USAGE_KEY
    target_column: SPACE_USAGE_KEY
