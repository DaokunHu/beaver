- id: EMPLOYEE_DIRECTORY
  name: EMPLOYEE_DIRECTORY
  desc: 'Employee directory table: one row per institute employee with MIT ID, legal
    and preferred name components, directory/primary titles, HR department number
    and name, office location and office phone, email address, personal URL, and Kerberos
    name. Used to resolve responsible faculty contact details (full name, email, office
    phone) for subject offerings via RESPONSIBLE_FACULTY_MIT_ID = MIT_ID, and to link
    employees to Moira mailing list membership via MIT_ID = MOIRA_LIST_MEMBER_MIT_ID.'
  columns:
    MIT_ID:
      desc: Unique institute person identifier; joins to RESPONSIBLE_FACULTY_MIT_ID
        in subject offering tables and to MOIRA_LIST_DETAIL.MOIRA_LIST_MEMBER_MIT_ID
    LAST_NAME:
      desc: Legal last name; used for partitioning faculty window statistics by name
    FIRST_NAME:
      desc: Legal first name
    MIDDLE_NAME:
      desc: Legal middle name
    FULL_NAME:
      desc: Full name in 'Last, First' format, e.g. 'Austin, Sasha'
    DIRECTORY_FULL_NAME:
      desc: Full name as published in the directory
    OFFICE_LOCATION:
      desc: Building-room office location of the employee, e.g. '76-582'; same identifier
        format as FCLT_ROOMS.BUILDING_ROOM, so it joins to the facilities room inventory
        to attach room attributes (floor, area, major use, organization) to employees
    OFFICE_PHONE:
      desc: Office phone number stored as a numeric value; used in phone-based window
        averages
    DIRECTORY_TITLE:
      desc: Job title published in the directory
    PRIMARY_TITLE:
      desc: Primary job title of the employee
    DEPARTMENT_NUMBER:
      desc: HR department number, e.g. '402000'; finer-grained than academic department
        codes
    DEPARTMENT_NAME:
      desc: HR department/organizational unit name, e.g. 'Lincoln Laboratory'; not
        the academic department dimension
    KRB_NAME:
      desc: Kerberos account name; joins to MOIRA_LIST_DETAIL.MOIRA_LIST_MEMBER to
        match mailing-list memberships by login name
    KRB_NAME_UPPERCASE:
      desc: Uppercase Kerberos account name
    EMAIL_ADDRESS:
      desc: Email address of the employee
    PERSONAL_URL:
      desc: Personal web page URL
    NAME_KNOWN_BY:
      desc: Name the person is commonly known by
    EMAIL_ADDRESS_UPPERCASE:
      desc: Uppercase email address
    FULL_NAME_UPPERCASE:
      desc: Uppercase full name
    PREFERRED_FIRST_NAME_UPPER:
      desc: Uppercase preferred first name
    PREFERRED_LAST_NAME_UPPER:
      desc: Uppercase preferred last name
    PREFERRED_FIRST_NAME:
      desc: Preferred first name
    PREFERRED_MIDDLE_NAME:
      desc: Preferred middle name
    PREFERRED_LAST_NAME:
      desc: Preferred last name
    WAREHOUSE_LOAD_DATE:
