  - source_column: FCLT_ORGANIZATION_KEY
    target_column: FCLT_ORGANIZATION_KEY
  - source_column: FCLT_MINOR_ORGANIZATION_KEY
    target_column: FCLT_ORGANIZATION_KEY
- id: join_spacedetail_spaceunit2
  source_entity_type: table
  source_entity_id: SPACE_DETAIL
  target_entity_type: table
  target_entity_id: SPACE_UNIT2
  relation_type: joins
  desc: SPACE_DETAIL joins SPACE_UNIT2 on SPACE_UNIT_KEY to obtain space unit name/code
    from the alternative space unit lookup that lacks organization attribution.
  columns:
  - source_column: SPACE_UNIT_KEY
    target_column: SPACE_UNIT_KEY
