- id: join_atp_ata
  source_entity_type: table
  source_entity_id: ACADEMIC_TERM_PARAMETER
  target_entity_type: table
  target_entity_id: ACADEMIC_TERMS_ALL
  relation_type: joins
  desc: ACADEMIC_TERM_PARAMETER joins ACADEMIC_TERMS_ALL on TERM_CODE to resolve current/previous/upcoming
    term parameters against the extended term list (academic year description, financial
    aid year, degree year).
  columns:
  - source_column: TERM_CODE
