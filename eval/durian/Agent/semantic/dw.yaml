    ADMIN_POSITION_TITLE:
      desc: Administrative position title
    PAYROLL_RANK:
      desc: Payroll rank
    IS_FACULTY:
      desc: Flag whether the person is faculty
    EMPLOYMENT_PERCENT:
      desc: Employment percentage
    IS_CONSULT_PRIV:
      desc: Privacy consultation flag
    IS_PAID_APPT:
      desc: Flag whether the person has a paid appointment
    IS_SUMMER_SESSION_APPT:
      desc: Flag whether the person has a summer session appointment
    SUMMER_SESSION_MONTHS:
      desc: Number of summer session months
    IS_SABBATICAL:
      desc: Flag whether the person is on sabbatical
    SABBATICAL_BEGIN_DATE:
      desc: Sabbatical begin date
    SABBATICAL_END_DATE:
      desc: Sabbatical end date
    IS_OPA_REQUIRED:
