- id: FCLT_ROOMS
  name: FCLT_ROOMS
  desc: 'Facilities room inventory table: one row per physical room with building/floor
    keys, room identifiers, use classifications (major/minor use), organization assignment,
    area in square meters, access level, and geographic coordinates. Joins to FCLT_BUILDING
    via FCLT_BUILDING_KEY; referenced by COURSE_CATALOG_SUBJECT_OFFERED.MEET_PLACE
    via FCLT_ROOM_KEY.'
  columns:
    FCLT_ROOM_KEY:
      desc: Surrogate key of the room; joins to COURSE_CATALOG_SUBJECT_OFFERED.MEET_PLACE
        for class-meeting location analysis
    BUILDING_ROOM:
      desc: Combined building-room identifier
    FCLT_BUILDING_KEY:
      desc: Building identifier key of the room, storing the building number/code
        itself (e.g. 'E38', '14N'); can be filtered directly for a building or joined
        to FCLT_BUILDING.FCLT_BUILDING_KEY for building attributes
    FLOOR:
      desc: Floor the room is on
    FCLT_FLOOR_KEY:
      desc: Foreign key to FCLT_FLOOR
    ROOM:
      desc: Room number/name
    SPACE_ID:
      desc: Space identifier
    FCLT_MAJOR_USE_KEY:
      desc: Major use key of the room; joins to FCLT_MAJOR_USE.FCLT_MAJOR_USE_KEY
        to decode the major use code/description and assignable flag
    MAJOR_USE_DESC:
      desc: Major use description, e.g. classroom
    FCLT_USE_KEY:
      desc: ''
    USE_DESC:
      desc: Use description of the room
    FCLT_MINOR_USE_KEY:
      desc: Minor use key of the room
    MINOR_USE_DESC:
      desc: Minor use description
    FCLT_ORGANIZATION_KEY:
      desc: Organization key of the room
    ORGANIZATION_NAME:
      desc: Organization name occupying the room
    FCLT_MINOR_ORGANIZATION_KEY:
      desc: Minor organization key of the room
    MINOR_ORGANIZATION:
      desc: Minor organization name
    AREA:
      desc: Room area in square meters; used in area statistics (average, range, variance)
    ROOM_FULL_NAME:
      desc: Full room name
    DEPT_CODE:
      desc: Department code assigned to the room
    ACCESS_LEVEL:
      desc: Numeric access level code of the room (observed values 0-3); used to filter
        rooms by access restriction level, e.g. ACCESS_LEVEL = 1
    LATITUDE_WGS:
      desc: Latitude (WGS)
    LONGITUDE_WGS:
      desc: Longitude (WGS)
    NORTHING_SPCS:
      desc: Northing coordinate (SPCS)
    EASTING_SPCS:
      desc: Easting coordinate (SPCS)
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per room
- id: FCLT_ROOMS_HIST
  name: FCLT_ROOMS_HIST
  desc: 'Historical facilities room table: one row per room per fiscal period (FISCAL_PERIOD
    in YYYYMM format; current data covers period 201505), preserving each room''s
    identifiers, floor, use classifications, organization assignment, area, access
    level, and coordinates over time. Fiscal-period counterpart of FCLT_ROOMS; joins
    to current room records via FCLT_ROOM_KEY and to buildings via FCLT_BUILDING_KEY.'
  columns:
    FCLT_ROOM_HIST_KEY:
      desc: Surrogate key of the historical room record, formatted '<room key>-<fiscal
        period>'
    FISCAL_PERIOD:
      desc: Fiscal period of the room snapshot in YYYYMM format
    FCLT_ROOM_KEY:
      desc: Key of the corresponding current room record; joins to FCLT_ROOMS.FCLT_ROOM_KEY
    BUILDING_ROOM:
      desc: Combined building-room identifier at the fiscal period, e.g. '1-108'
    FCLT_BUILDING_KEY:
      desc: Building identifier key of the room at the fiscal period; joins to FCLT_BUILDING.FCLT_BUILDING_KEY
    FLOOR:
      desc: Floor the room is on at the fiscal period
    FCLT_FLOOR_KEY:
      desc: Floor key at the fiscal period; joins to FCLT_FLOOR.FCLT_FLOOR_KEY
    ROOM:
      desc: Room number/name at the fiscal period
    SPACE_ID:
      desc: Space identifier at the fiscal period
    FCLT_MAJOR_USE_KEY:
      desc: Major use key at the fiscal period; joins to FCLT_MAJOR_USE_HIST for period-specific
        classification
    MAJOR_USE_DESC:
      desc: Major use description at the fiscal period, e.g. 'OFFICES'
    FCLT_USE_KEY:
      desc: Use key at the fiscal period
    USE_DESC:
      desc: Use description at the fiscal period
    FCLT_MINOR_USE_KEY:
      desc: Minor use key at the fiscal period
    MINOR_USE_DESC:
      desc: Minor use description at the fiscal period
    FCLT_ORGANIZATION_KEY:
      desc: Occupying organization key at the fiscal period; joins to FCLT_ORGANIZATION.FCLT_ORGANIZATION_KEY
    ORGANIZATION_NAME:
      desc: Occupying organization name/abbreviation at the fiscal period
    FCLT_MINOR_ORGANIZATION_KEY:
      desc: Secondary organization key at the fiscal period
    MINOR_ORGANIZATION:
      desc: Secondary organization name at the fiscal period
    AREA:
      desc: Room area in square meters at the fiscal period
    ROOM_FULL_NAME:
      desc: Full room name at the fiscal period
    DEPT_CODE:
      desc: Department code assigned to the room at the fiscal period
    ACCESS_LEVEL:
      desc: Numeric access level of the room at the fiscal period
    LATITUDE_WGS:
      desc: Latitude (WGS) at the fiscal period
    LONGITUDE_WGS:
      desc: Longitude (WGS) at the fiscal period
    NORTHING_SPCS:
      desc: Northing coordinate (SPCS) at the fiscal period
    EASTING_SPCS:
      desc: Easting coordinate (SPCS) at the fiscal period
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per room per fiscal period
