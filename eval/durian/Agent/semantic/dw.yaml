  name: SE_PERSON
  desc: Person master table keyed by MIT_ID with Kerberos name, full name, payroll
    rank, position title, active flag, office location, organization, name components,
    and employee type. A general-purpose person dimension covering employees with
    payroll/position attributes; narrower contact information than EMPLOYEE_DIRECTORY
