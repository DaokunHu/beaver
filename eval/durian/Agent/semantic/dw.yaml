- id: TIME_MONTH
  name: TIME_MONTH
  desc: 'Month-level (fiscal period) time dimension table: one row per fiscal period
    in YYYYMM format, mapping each month to its fiscal year/quarter, calendar year/period/month,
    academic year and academic term, and financial aid year, with period start/end
    dates and current/previous/closing period flags. Covers fiscal years 1996-2035
    (640 periods). Joins to TIME_DAY via FISCAL_PERIOD for day-level detail, to TIME_QUARTER
    via FY_QUARTER_CODE for quarter attributes, and to ACADEMIC_TERMS/ACADEMIC_TERMS_ALL
    via ACADEMIC_TERM = TERM_CODE for term attributes; used for fiscal-period grouping
    and month-level calendar statistics.'
  columns:
    IS_CLOSING_PERIOD:
      desc: '''Y''/''N'' flag whether the period is a fiscal closing period; ''Y''
        for periods 13-16 of each fiscal year, whose calendar month repeats June (month
        6).'
    FISCAL_PERIOD_SELECTOR:
      desc: Fiscal period selector label in 'YYYYMM -- Month YYYY' format used for
        picklists
    IS_CURRENT_FISCAL_YEAR:
      desc: '''Y''/''N'' flag whether the period belongs to the current fiscal year'
    TIME_MONTH_KEY:
      desc: Surrogate key of the month record; holds the same YYYYMM value as FISCAL_PERIOD
    FISCAL_PERIOD:
      desc: 'Fiscal period code in YYYYMM format (e.g. ''199602''). Each fiscal year
        holds 16 periods: periods 01-12 are the regular fiscal months (period 1 =
        July, since the fiscal year starts in July) and periods 13-16 are the fiscal
        closing periods, all of which carry calendar month June. Joins to TIME_DAY.FISCAL_PERIOD
        to link a month with its days.'
    FISCAL_PERIOD_DESCRIPTION:
      desc: Fiscal period description, e.g. 'FY 1996 Period 2' for regular periods
        and 'FY 2026 closing period 1' for closing periods 13-16.
    FISCAL_YEAR:
      desc: Fiscal year the period belongs to, e.g. 1996; used for fiscal-year grouping
        of month statistics
    FISCAL_YEAR_QUARTER:
      desc: Fiscal year quarter description, e.g. 'FY 1996 Quarter 1'
    FY_QUARTER_CODE:
      desc: Fiscal quarter code, e.g. 'FY1996Q1'; joins to TIME_QUARTER.FY_QUARTER_CODE
        for quarter-level attributes
    CALENDAR_PERIOD:
      desc: Calendar period code in YYYYMM format of the natural calendar month
    CALENDAR_PERIOD_DESCRIPTION:
      desc: Calendar period description, e.g. 'August 1995'
    CALENDAR_YEAR:
      desc: Calendar year of the month; used in calendar-year sum/min statistics
    START_DATE:
      desc: First day of the month in DD-MON-YY format
    END_DATE:
      desc: Last day of the month in DD-MON-YY format
    CALENDAR_MONTH:
      desc: Calendar month number (1-12) of the natural calendar month the fiscal
        period maps to; regular periods 1-12 run July(7) through June(6), and the
        four closing periods 13-16 all repeat June(6), so a fiscal year contains 16
        rows but only 12 distinct calendar month numbers.
    CALENDAR_MONTH_NAME:
      desc: Calendar month name, e.g. 'August'; the closing periods 13-16 all carry
        'June'.
    IS_CURRENT_FISCAL_PERIOD:
      desc: '''Y''/''N'' flag whether the period is the current fiscal period'
    IS_PREVIOUS_FISCAL_PERIOD:
      desc: '''Y''/''N'' flag whether the period is the previous fiscal period'
    ACADEMIC_YEAR:
      desc: Academic year the month maps to
    ACADEMIC_TERM:
      desc: Academic term code in YYYYTT format the month maps to; joins to ACADEMIC_TERMS/ACADEMIC_TERMS_ALL
        TERM_CODE
    ACADEMIC_TERM_DESCRIPTION:
      desc: Description of the academic term the month maps to, e.g. 'Summer Term
        1995'
    FINANCIAL_AID_YEAR:
      desc: Financial aid year the month maps to
    FINANCIAL_AID_YEAR_DESC:
      desc: Financial aid year description, e.g. 'Aid Year 1995-96'
    default_granularity: one row per fiscal period (month)
  reason: TIME_MONTH was an orphan table entity with an empty description and empty
    column descriptions; cases dw_2735 and dw_3131 use it for fiscal-period/calendar-month
    statistics joined with TIME_DAY, so its business semantics and column meanings
    must be documented from the global data-warehouse perspective.
- id: TIME_QUARTER
  name: TIME_QUARTER
  desc: 'Quarter-level time dimension table: one row per fiscal quarter (FY_QUARTER_CODE
    such as ''FY2014Q1'') covering fiscal years 2000-2035 (144 quarters), with fiscal
    and calendar quarter codes/names, fiscal and calendar years, quarter start/end
    dates, the quarter''s start/end fiscal periods, payroll certification open/expected/due
    dates, current/next/previous/past/future quarter flags, and a payroll certification
    schedule key. Joins to TIME_MONTH via FY_QUARTER_CODE to roll months up to quarters;
    used for fiscal-quarter scheduling and certification-deadline reporting.'
  columns:
    FISCAL_YEAR:
      desc: Fiscal year the quarter belongs to, e.g. 2014
    FY_QUARTER_CODE:
      desc: Fiscal quarter code, e.g. 'FY2014Q1'; joins to TIME_MONTH.FY_QUARTER_CODE
    FY_QUARTER_NAME:
      desc: Fiscal quarter name, e.g. 'FY 2014 Quarter 1'
    CY_QUARTER_CODE:
      desc: Calendar quarter code, e.g. 'CY2013Q3'
    CY_QUARTER_NAME:
      desc: Calendar quarter name, e.g. 'CY 2013 Quarter 3'
    CALENDAR_YEAR:
      desc: Calendar year the quarter's start belongs to
    QUARTER_START_DATE:
      desc: First day of the fiscal quarter in DD-MON-YY format
    QUARTER_END_DATE:
      desc: Last day of the fiscal quarter in DD-MON-YY format
    QUARTER_START_FP:
      desc: Fiscal period (YYYYMM) of the quarter's first month
    QUARTER_END_FP:
      desc: Fiscal period (YYYYMM) of the quarter's last month
    QUARTER_CERT_OPEN:
      desc: Date the quarter's payroll certification opens
    QUARTER_CERT_EXPECTED:
      desc: Date the quarter's payroll certification is expected
    QUARTER_CERT_DUE:
      desc: Due date of the quarter's payroll certification
    IS_CURRENT_QUARTER:
      desc: '''Y''/''N'' flag whether the quarter is the current quarter'
    IS_NEXT_QUARTER:
      desc: '''Y''/''N'' flag whether the quarter is the next quarter'
    IS_PREVIOUS_QUARTER:
      desc: '''Y''/''N'' flag whether the quarter is the previous quarter'
    IS_PAST_QUARTER:
      desc: '''Y''/''N'' flag whether the quarter is in the past'
    IS_FUTURE_QUARTER:
      desc: '''Y''/''N'' flag whether the quarter is in the future'
    PAYROLL_EDACCA_CERT_SCHED_KEY:
      desc: Payroll EDACCA certification schedule key of the quarter
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
    default_granularity: one row per fiscal quarter
  reason: TIME_QUARTER was an orphan table entity with an empty description and no
    column descriptions; documenting it completes the TIME_DAY/TIME_MONTH/TIME_QUARTER
    time dimension family and enables the FY_QUARTER_CODE join with TIME_MONTH used
    in fiscal calendar analysis.
- id: TIP_DETAIL
  name: TIP_DETAIL
  desc: 'Textbook Information Program (TIP) detail table linking subjects offered
    in a term to their course textbook materials: material key, material status (e.g.
    ''RQ'' Required, ''EO'' Electronic options), ISBN, and record count. Used to determine
    whether subjects have required textbooks and to count course materials per status.'
  columns:
    TIP_SUBJECT_OFFERED_KEY:
      desc: Foreign key to TIP_SUBJECT_OFFERED.TIP_SUBJECT_OFFERED_KEY
    TIP_MATERIAL_KEY:
      desc: Foreign key to TIP_MATERIAL.TIP_MATERIAL_KEY identifying the specific
        textbook material
    TIP_MATERIAL_STATUS_KEY:
      desc: Material status key; joins to TIP_MATERIAL_STATUS.TIP_MATERIAL_STATUS_KEY
        for decoding. Value domain includes 'RQ' = Required, 'EO' = Electronic options,
        'RC' = Recommended, 'PC' = Val-u option, 'BR' = Bookstore recommends, 'CL'
        = Go to class first, 'NM' = Course has no materials, 'U' = Unknown, and 'NL'/'NS'/'NB'/blank
        keys with no description. Distinct from LIBRARY_RESERVE_MATRL_DETAIL.LIBRARY_MATERIAL_STATUS_KEY,
        which belongs to the library reserve domain.
    TERM_CODE:
      desc: Term code in YYYYTT format; joins to ACADEMIC_TERMS/ACADEMIC_TERMS_ALL
    SUBJECT_ID:
      desc: Subject identifier, e.g. '18.01'; joins to TIP_SUBJECT_OFFERED.SUBJECT_ID,
        LIBRARY_SUBJECT_OFFERED.SUBJECT_ID, SUBJECT_SUMMARY.SUBJECT_ID
    ISBN:
      desc: ISBN of the textbook material associated with the subject offering
    RECORD_COUNT:
      desc: Number of material records for this subject/material combination; used
        in material-count statistics
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per subject-material-status combination per term
  entity:
    columns:
      TIP_MATERIAL_STATUS_KEY:
        desc: Material status key; joins to TIP_MATERIAL_STATUS.TIP_MATERIAL_STATUS_KEY
          for decoding. Value domain includes 'RQ' = Required, 'EO' = Electronic options,
          'RC' = Recommended, 'PC' = Val-u option, 'BR' = Bookstore recommends, 'CL'
          = Go to class first, 'NM' = Course has no materials, 'U' = Unknown, and
          'NL'/'NS'/'NB' = None variants. Distinct from LIBRARY_RESERVE_MATRL_DETAIL.LIBRARY_MATERIAL_STATUS_KEY,
          which belongs to the library reserve domain.
  reason: Data verification of TIP_MATERIAL_STATUS shows 12 status values beyond the
    previously documented 'RQ'/'EO'; enriching the description supports material-status
    grouping questions such as case dw_2989 (per material status and publisher statistics).
- id: TIP_MATERIAL
  name: TIP_MATERIAL
  desc: 'TIP material dimension table describing textbook materials: title, author,
    edition, publisher, year, ISBN, new/used shelf prices and rental prices, and information
    source. Referenced by TIP_DETAIL via TIP_MATERIAL_KEY.'
  columns:
    TIP_MATERIAL_KEY:
      desc: Surrogate key of the TIP material; joins to TIP_DETAIL.TIP_MATERIAL_KEY
    ISBN:
      desc: ISBN of the material; joins to TIP_DETAIL.ISBN
    TITLE:
      desc: Title of the material
    AUTHOR:
      desc: Author of the material
    EDITION:
      desc: Edition of the material
    PUBLISHER:
      desc: Publisher of the material
    YEAR:
      desc: Publication year of the material
    NEW_SHELF_PRICE:
      desc: New shelf price of the material
    USED_SHELF_PRICE:
      desc: Used shelf price of the material
    RENTAL_NEW_PRICE:
      desc: Rental price for a new copy
    RENTAL_USED_PRICE:
      desc: Rental price for a used copy
    MATERIAL_INFO_SOURCE:
      desc: Source of the material information
  default_granularity: one row per textbook material
  entity:
    columns:
      MATERIAL_INFO_SOURCE:
        desc: 'Source system/channel from which the material bibliographic information
          was obtained. Known values: ''ISBN'' (ISBN-sourced record), ''COOP'' (university
          cooperative/bookstore-sourced record), ''OTI'' (other information source).
          Used to filter or group materials by their information provenance.'
  reason: Data verification shows MATERIAL_INFO_SOURCE has three concrete values (ISBN,
    COOP, OTI); enriching the column description beyond the generic 'Source of the
    material information' supports filtering/grouping questions such as those by material
    information source.
- id: TIP_MATERIAL_STATUS
  name: TIP_MATERIAL_STATUS
  desc: 'TIP material status lookup table decoding material status keys/codes used
    in TIP_DETAIL. Holds 12 status rows where key and code are identical: ''RQ'' =
    Required, ''EO'' = Electronic options, ''RC'' = Recommended, ''PC'' = Val-u option,
    ''BR'' = Bookstore recommends, ''CL'' = Go to class first, ''NM'' = Course has
    no materials, ''U'' = Unknown, and four keys (''NL'', ''NS'', ''NB'', and a blank/space
    key) that share a NULL description.'
  columns:
    TIP_MATERIAL_STATUS_KEY:
      desc: Surrogate key of the material status; joins to TIP_DETAIL.TIP_MATERIAL_STATUS_KEY
    TIP_MATERIAL_STATUS_CODE:
      desc: 'Material status code, identical in value to TIP_MATERIAL_STATUS_KEY:
        ''RQ'' = Required, ''EO'' = Electronic options, ''RC'' = Recommended, ''PC''
        = Val-u option, ''BR'' = Bookstore recommends, ''CL'' = Go to class first,
        ''NM'' = Course has no materials, ''U'' = Unknown, plus NULL-description keys
        ''NL'', ''NS'', ''NB'' and a blank key.'
    TIP_MATERIAL_STATUS:
      desc: Material status description text. NULL for four of the twelve keys ('NL',
        'NS', 'NB', blank), so grouping by this column merges those keys into one
        NULL group and yields fewer distinct statuses than grouping by key.
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per material status
- id: TIP_SUBJECT_OFFERED
  name: TIP_SUBJECT_OFFERED
  desc: 'Textbook Information Program (TIP) subject offered table: one row per subject
    offered in a term within the textbook program scope, with subject identity, offering
    department/school, responsible faculty, enrollment count, and a flag indicating
    whether the subject has no course material. Parent of TIP_DETAIL via TIP_SUBJECT_OFFERED_KEY.'
  columns:
    TIP_SUBJECT_OFFERED_KEY:
      desc: Surrogate key of the TIP subject offered record; joins to TIP_DETAIL.TIP_SUBJECT_OFFERED_KEY
    TERM_CODE:
      desc: Term code in YYYYTT format; joins to ACADEMIC_TERMS/ACADEMIC_TERMS_ALL
    IS_NO_COURSE_MATERIAL:
      desc: '''Y''/''N'' flag whether the subject has no course material; ''N'' means
        the subject has course materials'
    MASTER_COURSE_NUMBER:
      desc: Course number of the master subject
    MASTER_COURSE_NUMBER_SORT:
      desc: Sortable form of the master course number
    MASTER_COURSE_NUMBER_DESC:
      desc: Description of the master course number
    MASTER_SUBJECT_ID:
      desc: Master subject identifier for clustered subjects
    MASTER_SUBJECT_ID_SORT:
      desc: Sortable form of the master subject identifier
    COURSE_NUMBER:
      desc: Course number of the subject
    COURSE_NUMBER_SORT:
      desc: Sortable form of the course number
    COURSE_NUMBER_DESC:
      desc: Course number description
    SUBJECT_ID:
      desc: Subject identifier, e.g. '5.01'; joins to TIP_DETAIL.SUBJECT_ID
    SUBJECT_ID_SORT:
      desc: Sortable form of the subject identifier
    SUBJECT_TITLE:
      desc: Subject title
    OFFER_DEPT_CODE:
      desc: Offering department code; joins to SIS_DEPARTMENT.DEPARTMENT_CODE and
        STUDENT_DEPARTMENT.DEPARTMENT_CODE
    OFFER_DEPT_NAME:
      desc: Offering department name, e.g. 'Chemistry', 'Mathematics'
    OFFER_SCHOOL_NAME:
      desc: Offering school name
    RESPONSIBLE_FACULTY_NAME:
      desc: Name of the faculty member responsible for the subject
    RESPONSIBLE_FACULTY_MIT_ID:
      desc: MIT ID of the responsible faculty member
    NUM_ENROLLED_STUDENTS:
      desc: Number of students enrolled in the subject; used for enrollment-based
        rankings and window statistics
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per subject per term in the textbook program
- id: TOP_LEVEL_DOMAIN
  name: TOP_LEVEL_DOMAIN
  desc: 4 columns in total
  columns:
    TOP_LEVEL_DOMAIN_KEY:
      desc: ''
    TOP_LEVEL_DOMAIN:
      desc: ''
    TOP_LEVEL_DOMAIN_DESCRIPTION:
      desc: ''
    WAREHOUSE_LOAD_DATE:
      desc: ''
- id: WAREHOUSE_USERS
  name: WAREHOUSE_USERS
