    SUPERVISOR_ATTRIBUTE:
      desc: Supervisor attribute code
    SUPERVISOR_ATTRIBUTE_DESC:
      desc: Supervisor attribute description
    PREREQUISITES:
      desc: Prerequisite text for the subject
    SUBJECT_DESCRIPTION:
      desc: Full catalog description text of the subject
    JOINT_SUBJECTS:
      desc: List of joint subjects
    SCHOOL_WIDE_ELECTIVES:
      desc: School-wide elective attribute
    MEETS_WITH_SUBJECTS:
      desc: Subjects this one meets with
