- id: ZPM_ROOMS_LOAD
  name: ZPM_ROOMS_LOAD
  desc: 'Space-planning room load table: one row per room record from the space planning
    feed, with the building-room identifier, building component, floor (numeric or
    label such as ''G9''), space usage text (e.g. ''DSGN STUDIO'', ''CONF RM''), space
    unit code, HR organization unit id, and room access level. Links rooms to SPACE_UNIT
    via SPACE_UNIT_CODE and to FCLT_ORGANIZATION/HR_ORG_UNIT via HR_ORG_UNIT_ID; used
    for floor/access-level/space-usage room analysis from the space-planning perspective,
    without the area and use-key columns carried by FCLT_ROOMS.'
  columns:
    BUILDING_ROOM:
      desc: Combined building-room identifier, e.g. '1-073'; same identifier convention
        as FCLT_ROOMS.BUILDING_ROOM and SPACE_DETAIL.BUILDING_ROOM
    BUILDING_COMPONENT:
      desc: Building component identifier (the building part the room belongs to),
        used for ordering rooms within buildings
    FLOOR:
      desc: Floor of the room; stored as text, mostly numeric floor numbers but also
        labels such as 'G9'; filter with FLOOR = 2 for second-floor rooms
    SPACE_USAGE:
      desc: Space usage text classification of the room, e.g. 'DSGN STUDIO', 'CONF
        RM', 'DINING RM'; a free-text counterpart of the coded SPACE_USAGE_KEY in
        SPACE_DETAIL
    SPACE_UNIT_CODE:
      desc: Business code of the space unit the room is assigned to; joins to SPACE_UNIT.SPACE_UNIT_CODE
    HR_ORG_UNIT_ID:
      desc: HR organization unit identifier of the unit occupying the room; joins
        to FCLT_ORGANIZATION.HR_ORG_UNIT_ID and HR_ORG_UNIT.HR_ORG_UNIT_ID
    ACCESS_LEVEL:
      desc: Numeric access restriction level of the room (observed values 0-3); ACCESS_LEVEL
        = 1 selects the least-restricted rooms
    default_granularity: one row per room record in the space-planning load
  default_granularity: one row per room record in the space-planning load
relationships:
- id: join_ata_at_term_code
  source_entity_type: table
  source_entity_id: ACADEMIC_TERMS_ALL
  target_entity_type: table
  target_entity_id: ACADEMIC_TERMS
  relation_type: joins
  desc: ACADEMIC_TERMS_ALL joins ACADEMIC_TERMS on TERM_CODE (or ACADEMIC_TERMS_KEY)
    to combine the extended term list with term status attributes such as IS_REGULAR_TERM
    and TERM_STATUS that only exist in ACADEMIC_TERMS.
  columns:
  - source_column: TERM_CODE
    target_column: TERM_CODE
  - source_column: ACADEMIC_TERMS_KEY
    target_column: ACADEMIC_TERMS_KEY
- id: join_atp_at_term_code
  source_entity_type: table
  source_entity_id: ACADEMIC_TERM_PARAMETER
  target_entity_type: table
  target_entity_id: ACADEMIC_TERMS
  relation_type: joins
  desc: ACADEMIC_TERM_PARAMETER joins ACADEMIC_TERMS on TERM_CODE to resolve current/previous/upcoming
    term parameters to full term attributes (academic year, dates, status).
  columns:
  - source_column: TERM_CODE
    target_column: TERM_CODE
- id: join_timeday_at_calendar_date
  source_entity_type: table
  source_entity_id: TIME_DAY
  target_entity_type: table
  target_entity_id: ACADEMIC_TERMS
  relation_type: joins
  desc: TIME_DAY joins ACADEMIC_TERMS on CALENDAR_DATE = TERM_START_DATE to attach
    day-of-week and calendar-year attributes to term start dates; TIME_DAY.ACADEMIC_TERM_CODE
    also matches ACADEMIC_TERMS.TERM_CODE for term-day mapping.
  columns:
  - source_column: CALENDAR_DATE
    target_column: TERM_START_DATE
  - source_column: ACADEMIC_TERM_CODE
    target_column: TERM_CODE
- id: join_ccso_at_term
  source_entity_type: table
  source_entity_id: COURSE_CATALOG_SUBJECT_OFFERED
  target_entity_type: table
  target_entity_id: ACADEMIC_TERMS
  relation_type: joins
  desc: COURSE_CATALOG_SUBJECT_OFFERED joins ACADEMIC_TERMS on TERM_CODE (offering
    term) or on EFFECTIVE_TERM_CODE (term from which catalog attributes take effect)
    to filter by term status, regular term, academic year, and to obtain term descriptions/dates.
  columns:
  - source_column: TERM_CODE
    target_column: TERM_CODE
  - source_column: EFFECTIVE_TERM_CODE
    target_column: TERM_CODE
- id: join_ccso_ata_term
  source_entity_type: table
  source_entity_id: COURSE_CATALOG_SUBJECT_OFFERED
  target_entity_type: table
  target_entity_id: ACADEMIC_TERMS_ALL
  relation_type: joins
  desc: COURSE_CATALOG_SUBJECT_OFFERED joins ACADEMIC_TERMS_ALL on TERM_CODE to attach
    extended term attributes (term description, academic year, financial aid year)
    to catalog subject offerings.
  columns:
  - source_column: TERM_CODE
    target_column: TERM_CODE
- id: join_ss_at_term
  source_entity_type: table
  source_entity_id: SUBJECT_SUMMARY
  target_entity_type: table
  target_entity_id: ACADEMIC_TERMS
  relation_type: joins
  desc: SUBJECT_SUMMARY joins ACADEMIC_TERMS on TERM_CODE to filter subject summaries
    by term status/regular term and to obtain academic year and term descriptions.
  columns:
  - source_column: TERM_CODE
    target_column: TERM_CODE
- id: join_ss_ata_term
  source_entity_type: table
  source_entity_id: SUBJECT_SUMMARY
  target_entity_type: table
  target_entity_id: ACADEMIC_TERMS_ALL
  relation_type: joins
  desc: SUBJECT_SUMMARY joins ACADEMIC_TERMS_ALL on TERM_CODE to attach extended term
    attributes (academic year, financial aid year, term description) to subject summaries.
  columns:
  - source_column: TERM_CODE
    target_column: TERM_CODE
- id: join_so_at_term
  source_entity_type: table
  source_entity_id: SUBJECT_OFFERED
  target_entity_type: table
  target_entity_id: ACADEMIC_TERMS
  relation_type: joins
  desc: SUBJECT_OFFERED joins ACADEMIC_TERMS on TERM_CODE to filter section-level
    subject offerings by term status and academic year.
  columns:
  - source_column: TERM_CODE
    target_column: TERM_CODE
- id: join_so_ata_term
  source_entity_type: table
  source_entity_id: SUBJECT_OFFERED
  target_entity_type: table
  target_entity_id: ACADEMIC_TERMS_ALL
  relation_type: joins
  desc: SUBJECT_OFFERED joins ACADEMIC_TERMS_ALL on TERM_CODE to attach extended term
    attributes (academic year, term description) to section-level subject offerings.
  columns:
  - source_column: TERM_CODE
    target_column: TERM_CODE
- id: join_so_sos
  source_entity_type: table
  source_entity_id: SUBJECT_OFFERED
  target_entity_type: table
  target_entity_id: SUBJECT_OFFERED_SUMMARY
  relation_type: joins
  desc: SUBJECT_OFFERED (section level) joins SUBJECT_OFFERED_SUMMARY (subject level)
    on SUBJECT_OFFERED_SUMMARY_KEY, COMPOSITE_SUBJECT_KEY, TERM_CODE, SUBJECT_ID,
    or SUBJECT_ID_SORT to roll sections up to their subject summary attributes such
    as total units and cluster type; it can also join on RESPONSIBLE_FACULTY_MIT_ID
    to associate sections with all subject-level offerings sharing the same responsible
    faculty.
  columns:
  - source_column: SUBJECT_OFFERED_SUMMARY_KEY
    target_column: SUBJECT_OFFERED_SUMMARY_KEY
  - source_column: COMPOSITE_SUBJECT_KEY
    target_column: COMPOSITE_SUBJECT_KEY
  - source_column: TERM_CODE
    target_column: TERM_CODE
  - source_column: SUBJECT_ID
    target_column: SUBJECT_ID
  - source_column: SUBJECT_ID_SORT
    target_column: SUBJECT_ID_SORT
  - source_column: RESPONSIBLE_FACULTY_MIT_ID
    target_column: RESPONSIBLE_FACULTY_MIT_ID
- id: join_sos_at_term
  source_entity_type: table
  source_entity_id: SUBJECT_OFFERED_SUMMARY
  target_entity_type: table
  target_entity_id: ACADEMIC_TERMS
  relation_type: joins
  desc: SUBJECT_OFFERED_SUMMARY joins ACADEMIC_TERMS on TERM_CODE to filter subject-level
    offerings by term status/regular term and academic year.
  columns:
  - source_column: TERM_CODE
    target_column: TERM_CODE
- id: join_ss_ccso
  source_entity_type: table
  source_entity_id: SUBJECT_SUMMARY
  target_entity_type: table
  target_entity_id: COURSE_CATALOG_SUBJECT_OFFERED
  relation_type: joins
  desc: SUBJECT_SUMMARY joins COURSE_CATALOG_SUBJECT_OFFERED on TERM_CODE and/or SUBJECT_ID
    and/or DEPARTMENT_NAME to combine enrollment statistics with catalog attributes
    (units, HGN level, offering flags).
  columns:
  - source_column: TERM_CODE
    target_column: TERM_CODE
  - source_column: SUBJECT_ID
    target_column: SUBJECT_ID
  - source_column: DEPARTMENT_NAME
    target_column: DEPARTMENT_NAME
- id: join_td_ata_term
  source_entity_type: table
  source_entity_id: TIP_DETAIL
  target_entity_type: table
  target_entity_id: ACADEMIC_TERMS_ALL
  relation_type: joins
  desc: TIP_DETAIL joins ACADEMIC_TERMS_ALL on TERM_CODE to attach extended term attributes
    (academic year, financial aid year, term description) to textbook material records.
  columns:
  - source_column: TERM_CODE
    target_column: TERM_CODE
- id: join_td_tso
  source_entity_type: table
  source_entity_id: TIP_DETAIL
  target_entity_type: table
  target_entity_id: TIP_SUBJECT_OFFERED
  relation_type: joins
