- id: join_spaceunit_fcltorg
  source_entity_type: table
  source_entity_id: SPACE_UNIT
  target_entity_type: table
  target_entity_id: FCLT_ORGANIZATION
  relation_type: joins
  desc: SPACE_UNIT joins FCLT_ORGANIZATION on FCLT_ORGANIZATION_KEY to attribute each
    space unit to its owning organization (organization name, level, description,
    DLC); the alternative key pair DLC_KEY = DLC_KEY links a space unit to all organizations
    of the same DLC and is used when space units must be combined with organization/HR
    attributes at DLC level (both keys can fan out since multiple organizations may
    share a DLC_KEY).
  columns:
  - source_column: FCLT_ORGANIZATION_KEY
    target_column: FCLT_ORGANIZATION_KEY
  - source_column: DLC_KEY
    target_column: DLC_KEY
- id: join_spacedetail_spaceunit
  source_entity_type: table
  source_entity_id: SPACE_DETAIL
  target_entity_type: table
  target_entity_id: SPACE_UNIT
  relation_type: joins
  desc: SPACE_DETAIL joins SPACE_UNIT on SPACE_UNIT_KEY to attach space unit name/code
    and organization attribution to each assigned room; used to count rooms per space
    unit.
  columns:
  - source_column: SPACE_UNIT_KEY
    target_column: SPACE_UNIT_KEY
- id: join_spacedetail_fcltbuilding
  source_entity_type: table
  source_entity_id: SPACE_DETAIL
  target_entity_type: table
  target_entity_id: FCLT_BUILDING
  relation_type: joins
  desc: SPACE_DETAIL joins FCLT_BUILDING on BUILDING_KEY = FCLT_BUILDING_KEY to obtain
    building attributes (name, type, areas) for assigned rooms and to identify buildings
    with the most rooms per space unit.
