- id: SIS_ADMIN_DEPARTMENT
  name: SIS_ADMIN_DEPARTMENT
  desc: SIS administrative department table with administrative department code/name,
    phone area code and phone number, and clearing cost collector. Joins to SIS_DEPARTMENT
    via SIS_ADMIN_DEPARTMENT_CODE = DEPARTMENT_CODE for department contact information.
  columns:
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
    SIS_ADMIN_DEPARTMENT_CODE:
      desc: Administrative department code; joins to SIS_DEPARTMENT.DEPARTMENT_CODE
    SIS_ADMIN_DEPARTMENT_NAME:
      desc: Administrative department name
    DEPARTMENT_PHONE_AREA_CODE:
      desc: Area code of the department phone number
    DEPARTMENT_PHONE_NUMBER:
      desc: Phone number of the administrative department
    CLEARING_COST_COLLECTOR:
      desc: Clearing cost collector of the administrative department
    LAST_ACTIVITY_DATE:
      desc: Date of last activity on the record
  default_granularity: one row per administrative department
- id: SIS_COURSE_DESCRIPTION
  name: SIS_COURSE_DESCRIPTION
  desc: 'SIS course description table: catalog descriptions of courses with department
    and school attribution, course level (undergraduate/graduate), degree-granting
    flag, graduate level, CIP program code, and effective from/thru terms. Joins to
    SIS_SUBJECT_CODE via COURSE = SUBJECT_CODE/COURSE_NUMBER and to SIS_DEPARTMENT
    via DEPARTMENT = DEPARTMENT_CODE.'
  columns:
    SIS_COURSE_DESCRIPTION_KEY:
      desc: Surrogate key of the course description record
    COURSE:
      desc: Course/subject code, e.g. '18'; joins to SIS_SUBJECT_CODE.SUBJECT_CODE
        and COURSE_CATALOG_SUBJECT_OFFERED.SUBJECT_CODE
    COURSE_DESCRIPTION:
      desc: Short course description text; its character length is used in description-length
        statistics
    COURSE_DESCRIPTION_LONG:
      desc: Long-form course description text
    DEPARTMENT:
      desc: Department code offering the course; joins to SIS_DEPARTMENT.DEPARTMENT_CODE
    DEPARTMENT_NAME:
      desc: Department name offering the course
    DEPT_NAME_IN_COMMENCEMENT_BK:
      desc: Department name as printed in the commencement book
    SCHOOL_NAME:
      desc: School name offering the course, e.g. 'Engineering'
    SCHOOL_NAME_IN_COMMENCEMENT_BK:
      desc: School name as printed in the commencement book
    FROM_TERM:
      desc: First term the course description is effective from
    FROM_TERM_DESCRIPTION:
      desc: Description of the from-term
    THRU_TERM:
      desc: Last term the course description is effective through
    THRU_TERM_DESCRIPTION:
      desc: Description of the thru-term
    COURSE_OPTION:
      desc: Course option designation
    COURSE_LEVEL:
      desc: Course level code, e.g. 'U' = undergraduate, 'G' = graduate
    CIP_PROGRAM_CODE:
      desc: Six-digit CIP (Classification of Instructional Programs) program code
        of the course; joins to CIP.PROGRAM_CODE (current classification, one row
        per code) and CIP_WITH_VERSION.PROGRAM_CODE (all revision versions)
    IS_DEGREE_GRANTING:
      desc: '''Y''/''N'' flag whether the course counts toward a degree'
    DEFAULT_ULTIMATE_DEGREE:
      desc: Default ultimate degree awarded for the course
    GRADAUTE_LEVEL:
      desc: Legacy misspelled graduate level column (kept for compatibility)
    GRADUATE_LEVEL:
      desc: Graduate level designation of the course
    LAST_ACTIVITY_DATE:
      desc: Date of last activity on the record
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per course description
- id: SIS_DEPARTMENT
  name: SIS_DEPARTMENT
  desc: 'SIS department dimension table: academic departments with code, name, full
    name, school attribution (code and name), budget code, degree-granting flag, and
    commencement-book names. Joins to subject offering tables via department codes.'
  columns:
    DEPARTMENT_CODE:
      desc: Department code; joins to offering tables' DEPARTMENT_CODE/OFFER_DEPT_CODE
        and SIS_SUBJECT_CODE.DEPARTMENT_CODE
    DEPARTMENT_NAME:
      desc: Department name, e.g. 'Mathematics', 'Chemistry'
    DEPARTMENT_FULL_NAME:
      desc: Full official name of the department
    SCHOOL_CODE:
      desc: School code the department belongs to, e.g. 'E'
    SCHOOL_NAME:
      desc: School name the department belongs to, e.g. 'Engineering'; used for school-level
        filtering
    DEPT_BUDGET_CODE:
      desc: Budget code of the department; used for budget-based ordering/ranking
    IS_DEGREE_GRANTING:
      desc: '''Y''/''N'' flag whether the department is degree granting'
    DEPT_NAME_IN_COMMENCEMENT_BK:
      desc: Department name as printed in the commencement book
    SCHOOL_NAME_IN_COMMENCEMENT_BK:
      desc: School name as printed in the commencement book
    DEPARTMENT_NAME_HISTORY:
      desc: Historical names of the department
    DEPARTMENT_LAST_ACTIVITY_DATE:
      desc: Date of last activity on the department record
    DLC_KEY:
      desc: Degree-granting list/committee key
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per academic department
- id: SIS_LOOKUP
  name: SIS_LOOKUP
  desc: 4 columns in total
  columns:
    LOOKUP_TYPE:
      desc: ''
    CODE:
      desc: ''
    DESCRIPTION:
      desc: ''
    WAREHOUSE_LOAD_DATE:
      desc: ''
- id: SIS_SUBJECT_CODE
  name: SIS_SUBJECT_CODE
  desc: SIS subject code lookup table mapping subject codes and course numbers to
    their descriptions, departments, and schools. Used to resolve subject code descriptions
    and to link courses to departments via DEPARTMENT_CODE.
  columns:
    COURSE_NUMBER:
      desc: Course number; joins to SIS_COURSE_DESCRIPTION.COURSE
    SUBJECT_CODE:
      desc: Subject code, e.g. '18'; joins to SIS_COURSE_DESCRIPTION.COURSE and COURSE_CATALOG_SUBJECT_OFFERED.SUBJECT_CODE
    SUBJECT_CODE_DESC:
      desc: Description of the subject code, typically the department/program name
        for that code
    DEPARTMENT_CODE:
      desc: Department code; joins to SIS_DEPARTMENT.DEPARTMENT_CODE
    DEPARTMENT_NAME:
      desc: Department name
    SCHOOL_CODE:
      desc: School code, e.g. 'E' for Engineering; used for school-level filtering
    SCHOOL_NAME:
      desc: School name
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per subject code / course number
- id: SIS_TERM_ADDRESS_CATEGORY
  name: SIS_TERM_ADDRESS_CATEGORY
  desc: 8 columns in total
  columns:
    TERM_ADDRESS_CATEGORY_CODE:
