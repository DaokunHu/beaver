  source_entity_type: table
  source_entity_id: FAC_ROOMS
  target_entity_type: table
  target_entity_id: FAC_BUILDING
  relation_type: joins
  desc: FAC_ROOMS joins FAC_BUILDING on BUILDING_KEY = FAC_BUILDING_KEY to obtain
    building-level attributes for rooms in the FAC_* family.
