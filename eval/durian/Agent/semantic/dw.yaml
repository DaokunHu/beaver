  source_entity_id: ACADEMIC_TERMS
  target_entity_type: table
  target_entity_id: ACADEMIC_TERM_PARAMETER
  relation_type: joins
  desc: ACADEMIC_TERMS joins ACADEMIC_TERM_PARAMETER on TERM_CODE to check whether
    a status-tracked term is the SIS current/previous/upcoming term and to obtain
    term parameter names and indicators.
  columns:
  - source_column: TERM_CODE
    target_column: TERM_CODE
- id: join_so_td
  source_entity_type: table
  source_entity_id: SUBJECT_OFFERED
  target_entity_type: table
  target_entity_id: TIP_DETAIL
  relation_type: joins
  desc: SUBJECT_OFFERED joins TIP_DETAIL on TERM_CODE to associate section-level subject
