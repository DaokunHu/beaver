    = SUBJECT_CODE, or on SUBJECT_ID and/or TERM_CODE, to combine subject-level offering
    rollups (units, enrollment) with catalog attributes (department, grade type, offering
    flags).
  columns:
  - source_column: COURSE_NUMBER
