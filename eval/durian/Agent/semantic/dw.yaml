    BUILDING_KEY:
      desc: Foreign key to FAC_BUILDING.FAC_BUILDING_KEY; the building the address
        belongs to
    ADDRESS_PURPOSE:
      desc: Purpose of the address record, e.g. 'STREET', 'MAIL', 'PARCL1', 'E911_1'
    ADDRESS_CITY_ID:
      desc: Internal identifier of the address city
    IS_E911_ADDRESS:
      desc: Flag indicating whether the address is the E911 emergency address
    STREET_NUMBER:
      desc: Numeric street number of the address (stored as string)
    STREET_NUMBER_SUFFIX:
      desc: Suffix attached to the street number
    PRE_DIRECTIONAL:
      desc: Directional prefix of the street
    STREET_NAME:
      desc: Street name of the address
    STREET_SUFFIX:
      desc: Street type suffix, e.g. 'AVE', 'ST'
    POST_DIRECTIONAL:
      desc: Directional suffix of the street
    CITY:
      desc: City of the address, e.g. 'CAMBRIDGE'
    STATE:
      desc: State abbreviation of the address, e.g. 'MA'
    POSTAL_CODE:
      desc: Postal (ZIP) code of the address
  default_granularity: one row per building address record
- id: FAC_FLOOR
  name: FAC_FLOOR
  desc: 'Facilities floor snapshot table (FAC_* family): one row per floor of a building
    with floor number/label, gross, assignable and non-assignable areas, sort sequence,
    level, wing, and access level. Same floor structure as FCLT_FLOOR but keyed by
    FLOOR_KEY/BUILDING_KEY joining FAC_ROOMS.FLOOR_KEY and FAC_BUILDING.FAC_BUILDING_KEY;
    used as the floor source when FAC_* family keys are involved.'
  columns:
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
    BUILDING_KEY:
      desc: Foreign key to FAC_BUILDING.FAC_BUILDING_KEY; the building the floor belongs
        to
    FLOOR:
      desc: Floor number/label within the building
    FLOOR_KEY:
      desc: Surrogate key of the floor in the FAC_* family; joins to FAC_ROOMS.FLOOR_KEY
    EXT_GROSS_AREA:
      desc: Extended gross area of the floor in square meters
    ASSIGNABLE_AREA:
      desc: Assignable area of the floor in square meters
    NON_ASSIGNABLE_AREA:
      desc: Non-assignable area of the floor in square meters
    FLOOR_SORT_SEQUENCE:
      desc: Numeric sort sequence of the floor within the building
    LEVEL_ID:
      desc: Level identifier of the floor
    BUILDING_WINGS_ID:
      desc: Building wing identifier of the floor
    ACCESS_LEVEL:
      desc: Access level of the floor
  default_granularity: one row per floor per building
- id: FAC_MAJOR_USE
  name: FAC_MAJOR_USE
  desc: 'Facilities major use classification lookup table (FAC family): same major
    use code/description/assignable structure as FCLT_MAJOR_USE but keyed by MAJOR_USE_KEY
    and joining the FAC_* family (FAC_ROOMS.MAJOR_USE_KEY). Used as the major use
    decoder when FAC_ROOMS is the room source.'
  columns:
    MAJOR_USE_KEY:
      desc: Surrogate key of the major use classification; joins to FAC_ROOMS.MAJOR_USE_KEY
    MAJOR_USE:
      desc: Short major use code, e.g. 'CLASSRMS', 'OFFICES'
    DESCRIPTION:
      desc: Major use description, e.g. 'CLASSROOMS', 'OFFICES'
    ASSIGNABLE:
      desc: 1/0 flag whether the major use category counts as assignable space
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per major use classification code
- id: FAC_ORGANIZATION
  name: FAC_ORGANIZATION
  desc: Facilities organization snapshot table with the same hierarchical organization
    structure as FCLT_ORGANIZATION (organization identifiers, parent/major organization,
    level, assignable flag, course number, description, HR cross-references) but keyed
    by ORGANIZATION_KEY and carrying D_CODE instead of DLC_KEY/DLC_NAME. Contains
    fewer organizations than FCLT_ORGANIZATION; used as an alternative organization
    dimension in FAC_* family queries.
  columns:
    ORGANIZATION_KEY:
      desc: Surrogate key of the organization; same value domain as FCLT_ORGANIZATION.FCLT_ORGANIZATION_KEY
    ORGANIZATION_ID:
      desc: Organization identifier
    ORGANIZATION:
      desc: Short organization abbreviation
    ORGANIZATION_NAME:
      desc: Display name of the organization
    ORG_PARENT_KEY:
      desc: Key of the parent organization in the hierarchy
    ORG_PARENT:
      desc: Abbreviation of the parent organization
    MAJOR_ORG_KEY:
      desc: Key of the major (top-level) organization
    MAJOR_ORG:
      desc: Abbreviation of the major organization
    ORGANIZATION_LEVEL:
      desc: Level of the organization in the hierarchy tree (1 = root, 5 = department/DLC
        level, 6 = sub-organization)
    ORGANIZATION_NUMBER:
      desc: Official organization number
    ORGANIZATION_SORT:
      desc: Sortable hierarchical organization code
    ASSIGNABLE:
      desc: Flag indicating whether the organization is an assignable-space unit
    COURSE:
      desc: Academic course (department) number for academic departments
    DESCRIPTION:
      desc: Long description of the organization
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
    D_CODE:
      desc: Department/Lab/Center code (equivalent role to DLC_KEY in FCLT_ORGANIZATION)
    HR_DEPARTMENT_CODE_OLD:
      desc: Legacy HR department code cross-reference
    HR_ORG_UNIT_ID:
      desc: HR organization unit identifier cross-reference
    HR_DEPARTMENT_NAME:
      desc: Department name as recorded in HR systems
  default_granularity: one row per facilities organization
- id: FAC_ROOMS
  name: FAC_ROOMS
  desc: Facilities room snapshot table with the same room inventory structure as FCLT_ROOMS
    (building/floor keys, room identifiers, major/minor use classifications, organization
    assignment, area, access level, coordinates) but keyed by FAC_ROOM_KEY and joining
    the FAC_* family (FAC_BUILDING, FAC_FLOOR, FAC_ORGANIZATION). Used as an alternative
    room source when FAC_* family keys are involved.
  columns:
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
    FAC_ROOM_KEY:
      desc: Surrogate key of the room in the FAC_* family
    BUILDING_KEY:
      desc: Foreign key to FAC_BUILDING.FAC_BUILDING_KEY
    FLOOR:
      desc: Floor the room is on
    FLOOR_KEY:
      desc: Foreign key to FAC_FLOOR.FLOOR_KEY
    ROOM:
      desc: Room number/name
    SPACE_ID:
      desc: Space identifier
    MAJOR_USE_KEY:
      desc: Major use key of the room
    MAJOR_USE_DESC:
      desc: Major use description, e.g. classroom
    USE_KEY:
      desc: Use key of the room
    USE_DESC:
      desc: Use description of the room
    MINOR_USE_KEY:
      desc: Minor use key of the room
    MINOR_USE_DESC:
      desc: Minor use description
    ORGANIZATION_KEY:
      desc: Foreign key to FAC_ORGANIZATION.ORGANIZATION_KEY; organization occupying
        the room
    ORGANIZATION_NAME:
      desc: Organization name occupying the room
    MINOR_ORGANIZATION_KEY:
      desc: Key of the secondary organization for the room
    MINOR_ORGANIZATION:
      desc: Secondary organization name
    AREA:
      desc: Room area in square meters
    ROOM_FULL_NAME:
      desc: Full room name
    DEPT_CODE:
      desc: Department code assigned to the room
    ACCESS_LEVEL:
      desc: Access level of the room
    LATITUDE_WGS:
      desc: Latitude (WGS)
    LONGITUDE_WGS:
      desc: Longitude (WGS)
    NORTHING_SPCS:
      desc: Northing coordinate (SPCS)
    EASTING_SPCS:
      desc: Easting coordinate (SPCS)
  default_granularity: one row per physical room
- id: FCLT_BUILDING
  name: FCLT_BUILDING
  desc: 'Facilities building inventory table: one row per physical building with building
    number/name, type (e.g. ACADEMIC), ownership, use, occupancy class, gross/assignable/non-assignable
    areas, number of rooms, key dates (built/acquired/occupied), site and geographic
    coordinates. Parent of FCLT_ROOMS via FCLT_BUILDING_KEY.'
  columns:
    FCLT_BUILDING_KEY:
      desc: Surrogate key of the building; joins to FCLT_ROOMS.FCLT_BUILDING_KEY
    BUILDING_NUMBER:
      desc: Building number/code, e.g. '32', 'E38'; same value as FCLT_BUILDING_KEY
        in current data; can be matched to FCLT_BUILDING_ADDRESS.BUILDING_NUMBER
    PARENT_BUILDING_NUMBER:
      desc: Parent building number
    PARENT_BUILDING_NAME:
      desc: Parent building name
    PARENT_BUILDING_NAME_LONG:
      desc: Long parent building name
    BUILDING_NAME_LONG:
      desc: Long building name, e.g. 'Stanley Gordon Brown Building'; fuller naming
        variant of BUILDING_NAME
    EXT_GROSS_AREA:
      desc: Extended gross area of the building in square meters
    ASSIGNABLE_AREA:
      desc: Total assignable area of the building in square meters
    NON_ASSIGNABLE_AREA:
      desc: Non-assignable area of the building in square meters
    SITE:
      desc: Site/campus the building belongs to, e.g. 'MIT', 'BATES', 'LINC', 'BOS';
        'MIT' filters buildings on the MIT campus
    CAMPUS_SECTOR:
      desc: Campus sector the building is in, e.g. 'MAIN GROUP', 'EAST', 'NORTHWEST',
        'WEST', 'OFFCAMPUS'
    ACCESS_LEVEL_CODE:
      desc: Numeric access level code of the building (observed values 0-2); distinct
        from FCLT_ROOMS.ACCESS_LEVEL (per-room) and FCLT_FLOOR.ACCESS_LEVEL (per-floor)
    ACCESS_LEVEL_NAME:
      desc: Access level name of the building (same numeric value as ACCESS_LEVEL_CODE
        in current data)
    BUILDING_TYPE:
      desc: 'Building type classification: ''ACADEMIC'' (academic buildings), ''SERVICE'',
        or ''RESIDENT'' (residential buildings); used to filter academic/residential
        buildings'
    OWNERSHIP_TYPE:
      desc: 'Ownership type: ''OWNED'' or ''LEASED'''
    BUILDING_USE:
      desc: Primary use code of the building, e.g. 'AER', 'DHOA', 'STAC', 'GAR', 'OTH';
        may be null
    OCCUPANCY_CLASS:
      desc: Occupancy classification code of the building (e.g. 'UGB', 'UGA3', 'UGR2');
        coded combinations of use/grade/occupancy attributes
    BUILDING_HEIGHT:
      desc: Height of the building (numeric, in feet); used in height filters and
        averages
    COST_CENTER_CODE:
      desc: Cost center code of the building, e.g. '1810200'; alternative join key
        to FCLT_BUILDING_HIST.COST_CENTER_CODE; null for some buildings
    COST_COLLECTOR_KEY:
      desc: Cost collector key of the building (same value as COST_CENTER_CODE in
        current data); alternative join key to FCLT_BUILDING_HIST.COST_COLLECTOR_KEY
        used to count historical records per building
    LATITUDE_WGS:
      desc: Latitude (WGS)
    LONGITUDE_WGS:
      desc: Longitude (WGS)
    EASTING_X_SPCS:
      desc: Easting coordinate (SPCS)
    NORTHING_Y_SPCS:
      desc: Northing coordinate (SPCS)
    BUILDING_SORT:
      desc: Sortable building name
    BUILDING_NAMED_FOR:
      desc: Person the building is named for
    BUILDING_NAME:
      desc: Building name, e.g. 'Ray and Maria Stata Center', 'BROWN BUILDING'; used
        for building-level grouping and name filters (values are uppercase for some
        buildings)
    DATE_BUILT:
      desc: Date the building was built, stored in MM/DD/YYYY format (FCLT_BUILDING_HIST_1
        variant uses DD-MON-YY); the year built is derived from this column
    DATE_ACQUIRED:
      desc: Date the building was acquired, MM/DD/YYYY format; often null
    DATE_OCCUPIED:
      desc: Date the building was first occupied, MM/DD/YYYY format
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
    NUM_OF_ROOMS:
      desc: Current number of rooms in the building; distinct from FCLT_BUILDING_HIST.NUM_OF_ROOMS
        which is the per-fiscal-period historical value
  default_granularity: one row per building
- id: FCLT_BUILDING_ADDRESS
  name: FCLT_BUILDING_ADDRESS
  desc: 'Facilities building address table: one row per address record of a building
    (a building may hold several addresses for different purposes such as street,
    mail, parcel, and E911 emergency addresses), with street number and suffix, directional
    prefixes/suffixes, street name and suffix, city, state, postal code, address purpose,
    city identifier, and E911 flag. Joins to FCLT_BUILDING via FCLT_BUILDING_KEY;
    used to locate buildings by city/state/street and to report address attributes
    alongside building characteristics.'
  columns:
    POSTAL_CODE:
      desc: Postal (ZIP) code of the address
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
    FCLT_BUILDING_ADDRESS_KEY:
      desc: Surrogate key of the address record
    FCLT_BUILDING_KEY:
      desc: Building identifier key the address belongs to; joins to FCLT_BUILDING.FCLT_BUILDING_KEY
    BUILDING_NUMBER:
      desc: Building number as written on the address record; can also be matched
        directly to FCLT_BUILDING.BUILDING_NUMBER
    ADDRESS_PURPOSE:
      desc: Purpose of the address record, e.g. 'STREET', 'MAIL', 'PARCL1'-'PARCL3',
        'E911_1'-'E911_5'; one building can have multiple address rows with different
        purposes
    ADDRESS_CITY_ID:
      desc: Internal identifier of the address city
    IS_E911_ADDRESS:
      desc: Flag indicating whether the address is the E911 emergency address
    STREET_NUMBER:
      desc: Numeric street number of the address (stored as string; compared numerically
        in address-range filters)
    STREET_NUMBER_SUFFIX:
      desc: Suffix attached to the street number, e.g. 'A'
    PRE_DIRECTIONAL:
      desc: Directional prefix of the street, e.g. 'N', 'SW'
    STREET_NAME:
      desc: Street name of the address, e.g. 'MASSACHUSETTS AVENUE'
    STREET_SUFFIX:
      desc: Street type suffix, e.g. 'AVE', 'ST', 'RD'
    POST_DIRECTIONAL:
      desc: Directional suffix of the street
    CITY:
      desc: City of the address, e.g. 'CAMBRIDGE', 'BOSTON'; used to filter buildings
        by city
    STATE:
      desc: State abbreviation of the address, e.g. 'MA', 'DC'
  default_granularity: one row per building address record
- id: FCLT_BUILDING_ADDRESS_HIST
  name: FCLT_BUILDING_ADDRESS_HIST
  desc: 'Historical facilities building address table: one row per building address
    record per fiscal period (FISCAL_PERIOD in YYYYMM format), preserving each address''s
    street number/name/suffix, directionals, city, state, postal code, address purpose,
    and E911 flag over time. Fiscal-period counterpart of FCLT_BUILDING_ADDRESS; joins
    to buildings via FCLT_BUILDING_KEY and to current address records via FCLT_BUILDING_ADDRESS_KEY.'
  columns:
    FCLT_BUILDING_ADDRESS_KEY:
      desc: Key of the corresponding current address record; joins to FCLT_BUILDING_ADDRESS.FCLT_BUILDING_ADDRESS_KEY
    FCLT_BUILDING_KEY:
      desc: Building identifier key the address belongs to; joins to FCLT_BUILDING.FCLT_BUILDING_KEY
    FISCAL_PERIOD:
      desc: Fiscal period of the address snapshot in YYYYMM format
    FCLT_BUILDING_ADDRESS_HIST_KEY:
      desc: Surrogate key of the historical address record
    BUILDING_NUMBER:
      desc: Building number as written on the address record at the fiscal period
    ADDRESS_PURPOSE:
      desc: Purpose of the address record at the fiscal period, e.g. 'STREET', 'MAIL',
        'PARCL1', 'E911_1'
    ADDRESS_CITY_ID:
      desc: Internal identifier of the address city at the fiscal period
    IS_E911_ADDRESS:
      desc: Flag indicating whether the address is the E911 emergency address at the
        fiscal period
    STREET_NUMBER:
      desc: Numeric street number of the address at the fiscal period (stored as string)
    STREET_NUMBER_SUFFIX:
      desc: Suffix attached to the street number at the fiscal period
    PRE_DIRECTIONAL:
      desc: Directional prefix of the street at the fiscal period
    STREET_NAME:
      desc: Street name of the address at the fiscal period
    STREET_SUFFIX:
      desc: Street type suffix at the fiscal period
    POST_DIRECTIONAL:
      desc: Directional suffix of the street at the fiscal period
    CITY:
      desc: City of the address at the fiscal period
    STATE:
      desc: State abbreviation of the address at the fiscal period
    POSTAL_CODE:
      desc: Postal (ZIP) code of the address at the fiscal period
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per building address record per fiscal period
- id: FCLT_BUILDING_HIST
  name: FCLT_BUILDING_HIST
  desc: 'Historical facilities building snapshot table: one row per building per fiscal
    period (FISCAL_PERIOD in YYYYMM format, covering 201505-201906, 48 periods, ~255
    buildings), preserving each building''s attributes over time: identifiers and
    names, gross/assignable/non-assignable areas, site, campus sector, access level,
    building type, ownership type, use, occupancy class, height, cost center/collector
    references, coordinates, and number of rooms. Used for fiscal-period building
    history analysis (area/room-count trends, dispersion statistics across historical
    records); use FCLT_BUILDING for the current snapshot. Date columns (DATE_BUILT/DATE_ACQUIRED/DATE_OCCUPIED)
    are stored in MM/DD/YYYY format; FCLT_BUILDING_HIST_1 is the variant storing them
    in DD-MON-YY format.'
  columns:
    FCLT_BUILDING_HIST_KEY:
      desc: Surrogate key of the historical building record, formatted as '<building
        key>-<fiscal period>' (e.g. '46-201505')
    FISCAL_PERIOD:
      desc: Fiscal period of the snapshot in YYYYMM format (e.g. 201505); the time
        dimension of the history, covering 201505-201906
    FCLT_BUILDING_KEY:
      desc: Building identifier key (building number/code, e.g. '32'); joins to FCLT_BUILDING.FCLT_BUILDING_KEY
        and FCLT_ROOMS.FCLT_BUILDING_KEY
    BUILDING_NUMBER:
      desc: Building number as recorded in the fiscal period
    PARENT_BUILDING_NUMBER:
      desc: Parent building number in the fiscal period
    PARENT_BUILDING_NAME:
      desc: Parent building name in the fiscal period
    PARENT_BUILDING_NAME_LONG:
      desc: Long parent building name in the fiscal period
    BUILDING_NAME_LONG:
      desc: Long building name in the fiscal period; used to identify buildings (e.g.
        academic buildings at MIT) in history-based queries
    EXT_GROSS_AREA:
      desc: Extended gross area of the building in square meters at the fiscal period
    ASSIGNABLE_AREA:
      desc: Assignable area of the building in square meters at the fiscal period;
        used in historical area statistics (sum, average, min, stddev)
    NON_ASSIGNABLE_AREA:
      desc: Non-assignable area of the building in square meters at the fiscal period
    SITE:
      desc: Site of the building at the fiscal period, e.g. 'MIT'; historical counterpart
        of FCLT_BUILDING.SITE
    CAMPUS_SECTOR:
      desc: Campus sector at the fiscal period, e.g. 'MAIN GROUP', 'EAST', 'NORTHWEST',
        'OFFCAMPUS'
    ACCESS_LEVEL_CODE:
      desc: Numeric access level code of the building at the fiscal period (observed
        values 0-2); joins to FCLT_BUILDING.ACCESS_LEVEL_CODE
    ACCESS_LEVEL_NAME:
      desc: Access level name at the fiscal period (same numeric value as the code
        in current data)
    BUILDING_TYPE:
      desc: 'Building type at the fiscal period: ''ACADEMIC'', ''SERVICE'', or ''RESIDENT'';
        historical counterpart of FCLT_BUILDING.BUILDING_TYPE'
    OWNERSHIP_TYPE:
      desc: 'Ownership type at the fiscal period: ''OWNED'' or ''LEASED'''
    BUILDING_USE:
      desc: Primary use of the building at the fiscal period
    OCCUPANCY_CLASS:
      desc: Occupancy classification at the fiscal period
    BUILDING_HEIGHT:
      desc: Building height at the fiscal period (stored as string)
    COST_CENTER_CODE:
      desc: Cost center code at the fiscal period; alternative join key to FCLT_BUILDING.COST_CENTER_CODE
    COST_COLLECTOR_KEY:
      desc: Cost collector key at the fiscal period; alternative join key to FCLT_BUILDING.COST_COLLECTOR_KEY,
        used to count historical records per building
    LATITUDE_WGS:
      desc: Latitude (WGS) at the fiscal period
    LONGITUDE_WGS:
      desc: Longitude (WGS) at the fiscal period
    EASTING_X_SPCS:
      desc: Easting coordinate (SPCS) at the fiscal period
    NORTHING_Y_SPCS:
      desc: Northing coordinate (SPCS) at the fiscal period
    BUILDING_SORT:
      desc: Sortable building name at the fiscal period
    BUILDING_NAMED_FOR:
      desc: Person the building is named for, at the fiscal period
    BUILDING_NAME:
      desc: Building name at the fiscal period, e.g. 'Ray and Maria Stata Center';
        grouping/join key in history-based building queries
    DATE_BUILT:
      desc: Date the building was built, stored in MM/DD/YYYY format (FCLT_BUILDING_HIST_1
        stores DD-MON-YY)
    DATE_ACQUIRED:
      desc: Date the building was acquired, stored in MM/DD/YYYY format; often null
    DATE_OCCUPIED:
      desc: Date the building was first occupied, stored in MM/DD/YYYY format
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
    NUM_OF_ROOMS:
      desc: Number of rooms in the building at the fiscal period; historical counterpart
        of FCLT_BUILDING.NUM_OF_ROOMS, used in room-count statistics over building
        history records
    default_granularity: null
  default_granularity: one row per building per fiscal period
- id: FCLT_BUILDING_HIST_1
  name: FCLT_BUILDING_HIST_1
  desc: 'Variant of the historical facilities building snapshot table with the same
    structure, keys, and coverage as FCLT_BUILDING_HIST (one row per building per
    fiscal period, FISCAL_PERIOD 201505-201906), differing only in date-column formatting:
    DATE_BUILT/DATE_ACQUIRED/DATE_OCCUPIED are stored as DD-MON-YY strings (e.g. ''25-APR-03'')
    instead of MM/DD/YYYY. Use FCLT_BUILDING_HIST for building history analysis unless
    the DD-MON-YY date representation is specifically required.'
  columns:
    FCLT_BUILDING_HIST_KEY:
      desc: Surrogate key of the historical building record, formatted as '<building
        key>-<fiscal period>'
    FISCAL_PERIOD:
      desc: Fiscal period of the snapshot in YYYYMM format (201505-201906)
    FCLT_BUILDING_KEY:
      desc: Building identifier key (building number/code); joins to FCLT_BUILDING.FCLT_BUILDING_KEY
    BUILDING_NUMBER:
      desc: Building number as recorded in the fiscal period
    PARENT_BUILDING_NUMBER:
      desc: Parent building number in the fiscal period
    PARENT_BUILDING_NAME:
      desc: Parent building name in the fiscal period
    PARENT_BUILDING_NAME_LONG:
      desc: Long parent building name in the fiscal period
    BUILDING_NAME_LONG:
      desc: Long building name in the fiscal period
    EXT_GROSS_AREA:
      desc: Extended gross area of the building in square meters at the fiscal period
    ASSIGNABLE_AREA:
      desc: Assignable area of the building in square meters at the fiscal period
    NON_ASSIGNABLE_AREA:
      desc: Non-assignable area of the building in square meters at the fiscal period
    SITE:
      desc: Site of the building at the fiscal period, e.g. 'MIT'
    CAMPUS_SECTOR:
      desc: Campus sector at the fiscal period, e.g. 'MAIN GROUP', 'EAST', 'OFFCAMPUS'
    ACCESS_LEVEL_CODE:
      desc: Numeric access level code of the building at the fiscal period (0-2)
    ACCESS_LEVEL_NAME:
      desc: Access level name at the fiscal period
    BUILDING_TYPE:
      desc: 'Building type at the fiscal period: ''ACADEMIC'', ''SERVICE'', or ''RESIDENT'''
    OWNERSHIP_TYPE:
      desc: 'Ownership type at the fiscal period: ''OWNED'' or ''LEASED'''
    BUILDING_USE:
      desc: Primary use of the building at the fiscal period
    OCCUPANCY_CLASS:
      desc: Occupancy classification at the fiscal period
    BUILDING_HEIGHT:
      desc: Building height at the fiscal period (stored as string)
    COST_CENTER_CODE:
      desc: Cost center code at the fiscal period
    COST_COLLECTOR_KEY:
      desc: Cost collector key at the fiscal period
    LATITUDE_WGS:
      desc: Latitude (WGS) at the fiscal period
    LONGITUDE_WGS:
      desc: Longitude (WGS) at the fiscal period
    EASTING_X_SPCS:
      desc: Easting coordinate (SPCS) at the fiscal period
    NORTHING_Y_SPCS:
      desc: Northing coordinate (SPCS) at the fiscal period
    BUILDING_SORT:
      desc: Sortable building name at the fiscal period
    BUILDING_NAMED_FOR:
      desc: Person the building is named for, at the fiscal period
    BUILDING_NAME:
      desc: Building name at the fiscal period
    DATE_BUILT:
      desc: Date the building was built, stored in DD-MON-YY format (e.g. '25-APR-03');
        differs from FCLT_BUILDING_HIST which uses MM/DD/YYYY
    DATE_ACQUIRED:
      desc: Date the building was acquired, stored in DD-MON-YY format; often null
    DATE_OCCUPIED:
      desc: Date the building was first occupied, stored in DD-MON-YY format
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
    NUM_OF_ROOMS:
      desc: Number of rooms in the building at the fiscal period
  default_granularity: one row per building per fiscal period
- id: FCLT_FLOOR
  name: FCLT_FLOOR
  desc: 'Facilities floor inventory table: one row per floor of a building (floor
    key formatted ''<building key>-<floor>''), with floor number/label, gross, assignable
    and non-assignable areas of the floor, sort sequence, level identifier, building
    wing, and access level. Child of FCLT_BUILDING via FCLT_BUILDING_KEY and parent
    of FCLT_ROOMS via FCLT_FLOOR_KEY; used for per-floor area aggregation and floor-level
    filtering (e.g. floors with assignable area above a threshold).'
  columns:
    FCLT_FLOOR_KEY:
      desc: Surrogate key of the floor, formatted '<building key>-<floor>' (e.g. '14-4');
        joins to FCLT_ROOMS.FCLT_FLOOR_KEY
    FCLT_BUILDING_KEY:
      desc: Building identifier key the floor belongs to; joins to FCLT_BUILDING.FCLT_BUILDING_KEY
    FLOOR:
      desc: Floor number/label within the building; mostly numeric strings but can
        include basement/mezzanine labels (e.g. '0', 'R2'); used for floor grouping
        and ordering
    EXT_GROSS_AREA:
      desc: Extended gross area of the floor in square meters
    ASSIGNABLE_AREA:
      desc: Assignable area of the floor in square meters; summed per floor/building
        in floor area analysis
    NON_ASSIGNABLE_AREA:
      desc: Non-assignable area of the floor in square meters
    FLOOR_SORT_SEQUENCE:
      desc: Numeric sort sequence of the floor within the building
    LEVEL_ID:
      desc: Level identifier of the floor (numeric level within the building)
    BUILDING_WINGS_ID:
      desc: Building wing identifier of the floor; null for most floors
    ACCESS_LEVEL:
      desc: Access level of the floor (observed values 0-3); distinct from FCLT_ROOMS.ACCESS_LEVEL
        which is per room
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per floor per building
- id: FCLT_FLOOR_HIST
  name: FCLT_FLOOR_HIST
  desc: 'Historical facilities floor table: one row per floor per fiscal period (FISCAL_PERIOD
    in YYYYMM format, covering 201505-201602), preserving each floor''s number/label,
    gross, assignable and non-assignable areas, sort sequence, level, wing, and access
    level over time. Fiscal-period counterpart of FCLT_FLOOR; joins to buildings via
    FCLT_BUILDING_KEY and to current floor records via FCLT_FLOOR_KEY.'
  columns:
    FCLT_FLOOR_HIST_KEY:
      desc: Surrogate key of the historical floor record
    FISCAL_PERIOD:
      desc: Fiscal period of the floor snapshot in YYYYMM format (201505-201602)
    FCLT_FLOOR_KEY:
      desc: Key of the corresponding current floor record; joins to FCLT_FLOOR.FCLT_FLOOR_KEY
    FCLT_BUILDING_KEY:
      desc: Building identifier key the floor belongs to; joins to FCLT_BUILDING.FCLT_BUILDING_KEY
    FLOOR:
      desc: Floor number/label within the building at the fiscal period
    EXT_GROSS_AREA:
      desc: Extended gross area of the floor in square meters at the fiscal period
    ASSIGNABLE_AREA:
      desc: Assignable area of the floor in square meters at the fiscal period
    NON_ASSIGNABLE_AREA:
      desc: Non-assignable area of the floor in square meters at the fiscal period
    FLOOR_SORT_SEQUENCE:
      desc: Numeric sort sequence of the floor within the building at the fiscal period
    LEVEL_ID:
      desc: Level identifier of the floor at the fiscal period
    BUILDING_WINGS_ID:
      desc: Building wing identifier of the floor at the fiscal period
    ACCESS_LEVEL:
      desc: Access level of the floor at the fiscal period
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per floor per fiscal period
- id: FCLT_MAJOR_USE
  name: FCLT_MAJOR_USE
  desc: 'Facilities major use classification lookup table (FCLT family): one row per
    major use code (e.g. CLASSRMS classrooms, OFFICES offices, LABS laboratories,
    RESIDENT residential) with its short code, description, and assignable-space flag.
    Joined from FCLT_ROOMS via FCLT_MAJOR_USE_KEY to decode a room''s major use; current
    snapshot only, use FCLT_MAJOR_USE_HIST for fiscal-period historical variants.'
  columns:
    FCLT_MAJOR_USE_KEY:
      desc: Surrogate key of the major use classification; joins to FCLT_ROOMS.FCLT_MAJOR_USE_KEY
    MAJOR_USE:
      desc: Short major use code, e.g. 'CLASSRMS', 'OFFICES', 'LABS'
    DESCRIPTION:
      desc: Major use description, e.g. 'CLASSROOMS', 'OFFICES', 'LABORATORIES'
    ASSIGNABLE:
      desc: 1/0 flag whether the major use category counts as assignable space
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per major use classification code
- id: FCLT_MAJOR_USE_HIST
  name: FCLT_MAJOR_USE_HIST
  desc: 'Historical facilities major use classification table: one row per major use
    code per fiscal period (FISCAL_PERIOD, e.g. 201505), preserving the code/description/assignable
    values of each classification across fiscal periods. Superset of FCLT_MAJOR_USE
    along the time dimension; use FCLT_MAJOR_USE for the current classification and
    this table when a specific fiscal period''s classification is required.'
  columns:
    FCLT_MAJOR_USE_HIST_KEY:
      desc: Composite historical key in 'MAJOR_USE_KEY-FISCAL_PERIOD' format, e.g.
        '101-201505'
    FISCAL_PERIOD:
      desc: Fiscal period (YYYYMM) of the classification snapshot
    FCLT_MAJOR_USE_KEY:
      desc: Major use key, matching FCLT_MAJOR_USE.FCLT_MAJOR_USE_KEY and FCLT_ROOMS.FCLT_MAJOR_USE_KEY
    MAJOR_USE:
      desc: Short major use code as of the fiscal period
    DESCRIPTION:
      desc: Major use description as of the fiscal period
    ASSIGNABLE:
      desc: 1/0 assignable-space flag as of the fiscal period
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per major use code per fiscal period
- id: FCLT_ORG_DLC_KEY
  name: FCLT_ORG_DLC_KEY
  desc: 'Bridge table mapping facilities organizations to their department/lab/center
    (DLC) keys: one row per organization-DLC key assignment. Used to filter organizations
    that have a non-null DLC key assignment before joining FCLT_ORGANIZATION (via
    FCLT_ORGANIZATION_KEY or DLC_KEY) for DLC-level facility and room statistics.'
  columns:
    FCLT_ORGANIZATION_KEY:
      desc: Foreign key to FCLT_ORGANIZATION.FCLT_ORGANIZATION_KEY identifying the
        organization in the DLC assignment
    DLC_KEY:
      desc: Department/Lab/Center key, e.g. 'D_AEROASTRO'; joins to FCLT_ORGANIZATION.DLC_KEY;
        non-null values identify organizations with a DLC assignment
- id: FCLT_ORGANIZATION
  name: FCLT_ORGANIZATION
  desc: 'Facilities organization dimension table: one row per organization in the
    institute''s hierarchical organization tree (levels 1-6, from institute-wide down
    to sub-units), with organization identifiers and names, parent and major-organization
    attribution, hierarchy level, assignable-space flag, course number for academic
    departments, description, DLC (department/lab/center) key and name, and cross-references
    to HR organization units. Parent of SPACE_UNIT (space assigned to organizations)
    and referenced by FCLT_ROOMS via FCLT_ORGANIZATION_KEY for room occupancy attribution.'
  columns:
    FCLT_ORGANIZATION_KEY:
      desc: Surrogate key of the facilities organization; joins to SPACE_UNIT.FCLT_ORGANIZATION_KEY
        and FCLT_ROOMS.FCLT_ORGANIZATION_KEY
    ORGANIZATION_ID:
      desc: Organization identifier (same value as the organization key in current
        data)
    ORGANIZATION:
      desc: Short organization abbreviation, e.g. 'AERO', 'ADMISS'
    ORGANIZATION_NAME:
      desc: Display name of the organization, e.g. 'AERO & ASTRO'; used for organization-name
        reporting
    FCLT_ORG_PARENT_KEY:
      desc: Key of the parent organization in the hierarchy tree; null for the top-level
        organization
    ORG_PARENT:
      desc: Abbreviation of the parent organization, e.g. 'S ENG' (School of Engineering)
    FCLT_MAJOR_ORG_KEY:
      desc: Key of the major (top-level grouping) organization this organization rolls
        up to
    MAJOR_ORG:
      desc: Abbreviation of the major organization, e.g. 'PROVST', 'CHNCLR'
    ORGANIZATION_LEVEL:
      desc: Level of the organization in the hierarchy tree (1 = institute-wide root,
        2-4 = intermediate divisions/schools, 5 = department/DLC level, 6 = sub-organization);
        stored as string, filter with values like '5'
    ORGANIZATION_NUMBER:
      desc: Official organization number used in administrative systems
    ORGANIZATION_SORT:
      desc: Sortable hierarchical organization code reflecting the tree path
    ASSIGNABLE:
      desc: Flag ('1'/'0') indicating whether the organization is an assignable-space
        organizational unit
    COURSE:
      desc: Academic course (department) number for degree-granting academic departments,
        e.g. '16' for Aeronautics and Astronautics; null for non-academic organizations
    DESCRIPTION:
      desc: Long description of the organization, e.g. 'Department of Aeronautics
        and Astronautics'; null for many non-academic organizations
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
    DLC_KEY:
      desc: Department/Lab/Center key, e.g. 'D_AEROASTRO'; joins to FCLT_ORG_DLC_KEY.DLC_KEY,
        HR_ORG_UNIT.DLC_KEY (for HR org unit title/level and HR department attributes;
        may fan out when a DLC maps to multiple HR org units), and MASTER_DEPT_HIERARCHY.DLC_KEY
        (for the standard department hierarchy path)
    DLC_NAME:
      desc: Department/Lab/Center full name, e.g. 'Aeronautics and Astronautics'
    HR_DEPARTMENT_CODE_OLD:
      desc: Legacy HR department code cross-reference
    HR_ORG_UNIT_ID:
      desc: HR organization unit identifier cross-reference; links to HR_ORG_UNIT
    HR_DEPARTMENT_NAME:
      desc: Department name as recorded in HR systems
  default_granularity: one row per facilities organization
- id: FCLT_ORGANIZATION_HIST
