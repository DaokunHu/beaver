  target_entity_type: table
  target_entity_id: FCLT_FLOOR
  relation_type: joins
  desc: FCLT_ROOMS joins FCLT_FLOOR on FCLT_FLOOR_KEY (primary key pair attaching
    floor attributes such as floor number and floor assignable area to each room);
    the composite pair FCLT_BUILDING_KEY = FCLT_BUILDING_KEY AND FLOOR = FLOOR is
