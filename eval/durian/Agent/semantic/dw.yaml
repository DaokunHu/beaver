  source_entity_id: IAP_SUBJECT_DETAIL
  target_entity_type: table
  target_entity_id: IAP_SUBJECT_DETAIL
  relation_type: joins
  desc: IAP_SUBJECT_DETAIL self-join on ACTIVITY_TITLE and ENROLLMENT_TYPE (optionally
    TERM_CODE) to re-attach filtered or windowed IAP activity rows back to the full
    activity records, e.g. to fetch activity description alongside category statistics.
  columns:
  - source_column: ACTIVITY_TITLE
    target_column: ACTIVITY_TITLE
  - source_column: ENROLLMENT_TYPE
    target_column: ENROLLMENT_TYPE
  - source_column: TERM_CODE
    target_column: TERM_CODE
- id: join_ssc_self
  source_entity_type: table
  source_entity_id: SIS_SUBJECT_CODE
  target_entity_type: table
  target_entity_id: SIS_SUBJECT_CODE
  relation_type: joins
  desc: SIS_SUBJECT_CODE self-join on COURSE_NUMBER or SUBJECT_CODE to re-attach derived
    subject-code groupings back to the lookup rows and obtain school name and subject
    code description for each course number.
  columns:
  - source_column: COURSE_NUMBER
    target_column: COURSE_NUMBER
  - source_column: SUBJECT_CODE
    target_column: SUBJECT_CODE
- id: join_lso_self
  source_entity_type: table
  source_entity_id: LIBRARY_SUBJECT_OFFERED
  target_entity_type: table
  target_entity_id: LIBRARY_SUBJECT_OFFERED
  relation_type: joins
  desc: LIBRARY_SUBJECT_OFFERED self-join on OFFER_DEPT_CODE (department-level aggregation
    back to subject rows) or on SUBJECT_ID/TERM_CODE to combine department-level library
    enrollment totals with individual subject offering rows and responsible faculty
    names.
  columns:
  - source_column: OFFER_DEPT_CODE
    target_column: OFFER_DEPT_CODE
  - source_column: SUBJECT_ID
    target_column: SUBJECT_ID
  - source_column: TERM_CODE
    target_column: TERM_CODE
- id: join_td_self
