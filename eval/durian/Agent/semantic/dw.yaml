- id: SUBJECT_ATTRIBUTE
  name: SUBJECT_ATTRIBUTE
  desc: 'Subject attribute lookup table decoding attribute codes attached to subjects:
    academic attributes (type ''A'') such as calculus/science prerequisites and HASS-D/HASS
    category codes, and non-academic program flags (type ''N'') such as ROTC, ESG,
    Concourse, co-op, and listener rules. Provides short, full, and reporting descriptions
    per code. Overlaps with CIS_HASS_ATTRIBUTE on HASS-family codes (HD1-HD5, HDL,
    HE, HA, HH, HS) but differs in scope: SUBJECT_ATTRIBUTE covers all subject attribute
    types with one description variant per code, while CIS_HASS_ATTRIBUTE covers only
    HASS attribute codes with separate registration-form and bulletin descriptions
    plus attribute-group (H/G) classification. Catalog subject records'' GIR_ATTRIBUTE
    codes all resolve against SUBJECT_ATTRIBUTE_CODE.'
  columns:
    SUBJECT_ATTRIBUTE_CODE:
      desc: Subject attribute code, e.g. 'CAL1' (Calculus I), 'HD1'-'HD5' (HASS-D
        categories), 'HE' (HASS Elective), 'HA'/'HH'/'HS' (HASS Arts/Humanities/Social
        Sciences), 'ROTC', 'ESG'; decodes GIR_ATTRIBUTE and HASS-family attribute
        codes carried by catalog subject records
    SUBJECT_ATTRIBUTE_TYPE:
      desc: 'Attribute type code: ''A'' = academic attribute (prerequisite/requirement
        categories such as calculus, science, HASS), ''N'' = non-academic/program
        flag (ROTC, ESG, Concourse, co-op, listener rules)'
    SUBJECT_ATTRIBUTE_SHORT_DESC:
      desc: Short description of the attribute, e.g. 'HASS-D 1', 'Calculus I'; may
        be null
    SUBJECT_ATTRIBUTE_DESC:
      desc: Full description of the subject attribute, e.g. 'HASS-D, Category 1',
        'Institute Lab', 'ROTC Subject'
    SUBJECT_ATTRIBUTE_REPORT_DESC:
      desc: Short reporting description of the attribute, e.g. 'HD-1'; often null
    LAST_ACTIVITY_DATE:
      desc: Date of the last change to the attribute record
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per subject attribute code
