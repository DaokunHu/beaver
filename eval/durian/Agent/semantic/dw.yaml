- id: join_fcltorg_hrorgunit
  source_entity_type: table
  source_entity_id: FCLT_ORGANIZATION
  target_entity_type: table
  target_entity_id: HR_ORG_UNIT
  relation_type: joins
  desc: 'FCLT_ORGANIZATION joins HR_ORG_UNIT on DLC_KEY to attach HR organization
    unit attributes (unit title, unit level, HR department name/code/long name, hierarchy
    area names) to facilities organizations; a DLC_KEY may map to multiple HR org
    unit rows, so the join can fan out organization rows. Alternative key pairs: HR_DEPARTMENT_CODE_OLD
    = HR_DEPARTMENT_CODE_OLD (legacy HR department code cross-reference, used for
    HR department statistics of assignable organizations) and HR_ORG_UNIT_ID = HR_ORG_UNIT_ID
    (numeric HR unit identifier, matching fewer rows).'
  columns:
  - source_column: DLC_KEY
    target_column: DLC_KEY
  - source_column: HR_DEPARTMENT_CODE_OLD
    target_column: HR_DEPARTMENT_CODE_OLD
  - source_column: HR_ORG_UNIT_ID
    target_column: HR_ORG_UNIT_ID
- id: join_masterdepthier_hrorgunit
  source_entity_type: table
  source_entity_id: MASTER_DEPT_HIERARCHY
  target_entity_type: table
  target_entity_id: HR_ORG_UNIT
  relation_type: joins
  desc: MASTER_DEPT_HIERARCHY joins HR_ORG_UNIT on DLC_KEY to attach HR organization
    unit attributes (unit title, level, department name/code) to the master-hierarchy
    path of a DLC, or to restrict HR org units to DLCs present in the standard department
    hierarchy; DLC_CODE = DLC_KEY is an equivalent key pair since both hold the same
    value.
  columns:
  - source_column: DLC_KEY
    target_column: DLC_KEY
- id: join_hrorgunit_self
  source_entity_type: table
  source_entity_id: HR_ORG_UNIT
  target_entity_type: table
  target_entity_id: HR_ORG_UNIT
  relation_type: joins
  desc: HR_ORG_UNIT self-join on DLC_KEY or DLC_NAME to re-attach HR org unit attributes
    (unit title, unit level) to rows already carrying a DLC reference, e.g. when a
    facilities organization row must be paired again with the HR org unit of the same
    DLC; both key columns map one DLC to multiple HR org unit rows, so the self-join
    fans out. The HR_DEPARTMENT_NAME = HR_DEPARTMENT_NAME pair re-attaches HR org
    unit rows (e.g. hierarchy area names, latest load date) to derived per-HR-department
    aggregates. The HR_ORG_UNIT_ID = HR_ORG_UNIT_ID pair re-attaches the full HR org
    unit record (e.g. HR_DEPARTMENT_NAME_LONG, DLC_NAME) to derived rows that already
    carry a numeric HR unit identifier, matching at most one row per unit id.
  columns:
