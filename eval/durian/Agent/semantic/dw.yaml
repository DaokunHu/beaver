- id: HR_FACULTY_ROSTER
  name: HR_FACULTY_ROSTER
  desc: 'HR faculty roster table: one row per faculty member keyed by MIT_ID with
    name components, terminal degree, appointment type, job/position titles across
    HR, administrative, and directory organization units, endowed chair, and emeritus
    status. Used for faculty appointment and credential analysis; joins to EMPLOYEE_DIRECTORY
    on MIT_ID for contact details.'
  columns:
    MIT_ID:
      desc: Unique institute person identifier; joins to EMPLOYEE_DIRECTORY.MIT_ID
    LAST_NAME:
      desc: Last name
    FIRST_NAME:
      desc: First name
    MIDDLE_NAME:
      desc: Middle name
    TERMINAL_DEGREE:
      desc: Highest/terminal degree held by the faculty member
    APPOINTMENT_TYPE:
      desc: Faculty appointment type
    JOB_TITLE:
      desc: Job title
    HR_ORG_UNIT_TITLE:
      desc: HR organization unit title
    POSITION_TITLE:
      desc: Position title
    ADMIN_ORG_UNIT_TITLE:
      desc: Administrative organization unit title
    ADMIN_POSITION_TITLE:
      desc: Administrative position title
    ADMIN_JOB_TITLE:
      desc: Administrative job title
    DIRECTORY_ORG_UNIT_TITLE:
      desc: Directory organization unit title
    ENDOWED_CHAIR:
      desc: Endowed chair held by the faculty member, if any
    EMERITUS_STATUS:
      desc: Emeritus status of the faculty member
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
- id: HR_ORG_UNIT
  name: HR_ORG_UNIT
  desc: 'HR organization unit dimension table: one row per HR organization unit with
    unit key/ID/title, unit level classification (ALL MIT, TOP LEVEL, DEPARTMENTS,
    SUB DEPARTMENT, ORGANIZATION LEVEL, NON HIERARCHY ORG UNITS), HR department identifiers
    and name variants (short, long, alphabetical), organization hierarchy area names
    (school area, top level, root), the full HR hierarchy path levels 1-7 (each with
    ID, sort order, and name), and DLC_KEY/DLC_NAME cross-references to departments/labs/centers.
    Joined from FCLT_ORGANIZATION and MASTER_DEPT_HIERARCHY via DLC_KEY to attach
    HR department attributes (title, level, department name, long name, hierarchy
    path) to facilities organizations and DLCs; a single DLC_KEY can map to multiple
    HR org unit rows, so joins via DLC_KEY may fan out.'
  columns:
    HR_ORG_UNIT_KEY:
      desc: Surrogate key of the HR organization unit, formatted 'O' + numeric ID
        (e.g. 'O10000333'); joins to HR_ORG_UNIT_NEW.HR_ORG_UNIT_KEY
    HR_ORG_UNIT_ID:
      desc: Numeric HR organization unit identifier (e.g. '10000333'); cross-referenced
        by FCLT_ORGANIZATION.HR_ORG_UNIT_ID
    HR_ORG_UNIT_TITLE:
      desc: Title of the HR organization unit, e.g. 'Institute for Data, Systems,
        and Society'; reported as the HR org unit title of a facilities organization
        joined via DLC_KEY
    HR_ORG_UNIT_LEVEL:
      desc: 'Level classification of the HR organization unit; observed values: ''ALL
        MIT'', ''TOP LEVEL'', ''DEPARTMENTS'', ''SUB DEPARTMENT'', ''ORGANIZATION
        LEVEL'', ''NON HIERARCHY ORG UNITS'', and null; distinct from the numeric
        ORGANIZATION_LEVEL of FCLT_ORGANIZATION'
    HR_DEPARTMENT_ID:
      desc: Numeric HR department identifier (same value as HR_ORG_UNIT_ID in current
        data); absent from HR_ORG_UNIT_NEW
    HR_DEPARTMENT_CODE:
      desc: HR department code in 'HR-NNNNNN' format, e.g. 'HR-068100'
    HR_DEPARTMENT_CODE_OLD:
      desc: Legacy HR department code (numeric part of HR_DEPARTMENT_CODE), e.g. '68100'
    HR_DEPARTMENT_NAME:
      desc: HR department name, e.g. 'Institute for Data, Systems, and Society'; the
        HR-side counterpart of academic department names, used for grouping/partitioning
        organizations by HR department
    HR_DEPARTMENT_NAME_LONG:
      desc: Long form of the HR department name (often identical to HR_DEPARTMENT_NAME)
    HR_DEPARTMENT_NAME_ALPHA:
      desc: Alphabetical-sort variant of the HR department name
    ORG_HIER_SCHOOL_AREA_NAME:
      desc: Name of the school/area the unit belongs to in the organization hierarchy,
        e.g. 'Schwarzman College of Computing Area', 'VP for Finance Area'
    ORG_HIER_TOP_LEVEL_NAME:
      desc: Name of the top-level area of the unit in the organization hierarchy,
        e.g. 'Provost Area', 'Executive Vice President Area'
    ORG_HIER_ROOT_NAME:
      desc: Root name of the organization hierarchy, 'MIT-All' for all rows
    HR_ORG_LEVEL1_ID:
      desc: ID of the level-1 node (institute root, '10000000') in the HR organization
        hierarchy path
    HR_ORG_LEVEL1_SORT:
      desc: Sort order of the level-1 node in the HR hierarchy path
    HR_ORG_LEVEL1_NAME:
      desc: Name of the level-1 node, 'MIT-All'
    HR_ORG_LEVEL2_ID:
      desc: ID of the level-2 node in the HR organization hierarchy path
    HR_ORG_LEVEL2_SORT:
      desc: Sort order of the level-2 node in the HR hierarchy path
    HR_ORG_LEVEL2_NAME:
      desc: Name of the level-2 node, e.g. 'Provost Area', 'Executive Vice President
        Area'
    HR_ORG_LEVEL3_ID:
      desc: ID of the level-3 node in the HR organization hierarchy path
    HR_ORG_LEVEL3_SORT:
      desc: Sort order of the level-3 node in the HR hierarchy path
    HR_ORG_LEVEL3_NAME:
      desc: Name of the level-3 node, e.g. a school/VP area name
    HR_ORG_LEVEL4_ID:
      desc: ID of the level-4 node in the HR organization hierarchy path
    HR_ORG_LEVEL4_SORT:
      desc: Sort order of the level-4 node in the HR hierarchy path
    HR_ORG_LEVEL4_NAME:
      desc: Name of the level-4 node, e.g. an area/office name
    HR_ORG_LEVEL5_ID:
      desc: ID of the level-5 node in the HR organization hierarchy path
    HR_ORG_LEVEL5_SORT:
      desc: Sort order of the level-5 node in the HR hierarchy path
    HR_ORG_LEVEL5_NAME:
      desc: Name of the level-5 node, e.g. a department/unit name
    HR_ORG_LEVEL6_ID:
      desc: ID of the level-6 node in the HR organization hierarchy path; null when
        the path is shallower; absent from HR_ORG_UNIT_NEW
    HR_ORG_LEVEL6_SORT:
      desc: Sort order of the level-6 node; absent from HR_ORG_UNIT_NEW
    HR_ORG_LEVEL6_NAME:
      desc: Name of the level-6 node; absent from HR_ORG_UNIT_NEW
    HR_ORG_LEVEL7_ID:
      desc: ID of the level-7 (deepest) node in the HR organization hierarchy path;
        absent from HR_ORG_UNIT_NEW
    HR_ORG_LEVEL7_SORT:
      desc: Sort order of the level-7 node; absent from HR_ORG_UNIT_NEW
    HR_ORG_LEVEL7_NAME:
      desc: Name of the level-7 node; absent from HR_ORG_UNIT_NEW
    DLC_KEY:
      desc: Department/Lab/Center key cross-reference, e.g. 'D_IDSS', 'D_OTP'; joins
        to FCLT_ORGANIZATION.DLC_KEY and MASTER_DEPT_HIERARCHY.DLC_KEY; null for units
        without a DLC assignment, and one DLC_KEY may appear on multiple HR org unit
        rows
    DLC_NAME:
      desc: Department/Lab/Center full name cross-reference, e.g. 'Office of Treasury
        and Planning'; may differ from the HR unit title; carried only by HR_ORG_UNIT
        (not HR_ORG_UNIT_NEW); can be used for name-based self-matching of units sharing
        a DLC
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per HR organization unit
- id: HR_ORG_UNIT_NEW
  name: HR_ORG_UNIT_NEW
  desc: 'Newer HR organization unit dimension table: one row per HR organization unit
    with the same unit/department identity and hierarchy-path structure as HR_ORG_UNIT
    (unit key/ID/title/level, HR department code and name variants, school-area/top-level/root
    names, hierarchy path levels 1-5, DLC_KEY) but a shallower hierarchy path (levels
    6-7 absent), no HR_DEPARTMENT_ID and no DLC_NAME column, and an extra HR_DEPARTMENT_ABBR
    abbreviation column. Holds more unit rows than HR_ORG_UNIT (691 vs 641, including
    units absent from HR_ORG_UNIT); use HR_ORG_UNIT when DLC_NAME or the deeper hierarchy
    path is required, HR_ORG_UNIT_NEW for the newer unit coverage.'
  columns:
    HR_ORG_UNIT_KEY:
      desc: Surrogate key of the HR organization unit, formatted 'O' + numeric ID;
        joins to HR_ORG_UNIT.HR_ORG_UNIT_KEY for units present in both feeds
    HR_ORG_UNIT_ID:
      desc: Numeric HR organization unit identifier
    HR_ORG_UNIT_TITLE:
      desc: Title of the HR organization unit, e.g. 'Student Outreach and Support'
    HR_ORG_UNIT_LEVEL:
      desc: 'Level classification of the HR organization unit (same value domain as
        HR_ORG_UNIT.HR_ORG_UNIT_LEVEL: ALL MIT, TOP LEVEL, DEPARTMENTS, SUB DEPARTMENT,
        etc.)'
    HR_DEPARTMENT_CODE:
      desc: HR department code in 'HR-NNNNNN' format
    HR_DEPARTMENT_ABBR:
      desc: HR department abbreviation; carried only by this table, not by HR_ORG_UNIT
    HR_DEPARTMENT_CODE_OLD:
      desc: Legacy numeric HR department code
    HR_DEPARTMENT_NAME:
      desc: HR department name
    HR_DEPARTMENT_NAME_LONG:
      desc: Long form of the HR department name
    HR_DEPARTMENT_NAME_ALPHA:
      desc: Alphabetical-sort variant of the HR department name
    ORG_HIER_SCHOOL_AREA_NAME:
      desc: School/area name of the unit in the organization hierarchy
    ORG_HIER_TOP_LEVEL_NAME:
      desc: Top-level area name of the unit in the organization hierarchy
    ORG_HIER_ROOT_NAME:
      desc: Root name of the organization hierarchy ('MIT-All')
    HR_ORG_LEVEL1_ID:
      desc: ID of the level-1 node (institute root) in the HR hierarchy path
    HR_ORG_LEVEL1_SORT:
      desc: Sort order of the level-1 node
    HR_ORG_LEVEL1_NAME:
      desc: Name of the level-1 node ('MIT-All')
    HR_ORG_LEVEL2_ID:
      desc: ID of the level-2 node in the HR hierarchy path
    HR_ORG_LEVEL2_SORT:
      desc: Sort order of the level-2 node
    HR_ORG_LEVEL2_NAME:
      desc: Name of the level-2 node, e.g. 'Provost Area'
    HR_ORG_LEVEL3_ID:
      desc: ID of the level-3 node in the HR hierarchy path
    HR_ORG_LEVEL3_SORT:
      desc: Sort order of the level-3 node
    HR_ORG_LEVEL3_NAME:
      desc: Name of the level-3 node, e.g. a school/VP area name
    HR_ORG_LEVEL4_ID:
      desc: ID of the level-4 node in the HR hierarchy path
    HR_ORG_LEVEL4_SORT:
      desc: Sort order of the level-4 node
    HR_ORG_LEVEL4_NAME:
      desc: Name of the level-4 node, e.g. an area/office name
    HR_ORG_LEVEL5_ID:
      desc: ID of the level-5 node in the HR hierarchy path
    HR_ORG_LEVEL5_SORT:
      desc: Sort order of the level-5 node
    HR_ORG_LEVEL5_NAME:
      desc: Name of the level-5 node, e.g. a department/unit name; deepest level carried
        by this table (levels 6-7 exist only in HR_ORG_UNIT)
    DLC_KEY:
      desc: Department/Lab/Center key cross-reference, e.g. 'D_MASDAR'; may contain
        composite values like 'D_DSL:HQ'; joins to FCLT_ORGANIZATION.DLC_KEY and MASTER_DEPT_HIERARCHY.DLC_KEY
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per HR organization unit
- id: IAP_SUBJECT_CATEGORY
  name: IAP_SUBJECT_CATEGORY
  desc: IAP subject category lookup table with category name and description. Referenced
    by IAP_SUBJECT_DETAIL via IAP_SUBJECT_CATEGORY_KEY.
  columns:
    IAP_SUBJECT_CATEGORY_KEY:
      desc: Surrogate key of the IAP category; joins to IAP_SUBJECT_DETAIL.IAP_SUBJECT_CATEGORY_KEY
    IAP_CATEGORY_NAME:
      desc: Name of the IAP category
    IAP_CATEGORY_DESC:
      desc: Description of the IAP category
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per IAP category
- id: IAP_SUBJECT_DETAIL
  name: IAP_SUBJECT_DETAIL
  desc: 'Independent Activities Period (IAP) subject detail table: one row per IAP
    activity offered in a January term, with activity title/description, enrollment
    type, maximum enrollment, fee, prerequisites, preregistration deadline, cancellation
    and multiple-session flags, and foreign keys to category, sponsor, session, and
    person tables.'
  columns:
    IAP_SUBJECT_CATEGORY_KEY:
      desc: Foreign key to IAP_SUBJECT_CATEGORY.IAP_SUBJECT_CATEGORY_KEY
    IAP_SUBJECT_SPONSOR_KEY:
      desc: Foreign key to IAP_SUBJECT_SPONSOR.IAP_SUBJECT_SPONSOR_KEY; joins to sponsor
        information
    IAP_SUBJECT_SESSION_KEY:
      desc: Foreign key to IAP_SUBJECT_SESSION.IAP_SUBJECT_SESSION_KEY; joins to session
        details
    IAP_SUBJECT_PERSON_KEY:
      desc: Foreign key to IAP_SUBJECT_PERSON.IAP_SUBJECT_PERSON_KEY
    ACTIVITY_TITLE:
      desc: Title of the IAP activity
    ACTIVITY_DESCRIPTION:
      desc: Description text of the IAP activity
    TERM_CODE:
      desc: Term code in YYYYTT format (IAP terms use 'JA' suffix, e.g. '2021JA');
        joins to ACADEMIC_TERMS/ACADEMIC_TERMS_ALL and TIME_DAY.ACADEMIC_TERM_CODE
    ENROLLMENT_TYPE:
      desc: Enrollment type of the activity, e.g. 'Advance sign-up required'
    MAX_ENROLLMENT:
      desc: Maximum enrollment allowed for the activity; used in enrollment-capacity
        statistics
    ATTENDANCE:
      desc: Attendance information/requirement of the activity
    PREREQUISITES:
      desc: Prerequisite text for the activity
    FEE:
      desc: Fee amount charged for the activity
    FEE_REASON:
      desc: Reason for the fee
    PREREG_DEADLINE:
      desc: Pre-registration deadline date of the activity
    CREATE_DATE:
      desc: Date the activity record was created
    LAST_ACTIVITY_DATE:
      desc: Date of last activity on the record
    IS_MULTIPLE_SESSION:
      desc: '''Y''/''N'' flag whether the activity consists of multiple sessions'
    IS_CANCELLED:
      desc: '''Y''/''N'' flag whether the activity is cancelled'
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per IAP activity per term
  entity:
    columns:
      MAX_ENROLLMENT:
        desc: Maximum enrollment allowed for the activity; null for the majority of
          non-cancelled activities, so enrollment-capacity statistics (average/range/variance
          of max enrollment) typically filter MAX_ENROLLMENT IS NOT NULL together
          with IS_CANCELLED = 'N'.
  reason: Data verification shows MAX_ENROLLMENT is null for most active IAP activities
    (322 of 463 non-cancelled rows); documenting this coverage fact helps downstream
    capacity analyses apply the correct filters, as required by the dw_2737 case.
- id: IAP_SUBJECT_PERSON
  name: IAP_SUBJECT_PERSON
  desc: 'IAP subject person table: one row per person associated with an IAP activity,
    recording the person''s role in the activity (Activity leader, Session leader,
    Contact person), MIT affiliation type, name, location, email, organization, and
    title. Referenced by IAP_SUBJECT_DETAIL via IAP_SUBJECT_PERSON_KEY; used to analyze
    activity leadership and person roles, e.g. enrollment capacity statistics per
    person role.'
  columns:
    IAP_SUBJECT_PERSON_KEY:
      desc: Surrogate key of the IAP person record; joins to IAP_SUBJECT_DETAIL.IAP_SUBJECT_PERSON_KEY.
        One key can carry multiple rows (one per person role), so joins may fan out
        activity rows.
    PERSON_ROLE:
      desc: 'Role of the person in the IAP activity: ''Activity leader'', ''Session
        leader'', or ''Contact person'' (null for a small number of records); used
        as the grouping dimension for person-role statistics.'
    PERSON_MIT_AFFILIATION:
      desc: MIT affiliation type of the person, e.g. Staff, Senior Lecturer, MIT Professor,
        Grad Student, Instruct. Staff, Research Staff, Non-MIT, Other MIT, or student
        class year (Freshman/Sophomore/Junior/Senior).
    PERSON_NAME:
      desc: Full name of the person associated with the IAP activity.
    PERSON_LOCATION:
      desc: Location of the person (often null in current data).
    PERSON_EMAIL:
      desc: Email address of the person (often null in current data).
    PERSON_ORGANIZATION:
      desc: Organization the person belongs to (often null in current data).
    PERSON_TITLE:
      desc: Title of the person (often null in current data).
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date of the record.
  default_granularity: one row per person per role per IAP activity
- id: IAP_SUBJECT_SESSION
  name: IAP_SUBJECT_SESSION
  desc: 'IAP subject session table: session-level details of IAP activities including
    session title, description, location, date, start/end times, and sequence. Referenced
    by IAP_SUBJECT_DETAIL via IAP_SUBJECT_SESSION_KEY.'
  columns:
    IAP_SUBJECT_SESSION_KEY:
      desc: Surrogate key of the IAP session record; joins to IAP_SUBJECT_DETAIL.IAP_SUBJECT_SESSION_KEY
    SESSION_SEQUENCE:
      desc: Sequence number of the session within the activity
    SESSION_TITLE:
      desc: Title of the session
    SESSION_DESCRIPTION:
      desc: Description of the session
    SESSION_LOCATION:
      desc: Location where the session is held; used for location-based partitioning
    SESSION_DATE:
      desc: Date of the session
    SESSION_START_TIME:
      desc: Start time of the session
    SESSION_END_TIME:
      desc: End time of the session
    HAS_SESSION_INFO:
      desc: '''Y''/''N'' flag whether session information is available'
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per IAP session
- id: IAP_SUBJECT_SPONSOR
  name: IAP_SUBJECT_SPONSOR
  desc: IAP subject sponsor table listing sponsors of IAP activities with sponsor
    name and type. Referenced by IAP_SUBJECT_DETAIL via IAP_SUBJECT_SPONSOR_KEY.
  columns:
    IAP_SUBJECT_SPONSOR_KEY:
      desc: Surrogate key of the sponsor record; joins to IAP_SUBJECT_DETAIL.IAP_SUBJECT_SPONSOR_KEY
    SPONSOR_NAME:
      desc: Name of the IAP activity sponsor; unique among non-null values in the
        sponsor table (one row has a null name), so joining activity statistics back
        to sponsors on SPONSOR_NAME does not fan out rows. Can be used as an alternative
        to IAP_SUBJECT_SPONSOR_KEY when matching sponsor aggregates by name.
    SPONSOR_TYPE:
      desc: Type/category of the sponsor
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per IAP sponsor
- id: information_chunks
  name: information_chunks
  desc: 10 columns in total
  columns:
    id:
      desc: '[AUTO_INCREMENT] [PK] Internal unsigned auto-increment primary key of the Chunk and stable association identifier for the external vector index'
    knowledge_base_id:
      desc: '[INDEX] Internal primary key of the KnowledgeBase this Chunk belongs to'
    source_type:
      desc: '[INDEX] Source type of the Chunk body, distinguishing original Document from DP Page'
    source_id:
      desc: Internal primary key of the Document or DP Page determined by source_type
    ordinal:
      desc: Stable zero-based order of the Chunk within its document or page
    content:
      desc: Body text deterministically obtained from the corresponding Markdown and not replaced by a summary
    section_path:
      desc: SectionPath string normalized by article section hierarchy with escaping support
    token_count:
      desc: Non-negative body token count computed by the current processing Tokenizer
    embedding_vector:
      desc: 1024-dimensional OceanBase-native dense vector of the current Chunk
    created_at:
      desc: UTC time when the current Chunk record was created
      default: CURRENT_TIMESTAMP(6)
- id: IR_INSTITUTION
  name: IR_INSTITUTION
  desc: 13 columns in total
  columns:
    INSTITUTION_ID:
      desc: ''
    INSTITUTION_NAME:
      desc: ''
    ALTERNATE_INSTITUTION_NAME:
      desc: ''
    STREET_ADDRESS:
      desc: ''
    CITY:
      desc: ''
    ZIP:
      desc: ''
    STATE:
      desc: ''
    COUNTRY_CODE:
      desc: ''
    COUNTRY:
      desc: ''
    INSTITUTION_CATEGORY_VALUE:
      desc: ''
    INSTITUTION_CATEGORY_LABEL:
      desc: ''
    INSTITUTION_SORT_ORDER:
      desc: ''
    RECORD_CREATED_DATE:
      desc: ''
- id: LIBRARY_COURSE_INSTRUCTOR
  name: LIBRARY_COURSE_INSTRUCTOR
  desc: Library course instructor table recording instructors of courses with library
    reserve materials, including course name, instructor name, department (in 'COURSE_NUMBER
    - Department Name' format), assignment date range, and library organizational
    unit/branch. Referenced by LIBRARY_RESERVE_MATRL_DETAIL via LIBRARY_COURSE_INSTRUCTOR_KEY;
    instructor names resolve to person records via INSTRUCTOR_NAME = SE_PERSON.FULL_NAME.
  columns:
    LIBRARY_COURSE_INSTRUCTOR_KEY:
      desc: Surrogate key; joins to LIBRARY_RESERVE_MATRL_DETAIL.LIBRARY_COURSE_INSTRUCTOR_KEY
    COURSE_NAME:
      desc: Name of the course taught by the instructor
    INSTRUCTOR_NAME:
      desc: Full name of the course instructor as recorded by the library; matches
        SE_PERSON.FULL_NAME for name-based person resolution (e.g. to obtain MIT_ID).
        No surrogate person key exists in this table.
    DEPARTMENT:
      desc: Academic department of the course in 'COURSE_NUMBER - Department Name'
        format (e.g. '18 - Mathematics', '06 - Electrical Eng & Computer Sci', '5
        - Chemistry'); some values carry no course-number prefix (e.g. 'Architecture',
        'Engineering Systems Division'). Different value format from the plain department-name
        columns (DEPARTMENT_NAME / OFFER_DEPT_NAME) in subject offering and lookup
        tables, so filters must use the prefixed form.
    DATE_FROM:
      desc: Start date of the instructor assignment
    DATE_TO:
      desc: End date of the instructor assignment
    UNIT_CODE:
      desc: Code of the library unit (e.g. 'Hayden', 'ENG', 'DEW', 'RTC', 'MUS');
        values are inconsistent and may hold combined multi-unit strings such as 'Hayden
        & ENG', 'DEW & Hayden', '10Hayden', or 'DEW + Hayden'. For clean single-unit
        filtering prefer the UNIT column.
    UNIT:
      desc: Library branch/unit responsible for the reserve material (e.g. 'Hayden',
        'Barker', 'Dewey', 'Rotch', 'Lewis Music'); may be null when the assignment
        spans multiple units, in which case UNIT_CODE may hold a combined value.
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per course instructor assignment
- id: LIBRARY_MATERIAL_STATUS
  name: LIBRARY_MATERIAL_STATUS
  desc: 'Library material status lookup table decoding library material status keys/codes
    used in LIBRARY_RESERVE_MATRL_DETAIL. Holds six statuses where key and code are
    identical: ''U'' = Unknown, ''R'' = (null description), ''N'' = Non-Required Course
    Material, ''O'' = Reserve only, ''X'' = No Required Textbook, ''Y'' = Required
    Course Material.'
  columns:
    LIBRARY_MATERIAL_STATUS_KEY:
      desc: Surrogate key; joins to LIBRARY_RESERVE_MATRL_DETAIL.LIBRARY_MATERIAL_STATUS_KEY
    LIBRARY_MATERIAL_STATUS_CODE:
      desc: Library material status code, e.g. 'U'
    LIBRARY_MATERIAL_STATUS:
      desc: 'Library material status description text: ''Unknown'' (U), ''Non-Required
        Course Material'' (N), ''Reserve only'' (O), ''No Required Textbook'' (X),
        ''Required Course Material'' (Y); NULL for key ''R''. Grouping by this column
        merges statuses sharing the same description.'
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per library material status
- id: LIBRARY_RESERVE_CATALOG
  name: LIBRARY_RESERVE_CATALOG
  desc: 'Library reserve catalog table describing catalog items placed on reserve:
    title, author, publication year, publisher, call number, ISBN, system number,
    record create/update dates, and a record counter. Referenced by LIBRARY_RESERVE_MATRL_DETAIL.'
  columns:
    LIBRARY_RESERVE_CATALOG_KEY:
      desc: Surrogate key of the reserve catalog record; joins to LIBRARY_RESERVE_MATRL_DETAIL.LIBRARY_RESERVE_CATALOG_KEY
    CATALOG_TITLE:
      desc: Title of the catalog item
    CATALOG_AUTHOR_NAME:
      desc: Author name of the catalog item
    CATALOG_YEAR:
      desc: Publication year of the catalog item; used for year-based filtering (e.g.
        > 2000)
    CATALOG_PUBLISHER:
      desc: Publisher of the catalog item
    CATALOG_CALL_NUMBER:
      desc: Library call number of the catalog item
    CATALOG_ISBN:
      desc: ISBN of the catalog item
    CATALOG_SYSTEM_NUMBER:
      desc: Library system number of the catalog record
    CATALOG_RECORD_CREATE_DATE:
      desc: Date the catalog record was created
    CATALOG_RECORD_UPDATE_DATE:
      desc: Date the catalog record was last updated
    RECORD_COUNTER:
      desc: Record counter value of the catalog item; used in average/variance statistics
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per reserve catalog item
- id: LIBRARY_RESERVE_MATRL_DETAIL
  name: LIBRARY_RESERVE_MATRL_DETAIL
  desc: Library reserve material detail bridge table linking reserve catalog items,
    library subject offerings, course instructors, and material status per term. Used
    to count reserved materials per subject and to filter by library material status
    (e.g. 'U').
  columns:
    LIBRARY_COURSE_INSTRUCTOR_KEY:
      desc: Foreign key to LIBRARY_COURSE_INSTRUCTOR.LIBRARY_COURSE_INSTRUCTOR_KEY
        identifying the course instructor
    LIBRARY_RESERVE_CATALOG_KEY:
      desc: Foreign key to LIBRARY_RESERVE_CATALOG.LIBRARY_RESERVE_CATALOG_KEY identifying
        the reserve catalog item
    LIBRARY_SUBJECT_OFFERED_KEY:
      desc: Foreign key to LIBRARY_SUBJECT_OFFERED.LIBRARY_SUBJECT_OFFERED_KEY identifying
        the subject offering
    LIBRARY_MATERIAL_STATUS_KEY:
      desc: 'Library material status key; joins to LIBRARY_MATERIAL_STATUS.LIBRARY_MATERIAL_STATUS_KEY
        for decoding. Value domain (key = code): ''U'' = Unknown, ''R'' = (null description),
        ''N'' = Non-Required Course Material, ''O'' = Reserve only, ''X'' = No Required
        Textbook, ''Y'' = Required Course Material. Distinct from TIP_DETAIL.TIP_MATERIAL_STATUS_KEY,
        which belongs to the textbook program domain.'
    TERM_CODE:
      desc: Term code in YYYYTT format; joins to ACADEMIC_TERMS/ACADEMIC_TERMS_ALL
    SUBJECT_ID:
      desc: Subject identifier, e.g. '18.01'; joins to TIP_DETAIL.SUBJECT_ID and LIBRARY_SUBJECT_OFFERED.SUBJECT_ID
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per reserve material per subject offering per term
- id: LIBRARY_SUBJECT_OFFERED
  name: LIBRARY_SUBJECT_OFFERED
  desc: 'Library subject offered table: subjects offered per term that appear in library
    reserve processing, with subject identity, course number, offering department/school,
    responsible faculty, and enrollment count. Parent of LIBRARY_RESERVE_MATRL_DETAIL
    via LIBRARY_SUBJECT_OFFERED_KEY.'
  columns:
    LIBRARY_SUBJECT_OFFERED_KEY:
      desc: Surrogate key of the library subject offered record; joins to LIBRARY_RESERVE_MATRL_DETAIL.LIBRARY_SUBJECT_OFFERED_KEY
    TERM_CODE:
      desc: Term code in YYYYTT format; joins to ACADEMIC_TERMS/ACADEMIC_TERMS_ALL
    MASTER_COURSE_NUMBER:
      desc: Course number of the master subject
    MASTER_COURSE_NUMBER_SORT:
      desc: Sortable form of the master course number
    MASTER_COURSE_NUMBER_DESC:
      desc: Description of the master course number
    MASTER_SUBJECT_ID:
      desc: Master subject identifier for clustered subjects
    MASTER_SUBJECT_ID_SORT:
      desc: Sortable form of the master subject identifier
    COURSE_NUMBER:
      desc: Course number of the subject as used by the library
    COURSE_NUMBER_SORT:
      desc: Sortable form of the course number
    COURSE_NUMBER_DESC:
      desc: Course number description
    SUBJECT_ID:
      desc: Subject identifier, e.g. '18.01'; joins to TIP_DETAIL.SUBJECT_ID and LIBRARY_RESERVE_MATRL_DETAIL.SUBJECT_ID
    SUBJECT_ID_SORT:
      desc: Sortable form of the subject identifier
    SUBJECT_TITLE:
      desc: Subject title
    OFFER_DEPT_CODE:
      desc: Offering department code
    OFFER_DEPT_NAME:
      desc: Offering department name, e.g. 'Mathematics'
    OFFER_SCHOOL_NAME:
      desc: Offering school name
    RESPONSIBLE_FACULTY_NAME:
      desc: Name of the faculty member responsible for the subject
    RESPONSIBLE_FACULTY_MIT_ID:
      desc: MIT ID of the responsible faculty member
    NUM_ENROLLED_STUDENTS:
      desc: Number of students enrolled in the subject per library records
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per subject per term in library reserve scope
- id: MASTER_DEPT_DCODE_PARENT
  name: MASTER_DEPT_DCODE_PARENT
  desc: 'Department parent lookup table: one row per department code (D_CODE) with
    its department name and the identity of its direct parent department (parent ID,
    parent D code, parent name). A flattened single-level parent view of the department
    tree; use MASTER_DEPT_HIERARCHY when the full multi-level hierarchy path of a
    DLC is required. D_CODE matches MASTER_DEPT_HIERARCHY.DLC_KEY/DLC_CODE and other
    DLC key columns.'
  columns:
    DEPT_ID:
      desc: Numeric identifier of the department
    D_CODE:
      desc: Department code in DLC key format, e.g. 'D_BIOLOGY'; matches MASTER_DEPT_HIERARCHY.DLC_KEY/DLC_CODE
    D_NAME:
      desc: Department name, e.g. 'Biology'
    PARENT_ID:
      desc: Numeric identifier of the direct parent department
    PARENT_D_CODE:
      desc: Code of the direct parent department, e.g. 'D_SCHOOL_SCI'; itself a D_CODE
        value, enabling recursive parent traversal
    PARENT_D_NAME:
      desc: Name of the direct parent department, e.g. 'School of Science'
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per department code with its direct parent
- id: MASTER_DEPT_HIERARCHY
  name: MASTER_DEPT_HIERARCHY
  desc: 'Master department hierarchy table: one row per department/lab/center (DLC)
    under the ''Standard Hierarchy'' hierarchy type, recording the DLC key/code/name
    and its five-level hierarchy path from the institute root (level 1 ''All Departments'')
    through executive areas down to the DLC''s placement, with each level''s code
    and name (null for levels deeper than the DLC''s position). Joins to HR_ORG_UNIT
    and FCLT_ORGANIZATION via DLC_KEY; used to report or filter the master-hierarchy
    placement (school/area path) of a DLC, and as a DLC scope filter when only DLCs
    present in the standard hierarchy should be included.'
  columns:
    HIERARCHY_TYPE:
      desc: Hierarchy classification of the row; only 'Standard Hierarchy' exists
        in current data
    DLC_KEY:
      desc: Department/Lab/Center key, e.g. 'D_CAMPLAN'; joins to HR_ORG_UNIT.DLC_KEY
        and FCLT_ORGANIZATION.DLC_KEY
    DLC_CODE:
      desc: Department/Lab/Center code (same value as DLC_KEY in current data); matches
        MASTER_DEPT_DCODE_PARENT.D_CODE
    DLC_NAME:
      desc: Department/Lab/Center full name, e.g. 'Campus Planning'
    MASTER_DEPT_HIER_LEVEL_1_CODE:
      desc: Code of the level-1 hierarchy node, 'D_ALL' for all rows
    MASTER_DEPT_HIER_LEVEL_1_NAME:
      desc: Name of the level-1 hierarchy node, 'All Departments'
    MASTER_DEPT_HIER_LEVEL_2_CODE:
      desc: Code of the level-2 hierarchy node, e.g. 'D_EXECVP_AREA'
    MASTER_DEPT_HIER_LEVEL_2_NAME:
      desc: Name of the level-2 hierarchy node, e.g. "Executive Vice President's Area"
    MASTER_DEPT_HIER_LEVEL_3_CODE:
      desc: Code of the level-3 hierarchy node; null when the DLC's path is shallower
        than 3 levels
    MASTER_DEPT_HIER_LEVEL_3_NAME:
      desc: Name of the level-3 hierarchy node, e.g. 'VP Finance Area'; null for shallow
        paths
    MASTER_DEPT_HIER_LEVEL_4_CODE:
      desc: Code of the level-4 hierarchy node; null for shallow paths
    MASTER_DEPT_HIER_LEVEL_4_NAME:
      desc: Name of the level-4 hierarchy node; null for shallow paths
    MASTER_DEPT_HIER_LEVEL_5_CODE:
      desc: Code of the level-5 (deepest) hierarchy node; null for shallow paths
    MASTER_DEPT_HIER_LEVEL_5_NAME:
      desc: Name of the level-5 (deepest) hierarchy node; null for shallow paths
  default_granularity: one row per DLC under the standard hierarchy type
- id: MASTER_DEPT_HIERARCHY_LINKS
  name: MASTER_DEPT_HIERARCHY_LINKS
  desc: 'Master department hierarchy link table: one row per association between a
    department/lab/center (DLC) and a linked administrative object, classified by
    link type (Standard Funds Center, PCMIT-0 Profit Center, New/Old Org. Unit, Facilities
    Org., Student Systems Unit, NIMBUS B.A.G.). A DLC may hold many links of several
    types. Joins to MASTER_DEPT_HIERARCHY via DLC_KEY; used to map DLCs to their fund
    centers, profit centers, facilities organizations, and other linked object codes.'
  columns:
    HIERARCHY_TYPE:
      desc: Hierarchy classification of the row; only 'Standard Hierarchy' exists
        in current data
    LINK_TYPE_CODE:
      desc: 'Short code of the link type: ''FC'' Standard Funds Center, ''PMIT'' PCMIT-0
        Profit Center, ''ORG2'' New Org. Unit, ''ORGU'' Old Org. Unit, ''FORG'' Facilities
        Org., ''SIS'' Student Systems Unit, ''BAG'' NIMBUS B.A.G.'
    LINK_TYPE:
      desc: Full name of the link type corresponding to LINK_TYPE_CODE
    DLC_KEY:
      desc: Department/Lab/Center key of the linking DLC, e.g. 'D_MPC'; joins to MASTER_DEPT_HIERARCHY.DLC_KEY
    DLC_CODE:
      desc: Department/Lab/Center code (same value as DLC_KEY in current data)
    LINKED_OBJECT_KEY:
      desc: Key of the linked administrative object, e.g. a fund center key 'FC100071'
        or profit center key
    LINKED_OBJECT_CODE:
      desc: Code of the linked administrative object (same value as LINKED_OBJECT_KEY
        in current data)
  default_granularity: one row per DLC-to-linked-object association
- id: MIT_HOLIDAY_CLOSING_CALENDAR
  name: MIT_HOLIDAY_CLOSING_CALENDAR
  desc: 4 columns in total
  columns:
    HOLIDAY_CLOSING_DATE:
      desc: ''
    HOLIDAY_CLOSING_DESCRIPTION:
      desc: ''
    HOLIDAY_CLOSING_TYPE:
      desc: ''
    WAREHOUSE_LOAD_DATE:
      desc: ''
- id: MIT_STUDENT_DIRECTORY
  name: MIT_STUDENT_DIRECTORY
  desc: 'Student directory table: one row per student with name components, full name,
    office location and phone, email address, department code and department name,
    and student year. The DEPARTMENT column stores the academic department code and
    joins to SIS_DEPARTMENT.DEPARTMENT_CODE, enabling per-department student counts.'
  columns:
    FIRST_NAME:
      desc: Student first name
    MIDDLE_NAME:
      desc: Student middle name
    LAST_NAME:
      desc: Student last name
    FULL_NAME:
      desc: Full name in 'Last, First M.' format; counted distinctly for per-department
        student counts
    OFFICE_LOCATION:
      desc: Building-room office/desk location of the student; same building-room
        identifier format as EMPLOYEE_DIRECTORY.OFFICE_LOCATION and FCLT_ROOMS.BUILDING_ROOM
    OFFICE_PHONE:
      desc: Student office phone number stored as a numeric value; used in per-department
        phone average/stddev statistics, typically filtered with OFFICE_PHONE IS NOT
        NULL since many students have no office phone
    EMAIL_ADDRESS:
      desc: Student email address
    DEPARTMENT:
      desc: Academic department code the student belongs to; joins to SIS_DEPARTMENT.DEPARTMENT_CODE
    DEPARTMENT_NAME:
      desc: Academic department name of the student, e.g. 'Materials Science and Eng',
        'Electrical Eng & Computer Sci'; shares the academic name domain with SIS_DEPARTMENT.DEPARTMENT_NAME,
        but SE_PERSON.ORGANIZATION may use a different naming variant (e.g. 'Electrical
        Engineering-Computer Science') for the same unit
    STUDENT_YEAR:
      desc: Student year/level code, e.g. 'G' for graduate
    FULL_NAME_UPPERCASE:
      desc: Uppercase full name
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per student
- id: MOIRA_LIST
  name: MOIRA_LIST
  desc: 'Moira mailing-list/group master table: one row per list with list key, name,
    description, active flag, and type flags (mailing list, group, NFS group, public,
    hidden). Parent of MOIRA_LIST_DETAIL via MOIRA_LIST_KEY.'
  columns:
    MOIRA_LIST_KEY:
      desc: Unique list identifier; joins to MOIRA_LIST_DETAIL.MOIRA_LIST_KEY
    MOIRA_LIST_NAME:
      desc: Name of the Moira list
    MOIRA_LIST_DESCRIPTION:
      desc: Description of the list
    IS_ACTIVE:
      desc: Flag whether the list is active
    IS_MOIRA_MAILING_LIST:
      desc: Flag whether the list is a mailing list
    IS_MOIRA_GROUP:
      desc: Flag whether the list is a Moira group
    IS_NFS_GROUP:
      desc: Flag whether the list is an NFS group
    IS_PUBLIC:
      desc: Flag whether the list is public
    IS_HIDDEN:
      desc: Flag whether the list is hidden
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date of the list record
  default_granularity: one row per Moira list
- id: MOIRA_LIST_DETAIL
  name: MOIRA_LIST_DETAIL
  desc: 'Moira mailing-list/group membership detail table: one row per list member
    with the list key, list owner key, member login, member full name, member MIT
    ID, last update date, and a counter. Used to find which Moira lists a person belongs
    to (joining EMPLOYEE_DIRECTORY on MOIRA_LIST_MEMBER_MIT_ID = MIT_ID), and to decode
    list identity via MOIRA_LIST and ownership via MOIRA_LIST_OWNER.'
  columns:
    MOIRA_LIST_KEY:
      desc: Foreign key to MOIRA_LIST.MOIRA_LIST_KEY identifying the list/group
    MOIRA_LIST_OWNER_KEY:
      desc: Foreign key to MOIRA_LIST_OWNER.MOIRA_LIST_OWNER_KEY identifying the list
        owner
    MOIRA_LIST_MEMBER:
      desc: Member login/account name on the list; joins to EMPLOYEE_DIRECTORY.KRB_NAME
        to match members by Kerberos login (alternative to the MIT_ID-based join via
        MOIRA_LIST_MEMBER_MIT_ID)
    MOIRA_LIST_MEMBER_FULL_NAME:
      desc: Full name of the list member
    MOIRA_LIST_MEMBER_MIT_ID:
      desc: MIT ID of the list member; joins to EMPLOYEE_DIRECTORY.MIT_ID (null for
        non-person members)
    LAST_UPDATE_DATE:
      desc: Date the membership record was last updated, stored as a DD-MON-YY string
        (e.g. '18-DEC-24', '01-JAN-15'); equality/range filters are applied directly
        on this string representation
    COUNTER:
      desc: Record counter
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per list member
- id: MOIRA_LIST_OWNER
  name: MOIRA_LIST_OWNER
  desc: 'Moira list owner lookup table: one row per owner entity that can own a Moira
    list or membership record, with the owner key, owner name, and owner type classification
    (LIST = another Moira list owns it, USER = a user owns it, KERBEROS = a Kerberos
    principal owns it). Referenced by MOIRA_LIST_DETAIL via MOIRA_LIST_OWNER_KEY to
    decode who owns a list membership; for LIST-type owners the OWNER name matches
    a MOIRA_LIST.MOIRA_LIST_NAME.'
  columns:
    MOIRA_LIST_OWNER_KEY:
      desc: Unique owner key (e.g. 'LIST<owner name>' for list-type owners); joins
        to MOIRA_LIST_DETAIL.MOIRA_LIST_OWNER_KEY
    OWNER:
      desc: Name of the owning entity; for OWNER_TYPE 'LIST' it equals the owning
        Moira list's MOIRA_LIST_NAME
    OWNER_TYPE:
      desc: 'Type of the owner: ''LIST'' (another Moira list), ''USER'' (a user),
        or ''KERBEROS'' (a Kerberos principal)'
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per Moira list owner entity
- id: OPA_PERSON_CURRENT
  name: OPA_PERSON_CURRENT
  desc: 'Current-person snapshot table from the OPA (Office of People Analytics) feed:
    one row per current person keyed by MIT_ID with name components, email, HR job
    attributes (job id/title, admin employee type, HR department, org unit and position
    titles, payroll rank), faculty flag, employment percent, privacy flags, sabbatical
    begin/end dates, and personnel subarea. Used for HR/appointment analysis of current
    people; carries no office phone or office location.'
