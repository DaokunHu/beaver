- id: join_lso_ata
  source_entity_type: table
  source_entity_id: LIBRARY_SUBJECT_OFFERED
  target_entity_type: table
  target_entity_id: ACADEMIC_TERMS_ALL
  relation_type: joins
  desc: LIBRARY_SUBJECT_OFFERED joins ACADEMIC_TERMS_ALL on TERM_CODE to attach extended
    term attributes (academic year, academic year description, term description) to
    library subject offerings.
