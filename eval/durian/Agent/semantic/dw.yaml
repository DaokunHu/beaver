    target_column: DEPARTMENT_CODE
  - source_column: OFFER_DEPT_NAME
    target_column: DEPARTMENT_NAME
- id: join_ccc_ccso
  source_entity_type: table
  source_entity_id: CIS_COURSE_CATALOG
  target_entity_type: table
  target_entity_id: COURSE_CATALOG_SUBJECT_OFFERED
  relation_type: joins
  desc: CIS_COURSE_CATALOG joins COURSE_CATALOG_SUBJECT_OFFERED on SUBJECT_ID (and
