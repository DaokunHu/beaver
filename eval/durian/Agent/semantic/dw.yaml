version: 1
database: dw
tables:
- id: ACADEMIC_TERM_PARAMETER
  name: ACADEMIC_TERM_PARAMETER
  desc: Term parameter reference table holding exactly three rows that identify the
    SIS current term, previous term, and upcoming term, each with its term code, description,
    start/end dates and the last day before the next term. Used to resolve relative
    term references ('C', 'P', 'F') to concrete term codes.
  columns:
    TERM_PARAMETER:
      desc: 'Parameter name: ''SIS_CURRENT_TERM'', ''SIS_PREVIOUS_TERM'', or ''SIS_UPCOMING_TERM'''
    TERM_INDICATOR:
      desc: 'Term indicator: ''C''=current term, ''P''=previous term, ''F''=future/upcoming
        term'
    TERM_CODE:
      desc: Term code the parameter resolves to, e.g. '2025FA'; joins to ACADEMIC_TERMS.TERM_CODE
    TERM_DESCRIPTION:
      desc: Term description, e.g. 'Fall Term 2024-2025'
    TERM_START_DATE:
      desc: Start date of the referenced term
    TERM_END_DATE:
      desc: End date of the referenced term
    TERM_LAST_DAY_BEFORE_NEXT_TERM:
      desc: Last calendar day before the next term begins
    IS_CURRENT_TERM:
      desc: '''Y''/''N'' flag indicating whether the referenced term is the current
        term'
  default_granularity: one row per term parameter (current/previous/upcoming)
- id: ACADEMIC_TERMS
  name: ACADEMIC_TERMS
  desc: 'Academic term dimension table describing each academic term''s calendar and
    status attributes: term code/description, start/end dates, academic year, financial
    aid year, degree year, key registration and class dates, and term status classification
    (Previous/Current/Future, regular vs non-regular term). Used to filter and enrich
    subject offerings by term characteristics.'
  columns:
    ACADEMIC_TERMS_KEY:
      desc: Surrogate key of the academic term record; joins to ACADEMIC_TERMS_ALL.ACADEMIC_TERMS_KEY
    TERM_CODE:
      desc: Term code in YYYYTT format, e.g. '2025FA' (FA=Fall, SP=Spring, JA=January/IAP,
        SU=Summer)
    TERM_DESCRIPTION:
      desc: Human-readable term description, e.g. 'Fall Term 2024-2025'
    TERM_SELECTOR:
      desc: Term selector label used for picklists
    TERM_START_DATE:
      desc: Term start date; can match TIME_DAY.CALENDAR_DATE for calendar-based joins
    TERM_END_DATE:
      desc: Term end date
    ACADEMIC_YEAR:
      desc: Academic year the term belongs to, e.g. 2025
    ACADEMIC_YEAR_DESC:
      desc: Academic year description text
    IS_CURRENT_TERM:
      desc: '''Y''/''N'' flag indicating whether the term is the current term'
    IS_REGULAR_TERM:
      desc: '''Y''/''N'' flag indicating a regular term (Fall/Spring) versus non-regular
        terms (Summer, January/IAP); only present in ACADEMIC_TERMS, not in ACADEMIC_TERMS_ALL'
    TERM_STATUS_INDICATOR:
      desc: 'Single-character term status indicator: ''P''=Previous, ''C''=Current,
        ''F''=Future, ''None''=Unspecified'
    TERM_STATUS:
      desc: 'Term status text: ''Previous'', ''Current'', ''Future'', or ''Unspecified'''
    FINANCIAL_AID_YEAR:
      desc: Financial aid year the term maps to
    DEGREE_YEAR:
      desc: Degree year the term maps to; used in degree-year statistics
    LAST_DAY_OF_FINAL_EXAM:
      desc: Last day of final exams for the term
    PRE_REGISTRATION_START_DAY:
      desc: First day of pre-registration for the term
    REGISTRATION_DAY:
      desc: Registration day for the term
    FIRST_DAY_OF_CLASSES:
      desc: First day of classes in the term
    LAST_DAY_OF_CLASSES:
      desc: Last day of classes in the term
    ADD_DATE:
      desc: Last day to add a subject in the term; only present in ACADEMIC_TERMS
    DROP_DATE:
      desc: Last day to drop a subject in the term; only present in ACADEMIC_TERMS
    GRADUATE_AWARD_START_DATE:
      desc: Start date of the graduate award period for the term
    GRADUATE_AWARD_END_DATE:
      desc: End date of the graduate award period for the term
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date of the record
  default_granularity: one row per academic term
- id: ACADEMIC_TERMS_ALL
  name: ACADEMIC_TERMS_ALL
  desc: Extended academic term dimension table covering all terms known to the warehouse
    (a superset of ACADEMIC_TERMS, including terms without full status tracking).
    Shares term calendar attributes (term code, dates, academic year, financial aid
    year, degree year, registration and class dates) but does not carry IS_REGULAR_TERM,
    TERM_STATUS, ADD_DATE or DROP_DATE columns.
  columns:
    ACADEMIC_TERMS_KEY:
      desc: Surrogate key of the academic term record; joins to ACADEMIC_TERMS.ACADEMIC_TERMS_KEY
    TERM_CODE:
      desc: Term code in YYYYTT format, e.g. '2019FA'
    TERM_DESCRIPTION:
      desc: Human-readable term description
    TERM_SELECTOR:
      desc: Term selector label used for picklists
    TERM_START_DATE:
      desc: Term start date
    TERM_END_DATE:
      desc: Term end date
    ACADEMIC_YEAR:
      desc: Academic year the term belongs to
    ACADEMIC_YEAR_DESC:
      desc: Academic year description text
    IS_CURRENT_TERM:
      desc: '''Y''/''N'' flag indicating whether the term is the current term'
    TERM_STATUS_INDICATOR:
      desc: 'Single-character term status indicator: ''P''=Previous, ''C''=Current,
        ''F''=Future, ''None''=Unspecified'
    FINANCIAL_AID_YEAR:
      desc: Financial aid year the term maps to; used to partition running sums by
        financial aid year
    DEGREE_YEAR:
      desc: Degree year the term maps to
    LAST_DAY_OF_FINAL_EXAM:
      desc: Last day of final exams for the term
    PRE_REGISTRATION_START_DAY:
      desc: First day of pre-registration for the term
    REGISTRATION_DAY:
      desc: Registration day for the term
    FIRST_DAY_OF_CLASSES:
      desc: First day of classes in the term
    LAST_DAY_OF_CLASSES:
      desc: Last day of classes in the term
    GRADUATE_AWARD_START_DATE:
      desc: Start date of the graduate award period
    GRADUATE_AWARD_END_DATE:
      desc: End date of the graduate award period
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date of the record
  default_granularity: one row per academic term (all terms)
- id: alembic_version
  name: alembic_version
  desc: 1 columns in total
  columns:
    version_num:
      desc: '[PK]'
- id: binding_action_profiles
  name: binding_action_profiles
  desc: 9 columns in total
  columns:
    id:
      desc: '[AUTO_INCREMENT] [PK] Internal auto-increment primary key of the Action Binding Profile'
    action_id:
      desc: '[INDEX] Internal identifier of the stable Action the Profile belongs to'
    name:
      desc: Profile name, unique within the same Action and deployment scope
    environment:
      desc: Explicit deployment environment the Profile belongs to
    region:
      desc: Explicit deployment region the Profile belongs to
    current_revision_id:
      desc: '[INDEX] Identifier of the single Binding Revision currently in effect for the Profile'
    version:
      desc: Optimistic lock version of the Profile current pointer
      default: '1'
    created_at:
      desc: UTC time when the Profile was created
    updated_at:
      desc: UTC time of the most recent change to the Profile current pointer
- id: binding_action_revisions
  name: binding_action_revisions
  desc: 18 columns in total
  columns:
    id:
      desc: '[AUTO_INCREMENT] [PK] Internal auto-increment primary key of the Action Binding Revision'
    profile_id:
      desc: '[INDEX] Identifier of the stable Binding Profile the Revision belongs to'
    previous_revision_id:
      desc: '[INDEX] Identifier of the previous current Revision of the same Profile before publication'
    publication_key:
      desc: Publication idempotency key within the Profile
    content_hash:
      desc: SHA-256 digest of the canonical Binding Plan excluding publication control fields
    schema_version:
      desc: Binding Plan schema version
    action_id:
      desc: Frozen reference to the stable Action identifier
    action_revision_id:
      desc: '[INDEX] Frozen reference to the exact Action Revision identifier'
    operation_id:
      desc: Frozen reference to the stable Physical Operation identifier
    operation_revision_id:
      desc: '[INDEX] Frozen reference to the exact Operation Revision identifier'
    service_id:
      desc: Frozen reference to the stable Physical Service identifier
    service_revision_id:
      desc: '[INDEX] Frozen reference to the exact Service Revision identifier'
    environment:
      desc: Explicit deployment environment the Binding Revision belongs to
    region:
      desc: Explicit deployment region the Binding Revision belongs to
    plan_document:
      desc: Full Action Binding Plan JSON validated by the Domain
    validation_document:
      desc: Canonical JSON of per-item compatibility checks and issues at publication time
    document_size_bytes:
      desc: Total UTF-8 byte size of the Plan and validation report canonical JSON
    activated_at:
      desc: UTC time when the Revision was atomically switched to current
- id: binding_physical_logical_datatypes
  name: binding_physical_logical_datatypes
  desc: 7 columns in total
  columns:
    id:
      desc: '[AUTO_INCREMENT] [PK] Internal auto-increment primary key of the Logical DatatypeProperty Binding'
    revision_id:
      desc: '[INDEX] Internal identifier of the Binding Revision it belongs to'
    property_id:
      desc: '[INDEX] Internal identifier of the bound Semantic DatatypeProperty'
    property_version:
      desc: Optimistic lock version of the Semantic DatatypeProperty at publication time
    view_id:
      desc: '[INDEX] Internal identifier of the Domain Class Logical View'
    field_id:
      desc: Internal identifier of the mapped Logical View Output Field
    validation_fingerprint:
      desc: SHA-256 digest of the Physical structural facts related to the logical field
- id: binding_physical_logical_evidence
  name: binding_physical_logical_evidence
  desc: 11 columns in total
  columns:
    id:
      desc: '[AUTO_INCREMENT] [PK] Internal auto-increment primary key of the Logical View Validation Evidence'
    revision_id:
      desc: '[UNIQUE] Internal identifier of the single Binding Revision it belongs to'
    required:
      desc: Whether real source-data validation was performed
    validated_at:
      desc: UTC time when static or real source-data validation completed
    expires_at:
      desc: UTC time when the real source-data evidence expires; empty for static evidence
    plan_content_hash:
      desc: SHA-256 digest of the canonicalized Binding Plan this evidence corresponds to
    identity_null_count:
      desc: Number of records violating the Identity null policy
      default: '0'
    attribute_conflict_count:
      desc: Number of issues where the same Identity has inconsistent attribute values
      default: '0'
    join_amplification_count:
      desc: Number of issues where joins make Identity results ambiguous
      default: '0'
    cardinality_violation_count:
      desc: Number of issues where explicit field relationships violate the declared cardinality
      default: '0'
    source_watermark:
      desc: Validation-time watermark that the source Runtime can provide
- id: binding_physical_logical_fields
  name: binding_physical_logical_fields
  desc: 7 columns in total
  columns:
    id:
      desc: '[AUTO_INCREMENT] [PK] Internal auto-increment primary key of the Logical View Output Field'
    view_id:
      desc: '[INDEX] Internal identifier of the logical view'
    ordinal_position:
      desc: One-based ordinal position of the output field
    field_key:
      desc: Field key, unique within the view
    source_alias:
      desc: Scan alias the field comes from
    column_object_id:
      desc: '[INDEX] Stable object identifier of the Physical Column directly referenced by the field'
    identity_ordinal:
      desc: One-based position of the field within the Identity; empty means it is not an Identity field
- id: binding_physical_logical_join_pairs
  name: binding_physical_logical_join_pairs
  desc: 5 columns in total
  columns:
    id:
      desc: '[AUTO_INCREMENT] [PK] Internal auto-increment primary key of the Logical View Join Column Pair'
    join_id:
      desc: '[INDEX] Internal identifier of the logical Join'
    ordinal_position:
      desc: One-based ordinal position of the column pair
    left_column_object_id:
      desc: Stable object identifier of the left-input Physical Column
    right_column_object_id:
      desc: Stable object identifier of the right-input Physical Column
- id: binding_physical_logical_joins
  name: binding_physical_logical_joins
  desc: 7 columns in total
  columns:
    id:
      desc: '[AUTO_INCREMENT] [PK] Internal auto-increment primary key of the Logical View Join'
    view_id:
      desc: '[INDEX] Internal identifier of the logical view'
    ordinal_position:
      desc: One-based ordinal position of the Join
    join_kind:
      desc: inner or left
    left_alias:
      desc: Alias of the Join's left input
    right_alias:
      desc: Alias of the Join's right input
    foreign_key_object_id:
      desc: '[INDEX] Optional stable object identifier of a real Physical Foreign Key'
- id: binding_physical_logical_object_pairs
  name: binding_physical_logical_object_pairs
  desc: 5 columns in total
  columns:
    id:
      desc: '[AUTO_INCREMENT] [PK] Internal auto-increment primary key of the Logical Object Field Pair'
    object_binding_id:
      desc: '[INDEX] Internal identifier of the Logical ObjectProperty Binding it belongs to'
    ordinal_position:
      desc: One-based ordinal position of the field pair
    domain_field_id:
      desc: Internal identifier of the Domain Logical View Output Field
    range_field_id:
      desc: Internal identifier of the Range Logical View Output Field
- id: binding_physical_logical_objects
  name: binding_physical_logical_objects
  desc: 11 columns in total
  columns:
    id:
      desc: '[AUTO_INCREMENT] [PK] Internal auto-increment primary key of the Logical ObjectProperty Binding'
    revision_id:
      desc: '[INDEX] Internal identifier of the Binding Revision it belongs to'
    property_id:
      desc: '[INDEX] Internal identifier of the bound Semantic ObjectProperty'
    property_version:
      desc: Optimistic lock version of the Semantic ObjectProperty at publication time
    domain_view_id:
      desc: Internal identifier of the Domain Class Logical View
    range_view_id:
      desc: Internal identifier of the Range Class Logical View
    implementation:
      desc: 'Implementation type: physical_foreign_key or field_pairs'
    foreign_key_object_id:
      desc: '[INDEX] Stable object identifier of the real Physical Foreign Key'
    orientation:
      desc: Semantic direction relative to the Physical Foreign Key direction
    cardinality:
      desc: Relationship cardinality declared by the field_pairs implementation
    validation_fingerprint:
      desc: SHA-256 digest of the logical relationship endpoints, ordering, cardinality, and Physical facts
- id: binding_physical_logical_scans
  name: binding_physical_logical_scans
  desc: 5 columns in total
  columns:
    id:
      desc: '[AUTO_INCREMENT] [PK] Internal auto-increment primary key of the Logical View Scan'
    view_id:
      desc: '[INDEX] Internal identifier of the logical view'
    ordinal_position:
      desc: One-based ordinal position of the Scan
    alias:
      desc: Input alias, unique within the view
    relation_object_id:
      desc: '[INDEX] Stable object identifier of the Physical Relation'
- id: binding_physical_logical_views
  name: binding_physical_logical_views
  desc: 10 columns in total
  columns:
    id:
      desc: '[AUTO_INCREMENT] [PK] Internal auto-increment primary key of the Class Logical View'
    revision_id:
      desc: '[INDEX] Internal identifier of the Binding Revision it belongs to'
    view_key:
      desc: Logical view key, stable and unique within the Revision
    class_id:
      desc: '[INDEX] Internal identifier of the Semantic Class being implemented'
    class_version:
      desc: Optimistic lock version of the Semantic Class at publication time
    identity_kind:
      desc: 'Identity kind: physical_key or logical_key'
    identity_null_policy:
      desc: 'Policy for Identity nulls: reject or exclude'
    identity_key_object_id:
      desc: Stable object identifier of the Physical Key referenced by the physical_key Identity
    filter_json:
      desc: Domain-validated controlled Filter AST JSON; contains no SQL
    validation_fingerprint:
      desc: SHA-256 digest of the Physical structural facts referenced by the view
- id: binding_physical_profiles
  name: binding_physical_profiles
  desc: 7 columns in total
  columns:
    id:
      desc: '[AUTO_INCREMENT] [PK] Internal auto-increment primary key of the Physical Binding Profile'
    ontology_id:
      desc: '[INDEX] Internal identifier of the bound Semantic Ontology'
    source_id:
      desc: Opaque external identifier of the bound Physical data source
    current_revision_id:
      desc: '[INDEX] Internal identifier of the currently atomically activated Physical Binding Revision; empty means deactivated'
    version:
      desc: Optimistic lock version number used for concurrent updates of the Profile current pointer
    created_at:
      desc: UTC creation time of the Profile
    updated_at:
      desc: UTC time of the most recent change to the Profile current pointer
- id: binding_physical_revisions
  name: binding_physical_revisions
  desc: 8 columns in total
  columns:
    id:
      desc: '[AUTO_INCREMENT] [PK] Internal auto-increment primary key of the Physical Binding Revision'
    profile_id:
      desc: '[INDEX] Internal identifier of the Physical Binding Profile this revision belongs to'
    previous_revision_id:
      desc: '[INDEX] Internal identifier of the previous current Revision of the same Profile before activation'
    publication_key:
      desc: Publication idempotency key provided by the caller within the same Profile
    content_hash:
      desc: SHA-256 digest computed by the server over the canonicalized full Binding Plan
    semantic_content_hash:
      desc: SHA-256 digest of the binding-related content of the Semantic elements referenced at publication time
    validated_physical_revision_id:
      desc: '[INDEX] Internal identifier of the Physical Catalog Revision used when this mapping completed validation'
    activated_at:
      desc: UTC time when this Binding Revision was successfully atomically activated
- id: BUILDINGS
  name: BUILDINGS
  desc: 'Space-domain building lookup table: one row per building with building key/number,
    building name, street and mailing addresses as single text fields, gross and assignable
    square footage (in square feet), and a building counter. Referenced by SPACE_DETAIL
    via BUILDING_KEY; a lightweight building reference for space-assignment reporting,
    without the type/ownership/site classification carried by FCLT_BUILDING or FAC_BUILDING.'
  columns:
    BUILDING_KEY:
      desc: Building key (same value as BUILDING_NUMBER, e.g. 'NW32'); joins to SPACE_DETAIL.BUILDING_KEY
        and matches FCLT_BUILDING.FCLT_BUILDING_KEY value domain
    BUILDING_NUMBER:
      desc: Building number/code, e.g. 'NW35'
    BUILDING_NAME:
      desc: Building name, e.g. 'Ashdown House'; may be a generic 'BUILDING <number>'
        placeholder
    BUILDING_STREET_ADDRESS:
      desc: Full street address as a single text field, e.g. '235 ALBANY ST'
    BUILDING_MAILING_ADDRESS:
      desc: Mailing address as a single text field; often null
    BLDG_GROSS_SQUARE_FOOTAGE:
      desc: 'Gross square footage of the building in square feet (note: FCLT_BUILDING.EXT_GROSS_AREA
        is in square meters)'
    BLDG_ASSIGNABLE_SQUARE_FOOTAGE:
      desc: Assignable square footage of the building in square feet
    BUILDING_COUNTER:
      desc: Record counter; equals 1 for every building row
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per building
- id: CIP
  name: CIP
  desc: 'Classification of Instructional Programs (CIP) lookup table: one row per
    six-digit CIP program code, classifying instructional programs into a two-digit
    category and a four-digit series, with program/category/four-digit titles, a change
    note, the CIP revision version year (1990/2000/2010/2020), and the warehouse load
    date. Joins to SIS_COURSE_DESCRIPTION via PROGRAM_CODE = CIP_PROGRAM_CODE to attribute
    courses to CIP programs, categories, and schools/departments; CIP_WITH_VERSION
    is the multi-version variant keeping every revision of each program code.'
  columns:
    PROGRAM_CODE:
      desc: Six-digit CIP program code (indexed); joins to SIS_COURSE_DESCRIPTION.CIP_PROGRAM_CODE
        and CIP_WITH_VERSION.PROGRAM_CODE
    PROGRAM_TITLE:
      desc: Title of the instructional program, e.g. 'Agricultural Economics'
    CATEGORY_CODE:
      desc: Two-digit CIP category code grouping related programs, e.g. '13' for EDUCATION
    CATEGORY_TITLE:
      desc: Title of the two-digit CIP category, e.g. 'EDUCATION'; used as a grouping
        dimension for program-category statistics
    FOUR_DIGIT_CODE:
      desc: Four-digit CIP series code between category and program, e.g. '1313'
    FOUR_DIGIT_TITLE:
      desc: Title of the four-digit CIP series, e.g. 'Teacher Education and Professional
        Development, Specific Subject Areas'
    NOTE:
      desc: Change note of the program code in its CIP version, e.g. '(2020) No substantive
        changes' or 'None'; only present in CIP, not in CIP_WITH_VERSION
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date of the record in DD-MON-YY format
    VERSION:
      desc: CIP revision version year of the program code (1990, 2000, 2010, or 2020);
        each program code appears once with the version it belongs to, so version
        filters like VERSION > 2000 select programs classified in later CIP revisions
  default_granularity: one row per CIP program code
- id: CIP_WITH_VERSION
  name: CIP_WITH_VERSION
  desc: 'Versioned Classification of Instructional Programs (CIP) lookup table: one
    row per CIP program code per revision version year (1990/2000/2010/2020), preserving
    the historical classification of each program across CIP revisions. Carries the
    same program/category/four-digit code and title attributes as CIP plus a surrogate
    key, but no NOTE column and fewer distinct program codes than CIP. Joins to SIS_COURSE_DESCRIPTION
    via PROGRAM_CODE = CIP_PROGRAM_CODE (matching more course rows than CIP because
    a program code can appear under several versions); use CIP when one row per program
    code is required.'
  columns:
    CIP_WITH_VERSION_KEY:
      desc: Surrogate key of the versioned CIP record (program code concatenated with
        version year)
    VERSION:
      desc: CIP revision version year (1990, 2000, 2010, or 2020); the same PROGRAM_CODE
        can appear under multiple versions
    PROGRAM_CODE:
      desc: Six-digit CIP program code; joins to SIS_COURSE_DESCRIPTION.CIP_PROGRAM_CODE
        and CIP.PROGRAM_CODE
    PROGRAM_TITLE:
      desc: Title of the instructional program in that CIP version
    CATEGORY_CODE:
      desc: Two-digit CIP category code in that CIP version
    CATEGORY_TITLE:
      desc: Title of the two-digit CIP category in that CIP version
    FOUR_DIGIT_CODE:
      desc: Four-digit CIP series code in that CIP version
    FOUR_DIGIT_TITLE:
      desc: Title of the four-digit CIP series in that CIP version
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date of the record in DD-MON-YY format
  default_granularity: one row per CIP program code per version year
- id: CIS_COURSE_CATALOG
  name: CIS_COURSE_CATALOG
  desc: 'CIS course catalog table: an alternative course catalog source with the same
    subject attribute structure as COURSE_CATALOG_SUBJECT_OFFERED (units, grading,
    requirement attributes, offering flags), keyed by academic year, term code, and
    subject identity. Joins to SIS_SUBJECT_CODE via DEPARTMENT_CODE for subject code
    resolution.'
  columns:
    IS_OFFERED_FALL_TERM:
      desc: '''Y''/''N'' flag whether offered in the fall term'
    IS_OFFERED_IAP:
      desc: '''Y''/''N'' flag whether offered during IAP'
    IS_OFFERED_SPRING_TERM:
      desc: '''Y''/''N'' flag whether offered in the spring term'
    IS_OFFERED_SUMMER_TERM:
      desc: '''Y''/''N'' flag whether offered in the summer term'
    FALL_INSTRUCTORS:
      desc: Fall term instructor names
    SPRING_INSTRUCTORS:
      desc: Spring term instructor names
    STATUS_CHANGE:
      desc: Catalog status change indicator
    LAST_ACTIVITY_DATE:
      desc: Date of last activity on the record
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
    MASTER_SUBJECT_ID:
      desc: Master subject identifier
    HASS_ATTRIBUTE:
      desc: HASS attribute code
    HASS_ATTRIBUTE_DESC:
      desc: HASS attribute description
    TERM_DURATION:
      desc: Duration within the term
    GLOBAL_REGIONS:
      desc: Global regions associated with the subject
    GLOBAL_COUNTRIES:
      desc: Global countries associated with the subject
    ON_LINE_PAGE_NUMBER:
      desc: Online catalog page number
    ACADEMIC_YEAR:
      desc: Academic year of the catalog record
    SUBJECT_ID:
      desc: Subject identifier, SUBJECT_CODE.SUBJECT_NUMBER
    SUBJECT_CODE:
      desc: Subject code, e.g. '18'
    SUBJECT_NUMBER:
      desc: Subject number within the subject code
    SOURCE_SUBJECT_ID:
      desc: Source system subject identifier
    PRINT_SUBJECT_ID:
      desc: Subject identifier as printed
    IS_PRINTED_IN_BULLETIN:
      desc: '''Y''/''N'' flag whether printed in the bulletin'
    DEPARTMENT_CODE:
      desc: Department code; joins to SIS_SUBJECT_CODE.DEPARTMENT_CODE and SIS_DEPARTMENT.DEPARTMENT_CODE
    DEPARTMENT_NAME:
      desc: Department name
    EFFECTIVE_TERM_CODE:
      desc: Term code from which catalog attributes take effect
    SUBJECT_SHORT_TITLE:
      desc: Short title of the subject
    SUBJECT_TITLE:
      desc: Full title of the subject; joins to CIS_COURSE_CATALOG-based subject title
        matching
    IS_VARIABLE_UNITS:
      desc: '''Y''/''N'' flag whether the subject has variable units'
    LECTURE_UNITS:
      desc: Lecture credit units
    LAB_UNITS:
      desc: Lab credit units
    PREPARATION_UNITS:
      desc: Preparation credit units
    TOTAL_UNITS:
      desc: Total credit units
    DESIGN_UNITS:
      desc: Design credit units
    GRADE_TYPE:
      desc: Grade type code
    GRADE_TYPE_DESC:
      desc: Grade type description
    GRADE_RULE:
      desc: Grade rule code
    GRADE_RULE_DESC:
      desc: Grade rule description
    HGN_CODE:
      desc: HGN level code
    HGN_DESC:
      desc: HGN level description
    HGN_EXCEPT:
      desc: HGN exception indicator
    GIR_ATTRIBUTE:
      desc: General Institute Requirement attribute code
