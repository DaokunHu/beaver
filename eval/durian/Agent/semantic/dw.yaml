- id: join_fcltorg_self
  source_entity_type: table
  source_entity_id: FCLT_ORGANIZATION
  target_entity_type: table
  target_entity_id: FCLT_ORGANIZATION
  relation_type: joins
  desc: FCLT_ORGANIZATION self-join on DLC_KEY to re-attach organization-level aggregates
    (e.g. room area statistics grouped by DLC_KEY) back to organization rows and obtain
    the DLC_NAME for each department/lab/center key; on FCLT_ORG_PARENT_KEY = FCLT_ORGANIZATION_KEY
    to resolve an organization's parent organization (name, description); on ORGANIZATION_ID
    = FCLT_ORGANIZATION_KEY or ORGANIZATION_ID = ORGANIZATION_ID (same value domain
    in current data) to match records keyed by organization id back to organization
    rows; on ORGANIZATION = ORGANIZATION (short abbreviation) or MAJOR_ORG = MAJOR_ORG
    to expand derived per-organization/per-major-organization aggregates back to all
    organization rows of the same abbreviation/major organization; and on FCLT_ORGANIZATION_KEY
    = FCLT_ORGANIZATION_KEY to re-attach derived per-organization aggregates back
    to organization rows.
  columns:
  - source_column: DLC_KEY
    target_column: DLC_KEY
  - source_column: FCLT_ORG_PARENT_KEY
    target_column: FCLT_ORGANIZATION_KEY
  - source_column: ORGANIZATION_ID
    target_column: FCLT_ORGANIZATION_KEY
  - source_column: ORGANIZATION_ID
    target_column: ORGANIZATION_ID
  - source_column: ORGANIZATION
    target_column: ORGANIZATION
  - source_column: MAJOR_ORG
    target_column: MAJOR_ORG
  - source_column: FCLT_ORGANIZATION_KEY
    target_column: FCLT_ORGANIZATION_KEY
