        academic years
    FISCAL_PERIOD_DESCRIPTION:
      desc: Fiscal period description
    CALENDAR_PERIOD:
      desc: Calendar period (month) code
    CALENDAR_PERIOD_DESCRIPTION:
      desc: Calendar period description
    CALENDAR_YEAR:
      desc: Calendar year of the date; used in calendar-year window statistics
    START_DATE:
      desc: Start date of the fiscal period
    END_DATE:
      desc: End date of the fiscal period
    CALENDAR_DATE:
      desc: Calendar date of the day; joins to term tables' TERM_START_DATE for date-based
        matching
    DAY_OF_WEEK:
      desc: Day of week name of the date
    FINANCIAL_AID_YEAR:
      desc: Financial aid year the day maps to
    FINANCIAL_AID_YEAR_DESC:
      desc: Financial aid year description
    ACADEMIC_YEAR:
      desc: Academic year the day belongs to
    ACADEMIC_TERM_CODE:
      desc: Academic term code the day belongs to; joins to ACADEMIC_TERMS/ACADEMIC_TERMS_ALL/IAP_SUBJECT_DETAIL
        TERM_CODE
    ACADEMIC_TERM_DESCRIPTION:
      desc: Description of the academic term the day belongs to
