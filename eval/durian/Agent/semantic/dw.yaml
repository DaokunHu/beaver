  - source_column: HGN_CODE
    target_column: HGN_CODE
  - source_column: SUBJECT_ID
    target_column: SUBJECT_ID
- id: join_so_ccc
  source_entity_type: table
  source_entity_id: SUBJECT_OFFERED
  target_entity_type: table
  target_entity_id: CIS_COURSE_CATALOG
  relation_type: joins
  desc: SUBJECT_OFFERED joins CIS_COURSE_CATALOG on MASTER_SUBJECT_ID to link section-level
    subject offerings with CIS catalog records of the master subject, e.g. to check
    catalog attributes such as ACADEMIC_YEAR for offered subjects.
  columns:
  - source_column: MASTER_SUBJECT_ID
    target_column: MASTER_SUBJECT_ID
- id: join_ccc_sisdept
  source_entity_type: table
  source_entity_id: CIS_COURSE_CATALOG
  target_entity_type: table
  target_entity_id: SIS_DEPARTMENT
  relation_type: joins
  desc: CIS_COURSE_CATALOG joins SIS_DEPARTMENT on DEPARTMENT_CODE to obtain department
    name/full name, school attribution, and degree-granting flag for catalog subjects.
  columns:
  - source_column: DEPARTMENT_CODE
    target_column: DEPARTMENT_CODE
- id: join_scd_ccc
  source_entity_type: table
  source_entity_id: SIS_COURSE_DESCRIPTION
  target_entity_type: table
  target_entity_id: CIS_COURSE_CATALOG
  relation_type: joins
  desc: SIS_COURSE_DESCRIPTION joins CIS_COURSE_CATALOG on DEPARTMENT = DEPARTMENT_CODE
    to associate course descriptions with CIS catalog subject records (units, lecture/lab
    units, offering flags) of the same department.
  columns:
  - source_column: DEPARTMENT
    target_column: DEPARTMENT_CODE
- id: join_ssc_lso
  source_entity_type: table
  source_entity_id: SIS_SUBJECT_CODE
  target_entity_type: table
  target_entity_id: LIBRARY_SUBJECT_OFFERED
  relation_type: joins
  desc: SIS_SUBJECT_CODE joins LIBRARY_SUBJECT_OFFERED on COURSE_NUMBER to link subject
    code lookups (department name, school attribution) with library subject offerings,
    e.g. for per-term library enrollment averages by department.
  columns:
  - source_column: COURSE_NUMBER
    target_column: COURSE_NUMBER
- id: join_sisdept_msd
  source_entity_type: table
  source_entity_id: SIS_DEPARTMENT
  target_entity_type: table
  target_entity_id: MIT_STUDENT_DIRECTORY
  relation_type: joins
  desc: SIS_DEPARTMENT joins MIT_STUDENT_DIRECTORY on DEPARTMENT_CODE = DEPARTMENT
