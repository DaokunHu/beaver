  source_entity_type: table
  source_entity_id: FCLT_ROOMS
  target_entity_type: table
  target_entity_id: FCLT_ORGANIZATION
  relation_type: joins
  desc: FCLT_ROOMS joins FCLT_ORGANIZATION on FCLT_ORGANIZATION_KEY (primary occupying
    organization) or FCLT_MINOR_ORGANIZATION_KEY (secondary organization) to obtain
    organization hierarchy attributes for rooms.
