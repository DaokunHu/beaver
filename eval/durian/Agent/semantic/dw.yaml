- id: DRUPAL_EMPLOYEE_DIRECTORY
  name: DRUPAL_EMPLOYEE_DIRECTORY
  desc: 'Drupal-sourced employee directory table: an alternative employee feed keyed
    by MIT_ID with name components, employee group/type, additional/dual appointment
    flags, office location and phone, HR organization unit id/title, directory/primary
    titles, email address, and personal URL. Same person domain as EMPLOYEE_DIRECTORY
    but from the Drupal source system and without Kerberos/preferred-name columns;
    used as an alternative employee lookup when Drupal-sourced attributes (employee
    group, appointment flags, HR org unit) are needed.'
