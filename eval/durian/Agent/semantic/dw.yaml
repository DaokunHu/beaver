  source_entity_type: table
  source_entity_id: TIME_MONTH
  target_entity_type: table
  target_entity_id: TIME_DAY
  relation_type: joins
  desc: TIME_MONTH joins TIME_DAY on FISCAL_PERIOD = FISCAL_PERIOD to link each fiscal
    month with its calendar days, enabling month-level attributes (fiscal period description,
    calendar month) to be combined with day-level attributes (calendar date, day of
    week, academic term code); the join fans out one month row to all days of that
    fiscal period.
