  source_entity_type: table
  source_entity_id: FCLT_BUILDING_ADDRESS_HIST
  target_entity_type: table
  target_entity_id: FCLT_BUILDING_ADDRESS
  relation_type: joins
  desc: FCLT_BUILDING_ADDRESS_HIST joins FCLT_BUILDING_ADDRESS on FCLT_BUILDING_ADDRESS_KEY
    to compare a fiscal-period historical address snapshot against the current address
    record of the same building address.
  columns:
  - source_column: FCLT_BUILDING_ADDRESS_KEY
