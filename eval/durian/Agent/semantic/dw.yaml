  source_entity_id: FCLT_FLOOR_HIST
  target_entity_type: table
  target_entity_id: FCLT_FLOOR
  relation_type: joins
  desc: FCLT_FLOOR_HIST joins FCLT_FLOOR on FCLT_FLOOR_KEY to compare a fiscal-period
    historical floor snapshot against the current floor record.
  columns:
  - source_column: FCLT_FLOOR_KEY
    target_column: FCLT_FLOOR_KEY
- id: join_fcltroomshist_fcltrooms
  source_entity_type: table
  source_entity_id: FCLT_ROOMS_HIST
  target_entity_type: table
  target_entity_id: FCLT_ROOMS
  relation_type: joins
  desc: FCLT_ROOMS_HIST joins FCLT_ROOMS on FCLT_ROOM_KEY to compare a fiscal-period
    historical room snapshot against the current room record.
