- id: join_timemonth_timequarter
  source_entity_type: table
  source_entity_id: TIME_MONTH
  target_entity_type: table
  target_entity_id: TIME_QUARTER
  relation_type: joins
  desc: 'TIME_MONTH joins TIME_QUARTER on FY_QUARTER_CODE = FY_QUARTER_CODE to roll
    fiscal months up to their fiscal quarter attributes (quarter name, start/end dates,
    certification deadlines, quarter status flags); each quarter matches the month
    rows carrying the same quarter code. An alternative key pair is FISCAL_YEAR =
    FISCAL_YEAR, which associates every fiscal month of a year with all four quarters
    of that year instead of by exact quarter membership: since each fiscal year holds
    16 month rows (12 regular periods plus 4 closing periods) and 4 quarter rows,
    the fiscal-year join fans out to 64 rows per fiscal year (verified for FY 2026).
    Use the fiscal-year pair when quarter and month attributes must be combined across
    the whole fiscal year, and note that window functions partitioned by TIME_MONTH.FISCAL_PERIOD
    over this join see one row per quarter (4 rows) per partition.'
  columns:
  - source_column: FY_QUARTER_CODE
    target_column: FY_QUARTER_CODE
  - source_column: FISCAL_YEAR
    target_column: FISCAL_YEAR
