- id: CIS_HASS_ATTRIBUTE
  name: CIS_HASS_ATTRIBUTE
  desc: 'CIS lookup table decoding HASS (Humanities, Arts, and Social Sciences) attribute
    codes used in course catalog subject records. Each code (e.g. ''HA'', ''HH'',
    ''HS'', ''HE'', ''HD1''-''HD5'', ''HDL'', and combined codes like ''HA,HH'') maps
    to two description variants: the description shown on the registration form and
    the shorter description printed in the bulletin, plus the CIS attribute group
    (''H'' = HASS_ATTRIBUTE for students entering Fall 2010 or later, ''G'' = GIR_ATTRIBUTE
    for students entering prior to Fall 2010) with a group note, and icon display
    attributes. Catalog tables (COURSE_CATALOG_SUBJECT_OFFERED, CIS_COURSE_CATALOG,
    DRUPAL_COURSE_CATALOG) join to this lookup via HASS_ATTRIBUTE. Note: a code can
    appear once per attribute group (e.g. ''HE'' exists in both group H and group
    G), so joins on HASS_ATTRIBUTE alone may produce multiple matching rows.'
  columns:
    HASS_ATTRIBUTE:
      desc: HASS attribute code, e.g. 'HA' (HASS Arts), 'HH' (HASS Humanities), 'HS'
        (HASS Social Sciences), 'HE' (HASS Elective), 'HD1'-'HD5' (HASS-D categories),
        'HDL' (HASS-D Language Option), and combined codes like 'HA,HH'; join key
        from catalog tables' HASS_ATTRIBUTE column; not unique alone because a code
        may appear under both attribute groups H and G
    DESCRIPTION_ON_FORM:
      desc: HASS attribute description as displayed on the registration form, e.g.
        'HASS Arts', 'Arts + Humanities', 'HASS-D, Category 1'; matches the value
        catalog tables store in HASS_ATTRIBUTE_DESC
    DESCRIPTION_IN_BULLETIN:
      desc: HASS attribute description as printed in the bulletin, a shorter coded
        form, e.g. 'HASS-A', 'HASS-H', 'HASS-S/2', 'HASS-D 1', 'HASS-L'
    CIS_ATTRIBUTE_GROUP:
      desc: 'CIS attribute group code: ''H'' = HASS_ATTRIBUTE (for students entering
        Fall 2010 or later), ''G'' = GIR_ATTRIBUTE (General Institute Requirement,
        for students entering prior to Fall 2010)'
    CIS_ATTRIBUTE_GROUP_NOTE:
      desc: Explanatory note for the attribute group, e.g. 'HASS_ATTRIBUTE, for students
        entering in Fall 2010 or later'
    ICON_GIF_NAME:
      desc: File name of the icon displayed for the HASS attribute, e.g. 'hassA.gif';
        may be 'None'
    ICON_HEIGHT:
      desc: Icon display height in pixels; may be 'None'
    ICON_WIDTH:
      desc: Icon display width in pixels; may be 'None'
    LAST_ACTIVITY_DATE:
      desc: Date of the last change to the lookup record
    LAST_UPDATE_USER:
      desc: User who last updated the record
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per HASS attribute code per CIS attribute group
- id: COURSE_CATALOG_SUBJECT_OFFERED
  name: COURSE_CATALOG_SUBJECT_OFFERED
  desc: 'Course catalog subject offering table recording catalog-level attributes
    of each subject offered per academic year and term: subject identity (SUBJECT_ID
    = SUBJECT_CODE.SUBJECT_NUMBER), department, unit structure (lecture/lab/preparation/design/total
    units), grading type and rules, HGN level (Undergraduate/Graduate/High Graduate),
    requirement attributes (GIR, HASS, communication, writing), term offering flags
    (this year, fall, IAP, spring, summer), instructors, section flags, responsible
    faculty, and meeting time/place. Links to terms via both TERM_CODE (the offering
    term) and EFFECTIVE_TERM_CODE (the term from which catalog attributes take effect).'
  columns:
    ACADEMIC_YEAR:
      desc: Academic year of the catalog offering, e.g. 2022
    TERM_CODE:
      desc: Term code of the offering record in YYYYTT format; joins to term tables
    SUBJECT_ID:
      desc: Subject identifier formed as SUBJECT_CODE + '.' + SUBJECT_NUMBER, e.g.
        '18.01'; joins to TIP_DETAIL, LIBRARY_SUBJECT_OFFERED, SUBJECT_SUMMARY subject
        IDs
    SUBJECT_CODE:
      desc: Subject/course code prefix, e.g. '18' for Mathematics; joins to SIS_COURSE_DESCRIPTION.COURSE
        and SIS_SUBJECT_CODE.SUBJECT_CODE
    SUBJECT_NUMBER:
      desc: Subject number within the subject code, e.g. '01'
    SOURCE_SUBJECT_ID:
      desc: Source system subject identifier
    PRINT_SUBJECT_ID:
      desc: Subject identifier as printed in the bulletin
    IS_PRINTED_IN_BULLETIN:
      desc: '''Y''/''N'' flag whether the subject is printed in the bulletin'
    DEPARTMENT_CODE:
      desc: Offering department code; joins to SIS_DEPARTMENT.DEPARTMENT_CODE
    DEPARTMENT_NAME:
      desc: Offering department name, e.g. 'Mathematics', 'Chemistry'
    EFFECTIVE_TERM_CODE:
      desc: Term code from which the catalog attributes of this subject take effect;
        frequently joined to ACADEMIC_TERMS.TERM_CODE for term-status filtering
    SUBJECT_SHORT_TITLE:
      desc: Short title of the subject
    SUBJECT_TITLE:
      desc: Full title of the subject
    IS_VARIABLE_UNITS:
      desc: '''Y''/''N'' flag whether the subject has variable units'
    LECTURE_UNITS:
      desc: Number of lecture credit units
    LAB_UNITS:
      desc: Number of lab credit units
    PREPARATION_UNITS:
      desc: Number of preparation (outside-class) credit units
    TOTAL_UNITS:
      desc: Total credit units of the subject (lecture+lab+preparation unless variable)
