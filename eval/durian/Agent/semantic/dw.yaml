- id: TIME_DAY
  name: TIME_DAY
  desc: Day-level time dimension table mapping each calendar date to fiscal year/period,
    calendar year/period, academic year, financial aid year, day of week, and the
    academic term code/description the day belongs to. Used to attach calendar attributes
    to terms and activities.
  columns:
