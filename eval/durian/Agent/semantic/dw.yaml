  source_entity_type: table
  source_entity_id: COURSE_CATALOG_SUBJECT_OFFERED
  target_entity_type: table
  target_entity_id: EMPLOYEE_DIRECTORY
  relation_type: joins
  desc: COURSE_CATALOG_SUBJECT_OFFERED joins EMPLOYEE_DIRECTORY on RESPONSIBLE_FACULTY_MIT_ID
