  - source_column: TERM_CODE
    target_column: TERM_CODE
- id: join_sisdept_self
  source_entity_type: table
  source_entity_id: SIS_DEPARTMENT
  target_entity_type: table
  target_entity_id: SIS_DEPARTMENT
  relation_type: joins
  desc: SIS_DEPARTMENT self-join on SCHOOL_CODE to aggregate department-level attributes
    (e.g. maximum CIP program code) up to the school level and to obtain school-level
    names such as SCHOOL_NAME_IN_COMMENCEMENT_BK.
  columns:
  - source_column: SCHOOL_CODE
    target_column: SCHOOL_CODE
- id: join_so_self
  source_entity_type: table
  source_entity_id: SUBJECT_OFFERED
  target_entity_type: table
  target_entity_id: SUBJECT_OFFERED
  relation_type: joins
  desc: SUBJECT_OFFERED self-join on SUBJECT_KEY to re-attach windowed/filtered subject
    offering rows back to the full section-level offering records of the same subject
    key.
  columns:
  - source_column: SUBJECT_KEY
    target_column: SUBJECT_KEY
- id: join_tso_self
  source_entity_type: table
  source_entity_id: TIP_SUBJECT_OFFERED
  target_entity_type: table
  target_entity_id: TIP_SUBJECT_OFFERED
  relation_type: joins
  desc: TIP_SUBJECT_OFFERED self-join on TIP_SUBJECT_OFFERED_KEY to re-attach derived/windowed
    subject rows back to the full offering record (e.g. to fetch responsible faculty
    name and offering department for a windowed result); on TERM_CODE and SUBJECT_TITLE
    to re-attach windowed or filtered textbook-program subject rows back to the offering
    records of the same subject in the same term; and on RESPONSIBLE_FACULTY_NAME
    (typically within the same TERM_CODE/offering-department scope) to re-attach per-faculty
    aggregates such as maximum enrolled students back to individual subject rows.
  columns:
  - source_column: TIP_SUBJECT_OFFERED_KEY
    target_column: TIP_SUBJECT_OFFERED_KEY
  - source_column: TERM_CODE
    target_column: TERM_CODE
  - source_column: SUBJECT_TITLE
    target_column: SUBJECT_TITLE
  - source_column: RESPONSIBLE_FACULTY_NAME
    target_column: RESPONSIBLE_FACULTY_NAME
- id: join_iap_self
