metrics:
- id: dw_359
  name: Yearly Math Lecture Units Above One Stddev with Undergraduate Majority
  category: Subject Offering Analysis
  desc: For each academic year, what is the total number of lecture units for all
    subjects offered in regular terms by the Mathematics department (Course 18), where
    at least 60% of those subjects are undergraduate-level (HGN_DESC = 'Undergraduate'),
    considering only those academic years where the total lecture units are more than
    one standard deviation (using STDDEV only and never STDDEV_POP) above the mean
    total lecture units across all academic years? Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT at_all.ACADEMIC_YEAR, ccso.SUBJECT_ID, ccso.HGN_DESC,
    ccso.LECTURE_UNITS FROM ACADEMIC_TERMS_ALL at_all JOIN ACADEMIC_TERMS at ON at_all.TERM_CODE
    = at.TERM_CODE JOIN COURSE_CATALOG_SUBJECT_OFFERED ccso ON at.TERM_CODE = ccso.EFFECTIVE_TERM_CODE
    WHERE at.IS_REGULAR_TERM = 'Y' AND ccso.DEPARTMENT_NAME = 'Mathematics' ), YearlyTotals
    AS ( SELECT ACADEMIC_YEAR, SUM(LECTURE_UNITS) AS total_lecture_units FROM inner_cte
    GROUP BY ACADEMIC_YEAR ), YearlyUndergradCounts AS ( SELECT ACADEMIC_YEAR, COUNT(CASE
    WHEN HGN_DESC = 'Undergraduate' THEN 1 END) AS undergrad_count, COUNT(*) AS total_count
    FROM inner_cte GROUP BY ACADEMIC_YEAR ), FilteredYears AS ( SELECT yt.ACADEMIC_YEAR,
    yt.total_lecture_units, yuc.undergrad_count, yuc.total_count FROM YearlyTotals
    yt JOIN YearlyUndergradCounts yuc ON yt.ACADEMIC_YEAR = yuc.ACADEMIC_YEAR WHERE
    CASE WHEN yuc.total_count > 0 THEN (1.0 * yuc.undergrad_count / yuc.total_count)
    ELSE 0 END >= 0.6 ) SELECT fy.ACADEMIC_YEAR, fy.total_lecture_units FROM FilteredYears
    fy WHERE fy.total_lecture_units > ( SELECT AVG(total_lecture_units) + STDDEV(total_lecture_units)
    FROM YearlyTotals ) ;
  default_granularity: one row per academic year
- id: dw_1023
  name: Math Fall Non-Variable Unit Statistics by Academic Year with Enrollment Filter
  category: Subject Offering and Enrollment Comprehensive Analysis
  desc: For each academic year where the Mathematics department has at least one unique
    subject with subject enrollment number greater than 10, what are the academic
    year, academic year description, department name, number of unique subjects, minimum
    total units offered, variance of total units, and standard deviation (using STDDEV
    only and never STDDEV_POP) of total units for subjects offered in the fall term
    that are not variable units and are offered by the Mathematics department? Do
    not return any rounded answers.
  sql: WITH AcademicYearStats AS ( SELECT at.ACADEMIC_YEAR, at.ACADEMIC_YEAR_DESC,
    VARIANCE(ccso.TOTAL_UNITS) AS variance_total_units, STDDEV(ccso.TOTAL_UNITS) AS
    stddev_total_units FROM COURSE_CATALOG_SUBJECT_OFFERED ccso JOIN ACADEMIC_TERMS
    at ON ccso.TERM_CODE = at.TERM_CODE WHERE ccso.IS_OFFERED_FALL_TERM = 'Y' AND
    ccso.IS_VARIABLE_UNITS = 'N' AND ccso.DEPARTMENT_NAME = 'Mathematics' GROUP BY
    at.ACADEMIC_YEAR, at.ACADEMIC_YEAR_DESC ORDER BY at.ACADEMIC_YEAR ), DepartmentYearStats
    AS ( SELECT cso.DEPARTMENT_NAME, at.ACADEMIC_YEAR, COUNT(DISTINCT ss.SUBJECT_ID)
    AS num_unique_subjects, MIN(ss.TOTAL_UNITS) AS min_total_units FROM COURSE_CATALOG_SUBJECT_OFFERED
    cso JOIN ACADEMIC_TERMS at ON cso.EFFECTIVE_TERM_CODE = at.TERM_CODE JOIN SUBJECT_SUMMARY
    ss ON at.TERM_CODE = ss.TERM_CODE AND cso.DEPARTMENT_NAME = ss.DEPARTMENT_NAME
    WHERE cso.DEPARTMENT_NAME = 'Mathematics' AND ss.SUBJECT_ENROLLMENT_NUMBER > 10
    GROUP BY cso.DEPARTMENT_NAME, at.ACADEMIC_YEAR ) SELECT ays.ACADEMIC_YEAR, ays.ACADEMIC_YEAR_DESC,
    dys.DEPARTMENT_NAME, dys.num_unique_subjects, dys.min_total_units, ays.variance_total_units,
    ays.stddev_total_units FROM AcademicYearStats ays JOIN DepartmentYearStats dys
    ON ays.ACADEMIC_YEAR = dys.ACADEMIC_YEAR WHERE dys.num_unique_subjects > 0 ORDER
    BY ays.ACADEMIC_YEAR;
  default_granularity: one row per academic year
- id: dw_1049
  name: Mathematics Total Units Stddev for Regular Non-Current Terms vs 2022 Degree-Granting
    Departments
  category: Subject Offering Analysis
  desc: For the Mathematics department, what is the department name, the standard
    deviation (using STDDEV only and never STDDEV_POP) of the total units for its
    subjects in regular terms that are not the current term, and the standard deviation
    (using STDDEV only and never STDDEV_POP) of the total units for subjects offered
    by that department in the 2022 academic year (considering only departments that
    have more than five subjects offered in 2022, are degree-granting, and are not
    the Chemistry department)? Show the department name, the standard deviation (using
    STDDEV only and never STDDEV_POP) for regular non-current terms, and the standard
    deviation (using STDDEV only and never STDDEV_POP) for 2022. Do not return any
    rounded answers.
  sql: WITH MathDeptStddev AS ( SELECT ss.DEPARTMENT_NAME, STDDEV(ss.TOTAL_UNITS)
    AS stddev_total_units FROM SUBJECT_SUMMARY ss JOIN ACADEMIC_TERMS at ON ss.TERM_CODE
    = at.TERM_CODE WHERE ss.DEPARTMENT_NAME = 'Mathematics' AND at.IS_REGULAR_TERM
    = 'Y' AND at.IS_CURRENT_TERM = 'N' GROUP BY ss.DEPARTMENT_NAME ), DeptStddev2022
    AS ( SELECT scd.DEPARTMENT_NAME, STDDEV(ccso.TOTAL_UNITS) AS total_units_stddev
    FROM SIS_SUBJECT_CODE ssc JOIN SIS_COURSE_DESCRIPTION scd ON ssc.SUBJECT_CODE
    = scd.COURSE JOIN COURSE_CATALOG_SUBJECT_OFFERED ccso ON scd.COURSE = ccso.SUBJECT_CODE
    WHERE ccso.ACADEMIC_YEAR = 2022 AND scd.IS_DEGREE_GRANTING = 'Y' AND scd.DEPARTMENT_NAME
    <> 'Chemistry' GROUP BY scd.DEPARTMENT_NAME HAVING COUNT(*) > 5 ORDER BY total_units_stddev
    DESC ) SELECT mds.DEPARTMENT_NAME, mds.stddev_total_units AS math_stddev_total_units,
    dsd.total_units_stddev AS dept_stddev_2022 FROM MathDeptStddev mds LEFT JOIN DeptStddev2022
    dsd ON mds.DEPARTMENT_NAME = dsd.DEPARTMENT_NAME;
  default_granularity: one row per department
- id: dw_1973
  name: Math 2022 Letter-Graded Subjects with TIP Materials Ranked by Term with 3-Row
    Max Units
  category: Subject Offering and Textbook Material Comprehensive Analysis
  desc: For all subjects offered in the academic year 2022 by the Mathematics department
    that have at least one associated TIP material and are also offered this year
    as letter graded, show the subject ID, subject title, term code, term description,
    the rank of each subject within its term (ordered by subject ID), subject code,
    subject number, department name, academic year, the maximum total units for each
    subject considering the current row and the next 2 rows ordered by subject code,
    and the start and end dates of the term. Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT s1.SUBJECT_ID, s1.SUBJECT_TITLE, s1.TERM_CODE, s1.TERM_DESCRIPTION,
    s1.window_column, s2.SUBJECT_CODE, s2.SUBJECT_NUMBER, s2.DEPARTMENT_NAME, s2.ACADEMIC_YEAR,
    s2.max_total_units_3rows FROM ( SELECT c.SUBJECT_ID, c.SUBJECT_TITLE, c.TERM_CODE,
    a.TERM_DESCRIPTION, RANK() OVER (PARTITION BY c.TERM_CODE ORDER BY c.SUBJECT_ID)
    AS window_column FROM COURSE_CATALOG_SUBJECT_OFFERED c INNER JOIN ACADEMIC_TERMS_ALL
    a ON c.TERM_CODE = a.TERM_CODE INNER JOIN TIP_DETAIL t ON a.TERM_CODE = t.TERM_CODE
    AND c.SUBJECT_ID = t.SUBJECT_ID WHERE c.ACADEMIC_YEAR = 2022 AND c.DEPARTMENT_NAME
    = 'Mathematics' ) s1 JOIN ( SELECT c.SUBJECT_CODE, c.SUBJECT_NUMBER, c.SUBJECT_TITLE,
    c.DEPARTMENT_NAME, c.ACADEMIC_YEAR, c.TERM_CODE, a.TERM_DESCRIPTION, GREATEST(
    c.TOTAL_UNITS, COALESCE(LEAD(c.TOTAL_UNITS, 1) OVER (PARTITION BY c.SUBJECT_CODE,
    c.SUBJECT_NUMBER ORDER BY c.SUBJECT_CODE), 0), COALESCE(LEAD(c.TOTAL_UNITS, 2)
    OVER (PARTITION BY c.SUBJECT_CODE, c.SUBJECT_NUMBER ORDER BY c.SUBJECT_CODE),
    0) ) AS max_total_units_3rows FROM COURSE_CATALOG_SUBJECT_OFFERED c JOIN ACADEMIC_TERMS
    a ON c.TERM_CODE = a.TERM_CODE WHERE c.DEPARTMENT_NAME = 'Mathematics' AND c.IS_OFFERED_THIS_YEAR
    = 'Y' AND c.GRADE_TYPE = 'L' ORDER BY c.SUBJECT_CODE, c.SUBJECT_NUMBER, c.TERM_CODE
    ) s2 ON s1.SUBJECT_ID = CONCAT(s2.SUBJECT_CODE, '.', s2.SUBJECT_NUMBER) AND s1.TERM_CODE
    = s2.TERM_CODE ) SELECT i.SUBJECT_ID, i.SUBJECT_TITLE, i.TERM_CODE, i.TERM_DESCRIPTION,
    i.window_column, i.SUBJECT_CODE, i.SUBJECT_NUMBER, i.DEPARTMENT_NAME, i.ACADEMIC_YEAR,
    i.max_total_units_3rows, t.TERM_START_DATE, t.TERM_END_DATE FROM inner_cte i JOIN
    ACADEMIC_TERMS t ON i.TERM_CODE = t.TERM_CODE ORDER BY i.TERM_CODE, i.SUBJECT_ID;
  default_granularity: one row per subject per term
- category: Subject Offering and Course Catalog Comprehensive Analysis
  default_granularity: one row per subject offering
  desc: For subjects offered in the academic year 2024 with a total of 12 units in
    the Mathematics department, show the subject code, subject number, subject title,
    department name, term description, and the rank of each subject within its department
    ordered by subject code, along with the department name, school name, the highest
    number of degree-granting undergraduate courses in the Mathematics department
    (Course 18), and the subject short title and subject description for each subject.
    Do not return any rounded answers.
  id: dw_2090
  name: Math 2024 12-Unit Subjects Ranked with Degree-Granting Undergraduate Course
    Count
  sql: WITH inner_cte AS ( SELECT t0.SUBJECT_CODE, t0.SUBJECT_NUMBER, t0.SUBJECT_TITLE,
    t0.DEPARTMENT_NAME, t1.TERM_DESCRIPTION, RANK() OVER (PARTITION BY t0.DEPARTMENT_NAME
    ORDER BY t0.SUBJECT_CODE) AS window_column, t0.SUBJECT_CODE AS join_subject_code
    FROM COURSE_CATALOG_SUBJECT_OFFERED t0 JOIN ACADEMIC_TERMS t1 ON t0.EFFECTIVE_TERM_CODE
    = t1.TERM_CODE JOIN SUBJECT_SUMMARY t2 ON t1.TERM_CODE = t2.TERM_CODE WHERE t0.ACADEMIC_YEAR
    = 2024 AND t0.TOTAL_UNITS = 12 AND t0.DEPARTMENT_NAME = 'Mathematics' ), math_dept_course_count
    AS ( SELECT DEPARTMENT_NAME, SCHOOL_NAME, COUNT(*) AS num_courses, 'Mathematics'
    AS join_department_name FROM SIS_COURSE_DESCRIPTION WHERE IS_DEGREE_GRANTING =
    'Y' AND COURSE_LEVEL = 'U' AND DEPARTMENT_NAME = 'Mathematics' GROUP BY DEPARTMENT_NAME,
    SCHOOL_NAME ORDER BY num_courses DESC LIMIT 1 ) SELECT ic.SUBJECT_CODE, ic.SUBJECT_NUMBER,
    ic.SUBJECT_TITLE, ic.DEPARTMENT_NAME, ic.TERM_DESCRIPTION, ic.window_column, mdc.DEPARTMENT_NAME,
    mdc.SCHOOL_NAME, mdc.num_courses, cso.SUBJECT_SHORT_TITLE, cso.SUBJECT_DESCRIPTION
    FROM inner_cte ic CROSS JOIN math_dept_course_count mdc JOIN COURSE_CATALOG_SUBJECT_OFFERED
    cso ON ic.SUBJECT_CODE = cso.SUBJECT_CODE AND ic.SUBJECT_NUMBER = cso.SUBJECT_NUMBER
    AND cso.ACADEMIC_YEAR = 2024 AND cso.DEPARTMENT_NAME = 'Mathematics'
- category: Textbook Material and Enrollment Comprehensive Analysis
  default_granularity: one row per Chemistry subject with materials per term
  desc: For each subject offered by the Chemistry department (Course 5) that has course
    materials, show the subject title, term code, offering department name, responsible
    faculty name, department full name, school name, the maximum number of enrolled
    students for each subject considering the current row and the next 2 rows ordered
    by subject offered key, along with the minimum academic year and average total
    units for the corresponding academic term in the Mathematics department, where
    the academic year is between 2000 and 2020 or the total units are at least 6,
    and the total units are between 1 and 12. Also, include the term description and
    the first day of classes for each term from the academic terms table. The results
    are ordered by term code and subject title. Do not return any rounded answers.
  id: dw_2181
  name: Chemistry Subjects with Course Materials 3-Row Max Enrollment vs Math Term
    Unit Statistics
  sql: WITH inner_cte AS ( WITH MathTermStats AS ( SELECT s.TERM_CODE, MIN(a.ACADEMIC_YEAR)
    AS min_academic_year, AVG(s.TOTAL_UNITS) AS avg_total_units FROM SUBJECT_SUMMARY
    s JOIN ACADEMIC_TERMS_ALL a ON s.TERM_CODE = a.TERM_CODE WHERE s.DEPARTMENT_NAME
    = 'Mathematics' AND s.TOTAL_UNITS BETWEEN 1 AND 12 AND ( a.ACADEMIC_YEAR BETWEEN
    2000 AND 2020 OR s.TOTAL_UNITS >= 6 ) GROUP BY s.TERM_CODE ORDER BY s.TERM_CODE
    ), ChemistrySubjectStats AS ( SELECT t0.SUBJECT_TITLE, t0.TERM_CODE, t0.OFFER_DEPT_NAME,
    t0.RESPONSIBLE_FACULTY_NAME, t1.DEPARTMENT_FULL_NAME, t1.SCHOOL_NAME, MAX(t0.NUM_ENROLLED_STUDENTS)
    OVER ( ORDER BY t0.TIP_SUBJECT_OFFERED_KEY ROWS BETWEEN CURRENT ROW AND 2 FOLLOWING
    ) AS max_num_enrolled_students FROM TIP_SUBJECT_OFFERED t0 JOIN STUDENT_DEPARTMENT
    t1 ON t0.OFFER_DEPT_CODE = t1.DEPARTMENT_CODE WHERE t0.NUM_ENROLLED_STUDENTS >=
    0 AND t0.TERM_CODE IS NOT NULL AND t0.OFFER_DEPT_NAME = 'Chemistry' AND t0.IS_NO_COURSE_MATERIAL
    = 'N' ) SELECT css.SUBJECT_TITLE, css.TERM_CODE, css.OFFER_DEPT_NAME, css.RESPONSIBLE_FACULTY_NAME,
    css.DEPARTMENT_FULL_NAME, css.SCHOOL_NAME, css.max_num_enrolled_students, mts.min_academic_year,
    mts.avg_total_units FROM ChemistrySubjectStats css JOIN MathTermStats mts ON css.TERM_CODE
    = mts.TERM_CODE ) SELECT ic.SUBJECT_TITLE, ic.TERM_CODE, ic.OFFER_DEPT_NAME, ic.RESPONSIBLE_FACULTY_NAME,
    ic.DEPARTMENT_FULL_NAME, ic.SCHOOL_NAME, ic.max_num_enrolled_students, ic.min_academic_year,
    ic.avg_total_units, at.TERM_DESCRIPTION, at.FIRST_DAY_OF_CLASSES FROM inner_cte
    ic JOIN ACADEMIC_TERMS at ON ic.TERM_CODE = at.TERM_CODE ORDER BY ic.TERM_CODE,
    ic.SUBJECT_TITLE
- category: Textbook Material and Enrollment Comprehensive Analysis
  default_granularity: one row per top-enrolled Chemistry subject
  desc: 'From the top 10 subjects offered by the Chemistry department (Course 5) with
    the highest number of enrolled students, display each subject''s title, offering
    department name, responsible faculty name, term code, material status key, the
    maximum number of enrolled students for each subject considering the current row
    and the next 2 rows ordered by subject ID, and the department most represented
    among the responsible faculty for these subjects along with the count of subjects
    from that department. For each such subject, also provide the corresponding academic
    term parameter, the term description, the average total units, and the variance
    of total units of all subjects offered in the corresponding effective term, considering
    only subjects that are offered this year and are in the Mathematics department.
    The columns should be: subject title, offering department name, responsible faculty
    name, term code, material status key, maximum number of enrolled students, most
    prominent responsible faculty department, count of subjects from that department,
    academic term parameter, term description, average total units, and variance of
    total units. Do not return any rounded answers.'
  id: dw_2461
  name: Top 10 Chemistry Subjects by Enrollment with Prominent Faculty Department
    and Math Term Unit Statistics
  sql: WITH inner_cte AS ( SELECT t0.SUBJECT_TITLE, t0.OFFER_DEPT_NAME, t0.RESPONSIBLE_FACULTY_NAME,
    t1.TERM_CODE, t1.TIP_MATERIAL_STATUS_KEY, MAX(t0.NUM_ENROLLED_STUDENTS) OVER (ORDER
    BY t0.SUBJECT_ID ROWS BETWEEN CURRENT ROW AND 2 FOLLOWING) as max_enrolled_students,
    t0.SUBJECT_ID, t0.OFFER_DEPT_CODE FROM TIP_SUBJECT_OFFERED t0 JOIN TIP_DETAIL
    t1 ON t0.SUBJECT_ID = t1.SUBJECT_ID WHERE t0.NUM_ENROLLED_STUDENTS >= 0 AND t1.TIP_MATERIAL_STATUS_KEY
    IS NOT NULL AND t0.OFFER_DEPT_NAME = 'Chemistry' ), faculty_dept_counts AS ( SELECT
    icte.SUBJECT_TITLE, icte.OFFER_DEPT_NAME, icte.RESPONSIBLE_FACULTY_NAME, icte.TERM_CODE,
    icte.TIP_MATERIAL_STATUS_KEY, icte.max_enrolled_students, ccso.DEPARTMENT_NAME
    AS Most_Prominent_Responsible_Faculty_Department, COUNT(*) AS Subject_Count FROM
    inner_cte icte JOIN COURSE_CATALOG_SUBJECT_OFFERED ccso ON icte.SUBJECT_ID = ccso.SUBJECT_ID
    GROUP BY icte.SUBJECT_TITLE, icte.OFFER_DEPT_NAME, icte.RESPONSIBLE_FACULTY_NAME,
    icte.TERM_CODE, icte.TIP_MATERIAL_STATUS_KEY, icte.max_enrolled_students, ccso.DEPARTMENT_NAME
    ), ranked_faculty_dept AS ( SELECT fdc.*, @rank := IF(@current_subject = fdc.SUBJECT_TITLE,
    @rank + 1, 1) AS `Rank`, @current_subject := fdc.SUBJECT_TITLE FROM (SELECT *
    FROM faculty_dept_counts ORDER BY SUBJECT_TITLE, Subject_Count DESC) fdc CROSS
    JOIN (SELECT @rank := 0, @current_subject := '') vars ), AcademicTermStats AS
    ( SELECT atp.TERM_CODE AS academic_term_parameter, atp.TERM_DESCRIPTION, AVG(ccso.TOTAL_UNITS)
    AS avg_total_units, VARIANCE(ccso.TOTAL_UNITS) AS var_total_units FROM ACADEMIC_TERM_PARAMETER
    atp JOIN ACADEMIC_TERMS at ON atp.TERM_CODE = at.TERM_CODE JOIN COURSE_CATALOG_SUBJECT_OFFERED
    ccso ON at.TERM_CODE = ccso.EFFECTIVE_TERM_CODE WHERE ccso.IS_OFFERED_THIS_YEAR
    = 'Y' AND ccso.DEPARTMENT_NAME = 'Mathematics' GROUP BY atp.TERM_CODE, atp.TERM_DESCRIPTION
    ORDER BY atp.TERM_CODE ) SELECT rfd.SUBJECT_TITLE, rfd.OFFER_DEPT_NAME, rfd.RESPONSIBLE_FACULTY_NAME,
    rfd.TERM_CODE, rfd.TIP_MATERIAL_STATUS_KEY, rfd.max_enrolled_students, rfd.Most_Prominent_Responsible_Faculty_Department,
    rfd.Subject_Count, ats.academic_term_parameter, ats.TERM_DESCRIPTION, ats.avg_total_units,
    ats.var_total_units FROM ranked_faculty_dept rfd JOIN AcademicTermStats ats ON
    rfd.TERM_CODE = ats.academic_term_parameter WHERE rfd.`Rank` = 1 ORDER BY rfd.max_enrolled_students
    DESC LIMIT 10;
- category: Subject Offering Analysis
  default_granularity: one row per department per academic year
  desc: For each department and academic year, provide the department name, academic
    year, the number of subjects offered that are not repeatable for credit and are
    offered in the fall term, and classify the department as 'HIGH_ACTIVITY' if it
    offers at least 10% more such subjects than the average across all departments
    for that year, 'LOW_ACTIVITY' if it offers at least 10% fewer, or 'AVERAGE' otherwise.
    Do not return any rounded answers.
  id: dw_2580
  name: Department Fall Non-Repeatable Subject Count Activity Classification by Year
  sql: WITH inner_cte AS ( SELECT ccso.DEPARTMENT_NAME, at.ACADEMIC_YEAR, COUNT(so.SUBJECT_KEY)
    AS subject_count FROM SUBJECT_OFFERED so JOIN ACADEMIC_TERMS at ON so.TERM_CODE
    = at.TERM_CODE JOIN COURSE_CATALOG_SUBJECT_OFFERED ccso ON at.TERM_CODE = ccso.EFFECTIVE_TERM_CODE
    WHERE ccso.GRADE_RULE_DESC = 'Not repeatable for credit' AND ccso.IS_OFFERED_FALL_TERM
    = 'Y' GROUP BY ccso.DEPARTMENT_NAME, at.ACADEMIC_YEAR ) , dept_avg AS ( SELECT
    ACADEMIC_YEAR, AVG(subject_count) AS avg_subject_count FROM inner_cte GROUP BY
    ACADEMIC_YEAR ) SELECT i.DEPARTMENT_NAME, i.ACADEMIC_YEAR, i.subject_count, d.avg_subject_count,
    CASE WHEN i.subject_count > d.avg_subject_count * 1.1 THEN 'HIGH_ACTIVITY' WHEN
    i.subject_count < d.avg_subject_count * 0.9 THEN 'LOW_ACTIVITY' ELSE 'AVERAGE'
    END AS activity_level FROM inner_cte i JOIN dept_avg d ON i.ACADEMIC_YEAR = d.ACADEMIC_YEAR;
- category: Subject Offering Analysis
  default_granularity: one row per department per academic year
  desc: For each academic year, what is the description of the academic year, the
    department name, the average total units for all subjects offered by that department
    in terms that match that academic year and have a term status indicator of 'P',
    and the deviation of each department's average total units from the overall average
    total units for that academic year? Do not return any rounded answers.
  id: dw_2597
  name: Department Average Total Units Deviation from Yearly Overall Average in Previous
    Terms
  sql: WITH inner_cte AS ( SELECT ACADEMIC_TERMS.ACADEMIC_YEAR, ACADEMIC_TERMS.ACADEMIC_YEAR_DESC,
    COURSE_CATALOG_SUBJECT_OFFERED.DEPARTMENT_NAME, AVG(COURSE_CATALOG_SUBJECT_OFFERED.TOTAL_UNITS)
    AS dept_avg_total_units FROM ACADEMIC_TERMS_ALL JOIN ACADEMIC_TERMS ON ACADEMIC_TERMS_ALL.TERM_CODE
    = ACADEMIC_TERMS.TERM_CODE JOIN COURSE_CATALOG_SUBJECT_OFFERED ON ACADEMIC_TERMS.TERM_CODE
    = COURSE_CATALOG_SUBJECT_OFFERED.EFFECTIVE_TERM_CODE WHERE ACADEMIC_TERMS.TERM_STATUS_INDICATOR
    = 'P' GROUP BY ACADEMIC_TERMS.ACADEMIC_YEAR, ACADEMIC_TERMS.ACADEMIC_YEAR_DESC,
    COURSE_CATALOG_SUBJECT_OFFERED.DEPARTMENT_NAME ) SELECT inner_cte.ACADEMIC_YEAR,
    inner_cte.ACADEMIC_YEAR_DESC, inner_cte.DEPARTMENT_NAME, inner_cte.dept_avg_total_units,
    (inner_cte.dept_avg_total_units - overall.avg_total_units) AS deviation_from_overall_avg
    FROM inner_cte JOIN ( SELECT ACADEMIC_YEAR, AVG(dept_avg_total_units) AS avg_total_units
    FROM ( SELECT ACADEMIC_TERMS.ACADEMIC_YEAR, COURSE_CATALOG_SUBJECT_OFFERED.DEPARTMENT_NAME,
    AVG(COURSE_CATALOG_SUBJECT_OFFERED.TOTAL_UNITS) AS dept_avg_total_units FROM ACADEMIC_TERMS_ALL
    JOIN ACADEMIC_TERMS ON ACADEMIC_TERMS_ALL.TERM_CODE = ACADEMIC_TERMS.TERM_CODE
    JOIN COURSE_CATALOG_SUBJECT_OFFERED ON ACADEMIC_TERMS.TERM_CODE = COURSE_CATALOG_SUBJECT_OFFERED.EFFECTIVE_TERM_CODE
    WHERE ACADEMIC_TERMS.TERM_STATUS_INDICATOR = 'P' GROUP BY ACADEMIC_TERMS.ACADEMIC_YEAR,
    COURSE_CATALOG_SUBJECT_OFFERED.DEPARTMENT_NAME ) dept_avgs GROUP BY ACADEMIC_YEAR
    ) overall ON inner_cte.ACADEMIC_YEAR = overall.ACADEMIC_YEAR ORDER BY inner_cte.ACADEMIC_YEAR,
    deviation_from_overall_avg DESC;
- category: Library Reserve and Enrollment Comprehensive Analysis
  default_granularity: one row per subject group
  desc: For each subject group in the term "2019SP", show the subject group ID and
    the highest number of enrolled students among all subjects in that group, along
    with the average total units for the group. Do not return any rounded answers.
  id: dw_2628
  name: Subject Group Max Enrollment and Average Total Units in Term 2019SP
  sql: WITH inner_cte AS ( SELECT lso.SUBJECT_TITLE, lso.NUM_ENROLLED_STUDENTS, at.TERM_DESCRIPTION,
    ss.TOTAL_UNITS, ss.SUBJECT_GROUP_ID FROM LIBRARY_SUBJECT_OFFERED lso JOIN ACADEMIC_TERMS
    at ON lso.TERM_CODE = at.TERM_CODE JOIN SUBJECT_SUMMARY ss ON at.TERM_CODE = ss.TERM_CODE
    AND lso.SUBJECT_ID = ss.SUBJECT_ID WHERE lso.TERM_CODE = '2019SP' ) SELECT SUBJECT_GROUP_ID,
    MAX(NUM_ENROLLED_STUDENTS) AS highest_enrolled_students, AVG(TOTAL_UNITS) AS avg_total_units
    FROM inner_cte GROUP BY SUBJECT_GROUP_ID;
- category: IAP Activity and Course Catalog Comprehensive Analysis
  default_granularity: one row per activity/HASS attribute combination with rollup
    totals
  desc: For IAP subjects with a maximum enrollment of 12, show the activity title,
    enrollment type, academic year, term description, subject title, and the HASS
    attribute description. For each academic year, include a grand total for all HASS
    attribute descriptions in the format of (activity title, enrollment type, academic
    year, term description, null, total count). Do not return any rounded answers.
  id: dw_2810
  name: IAP Activities with Max Enrollment 12 by HASS Attribute with Rollup Totals
  sql: WITH inner_cte AS ( SELECT t0.ACTIVITY_TITLE, t0.ENROLLMENT_TYPE, t1.ACADEMIC_YEAR,
    t1.TERM_DESCRIPTION, t2.SUBJECT_TITLE, RANK() OVER (PARTITION BY t1.ACADEMIC_YEAR
    ORDER BY t0.ACTIVITY_TITLE) AS window_column FROM IAP_SUBJECT_DETAIL t0 JOIN ACADEMIC_TERMS
    t1 ON t0.TERM_CODE = t1.TERM_CODE JOIN COURSE_CATALOG_SUBJECT_OFFERED t2 ON t1.TERM_CODE
    = t2.TERM_CODE WHERE t0.MAX_ENROLLMENT = 12 ), HASS_CTE AS ( SELECT ic.ACTIVITY_TITLE,
    ic.ENROLLMENT_TYPE, ic.ACADEMIC_YEAR, ic.TERM_DESCRIPTION, ic.SUBJECT_TITLE, t2.HASS_ATTRIBUTE_DESC
    FROM inner_cte ic JOIN COURSE_CATALOG_SUBJECT_OFFERED t2 ON ic.SUBJECT_TITLE =
    t2.SUBJECT_TITLE AND ic.ACADEMIC_YEAR = t2.ACADEMIC_YEAR ), RollupResults AS (
    SELECT ACTIVITY_TITLE, ENROLLMENT_TYPE, ACADEMIC_YEAR, TERM_DESCRIPTION, HASS_ATTRIBUTE_DESC,
    COUNT(*) AS total_count FROM HASS_CTE GROUP BY ACTIVITY_TITLE, ENROLLMENT_TYPE,
    ACADEMIC_YEAR, TERM_DESCRIPTION, HASS_ATTRIBUTE_DESC WITH ROLLUP HAVING COUNT(*)
    > 0 ) SELECT ACTIVITY_TITLE, ENROLLMENT_TYPE, ACADEMIC_YEAR, TERM_DESCRIPTION,
    HASS_ATTRIBUTE_DESC, total_count FROM RollupResults ORDER BY ACTIVITY_TITLE, HASS_ATTRIBUTE_DESC
- category: Academic Term Analysis
  default_granularity: one row per academic year
  desc: For each academic year, provide the academic year description, the geometric
    mean of the degree year from all academic terms where the degree year is greater
    than 1900, and classify the academic year as 'RECENT' if the geometric mean is
    at least 2010, 'OLD' if it is less than 1980, or 'AVERAGE' otherwise. Do not return
    any rounded answers.
  id: dw_2957
  name: Geometric Mean Degree Year by Academic Year with Recency Classification
  sql: WITH inner_cte AS ( SELECT ACADEMIC_TERMS_ALL.ACADEMIC_YEAR, ACADEMIC_TERMS_ALL.ACADEMIC_YEAR_DESC,
    EXP(AVG(LN(ACADEMIC_TERMS.DEGREE_YEAR))) AS geometric_mean_degree_year FROM ACADEMIC_TERMS_ALL
    JOIN ACADEMIC_TERMS ON ACADEMIC_TERMS_ALL.TERM_CODE = ACADEMIC_TERMS.TERM_CODE
    WHERE ACADEMIC_TERMS.DEGREE_YEAR > 1900 GROUP BY ACADEMIC_TERMS_ALL.ACADEMIC_YEAR,
    ACADEMIC_TERMS_ALL.ACADEMIC_YEAR_DESC ) SELECT inner_cte.ACADEMIC_YEAR, inner_cte.ACADEMIC_YEAR_DESC,
    inner_cte.geometric_mean_degree_year, CASE WHEN inner_cte.geometric_mean_degree_year
    >= 2010 THEN 'RECENT' WHEN inner_cte.geometric_mean_degree_year < 1980 THEN 'OLD'
    ELSE 'AVERAGE' END AS year_category FROM inner_cte ORDER BY inner_cte.geometric_mean_degree_year
    DESC;
- category: Enrollment Analysis
  default_granularity: one row per department per academic year
  desc: For each academic year, among subjects that are not repeatable, what is the
    average, variance, and standard deviation (using STDDEV only and never STDDEV_POP)
    of the number of enrolled students in subjects offered by each department? List
    the academic year, department name, average enrollment, variance, and standard
    deviation (using STDDEV only and never STDDEV_POP), ordered by variance descending.
    Do not return any rounded answers.
  id: dw_2958
  name: Non-Repeatable Subject Enrollment Average Variance Stddev by Department and
    Year
  sql: WITH inner_cte AS ( SELECT ACADEMIC_TERMS.ACADEMIC_YEAR, SUBJECT_OFFERED.OFFER_DEPT_NAME,
    SUBJECT_OFFERED.NUM_ENROLLED_STUDENTS FROM SUBJECT_OFFERED JOIN ACADEMIC_TERMS
    ON SUBJECT_OFFERED.TERM_CODE = ACADEMIC_TERMS.TERM_CODE WHERE SUBJECT_OFFERED.IS_REPEATABLE_SUBJECT
    = 'N' ) SELECT inner_cte.ACADEMIC_YEAR, inner_cte.OFFER_DEPT_NAME, AVG(inner_cte.NUM_ENROLLED_STUDENTS)
    AS avg_enrollment, VARIANCE(inner_cte.NUM_ENROLLED_STUDENTS) AS enrollment_variance,
    STDDEV(inner_cte.NUM_ENROLLED_STUDENTS) AS enrollment_stddev FROM inner_cte GROUP
    BY inner_cte.ACADEMIC_YEAR, inner_cte.OFFER_DEPT_NAME ORDER BY enrollment_variance
    DESC;
- category: IAP Activity Analysis
  default_granularity: one row per IAP activity
  desc: For each IAP subject activity with a maximum enrollment greater than 10, show
    the activity title, enrollment type, term description, subject ID, and the sum
    of maximum enrollment within each academic year, but only include activities that
    are not cancelled and are part of multiple sessions. Order the results by activity
    title. Do not return any rounded answers.
  id: dw_3047
  name: IAP Multiple-Session Non-Cancelled Activities Yearly Max Enrollment Sum
  sql: WITH inner_cte AS ( SELECT t0.ACTIVITY_TITLE, t0.ENROLLMENT_TYPE, t1.TERM_DESCRIPTION,
    t2.SUBJECT_ID, SUM(t0.MAX_ENROLLMENT) OVER (PARTITION BY t1.ACADEMIC_YEAR ORDER
    BY t0.ACTIVITY_TITLE) AS window_column, t0.IS_CANCELLED, t0.IS_MULTIPLE_SESSION
    FROM IAP_SUBJECT_DETAIL t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE = t1.TERM_CODE
    JOIN TIP_DETAIL t2 ON t1.TERM_CODE = t2.TERM_CODE WHERE t0.MAX_ENROLLMENT > 10
    ) SELECT ACTIVITY_TITLE, ENROLLMENT_TYPE, TERM_DESCRIPTION, SUBJECT_ID, window_column
    FROM inner_cte WHERE IS_CANCELLED = 'N' AND IS_MULTIPLE_SESSION = 'Y' ORDER BY
    ACTIVITY_TITLE;
- category: Textbook Material and Enrollment Comprehensive Analysis
  default_granularity: one row per subject per source term
  desc: 'List all subjects from the term "2010FA" and all subjects offered in the
    term with code "2025FA", showing for each row: subject ID, term description, material
    status key, academic year, rank of the subject within each academic year group
    ordered by subject ID, subject title, offering department name, number of enrolled
    students, term start date, term end date, term parameter, the minimum number of
    enrolled students over each offering department, and the source term ("2010FA"
    or "2025FA"). The columns should appear in the following order: subject ID, term
    description, material status key, academic year, rank, subject title, offering
    department name, number of enrolled students, term start date, term end date,
    term parameter, minimum enrolled students per department, and source term. Order
    the results by subject ID and source term. Do not return any rounded answers.'
  id: dw_3224
  name: Union of 2010FA TIP Material Subjects and 2025FA Offered Subjects with Department
    Min Enrollment
  sql: WITH Subq1 AS ( SELECT t2.SUBJECT_ID, t0.TERM_DESCRIPTION, t2.TIP_MATERIAL_STATUS_KEY,
    t1.ACADEMIC_YEAR, RANK() OVER (PARTITION BY t1.ACADEMIC_YEAR ORDER BY t2.SUBJECT_ID)
    AS window_column FROM ACADEMIC_TERMS_ALL t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE
    = t1.TERM_CODE JOIN TIP_DETAIL t2 ON t1.TERM_CODE = t2.TERM_CODE WHERE t2.TERM_CODE
    = '2010FA' ), Subq2 AS ( SELECT t0.SUBJECT_ID, t0.SUBJECT_TITLE, t0.OFFER_DEPT_NAME,
    t0.NUM_ENROLLED_STUDENTS, t1.TERM_DESCRIPTION, t1.ACADEMIC_YEAR, t1.TERM_START_DATE,
    t1.TERM_END_DATE, t2.TERM_PARAMETER, min(t0.NUM_ENROLLED_STUDENTS) OVER (PARTITION
    BY t0.OFFER_DEPT_NAME ORDER BY t0.OFFER_DEPT_NAME) AS min_enrolled_students_per_dept
    FROM TIP_SUBJECT_OFFERED t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE = t1.TERM_CODE
    JOIN ACADEMIC_TERM_PARAMETER t2 ON t1.TERM_CODE = t2.TERM_CODE WHERE t0.TERM_CODE
    = '2025FA' ), CombinedSubjects AS ( SELECT s1.SUBJECT_ID, s1.TERM_DESCRIPTION,
    s1.TIP_MATERIAL_STATUS_KEY, s1.ACADEMIC_YEAR, s1.window_column, NULL AS SUBJECT_TITLE,
    NULL AS OFFER_DEPT_NAME, NULL AS NUM_ENROLLED_STUDENTS, NULL AS TERM_START_DATE,
    NULL AS TERM_END_DATE, NULL AS TERM_PARAMETER, NULL AS min_enrolled_students_per_dept,
    '2010FA' AS SOURCE_TERM FROM Subq1 s1 UNION ALL SELECT s2.SUBJECT_ID, s2.TERM_DESCRIPTION,
    NULL AS TIP_MATERIAL_STATUS_KEY, s2.ACADEMIC_YEAR, NULL AS window_column, s2.SUBJECT_TITLE,
    s2.OFFER_DEPT_NAME, s2.NUM_ENROLLED_STUDENTS, s2.TERM_START_DATE, s2.TERM_END_DATE,
    s2.TERM_PARAMETER, s2.min_enrolled_students_per_dept, '2025FA' AS SOURCE_TERM
    FROM Subq2 s2 ) SELECT * FROM CombinedSubjects ORDER BY SUBJECT_ID, SOURCE_TERM;
- category: Library Reserve and Subject Offering Comprehensive Analysis
  default_granularity: one row per subject
  desc: For subjects offered in the academic year 2024 with a total of 12 units that
    are also offered in the library by the Mathematics department during regular terms,
    show the subject code, subject number, subject title, department name, term description,
    the rank of each subject within its department ordered by subject code, the number
    of enrolled students, offering department name, academic year, subject short title,
    and the maximum total units for each row and the next two rows in order of subject
    ID. Do not return any rounded answers.
  id: dw_3248
  name: 2024 12-Unit Subjects Matched with Math Library Regular-Term Offerings and
    3-Row Max Units
  sql: WITH Subjects2024_12Units AS ( SELECT t0.SUBJECT_CODE, t0.SUBJECT_NUMBER, t0.SUBJECT_TITLE,
    t0.DEPARTMENT_NAME, t1.TERM_DESCRIPTION, RANK() OVER (PARTITION BY t0.DEPARTMENT_NAME
    ORDER BY t0.SUBJECT_CODE) AS window_column, t0.SUBJECT_ID FROM COURSE_CATALOG_SUBJECT_OFFERED
    t0 JOIN ACADEMIC_TERMS t1 ON t0.EFFECTIVE_TERM_CODE = t1.TERM_CODE JOIN SUBJECT_SUMMARY
    t2 ON t1.TERM_CODE = t2.TERM_CODE WHERE t0.ACADEMIC_YEAR = 2024 AND t0.TOTAL_UNITS
    = 12 ), MathLibrarySubjects AS ( SELECT t0.SUBJECT_TITLE, t0.NUM_ENROLLED_STUDENTS,
    t0.OFFER_DEPT_NAME, t1.TERM_DESCRIPTION, t1.ACADEMIC_YEAR, t2.SUBJECT_SHORT_TITLE,
    MAX(t2.TOTAL_UNITS) OVER (ORDER BY t0.SUBJECT_ID ROWS BETWEEN CURRENT ROW AND
    2 FOLLOWING) AS max_total_units, t0.SUBJECT_ID FROM LIBRARY_SUBJECT_OFFERED t0
    JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE = t1.TERM_CODE JOIN COURSE_CATALOG_SUBJECT_OFFERED
    t2 ON t1.TERM_CODE = t2.TERM_CODE AND t0.SUBJECT_ID = t2.SUBJECT_ID WHERE t0.OFFER_DEPT_NAME
    = 'Mathematics' AND t1.IS_REGULAR_TERM = 'Y' ) SELECT s.SUBJECT_CODE, s.SUBJECT_NUMBER,
    s.SUBJECT_TITLE, s.DEPARTMENT_NAME, s.TERM_DESCRIPTION, s.window_column, m.NUM_ENROLLED_STUDENTS,
    m.OFFER_DEPT_NAME, m.ACADEMIC_YEAR, m.SUBJECT_SHORT_TITLE, m.max_total_units FROM
    Subjects2024_12Units s JOIN MathLibrarySubjects m ON s.SUBJECT_ID = m.SUBJECT_ID
    ORDER BY s.DEPARTMENT_NAME, s.SUBJECT_CODE, m.NUM_ENROLLED_STUDENTS DESC
- category: Textbook Material and Enrollment Comprehensive Analysis
  default_granularity: one row per subject
  desc: For subjects offered in the 2019FA term that have total units greater than
    1, show the subject title, the dense rank of each subject considering the current
    and 2 preceding rows ordered by the academic year, the subject ID, the department
    name, and the running sum of total units within each school ordered by subject
    ID. Do not return any rounded answers.
  id: dw_3280
  name: 2019FA Subjects Dense Rank by Academic Year and School Running Sum of Total
    Units
  sql: WITH subq1 AS ( SELECT t0.SUBJECT_TITLE, t0.SUBJECT_ID, dense_rank() OVER (ORDER
    BY t1.ACADEMIC_YEAR ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) AS window_column
    FROM TIP_SUBJECT_OFFERED t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE = t1.TERM_CODE
    WHERE t0.TERM_CODE = '2019FA' ), subq2 AS ( SELECT t1.SUBJECT_ID, t1.SUBJECT_TITLE,
    t1.DEPARTMENT_NAME, SUM(t1.TOTAL_UNITS) OVER (PARTITION BY t1.SCHOOL_CODE ORDER
    BY t1.SUBJECT_ID) AS window_column FROM ACADEMIC_TERMS_ALL t0 JOIN SUBJECT_SUMMARY
    t1 ON t0.TERM_CODE = t1.TERM_CODE JOIN ACADEMIC_TERMS t2 ON t1.TERM_CODE = t2.TERM_CODE
    WHERE t1.TERM_CODE = '2019FA' AND t1.TOTAL_UNITS > 1 ) SELECT s1.SUBJECT_TITLE,
    s1.window_column AS subject_dense_rank, s2.SUBJECT_ID, s2.DEPARTMENT_NAME, s2.window_column
    AS running_sum_total_units FROM subq1 s1 JOIN subq2 s2 ON s1.SUBJECT_ID = s2.SUBJECT_ID
    ORDER BY s2.SUBJECT_ID;
- category: Course Catalog and Academic Term Comprehensive Analysis
  default_granularity: one row per Engineering course per current term parameter
  desc: For courses in the School of Engineering that are degree granting, and for
    academic term parameters where the term indicator is 'C', show the course description,
    department name, the dense rank of each course considering the current and 2 preceding
    rows ordered by the department's budget code, the term parameter, the term code,
    the academic year, and the running sum of academic years within each department
    ordered by academic year, for cases where the department matches in both sets.
    Do not return any rounded answers.
  id: dw_3294
  name: Engineering Degree-Granting Courses Dense Rank by Budget Code with Current
    Term Running Year Sum
  sql: WITH EngCourses AS ( SELECT t0.COURSE_DESCRIPTION, t1.DEPARTMENT_NAME, dense_rank()
    OVER (ORDER BY t1.DEPT_BUDGET_CODE ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) AS
    window_column, t1.DEPARTMENT_CODE FROM SIS_COURSE_DESCRIPTION t0 JOIN SIS_DEPARTMENT
    t1 ON t0.DEPARTMENT = t1.DEPARTMENT_CODE WHERE t1.SCHOOL_NAME = 'Engineering'
    AND t1.IS_DEGREE_GRANTING = 'Y' ), TermParams AS ( SELECT t0.TERM_PARAMETER, t0.TERM_CODE,
    t1.ACADEMIC_YEAR, t2.DEPARTMENT_NAME, SUM(t1.ACADEMIC_YEAR) OVER (PARTITION BY
    t2.DEPARTMENT_NAME ORDER BY t1.ACADEMIC_YEAR) AS window_column, t2.DEPARTMENT_CODE
    FROM ACADEMIC_TERM_PARAMETER t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE = t1.TERM_CODE
    JOIN COURSE_CATALOG_SUBJECT_OFFERED t2 ON t1.TERM_CODE = t2.EFFECTIVE_TERM_CODE
    WHERE t0.TERM_INDICATOR = 'C' ) SELECT ec.COURSE_DESCRIPTION, ec.DEPARTMENT_NAME,
    ec.window_column AS eng_course_dense_rank, tp.TERM_PARAMETER, tp.TERM_CODE, tp.ACADEMIC_YEAR,
    tp.window_column AS term_param_running_sum FROM EngCourses ec JOIN TermParams
    tp ON ec.DEPARTMENT_CODE = tp.DEPARTMENT_CODE
- category: Library Reserve and Textbook Material Comprehensive Analysis
  default_granularity: one row per reserve material matched with textbook material
  desc: For each library reserve material detail with material status key 'U', show
    the reserve catalog key, subject offered key, term code, academic year, term description,
    tip material key, tip material status key, and the average record count in a window
    of 2 preceding and 2 following rows grouped by the tip material status key and
    ordered by the academic year, along with the corresponding textbook material in
    the TIP_DETAIL table with material status key 'RQ' that matches on tip material
    key and academic year, showing the textbook subject offered key, textbook material
    key, subject ID, textbook academic year, textbook term description, and the row
    number within each textbook academic year group ordered by term code. Present
    the results in the order of reserve material academic year descending and textbook
    row number. Do not return any rounded answers.
  id: dw_3357
  name: Reserve Materials Status U Matched with Required Textbooks by Material Key
    and Year
  sql: WITH ReserveMaterialDetails AS ( SELECT t0.LIBRARY_RESERVE_CATALOG_KEY, t0.LIBRARY_SUBJECT_OFFERED_KEY,
    t0.TERM_CODE, t1.ACADEMIC_YEAR, t1.TERM_DESCRIPTION, t2.TIP_MATERIAL_KEY, t2.TIP_MATERIAL_STATUS_KEY,
    AVG(t2.RECORD_COUNT) OVER ( PARTITION BY t2.TIP_MATERIAL_STATUS_KEY ORDER BY t1.ACADEMIC_YEAR
    ROWS BETWEEN 2 PRECEDING AND 2 FOLLOWING ) AS window_column FROM LIBRARY_RESERVE_MATRL_DETAIL
    t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE = t1.TERM_CODE JOIN TIP_DETAIL t2 ON
    t1.TERM_CODE = t2.TERM_CODE WHERE t0.LIBRARY_MATERIAL_STATUS_KEY = 'U' ), TextbookMaterialDetails
    AS ( SELECT t1.TIP_SUBJECT_OFFERED_KEY, t1.TIP_MATERIAL_KEY, t1.SUBJECT_ID, t1.TERM_CODE,
    t0.ACADEMIC_YEAR, t0.TERM_DESCRIPTION, ROW_NUMBER() OVER (PARTITION BY t0.ACADEMIC_YEAR
    ORDER BY t1.TERM_CODE) AS window_column FROM ACADEMIC_TERMS_ALL t0 JOIN TIP_DETAIL
    t1 ON t0.TERM_CODE = t1.TERM_CODE WHERE t1.TIP_MATERIAL_STATUS_KEY = 'RQ' ) SELECT
    rmd.LIBRARY_RESERVE_CATALOG_KEY, rmd.LIBRARY_SUBJECT_OFFERED_KEY, rmd.TERM_CODE,
    rmd.ACADEMIC_YEAR, rmd.TERM_DESCRIPTION, rmd.TIP_MATERIAL_KEY, rmd.TIP_MATERIAL_STATUS_KEY,
    rmd.window_column AS reserve_window_avg_record_count, tmd.TIP_SUBJECT_OFFERED_KEY,
    tmd.TIP_MATERIAL_KEY AS textbook_material_key, tmd.SUBJECT_ID, tmd.ACADEMIC_YEAR
    AS textbook_academic_year, tmd.TERM_DESCRIPTION AS textbook_term_description,
    tmd.window_column AS textbook_row_number FROM ReserveMaterialDetails rmd JOIN
    TextbookMaterialDetails tmd ON rmd.TIP_MATERIAL_KEY = tmd.TIP_MATERIAL_KEY AND
    rmd.ACADEMIC_YEAR = tmd.ACADEMIC_YEAR ORDER BY rmd.ACADEMIC_YEAR DESC, tmd.window_column
- category: Library Reserve and Enrollment Comprehensive Analysis
  default_granularity: one row per library subject
  desc: For subjects with at least 5 enrolled students that are offered by the library
    in the term with code '2014FA', show the subject ID, subject title, number of
    enrolled students, term code, material status key, ISBN, row number within each
    material status group ordered by subject ID, offering department name, term description,
    term start date, term end date, and the minimum number of enrolled students for
    each offering department, ordered by offering department name, material status
    key, and subject ID. Do not return any rounded answers.
  id: dw_3393
  name: 2014FA Library Subjects with 5+ Enrolled Students by Material Status and Department
    Min Enrollment
  sql: WITH Subq1 AS ( SELECT t0.SUBJECT_ID, t0.SUBJECT_TITLE, t0.NUM_ENROLLED_STUDENTS,
    t0.TERM_CODE, t1.TIP_MATERIAL_STATUS_KEY, t1.ISBN, ROW_NUMBER() OVER (PARTITION
    BY t1.TIP_MATERIAL_STATUS_KEY ORDER BY t0.SUBJECT_ID) AS window_column FROM LIBRARY_SUBJECT_OFFERED
    t0 JOIN TIP_DETAIL t1 ON t0.SUBJECT_ID = t1.SUBJECT_ID WHERE t0.NUM_ENROLLED_STUDENTS
    >= 5 ), Subq2 AS ( SELECT t0.SUBJECT_ID, t0.SUBJECT_TITLE, t0.NUM_ENROLLED_STUDENTS,
    t0.OFFER_DEPT_NAME, t1.TERM_DESCRIPTION, t1.TERM_START_DATE, t1.TERM_END_DATE,
    min(t0.NUM_ENROLLED_STUDENTS) OVER (PARTITION BY t0.OFFER_DEPT_NAME ORDER BY t0.OFFER_DEPT_NAME)
    AS min_enrolled_per_dept FROM LIBRARY_SUBJECT_OFFERED t0 JOIN ACADEMIC_TERMS t1
    ON t0.TERM_CODE = t1.TERM_CODE WHERE t0.TERM_CODE = '2014FA' ) SELECT s1.SUBJECT_ID,
    s1.SUBJECT_TITLE, s1.NUM_ENROLLED_STUDENTS, s1.TERM_CODE, s1.TIP_MATERIAL_STATUS_KEY,
    s1.ISBN, s1.window_column, s2.OFFER_DEPT_NAME, s2.TERM_DESCRIPTION, s2.TERM_START_DATE,
    s2.TERM_END_DATE, s2.min_enrolled_per_dept FROM Subq1 s1 JOIN Subq2 s2 ON s1.SUBJECT_ID
    = s2.SUBJECT_ID ORDER BY s2.OFFER_DEPT_NAME, s1.TIP_MATERIAL_STATUS_KEY, s1.SUBJECT_ID
- category: IAP Activity and Academic Term Comprehensive Analysis
  default_granularity: one row per IAP activity
  desc: For IAP subject activities in the term "2021JA" that are not cancelled and
    have a maximum enrollment of 30, show the activity title, enrollment type, calendar
    date, the row number within a window of 2 preceding and 1 following rows ordered
    by activity title, and the dense rank of each activity considering the current
    and 2 preceding rows ordered by the academic year from the academic terms table,
    in that order. Do not return any rounded answers.
  id: dw_3409
  name: 2021JA Non-Cancelled IAP Activities Row Number and Academic Year Dense Rank
  sql: WITH Subquery1 AS ( SELECT t0.ACTIVITY_TITLE, t0.ENROLLMENT_TYPE, t1.CALENDAR_DATE,
    ROW_NUMBER() OVER (ORDER BY t0.ACTIVITY_TITLE ROWS BETWEEN 2 PRECEDING AND 1 FOLLOWING)
    AS window_column, t0.TERM_CODE FROM IAP_SUBJECT_DETAIL t0 JOIN TIME_DAY t1 ON
    t0.TERM_CODE = t1.ACADEMIC_TERM_CODE WHERE t0.TERM_CODE = '2021JA' AND t0.IS_CANCELLED
    = 'N' ), Subquery2 AS ( SELECT t0.ACTIVITY_TITLE, dense_rank() OVER (ORDER BY
    t1.ACADEMIC_YEAR ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) AS window_column, t0.TERM_CODE
    FROM IAP_SUBJECT_DETAIL t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE = t1.TERM_CODE
    JOIN ACADEMIC_TERMS_ALL t2 ON t1.TERM_CODE = t2.TERM_CODE WHERE t0.MAX_ENROLLMENT
    = 30 ) SELECT s1.ACTIVITY_TITLE, s1.ENROLLMENT_TYPE, s1.CALENDAR_DATE, s1.window_column
    AS row_number_window, s2.window_column AS dense_rank_window FROM Subquery1 s1
    JOIN Subquery2 s2 ON s1.ACTIVITY_TITLE = s2.ACTIVITY_TITLE AND s1.TERM_CODE =
    s2.TERM_CODE;
- category: Academic Term and Subject Offering Comprehensive Analysis
  default_granularity: one row per previous-status term
  desc: For each academic term where the term status indicator is 'P', show the term
    code, the term parameter, the term description, the academic year, the term start
    date, and the average academic year in a window of 2 preceding and 2 following
    rows grouped by the term indicator and ordered by the term start date. Additionally,
    for the academic year of each such term, give the academic year description, the
    average total units, and the standard deviation (using STDDEV only and never STDDEV_POP)
    of the total units for subjects offered in regular terms, with the results ordered
    by term code and by the standard deviation (using STDDEV only and never STDDEV_POP)
    of total units in descending order. Do not return any rounded answers.
  id: dw_3417
  name: Previous Terms Windowed Academic Year Average with Regular-Term Unit Stddev
    by Year
  sql: WITH AcademicYearStats AS ( SELECT ACADEMIC_TERMS.ACADEMIC_YEAR, ACADEMIC_TERMS.ACADEMIC_YEAR_DESC,
    AVG(COURSE_CATALOG_SUBJECT_OFFERED.TOTAL_UNITS) AS avg_total_units, STDDEV(COURSE_CATALOG_SUBJECT_OFFERED.TOTAL_UNITS)
    AS stddev_total_units FROM ACADEMIC_TERMS JOIN COURSE_CATALOG_SUBJECT_OFFERED
    ON ACADEMIC_TERMS.TERM_CODE = COURSE_CATALOG_SUBJECT_OFFERED.EFFECTIVE_TERM_CODE
    WHERE ACADEMIC_TERMS.IS_REGULAR_TERM = 'Y' GROUP BY ACADEMIC_TERMS.ACADEMIC_YEAR,
    ACADEMIC_TERMS.ACADEMIC_YEAR_DESC ORDER BY stddev_total_units DESC ), PreviousTerms
    AS ( SELECT t0.TERM_CODE, t1.TERM_PARAMETER, t2.TERM_DESCRIPTION, t0.ACADEMIC_YEAR,
    t1.TERM_START_DATE, AVG(t0.ACADEMIC_YEAR) OVER ( PARTITION BY t1.TERM_INDICATOR
    ORDER BY t0.TERM_START_DATE ROWS BETWEEN 2 PRECEDING AND 2 FOLLOWING ) AS window_column
    FROM ACADEMIC_TERMS_ALL t0 JOIN ACADEMIC_TERM_PARAMETER t1 ON t0.TERM_CODE = t1.TERM_CODE
    JOIN ACADEMIC_TERMS t2 ON t1.TERM_CODE = t2.TERM_CODE WHERE t1.TERM_INDICATOR
    = 'P' ) SELECT pts.TERM_CODE, pts.TERM_PARAMETER, pts.TERM_DESCRIPTION, pts.ACADEMIC_YEAR,
    pts.TERM_START_DATE, pts.window_column, ays.ACADEMIC_YEAR_DESC, ays.avg_total_units,
    ays.stddev_total_units FROM PreviousTerms pts JOIN AcademicYearStats ays ON pts.ACADEMIC_YEAR
    = ays.ACADEMIC_YEAR ORDER BY pts.TERM_CODE, ays.stddev_total_units DESC;
- category: IAP Activity Analysis
  default_granularity: one row per IAP activity session
  desc: For IAP subject activities in term '2021JA' that are not cancelled and have
    a maximum enrollment of at least 20, show the activity title, enrollment type,
    maximum enrollment, session title, session location, session date, session start
    time, session end time, the minimum session start time over each session location
    group, and their dense rank (considering the current and 2 preceding rows) ordered
    by the academic year from the academic terms table, ordered by session location.
    Do not return any rounded answers.
  id: dw_3486
  name: 2021JA IAP Sessions Min Start Time per Location with Academic Year Dense Rank
  sql: WITH IAP_Activities_Sessions AS ( SELECT d.ACTIVITY_TITLE, d.ENROLLMENT_TYPE,
    d.MAX_ENROLLMENT, s.SESSION_TITLE, s.SESSION_LOCATION, s.SESSION_DATE, s.SESSION_START_TIME,
    s.SESSION_END_TIME, MIN(s.SESSION_START_TIME) OVER (PARTITION BY s.SESSION_LOCATION
    ORDER BY s.SESSION_LOCATION) AS min_start_time_per_location FROM IAP_SUBJECT_DETAIL
    d JOIN IAP_SUBJECT_SESSION s ON d.IAP_SUBJECT_SESSION_KEY = s.IAP_SUBJECT_SESSION_KEY
    WHERE d.TERM_CODE = '2021JA' AND d.IS_CANCELLED = 'N' ), IAP_Activities_Rank AS
    ( SELECT t1.ACTIVITY_TITLE, dense_rank() OVER (ORDER BY t2.ACADEMIC_YEAR ROWS
    BETWEEN 2 PRECEDING AND CURRENT ROW) AS window_column FROM TIME_DAY t0 JOIN IAP_SUBJECT_DETAIL
    t1 ON t0.ACADEMIC_TERM_CODE = t1.TERM_CODE JOIN ACADEMIC_TERMS t2 ON t1.TERM_CODE
    = t2.TERM_CODE WHERE t1.MAX_ENROLLMENT >= 20 ) SELECT a.ACTIVITY_TITLE, a.ENROLLMENT_TYPE,
    a.MAX_ENROLLMENT, a.SESSION_TITLE, a.SESSION_LOCATION, a.SESSION_DATE, a.SESSION_START_TIME,
    a.SESSION_END_TIME, a.min_start_time_per_location, r.window_column FROM IAP_Activities_Sessions
    a JOIN IAP_Activities_Rank r ON a.ACTIVITY_TITLE = r.ACTIVITY_TITLE ORDER BY a.SESSION_LOCATION;
- category: Subject Offering and Textbook Material Comprehensive Analysis
  default_granularity: one row per subject with textbooks
  desc: For subjects offered in the academic year 2022 with a total of 12 units that
    also have at least one required or optional textbook, show the subject code, subject
    number, department name, subject title, term description, total units, the average
    subject enrollment number in a window of 2 preceding and 2 following rows grouped
    by department code and ordered by total units, the textbook material key, the
    textbook material status key, and the row number of the course within each department
    ordered by subject code. List the results in order by department name, subject
    code, and subject number. Do not return any rounded answers.
  id: dw_3493
  name: 2022 12-Unit Subjects with Required or Optional Textbooks and Enrollment Windows
  sql: WITH SubjectUnitsWindow AS ( SELECT t0.SUBJECT_CODE, t0.SUBJECT_NUMBER, t0.DEPARTMENT_NAME,
    t0.SUBJECT_TITLE, t1.TERM_DESCRIPTION, t0.TOTAL_UNITS, AVG(t2.SUBJECT_ENROLLMENT_NUMBER)
    OVER ( PARTITION BY t0.DEPARTMENT_CODE ORDER BY t0.TOTAL_UNITS ROWS BETWEEN 2
    PRECEDING AND 2 FOLLOWING ) AS window_column, t0.TERM_CODE, t0.SUBJECT_ID FROM
    COURSE_CATALOG_SUBJECT_OFFERED t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE = t1.TERM_CODE
    JOIN SUBJECT_SUMMARY t2 ON t1.TERM_CODE = t2.TERM_CODE AND t0.SUBJECT_ID = t2.SUBJECT_ID
    WHERE t0.ACADEMIC_YEAR = 2022 AND t0.TOTAL_UNITS = 12 ), CourseTextbookWindow
    AS ( SELECT t0.SUBJECT_CODE, t0.SUBJECT_NUMBER, t0.DEPARTMENT_NAME, t0.SUBJECT_TITLE,
    t1.TERM_DESCRIPTION, t2.TIP_MATERIAL_KEY, t2.TIP_MATERIAL_STATUS_KEY, ROW_NUMBER()
    OVER (PARTITION BY t0.DEPARTMENT_NAME ORDER BY t0.SUBJECT_CODE) AS window_column,
    t0.TERM_CODE, t0.SUBJECT_ID FROM COURSE_CATALOG_SUBJECT_OFFERED t0 JOIN ACADEMIC_TERMS_ALL
    t1 ON t0.TERM_CODE = t1.TERM_CODE JOIN TIP_DETAIL t2 ON t1.TERM_CODE = t2.TERM_CODE
    AND t0.SUBJECT_ID = t2.SUBJECT_ID WHERE t1.ACADEMIC_YEAR = 2022 AND t2.TIP_MATERIAL_STATUS_KEY
    IN ('RQ', 'EO') ) SELECT s.SUBJECT_CODE, s.SUBJECT_NUMBER, s.DEPARTMENT_NAME,
    s.SUBJECT_TITLE, s.TERM_DESCRIPTION, s.TOTAL_UNITS, s.window_column AS avg_enrollment_window,
    c.TIP_MATERIAL_KEY, c.TIP_MATERIAL_STATUS_KEY, c.window_column AS textbook_row_number
    FROM SubjectUnitsWindow s JOIN CourseTextbookWindow c ON s.SUBJECT_CODE = c.SUBJECT_CODE
    AND s.SUBJECT_NUMBER = c.SUBJECT_NUMBER AND s.DEPARTMENT_NAME = c.DEPARTMENT_NAME
    AND s.SUBJECT_TITLE = c.SUBJECT_TITLE AND s.TERM_DESCRIPTION = c.TERM_DESCRIPTION
    AND s.TERM_CODE = c.TERM_CODE AND s.SUBJECT_ID = c.SUBJECT_ID ORDER BY s.DEPARTMENT_NAME,
    s.SUBJECT_CODE, s.SUBJECT_NUMBER;
- category: Enrollment Analysis
  default_granularity: one row per subject in term 2012SU
  desc: For each subject offered in the term with code '2012SU', show the subject
    title, subject ID, offer department name, academic year, term description, the
    minimum number of enrolled students in a window of 3 preceding and 1 following
    row ordered by the academic year, and the standard deviation (using STDDEV only
    and never STDDEV_POP) of the total units for that subject (considering only subjects
    offered by the "Harvard Cross-Enrollment Prog" department and with more than 5
    offerings). Do not return any rounded answers.
  id: dw_3530
  name: 2012SU Subjects Windowed Min Enrollment with Cross-Enrollment Total Units
    Stddev
  sql: WITH SubjectUnitsStddev AS ( SELECT sos.SUBJECT_TITLE, STDDEV(sos.TOTAL_UNITS)
    AS total_units_stddev FROM SUBJECT_OFFERED so JOIN SUBJECT_OFFERED_SUMMARY sos
    ON so.COMPOSITE_SUBJECT_KEY = sos.COMPOSITE_SUBJECT_KEY WHERE so.OFFER_DEPT_NAME
    = 'Harvard Cross-Enrollment Prog' GROUP BY sos.SUBJECT_TITLE HAVING COUNT(*) >
    5 ORDER BY total_units_stddev DESC ), Subjects2012SU AS ( SELECT t1.SUBJECT_TITLE,
    t1.SUBJECT_ID, t1.OFFER_DEPT_NAME, t0.ACADEMIC_YEAR, t0.TERM_DESCRIPTION, MIN(t1.NUM_ENROLLED_STUDENTS)
    OVER (ORDER BY t0.ACADEMIC_YEAR ROWS BETWEEN 3 PRECEDING AND 1 FOLLOWING) AS window_column
    FROM ACADEMIC_TERMS t0 JOIN SUBJECT_OFFERED t1 ON t0.TERM_CODE = t1.TERM_CODE
    JOIN SUBJECT_OFFERED_SUMMARY t2 ON t1.TERM_CODE = t2.TERM_CODE WHERE t1.TERM_CODE
    = '2012SU' ) SELECT s2.SUBJECT_TITLE, s2.SUBJECT_ID, s2.OFFER_DEPT_NAME, s2.ACADEMIC_YEAR,
    s2.TERM_DESCRIPTION, s2.window_column, s1.total_units_stddev FROM Subjects2012SU
    s2 JOIN SubjectUnitsStddev s1 ON s2.SUBJECT_TITLE = s1.SUBJECT_TITLE ORDER BY
    s2.SUBJECT_TITLE, s2.SUBJECT_ID;
- category: Enrollment Analysis
  default_granularity: one row per subject pair across the two terms
  desc: For all pairs of subjects where one is offered in the term '2019FA' with more
    than 0 enrolled students and the other is in the term '2009SP', show the 2019FA
    subject title, offer department name, department full name, number of enrolled
    students, and the average number of enrolled students in a window of 2 preceding
    and 2 following rows grouped by the school code, along with the 2009SP subject
    title, department name, total units, and the row number within a window of 2 preceding
    and 1 following rows ordered by subject title. Do not return any rounded answers.
  id: dw_3597
  name: Cross-Term Subject Pairs 2019FA Enrollment Windows vs 2009SP Unit Row Numbers
  sql: WITH subq1 AS ( SELECT t0.SUBJECT_TITLE, t0.OFFER_DEPT_NAME, t1.DEPARTMENT_FULL_NAME,
    t0.NUM_ENROLLED_STUDENTS, AVG(t0.NUM_ENROLLED_STUDENTS) OVER ( PARTITION BY t1.SCHOOL_CODE
    ORDER BY t0.SUBJECT_TITLE ROWS BETWEEN 2 PRECEDING AND 2 FOLLOWING ) AS window_column,
    t0.TERM_CODE FROM TIP_SUBJECT_OFFERED t0 JOIN SIS_DEPARTMENT t1 ON t0.OFFER_DEPT_CODE
    = t1.DEPARTMENT_CODE WHERE t0.TERM_CODE = '2019FA' AND t0.NUM_ENROLLED_STUDENTS
    > 0 ), subq2 AS ( SELECT t1.SUBJECT_TITLE, t1.DEPARTMENT_NAME, t1.TOTAL_UNITS,
    ROW_NUMBER() OVER ( ORDER BY t1.SUBJECT_TITLE ROWS BETWEEN 2 PRECEDING AND 1 FOLLOWING
    ) AS window_column, t1.TERM_CODE FROM ACADEMIC_TERMS t0 JOIN SUBJECT_SUMMARY t1
    ON t0.TERM_CODE = t1.TERM_CODE WHERE t0.TERM_CODE = '2009SP' ) SELECT s1.SUBJECT_TITLE
    AS subject_title_2019fa, s1.OFFER_DEPT_NAME, s1.DEPARTMENT_FULL_NAME, s1.NUM_ENROLLED_STUDENTS,
    s1.window_column AS avg_enrolled_window, s2.SUBJECT_TITLE AS subject_title_2009sp,
    s2.DEPARTMENT_NAME, s2.TOTAL_UNITS, s2.window_column AS row_number_window FROM
    subq1 s1 CROSS JOIN subq2 s2;
- category: IAP Activity and Subject Offering Comprehensive Analysis
  default_granularity: one row per sponsor per Engineering subject per term
  desc: For each sponsor and each subject in the "Engineering" school with total units
    greater than 1 in the same academic term, provide the sponsor name, the average
    and variance of the maximum enrollment for their IAP activities, the subject title,
    department name, school name, academic year description, and the minimum total
    units in a window of 3 preceding and 1 following row ordered by the academic year.
    Do not return any rounded answers.
  id: dw_3609
  name: IAP Sponsor Max Enrollment Statistics Matched with Engineering Subject Unit
    Windows
  sql: WITH sponsor_stats AS ( SELECT s.SPONSOR_NAME, AVG(d.MAX_ENROLLMENT) AS avg_max_enrollment,
    VARIANCE(d.MAX_ENROLLMENT) AS var_max_enrollment, d.TERM_CODE FROM IAP_SUBJECT_DETAIL
    d JOIN IAP_SUBJECT_SPONSOR s ON d.IAP_SUBJECT_SPONSOR_KEY = s.IAP_SUBJECT_SPONSOR_KEY
    WHERE d.MAX_ENROLLMENT IS NOT NULL GROUP BY s.SPONSOR_NAME, d.TERM_CODE ), eng_subjects
    AS ( SELECT s.SUBJECT_TITLE, s.DEPARTMENT_NAME, s.SCHOOL_NAME, ata.ACADEMIC_YEAR_DESC,
    s.TERM_CODE, MIN(s.TOTAL_UNITS) OVER (ORDER BY at.ACADEMIC_YEAR ROWS BETWEEN 3
    PRECEDING AND 1 FOLLOWING) AS window_column FROM SUBJECT_SUMMARY s JOIN ACADEMIC_TERMS_ALL
    ata ON ata.TERM_CODE = s.TERM_CODE JOIN ACADEMIC_TERMS at ON s.TERM_CODE = at.TERM_CODE
    WHERE s.SCHOOL_NAME = 'Engineering' AND s.TOTAL_UNITS > 1 ) SELECT sponsor_stats.SPONSOR_NAME,
    sponsor_stats.avg_max_enrollment, sponsor_stats.var_max_enrollment, eng_subjects.SUBJECT_TITLE,
    eng_subjects.DEPARTMENT_NAME, eng_subjects.SCHOOL_NAME, eng_subjects.ACADEMIC_YEAR_DESC,
    eng_subjects.window_column FROM sponsor_stats JOIN eng_subjects ON sponsor_stats.TERM_CODE
    = eng_subjects.TERM_CODE ORDER BY sponsor_stats.var_max_enrollment DESC, eng_subjects.ACADEMIC_YEAR_DESC
- category: IAP Activity and Textbook Material Comprehensive Analysis
  default_granularity: one row per IAP activity matched with required textbook material
    per term
  desc: For IAP subject activities with a maximum enrollment of 30 and tip details
    where the material status key is 'RQ', show the activity title, enrollment type,
    prerequisites, term code, IAP term description, term start date, term end date,
    the minimum term start date over each term code group, the tip subject offered
    key, tip material key, subject ID, tip term description, academic year, and the
    average record count in a window of 2 preceding and 2 following rows grouped by
    academic year, ordered by term code and academic year. Do not return any rounded
    answers.
  id: dw_3612
  name: IAP Activities Max Enrollment 30 with Required Textbook Record Count Windows
  sql: WITH IAPActivities AS ( SELECT t0.ACTIVITY_TITLE, t0.ENROLLMENT_TYPE, t0.PREREQUISITES,
    t0.TERM_CODE, t1.TERM_DESCRIPTION, t1.TERM_START_DATE, t1.TERM_END_DATE, min(t1.TERM_START_DATE)
    OVER (PARTITION BY t0.TERM_CODE ORDER BY t0.TERM_CODE) AS window_column FROM IAP_SUBJECT_DETAIL
    t0 JOIN ACADEMIC_TERMS_ALL t1 ON t0.TERM_CODE = t1.TERM_CODE WHERE t0.MAX_ENROLLMENT
    = 30 ), TipMaterialStats AS ( SELECT t0.TIP_SUBJECT_OFFERED_KEY, t0.TIP_MATERIAL_KEY,
    t0.SUBJECT_ID, t1.TERM_DESCRIPTION, t1.ACADEMIC_YEAR, AVG(t0.RECORD_COUNT) OVER
    (PARTITION BY t1.ACADEMIC_YEAR ORDER BY t1.TERM_START_DATE ROWS BETWEEN 2 PRECEDING
    AND 2 FOLLOWING) AS window_column, t0.TERM_CODE FROM TIP_DETAIL t0 JOIN ACADEMIC_TERMS
    t1 ON t0.TERM_CODE = t1.TERM_CODE WHERE t0.TIP_MATERIAL_STATUS_KEY = 'RQ' ) SELECT
    ia.ACTIVITY_TITLE, ia.ENROLLMENT_TYPE, ia.PREREQUISITES, ia.TERM_CODE, ia.TERM_DESCRIPTION
    AS IAP_TERM_DESCRIPTION, ia.TERM_START_DATE, ia.TERM_END_DATE, ia.window_column
    AS IAP_MIN_TERM_START_DATE, tms.TIP_SUBJECT_OFFERED_KEY, tms.TIP_MATERIAL_KEY,
    tms.SUBJECT_ID, tms.TERM_DESCRIPTION AS TIP_TERM_DESCRIPTION, tms.ACADEMIC_YEAR,
    tms.window_column AS TIP_AVG_RECORD_COUNT FROM IAPActivities ia JOIN TipMaterialStats
    tms ON ia.TERM_CODE = tms.TERM_CODE ORDER BY ia.TERM_CODE, tms.ACADEMIC_YEAR
- category: Enrollment Analysis
  default_granularity: one row per subject in term 2012SU
  desc: For subjects offered in the term "2012SU", show the subject title, subject
    key, offer department name, subject enrollment number, subject offered summary
    key, the average subject enrollment number within each subject key group, subject
    ID, academic year, term description, and the minimum number of enrolled students
    in a window of 3 preceding and 1 following row, ordered by offer department name
    and academic year. Do not return any rounded answers.
  id: dw_3632
  name: 2012SU Subject Enrollment Averages per Subject Key with Windowed Min Enrolled
    Students
  sql: WITH Subquery1 AS ( SELECT t0.SUBJECT_TITLE, t0.SUBJECT_KEY, t0.OFFER_DEPT_NAME,
    t0.SUBJECT_ENROLLMENT_NUMBER, t0.SUBJECT_OFFERED_SUMMARY_KEY, AVG(t0.SUBJECT_ENROLLMENT_NUMBER)
    OVER (PARTITION BY t0.SUBJECT_KEY ORDER BY t0.OFFER_DEPT_NAME) AS window_column
    FROM SUBJECT_OFFERED t0 JOIN SUBJECT_OFFERED_SUMMARY t1 ON t0.TERM_CODE = t1.TERM_CODE
    WHERE t0.TERM_CODE = '2012SU' ), Subquery2 AS ( SELECT t1.SUBJECT_TITLE, t1.SUBJECT_ID,
    t1.OFFER_DEPT_NAME, t0.ACADEMIC_YEAR, t0.TERM_DESCRIPTION, MIN(t1.NUM_ENROLLED_STUDENTS)
    OVER (ORDER BY t0.ACADEMIC_YEAR ROWS BETWEEN 3 PRECEDING AND 1 FOLLOWING) AS window_column
    FROM ACADEMIC_TERMS t0 JOIN SUBJECT_OFFERED t1 ON t0.TERM_CODE = t1.TERM_CODE
    JOIN SUBJECT_OFFERED_SUMMARY t2 ON t1.TERM_CODE = t2.TERM_CODE WHERE t1.TERM_CODE
    = '2012SU' ) SELECT s1.SUBJECT_TITLE, s1.SUBJECT_KEY, s1.OFFER_DEPT_NAME, s1.SUBJECT_ENROLLMENT_NUMBER,
    s1.SUBJECT_OFFERED_SUMMARY_KEY, s1.window_column AS avg_subject_enrollment_number,
    s2.SUBJECT_ID, s2.ACADEMIC_YEAR, s2.TERM_DESCRIPTION, s2.window_column AS min_num_enrolled_students_window
    FROM Subquery1 s1 JOIN Subquery2 s2 ON s1.SUBJECT_TITLE = s2.SUBJECT_TITLE AND
    s1.OFFER_DEPT_NAME = s2.OFFER_DEPT_NAME ORDER BY s1.OFFER_DEPT_NAME, s2.ACADEMIC_YEAR
- category: Subject Offering and Enrollment Comprehensive Analysis
  default_granularity: one row per 2024 subject paired with same-department 2019FA
    subject
  desc: For subjects offered in the academic year 2024 with a total of 12 units, and
    for subjects offered in the term 2019FA from the same department, show the subject
    code, subject number, subject title, department name, term description, the rank
    of each 2024 subject within its department ordered by subject code, the 2019FA
    subject ID, number of enrolled students in 2019FA, department full name, and the
    row number of each 2019FA subject within its department name group ordered by
    subject ID. Order the results by department name, subject code, and 2019FA subject
    ID. Do not return any rounded answers.
  id: dw_3635
  name: 2024 12-Unit Subjects Matched with Same-Department 2019FA Offerings and Enrollment
  sql: WITH Subjects2024_12Units AS ( SELECT t0.SUBJECT_CODE, t0.SUBJECT_NUMBER, t0.SUBJECT_TITLE,
    t0.DEPARTMENT_NAME, t1.TERM_DESCRIPTION, RANK() OVER (PARTITION BY t0.DEPARTMENT_NAME
    ORDER BY t0.SUBJECT_CODE) AS window_column FROM COURSE_CATALOG_SUBJECT_OFFERED
    t0 JOIN ACADEMIC_TERMS t1 ON t0.EFFECTIVE_TERM_CODE = t1.TERM_CODE JOIN SUBJECT_SUMMARY
    t2 ON t1.TERM_CODE = t2.TERM_CODE WHERE t0.ACADEMIC_YEAR = 2024 AND t0.TOTAL_UNITS
    = 12 ), Subjects2019FA AS ( SELECT t0.SUBJECT_ID, t0.SUBJECT_TITLE, t0.NUM_ENROLLED_STUDENTS,
    t1.DEPARTMENT_NAME, t1.DEPARTMENT_FULL_NAME, ROW_NUMBER() OVER (PARTITION BY t1.DEPARTMENT_NAME
    ORDER BY t0.SUBJECT_ID) AS window_column FROM TIP_SUBJECT_OFFERED t0 JOIN SIS_DEPARTMENT
    t1 ON t0.OFFER_DEPT_CODE = t1.DEPARTMENT_CODE WHERE t0.TERM_CODE = '2019FA' )
    SELECT s24.SUBJECT_CODE, s24.SUBJECT_NUMBER, s24.SUBJECT_TITLE, s24.DEPARTMENT_NAME,
    s24.TERM_DESCRIPTION, s24.window_column AS department_rank_2024, s19.SUBJECT_ID,
    s19.NUM_ENROLLED_STUDENTS, s19.DEPARTMENT_FULL_NAME, s19.window_column AS department_rownum_2019
    FROM Subjects2024_12Units s24 JOIN Subjects2019FA s19 ON s24.DEPARTMENT_NAME =
    s19.DEPARTMENT_NAME ORDER BY s24.DEPARTMENT_NAME, s24.SUBJECT_CODE, s19.SUBJECT_ID;
- category: Course Catalog and Textbook Material Comprehensive Analysis
  default_granularity: one row per Engineering course matched with Fall 2024-2025
    subject offering
  desc: For courses in the School of Engineering that are degree granting, and for
    each subject offered in the term with the description "Fall Term 2024-2025" by
    the same department, show the course description, department name, the dense rank
    of each course considering the current and 2 preceding rows ordered by the department's
    budget code, the subject offered key, subject title, offering department name,
    the term description, and the rank of each subject within its offering department
    ordered by subject offered key. Do not return any rounded answers.
  id: dw_3660
  name: Engineering Degree-Granting Courses with Fall 2024-2025 Subject Offerings
    Ranked per Department
  sql: WITH Subquery1 AS ( SELECT t0.COURSE_DESCRIPTION, t1.DEPARTMENT_NAME, t1.DEPARTMENT_CODE,
    dense_rank() OVER (ORDER BY t1.DEPT_BUDGET_CODE ROWS BETWEEN 2 PRECEDING AND CURRENT
    ROW) AS window_column FROM SIS_COURSE_DESCRIPTION t0 JOIN SIS_DEPARTMENT t1 ON
    t0.DEPARTMENT = t1.DEPARTMENT_CODE WHERE t1.SCHOOL_NAME = 'Engineering' AND t1.IS_DEGREE_GRANTING
    = 'Y' ), Subquery2 AS ( SELECT t0.TIP_SUBJECT_OFFERED_KEY, t0.SUBJECT_TITLE, t0.OFFER_DEPT_NAME,
    t0.OFFER_DEPT_CODE, t1.TERM_DESCRIPTION, RANK() OVER (PARTITION BY t0.OFFER_DEPT_NAME
    ORDER BY t0.TIP_SUBJECT_OFFERED_KEY) AS window_column FROM TIP_SUBJECT_OFFERED
    t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE = t1.TERM_CODE JOIN ACADEMIC_TERM_PARAMETER
    t2 ON t1.TERM_CODE = t2.TERM_CODE WHERE t1.TERM_DESCRIPTION = 'Fall Term 2024-2025'
    ) SELECT s1.COURSE_DESCRIPTION, s1.DEPARTMENT_NAME, s1.window_column AS course_dense_rank,
    s2.TIP_SUBJECT_OFFERED_KEY, s2.SUBJECT_TITLE, s2.OFFER_DEPT_NAME, s2.TERM_DESCRIPTION,
    s2.window_column AS subject_rank_within_dept FROM Subquery1 s1 JOIN Subquery2
    s2 ON s1.DEPARTMENT_CODE = s2.OFFER_DEPT_CODE
- category: Library Reserve and Subject Offering Comprehensive Analysis
  default_granularity: one row per top reserved subject
  desc: For the top 10 subject titles by the number of reserved library materials
    for subjects offered in the term '2009SP', display each subject title, the offering
    department name, the count of reserved materials, the academic year, the department
    name, the average of the total units, and the variance of the total units for
    subjects offered in regular terms, with the columns shown in that order. Do not
    return any rounded answers.
  id: dw_3664
  name: Top 10 Reserved-Material Subjects in 2009SP with Regular-Term Unit Average
    and Variance
  sql: WITH avg_var_units AS ( SELECT c.ACADEMIC_YEAR, c.DEPARTMENT_NAME, AVG(c.TOTAL_UNITS)
    AS avg_total_units, VARIANCE(c.TOTAL_UNITS) AS var_total_units FROM COURSE_CATALOG_SUBJECT_OFFERED
    c JOIN ACADEMIC_TERMS t ON c.TERM_CODE = t.TERM_CODE WHERE t.IS_REGULAR_TERM =
    'Y' GROUP BY c.ACADEMIC_YEAR, c.DEPARTMENT_NAME ORDER BY var_total_units DESC
    ), top_reserved_subjects AS ( SELECT s.SUBJECT_TITLE, s.OFFER_DEPT_NAME, COUNT(l.LIBRARY_RESERVE_CATALOG_KEY)
    AS reserved_materials FROM LIBRARY_RESERVE_MATRL_DETAIL l JOIN TIP_DETAIL t ON
    l.SUBJECT_ID = t.SUBJECT_ID JOIN SUBJECT_OFFERED_SUMMARY s ON t.SUBJECT_ID = s.SUBJECT_ID
    WHERE l.TERM_CODE = '2009SP' GROUP BY s.SUBJECT_TITLE, s.OFFER_DEPT_NAME ORDER
    BY reserved_materials DESC LIMIT 10 ) SELECT trs.SUBJECT_TITLE, trs.OFFER_DEPT_NAME,
    trs.reserved_materials, avu.ACADEMIC_YEAR, avu.DEPARTMENT_NAME, avu.avg_total_units,
    avu.var_total_units FROM top_reserved_subjects trs LEFT JOIN avg_var_units avu
    ON trs.OFFER_DEPT_NAME = avu.DEPARTMENT_NAME ORDER BY trs.reserved_materials DESC,
    avu.var_total_units DESC;
- category: Department Offering and Textbook Material Comprehensive Analysis
  default_granularity: one row per department
  desc: For each department that is degree-granting and offered at least one subject
    in the School of Engineering in 2021, or for each department that offered more
    than 10 tip materials for subjects in the School of Engineering during regular
    terms, provide the department code, department name, department full name, the
    number of subjects offered, the total number of enrolled students in those subjects,
    and the total number of tip materials. List the department code, department name,
    department full name, number of subjects offered, total number of enrolled students,
    and total number of tip materials in that order. Do not return any rounded answers.
  id: dw_3727
  name: Engineering Degree-Granting Departments 2021 Subject Counts and TIP Material
    Totals Union
  sql: WITH DeptSubjects AS ( SELECT d.DEPARTMENT_CODE, d.DEPARTMENT_NAME, d.DEPARTMENT_FULL_NAME,
    COUNT(s.SUBJECT_OFFERED_SUMMARY_KEY) AS subject_count, SUM(s.NUM_ENROLLED_STUDENTS)
    AS total_enrollment FROM SIS_DEPARTMENT d JOIN SUBJECT_OFFERED_SUMMARY s ON d.DEPARTMENT_CODE
    = s.OFFER_DEPT_CODE WHERE d.IS_DEGREE_GRANTING = 'Y' AND s.OFFER_SCHOOL_NAME =
    'Engineering' AND s.TERM_CODE LIKE '2021%' GROUP BY d.DEPARTMENT_CODE, d.DEPARTMENT_NAME,
    d.DEPARTMENT_FULL_NAME ), DeptTipMaterials AS ( SELECT s.DEPARTMENT_NAME, SUM(t.RECORD_COUNT)
    AS total_tip_materials FROM TIP_DETAIL t JOIN ACADEMIC_TERMS a ON t.TERM_CODE
    = a.TERM_CODE JOIN SUBJECT_SUMMARY s ON a.TERM_CODE = s.TERM_CODE AND t.SUBJECT_ID
    = s.SUBJECT_ID WHERE s.SCHOOL_NAME = 'Engineering' AND a.IS_REGULAR_TERM = 'Y'
    GROUP BY s.DEPARTMENT_NAME HAVING SUM(t.RECORD_COUNT) > 10 ), CombinedDept AS
    ( SELECT ds.DEPARTMENT_CODE, ds.DEPARTMENT_NAME, ds.DEPARTMENT_FULL_NAME, ds.subject_count,
    ds.total_enrollment, dtm.total_tip_materials FROM DeptSubjects ds LEFT JOIN DeptTipMaterials
    dtm ON ds.DEPARTMENT_NAME = dtm.DEPARTMENT_NAME UNION ALL SELECT NULL AS DEPARTMENT_CODE,
    dtm.DEPARTMENT_NAME, NULL AS DEPARTMENT_FULL_NAME, NULL AS subject_count, NULL
    AS total_enrollment, dtm.total_tip_materials FROM DeptTipMaterials dtm LEFT JOIN
    DeptSubjects ds ON dtm.DEPARTMENT_NAME = ds.DEPARTMENT_NAME WHERE ds.DEPARTMENT_NAME
    IS NULL ) SELECT * FROM CombinedDept ORDER BY DEPARTMENT_NAME;
- category: Library Reserve and IAP Activity Comprehensive Analysis
  default_granularity: one row per subject matched between reserve and IAP scopes
  desc: For each subject that both has a material status key of 'RQ' and also has
    an activity with enrollment type "Advance sign-up required" and a maximum enrollment
    of 12, show the subject title, the number of enrolled students from the RQ group,
    the term code from the library reserve material detail, the offer department name,
    the responsible faculty name, the tip material key, the row number within each
    tip material status key group ordered by subject title, the activity title, the
    term code from the IAP subject detail, the maximum enrollment, the term description,
    the term start date, the number of enrolled students from the IAP group, and the
    row number within each subject title group ordered by activity title. Do not return
    any rounded answers.
  id: dw_3736
  name: Subjects with Required Textbooks and Advance Sign-Up IAP Activities Max Enrollment
    12
  sql: WITH rq_subjects AS ( SELECT t1.SUBJECT_TITLE, t1.NUM_ENROLLED_STUDENTS, t3.TERM_CODE,
    t1.OFFER_DEPT_NAME, t1.RESPONSIBLE_FACULTY_NAME, t2.TIP_MATERIAL_KEY, ROW_NUMBER()
    OVER (PARTITION BY t2.TIP_MATERIAL_STATUS_KEY ORDER BY t1.SUBJECT_TITLE) AS window_column
    FROM LIBRARY_SUBJECT_OFFERED t1 JOIN TIP_DETAIL t2 ON t1.SUBJECT_ID = t2.SUBJECT_ID
    JOIN LIBRARY_RESERVE_MATRL_DETAIL t3 ON t2.SUBJECT_ID = t3.SUBJECT_ID WHERE t2.TIP_MATERIAL_STATUS_KEY
    = 'RQ' ), iap_subjects AS ( SELECT t0.ACTIVITY_TITLE, t0.TERM_CODE, t0.MAX_ENROLLMENT,
    t1.TERM_DESCRIPTION, t1.TERM_START_DATE, t2.SUBJECT_TITLE, t2.NUM_ENROLLED_STUDENTS,
    ROW_NUMBER() OVER (PARTITION BY t2.SUBJECT_TITLE ORDER BY t0.ACTIVITY_TITLE) AS
    window_column FROM IAP_SUBJECT_DETAIL t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE
    = t1.TERM_CODE JOIN LIBRARY_SUBJECT_OFFERED t2 ON t1.TERM_CODE = t2.TERM_CODE
    WHERE t0.ENROLLMENT_TYPE = 'Advance sign-up required' AND t0.MAX_ENROLLMENT =
    12 ) SELECT rq.SUBJECT_TITLE, rq.NUM_ENROLLED_STUDENTS, rq.TERM_CODE AS RQ_TERM_CODE,
    rq.OFFER_DEPT_NAME, rq.RESPONSIBLE_FACULTY_NAME, rq.TIP_MATERIAL_KEY, rq.window_column
    AS RQ_WINDOW_COLUMN, iap.ACTIVITY_TITLE, iap.TERM_CODE AS IAP_TERM_CODE, iap.MAX_ENROLLMENT,
    iap.TERM_DESCRIPTION, iap.TERM_START_DATE, iap.NUM_ENROLLED_STUDENTS AS IAP_NUM_ENROLLED_STUDENTS,
    iap.window_column AS IAP_WINDOW_COLUMN FROM rq_subjects rq JOIN iap_subjects iap
    ON rq.SUBJECT_TITLE = iap.SUBJECT_TITLE ORDER BY rq.SUBJECT_TITLE, iap.ACTIVITY_TITLE
- category: IAP Activity and Course Catalog Comprehensive Analysis
  default_granularity: one row per IAP activity matched with subject and department
    counts
  desc: For IAP subjects with a maximum enrollment of 12, show the activity title,
    enrollment type, academic year, term description, subject title, the difference
    between the maximum enrollment and the total units, the subject code, subject
    code description, department name, and the number of subjects in the same department,
    for each subject offered in the same term and where the school code and subject
    title are not null. Do not return any rounded answers.
  id: dw_3887
  name: IAP Max Enrollment 12 Activities with Enrollment-Unit Difference and Department
    Subject Counts
  sql: WITH iap_enrollment AS ( WITH inner_cte AS ( SELECT t0.ACTIVITY_TITLE, t0.ENROLLMENT_TYPE,
    t1.ACADEMIC_YEAR, t1.TERM_DESCRIPTION, t2.SUBJECT_TITLE, RANK() OVER (PARTITION
    BY t1.ACADEMIC_YEAR ORDER BY t0.ACTIVITY_TITLE) AS window_column FROM IAP_SUBJECT_DETAIL
    t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE = t1.TERM_CODE JOIN COURSE_CATALOG_SUBJECT_OFFERED
    t2 ON t1.TERM_CODE = t2.TERM_CODE WHERE t0.MAX_ENROLLMENT = 12 ) SELECT i.ACTIVITY_TITLE,
    i.ENROLLMENT_TYPE, i.ACADEMIC_YEAR, i.TERM_DESCRIPTION, i.SUBJECT_TITLE, (12 -
    c.TOTAL_UNITS) AS enrollment_minus_units FROM inner_cte i JOIN COURSE_CATALOG_SUBJECT_OFFERED
    c ON i.ACADEMIC_YEAR = c.ACADEMIC_YEAR AND i.SUBJECT_TITLE = c.SUBJECT_TITLE ),
    subject_department_counts AS ( WITH inner_cte AS ( SELECT t0.SUBJECT_CODE, t0.SUBJECT_CODE_DESC,
    t0.DEPARTMENT_NAME, t1.SUBJECT_TITLE, t0.DEPARTMENT_CODE FROM SIS_SUBJECT_CODE
    t0 JOIN CIS_COURSE_CATALOG t1 ON t0.DEPARTMENT_CODE = t1.DEPARTMENT_CODE WHERE
    t0.SCHOOL_CODE IS NOT NULL AND t1.SUBJECT_TITLE IS NOT NULL ) SELECT inner_cte.SUBJECT_CODE,
    inner_cte.SUBJECT_CODE_DESC, inner_cte.DEPARTMENT_NAME, inner_cte.SUBJECT_TITLE,
    dept_counts.subjects_in_department, inner_cte.DEPARTMENT_CODE FROM inner_cte JOIN
    ( SELECT t0.DEPARTMENT_CODE, COUNT(*) AS subjects_in_department FROM SIS_SUBJECT_CODE
    t0 JOIN CIS_COURSE_CATALOG t1 ON t0.DEPARTMENT_CODE = t1.DEPARTMENT_CODE WHERE
    t0.SCHOOL_CODE IS NOT NULL AND t1.SUBJECT_TITLE IS NOT NULL GROUP BY t0.DEPARTMENT_CODE
    ) dept_counts ON inner_cte.DEPARTMENT_CODE = dept_counts.DEPARTMENT_CODE ) SELECT
    iap_enrollment.ACTIVITY_TITLE, iap_enrollment.ENROLLMENT_TYPE, iap_enrollment.ACADEMIC_YEAR,
    iap_enrollment.TERM_DESCRIPTION, iap_enrollment.SUBJECT_TITLE, iap_enrollment.enrollment_minus_units,
    subject_department_counts.SUBJECT_CODE, subject_department_counts.SUBJECT_CODE_DESC,
    subject_department_counts.DEPARTMENT_NAME, subject_department_counts.subjects_in_department
    FROM iap_enrollment JOIN subject_department_counts ON iap_enrollment.SUBJECT_TITLE
    = subject_department_counts.SUBJECT_TITLE ORDER BY iap_enrollment.ACADEMIC_YEAR,
    iap_enrollment.ACTIVITY_TITLE;
- category: Library Reserve and Enrollment Comprehensive Analysis
  default_granularity: one row per library subject plus department rollup rows
  desc: For each subject offered by the library in the term with code '2014FA', show
    the subject ID, subject title, total number of enrolled students, offering department
    name, term description, term start date, term end date, and the minimum number
    of enrolled students for each offering department, as well as the maximum windowed
    average record count from tip detail records with material status key 'RQ' (using
    a window of 2 preceding and 2 following rows grouped by financial aid year). Additionally,
    for each offering department, include a grand total row showing the total number
    of enrolled students across all its subjects (with nulls for subject ID and subject
    title), and the corresponding maximum windowed average record count if available.
    Order the results by offering department name and subject ID. Do not return any
    rounded answers.
  id: dw_3911
  name: 2014FA Library Subjects Enrollment Rollup by Department with Required Textbook
    Windowed Record Counts
  sql: WITH Subq1 AS ( WITH inner_cte AS ( SELECT t1.SUBJECT_ID, t0.TERM_DESCRIPTION,
    t0.TERM_START_DATE, t1.TIP_MATERIAL_KEY, AVG(t1.RECORD_COUNT) OVER ( PARTITION
    BY t0.FINANCIAL_AID_YEAR ORDER BY t1.SUBJECT_ID ROWS BETWEEN 2 PRECEDING AND 2
    FOLLOWING ) AS window_column FROM ACADEMIC_TERMS_ALL t0 JOIN TIP_DETAIL t1 ON
    t0.TERM_CODE = t1.TERM_CODE WHERE t1.TIP_MATERIAL_STATUS_KEY = 'RQ' ) SELECT SUBJECT_ID,
    MAX(window_column) AS max_windowed_avg_record_count FROM inner_cte GROUP BY SUBJECT_ID
    ), Subq2 AS ( WITH inner_cte AS ( SELECT t0.SUBJECT_ID, t0.SUBJECT_TITLE, t0.NUM_ENROLLED_STUDENTS,
    t0.OFFER_DEPT_NAME, t1.TERM_DESCRIPTION, t1.TERM_START_DATE, t1.TERM_END_DATE,
    min(t0.NUM_ENROLLED_STUDENTS) OVER (PARTITION BY t0.OFFER_DEPT_NAME ORDER BY t0.OFFER_DEPT_NAME)
    AS min_enrolled_per_dept FROM LIBRARY_SUBJECT_OFFERED t0 JOIN ACADEMIC_TERMS t1
    ON t0.TERM_CODE = t1.TERM_CODE WHERE t0.TERM_CODE = '2014FA' ) SELECT CASE WHEN
    GROUPING(SUBJECT_ID) = 1 THEN NULL ELSE SUBJECT_ID END AS SUBJECT_ID, CASE WHEN
    GROUPING(SUBJECT_TITLE) = 1 THEN NULL ELSE SUBJECT_TITLE END AS SUBJECT_TITLE,
    SUM(NUM_ENROLLED_STUDENTS) AS total_enrolled_students, OFFER_DEPT_NAME, MAX(TERM_DESCRIPTION)
    AS TERM_DESCRIPTION, MAX(TERM_START_DATE) AS TERM_START_DATE, MAX(TERM_END_DATE)
    AS TERM_END_DATE, MIN(min_enrolled_per_dept) AS min_enrolled_per_dept FROM inner_cte
    GROUP BY OFFER_DEPT_NAME, SUBJECT_ID, SUBJECT_TITLE WITH ROLLUP HAVING OFFER_DEPT_NAME
    IS NOT NULL ORDER BY OFFER_DEPT_NAME, SUBJECT_ID ) SELECT s2.SUBJECT_ID, s2.SUBJECT_TITLE,
    s2.total_enrolled_students, s2.OFFER_DEPT_NAME, s2.TERM_DESCRIPTION, s2.TERM_START_DATE,
    s2.TERM_END_DATE, s2.min_enrolled_per_dept, s1.max_windowed_avg_record_count FROM
    Subq2 s2 LEFT JOIN Subq1 s1 ON s2.SUBJECT_ID = s1.SUBJECT_ID ORDER BY s2.OFFER_DEPT_NAME,
    s2.SUBJECT_ID
- category: Subject Offering Analysis
  default_granularity: one row per subject
  desc: For each subject that is both offered in the academic term with term code
    '2006FA' and is in the "Engineering" school with total units equal to 1, show
    the subject ID, subject title, department name, the sum of lecture units within
    each grade type group ordered by subject ID, the name of the responsible faculty
    member for each subject, the academic year, the rank of each subject within its
    academic year group ordered by subject ID, the term description, and the term
    start date, in that order. Do not return any rounded answers.
  id: dw_3944
  name: 2006FA Subjects and Engineering 1-Unit Subjects Lecture Unit Sums by Grade
    Type
  sql: WITH subq1 AS ( WITH inner_cte AS ( SELECT t1.SUBJECT_ID, t1.SUBJECT_TITLE,
    t1.DEPARTMENT_NAME, SUM(t1.LECTURE_UNITS) OVER (PARTITION BY t1.GRADE_TYPE ORDER
    BY t1.SUBJECT_ID) AS window_column, t1.RESPONSIBLE_FACULTY_NAME FROM ACADEMIC_TERMS
    t0 JOIN COURSE_CATALOG_SUBJECT_OFFERED t1 ON t0.TERM_CODE = t1.EFFECTIVE_TERM_CODE
    WHERE t0.TERM_CODE = '2006FA' ) SELECT inner_cte.SUBJECT_ID, inner_cte.SUBJECT_TITLE,
    inner_cte.DEPARTMENT_NAME, inner_cte.window_column, inner_cte.RESPONSIBLE_FACULTY_NAME
    FROM inner_cte ORDER BY inner_cte.SUBJECT_ID ), subq2 AS ( WITH inner_cte AS (
    SELECT t1.SUBJECT_ID, t1.SUBJECT_TITLE, t1.DEPARTMENT_NAME, t2.ACADEMIC_YEAR,
    RANK() OVER (PARTITION BY t2.ACADEMIC_YEAR ORDER BY t1.SUBJECT_ID) AS window_column,
    t1.TERM_CODE FROM SUBJECT_SUMMARY t1 INNER JOIN ACADEMIC_TERMS_ALL t0 ON t0.TERM_CODE
    = t1.TERM_CODE INNER JOIN ACADEMIC_TERMS t2 ON t1.TERM_CODE = t2.TERM_CODE WHERE
    t1.SCHOOL_NAME = 'Engineering' AND t1.TOTAL_UNITS = 1 ) SELECT inner_cte.SUBJECT_ID,
    inner_cte.SUBJECT_TITLE, inner_cte.DEPARTMENT_NAME, inner_cte.ACADEMIC_YEAR, inner_cte.window_column,
    t3.TERM_DESCRIPTION, t3.TERM_START_DATE FROM inner_cte INNER JOIN ACADEMIC_TERMS_ALL
    t3 ON inner_cte.TERM_CODE = t3.TERM_CODE ORDER BY inner_cte.ACADEMIC_YEAR, inner_cte.SUBJECT_ID
    ) SELECT s1.SUBJECT_ID, s1.SUBJECT_TITLE, s1.DEPARTMENT_NAME, s1.window_column
    AS sum_lecture_units_by_grade_type, s1.RESPONSIBLE_FACULTY_NAME, s2.ACADEMIC_YEAR,
    s2.window_column AS subject_rank_within_academic_year, s2.TERM_DESCRIPTION, s2.TERM_START_DATE
    FROM subq1 s1 JOIN subq2 s2 ON s1.SUBJECT_ID = s2.SUBJECT_ID AND s1.SUBJECT_TITLE
    = s2.SUBJECT_TITLE AND s1.DEPARTMENT_NAME = s2.DEPARTMENT_NAME ORDER BY s2.ACADEMIC_YEAR,
    s1.SUBJECT_ID;
- category: IAP Activity and Academic Term Comprehensive Analysis
  default_granularity: one row per IAP activity matched with previous term
  desc: For IAP subject activities with a maximum enrollment of at least 20, show
    the activity title, the dense rank of each activity considering the current and
    2 preceding rows ordered by the academic year of the associated term, the IAP
    term description, and for each such activity, show the previous academic term
    code, previous term description, previous academic year, the running sum of academic
    years within each financial aid year group for previous terms, and the previous
    academic year description, for all previous academic terms that share the same
    term code as the IAP activity. Order the results by activity title and previous
    academic year. Do not return any rounded answers.
  id: dw_3952
  name: IAP Activities Max Enrollment 20+ Dense Rank with Previous Term Running Year
    Sums
  sql: WITH iap_activities AS ( WITH inner_cte AS ( SELECT t0.ACTIVITY_TITLE, dense_rank()
    OVER (ORDER BY t1.ACADEMIC_YEAR ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) AS window_column,
    t0.TERM_CODE FROM IAP_SUBJECT_DETAIL t0 JOIN ACADEMIC_TERMS_ALL t1 ON t0.TERM_CODE
    = t1.TERM_CODE WHERE t0.MAX_ENROLLMENT >= 20 ) SELECT inner_cte.ACTIVITY_TITLE,
    inner_cte.window_column, t2.TERM_DESCRIPTION, inner_cte.TERM_CODE FROM inner_cte
    JOIN ACADEMIC_TERMS_ALL t2 ON inner_cte.TERM_CODE = t2.TERM_CODE ), previous_terms
    AS ( WITH inner_cte AS ( SELECT t0.TERM_CODE, t1.TERM_DESCRIPTION, t0.ACADEMIC_YEAR,
    SUM(t0.ACADEMIC_YEAR) OVER (PARTITION BY t1.FINANCIAL_AID_YEAR ORDER BY t0.ACADEMIC_YEAR)
    AS window_column, t1.ACADEMIC_YEAR_DESC FROM ACADEMIC_TERMS t0 JOIN ACADEMIC_TERMS_ALL
    t1 ON t0.ACADEMIC_TERMS_KEY = t1.ACADEMIC_TERMS_KEY WHERE t0.TERM_STATUS = 'Previous'
    ) SELECT * FROM inner_cte ) SELECT iap_activities.ACTIVITY_TITLE, iap_activities.window_column
    AS IAP_DENSE_RANK, iap_activities.TERM_DESCRIPTION AS IAP_TERM_DESCRIPTION, previous_terms.TERM_CODE
    AS PREV_TERM_CODE, previous_terms.TERM_DESCRIPTION AS PREV_TERM_DESCRIPTION, previous_terms.ACADEMIC_YEAR
    AS PREV_ACADEMIC_YEAR, previous_terms.window_column AS PREV_RUNNING_SUM, previous_terms.ACADEMIC_YEAR_DESC
    AS PREV_ACADEMIC_YEAR_DESC FROM iap_activities JOIN previous_terms ON iap_activities.TERM_CODE
    = previous_terms.TERM_CODE ORDER BY iap_activities.ACTIVITY_TITLE, previous_terms.ACADEMIC_YEAR
- category: IAP Activity and Subject Offering Comprehensive Analysis
  default_granularity: one row per subject matched with IAP activity
  desc: For subjects offered in the term with code '2022FA' that also have at least
    one activity with an enrollment type of "Advance sign-up required" and a maximum
    enrollment of 12 (where the number of enrolled students is at least 10), show
    the subject ID, department name, subject term description, the running sum of
    total units within each academic year, subject title, whether the subject is offered
    in the fall term, the activity title, activity term code, activity maximum enrollment,
    activity term description, activity term start date, number of enrolled students
    in the activity, the offer department name for the activity, the responsible faculty
    name for the activity, and the row number of the activity within each subject
    title group, ordered by subject ID and activity title. Do not return any rounded
    answers.
  id: dw_3959
  name: 2022FA Subjects Running Unit Sums Matched with Advance Sign-Up IAP Activities
  sql: WITH subq1 AS ( WITH inner_cte AS ( SELECT t1.SUBJECT_ID, t1.DEPARTMENT_NAME,
    t0.TERM_DESCRIPTION, SUM(t1.TOTAL_UNITS) OVER (PARTITION BY t1.ACADEMIC_YEAR ORDER
    BY t1.SUBJECT_ID) AS window_column FROM ACADEMIC_TERMS_ALL t0 JOIN COURSE_CATALOG_SUBJECT_OFFERED
    t1 ON t0.TERM_CODE = t1.TERM_CODE WHERE t1.TERM_CODE = '2022FA' ) SELECT icte.SUBJECT_ID,
    icte.DEPARTMENT_NAME, icte.TERM_DESCRIPTION, icte.window_column, t2.SUBJECT_TITLE,
    t2.IS_OFFERED_FALL_TERM FROM inner_cte icte JOIN COURSE_CATALOG_SUBJECT_OFFERED
    t2 ON icte.SUBJECT_ID = t2.SUBJECT_ID AND t2.TERM_CODE = '2022FA' ), subq2 AS
    ( WITH inner_cte AS ( SELECT t0.ACTIVITY_TITLE, t0.TERM_CODE, t0.MAX_ENROLLMENT,
    t1.TERM_DESCRIPTION, t1.TERM_START_DATE, t2.SUBJECT_TITLE, t2.NUM_ENROLLED_STUDENTS,
    ROW_NUMBER() OVER (PARTITION BY t2.SUBJECT_TITLE ORDER BY t0.ACTIVITY_TITLE) AS
    window_column FROM IAP_SUBJECT_DETAIL t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE
    = t1.TERM_CODE JOIN LIBRARY_SUBJECT_OFFERED t2 ON t1.TERM_CODE = t2.TERM_CODE
    WHERE t0.ENROLLMENT_TYPE = 'Advance sign-up required' AND t0.MAX_ENROLLMENT =
    12 ) SELECT inner_cte.ACTIVITY_TITLE, inner_cte.TERM_CODE, inner_cte.MAX_ENROLLMENT,
    inner_cte.TERM_DESCRIPTION, inner_cte.TERM_START_DATE, inner_cte.SUBJECT_TITLE,
    inner_cte.NUM_ENROLLED_STUDENTS, t2.OFFER_DEPT_NAME, t2.RESPONSIBLE_FACULTY_NAME,
    inner_cte.window_column FROM inner_cte JOIN LIBRARY_SUBJECT_OFFERED t2 ON inner_cte.TERM_CODE
    = t2.TERM_CODE AND inner_cte.SUBJECT_TITLE = t2.SUBJECT_TITLE WHERE inner_cte.NUM_ENROLLED_STUDENTS
    >= 10 ORDER BY inner_cte.SUBJECT_TITLE, inner_cte.ACTIVITY_TITLE ) SELECT s1.SUBJECT_ID,
    s1.DEPARTMENT_NAME, s1.TERM_DESCRIPTION AS SUBJECT_TERM_DESCRIPTION, s1.window_column
    AS SUBJECT_RUNNING_SUM_TOTAL_UNITS, s1.SUBJECT_TITLE AS SUBJECT_TITLE, s1.IS_OFFERED_FALL_TERM,
    s2.ACTIVITY_TITLE, s2.TERM_CODE AS ACTIVITY_TERM_CODE, s2.MAX_ENROLLMENT, s2.TERM_DESCRIPTION
    AS ACTIVITY_TERM_DESCRIPTION, s2.TERM_START_DATE, s2.NUM_ENROLLED_STUDENTS, s2.OFFER_DEPT_NAME,
    s2.RESPONSIBLE_FACULTY_NAME, s2.window_column AS ACTIVITY_ROW_NUMBER FROM subq1
    s1 JOIN subq2 s2 ON s1.SUBJECT_TITLE = s2.SUBJECT_TITLE ORDER BY s1.SUBJECT_ID,
    s2.ACTIVITY_TITLE;
- category: Academic Term and Textbook Material Comprehensive Analysis
  default_granularity: one row per previous term matched with 2010FA subject
  desc: For each academic year where the running sum of academic years within each
    financial aid year group for previous terms is greater than the average academic
    year across all previous terms, and for each subject in the term "2010FA" that
    is a regular term, show the previous term code, previous term description, previous
    academic year, the running sum of academic years for previous terms, the financial
    aid year, the subject ID, the subject's term description, the material status
    key, the subject's academic year, and the rank of the subject within its academic
    year group ordered by subject ID. The results are ordered by financial aid year,
    previous academic year, and subject ID. Do not return any rounded answers.
  id: dw_3966
  name: Previous Terms Running Year Sums Above Average Matched with 2010FA Regular
    Term Subjects
  sql: WITH subq1 AS ( WITH inner_cte AS ( SELECT t0.TERM_CODE, t1.TERM_DESCRIPTION,
    t0.ACADEMIC_YEAR, t1.FINANCIAL_AID_YEAR, SUM(t0.ACADEMIC_YEAR) OVER (PARTITION
    BY t1.FINANCIAL_AID_YEAR ORDER BY t0.ACADEMIC_YEAR) AS window_column FROM ACADEMIC_TERMS
    t0 JOIN ACADEMIC_TERMS_ALL t1 ON t0.ACADEMIC_TERMS_KEY = t1.ACADEMIC_TERMS_KEY
    WHERE t0.TERM_STATUS = 'Previous' ) SELECT TERM_CODE, TERM_DESCRIPTION, ACADEMIC_YEAR,
    window_column, FINANCIAL_AID_YEAR FROM inner_cte WHERE window_column > ( SELECT
    AVG(ACADEMIC_YEAR) FROM ACADEMIC_TERMS WHERE TERM_STATUS = 'Previous' ) ), subq2
    AS ( WITH inner_cte AS ( SELECT t2.SUBJECT_ID, t0.TERM_DESCRIPTION, t2.TIP_MATERIAL_STATUS_KEY,
    t1.ACADEMIC_YEAR, RANK() OVER (PARTITION BY t1.ACADEMIC_YEAR ORDER BY t2.SUBJECT_ID)
    AS window_column FROM ACADEMIC_TERMS_ALL t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE
    = t1.TERM_CODE JOIN TIP_DETAIL t2 ON t1.TERM_CODE = t2.TERM_CODE WHERE t2.TERM_CODE
    = '2010FA' ) SELECT ic.SUBJECT_ID, ic.TERM_DESCRIPTION, ic.TIP_MATERIAL_STATUS_KEY,
    ic.ACADEMIC_YEAR, ic.window_column FROM inner_cte ic JOIN ACADEMIC_TERMS at2 ON
    ic.ACADEMIC_YEAR = at2.ACADEMIC_YEAR AND at2.TERM_CODE = '2010FA' WHERE at2.IS_REGULAR_TERM
    = 'Y' ) SELECT s1.TERM_CODE, s1.TERM_DESCRIPTION AS PREV_TERM_DESCRIPTION, s1.ACADEMIC_YEAR
    AS PREV_ACADEMIC_YEAR, s1.window_column AS PREV_RUNNING_SUM, s1.FINANCIAL_AID_YEAR,
    s2.SUBJECT_ID, s2.TERM_DESCRIPTION AS SUBJECT_TERM_DESCRIPTION, s2.TIP_MATERIAL_STATUS_KEY,
    s2.ACADEMIC_YEAR AS SUBJECT_ACADEMIC_YEAR, s2.window_column AS SUBJECT_RANK FROM
    subq1 s1 JOIN subq2 s2 ON s1.ACADEMIC_YEAR = s2.ACADEMIC_YEAR ORDER BY s1.FINANCIAL_AID_YEAR,
    s1.ACADEMIC_YEAR, s2.SUBJECT_ID
- category: Subject Offering and Enrollment Comprehensive Analysis
  default_granularity: one row per 2006FA subject matched with 2017JA subject of same
    department
  desc: For each subject offered in the academic term with term code '2006FA' in departments
    that offer more than 5 subjects in that term, show the subject ID, subject title,
    department name, the sum of lecture units within each grade type group, and the
    total number of subjects per department for that term. Additionally, for each
    subject offered by the same department in the term '2017JA', show the number of
    enrolled students, offering department name, department full name, subject code,
    subject code description, and whether the number of enrolled students is 'HIGH_ENROLLMENT'
    (at least 10% greater than the average for that subject code), 'LOW_ENROLLMENT'
    (at least 10% less than the average for that subject code), or 'AVERAGE'. Present
    the results ordered by subject ID and subject code. Do not return any rounded
    answers.
  id: dw_3985
  name: 2006FA Department Lecture Unit Sums with 2017JA Enrollment Classification
    per Subject Code
  sql: WITH inner_cte1 AS ( SELECT t1.SUBJECT_ID, t1.SUBJECT_TITLE, t1.DEPARTMENT_NAME,
    t1.DEPARTMENT_CODE, SUM(t1.LECTURE_UNITS) OVER (PARTITION BY t1.GRADE_TYPE ORDER
    BY t1.SUBJECT_ID) AS window_column FROM ACADEMIC_TERMS t0 JOIN COURSE_CATALOG_SUBJECT_OFFERED
    t1 ON t0.TERM_CODE = t1.EFFECTIVE_TERM_CODE WHERE t0.TERM_CODE = '2006FA' ), DeptCounts
    AS ( SELECT DEPARTMENT_NAME, DEPARTMENT_CODE, COUNT(*) AS SUBJECT_COUNT FROM COURSE_CATALOG_SUBJECT_OFFERED
    WHERE EFFECTIVE_TERM_CODE = '2006FA' GROUP BY DEPARTMENT_NAME, DEPARTMENT_CODE
    HAVING COUNT(*) > 5 ), inner_cte2 AS ( SELECT t0.SUBJECT_TITLE, t0.NUM_ENROLLED_STUDENTS,
    t0.OFFER_DEPT_NAME, t0.OFFER_DEPT_CODE, t1.DEPARTMENT_FULL_NAME, t2.SUBJECT_CODE,
    t2.SUBJECT_CODE_DESC FROM TIP_SUBJECT_OFFERED t0 JOIN SIS_DEPARTMENT t1 ON t0.OFFER_DEPT_CODE
    = t1.DEPARTMENT_CODE JOIN SIS_SUBJECT_CODE t2 ON t1.DEPARTMENT_CODE = t2.DEPARTMENT_CODE
    WHERE t0.TERM_CODE = '2017JA' ), subject_code_avg AS ( SELECT SUBJECT_CODE, AVG(NUM_ENROLLED_STUDENTS)
    AS avg_enrollment FROM inner_cte2 GROUP BY SUBJECT_CODE ) SELECT ic1.SUBJECT_ID,
    ic1.SUBJECT_TITLE, ic1.DEPARTMENT_NAME, ic1.window_column, dc.SUBJECT_COUNT, ic2.NUM_ENROLLED_STUDENTS,
    ic2.OFFER_DEPT_NAME, ic2.DEPARTMENT_FULL_NAME, ic2.SUBJECT_CODE, ic2.SUBJECT_CODE_DESC,
    CASE WHEN ic2.NUM_ENROLLED_STUDENTS > sca.avg_enrollment * 1.1 THEN 'HIGH_ENROLLMENT'
    WHEN ic2.NUM_ENROLLED_STUDENTS < sca.avg_enrollment * 0.9 THEN 'LOW_ENROLLMENT'
    ELSE 'AVERAGE' END AS enrollment_category FROM inner_cte1 ic1 JOIN DeptCounts
    dc ON ic1.DEPARTMENT_NAME = dc.DEPARTMENT_NAME AND ic1.DEPARTMENT_CODE = dc.DEPARTMENT_CODE
    JOIN SIS_DEPARTMENT sd ON ic1.DEPARTMENT_CODE = sd.DEPARTMENT_CODE JOIN inner_cte2
    ic2 ON ic1.DEPARTMENT_CODE = ic2.OFFER_DEPT_CODE JOIN subject_code_avg sca ON
    ic2.SUBJECT_CODE = sca.SUBJECT_CODE ORDER BY ic1.SUBJECT_ID, ic2.SUBJECT_CODE;
- category: Subject Offering and Course Catalog Comprehensive Analysis
  default_granularity: one row per subject per Engineering course in same department
  desc: For each department and each subject offered in the academic year 2024, show
    the department name, subject code, subject number, subject title, term code, term
    description, and the highest minimum total units (in a window of 3 preceding and
    1 following row ordered by academic year) for that subject, along with the course
    description, subject code description, and the difference between the number of
    characters in the course description and the average number of characters in course
    descriptions for that department, for courses in the School of Engineering that
    are degree granting. Do not return any rounded answers.
  id: dw_3989
  name: 2024 Subjects Windowed Min Units with Engineering Course Description Length
    Deviation
  sql: WITH inner_cte1 AS ( SELECT t0.SUBJECT_CODE, t0.SUBJECT_NUMBER, t0.SUBJECT_TITLE,
    t0.TERM_CODE, t1.TERM_DESCRIPTION, t0.DEPARTMENT_NAME, MIN(t0.TOTAL_UNITS) OVER
    (ORDER BY t1.ACADEMIC_YEAR ROWS BETWEEN 3 PRECEDING AND 1 FOLLOWING) AS window_column
    FROM COURSE_CATALOG_SUBJECT_OFFERED t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE
    = t1.TERM_CODE WHERE t0.ACADEMIC_YEAR = 2024 ), cte1 AS ( SELECT DEPARTMENT_NAME,
    SUBJECT_CODE, SUBJECT_NUMBER, SUBJECT_TITLE, TERM_CODE, TERM_DESCRIPTION, MAX(window_column)
    AS highest_min_total_units FROM inner_cte1 GROUP BY DEPARTMENT_NAME, SUBJECT_CODE,
    SUBJECT_NUMBER, SUBJECT_TITLE, TERM_CODE, TERM_DESCRIPTION ), inner_cte2 AS (
    SELECT t1.COURSE_DESCRIPTION, t1.DEPARTMENT_NAME, t0.SUBJECT_CODE_DESC, t1.COURSE
    FROM SIS_SUBJECT_CODE t0 JOIN SIS_COURSE_DESCRIPTION t1 ON t0.SUBJECT_CODE = t1.COURSE
    WHERE t1.SCHOOL_NAME = 'Engineering' AND t1.IS_DEGREE_GRANTING = 'Y' ), dept_avg
    AS ( SELECT DEPARTMENT_NAME, AVG(LENGTH(COURSE_DESCRIPTION)) AS avg_desc_length
    FROM inner_cte2 GROUP BY DEPARTMENT_NAME ), cte2 AS ( SELECT i.COURSE_DESCRIPTION,
    i.DEPARTMENT_NAME, i.SUBJECT_CODE_DESC, (LENGTH(i.COURSE_DESCRIPTION) - d.avg_desc_length)
    AS desc_length_deviation, i.COURSE FROM inner_cte2 i JOIN dept_avg d ON i.DEPARTMENT_NAME
    = d.DEPARTMENT_NAME ) SELECT cte1.DEPARTMENT_NAME, cte1.SUBJECT_CODE, cte1.SUBJECT_NUMBER,
    cte1.SUBJECT_TITLE, cte1.TERM_CODE, cte1.TERM_DESCRIPTION, cte1.highest_min_total_units,
    cte2.COURSE_DESCRIPTION, cte2.SUBJECT_CODE_DESC, cte2.desc_length_deviation FROM
    cte1 JOIN cte2 ON cte1.DEPARTMENT_NAME = cte2.DEPARTMENT_NAME AND cte1.SUBJECT_CODE
    = cte2.COURSE ORDER BY cte1.DEPARTMENT_NAME, cte1.SUBJECT_CODE, cte1.SUBJECT_NUMBER;
- category: Subject Offering and Course Catalog Comprehensive Analysis
  default_granularity: one row per 2016SP subject in school E per department
  desc: For subjects offered in the term '2016SP' with a school code of 'E', show
    the subject title, department name, course description, the number of enrolled
    students, the row number within a window of 2 preceding and 1 following rows ordered
    by subject title, and the highest running sum of academic years (within that department)
    for academic term parameters where the term indicator is 'C'. Do not return any
    rounded answers.
  id: dw_4019
  name: 2016SP Engineering School Subjects with Current Term Parameter Running Year
    Sums
  sql: WITH inner_cte1 AS ( SELECT t2.SUBJECT_TITLE, t1.DEPARTMENT_NAME, t1.COURSE_DESCRIPTION,
    ROW_NUMBER() OVER (ORDER BY t2.SUBJECT_TITLE ROWS BETWEEN 2 PRECEDING AND 1 FOLLOWING)
    AS window_column FROM SIS_SUBJECT_CODE t0 JOIN SIS_COURSE_DESCRIPTION t1 ON t0.COURSE_NUMBER
    = t1.COURSE JOIN SUBJECT_OFFERED_SUMMARY t2 ON t1.COURSE = t2.COURSE_NUMBER WHERE
    t2.TERM_CODE = '2016SP' AND t0.SCHOOL_CODE = 'E' ), subq1 AS ( SELECT inner_cte1.SUBJECT_TITLE,
    inner_cte1.DEPARTMENT_NAME, inner_cte1.COURSE_DESCRIPTION, t2.NUM_ENROLLED_STUDENTS,
    inner_cte1.window_column FROM inner_cte1 JOIN SUBJECT_OFFERED_SUMMARY t2 ON inner_cte1.SUBJECT_TITLE
    = t2.SUBJECT_TITLE AND t2.TERM_CODE = '2016SP' ), inner_cte2 AS ( SELECT t0.TERM_PARAMETER,
    t0.TERM_CODE, t1.ACADEMIC_YEAR, t2.DEPARTMENT_NAME, SUM(t1.ACADEMIC_YEAR) OVER
    (PARTITION BY t2.DEPARTMENT_NAME ORDER BY t1.ACADEMIC_YEAR) AS window_column FROM
    ACADEMIC_TERM_PARAMETER t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE = t1.TERM_CODE
    JOIN COURSE_CATALOG_SUBJECT_OFFERED t2 ON t1.TERM_CODE = t2.EFFECTIVE_TERM_CODE
    WHERE t0.TERM_INDICATOR = 'C' ), subq2 AS ( SELECT DEPARTMENT_NAME, MAX(window_column)
    AS highest_running_sum FROM inner_cte2 GROUP BY DEPARTMENT_NAME ) SELECT s1.SUBJECT_TITLE,
    s1.DEPARTMENT_NAME, s1.COURSE_DESCRIPTION, s1.NUM_ENROLLED_STUDENTS, s1.window_column,
    s2.highest_running_sum FROM subq1 s1 JOIN subq2 s2 ON s1.DEPARTMENT_NAME = s2.DEPARTMENT_NAME
    ORDER BY s1.SUBJECT_TITLE;
- category: Subject Offering and Facility Space Comprehensive Analysis
  default_granularity: one row per department-year matched with academic building
  desc: For each department and academic year, show the department name, academic
    year, academic year description, and the geometric mean of the total units for
    all subjects offered by the department in regular terms with total units greater
    than zero, along with, for each academic building where these subjects are held
    and which has rooms larger than 40 square meters, the building name, the average,
    range, and variance of the room areas, as well as the total assignable area of
    the building and the year the building was built. The results are ordered by department
    name, academic year (descending), and room area range (descending). Do not return
    any rounded answers.
  id: dw_4061
  name: Department Geometric Mean Total Units with Academic Building Room Area Statistics
  sql: WITH dept_units AS ( SELECT ACADEMIC_TERMS.ACADEMIC_YEAR, ACADEMIC_TERMS.ACADEMIC_YEAR_DESC,
    EXP(AVG(LN(COURSE_CATALOG_SUBJECT_OFFERED.TOTAL_UNITS))) AS geometric_mean_total_units,
    COURSE_CATALOG_SUBJECT_OFFERED.DEPARTMENT_NAME FROM ACADEMIC_TERMS JOIN COURSE_CATALOG_SUBJECT_OFFERED
    ON ACADEMIC_TERMS.TERM_CODE = COURSE_CATALOG_SUBJECT_OFFERED.EFFECTIVE_TERM_CODE
    WHERE ACADEMIC_TERMS.IS_REGULAR_TERM = 'Y' AND COURSE_CATALOG_SUBJECT_OFFERED.TOTAL_UNITS
    > 0 GROUP BY ACADEMIC_TERMS.ACADEMIC_YEAR, ACADEMIC_TERMS.ACADEMIC_YEAR_DESC,
    COURSE_CATALOG_SUBJECT_OFFERED.DEPARTMENT_NAME ), building_stats AS ( SELECT b.BUILDING_NAME,
    AVG(r.AREA) AS avg_room_area, MAX(r.AREA) - MIN(r.AREA) AS room_area_range, VARIANCE(r.AREA)
    AS room_area_variance FROM FCLT_ROOMS r JOIN FCLT_BUILDING b ON r.FCLT_BUILDING_KEY
    = b.FCLT_BUILDING_KEY WHERE b.BUILDING_TYPE = 'ACADEMIC' AND r.AREA > 40 GROUP
    BY b.BUILDING_NAME ) SELECT ds.DEPARTMENT_NAME, ds.ACADEMIC_YEAR, ds.ACADEMIC_YEAR_DESC,
    ds.geometric_mean_total_units, bs.BUILDING_NAME, bs.avg_room_area, bs.room_area_range,
    bs.room_area_variance, fb.ASSIGNABLE_AREA, fb.DATE_BUILT FROM dept_units ds JOIN
    COURSE_CATALOG_SUBJECT_OFFERED cso ON ds.DEPARTMENT_NAME = cso.DEPARTMENT_NAME
    AND ds.ACADEMIC_YEAR = cso.ACADEMIC_YEAR JOIN FCLT_ROOMS fr ON cso.MEET_PLACE
    = fr.FCLT_ROOM_KEY JOIN FCLT_BUILDING fb ON fr.FCLT_BUILDING_KEY = fb.FCLT_BUILDING_KEY
    JOIN building_stats bs ON fb.BUILDING_NAME = bs.BUILDING_NAME ORDER BY ds.DEPARTMENT_NAME,
    ds.ACADEMIC_YEAR DESC, bs.room_area_range DESC;
- category: IAP Activity and Library Reserve Comprehensive Analysis
  default_granularity: one row per subject matched between IAP activity and material
    status groups
  desc: For subjects with an enrollment type of "Advance sign-up required" and a maximum
    enrollment of 12, and with at least 5 enrolled students, show the subject's activity
    title, term code, maximum enrollment, term description, term start date, subject
    title, number of enrolled students, the responsible faculty name, the row number
    within each subject title group ordered by activity title, the TIP material status
    key, the ISBN, and the row number within each material status group ordered by
    subject ID. Do not return any rounded answers.
  id: dw_4069
  name: Advance Sign-Up IAP Activities Max Enrollment 12 Matched with Library Subjects
    5+ Enrolled
  sql: WITH subq1 AS ( WITH inner_cte AS ( SELECT t0.ACTIVITY_TITLE, t0.TERM_CODE,
    t0.MAX_ENROLLMENT, t1.TERM_DESCRIPTION, t1.TERM_START_DATE, t2.SUBJECT_TITLE,
    t2.NUM_ENROLLED_STUDENTS, ROW_NUMBER() OVER (PARTITION BY t2.SUBJECT_TITLE ORDER
    BY t0.ACTIVITY_TITLE) AS window_column FROM IAP_SUBJECT_DETAIL t0 JOIN ACADEMIC_TERMS
    t1 ON t0.TERM_CODE = t1.TERM_CODE JOIN LIBRARY_SUBJECT_OFFERED t2 ON t1.TERM_CODE
    = t2.TERM_CODE WHERE t0.ENROLLMENT_TYPE = 'Advance sign-up required' AND t0.MAX_ENROLLMENT
    = 12 ) SELECT inner_cte.ACTIVITY_TITLE, inner_cte.TERM_CODE, inner_cte.MAX_ENROLLMENT,
    inner_cte.TERM_DESCRIPTION, inner_cte.TERM_START_DATE, inner_cte.SUBJECT_TITLE,
    inner_cte.NUM_ENROLLED_STUDENTS, t2.RESPONSIBLE_FACULTY_NAME, inner_cte.window_column,
    t2.SUBJECT_ID FROM inner_cte JOIN LIBRARY_SUBJECT_OFFERED t2 ON inner_cte.TERM_CODE
    = t2.TERM_CODE AND inner_cte.SUBJECT_TITLE = t2.SUBJECT_TITLE ), subq2 AS ( WITH
    inner_cte AS ( SELECT t0.SUBJECT_ID, t0.SUBJECT_TITLE, t0.NUM_ENROLLED_STUDENTS,
    t0.TERM_CODE, t1.TIP_MATERIAL_STATUS_KEY, t1.ISBN, ROW_NUMBER() OVER (PARTITION
    BY t1.TIP_MATERIAL_STATUS_KEY ORDER BY t0.SUBJECT_ID) AS window_column FROM LIBRARY_SUBJECT_OFFERED
    t0 JOIN TIP_DETAIL t1 ON t0.SUBJECT_ID = t1.SUBJECT_ID WHERE t0.NUM_ENROLLED_STUDENTS
    >= 5 ) SELECT i.SUBJECT_ID, i.SUBJECT_TITLE, i.NUM_ENROLLED_STUDENTS, i.TERM_CODE,
    i.TIP_MATERIAL_STATUS_KEY, i.ISBN, l.RESPONSIBLE_FACULTY_NAME, i.window_column
    FROM inner_cte i JOIN LIBRARY_SUBJECT_OFFERED l ON i.SUBJECT_ID = l.SUBJECT_ID
    AND i.TERM_CODE = l.TERM_CODE ) SELECT s1.ACTIVITY_TITLE, s1.TERM_CODE, s1.MAX_ENROLLMENT,
    s1.TERM_DESCRIPTION, s1.TERM_START_DATE, s1.SUBJECT_TITLE, s1.NUM_ENROLLED_STUDENTS,
    s1.RESPONSIBLE_FACULTY_NAME, s1.window_column AS subject_title_row_number, s2.TIP_MATERIAL_STATUS_KEY,
    s2.ISBN, s2.window_column AS material_status_row_number FROM subq1 s1 JOIN subq2
    s2 ON s1.SUBJECT_ID = s2.SUBJECT_ID AND s1.TERM_CODE = s2.TERM_CODE
- category: Subject Offering Analysis
  default_granularity: one row per subject in academic year 2012 with section 0 and
    cluster type S
  desc: For subjects offered in the academic year 2012 that also have a section ID
    of 0 and a cluster type of 'S', show the subject key, subject title, offer department
    name, academic year, term description, the total number of subjects offered by
    each department in that year, the row number within each offer department name
    group ordered by subject key, the department name from SUBJECT_SUMMARY, the term
    start date from ACADEMIC_TERMS, and the row number within a window of 2 preceding
    and 1 following rows ordered by the subject title from SUBJECT_OFFERED. List the
    results in order by offer department name and subject key. Do not return any rounded
    answers.
  id: dw_4130
  name: 2012 Section-0 Cluster-S Subjects with Department Counts and Windowed Row
    Numbers
  sql: WITH Subquery1 AS ( WITH inner_cte AS ( SELECT t1.SUBJECT_KEY, t1.SUBJECT_TITLE,
    t1.OFFER_DEPT_NAME, t0.ACADEMIC_YEAR, t0.TERM_DESCRIPTION, ROW_NUMBER() OVER (PARTITION
    BY t1.OFFER_DEPT_NAME ORDER BY t1.SUBJECT_KEY) AS window_column, t1.TERM_CODE
    FROM ACADEMIC_TERMS_ALL t0 JOIN SUBJECT_OFFERED t1 ON t0.TERM_CODE = t1.TERM_CODE
    WHERE t0.ACADEMIC_YEAR = 2012 ) SELECT i.SUBJECT_KEY, i.SUBJECT_TITLE, i.OFFER_DEPT_NAME,
    i.ACADEMIC_YEAR, i.TERM_DESCRIPTION, d.dept_subject_count, i.window_column, i.TERM_CODE
    FROM inner_cte i JOIN ( SELECT OFFER_DEPT_NAME, COUNT(*) AS dept_subject_count
    FROM SUBJECT_OFFERED so JOIN ACADEMIC_TERMS_ALL at ON so.TERM_CODE = at.TERM_CODE
    WHERE at.ACADEMIC_YEAR = 2012 GROUP BY OFFER_DEPT_NAME ) d ON i.OFFER_DEPT_NAME
    = d.OFFER_DEPT_NAME ), Subquery2 AS ( WITH inner_cte AS ( SELECT t0.SUBJECT_TITLE,
    t1.DEPARTMENT_NAME, t2.TERM_DESCRIPTION, ROW_NUMBER() OVER (ORDER BY t0.SUBJECT_TITLE
    ROWS BETWEEN 2 PRECEDING AND 1 FOLLOWING) AS window_column, t0.TERM_CODE FROM
    SUBJECT_OFFERED t0 JOIN SUBJECT_SUMMARY t1 ON t0.TERM_CODE = t1.TERM_CODE JOIN
    ACADEMIC_TERMS t2 ON t1.TERM_CODE = t2.TERM_CODE WHERE t0.SECTION_ID = 0 AND t0.CLUSTER_TYPE
    = 'S' ) SELECT inner_cte.SUBJECT_TITLE, inner_cte.DEPARTMENT_NAME, inner_cte.TERM_DESCRIPTION,
    t3.TERM_START_DATE, inner_cte.window_column, inner_cte.TERM_CODE FROM inner_cte
    JOIN ACADEMIC_TERMS t3 ON inner_cte.TERM_CODE = t3.TERM_CODE ) SELECT s1.SUBJECT_KEY,
    s1.SUBJECT_TITLE, s1.OFFER_DEPT_NAME, s1.ACADEMIC_YEAR, s1.TERM_DESCRIPTION, s1.dept_subject_count,
    s1.window_column AS dept_window_number, s2.DEPARTMENT_NAME, s2.TERM_START_DATE,
    s2.window_column AS cluster_window_number FROM Subquery1 s1 JOIN Subquery2 s2
    ON s1.SUBJECT_TITLE = s2.SUBJECT_TITLE AND s1.TERM_CODE = s2.TERM_CODE ORDER BY
    s1.OFFER_DEPT_NAME, s1.SUBJECT_KEY;
- category: Enrollment Analysis
  default_granularity: one row per top-enrolled Fall 2024-2025 subject in high-average-unit
    departments
  desc: For the top 10 subjects offered in the term with the description "Fall Term
    2024-2025" that have the highest number of enrolled students, display each subject's
    offered key, subject title, offering department name, the term description, the
    number of enrolled students, and the rank of each subject within its offering
    department (ordered by subject offered key), but only include subjects where the
    offering department is among those that, in the term with code '2022SU', had an
    average total units for their subjects greater than the average total units for
    all subjects offered in that term. List the subject offered key, subject title,
    offering department name, term description, number of enrolled students, and the
    rank within the department, in that order, and order the results by department
    name and number of enrolled students descending. Do not return any rounded answers.
  id: dw_4305
  name: Top 10 Fall 2024-2025 Enrolled Subjects in Departments with Above-Average
    2022SU Units
  sql: WITH TopSubjects AS ( WITH inner_cte AS ( SELECT t0.TIP_SUBJECT_OFFERED_KEY,
    t0.SUBJECT_TITLE, t0.OFFER_DEPT_NAME, t1.TERM_DESCRIPTION, t0.NUM_ENROLLED_STUDENTS,
    RANK() OVER (PARTITION BY t0.OFFER_DEPT_NAME ORDER BY t0.TIP_SUBJECT_OFFERED_KEY)
    AS window_column FROM TIP_SUBJECT_OFFERED t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE
    = t1.TERM_CODE JOIN ACADEMIC_TERM_PARAMETER t2 ON t1.TERM_CODE = t2.TERM_CODE
    WHERE t1.TERM_DESCRIPTION = 'Fall Term 2024-2025' ) SELECT icte.TIP_SUBJECT_OFFERED_KEY,
    icte.SUBJECT_TITLE, icte.OFFER_DEPT_NAME, icte.TERM_DESCRIPTION, icte.NUM_ENROLLED_STUDENTS,
    icte.window_column FROM inner_cte icte ORDER BY icte.NUM_ENROLLED_STUDENTS DESC
    LIMIT 10 ), HighAvgUnitDepartments AS ( WITH inner_cte AS ( SELECT t1.SUBJECT_ID,
    dense_rank() OVER (ORDER BY t1.TOTAL_UNITS ROWS BETWEEN 2 PRECEDING AND CURRENT
    ROW) AS window_column FROM ACADEMIC_TERMS_ALL t0 JOIN COURSE_CATALOG_SUBJECT_OFFERED
    t1 ON t0.TERM_CODE = t1.TERM_CODE WHERE t0.TERM_CODE = '2022SU' ) SELECT t2.DEPARTMENT_NAME,
    AVG(t2.TOTAL_UNITS) AS avg_total_units FROM ACADEMIC_TERMS_ALL t0 JOIN COURSE_CATALOG_SUBJECT_OFFERED
    t2 ON t0.TERM_CODE = t2.TERM_CODE WHERE t0.TERM_CODE = '2022SU' GROUP BY t2.DEPARTMENT_NAME
    HAVING AVG(t2.TOTAL_UNITS) > ( SELECT AVG(t3.TOTAL_UNITS) FROM ACADEMIC_TERMS_ALL
    t0 JOIN COURSE_CATALOG_SUBJECT_OFFERED t3 ON t0.TERM_CODE = t3.TERM_CODE WHERE
    t0.TERM_CODE = '2022SU' ) ) SELECT ts.TIP_SUBJECT_OFFERED_KEY, ts.SUBJECT_TITLE,
    ts.OFFER_DEPT_NAME, ts.TERM_DESCRIPTION, ts.NUM_ENROLLED_STUDENTS, ts.window_column
    FROM TopSubjects ts WHERE ts.OFFER_DEPT_NAME IN (SELECT had.DEPARTMENT_NAME FROM
    HighAvgUnitDepartments had) ORDER BY ts.OFFER_DEPT_NAME, ts.NUM_ENROLLED_STUDENTS
    DESC;
- category: Enrollment and Subject Offering Comprehensive Analysis
  default_granularity: one row per 2017JA subject per school
  desc: For subjects offered in the term '2017JA', show the subject title, number
    of enrolled students, offering department name, department full name, subject
    code, subject code description, and the minimum number of enrolled students over
    each subject code group, as well as the school code, school name, department code,
    school name from department, department phone number, and the highest running
    sum of total units for any subject within that school in the 2019FA term (where
    the subject has more than 1 total unit). Order the results by subject code. Do
    not return any rounded answers.
  id: dw_4308
  name: 2017JA Subjects Enrollment per Subject Code with 2019FA School Running Unit
    Sums
  sql: WITH inner_cte1 AS ( SELECT t0.SUBJECT_TITLE, t0.NUM_ENROLLED_STUDENTS, t0.OFFER_DEPT_NAME,
    t1.DEPARTMENT_FULL_NAME, t2.SUBJECT_CODE, t2.SUBJECT_CODE_DESC, min(t0.NUM_ENROLLED_STUDENTS)
    OVER (PARTITION BY t2.SUBJECT_CODE ORDER BY t2.SUBJECT_CODE) AS window_column,
    t1.SCHOOL_CODE, t1.SCHOOL_NAME, t1.DEPARTMENT_CODE FROM TIP_SUBJECT_OFFERED t0
    JOIN SIS_DEPARTMENT t1 ON t0.OFFER_DEPT_CODE = t1.DEPARTMENT_CODE JOIN SIS_SUBJECT_CODE
    t2 ON t1.DEPARTMENT_CODE = t2.DEPARTMENT_CODE WHERE t0.TERM_CODE = '2017JA' ),
    cte1 AS ( SELECT inner_cte1.SUBJECT_TITLE, inner_cte1.NUM_ENROLLED_STUDENTS, inner_cte1.OFFER_DEPT_NAME,
    inner_cte1.DEPARTMENT_FULL_NAME, inner_cte1.SUBJECT_CODE, inner_cte1.SUBJECT_CODE_DESC,
    inner_cte1.window_column, inner_cte1.SCHOOL_CODE, inner_cte1.SCHOOL_NAME, inner_cte1.DEPARTMENT_CODE,
    sd.SCHOOL_NAME AS SCHOOL_NAME_DEPT, ad.DEPARTMENT_PHONE_NUMBER FROM inner_cte1
    LEFT JOIN SIS_DEPARTMENT sd ON inner_cte1.OFFER_DEPT_NAME = sd.DEPARTMENT_NAME
    LEFT JOIN SIS_ADMIN_DEPARTMENT ad ON sd.DEPARTMENT_CODE = ad.SIS_ADMIN_DEPARTMENT_CODE
    ), inner_cte2 AS ( SELECT t1.SUBJECT_ID, t1.SUBJECT_TITLE, t1.DEPARTMENT_NAME,
    t1.SCHOOL_CODE, t1.SCHOOL_NAME, SUM(t1.TOTAL_UNITS) OVER (PARTITION BY t1.SCHOOL_CODE
    ORDER BY t1.SUBJECT_ID) AS window_column FROM ACADEMIC_TERMS_ALL t0 JOIN SUBJECT_SUMMARY
    t1 ON t0.TERM_CODE = t1.TERM_CODE JOIN ACADEMIC_TERMS t2 ON t1.TERM_CODE = t2.TERM_CODE
    WHERE t1.TERM_CODE = '2019FA' AND t1.TOTAL_UNITS > 1 ), cte2 AS ( SELECT SCHOOL_CODE,
    SCHOOL_NAME, MAX(window_column) AS highest_running_sum_total_units FROM inner_cte2
    GROUP BY SCHOOL_CODE, SCHOOL_NAME ) SELECT cte1.SUBJECT_TITLE, cte1.NUM_ENROLLED_STUDENTS,
    cte1.OFFER_DEPT_NAME, cte1.DEPARTMENT_FULL_NAME, cte1.SUBJECT_CODE, cte1.SUBJECT_CODE_DESC,
    cte1.window_column, cte1.SCHOOL_CODE, cte1.SCHOOL_NAME, cte1.DEPARTMENT_CODE,
    cte1.SCHOOL_NAME_DEPT, cte1.DEPARTMENT_PHONE_NUMBER, cte2.highest_running_sum_total_units
    FROM cte1 JOIN cte2 ON cte1.SCHOOL_CODE = cte2.SCHOOL_CODE ORDER BY cte1.SUBJECT_CODE;
- category: IAP Activity and Academic Term Comprehensive Analysis
  default_granularity: one row per previous term with IAP enrollment statistics
  desc: For each academic term that is not cancelled, has at least one IAP subject
    activity with a non-null maximum enrollment, and where the term status is 'Previous',
    provide the term description, the range, variance, and standard deviation (using
    STDDEV only and never STDDEV_POP) of the maximum enrollment values for IAP subject
    activities in that term, the academic year description, the term code, term start
    date, calendar date, day of week, the average calendar year within each calendar
    year group ordered by term start date, the academic year, and the last day of
    final exam, ordered by the range of maximum enrollment in descending order. Do
    not return any rounded answers.
  id: dw_4325
  name: Previous Terms IAP Max Enrollment Range Variance Stddev with Calendar Attributes
  sql: WITH inner_cte1 AS ( SELECT ata.TERM_DESCRIPTION, MAX(isd.MAX_ENROLLMENT) -
    MIN(isd.MAX_ENROLLMENT) AS max_enrollment_range, VARIANCE(isd.MAX_ENROLLMENT)
    AS max_enrollment_variance, STDDEV(isd.MAX_ENROLLMENT) AS max_enrollment_stddev
    FROM IAP_SUBJECT_DETAIL isd JOIN ACADEMIC_TERMS_ALL ata ON isd.TERM_CODE = ata.TERM_CODE
    WHERE isd.MAX_ENROLLMENT IS NOT NULL AND isd.IS_CANCELLED = 'N' GROUP BY ata.TERM_DESCRIPTION
    ), Subquery1 AS ( SELECT inner_cte1.TERM_DESCRIPTION, inner_cte1.max_enrollment_range,
    inner_cte1.max_enrollment_variance, inner_cte1.max_enrollment_stddev, ata.ACADEMIC_YEAR_DESC,
    ata.TERM_CODE FROM inner_cte1 JOIN ACADEMIC_TERMS_ALL ata ON inner_cte1.TERM_DESCRIPTION
    = ata.TERM_DESCRIPTION ), inner_cte2 AS ( SELECT t1.TERM_CODE, t1.TERM_DESCRIPTION,
    t1.TERM_START_DATE, t0.CALENDAR_DATE, t0.DAY_OF_WEEK, AVG(t0.CALENDAR_YEAR) OVER
    (PARTITION BY t0.CALENDAR_YEAR ORDER BY t1.TERM_START_DATE) AS window_column FROM
    TIME_DAY t0 JOIN ACADEMIC_TERMS t1 ON t0.CALENDAR_DATE = t1.TERM_START_DATE WHERE
    t1.TERM_STATUS = 'Previous' ), Subquery2 AS ( SELECT icte2.TERM_CODE, icte2.TERM_DESCRIPTION,
    icte2.TERM_START_DATE, icte2.CALENDAR_DATE, icte2.DAY_OF_WEEK, icte2.window_column,
    at2.ACADEMIC_YEAR, at2.LAST_DAY_OF_FINAL_EXAM FROM inner_cte2 icte2 JOIN ACADEMIC_TERMS
    at2 ON icte2.TERM_CODE = at2.TERM_CODE ) SELECT s1.TERM_DESCRIPTION, s1.max_enrollment_range,
    s1.max_enrollment_variance, s1.max_enrollment_stddev, s1.ACADEMIC_YEAR_DESC, s2.TERM_CODE,
    s2.TERM_START_DATE, s2.CALENDAR_DATE, s2.DAY_OF_WEEK, s2.window_column, s2.ACADEMIC_YEAR,
    s2.LAST_DAY_OF_FINAL_EXAM FROM Subquery1 s1 JOIN Subquery2 s2 ON s1.TERM_CODE
    = s2.TERM_CODE ORDER BY s1.max_enrollment_range DESC
- category: Enrollment and Subject Offering Comprehensive Analysis
  default_granularity: one row per Engineering department above average enrollment
  desc: For each department in the School of Engineering with total student enrollment
    in its courses greater than the average total enrollment across all Engineering
    departments (and with total enrollment greater than 50), display the department
    name, the total number of students enrolled in its courses, and the highest average
    total units for subjects it has ever offered in a regular academic term, listing
    the results in descending order of total enrollment. Do not return any rounded
    answers.
  id: dw_4387
  name: Engineering Departments Above-Average Enrollment with Highest Regular-Term
    Average Units
  sql: WITH highest_avg_units AS ( WITH inner_cte AS ( SELECT c.DEPARTMENT_NAME, t.TERM_CODE,
    AVG(c.TOTAL_UNITS) AS avg_total_units FROM COURSE_CATALOG_SUBJECT_OFFERED c JOIN
    ACADEMIC_TERMS t ON c.TERM_CODE = t.TERM_CODE WHERE t.IS_REGULAR_TERM = 'Y' GROUP
    BY c.DEPARTMENT_NAME, t.TERM_CODE ) SELECT DEPARTMENT_NAME, MAX(avg_total_units)
    AS highest_avg_total_units FROM inner_cte GROUP BY DEPARTMENT_NAME ORDER BY highest_avg_total_units
    DESC ), eng_dept_enrollment AS ( WITH inner_cte AS ( SELECT s.DEPARTMENT_NAME,
    SUM(t.NUM_ENROLLED_STUDENTS) AS total_enrollment FROM SIS_DEPARTMENT s JOIN TIP_SUBJECT_OFFERED
    t ON s.DEPARTMENT_CODE = t.OFFER_DEPT_CODE JOIN STUDENT_DEPARTMENT d ON t.OFFER_DEPT_CODE
    = d.DEPARTMENT_CODE WHERE s.SCHOOL_NAME = 'Engineering' GROUP BY s.DEPARTMENT_NAME
    HAVING SUM(t.NUM_ENROLLED_STUDENTS) > 50 ) SELECT i.DEPARTMENT_NAME, i.total_enrollment
    FROM inner_cte i JOIN ( SELECT AVG(total_enrollment) AS avg_enrollment FROM (
    SELECT s.DEPARTMENT_NAME, SUM(t.NUM_ENROLLED_STUDENTS) AS total_enrollment FROM
    SIS_DEPARTMENT s JOIN TIP_SUBJECT_OFFERED t ON s.DEPARTMENT_CODE = t.OFFER_DEPT_CODE
    JOIN STUDENT_DEPARTMENT d ON t.OFFER_DEPT_CODE = d.DEPARTMENT_CODE WHERE s.SCHOOL_NAME
    = 'Engineering' GROUP BY s.DEPARTMENT_NAME HAVING SUM(t.NUM_ENROLLED_STUDENTS)
    > 50 ) sub ) a ON i.total_enrollment > a.avg_enrollment ) SELECT e.DEPARTMENT_NAME,
    e.total_enrollment, h.highest_avg_total_units FROM eng_dept_enrollment e LEFT
    JOIN highest_avg_units h ON e.DEPARTMENT_NAME = h.DEPARTMENT_NAME ORDER BY e.total_enrollment
    DESC;
- category: Subject Offering and Textbook Material Comprehensive Analysis
  default_granularity: one row per department matched with 2022 textbook subjects
    above average units
  desc: For each department, show the department name, the highest total units among
    its subjects with exactly 12 units in the Fall Term 2024-2025, and for each course
    in that department that was offered in 2022 and has at least one required or optional
    textbook and has total units greater than the average for such courses, show the
    course's subject code, subject number, subject title, the term description, the
    textbook material key, the textbook material status key, and the row number within
    the department ordered by subject code. Do not return any rounded answers.
  id: dw_4448
  name: Department Highest 12-Unit Fall 2024-2025 Subjects with 2022 Above-Average
    Textbook Courses
  sql: WITH inner_cte1 AS ( SELECT t2.SUBJECT_ID, t2.SUBJECT_TITLE, t2.DEPARTMENT_NAME,
    t2.SCHOOL_NAME, t2.TOTAL_UNITS, t1.TERM_DESCRIPTION, t1.TERM_START_DATE, ROW_NUMBER()
    OVER (PARTITION BY t2.DEPARTMENT_NAME ORDER BY t2.SUBJECT_ID) AS window_column
    FROM ACADEMIC_TERM_PARAMETER t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE = t1.TERM_CODE
    JOIN SUBJECT_SUMMARY t2 ON t1.TERM_CODE = t2.TERM_CODE WHERE t0.TERM_DESCRIPTION
    = 'Fall Term 2024-2025' AND t2.TOTAL_UNITS = 12 ), subq1 AS ( SELECT DEPARTMENT_NAME,
    MAX(TOTAL_UNITS) AS highest_total_units FROM inner_cte1 GROUP BY DEPARTMENT_NAME
    ), inner_cte2 AS ( SELECT t0.SUBJECT_CODE, t0.SUBJECT_NUMBER, t0.DEPARTMENT_NAME,
    t0.SUBJECT_TITLE, t1.TERM_DESCRIPTION, t2.TIP_MATERIAL_KEY, t2.TIP_MATERIAL_STATUS_KEY,
    t0.TOTAL_UNITS, ROW_NUMBER() OVER (PARTITION BY t0.DEPARTMENT_NAME ORDER BY t0.SUBJECT_CODE)
    AS window_column FROM COURSE_CATALOG_SUBJECT_OFFERED t0 JOIN ACADEMIC_TERMS_ALL
    t1 ON t0.TERM_CODE = t1.TERM_CODE JOIN TIP_DETAIL t2 ON t1.TERM_CODE = t2.TERM_CODE
    AND t0.SUBJECT_ID = t2.SUBJECT_ID WHERE t1.ACADEMIC_YEAR = 2022 AND t2.TIP_MATERIAL_STATUS_KEY
    IN ('RQ', 'EO') ), subq2 AS ( SELECT SUBJECT_CODE, SUBJECT_NUMBER, DEPARTMENT_NAME,
    SUBJECT_TITLE, TERM_DESCRIPTION, TIP_MATERIAL_KEY, TIP_MATERIAL_STATUS_KEY, window_column
    FROM inner_cte2 WHERE TOTAL_UNITS > ( SELECT AVG(TOTAL_UNITS) FROM COURSE_CATALOG_SUBJECT_OFFERED
    t0 JOIN ACADEMIC_TERMS_ALL t1 ON t0.TERM_CODE = t1.TERM_CODE JOIN TIP_DETAIL t2
    ON t1.TERM_CODE = t2.TERM_CODE AND t0.SUBJECT_ID = t2.SUBJECT_ID WHERE t1.ACADEMIC_YEAR
    = 2022 AND t2.TIP_MATERIAL_STATUS_KEY IN ('RQ', 'EO') ) ) SELECT s1.DEPARTMENT_NAME,
    s1.highest_total_units, s2.SUBJECT_CODE, s2.SUBJECT_NUMBER, s2.SUBJECT_TITLE,
    s2.TERM_DESCRIPTION, s2.TIP_MATERIAL_KEY, s2.TIP_MATERIAL_STATUS_KEY, s2.window_column
    FROM subq1 s1 JOIN subq2 s2 ON s1.DEPARTMENT_NAME = s2.DEPARTMENT_NAME;
- category: Subject Offering and IAP Activity Comprehensive Analysis
  default_granularity: one row per Engineering subject matched with IAP activity rollup
  desc: For subjects offered by departments in the School of Engineering with a total
    of at least 6 units, show the subject code, subject title, department name, grade
    type, and the running sum of total units within each grade type, but only include
    those subjects where the running sum exceeds 12 units within their grade type.
    For each such subject, also show, for IAP subject activities with a maximum enrollment
    of at least 10 and that are not cancelled and are associated with the same subject
    code, the academic term description, activity title, enrollment type, and the
    total count of such activities (with a grand total row for all activities in each
    term, where activity title, enrollment type, and subject title are null and the
    total count is for all activities in that term). Order the results by subject
    code, academic term description, and activity title. Do not return any rounded
    answers.
  id: dw_4473
  name: Engineering 6+ Unit Subjects Grade-Type Running Unit Sums with IAP Activity
    Rollup Counts
  sql: WITH inner_cte1 AS ( SELECT t1.SUBJECT_CODE, t1.SUBJECT_TITLE, t0.DEPARTMENT_NAME,
    t1.GRADE_TYPE, SUM(t1.TOTAL_UNITS) OVER (PARTITION BY t1.GRADE_TYPE ORDER BY t1.SUBJECT_CODE)
    AS window_column FROM SIS_DEPARTMENT t0 JOIN COURSE_CATALOG_SUBJECT_OFFERED t1
    ON t0.DEPARTMENT_CODE = t1.DEPARTMENT_CODE WHERE t0.SCHOOL_NAME = 'Engineering'
    AND t1.TOTAL_UNITS >= 6 ), subq1 AS ( SELECT SUBJECT_CODE, SUBJECT_TITLE, DEPARTMENT_NAME,
    GRADE_TYPE, window_column FROM inner_cte1 WHERE window_column > 12 ), inner_cte2
    AS ( SELECT t0.ACTIVITY_TITLE, t0.ENROLLMENT_TYPE, t1.TERM_DESCRIPTION, t2.SUBJECT_TITLE,
    t2.SUBJECT_CODE FROM IAP_SUBJECT_DETAIL t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE
    = t1.TERM_CODE JOIN COURSE_CATALOG_SUBJECT_OFFERED t2 ON t1.TERM_CODE = t2.TERM_CODE
    WHERE t0.MAX_ENROLLMENT >= 10 AND t0.IS_CANCELLED = 'N' ), rollup_cte AS ( SELECT
    ACTIVITY_TITLE, ENROLLMENT_TYPE, TERM_DESCRIPTION, SUBJECT_TITLE, SUBJECT_CODE,
    COUNT(*) AS activity_count FROM inner_cte2 GROUP BY TERM_DESCRIPTION, ACTIVITY_TITLE,
    ENROLLMENT_TYPE, SUBJECT_TITLE, SUBJECT_CODE WITH ROLLUP HAVING COUNT(*) > 0 )
    SELECT s1.SUBJECT_CODE, s1.SUBJECT_TITLE, s1.DEPARTMENT_NAME, s1.GRADE_TYPE, s1.window_column,
    r1.TERM_DESCRIPTION, r1.ACTIVITY_TITLE, r1.ENROLLMENT_TYPE, r1.activity_count
    FROM subq1 s1 JOIN rollup_cte r1 ON s1.SUBJECT_CODE = r1.SUBJECT_CODE ORDER BY
    s1.SUBJECT_CODE, r1.TERM_DESCRIPTION, r1.ACTIVITY_TITLE
- category: IAP Activity and Subject Offering Comprehensive Analysis
  default_granularity: one row per IAP activity matched with Engineering subject by
    fiscal/academic year
  desc: 'For IAP subject activities in the term "2021JA" that are not cancelled, show
    the activity title, enrollment type, calendar date, the fiscal year of the calendar
    date, and the row number within a window of 2 preceding and 1 following rows ordered
    by activity title, along with the department name, subject ID, subject title,
    academic year, the rank of each subject within its academic year group ordered
    by subject ID, and the total number of subjects per department for subjects in
    the "Engineering" school with total units equal to 1, where the fiscal year of
    the IAP activity matches the academic year of the subject. Present the columns
    in the following order: activity title, enrollment type, calendar date, fiscal
    year, IAP window number, department name, subject ID, subject title, academic
    year, subject rank, and total number of subjects per department. Do not return
    any rounded answers.'
  id: dw_4487
  name: 2021JA IAP Activities Fiscal Year Matched with Engineering 1-Unit Subject
    Ranks
  sql: WITH iap_activities AS ( SELECT inner_cte.ACTIVITY_TITLE, inner_cte.ENROLLMENT_TYPE,
    inner_cte.CALENDAR_DATE, t1.FISCAL_YEAR, inner_cte.window_column FROM ( SELECT
    t0.ACTIVITY_TITLE, t0.ENROLLMENT_TYPE, t1.CALENDAR_DATE, ROW_NUMBER() OVER (ORDER
    BY t0.ACTIVITY_TITLE ROWS BETWEEN 2 PRECEDING AND 1 FOLLOWING) AS window_column
    FROM IAP_SUBJECT_DETAIL t0 JOIN TIME_DAY t1 ON t0.TERM_CODE = t1.ACADEMIC_TERM_CODE
    WHERE t0.TERM_CODE = '2021JA' AND t0.IS_CANCELLED = 'N' ) inner_cte JOIN TIME_DAY
    t1 ON inner_cte.CALENDAR_DATE = t1.CALENDAR_DATE ), eng_subjects AS ( SELECT inner_cte.DEPARTMENT_NAME,
    inner_cte.SUBJECT_ID, inner_cte.SUBJECT_TITLE, inner_cte.ACADEMIC_YEAR, inner_cte.window_column,
    dept_counts.Total_Subjects FROM ( SELECT t1.SUBJECT_ID, t1.SUBJECT_TITLE, t1.DEPARTMENT_NAME,
    t2.ACADEMIC_YEAR, RANK() OVER (PARTITION BY t2.ACADEMIC_YEAR ORDER BY t1.SUBJECT_ID)
    AS window_column FROM SUBJECT_SUMMARY t1 INNER JOIN ACADEMIC_TERMS_ALL t0 ON t0.TERM_CODE
    = t1.TERM_CODE INNER JOIN ACADEMIC_TERMS t2 ON t1.TERM_CODE = t2.TERM_CODE WHERE
    t1.SCHOOL_NAME = 'Engineering' AND t1.TOTAL_UNITS = 1 ) inner_cte JOIN ( SELECT
    DEPARTMENT_NAME, COUNT(DISTINCT SUBJECT_ID) AS Total_Subjects FROM SUBJECT_SUMMARY
    WHERE SCHOOL_NAME = 'Engineering' AND TOTAL_UNITS = 1 GROUP BY DEPARTMENT_NAME
    ) AS dept_counts ON inner_cte.DEPARTMENT_NAME = dept_counts.DEPARTMENT_NAME )
    SELECT iap_activities.ACTIVITY_TITLE, iap_activities.ENROLLMENT_TYPE, iap_activities.CALENDAR_DATE,
    iap_activities.FISCAL_YEAR, iap_activities.window_column AS IAP_WINDOW_NUMBER,
    eng_subjects.DEPARTMENT_NAME, eng_subjects.SUBJECT_ID, eng_subjects.SUBJECT_TITLE,
    eng_subjects.ACADEMIC_YEAR, eng_subjects.window_column AS SUBJECT_RANK, eng_subjects.Total_Subjects
    FROM iap_activities JOIN eng_subjects ON iap_activities.FISCAL_YEAR = eng_subjects.ACADEMIC_YEAR
    ORDER BY iap_activities.ACTIVITY_TITLE, eng_subjects.DEPARTMENT_NAME, eng_subjects.SUBJECT_ID
- category: IAP Activity and Subject Offering Comprehensive Analysis
  default_granularity: one row per department-year-activity-sponsor combination
  desc: For each department, academic year, activity title, and sponsor name where
    the subject enrollment number is greater than 10 and the maximum enrollment for
    the activity is greater than 10, provide the department name, academic year, number
    of unique subjects, minimum total units offered, activity title, sponsor name,
    number of unique activities, minimum fee, and the sponsor type. Do not return
    any rounded answers.
  id: dw_4515
  name: Department Year Subject Statistics Matched with IAP Activity Sponsor Statistics
  sql: WITH inner_cte AS ( WITH DeptSubjectStats AS ( SELECT c.DEPARTMENT_NAME, t.ACADEMIC_YEAR,
    COUNT(DISTINCT c.SUBJECT_ID) AS subject_count, MIN(s.TOTAL_UNITS) AS min_total_units
    FROM COURSE_CATALOG_SUBJECT_OFFERED c JOIN ACADEMIC_TERMS t ON c.TERM_CODE = t.TERM_CODE
    JOIN SUBJECT_SUMMARY s ON t.TERM_CODE = s.TERM_CODE AND c.SUBJECT_ID = s.SUBJECT_ID
    WHERE s.SUBJECT_ENROLLMENT_NUMBER > 10 GROUP BY c.DEPARTMENT_NAME, t.ACADEMIC_YEAR
    ), ActivitySponsorStats AS ( SELECT d.ACTIVITY_TITLE, s.SPONSOR_NAME, COUNT(DISTINCT
    d.IAP_SUBJECT_SESSION_KEY) AS activity_count, MIN(d.FEE) AS min_fee FROM IAP_SUBJECT_DETAIL
    d JOIN IAP_SUBJECT_SPONSOR s ON d.IAP_SUBJECT_SPONSOR_KEY = s.IAP_SUBJECT_SPONSOR_KEY
    WHERE d.MAX_ENROLLMENT > 10 GROUP BY d.ACTIVITY_TITLE, s.SPONSOR_NAME ), TermJoin
    AS ( SELECT t.ACADEMIC_YEAR, d.TERM_CODE, d.ACTIVITY_TITLE, s.SPONSOR_NAME FROM
    IAP_SUBJECT_DETAIL d JOIN ACADEMIC_TERMS t ON d.TERM_CODE = t.TERM_CODE JOIN IAP_SUBJECT_SPONSOR
    s ON d.IAP_SUBJECT_SPONSOR_KEY = s.IAP_SUBJECT_SPONSOR_KEY GROUP BY t.ACADEMIC_YEAR,
    d.TERM_CODE, d.ACTIVITY_TITLE, s.SPONSOR_NAME ) SELECT dss.DEPARTMENT_NAME, dss.ACADEMIC_YEAR,
    dss.subject_count, dss.min_total_units, ass.ACTIVITY_TITLE, ass.SPONSOR_NAME,
    ass.activity_count, ass.min_fee FROM DeptSubjectStats dss JOIN TermJoin tj ON
    dss.ACADEMIC_YEAR = tj.ACADEMIC_YEAR JOIN ActivitySponsorStats ass ON tj.ACTIVITY_TITLE
    = ass.ACTIVITY_TITLE AND tj.SPONSOR_NAME = ass.SPONSOR_NAME ORDER BY dss.DEPARTMENT_NAME,
    dss.ACADEMIC_YEAR, ass.ACTIVITY_TITLE, ass.SPONSOR_NAME ) SELECT inner_cte.DEPARTMENT_NAME,
    inner_cte.ACADEMIC_YEAR, inner_cte.subject_count, inner_cte.min_total_units, inner_cte.ACTIVITY_TITLE,
    inner_cte.SPONSOR_NAME, inner_cte.activity_count, inner_cte.min_fee, s.SPONSOR_TYPE
    FROM inner_cte JOIN IAP_SUBJECT_SPONSOR s ON inner_cte.SPONSOR_NAME = s.SPONSOR_NAME
    ORDER BY inner_cte.DEPARTMENT_NAME, inner_cte.ACADEMIC_YEAR, inner_cte.ACTIVITY_TITLE,
    inner_cte.SPONSOR_NAME;
- category: Textbook Material and IAP Activity Comprehensive Analysis
  default_granularity: one row per required textbook material matched with IAP activity
    per term
  desc: For tip details where the material status key is 'RQ' and for IAP subject
    activities that are not cancelled and have a maximum enrollment greater than 10,
    show the tip subject offered key, material key, subject ID, term description,
    academic year, the average record count in a window of 2 preceding and 2 following
    rows grouped by academic year (as tip_window_avg_record_count), the activity title,
    enrollment type, maximum enrollment, academic term description from the time day
    table, term start date from the academic terms table, the minimum maximum enrollment
    value over each term code group (as iap_min_max_enrollment), and the academic
    year description from the academic terms table, ordered by academic year and IAP
    term code. Do not return any rounded answers.
  id: dw_4558
  name: Required Textbook Record Count Windows Matched with Non-Cancelled IAP Activities
  sql: WITH inner_cte AS ( SELECT t0.TIP_SUBJECT_OFFERED_KEY, t0.TIP_MATERIAL_KEY,
    t0.SUBJECT_ID, t1.TERM_DESCRIPTION, t1.ACADEMIC_YEAR, AVG(t0.RECORD_COUNT) OVER
    ( PARTITION BY t1.ACADEMIC_YEAR ORDER BY t1.TERM_START_DATE ROWS BETWEEN 2 PRECEDING
    AND 2 FOLLOWING ) AS window_column, t0.TERM_CODE FROM TIP_DETAIL t0 JOIN ACADEMIC_TERMS
    t1 ON t0.TERM_CODE = t1.TERM_CODE WHERE t0.TIP_MATERIAL_STATUS_KEY = 'RQ' ), IAPActivities
    AS ( SELECT t0.ACTIVITY_TITLE, t0.ENROLLMENT_TYPE, t0.MAX_ENROLLMENT, t0.TERM_CODE,
    t1.ACADEMIC_TERM_DESCRIPTION, t2.TERM_START_DATE, MIN(t0.MAX_ENROLLMENT) OVER
    ( PARTITION BY t0.TERM_CODE ORDER BY t0.TERM_CODE ) AS window_column FROM IAP_SUBJECT_DETAIL
    t0 JOIN TIME_DAY t1 ON t1.ACADEMIC_TERM_CODE = t0.TERM_CODE JOIN ACADEMIC_TERMS
    t2 ON t0.TERM_CODE = t2.TERM_CODE WHERE t0.IS_CANCELLED = 'N' AND t0.MAX_ENROLLMENT
    > 10 ) SELECT icte.TIP_SUBJECT_OFFERED_KEY, icte.TIP_MATERIAL_KEY, icte.SUBJECT_ID,
    icte.TERM_DESCRIPTION, icte.ACADEMIC_YEAR, icte.window_column AS tip_window_avg_record_count,
    ia.ACTIVITY_TITLE, ia.ENROLLMENT_TYPE, ia.MAX_ENROLLMENT, ia.ACADEMIC_TERM_DESCRIPTION,
    ia.TERM_START_DATE, ia.window_column AS iap_min_max_enrollment, at.ACADEMIC_YEAR_DESC
    FROM inner_cte icte JOIN IAPActivities ia ON icte.TERM_CODE = ia.TERM_CODE JOIN
    ACADEMIC_TERMS at ON icte.TERM_CODE = at.TERM_CODE ORDER BY icte.ACADEMIC_YEAR,
    ia.TERM_CODE;
- category: Library Reserve and Enrollment Comprehensive Analysis
  default_granularity: one row per Fall 2024-2025 subject with status-U reserve materials
  desc: For each subject offered in the term with the description "Fall Term 2024-2025"
    that also has more than 0 enrolled students and a material status key of 'U',
    show the subject offered key, subject title, offering department name, the term
    description, the rank of each subject within its offering department, the course
    number, course number description, number of enrolled students, the reserve catalog
    key, the dense rank over the material status key, and the academic year description,
    ordered by subject offered key and course number. Do not return any rounded answers.
  id: dw_4566
  name: Fall 2024-2025 Subjects with Status-U Library Reserve Materials Ranked per
    Department
  sql: WITH inner_cte AS ( WITH SubjectOfferings AS ( SELECT t0.TIP_SUBJECT_OFFERED_KEY,
    t0.SUBJECT_TITLE, t0.OFFER_DEPT_NAME, t1.TERM_DESCRIPTION, RANK() OVER (PARTITION
    BY t0.OFFER_DEPT_NAME ORDER BY t0.TIP_SUBJECT_OFFERED_KEY) AS window_column, t0.SUBJECT_ID,
    t1.ACADEMIC_YEAR_DESC FROM TIP_SUBJECT_OFFERED t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE
    = t1.TERM_CODE JOIN ACADEMIC_TERM_PARAMETER t2 ON t1.TERM_CODE = t2.TERM_CODE
    WHERE t1.TERM_DESCRIPTION = 'Fall Term 2024-2025' ), LibrarySubjectStats AS (
    SELECT t1.COURSE_NUMBER, t1.COURSE_NUMBER_DESC, t1.NUM_ENROLLED_STUDENTS, t2.LIBRARY_RESERVE_CATALOG_KEY,
    DENSE_RANK() OVER (PARTITION BY t2.LIBRARY_MATERIAL_STATUS_KEY ORDER BY t2.LIBRARY_MATERIAL_STATUS_KEY)
    AS window_column, t1.SUBJECT_ID FROM LIBRARY_SUBJECT_OFFERED t1 JOIN LIBRARY_RESERVE_MATRL_DETAIL
    t2 ON t1.SUBJECT_ID = t2.SUBJECT_ID WHERE t1.NUM_ENROLLED_STUDENTS > 0 AND t2.LIBRARY_MATERIAL_STATUS_KEY
    = 'U' ) SELECT so.TIP_SUBJECT_OFFERED_KEY, so.SUBJECT_TITLE, so.OFFER_DEPT_NAME,
    so.TERM_DESCRIPTION, so.window_column AS subject_rank_in_dept, lss.COURSE_NUMBER,
    lss.COURSE_NUMBER_DESC, lss.NUM_ENROLLED_STUDENTS, lss.LIBRARY_RESERVE_CATALOG_KEY,
    lss.window_column AS dense_rank_material_status, so.ACADEMIC_YEAR_DESC FROM SubjectOfferings
    so JOIN LibrarySubjectStats lss ON so.SUBJECT_ID = lss.SUBJECT_ID ) SELECT * FROM
    inner_cte ORDER BY TIP_SUBJECT_OFFERED_KEY, COURSE_NUMBER;
- category: Library Reserve and Textbook Material Comprehensive Analysis
  default_granularity: one row per reserve material with status-key statistics
  desc: For each library reserve material detail with material status key 'U', show
    the reserve catalog key, subject offered key, term code, the academic year, the
    term description, the tip material key, the tip material status key, and the average
    record count in a window of 2 preceding and 2 following rows grouped by the tip
    material status key and ordered by the academic year, along with the average and
    variance of the record counter for reserve catalog items associated with that
    material status key where the catalog year is greater than 2000. Additionally,
    for each result, include the catalog title and catalog author name from the reserve
    catalog. Present the results ordered by academic year descending and record counter
    variance descending. Do not return any rounded answers.
  id: dw_4583
  name: Status-U Reserve Materials Record Count Windows with Catalog Record Counter
    Statistics
  sql: WITH inner_cte AS ( SELECT t0.LIBRARY_RESERVE_CATALOG_KEY, t0.LIBRARY_SUBJECT_OFFERED_KEY,
    t0.TERM_CODE, t1.ACADEMIC_YEAR, t1.TERM_DESCRIPTION, t2.TIP_MATERIAL_KEY, t2.TIP_MATERIAL_STATUS_KEY,
    AVG(t2.RECORD_COUNT) OVER ( PARTITION BY t2.TIP_MATERIAL_STATUS_KEY ORDER BY t1.ACADEMIC_YEAR
    ROWS BETWEEN 2 PRECEDING AND 2 FOLLOWING ) AS window_column FROM LIBRARY_RESERVE_MATRL_DETAIL
    t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE = t1.TERM_CODE JOIN TIP_DETAIL t2 ON
    t1.TERM_CODE = t2.TERM_CODE WHERE t0.LIBRARY_MATERIAL_STATUS_KEY = 'U' ), MaterialStatusStats
    AS ( SELECT d.LIBRARY_MATERIAL_STATUS_KEY, AVG(c.RECORD_COUNTER) AS avg_record_counter,
    VARIANCE(c.RECORD_COUNTER) AS record_counter_variance FROM LIBRARY_RESERVE_MATRL_DETAIL
    d JOIN LIBRARY_RESERVE_CATALOG c ON d.LIBRARY_RESERVE_CATALOG_KEY = c.LIBRARY_RESERVE_CATALOG_KEY
    WHERE c.CATALOG_YEAR > 2000 GROUP BY d.LIBRARY_MATERIAL_STATUS_KEY ORDER BY record_counter_variance
    DESC ) SELECT ic.LIBRARY_RESERVE_CATALOG_KEY, ic.LIBRARY_SUBJECT_OFFERED_KEY,
    ic.TERM_CODE, ic.ACADEMIC_YEAR, ic.TERM_DESCRIPTION, ic.TIP_MATERIAL_KEY, ic.TIP_MATERIAL_STATUS_KEY,
    ic.window_column, mss.avg_record_counter, mss.record_counter_variance, rc.CATALOG_TITLE,
    rc.CATALOG_AUTHOR_NAME FROM inner_cte ic JOIN MaterialStatusStats mss ON ic.TIP_MATERIAL_STATUS_KEY
    = mss.LIBRARY_MATERIAL_STATUS_KEY JOIN LIBRARY_RESERVE_CATALOG rc ON ic.LIBRARY_RESERVE_CATALOG_KEY
    = rc.LIBRARY_RESERVE_CATALOG_KEY ORDER BY ic.ACADEMIC_YEAR DESC, mss.record_counter_variance
    DESC
- category: Library Reserve and Enrollment Comprehensive Analysis
  default_granularity: one row per Mathematics library subject above yearly average
    enrollment
  desc: For Mathematics department courses with at least 5 enrolled students, show
    the course number, subject title, number of enrolled students, term description,
    academic year, the row number within each academic year group ordered by course
    number, the term start date, calendar date, day of week, and the average calendar
    year within each calendar year group ordered by term start date, but only for
    academic terms where the term status is 'Previous', and only include results where
    the number of enrolled students is greater than the average number of enrolled
    students for that academic year. Do not return any rounded answers.
  id: dw_4584
  name: Mathematics Library Subjects Above Yearly Average Enrollment in Previous Terms
  sql: WITH inner_cte AS ( SELECT t0.COURSE_NUMBER, t0.SUBJECT_TITLE, t0.NUM_ENROLLED_STUDENTS,
    t1.TERM_DESCRIPTION, t1.ACADEMIC_YEAR, t0.TERM_CODE, ROW_NUMBER() OVER (PARTITION
    BY t1.ACADEMIC_YEAR ORDER BY t0.COURSE_NUMBER) AS window_column, t1.TERM_START_DATE
    FROM LIBRARY_SUBJECT_OFFERED t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE = t1.TERM_CODE
    WHERE t0.OFFER_DEPT_NAME = 'Mathematics' AND t0.NUM_ENROLLED_STUDENTS >= 5 ),
    PreviousTerms AS ( SELECT t1.TERM_CODE, t1.TERM_DESCRIPTION, t1.TERM_START_DATE,
    t0.CALENDAR_DATE, t0.DAY_OF_WEEK, AVG(t0.CALENDAR_YEAR) OVER (PARTITION BY t0.CALENDAR_YEAR
    ORDER BY t1.TERM_START_DATE) AS window_column FROM TIME_DAY t0 JOIN ACADEMIC_TERMS
    t1 ON t0.CALENDAR_DATE = t1.TERM_START_DATE WHERE t1.TERM_STATUS = 'Previous'
    ), AvgEnrolled AS ( SELECT ACADEMIC_YEAR, AVG(NUM_ENROLLED_STUDENTS) AS avg_enrolled
    FROM LIBRARY_SUBJECT_OFFERED t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE = t1.TERM_CODE
    WHERE t0.OFFER_DEPT_NAME = 'Mathematics' AND t0.NUM_ENROLLED_STUDENTS >= 5 GROUP
    BY ACADEMIC_YEAR ) SELECT i.COURSE_NUMBER, i.SUBJECT_TITLE, i.NUM_ENROLLED_STUDENTS,
    i.TERM_DESCRIPTION, i.ACADEMIC_YEAR, i.window_column AS math_window_column, p.TERM_START_DATE,
    p.CALENDAR_DATE, p.DAY_OF_WEEK, p.window_column AS previous_terms_window_column
    FROM inner_cte i JOIN PreviousTerms p ON i.TERM_CODE = p.TERM_CODE JOIN AvgEnrolled
    a ON i.ACADEMIC_YEAR = a.ACADEMIC_YEAR WHERE i.NUM_ENROLLED_STUDENTS > a.avg_enrolled
    ORDER BY i.COURSE_NUMBER, p.TERM_START_DATE;
- category: Department Offering and Textbook Material Comprehensive Analysis
  default_granularity: one row per degree-granting Engineering department
  desc: For each degree-granting department that offered at least one subject in the
    School of Engineering in 2021 and has more than 10 tip materials for subjects
    in the School of Engineering during regular terms, provide the department code,
    department name, department full name, the number of subjects offered, the total
    number of enrolled students in those subjects, the total number of tip materials,
    the average number of enrolled students per subject (rounded to two decimal places),
    and the ratio of total enrolled students to total tip materials (rounded to two
    decimal places), listing the results in descending order of the average number
    of enrolled students per subject.
  id: dw_4650
  name: Engineering Degree-Granting Departments 2021 Enrollment per Subject and per
    TIP Material Ratios
  sql: WITH inner_cte AS ( SELECT d.DEPARTMENT_CODE, d.DEPARTMENT_NAME, d.DEPARTMENT_FULL_NAME,
    COUNT(s.SUBJECT_OFFERED_SUMMARY_KEY) AS subject_count, SUM(s.NUM_ENROLLED_STUDENTS)
    AS total_enrollment FROM SIS_DEPARTMENT d JOIN SUBJECT_OFFERED_SUMMARY s ON d.DEPARTMENT_CODE
    = s.OFFER_DEPT_CODE WHERE d.IS_DEGREE_GRANTING = 'Y' AND s.OFFER_SCHOOL_NAME =
    'Engineering' AND s.TERM_CODE LIKE '2021%' GROUP BY d.DEPARTMENT_CODE, d.DEPARTMENT_NAME,
    d.DEPARTMENT_FULL_NAME ) SELECT icte.DEPARTMENT_CODE, icte.DEPARTMENT_NAME, icte.DEPARTMENT_FULL_NAME,
    icte.subject_count, icte.total_enrollment, dtm.total_tip_materials, ROUND(icte.total_enrollment
    / NULLIF(icte.subject_count, 0), 2) AS Avg_Enrollment_per_Subject, ROUND(icte.total_enrollment
    / NULLIF(dtm.total_tip_materials, 0), 2) AS Enrollment_per_TipMaterial FROM inner_cte
    icte JOIN ( SELECT s.DEPARTMENT_NAME, SUM(t.RECORD_COUNT) AS total_tip_materials
    FROM TIP_DETAIL t JOIN ACADEMIC_TERMS a ON t.TERM_CODE = a.TERM_CODE JOIN SUBJECT_SUMMARY
    s ON a.TERM_CODE = s.TERM_CODE AND t.SUBJECT_ID = s.SUBJECT_ID WHERE s.SCHOOL_NAME
    = 'Engineering' AND a.IS_REGULAR_TERM = 'Y' GROUP BY s.DEPARTMENT_NAME HAVING
    SUM(t.RECORD_COUNT) > 10 ) dtm ON icte.DEPARTMENT_NAME = dtm.DEPARTMENT_NAME ORDER
    BY Avg_Enrollment_per_Subject DESC;
- category: Library Reserve and Enrollment Comprehensive Analysis
  default_granularity: one row per Mathematics library subject in previous terms
  desc: Show the Mathematics department courses with at least 5 enrolled students,
    including the course number, subject title, number of enrolled students, term
    description, academic year, the row number within each academic year group ordered
    by course number, the term start date, calendar date, day of week, the average
    calendar year within each calendar year group ordered by term start date, and
    for each course, also display the responsible faculty name and the offer school
    name, but only for academic terms where the term status is 'Previous'. Do not
    return any rounded answers.
  id: dw_4658
  name: Mathematics Library Subjects 5+ Enrolled in Previous Terms with Faculty and
    Calendar Attributes
  sql: WITH inner_cte AS ( SELECT t0.COURSE_NUMBER, t0.SUBJECT_TITLE, t0.NUM_ENROLLED_STUDENTS,
    t1.TERM_DESCRIPTION, t1.ACADEMIC_YEAR, t0.TERM_CODE, ROW_NUMBER() OVER (PARTITION
    BY t1.ACADEMIC_YEAR ORDER BY t0.COURSE_NUMBER) AS window_column FROM LIBRARY_SUBJECT_OFFERED
    t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE = t1.TERM_CODE WHERE t0.OFFER_DEPT_NAME
    = 'Mathematics' AND t0.NUM_ENROLLED_STUDENTS >= 5 ), PreviousTerms AS ( SELECT
    t1.TERM_CODE, t1.TERM_DESCRIPTION, t1.TERM_START_DATE, t0.CALENDAR_DATE, t0.DAY_OF_WEEK,
    AVG(t0.CALENDAR_YEAR) OVER (PARTITION BY t0.CALENDAR_YEAR ORDER BY t1.TERM_START_DATE)
    AS window_column FROM TIME_DAY t0 JOIN ACADEMIC_TERMS t1 ON t0.CALENDAR_DATE =
    t1.TERM_START_DATE WHERE t1.TERM_STATUS = 'Previous' ) SELECT ic.COURSE_NUMBER,
    ic.SUBJECT_TITLE, ic.NUM_ENROLLED_STUDENTS, ic.TERM_DESCRIPTION, ic.ACADEMIC_YEAR,
    ic.window_column AS math_window_column, pt.TERM_START_DATE, pt.CALENDAR_DATE,
    pt.DAY_OF_WEEK, pt.window_column AS previous_terms_window_column, lso.RESPONSIBLE_FACULTY_NAME,
    lso.OFFER_SCHOOL_NAME FROM inner_cte ic JOIN PreviousTerms pt ON ic.TERM_CODE
    = pt.TERM_CODE JOIN LIBRARY_SUBJECT_OFFERED lso ON ic.COURSE_NUMBER = lso.COURSE_NUMBER
    AND ic.TERM_CODE = lso.TERM_CODE ORDER BY ic.COURSE_NUMBER, pt.TERM_START_DATE;
- category: Library Reserve and Enrollment Comprehensive Analysis
  default_granularity: one row per department per course number
  desc: For each department where the total number of subject enrollments for subjects
    offered in the current term is greater than 10, and for each course number in
    that department where the number of enrolled students in the subject summary is
    greater than 2, provide the department name, the total number of subject enrollments,
    the course number, the number of unique library subjects offered, the minimum
    total units for those subjects, and the name of the responsible faculty member
    for each course. Do not return any rounded answers.
  id: dw_4683
  name: Current Term Department Enrollments with Library Course Counts and Min Units
  sql: WITH inner_cte AS ( SELECT de.DEPARTMENT_NAME, de.total_enrollments, lss.COURSE_NUMBER,
    lss.subject_count, lss.min_total_units FROM ( SELECT s.DEPARTMENT_NAME, SUM(s.SUBJECT_ENROLLMENT_NUMBER)
    AS total_enrollments FROM ACADEMIC_TERM_PARAMETER p JOIN ACADEMIC_TERMS t ON p.TERM_CODE
    = t.TERM_CODE JOIN SUBJECT_SUMMARY s ON t.TERM_CODE = s.TERM_CODE WHERE p.IS_CURRENT_TERM
    = 'Y' GROUP BY s.DEPARTMENT_NAME HAVING SUM(s.SUBJECT_ENROLLMENT_NUMBER) > 10
    ) de JOIN ( SELECT l.OFFER_DEPT_NAME, l.COURSE_NUMBER, COUNT(DISTINCT l.LIBRARY_SUBJECT_OFFERED_KEY)
    AS subject_count, MIN(s.TOTAL_UNITS) AS min_total_units FROM LIBRARY_SUBJECT_OFFERED
    l JOIN TIP_DETAIL t ON l.SUBJECT_ID = t.SUBJECT_ID JOIN SUBJECT_OFFERED_SUMMARY
    s ON t.SUBJECT_ID = s.SUBJECT_ID WHERE s.NUM_ENROLLED_STUDENTS > 2 GROUP BY l.OFFER_DEPT_NAME,
    l.COURSE_NUMBER ) lss ON de.DEPARTMENT_NAME = lss.OFFER_DEPT_NAME ) SELECT ic.DEPARTMENT_NAME,
    ic.total_enrollments, ic.COURSE_NUMBER, ic.subject_count, ic.min_total_units,
    sos.RESPONSIBLE_FACULTY_NAME FROM inner_cte ic JOIN LIBRARY_SUBJECT_OFFERED lso
    ON ic.DEPARTMENT_NAME = lso.OFFER_DEPT_NAME AND ic.COURSE_NUMBER = lso.COURSE_NUMBER
    JOIN SUBJECT_OFFERED_SUMMARY sos ON lso.SUBJECT_ID = sos.SUBJECT_ID WHERE sos.NUM_ENROLLED_STUDENTS
    > 2 GROUP BY ic.DEPARTMENT_NAME, ic.total_enrollments, ic.COURSE_NUMBER, ic.subject_count,
    ic.min_total_units, sos.RESPONSIBLE_FACULTY_NAME;
- category: Library Reserve and Subject Offering Comprehensive Analysis
  default_granularity: one row per academic year
  desc: For each academic year, what is the academic year, academic year description,
    the geometric mean of the number of library reserve material details per subject
    offered (considering only records where the material status is 'U' and the academic
    term is a regular term), the average total units, the standard deviation (using
    STDDEV only and never STDDEV_POP) of total units, and the average number of design
    units for subjects that are offered in the fall term and have a material status
    of 'U' in the library reserve? List the results ordered by the geometric mean
    of materials per subject in descending order, then by the standard deviation (using
    STDDEV only and never STDDEV_POP) of total units in descending order. Do not return
    any rounded answers.
  id: dw_4701
  name: Yearly Geometric Mean Reserve Materials per Subject with Fall Term Unit Statistics
  sql: WITH inner_cte AS ( WITH GeometricMeanMaterialsPerSubject AS ( SELECT ACADEMIC_TERMS.ACADEMIC_YEAR,
    ACADEMIC_TERMS.ACADEMIC_YEAR_DESC, EXP(AVG(LN(material_count))) AS geometric_mean_materials_per_subject
    FROM ( SELECT LIBRARY_RESERVE_MATRL_DETAIL.LIBRARY_SUBJECT_OFFERED_KEY, COUNT(*)
    AS material_count, LIBRARY_RESERVE_MATRL_DETAIL.TERM_CODE FROM LIBRARY_RESERVE_MATRL_DETAIL
    WHERE LIBRARY_RESERVE_MATRL_DETAIL.LIBRARY_MATERIAL_STATUS_KEY = 'U' GROUP BY
    LIBRARY_RESERVE_MATRL_DETAIL.LIBRARY_SUBJECT_OFFERED_KEY, LIBRARY_RESERVE_MATRL_DETAIL.TERM_CODE
    ) sub JOIN ACADEMIC_TERMS ON sub.TERM_CODE = ACADEMIC_TERMS.TERM_CODE WHERE ACADEMIC_TERMS.IS_REGULAR_TERM
    = 'Y' GROUP BY ACADEMIC_TERMS.ACADEMIC_YEAR, ACADEMIC_TERMS.ACADEMIC_YEAR_DESC
    ), AvgStddevTotalUnitsFallU AS ( SELECT at.ACADEMIC_YEAR, at.ACADEMIC_YEAR_DESC,
    AVG(ccso.TOTAL_UNITS) AS avg_total_units, STDDEV(ccso.TOTAL_UNITS) AS stddev_total_units
    FROM LIBRARY_RESERVE_MATRL_DETAIL lrm JOIN ACADEMIC_TERMS at ON lrm.TERM_CODE
    = at.TERM_CODE JOIN COURSE_CATALOG_SUBJECT_OFFERED ccso ON at.TERM_CODE = ccso.EFFECTIVE_TERM_CODE
    WHERE lrm.LIBRARY_MATERIAL_STATUS_KEY = 'U' AND ccso.IS_OFFERED_FALL_TERM = 'Y'
    GROUP BY at.ACADEMIC_YEAR, at.ACADEMIC_YEAR_DESC ) SELECT gmmps.ACADEMIC_YEAR,
    gmmps.ACADEMIC_YEAR_DESC, gmmps.geometric_mean_materials_per_subject, astu.avg_total_units,
    astu.stddev_total_units FROM GeometricMeanMaterialsPerSubject gmmps JOIN AvgStddevTotalUnitsFallU
    astu ON gmmps.ACADEMIC_YEAR = astu.ACADEMIC_YEAR AND gmmps.ACADEMIC_YEAR_DESC
    = astu.ACADEMIC_YEAR_DESC ORDER BY gmmps.geometric_mean_materials_per_subject
    DESC, astu.stddev_total_units DESC ) SELECT icte.ACADEMIC_YEAR, icte.ACADEMIC_YEAR_DESC,
    icte.geometric_mean_materials_per_subject, icte.avg_total_units, icte.stddev_total_units,
    avg_design.avg_design_units FROM inner_cte icte JOIN ( SELECT at.ACADEMIC_YEAR,
    at.ACADEMIC_YEAR_DESC, AVG(ccso.DESIGN_UNITS) AS avg_design_units FROM LIBRARY_RESERVE_MATRL_DETAIL
    lrm JOIN ACADEMIC_TERMS at ON lrm.TERM_CODE = at.TERM_CODE JOIN COURSE_CATALOG_SUBJECT_OFFERED
    ccso ON at.TERM_CODE = ccso.EFFECTIVE_TERM_CODE WHERE lrm.LIBRARY_MATERIAL_STATUS_KEY
    = 'U' AND ccso.IS_OFFERED_FALL_TERM = 'Y' GROUP BY at.ACADEMIC_YEAR, at.ACADEMIC_YEAR_DESC
    ) avg_design ON icte.ACADEMIC_YEAR = avg_design.ACADEMIC_YEAR AND icte.ACADEMIC_YEAR_DESC
    = avg_design.ACADEMIC_YEAR_DESC ORDER BY icte.geometric_mean_materials_per_subject
    DESC, icte.stddev_total_units DESC;
- category: Library Reserve and Textbook Material Comprehensive Analysis
  default_granularity: one row per Mathematics library subject in regular terms
  desc: 'For each subject offered in the library in the Mathematics department during
    regular terms, show the subject title, number of enrolled students, offering department
    name, term description, academic year, subject short title, and the maximum total
    units for each row and the next two rows in order of subject ID. Additionally,
    for the corresponding offering department and school, provide the number of unique
    subjects with course material status ''RQ'' and the minimum total units for those
    subjects. Also, include the department phone number and the school name for the
    offering department, and display the responsible faculty name for each subject.
    The columns should be shown in the following order: subject title, number of enrolled
    students, offering department name, term description, academic year, subject short
    title, maximum total units for each row and the next two rows, number of unique
    subjects with course material status ''RQ'', minimum total units for those subjects,
    department phone number, school name, and responsible faculty name. Do not return
    any rounded answers.'
  id: dw_4724
  name: Mathematics Library Regular-Term Subjects 3-Row Max Units with Required Material
    Department Statistics
  sql: WITH inner_cte AS ( SELECT t0.SUBJECT_TITLE, t0.NUM_ENROLLED_STUDENTS, t0.OFFER_DEPT_NAME,
    t1.TERM_DESCRIPTION, t1.ACADEMIC_YEAR, t2.SUBJECT_SHORT_TITLE, MAX(t2.TOTAL_UNITS)
    OVER (ORDER BY t0.SUBJECT_ID ROWS BETWEEN CURRENT ROW AND 2 FOLLOWING) AS MAX_TOTAL_UNITS,
    t0.SUBJECT_ID, t0.OFFER_DEPT_NAME AS SUB1_OFFER_DEPT_NAME, t0.OFFER_SCHOOL_NAME
    AS SUB1_OFFER_SCHOOL_NAME, t0.RESPONSIBLE_FACULTY_NAME FROM LIBRARY_SUBJECT_OFFERED
    t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE = t1.TERM_CODE JOIN COURSE_CATALOG_SUBJECT_OFFERED
    t2 ON t1.TERM_CODE = t2.TERM_CODE AND t0.SUBJECT_ID = t2.SUBJECT_ID WHERE t0.OFFER_DEPT_NAME
    = 'Mathematics' AND t1.IS_REGULAR_TERM = 'Y' ), Sub2 AS ( SELECT tso.OFFER_DEPT_NAME,
    tso.OFFER_SCHOOL_NAME, COUNT(DISTINCT tso.SUBJECT_ID) AS subject_count, MIN(sos.TOTAL_UNITS)
    AS min_total_units FROM TIP_SUBJECT_OFFERED tso JOIN TIP_DETAIL td ON tso.SUBJECT_ID
    = td.SUBJECT_ID JOIN SUBJECT_OFFERED_SUMMARY sos ON td.SUBJECT_ID = sos.SUBJECT_ID
    WHERE td.TIP_MATERIAL_STATUS_KEY = 'RQ' GROUP BY tso.OFFER_DEPT_NAME, tso.OFFER_SCHOOL_NAME
    ) SELECT icte.SUBJECT_TITLE, icte.NUM_ENROLLED_STUDENTS, icte.OFFER_DEPT_NAME,
    icte.TERM_DESCRIPTION, icte.ACADEMIC_YEAR, icte.SUBJECT_SHORT_TITLE, icte.MAX_TOTAL_UNITS,
    s2.subject_count, s2.min_total_units, ad.DEPARTMENT_PHONE_NUMBER AS department_phone,
    sd.SCHOOL_NAME AS school_name, icte.RESPONSIBLE_FACULTY_NAME FROM inner_cte icte
    LEFT JOIN Sub2 s2 ON icte.SUB1_OFFER_DEPT_NAME = s2.OFFER_DEPT_NAME AND icte.SUB1_OFFER_SCHOOL_NAME
    = s2.OFFER_SCHOOL_NAME LEFT JOIN SIS_DEPARTMENT sd ON icte.OFFER_DEPT_NAME = sd.DEPARTMENT_NAME
    LEFT JOIN SIS_ADMIN_DEPARTMENT ad ON sd.DEPARTMENT_CODE = ad.SIS_ADMIN_DEPARTMENT_CODE
- category: Course Catalog and Department Analysis
  default_granularity: one row per department per subject code
  desc: Show the department names, the corresponding SIS subject code, subject code
    descriptions, graduate level, the total number of courses per department, and
    for each department, the number of subjects offered in the academic year 2022
    with a total of 12 units that also have at least one required or optional textbook.
    Do not return any rounded answers.
  id: dw_4756
  name: Department Course Counts with 2022 12-Unit Subjects Having Textbooks
  sql: WITH inner_cte AS ( SELECT t0.SUBJECT_CODE, t0.SUBJECT_NUMBER, t0.DEPARTMENT_NAME,
    t0.SUBJECT_TITLE, t1.TERM_DESCRIPTION, t0.TOTAL_UNITS, AVG(t2.SUBJECT_ENROLLMENT_NUMBER)
    OVER ( PARTITION BY t0.DEPARTMENT_CODE ORDER BY t0.TOTAL_UNITS ROWS BETWEEN 2
    PRECEDING AND 2 FOLLOWING ) AS window_column, t0.TERM_CODE, t0.SUBJECT_ID FROM
    COURSE_CATALOG_SUBJECT_OFFERED t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE = t1.TERM_CODE
    JOIN SUBJECT_SUMMARY t2 ON t1.TERM_CODE = t2.TERM_CODE AND t0.SUBJECT_ID = t2.SUBJECT_ID
    WHERE t0.ACADEMIC_YEAR = 2022 AND t0.TOTAL_UNITS = 12 ) SELECT sd.DEPARTMENT_NAME,
    sc.SUBJECT_CODE, sc.SUBJECT_CODE_DESC, scd.GRADUATE_LEVEL, Total_Courses.Total_Courses,
    COALESCE(SubjectsWithTextbooks.Subjects_With_Textbooks, 0) AS Subjects_With_Textbooks_2022_12units
    FROM SIS_DEPARTMENT sd JOIN SIS_COURSE_DESCRIPTION scd ON sd.DEPARTMENT_CODE =
    scd.DEPARTMENT JOIN SIS_SUBJECT_CODE sc ON scd.COURSE = sc.COURSE_NUMBER JOIN
    ( SELECT sd.DEPARTMENT_NAME, COUNT(DISTINCT COURSE_NUMBER) AS Total_Courses FROM
    SIS_DEPARTMENT sd JOIN SIS_COURSE_DESCRIPTION scd ON sd.DEPARTMENT_CODE = scd.DEPARTMENT
    JOIN SIS_SUBJECT_CODE sc ON scd.COURSE = sc.COURSE_NUMBER GROUP BY sd.DEPARTMENT_NAME
    ) AS Total_Courses ON sd.DEPARTMENT_NAME = Total_Courses.DEPARTMENT_NAME LEFT
    JOIN ( SELECT s1.DEPARTMENT_NAME, COUNT(DISTINCT s1.SUBJECT_CODE || '-' || s1.SUBJECT_NUMBER)
    AS Subjects_With_Textbooks FROM inner_cte s1 JOIN TIP_DETAIL t2 ON s1.TERM_CODE
    = t2.TERM_CODE AND s1.SUBJECT_ID = t2.SUBJECT_ID WHERE t2.TIP_MATERIAL_STATUS_KEY
    IN ('RQ', 'EO') GROUP BY s1.DEPARTMENT_NAME ) AS SubjectsWithTextbooks ON sd.DEPARTMENT_NAME
    = SubjectsWithTextbooks.DEPARTMENT_NAME ;
- category: Library Reserve and Textbook Material Comprehensive Analysis
  default_granularity: one row per status-U reserve material
  desc: For each library reserve material with material status key 'U', list the subject
    ID, library course instructor key, term description, academic year, term start
    date, the minimum academic year in a window of 3 preceding and 1 following row
    ordered by library reserve catalog key, the library subject offered key, the tip
    material key, the tip material status key, the average record count in a window
    of 2 preceding and 2 following rows grouped by the tip material status key and
    ordered by the academic year, and for each, include the academic year description
    and the last day of final exam from the ACADEMIC_TERMS_ALL table, and calculate
    the normalized year to average record count ratio (academic year divided by average
    record count in the window), ordered by the normalized year to average record
    count ratio descending.
  id: dw_4826
  name: Status-U Reserve Materials Windowed Year and Record Count Statistics with
    Normalized Ratio
  sql: WITH inner_cte AS ( WITH Subquery1 AS ( SELECT t2.SUBJECT_ID, t2.LIBRARY_COURSE_INSTRUCTOR_KEY,
    t1.TERM_DESCRIPTION, t1.ACADEMIC_YEAR, t1.TERM_START_DATE, MIN(t1.ACADEMIC_YEAR)
    OVER ( ORDER BY t2.LIBRARY_RESERVE_CATALOG_KEY ROWS BETWEEN 3 PRECEDING AND 1
    FOLLOWING ) AS window_column, t2.LIBRARY_RESERVE_CATALOG_KEY, t1.TERM_CODE FROM
    ACADEMIC_TERMS_ALL t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE = t1.TERM_CODE JOIN
    LIBRARY_RESERVE_MATRL_DETAIL t2 ON t1.TERM_CODE = t2.TERM_CODE WHERE t2.LIBRARY_MATERIAL_STATUS_KEY
    = 'U' ), Subquery2 AS ( SELECT t0.LIBRARY_RESERVE_CATALOG_KEY, t0.LIBRARY_SUBJECT_OFFERED_KEY,
    t0.TERM_CODE, t1.ACADEMIC_YEAR, t1.TERM_DESCRIPTION, t2.TIP_MATERIAL_KEY, t2.TIP_MATERIAL_STATUS_KEY,
    AVG(t2.RECORD_COUNT) OVER ( PARTITION BY t2.TIP_MATERIAL_STATUS_KEY ORDER BY t1.ACADEMIC_YEAR
    ROWS BETWEEN 2 PRECEDING AND 2 FOLLOWING ) AS window_column FROM LIBRARY_RESERVE_MATRL_DETAIL
    t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE = t1.TERM_CODE JOIN TIP_DETAIL t2 ON
    t1.TERM_CODE = t2.TERM_CODE WHERE t0.LIBRARY_MATERIAL_STATUS_KEY = 'U' ) SELECT
    s1.SUBJECT_ID, s1.LIBRARY_COURSE_INSTRUCTOR_KEY, s1.TERM_DESCRIPTION, s1.ACADEMIC_YEAR,
    s1.TERM_START_DATE, s1.window_column AS min_academic_year_window, s2.LIBRARY_SUBJECT_OFFERED_KEY,
    s2.TIP_MATERIAL_KEY, s2.TIP_MATERIAL_STATUS_KEY, s2.window_column AS avg_record_count_window,
    s1.TERM_CODE, ROUND(s1.ACADEMIC_YEAR / NULLIF(s2.window_column, 0), 2) AS normalized_year_to_avg_record_count
    FROM Subquery1 s1 JOIN Subquery2 s2 ON s1.LIBRARY_RESERVE_CATALOG_KEY = s2.LIBRARY_RESERVE_CATALOG_KEY
    AND s1.TERM_CODE = s2.TERM_CODE ) SELECT i.SUBJECT_ID, i.LIBRARY_COURSE_INSTRUCTOR_KEY,
    i.TERM_DESCRIPTION, i.ACADEMIC_YEAR, i.TERM_START_DATE, i.min_academic_year_window,
    i.LIBRARY_SUBJECT_OFFERED_KEY, i.TIP_MATERIAL_KEY, i.TIP_MATERIAL_STATUS_KEY,
    i.avg_record_count_window, t0.ACADEMIC_YEAR_DESC, t0.LAST_DAY_OF_FINAL_EXAM, i.normalized_year_to_avg_record_count
    FROM inner_cte i JOIN ACADEMIC_TERMS_ALL t0 ON i.TERM_CODE = t0.TERM_CODE ORDER
    BY i.normalized_year_to_avg_record_count DESC
- category: Library Reserve and Textbook Material Comprehensive Analysis
  default_granularity: one row per reserve material matched with textbook material
  desc: For each library reserve material detail with material status key 'U', show
    the reserve catalog key, subject offered key, term code, academic year, term description,
    tip material key, tip material status key, and the average record count in a window
    of 2 preceding and 2 following rows grouped by the tip material status key and
    ordered by the academic year, along with the corresponding textbook material in
    the TIP_DETAIL table with material status key 'RQ' that matches on tip material
    key and academic year, showing the textbook subject offered key, textbook material
    key, subject ID, textbook academic year, textbook term description, and the row
    number within each textbook academic year group ordered by term code. Additionally,
    for each matching textbook material, include the term start date and term end
    date from the ACADEMIC_TERMS_ALL table. Present the results in the order of reserve
    material academic year descending and textbook row number. Do not return any rounded
    answers.
  id: dw_4978
  name: Status-U Reserve Materials Matched with Required Textbooks Including Term
    Start and End Dates
  sql: WITH inner_cte AS ( SELECT t0.LIBRARY_RESERVE_CATALOG_KEY, t0.LIBRARY_SUBJECT_OFFERED_KEY,
    t0.TERM_CODE, t1.ACADEMIC_YEAR, t1.TERM_DESCRIPTION, t2.TIP_MATERIAL_KEY, t2.TIP_MATERIAL_STATUS_KEY,
    AVG(t2.RECORD_COUNT) OVER ( PARTITION BY t2.TIP_MATERIAL_STATUS_KEY ORDER BY t1.ACADEMIC_YEAR
    ROWS BETWEEN 2 PRECEDING AND 2 FOLLOWING ) AS window_column FROM LIBRARY_RESERVE_MATRL_DETAIL
    t0 JOIN ACADEMIC_TERMS t1 ON t0.TERM_CODE = t1.TERM_CODE JOIN TIP_DETAIL t2 ON
    t1.TERM_CODE = t2.TERM_CODE WHERE t0.LIBRARY_MATERIAL_STATUS_KEY = 'U' ) SELECT
    rmd.LIBRARY_RESERVE_CATALOG_KEY, rmd.LIBRARY_SUBJECT_OFFERED_KEY, rmd.TERM_CODE,
    rmd.ACADEMIC_YEAR, rmd.TERM_DESCRIPTION, rmd.TIP_MATERIAL_KEY, rmd.TIP_MATERIAL_STATUS_KEY,
    rmd.window_column AS reserve_window_avg_record_count, tmd.TIP_SUBJECT_OFFERED_KEY,
    tmd.TIP_MATERIAL_KEY AS textbook_material_key, tmd.SUBJECT_ID, tmd.ACADEMIC_YEAR
    AS textbook_academic_year, tmd.TERM_DESCRIPTION AS textbook_term_description,
    tmd.window_column AS textbook_row_number, tmd.TERM_START_DATE AS textbook_term_start_date,
    tmd.TERM_END_DATE AS textbook_term_end_date FROM inner_cte rmd JOIN ( SELECT t1.TIP_SUBJECT_OFFERED_KEY,
    t1.TIP_MATERIAL_KEY, t1.SUBJECT_ID, t1.TERM_CODE, t0.ACADEMIC_YEAR, t0.TERM_DESCRIPTION,
    ROW_NUMBER() OVER (PARTITION BY t0.ACADEMIC_YEAR ORDER BY t1.TERM_CODE) AS window_column,
    t0.TERM_START_DATE, t0.TERM_END_DATE FROM ACADEMIC_TERMS_ALL t0 JOIN TIP_DETAIL
    t1 ON t0.TERM_CODE = t1.TERM_CODE WHERE t1.TIP_MATERIAL_STATUS_KEY = 'RQ' ) tmd
    ON rmd.TIP_MATERIAL_KEY = tmd.TIP_MATERIAL_KEY AND rmd.ACADEMIC_YEAR = tmd.ACADEMIC_YEAR
    ORDER BY rmd.ACADEMIC_YEAR DESC, tmd.window_column
- category: IAP Activity and Academic Term Comprehensive Analysis
  default_granularity: one row per previous term matched with IAP subject category
    statistics
  desc: For each previous academic term where the term start date matches the minimum
    academic term start date for a subject category and academic year with more than
    10 maximum enrollment, show the term code, term description, term start date,
    calendar date, day of week, the average calendar year within each calendar year
    group ordered by term start date, the subject category key, academic year, number
    of unique subjects, minimum academic term start date, the normalized subjects
    per year rounded (number of unique subjects divided by the average calendar year),
    and for each such term, also list the number of unique subject IDs offered in
    that term and the earliest preregistration deadline among those subjects.
  id: dw_5095
  name: Previous Terms Matching IAP Category Min Start Dates with Normalized Subjects
    per Year
  sql: WITH inner_cte AS ( SELECT t1.TERM_CODE, t1.TERM_DESCRIPTION, t1.TERM_START_DATE,
    t0.CALENDAR_DATE, t0.DAY_OF_WEEK, AVG(t0.CALENDAR_YEAR) OVER (PARTITION BY t0.CALENDAR_YEAR
    ORDER BY t1.TERM_START_DATE) AS window_column FROM TIME_DAY t0 JOIN ACADEMIC_TERMS
    t1 ON t0.CALENDAR_DATE = t1.TERM_START_DATE WHERE t1.TERM_STATUS = 'Previous'
    ), SubjectCategoryStats AS ( SELECT i.IAP_SUBJECT_CATEGORY_KEY, a.ACADEMIC_YEAR,
    COUNT(DISTINCT i.IAP_SUBJECT_SESSION_KEY) AS subject_count, MIN(a.TERM_START_DATE)
    AS min_term_start_date FROM IAP_SUBJECT_DETAIL i JOIN ACADEMIC_TERMS a ON i.TERM_CODE
    = a.TERM_CODE JOIN TIP_DETAIL t ON a.TERM_CODE = t.TERM_CODE WHERE i.MAX_ENROLLMENT
    > 10 GROUP BY i.IAP_SUBJECT_CATEGORY_KEY, a.ACADEMIC_YEAR ), TermSubjectInfo AS
    ( SELECT t.TERM_CODE, COUNT(DISTINCT td.SUBJECT_ID) AS unique_subject_ids, MIN(i.PREREG_DEADLINE)
    AS earliest_prereg_deadline FROM ACADEMIC_TERMS t JOIN TIP_DETAIL td ON t.TERM_CODE
    = td.TERM_CODE JOIN IAP_SUBJECT_DETAIL i ON t.TERM_CODE = i.TERM_CODE GROUP BY
    t.TERM_CODE ) SELECT icte.TERM_CODE, icte.TERM_DESCRIPTION, icte.TERM_START_DATE,
    icte.CALENDAR_DATE, icte.DAY_OF_WEEK, icte.window_column, scs.IAP_SUBJECT_CATEGORY_KEY,
    scs.ACADEMIC_YEAR, scs.subject_count, scs.min_term_start_date, ROUND(scs.subject_count
    / NULLIF(icte.window_column, 0), 2) AS Normalized_Subjects_Per_Year, tsi.unique_subject_ids,
    tsi.earliest_prereg_deadline FROM inner_cte icte JOIN SubjectCategoryStats scs
    ON icte.TERM_START_DATE = scs.min_term_start_date JOIN TermSubjectInfo tsi ON
    icte.TERM_CODE = tsi.TERM_CODE ORDER BY Normalized_Subjects_Per_Year DESC;
- id: dw_41
  name: Yearly Average and Variance of Math Full-Term Subject Total Units in Previous
    Terms
  desc: For each academic year, provide the academic year description and calculate
    the average and variance of the total units for subjects offered in terms that
    are not the current term, have a term status indicator of 'P', are offered by
    the Mathematics department, and are full term subjects. Do not return any rounded
    answers.
  category: Subject Offering Analysis
  sql: WITH inner_cte AS ( SELECT ata.ACADEMIC_YEAR, ata.ACADEMIC_YEAR_DESC, AVG(ccso.TOTAL_UNITS)
    AS avg_total_units, VARIANCE(ccso.TOTAL_UNITS) AS total_units_variance FROM ACADEMIC_TERMS_ALL
    ata JOIN COURSE_CATALOG_SUBJECT_OFFERED ccso ON ata.TERM_CODE = ccso.TERM_CODE
    WHERE ata.IS_CURRENT_TERM = 'N' AND ata.TERM_STATUS_INDICATOR = 'P' AND ccso.DEPARTMENT_NAME
    = 'Mathematics' GROUP BY ata.ACADEMIC_YEAR, ata.ACADEMIC_YEAR_DESC ) SELECT ic.ACADEMIC_YEAR,
    ic.ACADEMIC_YEAR_DESC, ic.avg_total_units, ic.total_units_variance FROM inner_cte
    ic JOIN ACADEMIC_TERMS_ALL ata ON ic.ACADEMIC_YEAR = ata.ACADEMIC_YEAR JOIN COURSE_CATALOG_SUBJECT_OFFERED
    ccso ON ata.TERM_CODE = ccso.TERM_CODE WHERE ccso.TERM_DURATION = 'Full Term Subject'
    GROUP BY ic.ACADEMIC_YEAR, ic.ACADEMIC_YEAR_DESC, ic.avg_total_units, ic.total_units_variance
    ORDER BY ic.total_units_variance DESC;
  default_granularity: one row per academic year
- id: dw_1288
  name: Math IAP Max Enrollment Variance Rollup with Library and TIP Department Enrollment
    Totals
  desc: 'For each academic year, what is the variance and standard deviation (using
    STDDEV only and never STDDEV_POP) of the maximum enrollment for IAP activities
    offered in that year by the Mathematics department, considering only activities
    that require advance sign-up and are not cancelled, and also provide the academic
    year description? For each department, include a grand total for all activities
    in the format of (department name, null, total variance and stddev). Additionally,
    for each such department, provide the department code, the department name, and
    the total number of enrolled students in both the library and tip subject offerings,
    but only for those departments where the total number of enrolled students is
    more than one standard deviation (using STDDEV only and never STDDEV_POP) above
    the mean total enrolled students across all departments, and restrict your answer
    to departments whose name is ''Mathematics'' (Course 18). Also, for each such
    department, list the names of the responsible faculty members from both the library
    and tip subject offerings. The columns to display, in order, are: department name,
    academic year description, total variance, total standard deviation (using STDDEV
    only and never STDDEV_POP), department code, department name, total enrolled,
    library faculty, and tip faculty. Do not return any rounded answers.'
  category: Library Reserve and IAP Activity Comprehensive Analysis
  sql: WITH inner_cte1 AS ( SELECT ata.ACADEMIC_YEAR, ata.ACADEMIC_YEAR_DESC, VARIANCE(isd.MAX_ENROLLMENT)
    AS max_enrollment_variance, STDDEV(isd.MAX_ENROLLMENT) AS max_enrollment_stddev,
    ccso.DEPARTMENT_NAME FROM IAP_SUBJECT_DETAIL isd JOIN ACADEMIC_TERMS_ALL ata ON
    isd.TERM_CODE = ata.TERM_CODE JOIN COURSE_CATALOG_SUBJECT_OFFERED ccso ON ata.TERM_CODE
    = ccso.TERM_CODE WHERE isd.ENROLLMENT_TYPE = 'Advance sign-up required' AND isd.IS_CANCELLED
    = 'N' AND isd.MAX_ENROLLMENT IS NOT NULL AND ccso.DEPARTMENT_NAME = 'Mathematics'
    GROUP BY ata.ACADEMIC_YEAR, ata.ACADEMIC_YEAR_DESC, ccso.DEPARTMENT_NAME ), RollupResults
    AS ( SELECT DEPARTMENT_NAME, ACADEMIC_YEAR_DESC, SUM(max_enrollment_variance)
    AS total_variance, SUM(max_enrollment_stddev) AS total_stddev FROM inner_cte1
    GROUP BY DEPARTMENT_NAME, ACADEMIC_YEAR_DESC WITH ROLLUP HAVING SUM(max_enrollment_variance)
    IS NOT NULL ), inner_cte2 AS ( SELECT l.OFFER_DEPT_CODE, l.OFFER_DEPT_NAME, SUM(l.NUM_ENROLLED_STUDENTS
    + t.NUM_ENROLLED_STUDENTS) AS total_enrolled FROM LIBRARY_SUBJECT_OFFERED l JOIN
    TIP_SUBJECT_OFFERED t ON l.MASTER_SUBJECT_ID_SORT = t.MASTER_SUBJECT_ID_SORT WHERE
    l.OFFER_DEPT_NAME = 'Mathematics' GROUP BY l.OFFER_DEPT_CODE, l.OFFER_DEPT_NAME
    HAVING SUM(l.NUM_ENROLLED_STUDENTS + t.NUM_ENROLLED_STUDENTS) > ( SELECT AVG(total_sum)
    + STDDEV(total_sum) FROM ( SELECT SUM(l2.NUM_ENROLLED_STUDENTS + t2.NUM_ENROLLED_STUDENTS)
    AS total_sum FROM LIBRARY_SUBJECT_OFFERED l2 JOIN TIP_SUBJECT_OFFERED t2 ON l2.MASTER_SUBJECT_ID_SORT
    = t2.MASTER_SUBJECT_ID_SORT GROUP BY l2.OFFER_DEPT_CODE ) dept_totals ) AND l.OFFER_DEPT_CODE
    = '18' ) SELECT rr.DEPARTMENT_NAME, rr.ACADEMIC_YEAR_DESC, rr.total_variance,
    rr.total_stddev, c.OFFER_DEPT_CODE, c.OFFER_DEPT_NAME, c.total_enrolled, l.RESPONSIBLE_FACULTY_NAME
    AS library_faculty, t.RESPONSIBLE_FACULTY_NAME AS tip_faculty FROM RollupResults
    rr JOIN inner_cte2 c ON rr.DEPARTMENT_NAME = c.OFFER_DEPT_NAME JOIN LIBRARY_SUBJECT_OFFERED
    l ON c.OFFER_DEPT_CODE = l.OFFER_DEPT_CODE AND l.OFFER_DEPT_NAME = c.OFFER_DEPT_NAME
    JOIN TIP_SUBJECT_OFFERED t ON l.MASTER_SUBJECT_ID_SORT = t.MASTER_SUBJECT_ID_SORT
    WHERE l.OFFER_DEPT_NAME = 'Mathematics' ORDER BY rr.DEPARTMENT_NAME, rr.ACADEMIC_YEAR_DESC,
    c.OFFER_DEPT_CODE, c.OFFER_DEPT_NAME, c.total_enrolled, l.RESPONSIBLE_FACULTY_NAME,
    t.RESPONSIBLE_FACULTY_NAME;
  default_granularity: one row per department per academic year description plus rollup
    totals
- id: dw_1301
  name: Math Yearly Max Total Units with Fall-Term Library Enrollment Stddev and Equivalent
    Subjects
  desc: For each academic year, where the maximum number of total units for any Mathematics
    (Course 18) subject offered in that year is greater than 9 and there are more
    than 5 Mathematics subjects offered in the fall term, what are the academic year,
    the maximum total units, the corresponding term description, the subject title,
    the academic year description, the standard deviation (using STDDEV only and never
    STDDEV_POP) of the number of enrolled students in library subjects offered during
    terms in that year, and the average number of equivalent subjects for those library
    subjects? List the results in order of academic year. Do not return any rounded
    answers.
  category: Subject Offering and Enrollment Comprehensive Analysis
  sql: WITH inner_cte1 AS ( SELECT c.ACADEMIC_YEAR, MAX(c.TOTAL_UNITS) AS max_total_units
    FROM COURSE_CATALOG_SUBJECT_OFFERED c WHERE c.DEPARTMENT_NAME = 'Mathematics'
    GROUP BY c.ACADEMIC_YEAR HAVING max_total_units > 9 ), MaxUnitsSubjects AS ( SELECT
    ic.ACADEMIC_YEAR, ic.max_total_units, ata.TERM_DESCRIPTION, c.SUBJECT_TITLE FROM
    inner_cte1 ic JOIN COURSE_CATALOG_SUBJECT_OFFERED c ON c.ACADEMIC_YEAR = ic.ACADEMIC_YEAR
    AND c.TOTAL_UNITS = ic.max_total_units AND c.DEPARTMENT_NAME = 'Mathematics' JOIN
    ACADEMIC_TERMS_ALL ata ON ata.TERM_CODE = c.TERM_CODE ), inner_cte2 AS ( SELECT
    ata.ACADEMIC_YEAR, ata.ACADEMIC_YEAR_DESC, STDDEV(lso.NUM_ENROLLED_STUDENTS) AS
    stddev_num_enrolled_students FROM LIBRARY_SUBJECT_OFFERED lso JOIN ACADEMIC_TERMS_ALL
    ata ON lso.TERM_CODE = ata.TERM_CODE JOIN COURSE_CATALOG_SUBJECT_OFFERED ccso
    ON lso.TERM_CODE = ccso.TERM_CODE AND lso.SUBJECT_ID = ccso.SUBJECT_ID WHERE ccso.DEPARTMENT_NAME
    = 'Mathematics' AND ccso.IS_OFFERED_FALL_TERM = 'Y' GROUP BY ata.ACADEMIC_YEAR,
    ata.ACADEMIC_YEAR_DESC HAVING COUNT(*) > 5 ), LibraryStats AS ( SELECT icte.ACADEMIC_YEAR,
    icte.ACADEMIC_YEAR_DESC, icte.stddev_num_enrolled_students, AVG( CASE WHEN ccso.EQUIVALENT_SUBJECTS
    IS NULL OR ccso.EQUIVALENT_SUBJECTS = '' THEN 0 ELSE 1 + LENGTH(ccso.EQUIVALENT_SUBJECTS)
    - LENGTH(REPLACE(ccso.EQUIVALENT_SUBJECTS, ',', '')) END ) AS avg_num_equivalent_subjects
    FROM inner_cte2 icte JOIN ACADEMIC_TERMS_ALL ata ON icte.ACADEMIC_YEAR = ata.ACADEMIC_YEAR
    JOIN LIBRARY_SUBJECT_OFFERED lso ON ata.TERM_CODE = lso.TERM_CODE JOIN COURSE_CATALOG_SUBJECT_OFFERED
    ccso ON lso.TERM_CODE = ccso.TERM_CODE AND lso.SUBJECT_ID = ccso.SUBJECT_ID WHERE
    ccso.DEPARTMENT_NAME = 'Mathematics' AND ccso.IS_OFFERED_FALL_TERM = 'Y' GROUP
    BY icte.ACADEMIC_YEAR, icte.ACADEMIC_YEAR_DESC, icte.stddev_num_enrolled_students
    ) SELECT mus.ACADEMIC_YEAR, mus.max_total_units, mus.TERM_DESCRIPTION, mus.SUBJECT_TITLE,
    ls.ACADEMIC_YEAR_DESC, ls.stddev_num_enrolled_students, ls.avg_num_equivalent_subjects
    FROM MaxUnitsSubjects mus JOIN LibraryStats ls ON mus.ACADEMIC_YEAR = ls.ACADEMIC_YEAR
    ORDER BY mus.ACADEMIC_YEAR;
  default_granularity: one row per academic year per max-unit subject
- category: Subject Offering and Course Catalog Comprehensive Analysis
  default_granularity: one row per academic year per department per graduate level
  desc: For each academic year and department in Mathematics, what is the variance
    and standard deviation (using STDDEV only and never STDDEV_POP) of the total units
    for subjects offered in that year and department (considering only subjects offered
    in the current term, with more than 0 total units, and with subject enrollment
    number greater than the average for that department and year), and for those departments,
    what are the department code, corresponding administrative department name, the
    graduate level of courses, and the total number of distinct courses per department,
    for all degree-granting departments except the Management department? Present
    the results as academic year, department name, total units variance, total units
    standard deviation (using STDDEV only and never STDDEV_POP), department code,
    administrative department name, graduate level, and number of distinct courses,
    in that order. Do not return any rounded answers.
  entity_type_note: ''
  id: dw_1393
  name: Math Current-Term Unit Dispersion with Degree-Granting Department Course Counts
  sql: WITH inner_cte1 AS ( SELECT ACADEMIC_TERMS_ALL.ACADEMIC_YEAR, COURSE_CATALOG_SUBJECT_OFFERED.DEPARTMENT_NAME,
    SUBJECT_SUMMARY.TOTAL_UNITS, SUBJECT_SUMMARY.SUBJECT_ENROLLMENT_NUMBER FROM COURSE_CATALOG_SUBJECT_OFFERED
    JOIN ACADEMIC_TERMS_ALL ON COURSE_CATALOG_SUBJECT_OFFERED.TERM_CODE = ACADEMIC_TERMS_ALL.TERM_CODE
    JOIN SUBJECT_SUMMARY ON ACADEMIC_TERMS_ALL.TERM_CODE = SUBJECT_SUMMARY.TERM_CODE
    WHERE ACADEMIC_TERMS_ALL.IS_CURRENT_TERM = 'Y' AND SUBJECT_SUMMARY.TOTAL_UNITS
    > 0 AND COURSE_CATALOG_SUBJECT_OFFERED.DEPARTMENT_NAME = 'Mathematics' ), avg_enrollment
    AS ( SELECT ACADEMIC_YEAR, DEPARTMENT_NAME, AVG(SUBJECT_ENROLLMENT_NUMBER) AS
    avg_enrollment FROM inner_cte1 GROUP BY ACADEMIC_YEAR, DEPARTMENT_NAME ), math_units_stats
    AS ( SELECT i.ACADEMIC_YEAR, i.DEPARTMENT_NAME, VARIANCE(i.TOTAL_UNITS) AS total_units_variance,
    STDDEV(i.TOTAL_UNITS) AS total_units_stddev FROM inner_cte1 i JOIN avg_enrollment
    a ON i.ACADEMIC_YEAR = a.ACADEMIC_YEAR AND i.DEPARTMENT_NAME = a.DEPARTMENT_NAME
    WHERE i.SUBJECT_ENROLLMENT_NUMBER > a.avg_enrollment GROUP BY i.ACADEMIC_YEAR,
    i.DEPARTMENT_NAME ), inner_cte2 AS ( SELECT d.DEPARTMENT_CODE, d.DEPARTMENT_NAME,
    ad.SIS_ADMIN_DEPARTMENT_NAME, COUNT(DISTINCT c.COURSE) AS num_distinct_courses
    FROM SIS_COURSE_DESCRIPTION c JOIN SIS_DEPARTMENT d ON c.DEPARTMENT = d.DEPARTMENT_CODE
    JOIN SIS_ADMIN_DEPARTMENT ad ON d.DEPARTMENT_CODE = ad.SIS_ADMIN_DEPARTMENT_CODE
    WHERE d.IS_DEGREE_GRANTING = 'Y' AND UPPER(ad.SIS_ADMIN_DEPARTMENT_NAME) <> 'MANAGEMENT'
    GROUP BY d.DEPARTMENT_CODE, d.DEPARTMENT_NAME, ad.SIS_ADMIN_DEPARTMENT_NAME ),
    dept_courses AS ( SELECT ic.DEPARTMENT_CODE, ic.DEPARTMENT_NAME, ic.SIS_ADMIN_DEPARTMENT_NAME,
    scd.GRADUATE_LEVEL, ic.num_distinct_courses FROM inner_cte2 ic JOIN SIS_COURSE_DESCRIPTION
    scd ON ic.DEPARTMENT_CODE = scd.DEPARTMENT GROUP BY ic.DEPARTMENT_CODE, ic.DEPARTMENT_NAME,
    ic.SIS_ADMIN_DEPARTMENT_NAME, scd.GRADUATE_LEVEL, ic.num_distinct_courses ) SELECT
    mus.ACADEMIC_YEAR, mus.DEPARTMENT_NAME, mus.total_units_variance, mus.total_units_stddev,
    dc.DEPARTMENT_CODE, dc.SIS_ADMIN_DEPARTMENT_NAME, dc.GRADUATE_LEVEL, dc.num_distinct_courses
    FROM math_units_stats mus JOIN SIS_DEPARTMENT sd ON mus.DEPARTMENT_NAME = sd.DEPARTMENT_NAME
    JOIN dept_courses dc ON sd.DEPARTMENT_CODE = dc.DEPARTMENT_CODE ORDER BY mus.total_units_variance
    DESC, dc.DEPARTMENT_CODE, dc.GRADUATE_LEVEL;
- category: Course Catalog and Department Analysis
  default_granularity: one row per graduate course plus rollup totals plus Spring
    2021 letter-graded summary row
  desc: For each course in the Mathematics department that is degree granting and
    has a course level of 'G', show the course description, department name, school
    name, the administrative department name, and the dense rank over the administrative
    department name ordered by the administrative department name. Additionally, for
    each administrative department name, include a grand total of the number of such
    courses in the format of (null, null, null, administrative department name, null,
    total courses). Also, show the minimum total units, the sum of lecture units,
    and the number of unique subjects for letter graded Mathematics department subjects
    offered in the Spring Term 2021, along with the department name and term description
    (with all other columns as null). Do not return any rounded answers.
  id: dw_1427
  name: Math Graduate Degree-Granting Courses Ranked by Admin Department with Spring
    2021 Letter-Graded Unit Summary
  sql: WITH inner_cte_1 AS ( SELECT scd.COURSE_DESCRIPTION, sd.DEPARTMENT_NAME, sd.SCHOOL_NAME,
    sad.SIS_ADMIN_DEPARTMENT_NAME, DENSE_RANK() OVER (ORDER BY sad.SIS_ADMIN_DEPARTMENT_NAME)
    AS admin_dept_dense_rank FROM SIS_COURSE_DESCRIPTION scd JOIN SIS_DEPARTMENT sd
    ON scd.DEPARTMENT = sd.DEPARTMENT_CODE JOIN SIS_ADMIN_DEPARTMENT sad ON sd.DEPARTMENT_CODE
    = sad.SIS_ADMIN_DEPARTMENT_CODE WHERE scd.IS_DEGREE_GRANTING = 'Y' AND scd.COURSE_LEVEL
    = 'G' AND sd.DEPARTMENT_NAME = 'Mathematics' AND sd.DEPARTMENT_CODE = '18' ),
    CourseTotals AS ( SELECT SIS_ADMIN_DEPARTMENT_NAME, COUNT(*) AS total_courses
    FROM inner_cte_1 GROUP BY SIS_ADMIN_DEPARTMENT_NAME ), inner_cte_2 AS ( SELECT
    MIN(c.TOTAL_UNITS) AS min_total_units, SUM(c.LECTURE_UNITS) AS sum_lecture_units
    FROM ACADEMIC_TERMS_ALL a JOIN COURSE_CATALOG_SUBJECT_OFFERED c ON a.TERM_CODE
    = c.TERM_CODE WHERE a.TERM_CODE = '2021SP' AND c.GRADE_TYPE = 'L' AND c.DEPARTMENT_NAME
    = 'Mathematics' ) SELECT ic.COURSE_DESCRIPTION, ic.DEPARTMENT_NAME, ic.SCHOOL_NAME,
    ic.SIS_ADMIN_DEPARTMENT_NAME, ic.admin_dept_dense_rank, NULL AS total_courses,
    NULL AS min_total_units, NULL AS sum_lecture_units, NULL AS num_unique_subjects,
    NULL AS term_description FROM inner_cte_1 ic UNION ALL SELECT NULL, NULL, NULL,
    ct.SIS_ADMIN_DEPARTMENT_NAME, NULL, ct.total_courses, NULL, NULL, NULL, NULL FROM
    CourseTotals ct UNION ALL SELECT NULL, a.DEPARTMENT_NAME, NULL, NULL, NULL, NULL,
    inner_cte_2.min_total_units, inner_cte_2.sum_lecture_units, COUNT(DISTINCT a.SUBJECT_ID)
    AS num_unique_subjects, b.TERM_DESCRIPTION FROM COURSE_CATALOG_SUBJECT_OFFERED
    a JOIN ACADEMIC_TERMS_ALL b ON a.TERM_CODE = b.TERM_CODE CROSS JOIN inner_cte_2
    WHERE a.TERM_CODE = '2021SP' AND a.GRADE_TYPE = 'L' AND a.DEPARTMENT_NAME = 'Mathematics'
    GROUP BY a.DEPARTMENT_NAME, b.TERM_DESCRIPTION, inner_cte_2.min_total_units, inner_cte_2.sum_lecture_units
    ORDER BY SIS_ADMIN_DEPARTMENT_NAME, COURSE_DESCRIPTION
- category: IAP Activity and Course Catalog Comprehensive Analysis
  default_granularity: one row per school per academic year
  desc: For each school, what is the school's name, the school's name in the commencement
    book, the maximum CIP program code among its degree-granting departments' courses
    (excluding the Mathematics department), the CIP category ('HIGH_CIP', 'LOW_CIP',
    or 'MEDIUM_CIP'), the academic year, the academic year description, the standard
    deviation (using STDDEV only and never STDDEV_POP) of the maximum enrollment for
    IAP activities offered by the Mathematics department in that year (considering
    only years with more than five activities), and the Mathematics department phone
    number, for schools where the maximum CIP program code is greater than 130000
    and the standard deviation (using STDDEV only and never STDDEV_POP) of maximum
    enrollment is available? Do not return any rounded answers.
  id: dw_1618
  name: School CIP Categories with Yearly Math IAP Max Enrollment Stddev and Department
    Phone
  sql: WITH school_cip AS ( WITH inner_cte AS ( SELECT d.DEPARTMENT_NAME, MAX(c.CIP_PROGRAM_CODE)
    AS max_cip_code, d.DEPARTMENT_FULL_NAME, d.SCHOOL_NAME, d.SCHOOL_CODE FROM SIS_COURSE_DESCRIPTION
    c JOIN SIS_DEPARTMENT d ON c.DEPARTMENT = d.DEPARTMENT_CODE WHERE d.IS_DEGREE_GRANTING
    = 'Y' AND d.DEPARTMENT_CODE <> '18' GROUP BY d.DEPARTMENT_NAME, d.DEPARTMENT_FULL_NAME,
    d.SCHOOL_NAME, d.SCHOOL_CODE HAVING MAX(c.CIP_PROGRAM_CODE) > 120000 ) SELECT
    i.SCHOOL_NAME, s.SCHOOL_NAME_IN_COMMENCEMENT_BK, MAX(i.max_cip_code) AS school_max_cip_code,
    CASE WHEN MAX(i.max_cip_code) > 150000 THEN 'HIGH_CIP' WHEN MAX(i.max_cip_code)
    < 130000 THEN 'LOW_CIP' ELSE 'MEDIUM_CIP' END AS cip_category FROM inner_cte i
    JOIN SIS_DEPARTMENT s ON i.SCHOOL_CODE = s.SCHOOL_CODE GROUP BY i.SCHOOL_NAME,
    s.SCHOOL_NAME_IN_COMMENCEMENT_BK ), math_iap_enroll AS ( WITH inner_cte AS ( SELECT
    ata.ACADEMIC_YEAR, ata.ACADEMIC_YEAR_DESC, STDDEV_SAMP(isd.MAX_ENROLLMENT) AS
    stddev_max_enrollment FROM IAP_SUBJECT_DETAIL isd JOIN ACADEMIC_TERMS_ALL ata
    ON isd.TERM_CODE = ata.TERM_CODE JOIN COURSE_CATALOG_SUBJECT_OFFERED ccso ON isd.TERM_CODE
    = ccso.TERM_CODE WHERE ccso.DEPARTMENT_NAME = 'Mathematics' AND isd.MAX_ENROLLMENT
    IS NOT NULL GROUP BY ata.ACADEMIC_YEAR, ata.ACADEMIC_YEAR_DESC HAVING COUNT(isd.MAX_ENROLLMENT)
    > 5 ) SELECT inner_cte.ACADEMIC_YEAR, inner_cte.ACADEMIC_YEAR_DESC, inner_cte.stddev_max_enrollment,
    ad.DEPARTMENT_PHONE_NUMBER AS department_phone, sd.SCHOOL_NAME AS school_name
    FROM inner_cte LEFT JOIN SIS_DEPARTMENT sd ON sd.DEPARTMENT_NAME = 'Mathematics'
    LEFT JOIN SIS_ADMIN_DEPARTMENT ad ON sd.DEPARTMENT_CODE = ad.SIS_ADMIN_DEPARTMENT_CODE
    ORDER BY inner_cte.ACADEMIC_YEAR ) SELECT sc.SCHOOL_NAME, sc.SCHOOL_NAME_IN_COMMENCEMENT_BK,
    sc.school_max_cip_code, sc.cip_category, mie.ACADEMIC_YEAR, mie.ACADEMIC_YEAR_DESC,
    mie.stddev_max_enrollment, mie.department_phone FROM school_cip sc JOIN math_iap_enroll
    mie ON sc.SCHOOL_NAME = mie.school_name WHERE sc.school_max_cip_code > 130000
    AND mie.stddev_max_enrollment IS NOT NULL ORDER BY sc.SCHOOL_NAME, mie.ACADEMIC_YEAR;
- category: Subject Offering and Enrollment Comprehensive Analysis
  default_granularity: one row per department per course level matched with Spring
    2021 letter-graded summary
  desc: 'For each department name and course level in the Mathematics department (Course
    18) where the total number of enrolled students in offered subjects is greater
    than the average number of enrolled students for that department and the subjects
    are degree-granting, provide the number of unique courses and the minimum total
    units among those subjects, along with the term description, the minimum total
    units, the sum of lecture units, and the number of unique subjects for letter
    graded Mathematics subjects offered in the Spring Term 2021. List the columns
    in the following order: department name, course level, number of unique courses,
    minimum total units from the first set, term description, minimum total units
    from the second set, sum of lecture units, and number of unique subjects. Do not
    return any rounded answers.'
  id: dw_1692
  name: Math Degree-Granting Course Levels Above Average Enrollment with Spring 2021
    Letter-Graded Summary
  sql: WITH inner_cte1 AS ( SELECT d.DEPARTMENT_NAME, c.COURSE_LEVEL, COUNT(DISTINCT
    c.COURSE) AS course_count, MIN(s.TOTAL_UNITS) AS min_total_units, s.NUM_ENROLLED_STUDENTS
    FROM SIS_COURSE_DESCRIPTION c JOIN SIS_DEPARTMENT d ON c.DEPARTMENT = d.DEPARTMENT_CODE
    JOIN SUBJECT_OFFERED_SUMMARY s ON d.DEPARTMENT_CODE = s.OFFER_DEPT_CODE WHERE
    d.DEPARTMENT_NAME = 'Mathematics' AND c.IS_DEGREE_GRANTING = 'Y' GROUP BY d.DEPARTMENT_NAME,
    c.COURSE_LEVEL, s.NUM_ENROLLED_STUDENTS ), dept_avg AS ( SELECT d.DEPARTMENT_NAME,
    AVG(s.NUM_ENROLLED_STUDENTS) AS avg_enrolled FROM SIS_DEPARTMENT d JOIN SUBJECT_OFFERED_SUMMARY
    s ON d.DEPARTMENT_CODE = s.OFFER_DEPT_CODE WHERE d.DEPARTMENT_NAME = 'Mathematics'
    GROUP BY d.DEPARTMENT_NAME ), subq1 AS ( SELECT i.DEPARTMENT_NAME, i.COURSE_LEVEL,
    i.course_count, i.min_total_units FROM inner_cte1 i JOIN dept_avg a ON i.DEPARTMENT_NAME
    = a.DEPARTMENT_NAME WHERE i.NUM_ENROLLED_STUDENTS > a.avg_enrolled ), inner_cte2
    AS ( SELECT MIN(c.TOTAL_UNITS) AS min_total_units, SUM(c.LECTURE_UNITS) AS sum_lecture_units
    FROM ACADEMIC_TERMS_ALL a JOIN COURSE_CATALOG_SUBJECT_OFFERED c ON a.TERM_CODE
    = c.TERM_CODE WHERE a.TERM_CODE = '2021SP' AND c.GRADE_TYPE = 'L' AND c.DEPARTMENT_NAME
    = 'Mathematics' ), subq2 AS ( SELECT a.DEPARTMENT_NAME, b.TERM_DESCRIPTION, inner_cte2.min_total_units,
    inner_cte2.sum_lecture_units, COUNT(DISTINCT a.SUBJECT_ID) AS num_unique_subjects
    FROM COURSE_CATALOG_SUBJECT_OFFERED a JOIN ACADEMIC_TERMS_ALL b ON a.TERM_CODE
    = b.TERM_CODE CROSS JOIN inner_cte2 WHERE a.TERM_CODE = '2021SP' AND a.GRADE_TYPE
    = 'L' AND a.DEPARTMENT_NAME = 'Mathematics' GROUP BY a.DEPARTMENT_NAME, b.TERM_DESCRIPTION,
    inner_cte2.min_total_units, inner_cte2.sum_lecture_units ) SELECT q1.DEPARTMENT_NAME,
    q1.COURSE_LEVEL, q1.course_count, q1.min_total_units AS min_total_units_subq1,
    q2.TERM_DESCRIPTION, q2.min_total_units AS min_total_units_subq2, q2.sum_lecture_units,
    q2.num_unique_subjects FROM subq1 q1 JOIN subq2 q2 ON q1.DEPARTMENT_NAME = q2.DEPARTMENT_NAME
    ORDER BY q1.COURSE_LEVEL, q2.TERM_DESCRIPTION
- category: Library Reserve and Textbook Material Comprehensive Analysis
  default_granularity: one row per 2014FA Chemistry library subject per academic year
    per required-material count
  desc: For subjects offered in the term '2014FA' by the Chemistry department, show
    the subject title from the library, the number of enrolled students in the library
    subject, the responsible faculty name from the TIP subject, the offer department
    name from the TIP subject, the minimum number of enrolled students in the library
    subject within a window of 3 preceding and 1 following row ordered by the TIP
    subject's responsible faculty MIT ID, and for each academic year, also show the
    academic year and academic year description and the coefficient of variation (using
    STDDEV only and never STDDEV_POP) of the total units for subjects in the Mathematics
    department (Course 18) that have more than 0 total units and are offered in terms
    with a term status indicator of 'P'. Additionally, for each Chemistry subject,
    include the number of required TIP materials (where TIP_MATERIAL_STATUS_KEY =
    'RQ') for that subject in that term. Do not return any rounded answers.
  id: dw_2180
  name: 2014FA Chemistry Library Subjects Windowed Enrollment with Math Unit Coefficient
    of Variation and Required Material Counts
  sql: WITH inner_cte AS ( SELECT l.SUBJECT_TITLE, l.NUM_ENROLLED_STUDENTS, t.RESPONSIBLE_FACULTY_NAME,
    t.OFFER_DEPT_NAME, MIN(l.NUM_ENROLLED_STUDENTS) OVER ( ORDER BY t.RESPONSIBLE_FACULTY_MIT_ID
    ROWS BETWEEN 3 PRECEDING AND 1 FOLLOWING ) AS window_column, l.TERM_CODE FROM
    LIBRARY_SUBJECT_OFFERED l JOIN TIP_SUBJECT_OFFERED t ON l.TERM_CODE = t.TERM_CODE
    WHERE l.TERM_CODE = '2014FA' AND t.OFFER_DEPT_NAME = 'Chemistry' ), math_units_variation
    AS ( SELECT ata.ACADEMIC_YEAR, ata.ACADEMIC_YEAR_DESC, STDDEV_SAMP(ss.TOTAL_UNITS)
    / NULLIF(AVG(ss.TOTAL_UNITS), 0) AS coefficient_of_variation_total_units FROM
    SUBJECT_SUMMARY ss JOIN ACADEMIC_TERMS_ALL ata ON ss.TERM_CODE = ata.TERM_CODE
    WHERE ss.DEPARTMENT_NAME = 'Mathematics' AND ss.TOTAL_UNITS > 0 AND ata.TERM_STATUS_INDICATOR
    = 'P' GROUP BY ata.ACADEMIC_YEAR, ata.ACADEMIC_YEAR_DESC ORDER BY ata.ACADEMIC_YEAR
    ), required_materials_count AS ( SELECT t.TERM_CODE, t.SUBJECT_ID, COUNT(*) AS
    num_required_materials FROM TIP_DETAIL t WHERE t.TIP_MATERIAL_STATUS_KEY = 'RQ'
    GROUP BY t.TERM_CODE, t.SUBJECT_ID ) SELECT c.SUBJECT_TITLE, c.NUM_ENROLLED_STUDENTS,
    c.RESPONSIBLE_FACULTY_NAME, c.OFFER_DEPT_NAME, c.window_column, m.ACADEMIC_YEAR,
    m.ACADEMIC_YEAR_DESC, m.coefficient_of_variation_total_units, COALESCE(r.num_required_materials,
    0) AS num_required_materials FROM inner_cte c CROSS JOIN math_units_variation
    m LEFT JOIN TIP_SUBJECT_OFFERED t ON c.TERM_CODE = t.TERM_CODE AND c.SUBJECT_TITLE
    = t.SUBJECT_TITLE LEFT JOIN required_materials_count r ON t.TERM_CODE = r.TERM_CODE
    AND t.SUBJECT_ID = r.SUBJECT_ID
- category: Textbook Material and Enrollment Comprehensive Analysis
  default_granularity: one row per Chemistry subject with materials per term
  desc: For each subject offered by the Chemistry department (Course 5) that has course
    materials, provide the subject title, term code, offering department name, responsible
    faculty name, department full name, school name, and the maximum number of enrolled
    students for each subject considering the current row and the next 2 rows ordered
    by subject offered key, along with the minimum academic year and average total
    units for the corresponding academic term in the Mathematics department, where
    the academic year is between 2000 and 2020 or the total units are at least 6,
    and the total units are between 1 and 12. Additionally, include the term description
    and the last day of final exam for each term from the academic terms table. The
    results should be listed in order by term code and subject title. Do not return
    any rounded answers.
  id: dw_2560
  name: Chemistry Subjects with Course Materials 3-Row Max Enrollment vs Math Term
    Unit Statistics with Final Exam Date
  sql: WITH inner_cte AS ( WITH MathTermStats AS ( SELECT s.TERM_CODE, MIN(a.ACADEMIC_YEAR)
    AS min_academic_year, AVG(s.TOTAL_UNITS) AS avg_total_units FROM SUBJECT_SUMMARY
    s JOIN ACADEMIC_TERMS_ALL a ON s.TERM_CODE = a.TERM_CODE WHERE s.DEPARTMENT_NAME
    = 'Mathematics' AND s.TOTAL_UNITS BETWEEN 1 AND 12 AND ( a.ACADEMIC_YEAR BETWEEN
    2000 AND 2020 OR s.TOTAL_UNITS >= 6 ) GROUP BY s.TERM_CODE ORDER BY s.TERM_CODE
    ), ChemistrySubjectStats AS ( SELECT t0.SUBJECT_TITLE, t0.TERM_CODE, t0.OFFER_DEPT_NAME,
    t0.RESPONSIBLE_FACULTY_NAME, t1.DEPARTMENT_FULL_NAME, t1.SCHOOL_NAME, MAX(t0.NUM_ENROLLED_STUDENTS)
    OVER ( ORDER BY t0.TIP_SUBJECT_OFFERED_KEY ROWS BETWEEN CURRENT ROW AND 2 FOLLOWING
    ) AS max_num_enrolled_students FROM TIP_SUBJECT_OFFERED t0 JOIN STUDENT_DEPARTMENT
    t1 ON t0.OFFER_DEPT_CODE = t1.DEPARTMENT_CODE WHERE t0.NUM_ENROLLED_STUDENTS >=
    0 AND t0.TERM_CODE IS NOT NULL AND t0.OFFER_DEPT_NAME = 'Chemistry' AND t0.IS_NO_COURSE_MATERIAL
    = 'N' ) SELECT c.SUBJECT_TITLE, c.TERM_CODE, c.OFFER_DEPT_NAME, c.RESPONSIBLE_FACULTY_NAME,
    c.DEPARTMENT_FULL_NAME, c.SCHOOL_NAME, c.max_num_enrolled_students, m.min_academic_year,
    m.avg_total_units FROM ChemistrySubjectStats c JOIN MathTermStats m ON c.TERM_CODE
    = m.TERM_CODE ) SELECT i.SUBJECT_TITLE, i.TERM_CODE, i.OFFER_DEPT_NAME, i.RESPONSIBLE_FACULTY_NAME,
    i.DEPARTMENT_FULL_NAME, i.SCHOOL_NAME, i.max_num_enrolled_students, i.min_academic_year,
    i.avg_total_units, a.TERM_DESCRIPTION, a.LAST_DAY_OF_FINAL_EXAM FROM inner_cte
    i JOIN ACADEMIC_TERMS_ALL a ON i.TERM_CODE = a.TERM_CODE ORDER BY i.TERM_CODE,
    i.SUBJECT_TITLE;
- category: IAP Activity Analysis
  default_granularity: one row per IAP activity per term description per subject
  desc: For IAP subject activities with a maximum enrollment of 12, show the activity
    title, enrollment type, term description, subject ID, and the earliest create
    date for each activity within each term description group. Do not return any rounded
    answers.
  id: dw_2790
  name: IAP Activities Max Enrollment 12 with Earliest Create Date per Term
  sql: WITH inner_cte AS ( SELECT t0.ACTIVITY_TITLE, t0.ENROLLMENT_TYPE, t1.TERM_DESCRIPTION,
    t2.SUBJECT_ID, t0.CREATE_DATE FROM IAP_SUBJECT_DETAIL t0 JOIN ACADEMIC_TERMS_ALL
    t1 ON t0.TERM_CODE = t1.TERM_CODE JOIN TIP_DETAIL t2 ON t1.TERM_CODE = t2.TERM_CODE
    WHERE t0.MAX_ENROLLMENT = 12 ) SELECT ACTIVITY_TITLE, ENROLLMENT_TYPE, TERM_DESCRIPTION,
    SUBJECT_ID, MIN(CREATE_DATE) AS earliest_create_date FROM inner_cte GROUP BY ACTIVITY_TITLE,
    ENROLLMENT_TYPE, TERM_DESCRIPTION, SUBJECT_ID;
- category: IAP Activity and Academic Term Comprehensive Analysis
  default_granularity: one row per IAP activity with max enrollment 30
  desc: For IAP subject activities with a maximum enrollment of 30, show the activity
    title, enrollment type, prerequisites, term code, term description, term start
    date, term end date, the minimum term start date over each term code group, and
    the total number of such activities per term code. Do not return any rounded answers.
  id: dw_2858
  name: IAP Activities Max Enrollment 30 with Term Dates and Per-Term Activity Counts
  sql: WITH inner_cte AS ( SELECT t0.ACTIVITY_TITLE, t0.ENROLLMENT_TYPE, t0.PREREQUISITES,
    t0.TERM_CODE, t1.TERM_DESCRIPTION, t1.TERM_START_DATE, t1.TERM_END_DATE, min(t1.TERM_START_DATE)
    OVER (PARTITION BY t0.TERM_CODE ORDER BY t0.TERM_CODE) AS window_column FROM IAP_SUBJECT_DETAIL
    t0 JOIN ACADEMIC_TERMS_ALL t1 ON t0.TERM_CODE = t1.TERM_CODE WHERE t0.MAX_ENROLLMENT
    = 30 ) SELECT inner_cte.ACTIVITY_TITLE, inner_cte.ENROLLMENT_TYPE, inner_cte.PREREQUISITES,
    inner_cte.TERM_CODE, inner_cte.TERM_DESCRIPTION, inner_cte.TERM_START_DATE, inner_cte.TERM_END_DATE,
    inner_cte.window_column, term_counts.total_activities FROM inner_cte JOIN ( SELECT
    t0.TERM_CODE, COUNT(*) AS total_activities FROM IAP_SUBJECT_DETAIL t0 WHERE t0.MAX_ENROLLMENT
    = 30 GROUP BY t0.TERM_CODE ) term_counts ON inner_cte.TERM_CODE = term_counts.TERM_CODE
    ORDER BY inner_cte.TERM_CODE;
- category: Subject Offering and Course Catalog Comprehensive Analysis
  default_granularity: one row per 2012 subject matched with subject code
  desc: For subjects offered in the academic year 2012, show the subject key, subject
    title, offer department name, academic year, term description, the row number
    within each offer department name group ordered by subject key, the subject code,
    subject code description, department name, and the dense rank of each row partitioned
    by the school code and ordered by school code, for subjects where the school code
    is not null and the subject title is not null. Do not return any rounded answers.
  id: dw_3215
  name: 2012 Subjects Department Row Numbers with Subject Code School Dense Ranks
  sql: WITH Subquery1 AS ( SELECT t1.SUBJECT_KEY, t1.SUBJECT_TITLE, t1.OFFER_DEPT_NAME,
    t0.ACADEMIC_YEAR, t0.TERM_DESCRIPTION, ROW_NUMBER() OVER (PARTITION BY t1.OFFER_DEPT_NAME
    ORDER BY t1.SUBJECT_KEY) AS window_column FROM ACADEMIC_TERMS_ALL t0 JOIN SUBJECT_OFFERED
    t1 ON t0.TERM_CODE = t1.TERM_CODE WHERE t0.ACADEMIC_YEAR = 2012 ), Subquery2 AS
    ( SELECT t0.SUBJECT_CODE, t0.SUBJECT_CODE_DESC, t0.DEPARTMENT_NAME, t1.SUBJECT_TITLE,
    DENSE_RANK() OVER (PARTITION BY t0.SCHOOL_CODE ORDER BY t0.SCHOOL_CODE) AS window_column,
    t1.SUBJECT_ID FROM SIS_SUBJECT_CODE t0 JOIN CIS_COURSE_CATALOG t1 ON t0.DEPARTMENT_CODE
    = t1.DEPARTMENT_CODE WHERE t0.SCHOOL_CODE IS NOT NULL AND t1.SUBJECT_TITLE IS
    NOT NULL ) SELECT s1.SUBJECT_KEY, s1.SUBJECT_TITLE, s1.OFFER_DEPT_NAME, s1.ACADEMIC_YEAR,
    s1.TERM_DESCRIPTION, s1.window_column AS dept_row_number, s2.SUBJECT_CODE, s2.SUBJECT_CODE_DESC,
    s2.DEPARTMENT_NAME, s2.window_column AS school_dense_rank FROM Subquery1 s1 JOIN
    SUBJECT_OFFERED so ON s1.SUBJECT_KEY = so.SUBJECT_KEY JOIN Subquery2 s2 ON so.SUBJECT_TITLE
    = s2.SUBJECT_TITLE ORDER BY s1.OFFER_DEPT_NAME, s1.SUBJECT_KEY, s2.SUBJECT_CODE
- category: Textbook Material and Enrollment Comprehensive Analysis
  default_granularity: one row per subject per inclusion reason
  desc: List all subjects that are either offered in the term with code '2025FA' or
    are offered by departments in the School of Engineering with a total of at least
    6 units. For each subject, show the subject ID, subject title, department name,
    number of enrolled students, term description, academic year, term start date,
    term end date, term parameter, the minimum number of enrolled students over each
    offering department, the running sum of total units within each school, and the
    reason for inclusion ('2025FA Subjects' for subjects offered in the term '2025FA'
    and 'Engineering 6+ Units' for subjects offered by Engineering departments with
    at least 6 units), ordered by subject ID. Do not return any rounded answers.
  id: dw_3268
  name: Union of 2025FA Offered Subjects and Engineering 6+ Unit Subjects with Running
    Unit Sums
  sql: WITH Subquery1 AS ( SELECT t0.SUBJECT_ID, t0.SUBJECT_TITLE, t0.OFFER_DEPT_NAME,
    t0.NUM_ENROLLED_STUDENTS, t1.TERM_DESCRIPTION, t1.ACADEMIC_YEAR, t1.TERM_START_DATE,
    t1.TERM_END_DATE, t2.TERM_PARAMETER, min(t0.NUM_ENROLLED_STUDENTS) OVER (PARTITION
    BY t0.OFFER_DEPT_NAME ORDER BY t0.OFFER_DEPT_NAME) AS min_enrolled_students_per_dept,
    t0.OFFER_DEPT_CODE FROM TIP_SUBJECT_OFFERED t0 JOIN ACADEMIC_TERMS_ALL t1 ON t0.TERM_CODE
    = t1.TERM_CODE JOIN ACADEMIC_TERM_PARAMETER t2 ON t1.TERM_CODE = t2.TERM_CODE
    WHERE t0.TERM_CODE = '2025FA' ORDER BY t0.OFFER_DEPT_NAME ), Subquery2 AS ( SELECT
    t1.SUBJECT_ID, t1.SUBJECT_TITLE, t0.DEPARTMENT_NAME, SUM(t1.TOTAL_UNITS) OVER
    (PARTITION BY t0.SCHOOL_NAME ORDER BY t1.SUBJECT_ID) AS window_column, t1.OFFER_DEPT_CODE
    FROM SIS_DEPARTMENT t0 JOIN SUBJECT_OFFERED_SUMMARY t1 ON t0.DEPARTMENT_CODE =
    t1.OFFER_DEPT_CODE WHERE t0.SCHOOL_NAME = 'Engineering' AND t1.TOTAL_UNITS >=
    6 ), CombinedSubjects AS ( SELECT s1.SUBJECT_ID, s1.SUBJECT_TITLE, s1.OFFER_DEPT_NAME
    AS DEPARTMENT_NAME, s1.NUM_ENROLLED_STUDENTS, s1.TERM_DESCRIPTION, s1.ACADEMIC_YEAR,
    s1.TERM_START_DATE, s1.TERM_END_DATE, s1.TERM_PARAMETER, s1.min_enrolled_students_per_dept,
    NULL AS window_column, '2025FA Subjects' AS Reason FROM Subquery1 s1 UNION ALL
    SELECT s2.SUBJECT_ID, s2.SUBJECT_TITLE, s2.DEPARTMENT_NAME, NULL AS NUM_ENROLLED_STUDENTS,
    NULL AS TERM_DESCRIPTION, NULL AS ACADEMIC_YEAR, NULL AS TERM_START_DATE, NULL
    AS TERM_END_DATE, NULL AS TERM_PARAMETER, NULL AS min_enrolled_students_per_dept,
    s2.window_column, 'Engineering 6+ Units' AS Reason FROM Subquery2 s2 ) SELECT
    * FROM CombinedSubjects ORDER BY SUBJECT_ID;
- category: Subject Offering and Enrollment Comprehensive Analysis
  default_granularity: one row per subject per source subquery
  desc: 'List all subject titles that are either (a) offered in the term ''2022FA''
    with a total of 12 units, showing the subject title, department name from the
    course description, and the dense rank of each subject considering the current
    and 2 preceding rows ordered by the subject code from the course catalog, or (b)
    for each subject offered, show the subject title, subject ID, offer department
    name, offer school name, term description, academic year, and the maximum number
    of enrolled students for each subject considering the current row and the next
    2 rows ordered by subject key. The results should include all these columns in
    the following order: subject title, department name, window column, offer department
    name, offer school name, term description, academic year, and maximum number of
    enrolled students, with NULLs for columns not relevant to each case. Do not return
    any rounded answers.'
  id: dw_3277
  name: Union of 2022FA 12-Unit Subjects Dense Rank and Master Section 3-Row Max Enrollment
  sql: WITH Subq1 AS ( SELECT t0.SUBJECT_TITLE, t1.DEPARTMENT_NAME, dense_rank() OVER
    (ORDER BY t2.SUBJECT_CODE ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) AS window_column,
    t2.SUBJECT_ID FROM SUBJECT_OFFERED_SUMMARY t0 JOIN SIS_COURSE_DESCRIPTION t1 ON
    t0.COURSE_NUMBER = t1.COURSE JOIN COURSE_CATALOG_SUBJECT_OFFERED t2 ON t1.COURSE
    = t2.SUBJECT_CODE WHERE t2.TERM_CODE = '2022FA' AND t0.TOTAL_UNITS = 12 ), Subq2
    AS ( SELECT t1.SUBJECT_TITLE, t1.SUBJECT_ID, t1.OFFER_DEPT_NAME, t1.OFFER_SCHOOL_NAME,
    t0.TERM_DESCRIPTION, t0.ACADEMIC_YEAR, MAX(t1.NUM_ENROLLED_STUDENTS) OVER (ORDER
    BY t1.SUBJECT_KEY ROWS BETWEEN CURRENT ROW AND 2 FOLLOWING) AS max_enrolled_students
    FROM ACADEMIC_TERMS_ALL t0 JOIN SUBJECT_OFFERED t1 ON t0.TERM_CODE = t1.TERM_CODE
    WHERE t1.IS_MASTER_SECTION = 'Y' AND t0.TERM_STATUS_INDICATOR = 'P' ), CombinedSubjects
    AS ( SELECT s1.SUBJECT_TITLE, s1.DEPARTMENT_NAME, s1.window_column, NULL AS OFFER_DEPT_NAME,
    NULL AS OFFER_SCHOOL_NAME, NULL AS TERM_DESCRIPTION, NULL AS ACADEMIC_YEAR, NULL
    AS max_enrolled_students FROM Subq1 s1 UNION ALL SELECT s2.SUBJECT_TITLE, NULL
    AS DEPARTMENT_NAME, NULL AS window_column, s2.OFFER_DEPT_NAME, s2.OFFER_SCHOOL_NAME,
    s2.TERM_DESCRIPTION, s2.ACADEMIC_YEAR, s2.max_enrolled_students FROM Subq2 s2
    ) SELECT SUBJECT_TITLE, DEPARTMENT_NAME, window_column, OFFER_DEPT_NAME, OFFER_SCHOOL_NAME,
    TERM_DESCRIPTION, ACADEMIC_YEAR, max_enrolled_students FROM CombinedSubjects ORDER
    BY SUBJECT_TITLE;
- category: Textbook Material and Enrollment Comprehensive Analysis
  default_granularity: one row per subject matched between TIP material and master
    section scopes
  desc: 'For each subject offered in the same term as a TIP detail record with material
    status ''RQ'', show the subject key, subject title, offer department name, TIP
    material key, and the rank of each record within each offer department name group
    ordered by subject key, along with the subject title, subject ID, offer department
    name, offer school name, term description, academic year, and the maximum number
    of enrolled students for each subject considering the current row and the next
    2 rows ordered by subject key, where the subject, term, and offer department name
    match in both cases. List the columns in the following order: subject key, subject
    title, offer department name, TIP material key, rank, subject title (from the
    second subquery), subject ID, offer department name (from the second subquery),
    offer school name, term description, academic year, and the maximum number of
    enrolled students. Do not return any rounded answers.'
  id: dw_3398
  name: Required-Textbook Subjects Ranked per Department Matched with Master Section
    3-Row Max Enrollment
  sql: WITH Subq1 AS ( SELECT t0.SUBJECT_KEY, t0.SUBJECT_TITLE, t0.OFFER_DEPT_NAME,
    t1.TIP_MATERIAL_KEY, RANK() OVER (PARTITION BY t0.OFFER_DEPT_NAME ORDER BY t0.SUBJECT_KEY)
    AS window_column, t0.TERM_CODE, t0.SUBJECT_ID FROM SUBJECT_OFFERED t0 JOIN TIP_DETAIL
    t1 ON t0.TERM_CODE = t1.TERM_CODE WHERE t1.TIP_MATERIAL_STATUS_KEY = 'RQ' ), Subq2
    AS ( SELECT t1.SUBJECT_TITLE, t1.SUBJECT_ID, t1.OFFER_DEPT_NAME, t1.OFFER_SCHOOL_NAME,
    t0.TERM_DESCRIPTION, t0.ACADEMIC_YEAR, MAX(t1.NUM_ENROLLED_STUDENTS) OVER (ORDER
    BY t1.SUBJECT_KEY ROWS BETWEEN CURRENT ROW AND 2 FOLLOWING) AS max_enrolled_students,
    t1.TERM_CODE FROM ACADEMIC_TERMS_ALL t0 JOIN SUBJECT_OFFERED t1 ON t0.TERM_CODE
    = t1.TERM_CODE WHERE t1.IS_MASTER_SECTION = 'Y' AND t0.TERM_STATUS_INDICATOR =
    'P' ) SELECT s1.SUBJECT_KEY, s1.SUBJECT_TITLE, s1.OFFER_DEPT_NAME, s1.TIP_MATERIAL_KEY,
    s1.window_column, s2.SUBJECT_TITLE AS s2_SUBJECT_TITLE, s2.SUBJECT_ID, s2.OFFER_DEPT_NAME
    AS s2_OFFER_DEPT_NAME, s2.OFFER_SCHOOL_NAME, s2.TERM_DESCRIPTION, s2.ACADEMIC_YEAR,
    s2.max_enrolled_students FROM Subq1 s1 JOIN Subq2 s2 ON s1.SUBJECT_ID = s2.SUBJECT_ID
    AND s1.TERM_CODE = s2.TERM_CODE AND s1.OFFER_DEPT_NAME = s2.OFFER_DEPT_NAME ORDER
    BY s1.OFFER_DEPT_NAME, s1.SUBJECT_KEY;
- category: Library Reserve and IAP Activity Comprehensive Analysis
  default_granularity: one row per record from either library subject or IAP activity
    scope
  desc: 'List all subjects with at least 5 enrolled students, showing the subject
    ID, subject title, number of enrolled students, term code, material status key,
    ISBN, and the row number within each material status group ordered by subject
    ID, as well as all IAP subject activities with a maximum enrollment of 12, showing
    the subject ID, activity title, enrollment type, term description, and the rank
    of each record within each term description group ordered by activity title. Indicate
    the source of each record as either ''LibrarySubject'' or ''IAPActivity''. The
    columns should be: subject ID, subject title, number of enrolled students, term
    code, material status key, ISBN, window column, activity title, enrollment type,
    term description, and source. Do not return any rounded answers.'
  id: dw_3436
  name: Union of Library Subjects 5+ Enrolled and IAP Activities Max Enrollment 12
  sql: WITH Subquery1 AS ( SELECT t0.SUBJECT_ID, t0.SUBJECT_TITLE, t0.NUM_ENROLLED_STUDENTS,
    t0.TERM_CODE, t1.TIP_MATERIAL_STATUS_KEY, t1.ISBN, ROW_NUMBER() OVER (PARTITION
    BY t1.TIP_MATERIAL_STATUS_KEY ORDER BY t0.SUBJECT_ID) AS window_column FROM LIBRARY_SUBJECT_OFFERED
    t0 JOIN TIP_DETAIL t1 ON t0.SUBJECT_ID = t1.SUBJECT_ID WHERE t0.NUM_ENROLLED_STUDENTS
    >= 5 ), Subquery2 AS ( SELECT t0.ACTIVITY_TITLE, t0.ENROLLMENT_TYPE, t1.TERM_DESCRIPTION,
    t2.SUBJECT_ID, RANK() OVER (PARTITION BY t1.TERM_DESCRIPTION ORDER BY t0.ACTIVITY_TITLE)
    AS window_column FROM IAP_SUBJECT_DETAIL t0 JOIN ACADEMIC_TERMS_ALL t1 ON t0.TERM_CODE
    = t1.TERM_CODE JOIN TIP_DETAIL t2 ON t1.TERM_CODE = t2.TERM_CODE WHERE t0.MAX_ENROLLMENT
    = 12 ), CombinedResults AS ( SELECT s1.SUBJECT_ID, s1.SUBJECT_TITLE, s1.NUM_ENROLLED_STUDENTS,
    s1.TERM_CODE, s1.TIP_MATERIAL_STATUS_KEY, s1.ISBN, s1.window_column, NULL AS ACTIVITY_TITLE,
    NULL AS ENROLLMENT_TYPE, NULL AS TERM_DESCRIPTION, 'LibrarySubject' AS Source
    FROM Subquery1 s1 UNION ALL SELECT s2.SUBJECT_ID, NULL AS SUBJECT_TITLE, NULL
    AS NUM_ENROLLED_STUDENTS, NULL AS TERM_CODE, NULL AS TIP_MATERIAL_STATUS_KEY,
    NULL AS ISBN, s2.window_column, s2.ACTIVITY_TITLE, s2.ENROLLMENT_TYPE, s2.TERM_DESCRIPTION,
    'IAPActivity' AS Source FROM Subquery2 s2 ) SELECT * FROM CombinedResults ORDER
    BY SUBJECT_ID, Source;
- category: Textbook Material and Enrollment Comprehensive Analysis
  default_granularity: one row per subject per source term
  desc: List all subject IDs that are either offered in the term with code '2025FA'
    or are offered in the term '2016SP' by departments that grant degrees, along with
    the subject title, offering department name, number of enrolled students, term
    description, academic year, term start date, term end date, term parameter, the
    minimum number of enrolled students over each offering department, and the dense
    rank considering the current and 2 preceding rows ordered by the total number
    of units. For subjects from the term '2025FA', show the subject title, offering
    department name, number of enrolled students, term description, academic year,
    term start date, term end date, term parameter, and the minimum number of enrolled
    students over each offering department; for subjects from the term '2016SP' by
    degree-granting departments, show the dense rank as window_column. The results
    are ordered by subject ID. Do not return any rounded answers.
  id: dw_3498
  name: Union of 2025FA Offered Subjects and 2016SP Degree-Granting Department Subjects
    with Unit Dense Ranks
  sql: WITH Subq1 AS ( SELECT t0.SUBJECT_ID, t0.SUBJECT_TITLE, t0.OFFER_DEPT_NAME,
    t0.NUM_ENROLLED_STUDENTS, t1.TERM_DESCRIPTION, t1.ACADEMIC_YEAR, t1.TERM_START_DATE,
    t1.TERM_END_DATE, t2.TERM_PARAMETER, min(t0.NUM_ENROLLED_STUDENTS) OVER (PARTITION
    BY t0.OFFER_DEPT_NAME ORDER BY t0.OFFER_DEPT_NAME) AS min_enrolled_students_per_dept,
    t0.OFFER_DEPT_CODE FROM TIP_SUBJECT_OFFERED t0 JOIN ACADEMIC_TERMS_ALL t1 ON t0.TERM_CODE
    = t1.TERM_CODE JOIN ACADEMIC_TERM_PARAMETER t2 ON t1.TERM_CODE = t2.TERM_CODE
    WHERE t0.TERM_CODE = '2025FA' ORDER BY t0.OFFER_DEPT_NAME ), Subq2 AS ( SELECT
    t2.SUBJECT_ID, dense_rank() OVER (ORDER BY t2.TOTAL_UNITS ROWS BETWEEN 2 PRECEDING
    AND CURRENT ROW) window_column, t2.OFFER_DEPT_CODE FROM SIS_COURSE_DESCRIPTION
    t0 JOIN SIS_DEPARTMENT t1 ON t0.DEPARTMENT = t1.DEPARTMENT_CODE JOIN SUBJECT_OFFERED_SUMMARY
    t2 ON t1.DEPARTMENT_CODE = t2.OFFER_DEPT_CODE WHERE t2.TERM_CODE = '2016SP' AND
    t1.IS_DEGREE_GRANTING = 'Y' ), CombinedSubjects AS ( SELECT s1.SUBJECT_ID, s1.SUBJECT_TITLE,
    s1.OFFER_DEPT_NAME, s1.NUM_ENROLLED_STUDENTS, s1.TERM_DESCRIPTION, s1.ACADEMIC_YEAR,
    s1.TERM_START_DATE, s1.TERM_END_DATE, s1.TERM_PARAMETER, s1.min_enrolled_students_per_dept,
    NULL AS window_column FROM Subq1 s1 UNION ALL SELECT s2.SUBJECT_ID, NULL AS SUBJECT_TITLE,
    NULL AS OFFER_DEPT_NAME, NULL AS NUM_ENROLLED_STUDENTS, NULL AS TERM_DESCRIPTION,
    NULL AS ACADEMIC_YEAR, NULL AS TERM_START_DATE, NULL AS TERM_END_DATE, NULL AS
    TERM_PARAMETER, NULL AS min_enrolled_students_per_dept, s2.window_column FROM
    Subq2 s2 ) SELECT SUBJECT_ID, SUBJECT_TITLE, OFFER_DEPT_NAME, NUM_ENROLLED_STUDENTS,
    TERM_DESCRIPTION, ACADEMIC_YEAR, TERM_START_DATE, TERM_END_DATE, TERM_PARAMETER,
    min_enrolled_students_per_dept, window_column FROM CombinedSubjects ORDER BY SUBJECT_ID;
- category: Textbook Material and Enrollment Comprehensive Analysis
  default_granularity: one row per 2025FA Engineering subject
  desc: For subjects offered in the term with code '2025FA' by departments in the
    School of Engineering, show the subject ID, subject title, offering department
    name, number of enrolled students, term description, academic year, term start
    date, term end date, term parameter, the minimum number of enrolled students over
    each offering department, total units, department full name, and assign row numbers
    within a window of 2 preceding and 1 following rows ordered by subject title,
    ordered by offering department name and subject title. Do not return any rounded
    answers.
  id: dw_3684
  name: 2025FA Engineering Subjects Enrollment Windows with Catalog Unit Row Numbers
  sql: WITH Subq1 AS ( SELECT t0.SUBJECT_ID, t0.SUBJECT_TITLE, t0.OFFER_DEPT_NAME,
    t0.NUM_ENROLLED_STUDENTS, t1.TERM_DESCRIPTION, t1.ACADEMIC_YEAR, t1.TERM_START_DATE,
    t1.TERM_END_DATE, t2.TERM_PARAMETER, min(t0.NUM_ENROLLED_STUDENTS) OVER (PARTITION
    BY t0.OFFER_DEPT_NAME ORDER BY t0.OFFER_DEPT_NAME) AS min_enrolled_students_per_dept,
    t0.OFFER_DEPT_CODE FROM TIP_SUBJECT_OFFERED t0 JOIN ACADEMIC_TERMS_ALL t1 ON t0.TERM_CODE
    = t1.TERM_CODE JOIN ACADEMIC_TERM_PARAMETER t2 ON t1.TERM_CODE = t2.TERM_CODE
    WHERE t0.TERM_CODE = '2025FA' ORDER BY t0.OFFER_DEPT_NAME ), Subq2 AS ( SELECT
    t1.SUBJECT_TITLE, t1.TOTAL_UNITS, t0.DEPARTMENT_FULL_NAME, ROW_NUMBER() OVER (ORDER
    BY t1.SUBJECT_TITLE ROWS BETWEEN 2 PRECEDING AND 1 FOLLOWING) AS window_column,
    t1.DEPARTMENT_CODE FROM SIS_DEPARTMENT t0 JOIN COURSE_CATALOG_SUBJECT_OFFERED
    t1 ON t0.DEPARTMENT_CODE = t1.DEPARTMENT_CODE WHERE t0.SCHOOL_NAME = 'Engineering'
    ) SELECT s1.SUBJECT_ID, s1.SUBJECT_TITLE, s1.OFFER_DEPT_NAME, s1.NUM_ENROLLED_STUDENTS,
    s1.TERM_DESCRIPTION, s1.ACADEMIC_YEAR, s1.TERM_START_DATE, s1.TERM_END_DATE, s1.TERM_PARAMETER,
    s1.min_enrolled_students_per_dept, s2.TOTAL_UNITS, s2.DEPARTMENT_FULL_NAME, s2.window_column
    FROM Subq1 s1 JOIN Subq2 s2 ON s1.OFFER_DEPT_CODE = s2.DEPARTMENT_CODE AND s1.SUBJECT_TITLE
    = s2.SUBJECT_TITLE ORDER BY s1.OFFER_DEPT_NAME, s1.SUBJECT_TITLE
- category: Subject Offering and Course Catalog Comprehensive Analysis
  default_granularity: one row per 2017FA subject matched with 2022SU subject
  desc: For subject offerings in the term '2017FA' with a total number of units greater
    than 10, display the subject title, department name, school name, and their dense
    rank considering the current and 2 preceding rows ordered by the department code
    from the subject code table, along with any matching subject IDs from subjects
    offered in the term with code '2022SU', their department names, and their dense
    rank considering the current and 2 preceding rows ordered by the total number
    of units. Show the subject title, department name, school name, subq1 dense rank,
    subject ID, subq2 department name, and subq2 dense rank, in that order. Do not
    return any rounded answers.
  id: dw_3861
  name: 2017FA High-Unit Subjects Dense Rank Matched with 2022SU Unit Dense Ranks
  sql: WITH subq1 AS ( WITH inner_cte AS ( SELECT t2.SUBJECT_TITLE, t1.DEPARTMENT_NAME,
    dense_rank() OVER (ORDER BY t0.DEPARTMENT_CODE ROWS BETWEEN 2 PRECEDING AND CURRENT
    ROW) AS window_column, t2.COURSE_NUMBER FROM SIS_SUBJECT_CODE t0 JOIN SIS_COURSE_DESCRIPTION
    t1 ON t0.SUBJECT_CODE = t1.COURSE JOIN SUBJECT_OFFERED_SUMMARY t2 ON t1.COURSE
    = t2.COURSE_NUMBER WHERE t2.TERM_CODE = '2017FA' AND t2.TOTAL_UNITS > 10 ) SELECT
    inner_cte.SUBJECT_TITLE, inner_cte.DEPARTMENT_NAME, t0.SCHOOL_NAME, inner_cte.window_column,
    inner_cte.COURSE_NUMBER FROM inner_cte JOIN SIS_SUBJECT_CODE t0 ON inner_cte.COURSE_NUMBER
    = t0.COURSE_NUMBER ), subq2 AS ( WITH inner_cte AS ( SELECT t1.SUBJECT_ID, t1.DEPARTMENT_NAME,
    t1.TOTAL_UNITS, dense_rank() OVER (ORDER BY t1.TOTAL_UNITS ROWS BETWEEN 2 PRECEDING
    AND CURRENT ROW) AS window_column FROM ACADEMIC_TERMS_ALL t0 JOIN COURSE_CATALOG_SUBJECT_OFFERED
    t1 ON t0.TERM_CODE = t1.TERM_CODE WHERE t0.TERM_CODE = '2022SU' ) SELECT inner_cte.SUBJECT_ID,
    inner_cte.DEPARTMENT_NAME, inner_cte.window_column FROM inner_cte ORDER BY inner_cte.window_column,
    inner_cte.SUBJECT_ID ) SELECT subq1.SUBJECT_TITLE, subq1.DEPARTMENT_NAME, subq1.SCHOOL_NAME,
    subq1.window_column AS subq1_dense_rank, subq2.SUBJECT_ID, subq2.DEPARTMENT_NAME
    AS subq2_DEPARTMENT_NAME, subq2.window_column AS subq2_dense_rank FROM subq1 LEFT
    JOIN COURSE_CATALOG_SUBJECT_OFFERED cso ON subq1.COURSE_NUMBER = cso.SUBJECT_CODE
    LEFT JOIN subq2 ON cso.SUBJECT_ID = subq2.SUBJECT_ID ORDER BY subq1.window_column
    DESC, subq1.SUBJECT_TITLE, subq2.window_column, subq2.SUBJECT_ID;
- category: Subject Offering and Course Catalog Comprehensive Analysis
  default_granularity: one row per subject code matched with 2022FA subject
  desc: For each subject in a department where the school code and subject title are
    not null, and for each subject offered in the 2022FA term with total units greater
    than the average for that term, display the subject code, subject code description,
    department name, subject title, the number of subjects in the same department,
    the subject ID, the term description, and the running sum of total units for that
    academic year, ordered by subject ID. Do not return any rounded answers.
  id: dw_3867
  name: Subject Code Department Counts Matched with 2022FA Above-Average Unit Running
    Sums
  sql: WITH subq1 AS ( WITH inner_cte AS ( SELECT t0.SUBJECT_CODE, t0.SUBJECT_CODE_DESC,
    t0.DEPARTMENT_NAME, t1.SUBJECT_TITLE, t0.DEPARTMENT_CODE FROM SIS_SUBJECT_CODE
    t0 JOIN CIS_COURSE_CATALOG t1 ON t0.DEPARTMENT_CODE = t1.DEPARTMENT_CODE WHERE
    t0.SCHOOL_CODE IS NOT NULL AND t1.SUBJECT_TITLE IS NOT NULL ) SELECT inner_cte.SUBJECT_CODE,
    inner_cte.SUBJECT_CODE_DESC, inner_cte.DEPARTMENT_NAME, inner_cte.SUBJECT_TITLE,
    dept_counts.subjects_in_department, inner_cte.DEPARTMENT_CODE FROM inner_cte JOIN
    ( SELECT t0.DEPARTMENT_CODE, COUNT(*) AS subjects_in_department FROM SIS_SUBJECT_CODE
    t0 JOIN CIS_COURSE_CATALOG t1 ON t0.DEPARTMENT_CODE = t1.DEPARTMENT_CODE WHERE
    t0.SCHOOL_CODE IS NOT NULL AND t1.SUBJECT_TITLE IS NOT NULL GROUP BY t0.DEPARTMENT_CODE
    ) dept_counts ON inner_cte.DEPARTMENT_CODE = dept_counts.DEPARTMENT_CODE ), subq2
    AS ( WITH inner_cte AS ( SELECT t1.SUBJECT_ID, t1.DEPARTMENT_NAME, t0.TERM_DESCRIPTION,
    t1.ACADEMIC_YEAR, t1.TOTAL_UNITS FROM ACADEMIC_TERMS_ALL t0 JOIN COURSE_CATALOG_SUBJECT_OFFERED
    t1 ON t0.TERM_CODE = t1.TERM_CODE WHERE t1.TERM_CODE = '2022FA' ) SELECT SUBJECT_ID,
    DEPARTMENT_NAME, TERM_DESCRIPTION, SUM(TOTAL_UNITS) OVER (PARTITION BY ACADEMIC_YEAR
    ORDER BY SUBJECT_ID) AS window_column, ACADEMIC_YEAR, TOTAL_UNITS FROM inner_cte
    WHERE TOTAL_UNITS > ( SELECT AVG(TOTAL_UNITS) FROM COURSE_CATALOG_SUBJECT_OFFERED
    WHERE TERM_CODE = '2022FA' ) ORDER BY SUBJECT_ID ) SELECT subq1.SUBJECT_CODE,
    subq1.SUBJECT_CODE_DESC, subq1.DEPARTMENT_NAME, subq1.SUBJECT_TITLE, subq1.subjects_in_department,
    subq2.SUBJECT_ID, subq2.TERM_DESCRIPTION, subq2.window_column FROM subq1 JOIN
    CIS_COURSE_CATALOG ccc ON subq1.DEPARTMENT_CODE = ccc.DEPARTMENT_CODE JOIN subq2
    ON ccc.SUBJECT_ID = subq2.SUBJECT_ID ORDER BY subq2.SUBJECT_ID;
- category: Course Catalog and Department Analysis
  default_granularity: one row per school per description status plus rollup totals
    matched with 2022SU subjects
  desc: For each subject code where the department is degree granting, show the subject
    code, subject code description, department name (from subject code), school name,
    the number of subject codes per school name and whether the subject code description
    is present ('Has Description') or missing ('No Description'), and for each matching
    department in subjects offered in the term with code '2022SU', show the subject's
    ID, total units, department name (from subject offered), and their dense rank
    considering the current and 2 preceding rows ordered by the total number of units.
    For each school name, include a grand total for all subject codes in the format
    of (null, null, null, school name, null, total subject codes, null, null, null,
    null). Do not return any rounded answers.
  id: dw_3904
  name: Degree-Granting Subject Code Description Status Rollup by School with 2022SU
    Unit Dense Ranks
  sql: WITH inner_cte1 AS ( SELECT t1.SUBJECT_CODE, t1.SUBJECT_CODE_DESC, t0.DEPARTMENT_NAME,
    t1.SCHOOL_NAME FROM SIS_DEPARTMENT t0 JOIN SIS_SUBJECT_CODE t1 ON t0.SCHOOL_CODE
    = t1.SCHOOL_CODE WHERE t0.IS_DEGREE_GRANTING = 'Y' ), SubjectCodeVisibility AS
    ( SELECT SUBJECT_CODE, SUBJECT_CODE_DESC, DEPARTMENT_NAME, SCHOOL_NAME, CASE WHEN
    SUBJECT_CODE_DESC IS NOT NULL AND SUBJECT_CODE_DESC <> 'nan' THEN 'Has Description'
    ELSE 'No Description' END AS description_status FROM inner_cte1 ), RollupResults
    AS ( SELECT SCHOOL_NAME, description_status, COUNT(*) AS total_subject_codes FROM
    SubjectCodeVisibility GROUP BY SCHOOL_NAME, description_status WITH ROLLUP HAVING
    COUNT(*) > 0 ), inner_cte2 AS ( SELECT t1.SUBJECT_ID, t1.TOTAL_UNITS, t1.DEPARTMENT_NAME,
    dense_rank() OVER (ORDER BY t1.TOTAL_UNITS ROWS BETWEEN 2 PRECEDING AND CURRENT
    ROW) AS window_column FROM ACADEMIC_TERMS_ALL t0 JOIN COURSE_CATALOG_SUBJECT_OFFERED
    t1 ON t0.TERM_CODE = t1.TERM_CODE WHERE t0.TERM_CODE = '2022SU' ) SELECT scv.SUBJECT_CODE,
    scv.SUBJECT_CODE_DESC, scv.DEPARTMENT_NAME AS SCV_DEPARTMENT_NAME, rr.SCHOOL_NAME,
    rr.description_status, rr.total_subject_codes, ic2.SUBJECT_ID, ic2.TOTAL_UNITS,
    ic2.DEPARTMENT_NAME AS IC2_DEPARTMENT_NAME, ic2.window_column FROM RollupResults
    rr LEFT JOIN ( SELECT DISTINCT SUBJECT_CODE, SUBJECT_CODE_DESC, DEPARTMENT_NAME,
    SCHOOL_NAME, description_status FROM SubjectCodeVisibility ) scv ON rr.SCHOOL_NAME
    = scv.SCHOOL_NAME AND rr.description_status = scv.description_status LEFT JOIN
    inner_cte2 ic2 ON scv.DEPARTMENT_NAME = ic2.DEPARTMENT_NAME ORDER BY rr.SCHOOL_NAME,
    rr.description_status, ic2.TOTAL_UNITS DESC
- category: Textbook Material and Enrollment Comprehensive Analysis
  default_granularity: one row per term per subject matched between material and enrollment
    scopes
  desc: List the term code, subject ID, minimum record count from TIP_DETAIL, total
    new shelf price from TIP_MATERIAL, academic year, number of enrolled students,
    and deviation from the average number of enrolled students for that academic year,
    for each term and subject where the material has a non-null author and a material
    info source of 'ISBN', and considering only terms that are not the current term.
    Do not return any rounded answers.
  id: dw_3973
  name: ISBN-Sourced Textbook Material Prices with Non-Current Term Enrollment Deviations
  sql: WITH Subq1 AS ( WITH inner_cte AS ( SELECT td.TERM_CODE, td.SUBJECT_ID, MIN(td.RECORD_COUNT)
    AS min_record_count, SUM(tm.NEW_SHELF_PRICE) AS total_new_shelf_price FROM TIP_DETAIL
    td JOIN TIP_MATERIAL tm ON td.TIP_MATERIAL_KEY = tm.TIP_MATERIAL_KEY WHERE tm.AUTHOR
    IS NOT NULL AND tm.MATERIAL_INFO_SOURCE = 'ISBN' GROUP BY td.TERM_CODE, td.SUBJECT_ID
    ) SELECT inner_cte.TERM_CODE, inner_cte.SUBJECT_ID, inner_cte.min_record_count,
    inner_cte.total_new_shelf_price FROM inner_cte ), Subq2 AS ( WITH inner_cte AS
    ( SELECT ACADEMIC_TERMS_ALL.ACADEMIC_YEAR_DESC, TIP_SUBJECT_OFFERED.SUBJECT_ID,
    TIP_SUBJECT_OFFERED.NUM_ENROLLED_STUDENTS FROM TIP_SUBJECT_OFFERED JOIN ACADEMIC_TERMS_ALL
    ON TIP_SUBJECT_OFFERED.TERM_CODE = ACADEMIC_TERMS_ALL.TERM_CODE JOIN ACADEMIC_TERM_PARAMETER
    ON ACADEMIC_TERMS_ALL.TERM_CODE = ACADEMIC_TERM_PARAMETER.TERM_CODE WHERE ACADEMIC_TERM_PARAMETER.IS_CURRENT_TERM
    = 'N' ) SELECT inner_cte.SUBJECT_ID, inner_cte.ACADEMIC_YEAR_DESC, inner_cte.NUM_ENROLLED_STUDENTS,
    (inner_cte.NUM_ENROLLED_STUDENTS - avg_stats.avg_enrolled) AS deviation_from_avg
    FROM inner_cte JOIN ( SELECT ACADEMIC_YEAR_DESC, AVG(NUM_ENROLLED_STUDENTS) AS
    avg_enrolled FROM inner_cte GROUP BY ACADEMIC_YEAR_DESC ) avg_stats ON inner_cte.ACADEMIC_YEAR_DESC
    = avg_stats.ACADEMIC_YEAR_DESC ), CombinedResults AS ( SELECT s1.TERM_CODE, s1.SUBJECT_ID,
    s1.min_record_count, s1.total_new_shelf_price, s2.ACADEMIC_YEAR_DESC, s2.NUM_ENROLLED_STUDENTS,
    s2.deviation_from_avg FROM Subq1 s1 JOIN Subq2 s2 ON s1.SUBJECT_ID = s2.SUBJECT_ID
    ) SELECT * FROM CombinedResults ORDER BY TERM_CODE, SUBJECT_ID, ACADEMIC_YEAR_DESC;
- category: Enrollment Analysis
  default_granularity: one row per department per 2012 subject matched with 2012SU
    enrollment statistics
  desc: For each department, show the offer department name, the number of distinct
    subjects offered by the department in the academic year 2012, and for each subject
    that was offered in the term "2012SU", display the subject key, subject title,
    academic year, term description, subject enrollment number, subject offered summary
    key, the average subject enrollment number within each subject key group, and
    the deviation of each subject's enrollment number from the average enrollment
    number for its subject key group, ordered by offer department name and subject
    key. Do not return any rounded answers.
  id: dw_4184
  name: 2012 Department Subject Counts with 2012SU Enrollment Averages and Deviations
    per Subject Key
  sql: WITH subq1 AS ( WITH inner_cte AS ( SELECT t1.SUBJECT_KEY, t1.SUBJECT_TITLE,
    t1.OFFER_DEPT_NAME, t0.ACADEMIC_YEAR, t0.TERM_DESCRIPTION FROM ACADEMIC_TERMS_ALL
    t0 JOIN SUBJECT_OFFERED t1 ON t0.TERM_CODE = t1.TERM_CODE WHERE t0.ACADEMIC_YEAR
    = 2012 ) SELECT ic.OFFER_DEPT_NAME, dept_counts.num_subjects, ic.SUBJECT_KEY,
    ic.SUBJECT_TITLE, ic.ACADEMIC_YEAR, ic.TERM_DESCRIPTION FROM inner_cte ic JOIN
    ( SELECT OFFER_DEPT_NAME, COUNT(DISTINCT SUBJECT_KEY) AS num_subjects FROM inner_cte
    GROUP BY OFFER_DEPT_NAME ) dept_counts ON ic.OFFER_DEPT_NAME = dept_counts.OFFER_DEPT_NAME
    ), subq2 AS ( WITH inner_cte AS ( SELECT t0.SUBJECT_TITLE, t0.SUBJECT_KEY, t0.OFFER_DEPT_NAME,
    t0.SUBJECT_ENROLLMENT_NUMBER, t0.SUBJECT_OFFERED_SUMMARY_KEY, AVG(t0.SUBJECT_ENROLLMENT_NUMBER)
    OVER (PARTITION BY t0.SUBJECT_KEY ORDER BY t0.OFFER_DEPT_NAME) AS window_column
    FROM SUBJECT_OFFERED t0 JOIN SUBJECT_OFFERED_SUMMARY t1 ON t0.TERM_CODE = t1.TERM_CODE
    WHERE t0.TERM_CODE = '2012SU' ) SELECT inner_cte.SUBJECT_TITLE, inner_cte.SUBJECT_KEY,
    inner_cte.OFFER_DEPT_NAME, inner_cte.SUBJECT_ENROLLMENT_NUMBER, inner_cte.SUBJECT_OFFERED_SUMMARY_KEY,
    inner_cte.window_column AS avg_enrollment_number, (inner_cte.SUBJECT_ENROLLMENT_NUMBER
    - inner_cte.window_column) AS deviation_from_avg FROM inner_cte ) SELECT s1.OFFER_DEPT_NAME,
    s1.num_subjects, s1.SUBJECT_KEY, s1.SUBJECT_TITLE, s1.ACADEMIC_YEAR, s1.TERM_DESCRIPTION,
    s2.SUBJECT_ENROLLMENT_NUMBER, s2.SUBJECT_OFFERED_SUMMARY_KEY, s2.avg_enrollment_number,
    s2.deviation_from_avg FROM subq1 s1 JOIN subq2 s2 ON s1.SUBJECT_KEY = s2.SUBJECT_KEY
    AND s1.OFFER_DEPT_NAME = s2.OFFER_DEPT_NAME AND s1.SUBJECT_TITLE = s2.SUBJECT_TITLE
    ORDER BY s1.OFFER_DEPT_NAME, s1.SUBJECT_KEY
- category: Enrollment Analysis
  default_granularity: one row per 2012SU cluster-S subject
  desc: 'For each subject offered in the term with term code ''2012SU'' that also
    has a cluster type of ''S'', show the subject title, offer department name, offer
    school name, cluster type description, the difference between the number of enrolled
    students for that subject and the average number of enrolled students for all
    subjects in the same department in that term, the dense rank of each subject considering
    the current and 2 preceding rows ordered by the number of enrolled students, and
    the deviation of the number of enrolled students from the average number of enrolled
    students for that department in that term as calculated from the summary table.
    The columns should be shown in the following order: subject title, offer department
    name, offer school name, cluster type description, deviation from department average
    (from the first calculation), window column (dense rank), and deviation from department
    average (from the summary calculation). Do not return any rounded answers.'
  id: dw_4197
  name: 2012SU Cluster-S Subjects Enrollment Deviations from Department Averages with
    Dense Ranks
  sql: WITH subq1 AS ( WITH inner_cte AS ( SELECT t1.SUBJECT_TITLE, t1.OFFER_DEPT_NAME,
    t1.OFFER_SCHOOL_NAME, t1.CLUSTER_TYPE_DESC, t1.NUM_ENROLLED_STUDENTS, t1.OFFER_DEPT_CODE
    FROM ACADEMIC_TERMS_ALL t0 JOIN SUBJECT_OFFERED t1 ON t0.TERM_CODE = t1.TERM_CODE
    WHERE t1.TERM_CODE = '2012SU' ), dept_avg AS ( SELECT OFFER_DEPT_CODE, AVG(NUM_ENROLLED_STUDENTS)
    AS avg_enrolled FROM SUBJECT_OFFERED WHERE TERM_CODE = '2012SU' GROUP BY OFFER_DEPT_CODE
    ) SELECT i.SUBJECT_TITLE, i.OFFER_DEPT_NAME, i.OFFER_SCHOOL_NAME, i.CLUSTER_TYPE_DESC,
    (i.NUM_ENROLLED_STUDENTS - d.avg_enrolled) AS deviation_from_dept_avg, i.OFFER_DEPT_CODE
    FROM inner_cte i JOIN dept_avg d ON i.OFFER_DEPT_CODE = d.OFFER_DEPT_CODE ), subq2
    AS ( WITH inner_cte AS ( SELECT t2.SUBJECT_TITLE, t1.NUM_ENROLLED_STUDENTS, t1.OFFER_DEPT_CODE,
    t1.TERM_CODE FROM SUBJECT_OFFERED_SUMMARY t0 JOIN SUBJECT_OFFERED t1 ON t0.SUBJECT_ID_SORT
    = t1.SUBJECT_ID_SORT JOIN SUBJECT_SUMMARY t2 ON t1.SUBJECT_ID_SORT = t2.SUBJECT_ID_SORT
    WHERE t1.TERM_CODE = '2012SU' AND t0.CLUSTER_TYPE = 'S' ), dept_avg AS ( SELECT
    OFFER_DEPT_CODE, TERM_CODE, AVG(NUM_ENROLLED_STUDENTS) AS avg_enrolled FROM SUBJECT_OFFERED
    WHERE TERM_CODE = '2012SU' GROUP BY OFFER_DEPT_CODE, TERM_CODE ) SELECT i.SUBJECT_TITLE,
    dense_rank() OVER (ORDER BY i.NUM_ENROLLED_STUDENTS ROWS BETWEEN 2 PRECEDING AND
    CURRENT ROW) AS window_column, (i.NUM_ENROLLED_STUDENTS - d.avg_enrolled) AS deviation_from_dept_avg,
    i.OFFER_DEPT_CODE FROM inner_cte i JOIN dept_avg d ON i.OFFER_DEPT_CODE = d.OFFER_DEPT_CODE
    AND i.TERM_CODE = d.TERM_CODE ) SELECT s1.SUBJECT_TITLE, s1.OFFER_DEPT_NAME, s1.OFFER_SCHOOL_NAME,
    s1.CLUSTER_TYPE_DESC, s1.deviation_from_dept_avg, s2.window_column, s2.deviation_from_dept_avg
    AS s2_deviation_from_dept_avg FROM subq1 s1 JOIN subq2 s2 ON s1.SUBJECT_TITLE
    = s2.SUBJECT_TITLE AND s1.OFFER_DEPT_CODE = s2.OFFER_DEPT_CODE
- category: IAP Activity and Subject Offering Comprehensive Analysis
  default_granularity: one row per Mathematics IAP activity per academic year per
    department
  desc: For IAP subjects in the "Mathematics" category, show the activity title, enrollment
    type, maximum enrollment, category name, activity description, and the row number
    within each enrollment type group ordered by activity title, along with the academic
    year, department name, average enrollment, enrollment variance, department phone
    number, and school name for each academic year and department where the IAP subject's
    term matches a department's fall term subject offering with more than 0 enrolled
    students. Do not return any rounded answers.
  id: dw_4229
  name: Mathematics IAP Category Activities Matched with Fall-Term Department Enrollment
    Statistics
  sql: WITH inner_cte1 AS ( SELECT d.ACTIVITY_TITLE, d.ENROLLMENT_TYPE, d.MAX_ENROLLMENT,
    c.IAP_CATEGORY_NAME, ROW_NUMBER() OVER (PARTITION BY d.ENROLLMENT_TYPE ORDER BY
    d.ACTIVITY_TITLE) AS window_column, d.TERM_CODE FROM IAP_SUBJECT_DETAIL d JOIN
    IAP_SUBJECT_CATEGORY c ON d.IAP_SUBJECT_CATEGORY_KEY = c.IAP_SUBJECT_CATEGORY_KEY
    WHERE c.IAP_CATEGORY_NAME = 'Mathematics' ), subq1 AS ( SELECT inner_cte1.ACTIVITY_TITLE,
    inner_cte1.ENROLLMENT_TYPE, inner_cte1.MAX_ENROLLMENT, inner_cte1.IAP_CATEGORY_NAME,
    d.ACTIVITY_DESCRIPTION, inner_cte1.window_column, inner_cte1.TERM_CODE FROM inner_cte1
    JOIN IAP_SUBJECT_DETAIL d ON inner_cte1.ACTIVITY_TITLE = d.ACTIVITY_TITLE AND
    inner_cte1.ENROLLMENT_TYPE = d.ENROLLMENT_TYPE ), inner_cte2 AS ( SELECT ACADEMIC_TERMS_ALL.ACADEMIC_YEAR,
    COURSE_CATALOG_SUBJECT_OFFERED.DEPARTMENT_NAME, TIP_SUBJECT_OFFERED.NUM_ENROLLED_STUDENTS,
    COURSE_CATALOG_SUBJECT_OFFERED.TERM_CODE FROM COURSE_CATALOG_SUBJECT_OFFERED JOIN
    ACADEMIC_TERMS_ALL ON COURSE_CATALOG_SUBJECT_OFFERED.TERM_CODE = ACADEMIC_TERMS_ALL.TERM_CODE
    JOIN TIP_SUBJECT_OFFERED ON ACADEMIC_TERMS_ALL.TERM_CODE = TIP_SUBJECT_OFFERED.TERM_CODE
    WHERE COURSE_CATALOG_SUBJECT_OFFERED.IS_OFFERED_FALL_TERM = 'Y' AND TIP_SUBJECT_OFFERED.NUM_ENROLLED_STUDENTS
    > 0 ), subq2 AS ( SELECT inner_cte2.ACADEMIC_YEAR, inner_cte2.DEPARTMENT_NAME,
    AVG(inner_cte2.NUM_ENROLLED_STUDENTS) AS avg_enrollment, VARIANCE(inner_cte2.NUM_ENROLLED_STUDENTS)
    AS enrollment_variance, ad.DEPARTMENT_PHONE_NUMBER AS department_phone, sd.SCHOOL_NAME
    AS school_name, inner_cte2.TERM_CODE FROM inner_cte2 LEFT JOIN SIS_DEPARTMENT
    sd ON inner_cte2.DEPARTMENT_NAME = sd.DEPARTMENT_NAME LEFT JOIN SIS_ADMIN_DEPARTMENT
    ad ON sd.DEPARTMENT_CODE = ad.SIS_ADMIN_DEPARTMENT_CODE GROUP BY inner_cte2.ACADEMIC_YEAR,
    inner_cte2.DEPARTMENT_NAME, ad.DEPARTMENT_PHONE_NUMBER, sd.SCHOOL_NAME, inner_cte2.TERM_CODE
    ) SELECT s1.ACTIVITY_TITLE, s1.ENROLLMENT_TYPE, s1.MAX_ENROLLMENT, s1.IAP_CATEGORY_NAME,
    s1.ACTIVITY_DESCRIPTION, s1.window_column, s2.ACADEMIC_YEAR, s2.DEPARTMENT_NAME,
    s2.avg_enrollment, s2.enrollment_variance, s2.department_phone, s2.school_name
    FROM subq1 s1 JOIN subq2 s2 ON s1.TERM_CODE = s2.TERM_CODE ORDER BY s1.ACTIVITY_TITLE,
    s2.ACADEMIC_YEAR, s2.DEPARTMENT_NAME
- category: Subject Offering and Textbook Material Comprehensive Analysis
  default_granularity: one row per current-term subject matched with 2016SP degree-granting
    department summary
  desc: 'For each department that both offered subjects in the current SIS term and
    is a degree-granting department that offered subjects in the term ''2016SP'',
    list the department code, offering department name, subject title, responsible
    faculty name, term description, academic year description, total number of subjects
    offered per department in the current term, department name, number of subjects
    offered in 2016SP, and total units for those subjects in 2016SP. Include all columns
    in the order: department code, offering department name, subject title, responsible
    faculty name, term description, academic year description, total number of subjects
    offered per department in the current term, department name, number of subjects
    offered in 2016SP, and total units for those subjects in 2016SP. Do not return
    any rounded answers.'
  id: dw_4231
  name: Current SIS Term Department Subjects Matched with 2016SP Degree-Granting Department
    Unit Totals
  sql: WITH subq1 AS ( WITH inner_cte AS ( SELECT t0.SUBJECT_TITLE, t0.OFFER_DEPT_NAME,
    t0.RESPONSIBLE_FACULTY_NAME, t1.TERM_DESCRIPTION, t1.ACADEMIC_YEAR_DESC, t0.OFFER_DEPT_CODE,
    MIN(t0.NUM_ENROLLED_STUDENTS) OVER (ORDER BY t1.ACADEMIC_YEAR ROWS BETWEEN 3 PRECEDING
    AND 1 FOLLOWING) AS window_column FROM TIP_SUBJECT_OFFERED t0 JOIN ACADEMIC_TERMS_ALL
    t1 ON t0.TERM_CODE = t1.TERM_CODE JOIN ACADEMIC_TERM_PARAMETER t2 ON t1.TERM_CODE
    = t2.TERM_CODE WHERE t2.TERM_PARAMETER = 'SIS_CURRENT_TERM' ) SELECT inner_cte.OFFER_DEPT_NAME,
    inner_cte.SUBJECT_TITLE, inner_cte.RESPONSIBLE_FACULTY_NAME, inner_cte.TERM_DESCRIPTION,
    inner_cte.ACADEMIC_YEAR_DESC, dept_counts.Total_Subjects, inner_cte.OFFER_DEPT_CODE
    FROM inner_cte JOIN ( SELECT t0.OFFER_DEPT_NAME, t0.OFFER_DEPT_CODE, COUNT(DISTINCT
    t0.SUBJECT_TITLE) AS Total_Subjects FROM TIP_SUBJECT_OFFERED t0 JOIN ACADEMIC_TERMS_ALL
    t1 ON t0.TERM_CODE = t1.TERM_CODE JOIN ACADEMIC_TERM_PARAMETER t2 ON t1.TERM_CODE
    = t2.TERM_CODE WHERE t2.TERM_PARAMETER = 'SIS_CURRENT_TERM' GROUP BY t0.OFFER_DEPT_NAME,
    t0.OFFER_DEPT_CODE ) dept_counts ON inner_cte.OFFER_DEPT_NAME = dept_counts.OFFER_DEPT_NAME
    AND inner_cte.OFFER_DEPT_CODE = dept_counts.OFFER_DEPT_CODE ), subq2 AS ( WITH
    inner_cte AS ( SELECT t2.SUBJECT_ID, dense_rank() OVER (ORDER BY t2.TOTAL_UNITS
    ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) window_column FROM SIS_COURSE_DESCRIPTION
    t0 JOIN SIS_DEPARTMENT t1 ON t0.DEPARTMENT = t1.DEPARTMENT_CODE JOIN SUBJECT_OFFERED_SUMMARY
    t2 ON t1.DEPARTMENT_CODE = t2.OFFER_DEPT_CODE WHERE t2.TERM_CODE = '2016SP' AND
    t1.IS_DEGREE_GRANTING = 'Y' ), DeptSubjectSummary AS ( SELECT t1.DEPARTMENT_CODE,
    t1.DEPARTMENT_NAME, COUNT(DISTINCT t2.SUBJECT_ID) AS num_subjects, SUM(t2.TOTAL_UNITS)
    AS total_units FROM SIS_DEPARTMENT t1 JOIN SUBJECT_OFFERED_SUMMARY t2 ON t1.DEPARTMENT_CODE
    = t2.OFFER_DEPT_CODE WHERE t1.IS_DEGREE_GRANTING = 'Y' AND t2.TERM_CODE = '2016SP'
    GROUP BY t1.DEPARTMENT_CODE, t1.DEPARTMENT_NAME ) SELECT dss.DEPARTMENT_CODE,
    dss.DEPARTMENT_NAME, dss.num_subjects, dss.total_units FROM DeptSubjectSummary
    dss UNION ALL SELECT dss.DEPARTMENT_CODE, NULL AS DEPARTMENT_NAME, SUM(dss.num_subjects)
    AS num_subjects, SUM(dss.total_units) AS total_units FROM DeptSubjectSummary dss
    GROUP BY dss.DEPARTMENT_CODE ) SELECT s1.OFFER_DEPT_CODE, s1.OFFER_DEPT_NAME,
    s1.SUBJECT_TITLE, s1.RESPONSIBLE_FACULTY_NAME, s1.TERM_DESCRIPTION, s1.ACADEMIC_YEAR_DESC,
    s1.Total_Subjects, s2.DEPARTMENT_NAME, s2.num_subjects, s2.total_units FROM subq1
    s1 JOIN subq2 s2 ON s1.OFFER_DEPT_CODE = s2.DEPARTMENT_CODE ORDER BY s1.OFFER_DEPT_CODE,
    s1.SUBJECT_TITLE, s2.DEPARTMENT_NAME
- category: Library Reserve and Textbook Material Comprehensive Analysis
  default_granularity: one row per status-U reserve material matched with 2025FA subject
  desc: For each library reserve material detail with material status key equal to
    'U' and for subjects offered in the term with code '2025FA', show the library
    course instructor key, library reserve catalog key, term code, subject ID, the
    tip material key, tip material status key, tip ISBN, the subject title from the
    subject offered table, the minimum tip material status key in a window of 3 preceding
    and 1 following row ordered by the number of enrolled students (only including
    those where the number of enrolled students is greater than the average across
    all subjects), the offering department name, term description, academic year,
    term start date, term end date, term parameter, the minimum number of enrolled
    students over each offering department, the offering school name, and the responsible
    faculty name for each subject. Order the results by offering department and descending
    number of enrolled students. Do not return any rounded answers.
  id: dw_4287
  name: Status-U Reserve Materials Above-Average Enrollment Matched with 2025FA Subject
    Attributes
  sql: WITH subq1 AS ( WITH inner_cte AS ( SELECT l.LIBRARY_COURSE_INSTRUCTOR_KEY,
    l.LIBRARY_RESERVE_CATALOG_KEY, l.TERM_CODE, l.SUBJECT_ID, t.TIP_MATERIAL_KEY,
    t.TIP_MATERIAL_STATUS_KEY, t.ISBN, s.SUBJECT_TITLE, s.NUM_ENROLLED_STUDENTS, MIN(t.TIP_MATERIAL_STATUS_KEY)
    OVER ( ORDER BY s.NUM_ENROLLED_STUDENTS ROWS BETWEEN 3 PRECEDING AND 1 FOLLOWING
    ) AS window_column FROM LIBRARY_RESERVE_MATRL_DETAIL l JOIN TIP_DETAIL t ON l.SUBJECT_ID
    = t.SUBJECT_ID JOIN TIP_SUBJECT_OFFERED s ON t.SUBJECT_ID = s.SUBJECT_ID WHERE
    l.LIBRARY_MATERIAL_STATUS_KEY = 'U' ) SELECT LIBRARY_COURSE_INSTRUCTOR_KEY, LIBRARY_RESERVE_CATALOG_KEY,
    TERM_CODE, SUBJECT_ID, TIP_MATERIAL_KEY, TIP_MATERIAL_STATUS_KEY, ISBN, SUBJECT_TITLE,
    window_column, NUM_ENROLLED_STUDENTS FROM inner_cte WHERE NUM_ENROLLED_STUDENTS
    > ( SELECT AVG(NUM_ENROLLED_STUDENTS) FROM TIP_SUBJECT_OFFERED ) ), subq2 AS (
    WITH inner_cte AS ( SELECT t0.SUBJECT_ID, t0.SUBJECT_TITLE, t0.OFFER_DEPT_NAME,
    t0.NUM_ENROLLED_STUDENTS, t1.TERM_DESCRIPTION, t1.ACADEMIC_YEAR, t1.TERM_START_DATE,
    t1.TERM_END_DATE, t2.TERM_PARAMETER, min(t0.NUM_ENROLLED_STUDENTS) OVER (PARTITION
    BY t0.OFFER_DEPT_NAME ORDER BY t0.OFFER_DEPT_NAME) AS min_enrolled_students_per_dept,
    t0.OFFER_SCHOOL_NAME, t0.RESPONSIBLE_FACULTY_NAME FROM TIP_SUBJECT_OFFERED t0
    JOIN ACADEMIC_TERMS_ALL t1 ON t0.TERM_CODE = t1.TERM_CODE JOIN ACADEMIC_TERM_PARAMETER
    t2 ON t1.TERM_CODE = t2.TERM_CODE WHERE t0.TERM_CODE = '2025FA' ) SELECT SUBJECT_ID,
    SUBJECT_TITLE, OFFER_DEPT_NAME, NUM_ENROLLED_STUDENTS, TERM_DESCRIPTION, ACADEMIC_YEAR,
    TERM_START_DATE, TERM_END_DATE, TERM_PARAMETER, min_enrolled_students_per_dept,
    OFFER_SCHOOL_NAME, RESPONSIBLE_FACULTY_NAME FROM inner_cte ) SELECT s1.LIBRARY_COURSE_INSTRUCTOR_KEY,
    s1.LIBRARY_RESERVE_CATALOG_KEY, s1.TERM_CODE, s1.SUBJECT_ID, s1.TIP_MATERIAL_KEY,
    s1.TIP_MATERIAL_STATUS_KEY, s1.ISBN, s1.SUBJECT_TITLE, s1.window_column, s2.OFFER_DEPT_NAME,
    s2.TERM_DESCRIPTION, s2.ACADEMIC_YEAR, s2.TERM_START_DATE, s2.TERM_END_DATE, s2.TERM_PARAMETER,
    s2.min_enrolled_students_per_dept, s2.OFFER_SCHOOL_NAME, s2.RESPONSIBLE_FACULTY_NAME
    FROM subq1 s1 JOIN subq2 s2 ON s1.SUBJECT_ID = s2.SUBJECT_ID ORDER BY s2.OFFER_DEPT_NAME,
    s1.NUM_ENROLLED_STUDENTS DESC
- category: IAP Activity and Subject Offering Comprehensive Analysis
  default_granularity: one row per IAP activity per department per academic year
  desc: For each combination of activity and department/academic year enrollment statistics,
    list the activity title, enrollment type, maximum enrollment, category name, category
    description, and the dense rank of each row partitioned by the category name and
    ordered by the category name, along with the department name, academic year, number
    of unique subjects offered (subject count), minimum number of total units for
    those subjects, and the average number of enrolled students per subject (for departments
    and academic years where the number of enrolled students in a subject is greater
    than 5). Do not return any rounded answers.
  id: dw_4405
  name: IAP Activity Category Ranks Cross-Joined with Department Year Enrollment Statistics
  sql: WITH activity_category_rank AS ( WITH inner_cte AS ( SELECT d.ACTIVITY_TITLE,
    d.ENROLLMENT_TYPE, d.MAX_ENROLLMENT, c.IAP_CATEGORY_NAME FROM IAP_SUBJECT_DETAIL
    d JOIN IAP_SUBJECT_CATEGORY c ON d.IAP_SUBJECT_CATEGORY_KEY = c.IAP_SUBJECT_CATEGORY_KEY
    ) SELECT i.ACTIVITY_TITLE, i.ENROLLMENT_TYPE, i.MAX_ENROLLMENT, i.IAP_CATEGORY_NAME,
    c.IAP_CATEGORY_DESC, DENSE_RANK() OVER (PARTITION BY i.IAP_CATEGORY_NAME ORDER
    BY i.IAP_CATEGORY_NAME) AS window_column FROM inner_cte i JOIN IAP_SUBJECT_CATEGORY
    c ON i.IAP_CATEGORY_NAME = c.IAP_CATEGORY_NAME ), dept_year_enrollment_stats AS
    ( WITH inner_cte AS ( SELECT c.DEPARTMENT_NAME, t.ACADEMIC_YEAR, COUNT(DISTINCT
    c.SUBJECT_ID) AS subject_count, MIN(c.TOTAL_UNITS) AS min_total_units FROM COURSE_CATALOG_SUBJECT_OFFERED
    c JOIN ACADEMIC_TERMS_ALL t ON c.TERM_CODE = t.TERM_CODE JOIN TIP_SUBJECT_OFFERED
    s ON t.TERM_CODE = s.TERM_CODE AND c.SUBJECT_ID = s.SUBJECT_ID WHERE s.NUM_ENROLLED_STUDENTS
    > 5 GROUP BY c.DEPARTMENT_NAME, t.ACADEMIC_YEAR ) SELECT i.DEPARTMENT_NAME, i.ACADEMIC_YEAR,
    i.subject_count, i.min_total_units, AVG(s.NUM_ENROLLED_STUDENTS) AS avg_enrolled_students
    FROM inner_cte i JOIN COURSE_CATALOG_SUBJECT_OFFERED c ON i.DEPARTMENT_NAME =
    c.DEPARTMENT_NAME AND i.ACADEMIC_YEAR = c.ACADEMIC_YEAR JOIN ACADEMIC_TERMS_ALL
    t ON c.TERM_CODE = t.TERM_CODE AND t.ACADEMIC_YEAR = i.ACADEMIC_YEAR JOIN TIP_SUBJECT_OFFERED
    s ON t.TERM_CODE = s.TERM_CODE AND c.SUBJECT_ID = s.SUBJECT_ID WHERE s.NUM_ENROLLED_STUDENTS
    > 5 GROUP BY i.DEPARTMENT_NAME, i.ACADEMIC_YEAR, i.subject_count, i.min_total_units
    ) SELECT acr.ACTIVITY_TITLE, acr.ENROLLMENT_TYPE, acr.MAX_ENROLLMENT, acr.IAP_CATEGORY_NAME,
    acr.IAP_CATEGORY_DESC, acr.window_column, dys.DEPARTMENT_NAME, dys.ACADEMIC_YEAR,
    dys.subject_count, dys.min_total_units, dys.avg_enrolled_students FROM activity_category_rank
    acr CROSS JOIN dept_year_enrollment_stats dys;
- category: Textbook Material and Enrollment Comprehensive Analysis
  default_granularity: one row per record from either Fall 2024-2025 subject offering
    or required textbook detail scope
  desc: For each subject offered in the term with the description "Fall Term 2024-2025",
    show the subject ID, subject title, offering department name, term description,
    and the rank of the subject within its offering department. For each tip detail
    record where the material status key is 'RQ', show the subject ID, term description,
    term start date, tip material key, and the average record count in a window of
    2 preceding and 2 following rows grouped by the financial aid year. Additionally,
    for each subject offered in "Fall Term 2024-2025", include the academic year description
    from the academic terms table. Indicate the source of each row as either 'SubjectOffered'
    or 'TipDetail'. The results should be ordered by subject ID and source. Do not
    return any rounded answers.
  id: dw_4738
  name: Union of Fall 2024-2025 Offered Subjects Ranked per Department and Required
    Textbook Record Count Windows
  sql: WITH inner_cte AS ( SELECT t0.SUBJECT_ID, t0.SUBJECT_TITLE, t0.OFFER_DEPT_NAME,
    t1.TERM_DESCRIPTION, RANK() OVER (PARTITION BY t0.OFFER_DEPT_NAME ORDER BY t0.SUBJECT_ID)
    AS window_column FROM TIP_SUBJECT_OFFERED t0 JOIN ACADEMIC_TERMS_ALL t1 ON t0.TERM_CODE
    = t1.TERM_CODE JOIN ACADEMIC_TERM_PARAMETER t2 ON t1.TERM_CODE = t2.TERM_CODE
    WHERE t1.TERM_DESCRIPTION = 'Fall Term 2024-2025' ) , Subquery2 AS ( SELECT t1.SUBJECT_ID,
    t0.TERM_DESCRIPTION, t0.TERM_START_DATE, t1.TIP_MATERIAL_KEY, AVG(t1.RECORD_COUNT)
    OVER ( PARTITION BY t0.FINANCIAL_AID_YEAR ORDER BY t1.SUBJECT_ID ROWS BETWEEN
    2 PRECEDING AND 2 FOLLOWING ) AS window_column FROM ACADEMIC_TERMS_ALL t0 JOIN
    TIP_DETAIL t1 ON t0.TERM_CODE = t1.TERM_CODE WHERE t1.TIP_MATERIAL_STATUS_KEY
    = 'RQ' ) , SubjectOfferedWithYear AS ( SELECT i.SUBJECT_ID, i.SUBJECT_TITLE, i.OFFER_DEPT_NAME,
    i.TERM_DESCRIPTION, i.window_column AS subject_rank, t1.ACADEMIC_YEAR_DESC FROM
    inner_cte i JOIN ACADEMIC_TERMS_ALL t1 ON i.TERM_DESCRIPTION = t1.TERM_DESCRIPTION
    ) , CombinedResults AS ( SELECT s1.SUBJECT_ID, s1.SUBJECT_TITLE, s1.OFFER_DEPT_NAME,
    s1.TERM_DESCRIPTION, s1.subject_rank, s1.ACADEMIC_YEAR_DESC, NULL AS TERM_START_DATE,
    NULL AS TIP_MATERIAL_KEY, NULL AS avg_record_count, 'SubjectOffered' AS Source
    FROM SubjectOfferedWithYear s1 UNION ALL SELECT s2.SUBJECT_ID, NULL AS SUBJECT_TITLE,
    NULL AS OFFER_DEPT_NAME, s2.TERM_DESCRIPTION, NULL AS subject_rank, NULL AS ACADEMIC_YEAR_DESC,
    s2.TERM_START_DATE, s2.TIP_MATERIAL_KEY, s2.window_column AS avg_record_count,
    'TipDetail' AS Source FROM Subquery2 s2 ) SELECT * FROM CombinedResults ORDER
    BY SUBJECT_ID, Source;
- category: Enrollment Analysis
  default_granularity: one row per top-10 Engineering subject by windowed max enrollment
  desc: From the top 10 subjects offered by departments in the School of Engineering
    with the highest maximum enrolled students (considering the current and next 2
    rows ordered by subject key), display each subject's title, total units, department
    full name, row number within a window of 2 preceding and 1 following rows ordered
    by subject title, subject ID, offer department name, offer school name, term description,
    academic year, and the department that offered the subject. Do not return any
    rounded answers.
  id: dw_4911
  name: Top 10 Engineering Subjects by 3-Row Max Enrollment with Catalog Unit Row
    Numbers
  sql: WITH inner_cte AS ( WITH EngSubjects AS ( SELECT t1.SUBJECT_TITLE, t1.TOTAL_UNITS,
    t0.DEPARTMENT_FULL_NAME, ROW_NUMBER() OVER (ORDER BY t1.SUBJECT_TITLE ROWS BETWEEN
    2 PRECEDING AND 1 FOLLOWING) AS window_column FROM SIS_DEPARTMENT t0 JOIN COURSE_CATALOG_SUBJECT_OFFERED
    t1 ON t0.DEPARTMENT_CODE = t1.DEPARTMENT_CODE WHERE t0.SCHOOL_NAME = 'Engineering'
    ), SubjectEnrollmentStats AS ( SELECT t1.SUBJECT_TITLE, t1.SUBJECT_ID, t1.OFFER_DEPT_NAME,
    t1.OFFER_SCHOOL_NAME, t0.TERM_DESCRIPTION, t0.ACADEMIC_YEAR, MAX(t1.NUM_ENROLLED_STUDENTS)
    OVER (ORDER BY t1.SUBJECT_KEY ROWS BETWEEN CURRENT ROW AND 2 FOLLOWING) AS max_enrolled_students
    FROM ACADEMIC_TERMS_ALL t0 JOIN SUBJECT_OFFERED t1 ON t0.TERM_CODE = t1.TERM_CODE
    WHERE t1.IS_MASTER_SECTION = 'Y' AND t0.TERM_STATUS_INDICATOR = 'P' ) SELECT es.SUBJECT_TITLE,
    es.TOTAL_UNITS, es.DEPARTMENT_FULL_NAME, es.window_column, ses.SUBJECT_ID, ses.OFFER_DEPT_NAME,
    ses.OFFER_SCHOOL_NAME, ses.TERM_DESCRIPTION, ses.ACADEMIC_YEAR, ses.max_enrolled_students
    FROM EngSubjects es JOIN SubjectEnrollmentStats ses ON es.SUBJECT_TITLE = ses.SUBJECT_TITLE
    ) SELECT icte.SUBJECT_TITLE, icte.TOTAL_UNITS, icte.DEPARTMENT_FULL_NAME, icte.window_column,
    icte.SUBJECT_ID, icte.OFFER_DEPT_NAME, icte.OFFER_SCHOOL_NAME, icte.TERM_DESCRIPTION,
    icte.ACADEMIC_YEAR, icte.max_enrolled_students, sd.DEPARTMENT_FULL_NAME AS OFFERING_DEPARTMENT_FULL_NAME
    FROM inner_cte icte LEFT JOIN SIS_DEPARTMENT sd ON icte.OFFER_DEPT_NAME = sd.DEPARTMENT_NAME
    ORDER BY icte.max_enrolled_students DESC LIMIT 10;
- category: Subject Offering and Textbook Material Comprehensive Analysis
  default_granularity: one row per 2017JA subject matched with 2022FA catalog subject
    in same department
  desc: For subjects offered in the term '2017JA', show the subject title, the number
    of enrolled students, the responsible faculty name, the offering department name,
    the department full name, the school name, and the minimum number of enrolled
    students in a window of 3 preceding and 1 following row ordered by the department
    code. Additionally, for subjects offered in the term with code '2022FA' in the
    same department, provide the subject ID, department name, term description, the
    running sum of total units within each academic year ordered by subject ID, and
    the subject's short title and responsible faculty name from the course catalog.
    Do not return any rounded answers.
  id: dw_5103
  name: 2017JA TIP Subjects Enrollment Windows Matched with 2022FA Catalog Running
    Unit Sums per Department
  sql: WITH inner_cte AS ( SELECT t0.SUBJECT_TITLE, t0.NUM_ENROLLED_STUDENTS, t0.RESPONSIBLE_FACULTY_NAME,
    t0.OFFER_DEPT_NAME, t1.DEPARTMENT_FULL_NAME, t1.SCHOOL_NAME, MIN(t0.NUM_ENROLLED_STUDENTS)
    OVER (ORDER BY t1.DEPARTMENT_CODE ROWS BETWEEN 3 PRECEDING AND 1 FOLLOWING) AS
    window_column, t0.OFFER_DEPT_CODE FROM TIP_SUBJECT_OFFERED t0 JOIN STUDENT_DEPARTMENT
    t1 ON t0.OFFER_DEPT_CODE = t1.DEPARTMENT_CODE WHERE t0.TERM_CODE = '2017JA' ),
    Subq2 AS ( SELECT t1.SUBJECT_ID, t1.DEPARTMENT_NAME, t0.TERM_DESCRIPTION, SUM(t1.TOTAL_UNITS)
    OVER (PARTITION BY t1.ACADEMIC_YEAR ORDER BY t1.SUBJECT_ID) AS running_sum_total_units,
    t1.DEPARTMENT_CODE, t1.SUBJECT_SHORT_TITLE, t1.RESPONSIBLE_FACULTY_NAME AS CATALOG_RESPONSIBLE_FACULTY_NAME
    FROM ACADEMIC_TERMS_ALL t0 JOIN COURSE_CATALOG_SUBJECT_OFFERED t1 ON t0.TERM_CODE
    = t1.TERM_CODE WHERE t1.TERM_CODE = '2022FA' ) SELECT s1.SUBJECT_TITLE, s1.NUM_ENROLLED_STUDENTS,
    s1.RESPONSIBLE_FACULTY_NAME, s1.OFFER_DEPT_NAME, s1.DEPARTMENT_FULL_NAME, s1.SCHOOL_NAME,
    s1.window_column AS min_enrolled_window, s2.SUBJECT_ID, s2.DEPARTMENT_NAME, s2.TERM_DESCRIPTION,
    s2.running_sum_total_units, s2.SUBJECT_SHORT_TITLE, s2.CATALOG_RESPONSIBLE_FACULTY_NAME
    FROM inner_cte s1 JOIN Subq2 s2 ON s1.OFFER_DEPT_CODE = s2.DEPARTMENT_CODE ORDER
    BY s1.OFFER_DEPT_NAME, s2.SUBJECT_ID
- category: Facility Space Analysis
  default_granularity: one row per level-5 organization matched to a top-10 space
    unit
  desc: For each organization with an organization level of 5 whose space unit is
    among the top 10 space units by number of rooms, display the organization name,
    organization key, description, space unit, space unit key, the average organization
    key within each organization key group ordered by space unit key, the count of
    rooms for each space unit, and the building with the highest number of rooms in
    that space unit, along with the count of rooms in that building. Order the results
    by the count of rooms descending and then by space unit key. Do not return any
    rounded answers.
  id: dw_4562
  name: Level-5 Organizations in Top-10 Space Units by Room Count with Dominant Building
  sql: WITH inner_cte AS ( SELECT t0.ORGANIZATION_NAME, t0.FCLT_ORGANIZATION_KEY,
    t0.DESCRIPTION, t1.SPACE_UNIT, t1.SPACE_UNIT_KEY, AVG(t0.FCLT_ORGANIZATION_KEY)
    OVER (PARTITION BY t0.FCLT_ORGANIZATION_KEY ORDER BY t1.SPACE_UNIT_KEY) AS window_column
    FROM FCLT_ORGANIZATION t0 JOIN SPACE_UNIT t1 ON t0.FCLT_ORGANIZATION_KEY = t1.FCLT_ORGANIZATION_KEY
    WHERE t0.ORGANIZATION_LEVEL = 5 ), TopSpaceUnits AS ( SELECT su.SPACE_UNIT, COUNT(sd.BUILDING_ROOM)
    AS room_count, su.SPACE_UNIT_KEY FROM SPACE_DETAIL sd JOIN SPACE_UNIT su ON sd.SPACE_UNIT_KEY
    = su.SPACE_UNIT_KEY GROUP BY su.SPACE_UNIT, su.SPACE_UNIT_KEY ORDER BY room_count
    DESC LIMIT 10 ), BuildingRoomCounts AS ( SELECT sd.SPACE_UNIT_KEY, sd.BUILDING_KEY,
    COUNT(sd.BUILDING_ROOM) AS building_room_count FROM SPACE_DETAIL sd GROUP BY sd.SPACE_UNIT_KEY,
    sd.BUILDING_KEY ), MaxBuildingPerSpaceUnit AS ( SELECT brc.SPACE_UNIT_KEY, brc.BUILDING_KEY,
    brc.building_room_count FROM ( SELECT brc.*, ROW_NUMBER() OVER (PARTITION BY brc.SPACE_UNIT_KEY
    ORDER BY brc.building_room_count DESC) AS rn FROM BuildingRoomCounts brc ) brc
    WHERE brc.rn = 1 ) SELECT o.ORGANIZATION_NAME, o.FCLT_ORGANIZATION_KEY, o.DESCRIPTION,
    o.SPACE_UNIT, o.SPACE_UNIT_KEY, o.window_column, t.room_count, mb.BUILDING_KEY
    AS top_building_key, mb.building_room_count AS top_building_room_count FROM inner_cte
    o JOIN TopSpaceUnits t ON o.SPACE_UNIT_KEY = t.SPACE_UNIT_KEY LEFT JOIN MaxBuildingPerSpaceUnit
    mb ON o.SPACE_UNIT_KEY = mb.SPACE_UNIT_KEY ORDER BY t.room_count DESC, o.SPACE_UNIT_KEY
- id: dw_3042
  name: Engineering CIP Category Latest Start Term, Highest Version, and Most Active
    Department
  desc: For each program category in the School of Engineering with a program version
    after 2000, what is the latest course start term, the highest program version,
    and the department that offers the most courses in that category, along with the
    count of courses from that department? Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT c.CATEGORY_TITLE, MAX(s.FROM_TERM) AS latest_start_term,
    MAX(c.VERSION) AS highest_program_version FROM CIP c JOIN SIS_COURSE_DESCRIPTION
    s ON c.PROGRAM_CODE = s.CIP_PROGRAM_CODE WHERE s.SCHOOL_NAME = 'Engineering' AND
    c.VERSION > 2000 GROUP BY c.CATEGORY_TITLE ) SELECT ic.CATEGORY_TITLE, ic.latest_start_term,
    ic.highest_program_version, dept_stats.DEPARTMENT_NAME AS most_active_department,
    dept_stats.course_count FROM inner_cte ic LEFT JOIN ( SELECT c.CATEGORY_TITLE,
    s.DEPARTMENT_NAME, COUNT(*) AS course_count, ROW_NUMBER() OVER (PARTITION BY c.CATEGORY_TITLE
    ORDER BY COUNT(*) DESC) AS rn FROM CIP c JOIN SIS_COURSE_DESCRIPTION s ON c.PROGRAM_CODE
    = s.CIP_PROGRAM_CODE WHERE s.SCHOOL_NAME = 'Engineering' AND c.VERSION > 2000
    GROUP BY c.CATEGORY_TITLE, s.DEPARTMENT_NAME ) dept_stats ON ic.CATEGORY_TITLE
    = dept_stats.CATEGORY_TITLE AND dept_stats.rn = 1 ORDER BY ic.CATEGORY_TITLE;
  category: CIP Program Classification and Course Catalog Comprehensive Analysis
  default_granularity: one row per CIP program category title
- category: Subject Offering and CIP Program Classification Comprehensive Analysis
  default_granularity: one row per 2012SU subject offering detail plus rollup rows
    per department and per school
  desc: For each offer department code in the 2012SU term with total units greater
    than 0, list the subject title, course number, department name, the dense rank
    over the offer department code, the course, course description, school name, program
    code, program title, category code, category title, four digit code, four digit
    title, and the minimum warehouse load date from the CIP table over each category
    code group for courses in department 6, and include a grand total of subjects
    per offer department code and a grand total for all courses in each school in
    the format (nulls for subject-specific fields, department name, total subjects,
    course-specific fields, school name, and total courses). Do not return any rounded
    answers.
  id: dw_3901
  name: 2012SU Subject Offerings Dense Rank Matched with Department-6 CIP Course Classification
    and School Rollups
  sql: WITH inner_cte1 AS ( SELECT t2.SUBJECT_TITLE, t0.COURSE_NUMBER, t2.DEPARTMENT_NAME,
    DENSE_RANK() OVER (PARTITION BY t1.OFFER_DEPT_CODE ORDER BY t1.OFFER_DEPT_CODE)
    AS window_column FROM SUBJECT_OFFERED_SUMMARY t0 JOIN SUBJECT_OFFERED t1 ON t0.TERM_CODE
    = t1.TERM_CODE JOIN SUBJECT_SUMMARY t2 ON t1.TERM_CODE = t2.TERM_CODE WHERE t0.TERM_CODE
    = '2012SU' AND t2.TOTAL_UNITS > 0 ), dept_counts1 AS ( SELECT DEPARTMENT_NAME,
    COUNT(*) AS total_subjects FROM SUBJECT_SUMMARY WHERE TERM_CODE = '2012SU' AND
    TOTAL_UNITS > 0 GROUP BY DEPARTMENT_NAME ), inner_cte2 AS ( SELECT s.COURSE, s.COURSE_DESCRIPTION,
    s.DEPARTMENT_NAME, s.SCHOOL_NAME, c.PROGRAM_CODE, c.PROGRAM_TITLE, c.CATEGORY_CODE,
    c.CATEGORY_TITLE, c.FOUR_DIGIT_CODE, c.FOUR_DIGIT_TITLE, MIN(c.WAREHOUSE_LOAD_DATE)
    OVER (PARTITION BY c.CATEGORY_CODE ORDER BY c.CATEGORY_CODE) AS min_warehouse_load_date
    FROM SIS_COURSE_DESCRIPTION s JOIN CIP c ON c.PROGRAM_CODE = s.CIP_PROGRAM_CODE
    WHERE s.DEPARTMENT = 6 ), SchoolTotals2 AS ( SELECT NULL AS COURSE, NULL AS COURSE_DESCRIPTION,
    NULL AS DEPARTMENT_NAME, SCHOOL_NAME, NULL AS PROGRAM_CODE, NULL AS PROGRAM_TITLE,
    NULL AS CATEGORY_CODE, NULL AS CATEGORY_TITLE, NULL AS FOUR_DIGIT_CODE, NULL AS
    FOUR_DIGIT_TITLE, NULL AS min_warehouse_load_date, COUNT(*) AS total_courses FROM
    inner_cte2 GROUP BY SCHOOL_NAME ) SELECT ic1.SUBJECT_TITLE, ic1.COURSE_NUMBER,
    ic1.DEPARTMENT_NAME, ic1.window_column, NULL AS total_subjects, ic2.COURSE, ic2.COURSE_DESCRIPTION,
    ic2.SCHOOL_NAME, ic2.PROGRAM_CODE, ic2.PROGRAM_TITLE, ic2.CATEGORY_CODE, ic2.CATEGORY_TITLE,
    ic2.FOUR_DIGIT_CODE, ic2.FOUR_DIGIT_TITLE, ic2.min_warehouse_load_date, NULL AS
    total_courses FROM inner_cte1 ic1 LEFT JOIN SIS_COURSE_DESCRIPTION scd ON ic1.COURSE_NUMBER
    = scd.COURSE LEFT JOIN inner_cte2 ic2 ON scd.COURSE = ic2.COURSE UNION ALL SELECT
    NULL, NULL, dc1.DEPARTMENT_NAME, NULL, dc1.total_subjects, s2.COURSE, s2.COURSE_DESCRIPTION,
    s2.SCHOOL_NAME, s2.PROGRAM_CODE, s2.PROGRAM_TITLE, s2.CATEGORY_CODE, s2.CATEGORY_TITLE,
    s2.FOUR_DIGIT_CODE, s2.FOUR_DIGIT_TITLE, s2.min_warehouse_load_date, s2.total_courses
    FROM dept_counts1 dc1 LEFT JOIN SIS_COURSE_DESCRIPTION scd2 ON dc1.DEPARTMENT_NAME
    = scd2.DEPARTMENT_NAME LEFT JOIN SchoolTotals2 s2 ON scd2.SCHOOL_NAME = s2.SCHOOL_NAME
    ORDER BY DEPARTMENT_NAME, SCHOOL_NAME, CATEGORY_CODE, SUBJECT_TITLE, COURSE
- id: dw_50
  name: 2021 Non-Graduate-Credit Math Undergraduate Catalog Subjects Offered by Science
    School Count
  desc: How many subjects offered in 2021 that are not for graduate credit, are listed
    as undergraduate in the course catalog, are in the Mathematics department, and
    are also offered by the School of Science? Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT COUNT(*) AS undergrad_subjects_2021 FROM SUBJECT_OFFERED_SUMMARY
    s JOIN CIS_COURSE_CATALOG c ON s.HGN_CODE = c.HGN_CODE WHERE s.TERM_CODE LIKE
    '2021%' AND c.SCHOOL_WIDE_ELECTIVES = 'U' AND c.DEPARTMENT_NAME = 'Mathematics'
    ) SELECT COUNT(*) AS undergrad_subjects_2021_science FROM SUBJECT_OFFERED_SUMMARY
    s JOIN CIS_COURSE_CATALOG c ON s.HGN_CODE = c.HGN_CODE WHERE s.TERM_CODE LIKE
    '2021%' AND c.SCHOOL_WIDE_ELECTIVES = 'U' AND c.DEPARTMENT_NAME = 'Mathematics'
    AND s.OFFER_SCHOOL_NAME = 'Science';
  category: Subject Offering and Course Catalog Comprehensive Analysis
  default_granularity: single count row
- id: dw_1302
  name: Engineering Degree-Granting Department 2007 Course Rollup with Department
    Unit Totals and Latest-Year Course Counts
  desc: 'For each course offered by a degree-granting department in the School of
    Engineering, except for the Electrical Engineering and Computer Science department,
    in the 2007 academic year, what is the course key, course name, department name,
    the number of catalog subjects, the total units for those subjects, and for each
    department, include a grand total for all courses in the format of (null, null,
    department name, total subjects, total units)? Additionally, for each such department,
    what is the total number of units for courses in the "Engineering" or "Non-MIT"
    schools (where the total units for the department is greater than 1000 and the
    department is not "Political Science"), and how many distinct courses did the
    department offer in the most recent academic year available? Present the results
    as: course key, course name, department name, number of catalog subjects, total
    units for those subjects, department total units, and number of distinct courses
    in the latest year, in that order. Do not return any rounded answers.'
  sql: WITH subq1 AS ( WITH inner_cte AS ( SELECT scd.SIS_COURSE_DESCRIPTION_KEY,
    scd.COURSE, sd.DEPARTMENT_NAME, COUNT(ccc.SUBJECT_ID) AS subject_count, SUM(ccc.TOTAL_UNITS)
    AS total_units FROM SIS_COURSE_DESCRIPTION scd JOIN SIS_DEPARTMENT sd ON scd.DEPARTMENT
    = sd.DEPARTMENT_CODE JOIN CIS_COURSE_CATALOG ccc ON sd.DEPARTMENT_CODE = ccc.DEPARTMENT_CODE
    WHERE sd.IS_DEGREE_GRANTING = 'Y' AND sd.SCHOOL_NAME = 'Engineering' AND ccc.ACADEMIC_YEAR
    = '2007' AND sd.DEPARTMENT_NAME != 'Electrical Eng & Computer Sci' GROUP BY scd.SIS_COURSE_DESCRIPTION_KEY,
    scd.COURSE, sd.DEPARTMENT_NAME ) SELECT CASE WHEN GROUPING(SIS_COURSE_DESCRIPTION_KEY)
    = 1 THEN NULL ELSE SIS_COURSE_DESCRIPTION_KEY END AS SIS_COURSE_DESCRIPTION_KEY,
    CASE WHEN GROUPING(COURSE) = 1 THEN NULL ELSE COURSE END AS COURSE, DEPARTMENT_NAME,
    SUM(subject_count) AS subject_count, SUM(total_units) AS total_units FROM inner_cte
    GROUP BY DEPARTMENT_NAME, SIS_COURSE_DESCRIPTION_KEY, COURSE WITH ROLLUP HAVING
    SUM(subject_count) > 0 ORDER BY DEPARTMENT_NAME, SIS_COURSE_DESCRIPTION_KEY ),
    subq2 AS ( WITH inner_cte AS ( SELECT s.DEPARTMENT_NAME, SUM(c.TOTAL_UNITS) AS
    total_units FROM SIS_SUBJECT_CODE s JOIN CIS_COURSE_CATALOG c ON s.SUBJECT_CODE
    = c.SUBJECT_CODE WHERE s.SCHOOL_NAME IN ('Engineering', 'Non-MIT') AND s.DEPARTMENT_NAME
    <> 'Political Science' GROUP BY s.DEPARTMENT_NAME HAVING SUM(c.TOTAL_UNITS) >
    1000 ) SELECT ic.DEPARTMENT_NAME, ic.total_units, COUNT(DISTINCT c.SUBJECT_NUMBER)
    AS num_courses_latest_year FROM inner_cte ic JOIN SIS_SUBJECT_CODE s ON ic.DEPARTMENT_NAME
    = s.DEPARTMENT_NAME JOIN CIS_COURSE_CATALOG c ON s.SUBJECT_CODE = c.SUBJECT_CODE
    WHERE c.ACADEMIC_YEAR = ( SELECT MAX(ACADEMIC_YEAR) FROM CIS_COURSE_CATALOG )
    GROUP BY ic.DEPARTMENT_NAME, ic.total_units ) SELECT s1.SIS_COURSE_DESCRIPTION_KEY,
    s1.COURSE, s1.DEPARTMENT_NAME, s1.subject_count, s1.total_units, s2.total_units
    AS department_total_units, s2.num_courses_latest_year FROM subq1 s1 JOIN subq2
    s2 ON s1.DEPARTMENT_NAME = s2.DEPARTMENT_NAME ORDER BY s1.DEPARTMENT_NAME, s1.SIS_COURSE_DESCRIPTION_KEY
    ;
  category: Course Catalog and Department Analysis
  default_granularity: one row per course per Engineering degree-granting department
    plus rollup totals
- category: Course Catalog and Department Analysis
  default_granularity: one row per department from either the Math 2008 stats branch
    or the high-average-units branch
  desc: 'List, for each department, either (a) the department''s full name, the range
    and variance of the total units for degree-granting Mathematics department courses
    offered in the 2008 academic year along with the long course description for each
    course (with the reason ''Math 2008 Stats''), or (b) the department name, the
    average and standard deviation (using STDDEV only and never STDDEV_POP) of the
    total units for subjects offered by that department (considering only subjects
    with more than 0 total units) where the average total units is greater than the
    overall average across all departments (with the reason ''High Avg Units''). Show
    the columns in the following order: department name, total units range, total
    units variance, average total units, standard deviation (using STDDEV only and
    never STDDEV_POP) of total units, long course description, and reason for inclusion.
    Do not return any rounded answers.'
  id: dw_1335
  name: Union of Math 2008 Unit Range-Variance with Long Descriptions and High Average
    Unit Department Stddev
  sql: WITH Subquery1 AS ( WITH inner_cte AS ( SELECT sd.DEPARTMENT_FULL_NAME, MAX(ccc.TOTAL_UNITS)
    - MIN(ccc.TOTAL_UNITS) AS total_units_range, VARIANCE(ccc.TOTAL_UNITS) AS total_units_variance
    FROM CIS_COURSE_CATALOG ccc JOIN SIS_DEPARTMENT sd ON ccc.DEPARTMENT_CODE = sd.DEPARTMENT_CODE
    WHERE ccc.ACADEMIC_YEAR = '2008' AND sd.IS_DEGREE_GRANTING = 'Y' AND sd.DEPARTMENT_NAME
    = 'Mathematics' AND ccc.DEPARTMENT_CODE = '18' GROUP BY sd.DEPARTMENT_FULL_NAME
    ) SELECT i.DEPARTMENT_FULL_NAME, i.total_units_range, i.total_units_variance,
    scd.COURSE_DESCRIPTION_LONG FROM inner_cte i JOIN SIS_COURSE_DESCRIPTION scd ON
    scd.DEPARTMENT = 18 AND scd.DEPARTMENT_NAME = 'Mathematics' ), Subquery2 AS (
    WITH inner_cte AS ( SELECT scd.DEPARTMENT_NAME, AVG(sos.TOTAL_UNITS) AS avg_total_units,
    STDDEV(sos.TOTAL_UNITS) AS stddev_total_units FROM SIS_COURSE_DESCRIPTION scd
    JOIN SUBJECT_OFFERED_SUMMARY sos ON scd.COURSE = sos.COURSE_NUMBER WHERE sos.TOTAL_UNITS
    > 0 GROUP BY scd.DEPARTMENT_NAME ) SELECT DEPARTMENT_NAME, avg_total_units, stddev_total_units
    FROM inner_cte WHERE avg_total_units > ( SELECT AVG(TOTAL_UNITS) FROM SUBJECT_OFFERED_SUMMARY
    WHERE TOTAL_UNITS > 0 ) ORDER BY stddev_total_units DESC ), CombinedResults AS
    ( SELECT s1.DEPARTMENT_FULL_NAME AS DEPARTMENT_NAME, s1.total_units_range, s1.total_units_variance,
    NULL AS avg_total_units, NULL AS stddev_total_units, s1.COURSE_DESCRIPTION_LONG,
    'Math 2008 Stats' AS Reason FROM Subquery1 s1 UNION ALL SELECT s2.DEPARTMENT_NAME,
    NULL AS total_units_range, NULL AS total_units_variance, s2.avg_total_units, s2.stddev_total_units,
    NULL AS COURSE_DESCRIPTION_LONG, 'High Avg Units' AS Reason FROM Subquery2 s2
    ) SELECT * FROM CombinedResults ORDER BY DEPARTMENT_NAME;
- category: Course Catalog and Department Analysis
  default_granularity: one row per department name per course level
  desc: For each department name and course level where the course is degree granting,
    the total units are greater than 6, and the department is Mathematics (Course
    18), provide the department name, course level, number of unique courses, minimum
    total units offered, school name, number of distinct course options available,
    and the highest average number of enrolled students in any term for courses offered
    by that department, considering only courses with more than 0 enrolled students
    and departments whose name is not null. Do not return any rounded answers.
  id: dw_1766
  name: Math Degree-Granting Course Level Counts with Min Units, Course Options, and
    Highest Term Average Library Enrollment
  sql: WITH highest_avg_enrollment AS ( WITH inner_cte AS ( SELECT s.DEPARTMENT_NAME,
    l.TERM_CODE, AVG(l.NUM_ENROLLED_STUDENTS) AS avg_enrollment_per_term FROM SIS_SUBJECT_CODE
    s JOIN LIBRARY_SUBJECT_OFFERED l ON s.COURSE_NUMBER = l.COURSE_NUMBER WHERE l.NUM_ENROLLED_STUDENTS
    > 0 AND s.DEPARTMENT_NAME IS NOT NULL AND s.DEPARTMENT_NAME = 'Mathematics' GROUP
    BY s.DEPARTMENT_NAME, l.TERM_CODE ) SELECT DEPARTMENT_NAME, MAX(avg_enrollment_per_term)
    AS highest_avg_enrollment_per_term FROM inner_cte GROUP BY DEPARTMENT_NAME ),
    course_stats AS ( WITH inner_cte AS ( SELECT scd.DEPARTMENT_NAME, scd.COURSE_LEVEL,
    COUNT(DISTINCT scd.COURSE) AS course_count, MIN(ccc.TOTAL_UNITS) AS min_total_units
    FROM SIS_COURSE_DESCRIPTION scd JOIN SIS_DEPARTMENT sd ON scd.DEPARTMENT = sd.DEPARTMENT_CODE
    JOIN CIS_COURSE_CATALOG ccc ON sd.DEPARTMENT_CODE = ccc.DEPARTMENT_CODE WHERE
    scd.IS_DEGREE_GRANTING = 'Y' AND ccc.TOTAL_UNITS > 6 AND scd.DEPARTMENT_NAME =
    'Mathematics' AND sd.DEPARTMENT_CODE = '18' GROUP BY scd.DEPARTMENT_NAME, scd.COURSE_LEVEL
    ) SELECT icte.DEPARTMENT_NAME, icte.COURSE_LEVEL, icte.course_count, icte.min_total_units,
    scd.SCHOOL_NAME, COUNT(DISTINCT scd.COURSE_OPTION) AS distinct_course_options
    FROM inner_cte icte JOIN SIS_COURSE_DESCRIPTION scd ON icte.DEPARTMENT_NAME =
    scd.DEPARTMENT_NAME AND icte.COURSE_LEVEL = scd.COURSE_LEVEL GROUP BY icte.DEPARTMENT_NAME,
    icte.COURSE_LEVEL, icte.course_count, icte.min_total_units, scd.SCHOOL_NAME )
    SELECT cs.DEPARTMENT_NAME, cs.COURSE_LEVEL, cs.course_count, cs.min_total_units,
    cs.SCHOOL_NAME, cs.distinct_course_options, hae.highest_avg_enrollment_per_term
    FROM course_stats cs JOIN highest_avg_enrollment hae ON cs.DEPARTMENT_NAME = hae.DEPARTMENT_NAME
    ORDER BY cs.DEPARTMENT_NAME, cs.COURSE_LEVEL;
- category: Subject Offering and Course Catalog Comprehensive Analysis
  default_granularity: one row per subject code matched with 2024 Mathematics catalog
    subject
  desc: For each subject code in degree-granting departments where the department
    is Mathematics, and for subjects offered in the academic year 2024 that are also
    present in the CIS course catalog and are in the Mathematics department, show
    the subject code, subject code description, department name, school name, rank
    of the subject code within each school name group ordered by subject code, subject
    ID, subject number, subject short title, subject title, lecture units, lab units,
    total units, grade type, grade rule, the minimum total units value over each department
    code group, and the subject description from the CIS course catalog, ordered by
    school name, rank, and subject number. Do not return any rounded answers.
  id: dw_2210
  name: Math Subject Code School Ranks Matched with 2024 Catalog Offerings and Department
    Min Units
  sql: WITH inner_cte AS ( WITH SubjectCodeRanks AS ( SELECT t1.SUBJECT_CODE, t1.SUBJECT_CODE_DESC,
    t0.DEPARTMENT_NAME, t1.SCHOOL_NAME, RANK() OVER (PARTITION BY t1.SCHOOL_NAME ORDER
    BY t1.SUBJECT_CODE) AS window_column FROM SIS_DEPARTMENT t0 JOIN SIS_SUBJECT_CODE
    t1 ON t0.SCHOOL_CODE = t1.SCHOOL_CODE WHERE t0.IS_DEGREE_GRANTING = 'Y' AND t0.DEPARTMENT_NAME
    = 'Mathematics' ), MathSubjects2024 AS ( SELECT t0.SUBJECT_ID, t0.SUBJECT_CODE,
    t0.SUBJECT_NUMBER, t0.DEPARTMENT_NAME, t0.SUBJECT_SHORT_TITLE, t0.SUBJECT_TITLE,
    t0.LECTURE_UNITS, t0.LAB_UNITS, t0.TOTAL_UNITS, t0.GRADE_TYPE, t0.GRADE_RULE,
    min(t0.TOTAL_UNITS) OVER (PARTITION BY t0.DEPARTMENT_CODE ORDER BY t0.DEPARTMENT_CODE)
    AS min_total_units_by_dept FROM COURSE_CATALOG_SUBJECT_OFFERED t0 JOIN CIS_COURSE_CATALOG
    t1 ON t0.SUBJECT_ID = t1.SUBJECT_ID WHERE t0.ACADEMIC_YEAR = 2024 AND t0.DEPARTMENT_NAME
    = 'Mathematics' ORDER BY t0.DEPARTMENT_CODE ) SELECT scr.SUBJECT_CODE, scr.SUBJECT_CODE_DESC,
    scr.DEPARTMENT_NAME, scr.SCHOOL_NAME, scr.window_column, ms.SUBJECT_ID, ms.SUBJECT_NUMBER,
    ms.SUBJECT_SHORT_TITLE, ms.SUBJECT_TITLE, ms.LECTURE_UNITS, ms.LAB_UNITS, ms.TOTAL_UNITS,
    ms.GRADE_TYPE, ms.GRADE_RULE, ms.min_total_units_by_dept FROM SubjectCodeRanks
    scr JOIN MathSubjects2024 ms ON scr.SUBJECT_CODE = ms.SUBJECT_CODE ) SELECT ic.SUBJECT_CODE,
    ic.SUBJECT_CODE_DESC, ic.DEPARTMENT_NAME, ic.SCHOOL_NAME, ic.window_column, ic.SUBJECT_ID,
    ic.SUBJECT_NUMBER, ic.SUBJECT_SHORT_TITLE, ic.SUBJECT_TITLE, ic.LECTURE_UNITS,
    ic.LAB_UNITS, ic.TOTAL_UNITS, ic.GRADE_TYPE, ic.GRADE_RULE, ic.min_total_units_by_dept,
    ccc.SUBJECT_DESCRIPTION FROM inner_cte ic JOIN CIS_COURSE_CATALOG ccc ON ic.SUBJECT_ID
    = ccc.SUBJECT_ID ORDER BY ic.SCHOOL_NAME, ic.window_column, ic.SUBJECT_NUMBER;
- category: Course Catalog and Department Analysis
  default_granularity: one row per course level of the Mathematics department
  desc: For the Mathematics department, what is the department name, the average of
    the total units, the range of the total units, the variance of the total units
    for courses with total units greater than 0, and for each course level, what is
    the number of unique students and the minimum CIP program code among their courses,
    considering only degree-granting departments? Additionally, for each course level,
    what is the average number of lecture units and the maximum number of lab units
    for Mathematics courses? Do not return any rounded answers.
  id: dw_2272
  name: Math Department Unit Statistics with Course Level Student Counts and Lecture-Lab
    Unit Averages
  sql: WITH inner_cte AS ( WITH department_units_stats AS ( SELECT SIS_DEPARTMENT.DEPARTMENT_NAME,
    AVG(CIS_COURSE_CATALOG.TOTAL_UNITS) AS avg_total_units, MAX(CIS_COURSE_CATALOG.TOTAL_UNITS)
    - MIN(CIS_COURSE_CATALOG.TOTAL_UNITS) AS total_units_range, VARIANCE(CIS_COURSE_CATALOG.TOTAL_UNITS)
    AS total_units_variance FROM SIS_DEPARTMENT JOIN CIS_COURSE_CATALOG ON SIS_DEPARTMENT.DEPARTMENT_CODE
    = CIS_COURSE_CATALOG.DEPARTMENT_CODE JOIN SIS_SUBJECT_CODE ON CIS_COURSE_CATALOG.DEPARTMENT_CODE
    = SIS_SUBJECT_CODE.DEPARTMENT_CODE WHERE CIS_COURSE_CATALOG.TOTAL_UNITS > 0 AND
    SIS_DEPARTMENT.IS_DEGREE_GRANTING = 'Y' AND SIS_DEPARTMENT.DEPARTMENT_NAME = 'Mathematics'
    AND SIS_DEPARTMENT.DEPARTMENT_CODE = '18' GROUP BY SIS_DEPARTMENT.DEPARTMENT_NAME
    ORDER BY total_units_range DESC ), department_student_cip_stats AS ( SELECT sd.DEPARTMENT_NAME,
    scd.COURSE_LEVEL, COUNT(DISTINCT msd.FULL_NAME) AS student_count, MIN(scd.CIP_PROGRAM_CODE)
    AS min_cip_code FROM SIS_COURSE_DESCRIPTION scd JOIN SIS_DEPARTMENT sd ON scd.DEPARTMENT
    = sd.DEPARTMENT_CODE JOIN MIT_STUDENT_DIRECTORY msd ON sd.DEPARTMENT_CODE = msd.DEPARTMENT
    WHERE sd.IS_DEGREE_GRANTING = 'Y' AND sd.DEPARTMENT_NAME = 'Mathematics' GROUP
    BY sd.DEPARTMENT_NAME, scd.COURSE_LEVEL ) SELECT dus.DEPARTMENT_NAME, dus.avg_total_units,
    dus.total_units_range, dus.total_units_variance, dscs.COURSE_LEVEL, dscs.student_count,
    dscs.min_cip_code FROM department_units_stats dus JOIN department_student_cip_stats
    dscs ON dus.DEPARTMENT_NAME = dscs.DEPARTMENT_NAME ) SELECT inner_cte.DEPARTMENT_NAME,
    inner_cte.avg_total_units, inner_cte.total_units_range, inner_cte.total_units_variance,
    inner_cte.COURSE_LEVEL, inner_cte.student_count, inner_cte.min_cip_code, stats.avg_lecture_units,
    stats.max_lab_units FROM inner_cte JOIN ( SELECT scd.COURSE_LEVEL, AVG(ccc.LECTURE_UNITS)
    AS avg_lecture_units, MAX(ccc.LAB_UNITS) AS max_lab_units FROM SIS_COURSE_DESCRIPTION
    scd JOIN CIS_COURSE_CATALOG ccc ON scd.DEPARTMENT = ccc.DEPARTMENT_CODE WHERE
    scd.DEPARTMENT_NAME = 'Mathematics' AND ccc.DEPARTMENT_CODE = '18' AND ccc.TOTAL_UNITS
    > 0 GROUP BY scd.COURSE_LEVEL ) stats ON inner_cte.COURSE_LEVEL = stats.COURSE_LEVEL;
- category: Course Catalog and Department Analysis
  default_granularity: one row per department name per course level
  desc: For each department name and course level, where the total number of enrolled
    students in offered subjects is greater than 10, and the department is Mathematics
    (Course 18), provide the number of unique courses, the minimum total units among
    those subjects that are degree-granting courses, the standard deviation (using
    STDDEV only and never STDDEV_POP) of the total units for Mathematics courses (considering
    only departments that offer more than five courses), and the number of unique
    subject codes for Mathematics in the SIS_SUBJECT_CODE table. List the department
    name, course level, number of unique courses, minimum total units, the standard
    deviation (using STDDEV only and never STDDEV_POP) of total units, and the number
    of unique subject codes, in that order. Do not return any rounded answers.
  id: dw_2335
  name: Math Degree-Granting Course Level Counts with Catalog Unit Stddev and Unique
    Subject Codes
  sql: WITH inner_cte AS ( SELECT d.DEPARTMENT_NAME, c.COURSE_LEVEL, COUNT(DISTINCT
    c.COURSE) AS course_count, MIN(s.TOTAL_UNITS) AS min_total_units FROM SIS_COURSE_DESCRIPTION
    c JOIN SIS_DEPARTMENT d ON c.DEPARTMENT = d.DEPARTMENT_CODE JOIN SUBJECT_OFFERED_SUMMARY
    s ON d.DEPARTMENT_CODE = s.OFFER_DEPT_CODE WHERE s.NUM_ENROLLED_STUDENTS > 10
    AND d.DEPARTMENT_NAME = 'Mathematics' AND c.IS_DEGREE_GRANTING = 'Y' GROUP BY
    d.DEPARTMENT_NAME, c.COURSE_LEVEL ) SELECT inner_cte.DEPARTMENT_NAME, inner_cte.COURSE_LEVEL,
    inner_cte.course_count, inner_cte.min_total_units, subq2.units_stddev, subq3.unique_subject_codes
    FROM inner_cte JOIN ( SELECT s.DEPARTMENT_NAME, STDDEV(c.TOTAL_UNITS) AS units_stddev
    FROM SIS_SUBJECT_CODE s JOIN CIS_COURSE_CATALOG c ON s.DEPARTMENT_CODE = c.DEPARTMENT_CODE
    WHERE c.TOTAL_UNITS IS NOT NULL AND s.DEPARTMENT_NAME = 'Mathematics' GROUP BY
    s.DEPARTMENT_NAME HAVING COUNT(*) > 5 ) subq2 ON inner_cte.DEPARTMENT_NAME = subq2.DEPARTMENT_NAME
    JOIN ( SELECT DEPARTMENT_NAME, COUNT(DISTINCT SUBJECT_CODE) AS unique_subject_codes
    FROM SIS_SUBJECT_CODE WHERE DEPARTMENT_NAME = 'Mathematics' GROUP BY DEPARTMENT_NAME
    ) subq3 ON inner_cte.DEPARTMENT_NAME = subq3.DEPARTMENT_NAME;
- category: Course Catalog and Department Analysis
  default_granularity: one row per top-3 Mathematics course per effective term
  desc: For the top 3 most frequently offered courses in the Mathematics department,
    for each course and each term it was offered, display the course number, course
    description, subject title, number of times offered, department name, number of
    unique course descriptions for that course and department, the minimum CIP program
    code for that course and department, the term code, the term description, the
    school name, and the department phone number. Do not repeat the course number
    if it is the same as the previous row. Sort the table by course number and term
    code. Do not return any rounded answers.
  id: dw_2365
  name: Top 3 Most Offered Math Courses per Term with Description Counts, Min CIP
    Code, and Department Phone
  sql: WITH inner_cte AS ( WITH course_desc_stats AS ( SELECT scd.COURSE, sd.DEPARTMENT_NAME,
    COUNT(DISTINCT scd.COURSE_DESCRIPTION) AS course_description_count, MIN(scd.CIP_PROGRAM_CODE)
    AS min_cip_program_code FROM SIS_COURSE_DESCRIPTION scd JOIN SIS_DEPARTMENT sd
    ON scd.DEPARTMENT = sd.DEPARTMENT_CODE JOIN SIS_ADMIN_DEPARTMENT sad ON sd.DEPARTMENT_CODE
    = sad.SIS_ADMIN_DEPARTMENT_CODE WHERE sd.IS_DEGREE_GRANTING = 'Y' AND sd.DEPARTMENT_NAME
    = 'Mathematics' GROUP BY scd.COURSE, sd.DEPARTMENT_NAME ), top_math_courses AS
    ( SELECT ssc.COURSE_NUMBER, scd.COURSE_DESCRIPTION, ccc.SUBJECT_TITLE, COUNT(*)
    AS offer_count FROM SIS_COURSE_DESCRIPTION scd JOIN SIS_SUBJECT_CODE ssc ON scd.COURSE
    = ssc.SUBJECT_CODE JOIN CIS_COURSE_CATALOG ccc ON ssc.SUBJECT_CODE = ccc.SUBJECT_CODE
    WHERE scd.DEPARTMENT_NAME = 'Mathematics' GROUP BY ssc.COURSE_NUMBER, scd.COURSE_DESCRIPTION,
    ccc.SUBJECT_TITLE ORDER BY offer_count DESC LIMIT 3 ) SELECT tmc.COURSE_NUMBER,
    tmc.COURSE_DESCRIPTION, tmc.SUBJECT_TITLE, tmc.offer_count, cds.DEPARTMENT_NAME,
    cds.course_description_count, cds.min_cip_program_code, scd.FROM_TERM, scd.FROM_TERM_DESCRIPTION,
    scd.SCHOOL_NAME, sad.DEPARTMENT_PHONE_NUMBER FROM top_math_courses tmc JOIN SIS_COURSE_DESCRIPTION
    scd ON tmc.COURSE_DESCRIPTION = scd.COURSE_DESCRIPTION JOIN course_desc_stats
    cds ON scd.COURSE = cds.COURSE AND cds.DEPARTMENT_NAME = 'Mathematics' JOIN SIS_DEPARTMENT
    sd ON scd.DEPARTMENT = sd.DEPARTMENT_CODE JOIN SIS_ADMIN_DEPARTMENT sad ON sd.DEPARTMENT_CODE
    = sad.SIS_ADMIN_DEPARTMENT_CODE WHERE sd.DEPARTMENT_NAME = 'Mathematics' GROUP
    BY tmc.COURSE_NUMBER, tmc.COURSE_DESCRIPTION, tmc.SUBJECT_TITLE, tmc.offer_count,
    cds.DEPARTMENT_NAME, cds.course_description_count, cds.min_cip_program_code, scd.FROM_TERM,
    scd.FROM_TERM_DESCRIPTION, scd.SCHOOL_NAME, sad.DEPARTMENT_PHONE_NUMBER ORDER
    BY tmc.COURSE_NUMBER, scd.FROM_TERM ) SELECT CASE WHEN LAG(COURSE_NUMBER) OVER
    (ORDER BY COURSE_NUMBER, FROM_TERM) = COURSE_NUMBER THEN NULL ELSE COURSE_NUMBER
    END AS COURSE_NUMBER, COURSE_DESCRIPTION, SUBJECT_TITLE, offer_count, DEPARTMENT_NAME,
    course_description_count, min_cip_program_code, FROM_TERM, FROM_TERM_DESCRIPTION,
    SCHOOL_NAME, DEPARTMENT_PHONE_NUMBER FROM inner_cte ORDER BY COURSE_NUMBER, FROM_TERM;
- category: Subject Offering and Faculty Directory Comprehensive Analysis
  default_granularity: one row per Mathematics subject offered this year with responsible
    faculty contact details
  desc: For each department that is Mathematics (Course 18), provide the department's
    name, the range and variance of the total units for subjects offered by that department
    in the academic year 2022 and that are also listed in the CIS course catalog,
    and for all course subjects in the catalog where the department code is 18 (Mathematics),
    the department name is 'Mathematics', and the subject is offered this year, show
    the subject code, subject number, responsible faculty's full name, Moira list
    member, the average office phone number in a window of 2 preceding and 2 following
    rows grouped by the responsible faculty's last name and ordered by the subject
    code, and the email address of the responsible faculty. Do not return any rounded
    answers.
  id: dw_2377
  name: Math 2022 Unit Range-Variance with Offered-This-Year Subjects and Responsible
    Faculty Contact Windows
  sql: WITH inner_cte AS ( SELECT sd.DEPARTMENT_NAME, MAX(ccso.TOTAL_UNITS) - MIN(ccso.TOTAL_UNITS)
    AS units_range, VARIANCE(ccso.TOTAL_UNITS) AS units_variance FROM COURSE_CATALOG_SUBJECT_OFFERED
    ccso JOIN SIS_DEPARTMENT sd ON ccso.DEPARTMENT_CODE = sd.DEPARTMENT_CODE JOIN
    CIS_COURSE_CATALOG ccc ON sd.DEPARTMENT_CODE = ccc.DEPARTMENT_CODE WHERE ccso.ACADEMIC_YEAR
    = 2022 AND sd.DEPARTMENT_NAME = 'Mathematics' AND sd.DEPARTMENT_CODE = '18' GROUP
    BY sd.DEPARTMENT_NAME ORDER BY units_range DESC ) SELECT inner_cte.DEPARTMENT_NAME,
    inner_cte.units_range, inner_cte.units_variance, c.SUBJECT_CODE, c.SUBJECT_NUMBER,
    c.DEPARTMENT_NAME AS SUBJECT_DEPARTMENT_NAME, ed.FULL_NAME AS RESPONSIBLE_FACULTY_FULL_NAME,
    mld.MOIRA_LIST_MEMBER, AVG(ed.OFFICE_PHONE) OVER ( PARTITION BY ed.LAST_NAME ORDER
    BY c.SUBJECT_CODE ROWS BETWEEN 2 PRECEDING AND 2 FOLLOWING ) AS AVG_OFFICE_PHONE_WINDOW,
    ed.EMAIL_ADDRESS AS RESPONSIBLE_FACULTY_EMAIL FROM inner_cte JOIN COURSE_CATALOG_SUBJECT_OFFERED
    c ON inner_cte.DEPARTMENT_NAME = c.DEPARTMENT_NAME JOIN EMPLOYEE_DIRECTORY ed
    ON c.RESPONSIBLE_FACULTY_MIT_ID = ed.MIT_ID LEFT JOIN MOIRA_LIST_DETAIL mld ON
    ed.MIT_ID = mld.MOIRA_LIST_MEMBER_MIT_ID WHERE c.DEPARTMENT_CODE = 18 AND c.DEPARTMENT_NAME
    = 'Mathematics' AND c.IS_OFFERED_THIS_YEAR = 'Y' ORDER BY c.SUBJECT_CODE;
- category: Course Catalog and Department Analysis
  default_granularity: one row per department name per course level
  desc: For each department name and course level where the course is degree granting
    and the total units are greater than 6, provide the number of unique courses,
    the minimum total units offered, and the number of courses where the design units
    are at least 3. Do not return any rounded answers.
  id: dw_3163
  name: Degree-Granting Course Level Counts with Min Total Units and Design-Unit Course
    Counts
  sql: WITH inner_cte AS ( SELECT scd.DEPARTMENT_NAME, scd.COURSE_LEVEL, COUNT(DISTINCT
    scd.COURSE) AS course_count, MIN(ccc.TOTAL_UNITS) AS min_total_units FROM SIS_COURSE_DESCRIPTION
    scd JOIN SIS_DEPARTMENT sd ON scd.DEPARTMENT = sd.DEPARTMENT_CODE JOIN CIS_COURSE_CATALOG
    ccc ON sd.DEPARTMENT_CODE = ccc.DEPARTMENT_CODE WHERE scd.IS_DEGREE_GRANTING =
    'Y' AND ccc.TOTAL_UNITS > 6 GROUP BY scd.DEPARTMENT_NAME, scd.COURSE_LEVEL ) SELECT
    ic.DEPARTMENT_NAME, ic.COURSE_LEVEL, ic.course_count, ic.min_total_units, COUNT(DISTINCT
    CASE WHEN ccc.DESIGN_UNITS >= 3 THEN scd.COURSE END) AS courses_with_design_units_3_or_more
    FROM inner_cte ic JOIN SIS_COURSE_DESCRIPTION scd ON ic.DEPARTMENT_NAME = scd.DEPARTMENT_NAME
    AND ic.COURSE_LEVEL = scd.COURSE_LEVEL JOIN SIS_DEPARTMENT sd ON scd.DEPARTMENT
    = sd.DEPARTMENT_CODE JOIN CIS_COURSE_CATALOG ccc ON sd.DEPARTMENT_CODE = ccc.DEPARTMENT_CODE
    WHERE scd.IS_DEGREE_GRANTING = 'Y' AND ccc.TOTAL_UNITS > 6 GROUP BY ic.DEPARTMENT_NAME,
    ic.COURSE_LEVEL, ic.course_count, ic.min_total_units;
- category: Library Reserve and Course Catalog Comprehensive Analysis
  default_granularity: one row per library subject with status-U reserve materials
    matched with department unit statistics
  desc: For each course that has more than 0 enrolled students and a material status
    key of 'U', list the course number, course number description, number of enrolled
    students, reserve catalog key, and the dense rank over the material status key
    ordered by material status key, along with the department name, the range, variance,
    and standard deviation (using STDDEV only and never STDDEV_POP) of the total units
    of courses offered by that department (considering only courses offered this year
    with non-null total units). Present the results ordered by course number and course
    number description. Do not return any rounded answers.
  id: dw_3311
  name: Status-U Library Subjects with Enrollment Matched with Department Offered-This-Year
    Unit Dispersion
  sql: WITH DeptStats AS ( SELECT scd.DEPARTMENT_NAME, MAX(ccc.total_units) - MIN(ccc.total_units)
    AS total_units_range, VARIANCE(ccc.total_units) AS total_units_variance, STDDEV(ccc.total_units)
    AS total_units_stddev FROM SIS_COURSE_DESCRIPTION scd JOIN SIS_SUBJECT_CODE ssc
    ON scd.COURSE = ssc.SUBJECT_CODE JOIN CIS_COURSE_CATALOG ccc ON ssc.SUBJECT_CODE
    = ccc.SUBJECT_CODE WHERE ccc.IS_OFFERED_THIS_YEAR = 'Y' AND ccc.total_units IS
    NOT NULL GROUP BY scd.DEPARTMENT_NAME ORDER BY total_units_range DESC ), SubjectEnroll
    AS ( SELECT t1.COURSE_NUMBER, t1.COURSE_NUMBER_DESC, t1.NUM_ENROLLED_STUDENTS,
    t2.LIBRARY_RESERVE_CATALOG_KEY, DENSE_RANK() OVER (PARTITION BY t2.LIBRARY_MATERIAL_STATUS_KEY
    ORDER BY t2.LIBRARY_MATERIAL_STATUS_KEY) AS window_column, t1.OFFER_DEPT_NAME
    FROM LIBRARY_SUBJECT_OFFERED t1 JOIN LIBRARY_RESERVE_MATRL_DETAIL t2 ON t1.SUBJECT_ID
    = t2.SUBJECT_ID WHERE t1.NUM_ENROLLED_STUDENTS > 0 AND t2.LIBRARY_MATERIAL_STATUS_KEY
    = 'U' ), CombinedResults AS ( SELECT s.COURSE_NUMBER, s.COURSE_NUMBER_DESC, s.NUM_ENROLLED_STUDENTS,
    s.LIBRARY_RESERVE_CATALOG_KEY, s.window_column, d.DEPARTMENT_NAME, d.total_units_range,
    d.total_units_variance, d.total_units_stddev FROM SubjectEnroll s JOIN DeptStats
    d ON s.OFFER_DEPT_NAME = d.DEPARTMENT_NAME ) SELECT * FROM CombinedResults ORDER
    BY COURSE_NUMBER, COURSE_NUMBER_DESC;
- category: Subject Offering and Course Catalog Comprehensive Analysis
  default_granularity: one row per subject code row or per 2012SU cluster-S subject
    row
  desc: 'Show, for each subject, the subject code, subject code description, department
    name, subject title, and the dense rank of each row partitioned by the school
    code and ordered by school code for subjects where the school code is not null
    and the subject title is not null; and for subjects offered in the 2012SU term
    with a cluster type of ''S'', show the subject title from SUBJECT_OFFERED, the
    offer department name, the total units from SUBJECT_SUMMARY, and assign row numbers
    within a window of 2 preceding and 1 following rows ordered by the subject title.
    Indicate the source of each row as either ''Subq1'' or ''Subq2''. List all results
    together, showing the columns: subject code, subject code description, department
    name, subject title, dense rank by school, offer department name, total units,
    row number window, and source, in that order, ordered by subject title. Do not
    return any rounded answers.'
  id: dw_3590
  name: Union of Subject Code School Dense Ranks and 2012SU Cluster-S Subject Unit
    Row Numbers
  sql: WITH Subq1 AS ( SELECT t0.SUBJECT_CODE, t0.SUBJECT_CODE_DESC, t0.DEPARTMENT_NAME,
    t1.SUBJECT_TITLE, DENSE_RANK() OVER (PARTITION BY t0.SCHOOL_CODE ORDER BY t0.SCHOOL_CODE)
    AS window_column, t1.SUBJECT_ID FROM SIS_SUBJECT_CODE t0 JOIN CIS_COURSE_CATALOG
    t1 ON t0.DEPARTMENT_CODE = t1.DEPARTMENT_CODE WHERE t0.SCHOOL_CODE IS NOT NULL
    AND t1.SUBJECT_TITLE IS NOT NULL ), Subq2 AS ( SELECT t0.SUBJECT_TITLE, t0.OFFER_DEPT_NAME,
    t1.TOTAL_UNITS, ROW_NUMBER() OVER (ORDER BY t0.SUBJECT_TITLE ROWS BETWEEN 2 PRECEDING
    AND 1 FOLLOWING) AS window_column, t0.SUBJECT_ID FROM SUBJECT_OFFERED t0 JOIN
    SUBJECT_SUMMARY t1 ON t0.SUBJECT_ID = t1.SUBJECT_ID WHERE t0.TERM_CODE = '2012SU'
    AND t1.CLUSTER_TYPE = 'S' ), CombinedSubjects AS ( SELECT s1.SUBJECT_CODE, s1.SUBJECT_CODE_DESC,
    s1.DEPARTMENT_NAME, s1.SUBJECT_TITLE, s1.window_column AS dense_rank_by_school,
    NULL AS OFFER_DEPT_NAME, NULL AS TOTAL_UNITS, NULL AS row_number_window, 'Subq1'
    AS Source FROM Subq1 s1 UNION ALL SELECT NULL AS SUBJECT_CODE, NULL AS SUBJECT_CODE_DESC,
    NULL AS DEPARTMENT_NAME, s2.SUBJECT_TITLE, NULL AS dense_rank_by_school, s2.OFFER_DEPT_NAME,
    s2.TOTAL_UNITS, s2.window_column AS row_number_window, 'Subq2' AS Source FROM
    Subq2 s2 ) SELECT SUBJECT_CODE, SUBJECT_CODE_DESC, DEPARTMENT_NAME, SUBJECT_TITLE,
    dense_rank_by_school, OFFER_DEPT_NAME, TOTAL_UNITS, row_number_window, Source
    FROM CombinedSubjects ORDER BY SUBJECT_TITLE;
- category: Subject Offering and Course Catalog Comprehensive Analysis
  default_granularity: single count row
  desc: How many subjects offered in the 2014 January term by the Harvard Cross-Enrollment
    Program and the Chemistry department are listed in the course catalog as being
    offered in the academic year? Do not return any rounded answers.
  id: dw_5279
  name: 2014JA Cross-Enrollment and Chemistry Subjects Listed as Offered in Academic
    Year Count
  sql: SELECT COUNT(*) AS num_subjects FROM SUBJECT_OFFERED so JOIN CIS_COURSE_CATALOG
    ccc ON so.MASTER_SUBJECT_ID = ccc.MASTER_SUBJECT_ID WHERE so.TERM_CODE = '2014JA'
    AND so.OFFER_DEPT_NAME = 'Harvard Cross-Enrollment Prog' AND so.OFFER_DEPT_NAME
    = 'Chemistry' AND ccc.ACADEMIC_YEAR = 'Y';
  category_note: The two OFFER_DEPT_NAME equality filters are mutually exclusive,
    so this count is structurally zero; retained verbatim per the source SQL.
- category: Course Catalog Analysis
  default_granularity: one row per HASS attribute
  desc: For each HASS attribute, what is the range and variance of the total units
    for subjects offered in the 2022 academic year by the Political Science department,
    along with the HASS attribute's description as shown on the form and the description
    in the bulletin? Do not return any rounded answers.
  id: dw_538
  name: Political Science 2022 Catalog Subjects Total Units Range and Variance per
    HASS Attribute with Form and Bulletin Descriptions
  sql: WITH inner_cte AS ( SELECT c.HASS_ATTRIBUTE, a.DESCRIPTION_ON_FORM, MAX(c.TOTAL_UNITS)
    - MIN(c.TOTAL_UNITS) AS units_range, VARIANCE(c.TOTAL_UNITS) AS units_variance
    FROM COURSE_CATALOG_SUBJECT_OFFERED c JOIN CIS_HASS_ATTRIBUTE a ON c.HASS_ATTRIBUTE
    = a.HASS_ATTRIBUTE WHERE c.ACADEMIC_YEAR = 2022 AND c.DEPARTMENT_NAME = 'Political
    Science' GROUP BY c.HASS_ATTRIBUTE, a.DESCRIPTION_ON_FORM ) SELECT ic.HASS_ATTRIBUTE,
    ic.DESCRIPTION_ON_FORM, a.DESCRIPTION_IN_BULLETIN, ic.units_range, ic.units_variance
    FROM inner_cte ic JOIN CIS_HASS_ATTRIBUTE a ON ic.HASS_ATTRIBUTE = a.HASS_ATTRIBUTE
    ORDER BY ic.units_range DESC;
- id: dw_104
  name: Math 2022 Bulletin-Printed Subject Total Units Deviation from Department Average
  desc: For subjects offered in the academic year 2022 that are printed in the bulletin
    and belong to the Mathematics department (Course 18), show the subject title,
    department name, total units, and the difference between the total units of each
    subject and the average total units for Mathematics subjects in 2022. Do not return
    any rounded answers.
  category: Course Catalog and Department Analysis
  sql: WITH inner_cte AS ( SELECT c.SUBJECT_TITLE, d.DEPARTMENT_NAME, c.TOTAL_UNITS
    FROM COURSE_CATALOG_SUBJECT_OFFERED c JOIN SIS_DEPARTMENT d ON c.DEPARTMENT_CODE
    = d.DEPARTMENT_CODE WHERE c.ACADEMIC_YEAR = 2022 AND c.IS_PRINTED_IN_BULLETIN
    = 'Y' AND c.DEPARTMENT_CODE = '18' AND d.DEPARTMENT_NAME = 'Mathematics' ) , avg_units
    AS ( SELECT AVG(TOTAL_UNITS) AS avg_total_units FROM inner_cte ) SELECT i.SUBJECT_TITLE,
    i.DEPARTMENT_NAME, i.TOTAL_UNITS, (i.TOTAL_UNITS - a.avg_total_units) AS deviation_from_avg_units
    FROM inner_cte i CROSS JOIN avg_units a;
  default_granularity: one row per bulletin-printed Mathematics subject offered in
    2022
- id: dw_1471
  name: Math 2024 12-Unit Subjects Ranked by School with Department Unit Dispersion
    and Communication Intensive Counts
  desc: 'For subjects offered in the academic year 2024 with a total of 12 units in
    the Mathematics department (Course 18), show the subject code, subject title,
    department name, school name, and the rank within each school name group ordered
    by subject code, but only include those subjects whose total units exceed the
    average total units for their respective school. Additionally, for the Mathematics
    department, also show the average, variance, and standard deviation (using STDDEV
    only and never STDDEV_POP) of the total units for subjects offered by that department
    (considering only subjects that are offered this year, are letter graded, and
    are in the Mathematics department), as well as the number of subjects that are
    Communication Intensive (i.e., have a non-null COMM_REQ_ATTRIBUTE), with these
    statistics included for each subject in the result. Present the columns in the
    following order: subject code, subject title, department name, school name, rank
    within school, average total units, total units variance, total units standard
    deviation (using STDDEV only and never STDDEV_POP), and number of Communication
    Intensive subjects. Do not return any rounded answers.'
  category: Course Catalog and Department Analysis
  sql: WITH Subquery1 AS ( WITH inner_cte AS ( SELECT t1.SUBJECT_CODE, t1.SUBJECT_TITLE,
    t1.DEPARTMENT_NAME, t0.SCHOOL_NAME, t1.TOTAL_UNITS, RANK() OVER (PARTITION BY
    t0.SCHOOL_NAME ORDER BY t1.SUBJECT_CODE) AS window_column FROM SIS_DEPARTMENT
    t0 JOIN COURSE_CATALOG_SUBJECT_OFFERED t1 ON t0.DEPARTMENT_CODE = t1.DEPARTMENT_CODE
    WHERE t1.ACADEMIC_YEAR = 2024 AND t1.TOTAL_UNITS = 12 AND t1.DEPARTMENT_NAME =
    'Mathematics' ), school_avg AS ( SELECT SCHOOL_NAME, AVG(TOTAL_UNITS) AS avg_units
    FROM ( SELECT t0.SCHOOL_NAME, t1.TOTAL_UNITS FROM SIS_DEPARTMENT t0 JOIN COURSE_CATALOG_SUBJECT_OFFERED
    t1 ON t0.DEPARTMENT_CODE = t1.DEPARTMENT_CODE WHERE t1.ACADEMIC_YEAR = 2024 AND
    t1.DEPARTMENT_NAME = 'Mathematics' ) sub GROUP BY SCHOOL_NAME ) SELECT i.SUBJECT_CODE,
    i.SUBJECT_TITLE, i.DEPARTMENT_NAME, i.SCHOOL_NAME, i.window_column FROM inner_cte
    i JOIN school_avg s ON i.SCHOOL_NAME = s.SCHOOL_NAME WHERE i.TOTAL_UNITS > s.avg_units
    ), Subquery2 AS ( WITH inner_cte AS ( SELECT ssc.DEPARTMENT_NAME, ccso.SUBJECT_CODE,
    ccso.TOTAL_UNITS FROM SIS_SUBJECT_CODE ssc JOIN SIS_COURSE_DESCRIPTION scd ON
    ssc.SUBJECT_CODE = scd.COURSE JOIN COURSE_CATALOG_SUBJECT_OFFERED ccso ON scd.COURSE
    = ccso.SUBJECT_CODE WHERE ccso.IS_OFFERED_THIS_YEAR = 'Y' AND ccso.GRADE_TYPE
    = 'L' AND ssc.DEPARTMENT_NAME = 'Mathematics' AND ssc.DEPARTMENT_NAME = 'Mathematics'
    ) SELECT ic.DEPARTMENT_NAME, AVG(ic.TOTAL_UNITS) AS avg_total_units, VARIANCE(ic.TOTAL_UNITS)
    AS total_units_variance, STDDEV(ic.TOTAL_UNITS) AS total_units_stddev, COUNT(DISTINCT
    CASE WHEN ccso.COMM_REQ_ATTRIBUTE IS NOT NULL THEN ic.SUBJECT_CODE END) AS comm_intensive_subject_count
    FROM inner_cte ic JOIN COURSE_CATALOG_SUBJECT_OFFERED ccso ON ic.SUBJECT_CODE
    = ccso.SUBJECT_CODE GROUP BY ic.DEPARTMENT_NAME ORDER BY comm_intensive_subject_count
    DESC ) SELECT s1.SUBJECT_CODE, s1.SUBJECT_TITLE, s1.DEPARTMENT_NAME, s1.SCHOOL_NAME,
    s1.window_column, s2.avg_total_units, s2.total_units_variance, s2.total_units_stddev,
    s2.comm_intensive_subject_count FROM Subquery1 s1 JOIN Subquery2 s2 ON s1.DEPARTMENT_NAME
    = s2.DEPARTMENT_NAME ORDER BY s1.SCHOOL_NAME, s1.window_column;
  default_granularity: one row per 2024 Mathematics 12-unit subject above its school's
    average total units
- category: Course Catalog and Textbook Material Comprehensive Analysis
  default_granularity: one row per 2024 Mathematics 12-unit subject matched with 2019FA
    TIP offering
  desc: For subjects offered in the academic year 2024 with total units equal to 12
    in the Mathematics department, show the department code, department name, subject
    code, subject number, subject title, total units, the row number within each department
    ordered by subject code, the deviation of each subject's total units from the
    average total units of all Mathematics subjects offered in 2024, the number of
    enrolled students, responsible faculty name, school name, and the dense rank over
    the department name ordered by department name for those subjects that also have
    course materials and were offered in the term '2019FA'. Sort the table by department
    name and subject title. Do not return any rounded answers.
  id: dw_1758
  name: Math 2024 12-Unit Subjects Row Numbers and Unit Deviations Matched with 2019FA
    TIP Course-Material Offerings
  sql: WITH subq1 AS ( WITH inner_cte AS ( SELECT t0.DEPARTMENT_CODE, t0.DEPARTMENT_NAME,
    t1.SUBJECT_CODE, t1.SUBJECT_NUMBER, t1.SUBJECT_TITLE, t1.TOTAL_UNITS, ROW_NUMBER()
    OVER (PARTITION BY t0.DEPARTMENT_CODE ORDER BY t1.SUBJECT_CODE) AS window_column
    FROM SIS_DEPARTMENT t0 JOIN COURSE_CATALOG_SUBJECT_OFFERED t1 ON t0.DEPARTMENT_CODE
    = t1.DEPARTMENT_CODE WHERE t1.ACADEMIC_YEAR = 2024 AND t1.TOTAL_UNITS = 12 AND
    t0.DEPARTMENT_NAME = 'Mathematics' ), math_avg AS ( SELECT t0.DEPARTMENT_CODE,
    AVG(t1.TOTAL_UNITS) AS avg_total_units FROM SIS_DEPARTMENT t0 JOIN COURSE_CATALOG_SUBJECT_OFFERED
    t1 ON t0.DEPARTMENT_CODE = t1.DEPARTMENT_CODE WHERE t1.ACADEMIC_YEAR = 2024 AND
    t0.DEPARTMENT_NAME = 'Mathematics' GROUP BY t0.DEPARTMENT_CODE ) SELECT i.DEPARTMENT_CODE,
    i.DEPARTMENT_NAME, i.SUBJECT_CODE, i.SUBJECT_NUMBER, i.SUBJECT_TITLE, i.TOTAL_UNITS,
    i.window_column, (i.TOTAL_UNITS - m.avg_total_units) AS deviation_from_avg FROM
    inner_cte i JOIN math_avg m ON i.DEPARTMENT_CODE = m.DEPARTMENT_CODE ), subq2
    AS ( WITH inner_cte AS ( SELECT t0.SUBJECT_TITLE, t0.NUM_ENROLLED_STUDENTS, t0.RESPONSIBLE_FACULTY_NAME,
    t1.DEPARTMENT_NAME, t1.SCHOOL_NAME, DENSE_RANK() OVER (PARTITION BY t1.DEPARTMENT_NAME
    ORDER BY t1.DEPARTMENT_NAME) AS window_column FROM TIP_SUBJECT_OFFERED t0 JOIN
    SIS_DEPARTMENT t1 ON t0.OFFER_DEPT_CODE = t1.DEPARTMENT_CODE JOIN SIS_COURSE_DESCRIPTION
    t2 ON t1.DEPARTMENT_CODE = t2.DEPARTMENT WHERE t0.TERM_CODE = '2019FA' AND t1.DEPARTMENT_NAME
    = 'Mathematics' AND t0.IS_NO_COURSE_MATERIAL = 'N' ) SELECT CASE WHEN LAG(DEPARTMENT_NAME)
    OVER (ORDER BY DEPARTMENT_NAME, SUBJECT_TITLE) = DEPARTMENT_NAME THEN NULL ELSE
    DEPARTMENT_NAME END AS department_name, SUBJECT_TITLE, NUM_ENROLLED_STUDENTS,
    RESPONSIBLE_FACULTY_NAME, SCHOOL_NAME, window_column FROM inner_cte ORDER BY DEPARTMENT_NAME,
    SUBJECT_TITLE ) SELECT s1.DEPARTMENT_CODE, s1.DEPARTMENT_NAME, s1.SUBJECT_CODE,
    s1.SUBJECT_NUMBER, s1.SUBJECT_TITLE, s1.TOTAL_UNITS, s1.window_column AS subject_row_number,
    s1.deviation_from_avg, s2.NUM_ENROLLED_STUDENTS, s2.RESPONSIBLE_FACULTY_NAME,
    s2.SCHOOL_NAME, s2.window_column AS department_dense_rank FROM subq1 s1 LEFT JOIN
    subq2 s2 ON s1.DEPARTMENT_NAME = s2.department_name AND s1.SUBJECT_TITLE = s2.SUBJECT_TITLE
    ORDER BY s1.DEPARTMENT_NAME, s1.SUBJECT_TITLE;
- category: Course Catalog and Facility Space Comprehensive Analysis
  default_granularity: one row per department-grade-type rollup row matched with organization
    room area statistics
  desc: For each department and subject grade type where the subject is offered in
    the current academic year, is letter graded, and the department is Mathematics
    (Course 18), provide the number of subjects, the minimum total units, the school
    name, the department phone number, the organization name, the standard deviation
    (using STDDEV only and never STDDEV_POP) of the areas of its rooms, and the department's
    DLC name, including subtotals for each department (the corresponding department
    field is 'SUBTOTAL') and a grand total across all departments (the corresponding
    department field is 'TOTAL'). Do not repeat the department if it is the same as
    the previous row. Only include organizations that have more than 5 rooms, are
    associated with a non-null DLC key, and are not the 'ADMISSIONS' department or
    the 'Political Science' department. Sort the table by department, grade type,
    and descending standard deviation (using STDDEV only and never STDDEV_POP) of
    room areas. Do not return any rounded answers.
  id: dw_1833
  name: Math Letter-Graded Subject Rollup by Grade Type with Organization Room Area
    Stddev and DLC Name
  sql: WITH inner_cte1 AS ( SELECT d.DEPARTMENT_NAME, c.GRADE_TYPE, COUNT(c.SUBJECT_ID)
    AS subject_count, MIN(c.TOTAL_UNITS) AS min_total_units FROM SIS_DEPARTMENT d
    JOIN COURSE_CATALOG_SUBJECT_OFFERED c ON d.DEPARTMENT_CODE = c.DEPARTMENT_CODE
    WHERE c.IS_OFFERED_THIS_YEAR = 'Y' AND c.GRADE_TYPE = 'L' AND d.DEPARTMENT_NAME
    = 'Mathematics' AND d.DEPARTMENT_CODE = '18' GROUP BY d.DEPARTMENT_NAME, c.GRADE_TYPE
    ), cte1 AS ( SELECT CASE WHEN LAG(dept) OVER (ORDER BY dept_sort, grade_type)
    = dept THEN NULL ELSE dept END AS department, grade_type, subject_count, min_total_units,
    sd.SCHOOL_NAME AS school_name, ad.DEPARTMENT_PHONE_NUMBER AS department_phone,
    sd.DLC_KEY AS dlc_key FROM ( SELECT CASE WHEN GROUPING(DEPARTMENT_NAME) = 1 THEN
    'zzz' ELSE DEPARTMENT_NAME END AS dept_sort, CASE WHEN GROUPING(DEPARTMENT_NAME)
    = 1 THEN 'TOTAL' ELSE DEPARTMENT_NAME END AS dept, GRADE_TYPE AS grade_type, COUNT(SUBJECT_COUNT)
    AS subject_count, MIN(min_total_units) AS min_total_units FROM inner_cte1 GROUP
    BY DEPARTMENT_NAME, GRADE_TYPE WITH ROLLUP ) tbltmp LEFT JOIN SIS_DEPARTMENT sd
    ON tbltmp.dept = sd.DEPARTMENT_NAME LEFT JOIN SIS_ADMIN_DEPARTMENT ad ON sd.DEPARTMENT_CODE
    = ad.SIS_ADMIN_DEPARTMENT_CODE ), inner_cte2 AS ( SELECT o.ORGANIZATION_NAME,
    STDDEV(r.AREA) AS area_stddev, o.DLC_KEY FROM FCLT_ORG_DLC_KEY d JOIN FCLT_ORGANIZATION
    o ON d.FCLT_ORGANIZATION_KEY = o.FCLT_ORGANIZATION_KEY JOIN FCLT_ROOMS r ON o.FCLT_ORGANIZATION_KEY
    = r.FCLT_ORGANIZATION_KEY WHERE d.DLC_KEY IS NOT NULL AND o.ORGANIZATION_NAME
    NOT IN ('ADMISSIONS') AND o.ORGANIZATION_NAME <> 'Political Science' GROUP BY
    o.ORGANIZATION_NAME, o.DLC_KEY HAVING COUNT(*) > 5 ), cte2 AS ( SELECT inner_cte2.ORGANIZATION_NAME,
    inner_cte2.area_stddev, o2.DLC_NAME, inner_cte2.DLC_KEY FROM inner_cte2 JOIN FCLT_ORGANIZATION
    o2 ON inner_cte2.DLC_KEY = o2.DLC_KEY ) SELECT cte1.department, cte1.grade_type,
    cte1.subject_count, cte1.min_total_units, cte1.school_name, cte1.department_phone,
    cte2.ORGANIZATION_NAME, cte2.area_stddev, cte2.DLC_NAME FROM cte1 LEFT JOIN cte2
    ON cte1.dlc_key = cte2.DLC_KEY ORDER BY cte1.department, cte1.grade_type, cte2.area_stddev
    DESC;
- category: Course Catalog and Department Analysis
  default_granularity: one row per degree-granting department matched with Political
    Science HGN statistics
  desc: For each department that grants degrees (excluding the Biology department),
    provide the department name, the average and variance of the total units for subjects
    offered by that department in the 2022 academic year, and, if the department is
    Political Science, also include for each HGN code the maximum number of lecture
    units among all subjects in the course catalog and the subject title from the
    subject offered table for subjects offered in the year 2012 with more than 2 lecture
    units, as well as the number of enrolled students for those subjects. List the
    results ordered by the variance of total units in descending order, and for Political
    Science, by the maximum lecture units in descending order. Do not return any rounded
    answers.
  id: dw_2151
  name: Degree-Granting Department 2022 Unit Average-Variance with Political Science
    HGN Lecture Unit Maximums
  sql: WITH inner_cte AS ( SELECT d.DEPARTMENT_NAME, AVG(s.TOTAL_UNITS) AS avg_units,
    VARIANCE(s.TOTAL_UNITS) AS units_variance FROM SIS_DEPARTMENT d JOIN COURSE_CATALOG_SUBJECT_OFFERED
    s ON d.DEPARTMENT_CODE = s.DEPARTMENT_CODE WHERE s.ACADEMIC_YEAR = 2022 AND d.IS_DEGREE_GRANTING
    = 'Y' AND d.DEPARTMENT_CODE <> '7' GROUP BY d.DEPARTMENT_NAME ORDER BY units_variance
    DESC ) , PoliSciHGNStats AS ( SELECT c.HGN_CODE, c.DEPARTMENT_NAME, MAX(c.LECTURE_UNITS)
    AS max_lecture_units, s.SUBJECT_TITLE, so.NUM_ENROLLED_STUDENTS FROM COURSE_CATALOG_SUBJECT_OFFERED
    c JOIN SUBJECT_OFFERED s ON c.HGN_CODE = s.HGN_CODE JOIN SUBJECT_OFFERED so ON
    s.SUBJECT_KEY = so.SUBJECT_KEY WHERE c.ACADEMIC_YEAR = 2012 AND c.LECTURE_UNITS
    > 2 AND c.DEPARTMENT_NAME = 'Political Science' GROUP BY c.HGN_CODE, c.DEPARTMENT_NAME,
    s.SUBJECT_TITLE, so.NUM_ENROLLED_STUDENTS HAVING MAX(c.LECTURE_UNITS) > 2 ) SELECT
    d.DEPARTMENT_NAME, d.avg_units, d.units_variance, p.HGN_CODE, p.max_lecture_units,
    p.SUBJECT_TITLE, p.NUM_ENROLLED_STUDENTS FROM inner_cte d LEFT JOIN PoliSciHGNStats
    p ON d.DEPARTMENT_NAME = p.DEPARTMENT_NAME ORDER BY d.units_variance DESC, p.max_lecture_units
    DESC
- category: Textbook Material and Subject Offering Comprehensive Analysis
  default_granularity: one row per 2022 Mathematics TIP subject offering with department
    unit statistics
  desc: For each subject offered in the 2022 academic year by a degree-granting department,
    specifically in the Department of Mathematics (Course 18) and excluding subjects
    offered by the Department of Physics, provide the subject ID, subject title, department
    name, the number of enrolled students, the total number of lecture units, and,
    for each subject, indicate whether it is also offered as a joint subject with
    another department. Additionally, show the range and variance of the total units
    for letter graded subjects offered this year in the Mathematics department. List
    the results in order of subject ID. Do not return any rounded answers.
  id: dw_2158
  name: Math 2022 TIP Subjects with Joint-Subject Flag and Letter-Graded Unit Range-Variance
  sql: WITH inner_cte AS ( SELECT tso.SUBJECT_ID, ccso.SUBJECT_TITLE, sd.DEPARTMENT_NAME,
    tso.NUM_ENROLLED_STUDENTS, ccso.LECTURE_UNITS, sd.DEPARTMENT_CODE FROM TIP_SUBJECT_OFFERED
    tso JOIN SIS_DEPARTMENT sd ON tso.OFFER_DEPT_CODE = sd.DEPARTMENT_CODE JOIN COURSE_CATALOG_SUBJECT_OFFERED
    ccso ON tso.SUBJECT_ID = ccso.SUBJECT_ID AND ccso.ACADEMIC_YEAR = 2022 AND ccso.DEPARTMENT_CODE
    = sd.DEPARTMENT_CODE WHERE sd.IS_DEGREE_GRANTING = 'Y' AND sd.DEPARTMENT_NAME
    = 'Mathematics' AND sd.DEPARTMENT_NAME <> 'Physics' ), MathDeptUnitStats AS (
    SELECT DEPARTMENT_NAME, DEPARTMENT_CODE, MAX(TOTAL_UNITS) - MIN(TOTAL_UNITS) AS
    total_units_range, VARIANCE(TOTAL_UNITS) AS total_units_variance FROM COURSE_CATALOG_SUBJECT_OFFERED
    WHERE IS_OFFERED_THIS_YEAR = 'Y' AND GRADE_TYPE = 'L' AND DEPARTMENT_NAME = 'Mathematics'
    AND DEPARTMENT_CODE = '18' AND TOTAL_UNITS IS NOT NULL GROUP BY DEPARTMENT_NAME,
    DEPARTMENT_CODE ) SELECT ic.SUBJECT_ID, ic.SUBJECT_TITLE, ic.DEPARTMENT_NAME,
    ic.NUM_ENROLLED_STUDENTS, ic.LECTURE_UNITS, CASE WHEN ccs.JOINT_SUBJECTS IS NOT
    NULL AND TRIM(ccs.JOINT_SUBJECTS) <> '' THEN 'Y' ELSE 'N' END AS IS_JOINT_SUBJECT,
    mds.total_units_range, mds.total_units_variance FROM inner_cte ic JOIN COURSE_CATALOG_SUBJECT_OFFERED
    ccs ON ic.SUBJECT_ID = ccs.SUBJECT_ID AND ccs.ACADEMIC_YEAR = 2022 AND ccs.DEPARTMENT_CODE
    = ic.DEPARTMENT_CODE JOIN MathDeptUnitStats mds ON ic.DEPARTMENT_NAME = mds.DEPARTMENT_NAME
    AND ic.DEPARTMENT_CODE = mds.DEPARTMENT_CODE ORDER BY ic.SUBJECT_ID;
- category: Course Catalog and Department Analysis
  default_granularity: one row per department per subject code with fall-only offering
    enrollment average
  desc: Show the department names, the corresponding SIS subject code, subject code
    descriptions, graduate level, the total number of courses per department, and
    the average number of enrolled students for each subject in the department, considering
    only subjects that are offered in the fall term and are not offered in the summer
    term. Do not return any rounded answers.
  id: dw_2398
  name: Department Course Counts with Fall-Only Non-Summer Subject Average TIP Enrollment
  sql: WITH inner_cte AS ( SELECT sd.DEPARTMENT_NAME, sc.SUBJECT_CODE, sc.SUBJECT_CODE_DESC,
    scd.GRADUATE_LEVEL, COUNT(DISTINCT scd.COURSE) AS Total_Courses FROM SIS_DEPARTMENT
    sd JOIN SIS_COURSE_DESCRIPTION scd ON sd.DEPARTMENT_CODE = scd.DEPARTMENT JOIN
    SIS_SUBJECT_CODE sc ON scd.COURSE = sc.COURSE_NUMBER GROUP BY sd.DEPARTMENT_NAME,
    sc.SUBJECT_CODE, sc.SUBJECT_CODE_DESC, scd.GRADUATE_LEVEL ) SELECT icte.DEPARTMENT_NAME,
    icte.SUBJECT_CODE, icte.SUBJECT_CODE_DESC, icte.GRADUATE_LEVEL, icte.Total_Courses,
    AVG(tso.NUM_ENROLLED_STUDENTS) AS avg_enrollment FROM inner_cte icte JOIN TIP_SUBJECT_OFFERED
    tso ON icte.SUBJECT_CODE = tso.COURSE_NUMBER JOIN SIS_DEPARTMENT sd ON tso.OFFER_DEPT_CODE
    = sd.DEPARTMENT_CODE AND sd.DEPARTMENT_NAME = icte.DEPARTMENT_NAME JOIN COURSE_CATALOG_SUBJECT_OFFERED
    ccso ON tso.SUBJECT_ID = ccso.SUBJECT_ID WHERE ccso.IS_OFFERED_FALL_TERM = 'Y'
    AND ccso.IS_OFFERED_SUMMER_TERM = 'N' GROUP BY icte.DEPARTMENT_NAME, icte.SUBJECT_CODE,
    icte.SUBJECT_CODE_DESC, icte.GRADUATE_LEVEL, icte.Total_Courses ORDER BY icte.DEPARTMENT_NAME,
    icte.SUBJECT_CODE;
- category: Course Catalog and Department Analysis
  default_granularity: one row per Engineering degree-granting course subject above
    its department average total units
  desc: For degree-granting courses in the School of Engineering, show the course
    description, department name, subject title, and the subject's grade type description,
    but only include those courses where the total units for the subject exceed the
    average total units for that department. Do not return any rounded answers.
  id: dw_2924
  name: Engineering Degree-Granting Course Subjects Above Department Average Total
    Units
  sql: WITH inner_cte AS ( SELECT t0.COURSE_DESCRIPTION, t0.DEPARTMENT_NAME, t1.SUBJECT_TITLE,
    t1.TOTAL_UNITS, t1.GRADE_TYPE_DESC, t1.DEPARTMENT_NAME AS SUBJECT_DEPT FROM SIS_COURSE_DESCRIPTION
    t0 JOIN COURSE_CATALOG_SUBJECT_OFFERED t1 ON t0.COURSE = t1.SUBJECT_CODE WHERE
    t0.SCHOOL_NAME = 'Engineering' AND t0.IS_DEGREE_GRANTING = 'Y' ) , dept_avg_units
    AS ( SELECT SUBJECT_DEPT, AVG(TOTAL_UNITS) AS avg_units FROM inner_cte GROUP BY
    SUBJECT_DEPT ) SELECT i.COURSE_DESCRIPTION, i.DEPARTMENT_NAME, i.SUBJECT_TITLE,
    i.GRADE_TYPE_DESC FROM inner_cte i JOIN dept_avg_units d ON i.SUBJECT_DEPT = d.SUBJECT_DEPT
    WHERE i.TOTAL_UNITS > d.avg_units;
- category: Course Catalog and Textbook Material Comprehensive Analysis
  default_granularity: one row per Engineering catalog subject matched with 2017JA
    TIP offering
  desc: For subjects offered by departments in the School of Engineering that are
    also offered in the term '2017JA', show the subject title, total units, department
    full name, the row number within a window of 2 preceding and 1 following rows
    ordered by subject title, number of enrolled students, offering department name,
    department full name for the term, subject code, subject code description, and
    the minimum number of enrolled students over each subject code group, ordered
    by subject title and subject code. Do not return any rounded answers.
  id: dw_3236
  name: Engineering Catalog Subjects Row Numbers Matched with 2017JA TIP Enrollment
    Windows
  sql: WITH EngSubjects AS ( SELECT t1.SUBJECT_TITLE, t1.TOTAL_UNITS, t0.DEPARTMENT_FULL_NAME,
    ROW_NUMBER() OVER (ORDER BY t1.SUBJECT_TITLE ROWS BETWEEN 2 PRECEDING AND 1 FOLLOWING)
    AS window_column, t1.DEPARTMENT_CODE FROM SIS_DEPARTMENT t0 JOIN COURSE_CATALOG_SUBJECT_OFFERED
    t1 ON t0.DEPARTMENT_CODE = t1.DEPARTMENT_CODE WHERE t0.SCHOOL_NAME = 'Engineering'
    ), TermSubjects AS ( SELECT t0.SUBJECT_TITLE, t0.NUM_ENROLLED_STUDENTS, t0.OFFER_DEPT_NAME,
    t1.DEPARTMENT_FULL_NAME, t2.SUBJECT_CODE, t2.SUBJECT_CODE_DESC, min(t0.NUM_ENROLLED_STUDENTS)
    OVER (PARTITION BY t2.SUBJECT_CODE ORDER BY t2.SUBJECT_CODE) AS window_column,
    t0.OFFER_DEPT_CODE FROM TIP_SUBJECT_OFFERED t0 JOIN SIS_DEPARTMENT t1 ON t0.OFFER_DEPT_CODE
    = t1.DEPARTMENT_CODE JOIN SIS_SUBJECT_CODE t2 ON t1.DEPARTMENT_CODE = t2.DEPARTMENT_CODE
    WHERE t0.TERM_CODE = '2017JA' ) SELECT es.SUBJECT_TITLE, es.TOTAL_UNITS, es.DEPARTMENT_FULL_NAME,
    es.window_column AS eng_window_row_number, ts.NUM_ENROLLED_STUDENTS, ts.OFFER_DEPT_NAME,
    ts.DEPARTMENT_FULL_NAME AS term_dept_full_name, ts.SUBJECT_CODE, ts.SUBJECT_CODE_DESC,
    ts.window_column AS min_enrolled_by_code FROM EngSubjects es JOIN TermSubjects
    ts ON es.SUBJECT_TITLE = ts.SUBJECT_TITLE AND es.DEPARTMENT_CODE = ts.OFFER_DEPT_CODE
    ORDER BY es.SUBJECT_TITLE, ts.SUBJECT_CODE
- category: Course Catalog and Textbook Material Comprehensive Analysis
  default_granularity: one row per Engineering catalog subject matched with TIP material
    detail
  desc: For subjects offered by departments in the School of Engineering, show the
    subject title, total units, department full name, and assign row numbers within
    a window of 2 preceding and 1 following rows ordered by subject title. Additionally,
    for each matching course material detail, provide the material status key, term
    code, subject ID, ISBN, material key, the course number description, the offering
    department name, and the maximum number of enrolled students for each row considering
    the current row and the next 2 rows ordered by material key. The results should
    include the subject title, total units, department full name, window row number,
    material status key, term code, subject ID, ISBN, material key, course number
    description, offering department name, and the maximum number of enrolled students,
    in that order, for subjects and course materials where the subject title and department
    code match between the two datasets. Do not return any rounded answers.
  id: dw_3668
  name: Engineering Catalog Subjects Row Numbers Matched with TIP Material Detail
    Enrollment Windows
  sql: WITH Subq1 AS ( SELECT t1.SUBJECT_TITLE, t1.TOTAL_UNITS, t0.DEPARTMENT_FULL_NAME,
    ROW_NUMBER() OVER (ORDER BY t1.SUBJECT_TITLE ROWS BETWEEN 2 PRECEDING AND 1 FOLLOWING)
    AS window_column, t1.DEPARTMENT_CODE FROM SIS_DEPARTMENT t0 JOIN COURSE_CATALOG_SUBJECT_OFFERED
    t1 ON t0.DEPARTMENT_CODE = t1.DEPARTMENT_CODE WHERE t0.SCHOOL_NAME = 'Engineering'
    ), Subq2 AS ( SELECT t0.TIP_MATERIAL_STATUS_KEY, t0.TERM_CODE, t0.SUBJECT_ID,
    t0.ISBN, t0.TIP_MATERIAL_KEY, t1.COURSE_NUMBER_DESC, t1.SUBJECT_TITLE, t1.OFFER_DEPT_NAME,
    MAX(t1.NUM_ENROLLED_STUDENTS) OVER (ORDER BY t0.TIP_MATERIAL_KEY ROWS BETWEEN
    CURRENT ROW AND 2 FOLLOWING) AS max_enrolled_students, t1.OFFER_DEPT_CODE FROM
    TIP_DETAIL t0 JOIN TIP_SUBJECT_OFFERED t1 ON t0.TIP_SUBJECT_OFFERED_KEY = t1.TIP_SUBJECT_OFFERED_KEY
    WHERE t0.TIP_MATERIAL_STATUS_KEY IS NOT NULL AND t1.NUM_ENROLLED_STUDENTS >= 0
    ) SELECT s1.SUBJECT_TITLE, s1.TOTAL_UNITS, s1.DEPARTMENT_FULL_NAME, s1.window_column,
    s2.TIP_MATERIAL_STATUS_KEY, s2.TERM_CODE, s2.SUBJECT_ID, s2.ISBN, s2.TIP_MATERIAL_KEY,
    s2.COURSE_NUMBER_DESC, s2.OFFER_DEPT_NAME, s2.max_enrolled_students FROM Subq1
    s1 JOIN Subq2 s2 ON s1.DEPARTMENT_CODE = s2.OFFER_DEPT_CODE AND s1.SUBJECT_TITLE
    = s2.SUBJECT_TITLE
- category: Course Catalog and Textbook Material Comprehensive Analysis
  default_granularity: one row per Engineering catalog subject matched with TIP material
    detail and material count
  desc: Show the department full names, subject titles, total units, and the number
    of unique course materials per subject for subjects offered by departments in
    the School of Engineering. For each subject, also provide the material status
    key, term code, subject ID, ISBN, material key, course number description, offering
    department name, and the maximum number of enrolled students for each row considering
    the current row and the next 2 rows ordered by material key, where the subject
    title and department code match between the subject and course material datasets.
    Do not return any rounded answers.
  id: dw_4602
  name: Engineering Subjects with Unique Course Material Counts and TIP Material Detail
    Enrollment Windows
  sql: WITH inner_cte AS ( SELECT t1.SUBJECT_TITLE, t1.TOTAL_UNITS, t0.DEPARTMENT_FULL_NAME,
    ROW_NUMBER() OVER (ORDER BY t1.SUBJECT_TITLE ROWS BETWEEN 2 PRECEDING AND 1 FOLLOWING)
    AS window_column, t1.DEPARTMENT_CODE FROM SIS_DEPARTMENT t0 JOIN COURSE_CATALOG_SUBJECT_OFFERED
    t1 ON t0.DEPARTMENT_CODE = t1.DEPARTMENT_CODE WHERE t0.SCHOOL_NAME = 'Engineering'
    ) SELECT icte.DEPARTMENT_FULL_NAME, icte.SUBJECT_TITLE, icte.TOTAL_UNITS, mat_count.num_materials,
    s2.TIP_MATERIAL_STATUS_KEY, s2.TERM_CODE, s2.SUBJECT_ID, s2.ISBN, s2.TIP_MATERIAL_KEY,
    s2.COURSE_NUMBER_DESC, s2.OFFER_DEPT_NAME, s2.max_enrolled_students FROM inner_cte
    icte JOIN ( SELECT t0.TIP_MATERIAL_STATUS_KEY, t0.TERM_CODE, t0.SUBJECT_ID, t0.ISBN,
    t0.TIP_MATERIAL_KEY, t1.COURSE_NUMBER_DESC, t1.SUBJECT_TITLE, t1.OFFER_DEPT_NAME,
    MAX(t1.NUM_ENROLLED_STUDENTS) OVER (ORDER BY t0.TIP_MATERIAL_KEY ROWS BETWEEN
    CURRENT ROW AND 2 FOLLOWING) AS max_enrolled_students, t1.OFFER_DEPT_CODE FROM
    TIP_DETAIL t0 JOIN TIP_SUBJECT_OFFERED t1 ON t0.TIP_SUBJECT_OFFERED_KEY = t1.TIP_SUBJECT_OFFERED_KEY
    WHERE t0.TIP_MATERIAL_STATUS_KEY IS NOT NULL AND t1.NUM_ENROLLED_STUDENTS >= 0
    ) s2 ON icte.DEPARTMENT_CODE = s2.OFFER_DEPT_CODE AND icte.SUBJECT_TITLE = s2.SUBJECT_TITLE
    JOIN ( SELECT t1.DEPARTMENT_CODE, t1.SUBJECT_TITLE, COUNT(DISTINCT t0.TIP_MATERIAL_KEY)
    AS num_materials FROM COURSE_CATALOG_SUBJECT_OFFERED t1 JOIN SIS_DEPARTMENT t0d
    ON t1.DEPARTMENT_CODE = t0d.DEPARTMENT_CODE JOIN TIP_SUBJECT_OFFERED t2 ON t1.SUBJECT_TITLE
    = t2.SUBJECT_TITLE AND t1.DEPARTMENT_CODE = t2.OFFER_DEPT_CODE JOIN TIP_DETAIL
    t0 ON t2.TIP_SUBJECT_OFFERED_KEY = t0.TIP_SUBJECT_OFFERED_KEY WHERE t0d.SCHOOL_NAME
    = 'Engineering' GROUP BY t1.DEPARTMENT_CODE, t1.SUBJECT_TITLE ) mat_count ON icte.DEPARTMENT_CODE
    = mat_count.DEPARTMENT_CODE AND icte.SUBJECT_TITLE = mat_count.SUBJECT_TITLE
- category: Subject Offering and Enrollment Comprehensive Analysis
  default_granularity: single aggregate count
  desc: How many subjects in the course catalog are offered in the spring term, have
    a total of at least 6 units, are taught by faculty who are responsible for at
    least one subject with more than 0 enrolled students according to the subject
    offered summary, and are in the Mathematics department (Course 18)? Do not return
    any rounded answers.
  id: dw_5150
  name: Count of Spring Math Catalog Subjects with 6+ Units Taught by Faculty with
    Enrolled Subject Offerings
  sql: SELECT COUNT(*) AS spring_subjects_with_enrollment FROM COURSE_CATALOG_SUBJECT_OFFERED
    c JOIN SUBJECT_OFFERED s ON c.RESPONSIBLE_FACULTY_MIT_ID = s.RESPONSIBLE_FACULTY_MIT_ID
    JOIN SUBJECT_OFFERED_SUMMARY ss ON s.RESPONSIBLE_FACULTY_MIT_ID = ss.RESPONSIBLE_FACULTY_MIT_ID
    WHERE c.IS_OFFERED_SPRING_TERM = 'Y' AND c.TOTAL_UNITS >= 6 AND ss.NUM_ENROLLED_STUDENTS
    > 0 AND c.DEPARTMENT_NAME = 'Mathematics';
- category: Facility Space and Employee Directory Comprehensive Analysis
  default_granularity: one row per access-level-1 room in building E38 matched to
    an employee office
  desc: 'For rooms with an access level of 1 in building E38, show the building-room
    identifier, the area, the major use description, the row number within a window
    of 2 preceding and 1 following rows ordered by the major use description (for
    access level 1 rooms), the floor number, the major use description, the organization
    name, the office location, the full name of the employee, the department name,
    and the average area of rooms in a window of 2 preceding and 2 following rows
    grouped by department number and ordered by floor. List the columns in the following
    order: building-room identifier, area, major use description, access level window
    row number, floor number, major use description, organization name, office location,
    full name of the employee, department name, and average area window. Do not return
    any rounded answers.'
  id: dw_3299
  name: E38 Access-Level-1 Rooms Major Use Row Numbers with Employee Office Area Windows
  sql: WITH Subquery1 AS ( SELECT t1.BUILDING_ROOM, t1.AREA, t0.DESCRIPTION, ROW_NUMBER()
    OVER (ORDER BY t0.DESCRIPTION ROWS BETWEEN 2 PRECEDING AND 1 FOLLOWING) AS window_column
    FROM FCLT_MAJOR_USE t0 JOIN FCLT_ROOMS t1 ON t0.FCLT_MAJOR_USE_KEY = t1.FCLT_MAJOR_USE_KEY
    WHERE t1.ACCESS_LEVEL = 1 ), Subquery2 AS ( SELECT t0.BUILDING_ROOM, t0.FLOOR,
    t0.MAJOR_USE_DESC, t0.ORGANIZATION_NAME, t1.OFFICE_LOCATION, t1.FULL_NAME, t1.DEPARTMENT_NAME,
    AVG(t0.AREA) OVER ( PARTITION BY t1.DEPARTMENT_NUMBER ORDER BY t0.FLOOR ROWS BETWEEN
    2 PRECEDING AND 2 FOLLOWING ) AS window_column FROM FCLT_ROOMS t0 JOIN EMPLOYEE_DIRECTORY
    t1 ON t0.BUILDING_ROOM = t1.OFFICE_LOCATION WHERE t0.FCLT_BUILDING_KEY = 'E38'
    ) SELECT s1.BUILDING_ROOM, s1.AREA, s1.DESCRIPTION, s1.window_column AS access_level_window_row_number,
    s2.FLOOR, s2.MAJOR_USE_DESC, s2.ORGANIZATION_NAME, s2.OFFICE_LOCATION, s2.FULL_NAME,
    s2.DEPARTMENT_NAME, s2.window_column AS avg_area_window FROM Subquery1 s1 JOIN
    Subquery2 s2 ON s1.BUILDING_ROOM = s2.BUILDING_ROOM ORDER BY s1.BUILDING_ROOM,
    s2.FLOOR
- category: Mailing List Membership and Employee Directory Comprehensive Analysis
  default_granularity: single aggregate count of matching Moira list membership rows
  desc: How many unique members with a non-null MIT ID are listed in MOIRA_LIST_DETAIL
    whose last update date is after January 1, 2015, whose department name in the
    employee directory contains the word "Department", and who are in the "Political
    Science" department (Course 17)? Do not return any rounded answers.
  id: dw_5187
  name: Post-2015 Moira List Members in Political Science Department Count
  sql: SELECT COUNT(*) AS num_members FROM MOIRA_LIST_DETAIL m JOIN EMPLOYEE_DIRECTORY
    e ON m.MOIRA_LIST_MEMBER = e.KRB_NAME WHERE m.LAST_UPDATE_DATE > '01-JAN-15' AND
    e.DEPARTMENT_NAME LIKE '%Department%' AND e.MIT_ID IS NOT NULL AND e.DEPARTMENT_NAME
    = 'Political Science';
- id: dw_12
  name: Building Type Ownership Rollup of Historical Room Count Statistics for MIT
    Non-Residential Buildings
  desc: For each building type, show the building type name, the ownership type, and
    calculate the average, range, and variance of the number of rooms in building
    history records for buildings of that type and ownership type that are located
    on the MIT site, but exclude buildings that are classified as residential. For
    each building type, include a grand total for all ownership types in the format
    of (building type, null, total statistics). Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT FCLT_BUILDING.BUILDING_TYPE, FCLT_BUILDING.OWNERSHIP_TYPE,
    FCLT_BUILDING_HIST.NUM_OF_ROOMS FROM FCLT_BUILDING JOIN FCLT_BUILDING_HIST ON
    FCLT_BUILDING.FCLT_BUILDING_KEY = FCLT_BUILDING_HIST.FCLT_BUILDING_KEY WHERE FCLT_BUILDING_HIST.SITE
    = 'MIT' AND FCLT_BUILDING.BUILDING_TYPE <> 'RESIDENT' ) SELECT BUILDING_TYPE,
    OWNERSHIP_TYPE, AVG(NUM_OF_ROOMS) AS avg_num_rooms, MAX(NUM_OF_ROOMS) - MIN(NUM_OF_ROOMS)
    AS num_rooms_range, VARIANCE(NUM_OF_ROOMS) AS num_rooms_variance FROM inner_cte
    GROUP BY BUILDING_TYPE, OWNERSHIP_TYPE WITH ROLLUP HAVING BUILDING_TYPE IS NOT
    NULL ORDER BY BUILDING_TYPE, OWNERSHIP_TYPE
  category: Facility Space Analysis
  default_granularity: one row per building type and ownership type rollup combination
- id: dw_76
  name: Stata Center Floor Assignable and Non-Assignable Area Totals for MIT Academic
    Buildings with 50+ Historical Rooms
  desc: For all buildings on the MIT site that are academic buildings with more than
    50 rooms (according to the building history) and are specifically the Ray and
    Maria Stata Center, list each floor's number, the total assignable area on that
    floor, and the total non-assignable area, ordered by floor number. Do not return
    any rounded answers.
  sql: WITH inner_cte AS ( SELECT COUNT(DISTINCT ff.FCLT_FLOOR_KEY) AS num_floors
    FROM FCLT_FLOOR ff JOIN FCLT_BUILDING fb ON ff.FCLT_BUILDING_KEY = fb.FCLT_BUILDING_KEY
    JOIN FCLT_BUILDING_HIST fbh ON fb.FCLT_BUILDING_KEY = fbh.FCLT_BUILDING_KEY WHERE
    fb.SITE = 'MIT' AND fbh.NUM_OF_ROOMS > 50 AND fbh.BUILDING_TYPE = 'ACADEMIC' AND
    (fb.BUILDING_NAME = 'Ray and Maria Stata Center' OR fb.FCLT_BUILDING_KEY = '32')
    ) SELECT ff.FLOOR, SUM(ff.ASSIGNABLE_AREA) AS total_assignable_area, SUM(ff.NON_ASSIGNABLE_AREA)
    AS total_non_assignable_area FROM FCLT_FLOOR ff JOIN FCLT_BUILDING fb ON ff.FCLT_BUILDING_KEY
    = fb.FCLT_BUILDING_KEY JOIN FCLT_BUILDING_HIST fbh ON fb.FCLT_BUILDING_KEY = fbh.FCLT_BUILDING_KEY
    WHERE fb.SITE = 'MIT' AND fbh.NUM_OF_ROOMS > 50 AND fbh.BUILDING_TYPE = 'ACADEMIC'
    AND (fb.BUILDING_NAME = 'Ray and Maria Stata Center' OR fb.FCLT_BUILDING_KEY =
    '32') GROUP BY ff.FLOOR ORDER BY ff.FLOOR;
  category: Facility Space Analysis
  default_granularity: one row per floor of the selected building
- id: dw_126
  name: Cambridge Residential Buildings Above Average Gross Area with Address and
    Historical Room Statistics
  desc: For building addresses in the city of CAMBRIDGE that are used as a residence,
    show the building number from the address, the address purpose, the city, the
    postal code, the building name, the building type, the building use, the building's
    gross area, the fiscal period from the building history, the number of rooms from
    the building history, and the minimum assignable area from the building history
    over each building key group, but only for those buildings whose gross area is
    greater than the average gross area of all resident buildings in CAMBRIDGE (excluding
    buildings named "Ashdown"), ordered by building key. Do not return any rounded
    answers.
  sql: WITH inner_cte AS ( SELECT fba.BUILDING_NUMBER, fba.ADDRESS_PURPOSE, fba.CITY,
    fba.POSTAL_CODE, fb.BUILDING_NAME, fb.BUILDING_TYPE, fb.BUILDING_USE, fb.EXT_GROSS_AREA,
    fbh.FISCAL_PERIOD, fbh.NUM_OF_ROOMS, MIN(fbh.ASSIGNABLE_AREA) OVER (PARTITION
    BY fb.FCLT_BUILDING_KEY) AS MIN_ASSIGNABLE_AREA, fb.FCLT_BUILDING_KEY FROM FCLT_BUILDING_ADDRESS
    fba JOIN FCLT_BUILDING fb ON fba.FCLT_BUILDING_KEY = fb.FCLT_BUILDING_KEY JOIN
    FCLT_BUILDING_HIST fbh ON fb.FCLT_BUILDING_KEY = fbh.FCLT_BUILDING_KEY WHERE fba.CITY
    = 'CAMBRIDGE' AND fb.BUILDING_TYPE = 'RESIDENT' AND fb.BUILDING_NAME <> 'ASHDOWN
    HOUSE' ) , avg_area_cte AS ( SELECT AVG(EXT_GROSS_AREA) AS avg_gross_area FROM
    FCLT_BUILDING fb JOIN FCLT_BUILDING_ADDRESS fba ON fb.FCLT_BUILDING_KEY = fba.FCLT_BUILDING_KEY
    WHERE fba.CITY = 'CAMBRIDGE' AND fb.BUILDING_TYPE = 'RESIDENT' AND fb.BUILDING_NAME
    <> 'ASHDOWN HOUSE' ) SELECT i.BUILDING_NUMBER, i.ADDRESS_PURPOSE, i.CITY, i.POSTAL_CODE,
    i.BUILDING_NAME, i.BUILDING_TYPE, i.BUILDING_USE, i.EXT_GROSS_AREA, i.FISCAL_PERIOD,
    i.NUM_OF_ROOMS, i.MIN_ASSIGNABLE_AREA FROM inner_cte i CROSS JOIN avg_area_cte
    a WHERE i.EXT_GROSS_AREA > a.avg_gross_area ORDER BY i.FCLT_BUILDING_KEY;
  category: Facility Space Analysis
  default_granularity: one row per building address record matched with each building
    history fiscal period
- id: dw_505
  name: MIT Academic Building Historical Assignable Area Stddev and Average Non-Assignable
    Area
  desc: For each building, what is the building name, the standard deviation (using
    STDDEV only and never STDDEV_POP) of the assignable area across its historical
    records, and the average non-assignable area across its historical records, considering
    only buildings with more than 3 historical records, with a nonzero assignable
    area, and that are academic buildings? Additionally, restrict the results to buildings
    at MIT. Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT b.BUILDING_NAME, h.ASSIGNABLE_AREA, h.NON_ASSIGNABLE_AREA
    FROM FCLT_BUILDING b JOIN FCLT_BUILDING_HIST h ON b.FCLT_BUILDING_KEY = h.FCLT_BUILDING_KEY
    WHERE h.ASSIGNABLE_AREA > 0 AND b.BUILDING_TYPE = 'ACADEMIC' AND b.SITE = 'MIT'
    ) SELECT BUILDING_NAME, STDDEV(ASSIGNABLE_AREA) AS assignable_area_stddev, AVG(NON_ASSIGNABLE_AREA)
    AS avg_non_assignable_area FROM inner_cte GROUP BY BUILDING_NAME HAVING COUNT(*)
    > 3 ORDER BY assignable_area_stddev DESC;
  category: Facility Space Analysis
  default_granularity: one row per building name
- id: dw_565
  name: MIT Academic Building Number and Floor Statistics with Address Street and
    City
  desc: For each academic building at MIT with building numbers between '14' and 'E62'
    or floor numbers at least 2, and floor numbers between 3 and 16, what are the
    minimum building number, average floor number, and the street name and city of
    the building's address? Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT fb.BUILDING_NUMBER, MIN(fb.BUILDING_NUMBER) AS min_building_number,
    AVG(ff.FLOOR) AS avg_floor_number, fb.FCLT_BUILDING_KEY FROM FCLT_BUILDING fb
    JOIN FCLT_FLOOR ff ON fb.FCLT_BUILDING_KEY = ff.FCLT_BUILDING_KEY WHERE fb.BUILDING_TYPE
    = 'ACADEMIC' AND fb.SITE = 'MIT' AND ( (fb.BUILDING_NUMBER >= '14' AND fb.BUILDING_NUMBER
    <= 'E62') OR ff.FLOOR >= 2 ) AND ff.FLOOR BETWEEN 3 AND 16 GROUP BY fb.BUILDING_NUMBER,
    fb.FCLT_BUILDING_KEY ) SELECT ic.BUILDING_NUMBER, ic.min_building_number, ic.avg_floor_number,
    fba.STREET_NAME, fba.CITY FROM inner_cte ic JOIN FCLT_BUILDING_ADDRESS fba ON
    ic.BUILDING_NUMBER = fba.BUILDING_NUMBER ORDER BY ic.BUILDING_NUMBER;
  category: Facility Space Analysis
  default_granularity: one row per building number matched with its address records
- id: dw_1190
  name: Academic Building Historical Assignable Area Stddev with Room Area Average
    and Variance
  desc: For each building where the building type is 'ACADEMIC', the building is not
    the Brown Building, and the building has more than 3 historical records, give
    the building name, the standard deviation (using STDDEV only and never STDDEV_POP)
    of the assignable area across its historical records, the average area of its
    rooms, and the variance of the area of its rooms, including only buildings that
    are academic buildings or have building number '32'. List the results in descending
    order of the standard deviation (using STDDEV only and never STDDEV_POP) of the
    assignable area. Do not return any rounded answers.
  sql: WITH BuildingAreaStddev AS ( SELECT FCLT_BUILDING.BUILDING_NAME, STDDEV(FCLT_BUILDING_HIST.ASSIGNABLE_AREA)
    AS assignable_area_stddev FROM FCLT_BUILDING JOIN FCLT_BUILDING_HIST ON FCLT_BUILDING.COST_CENTER_CODE
    = FCLT_BUILDING_HIST.COST_CENTER_CODE WHERE FCLT_BUILDING.BUILDING_TYPE = 'ACADEMIC'
    AND FCLT_BUILDING.BUILDING_NAME <> 'BROWN BUILDING' GROUP BY FCLT_BUILDING.BUILDING_NAME
    HAVING COUNT(*) > 3 ORDER BY assignable_area_stddev DESC ), BuildingRoomStats
    AS ( SELECT fbh.BUILDING_NAME, AVG(fr.AREA) AS avg_area, VARIANCE(fr.AREA) AS
    var_area FROM FCLT_BUILDING_HIST fbh JOIN FCLT_ROOMS fr ON fbh.FCLT_BUILDING_KEY
    = fr.FCLT_BUILDING_KEY WHERE fbh.BUILDING_TYPE = 'ACADEMIC' OR fbh.BUILDING_NUMBER
    = '32' GROUP BY fbh.BUILDING_NAME ) SELECT bas.BUILDING_NAME, bas.assignable_area_stddev,
    brs.avg_area, brs.var_area FROM BuildingAreaStddev bas JOIN BuildingRoomStats
    brs ON bas.BUILDING_NAME = brs.BUILDING_NAME ORDER BY bas.assignable_area_stddev
    DESC;
  category: Facility Space Analysis
  default_granularity: one row per building name
- id: dw_1357
  name: Access Level Campus Sector Room Count Variance Rollup with Fairchild Floor
    Room Area Statistics
  desc: For each access level code and campus sector, what is the access level code,
    access level name, campus sector, the variance of the number of rooms in the building
    history for buildings with a nonzero number of rooms, assignable area greater
    than 0, and that are residential buildings at MIT, as well as, for each floor
    in the Fairchild Building with access level 1 or 2 and in academic buildings,
    the floor number, the building's long name, the range and variance of the area
    of rooms on that floor? Only include buildings that are at MIT. Also, include
    subtotals for each access level code (the corresponding campus sector field is
    'SUBTOTAL') and a grand total across all access level codes (the corresponding
    campus sector field is 'TOTAL'). Do not repeat the access level code if it is
    the same as the previous row. Sort the table by access level code, campus sector,
    and floor. Do not return any rounded answers.
  sql: WITH inner_cte1 AS ( SELECT fb.ACCESS_LEVEL_CODE, fb.ACCESS_LEVEL_NAME, fbh.CAMPUS_SECTOR,
    fbh.NUM_OF_ROOMS FROM FCLT_BUILDING fb JOIN FCLT_BUILDING_HIST fbh ON fb.ACCESS_LEVEL_CODE
    = fbh.ACCESS_LEVEL_CODE WHERE fbh.NUM_OF_ROOMS > 0 AND fbh.ASSIGNABLE_AREA > 0
    AND fbh.BUILDING_TYPE = 'RESIDENT' AND fbh.SITE = 'MIT' ), access_level_variance
    AS ( SELECT CASE WHEN LAG(ACCESS_LEVEL_CODE) OVER (ORDER BY access_level_code_sort,
    campus_sector_sort) = ACCESS_LEVEL_CODE THEN NULL ELSE ACCESS_LEVEL_CODE END AS
    access_level_code, ACCESS_LEVEL_NAME, campus_sector, num_of_rooms_variance, ACCESS_LEVEL_CODE
    AS join_access_level_code FROM ( SELECT CASE WHEN GROUPING(ACCESS_LEVEL_CODE)
    = 1 AND GROUPING(CAMPUS_SECTOR) = 1 THEN 'zzz' ELSE ACCESS_LEVEL_CODE END AS access_level_code_sort,
    CASE WHEN GROUPING(ACCESS_LEVEL_CODE) = 0 AND GROUPING(CAMPUS_SECTOR) = 1 THEN
    'SUBTOTAL' WHEN GROUPING(ACCESS_LEVEL_CODE) = 1 AND GROUPING(CAMPUS_SECTOR) =
    1 THEN 'TOTAL' ELSE CAMPUS_SECTOR END AS campus_sector, CASE WHEN GROUPING(ACCESS_LEVEL_CODE)
    = 0 AND GROUPING(CAMPUS_SECTOR) = 1 THEN 'zzz' ELSE CAMPUS_SECTOR END AS campus_sector_sort,
    ACCESS_LEVEL_CODE, MAX(ACCESS_LEVEL_NAME) AS ACCESS_LEVEL_NAME, VARIANCE(NUM_OF_ROOMS)
    AS num_of_rooms_variance FROM inner_cte1 GROUP BY ACCESS_LEVEL_CODE, CAMPUS_SECTOR
    WITH ROLLUP ) tbl ORDER BY access_level_code_sort, campus_sector_sort ), inner_cte2
    AS ( SELECT fb.BUILDING_NAME_LONG, fr.FCLT_FLOOR_KEY, fr.AREA FROM FCLT_ROOMS
    fr JOIN FCLT_BUILDING fb ON fr.FCLT_BUILDING_KEY = fb.FCLT_BUILDING_KEY WHERE
    fr.ACCESS_LEVEL IN (1, 2) AND fb.BUILDING_TYPE = 'ACADEMIC' AND fb.FCLT_BUILDING_KEY
    = '36' ), floor_area_stats AS ( SELECT f.FLOOR, i.BUILDING_NAME_LONG, MAX(i.AREA)
    - MIN(i.AREA) AS area_range, VARIANCE(i.AREA) AS area_variance, fb.ACCESS_LEVEL_CODE
    AS join_access_level_code FROM inner_cte2 i JOIN FCLT_FLOOR f ON i.FCLT_FLOOR_KEY
    = f.FCLT_FLOOR_KEY JOIN FCLT_BUILDING fb ON fb.BUILDING_NAME_LONG = i.BUILDING_NAME_LONG
    GROUP BY f.FLOOR, i.BUILDING_NAME_LONG, fb.ACCESS_LEVEL_CODE ) SELECT alv.access_level_code,
    alv.ACCESS_LEVEL_NAME, alv.campus_sector, alv.num_of_rooms_variance, fas.FLOOR,
    fas.BUILDING_NAME_LONG, fas.area_range, fas.area_variance FROM access_level_variance
    alv JOIN floor_area_stats fas ON alv.join_access_level_code = fas.join_access_level_code
    ORDER BY alv.access_level_code, alv.campus_sector, fas.FLOOR
  category: Facility Space Analysis
  default_granularity: one row per access-level/campus-sector rollup row matched with
    a floor of the selected academic building
- id: dw_1488
  name: MIT Academic Building Floor Room Area Statistics with Assignable Area Dispersion
    and Room Counts
  desc: For each academic building at MIT and each of its floors with total assignable
    area greater than 5000 and at least one room with access level 1 or 2, provide
    the building's long name, the floor number, the range and variance of the area
    of rooms on that floor (considering only rooms with access level 1 or 2), the
    range and variance of the assignable area of its floors that have at least one
    room, and the total number of rooms in the building. Do not return any rounded
    answers.
  sql: WITH subq1 AS ( WITH inner_cte AS ( SELECT fb.BUILDING_NAME_LONG, fr.FCLT_FLOOR_KEY,
    MAX(fr.AREA) - MIN(fr.AREA) AS area_range, VARIANCE(fr.AREA) AS area_variance
    FROM FCLT_ROOMS fr JOIN FCLT_BUILDING fb ON fr.FCLT_BUILDING_KEY = fb.FCLT_BUILDING_KEY
    WHERE fr.ACCESS_LEVEL IN (1, 2) AND fb.BUILDING_TYPE = 'ACADEMIC' GROUP BY fb.BUILDING_NAME_LONG,
    fr.FCLT_FLOOR_KEY ) SELECT ic.BUILDING_NAME_LONG, ff.FLOOR, ic.area_range, ic.area_variance,
    ff.FCLT_BUILDING_KEY FROM inner_cte ic JOIN FCLT_FLOOR ff ON ic.FCLT_FLOOR_KEY
    = ff.FCLT_FLOOR_KEY WHERE ff.ASSIGNABLE_AREA > 5000 ), subq2 AS ( WITH inner_cte
    AS ( WITH floors_with_rooms AS ( SELECT DISTINCT ff.FCLT_BUILDING_KEY, ff.FLOOR,
    ff.ASSIGNABLE_AREA FROM FCLT_FLOOR ff JOIN FCLT_ROOMS fr ON ff.FCLT_BUILDING_KEY
    = fr.FCLT_BUILDING_KEY AND ff.FLOOR = fr.FLOOR ), academic_buildings AS ( SELECT
    DISTINCT fbh.FCLT_BUILDING_KEY, fbh.BUILDING_NAME_LONG FROM FCLT_BUILDING_HIST
    fbh WHERE fbh.BUILDING_TYPE = 'ACADEMIC' AND fbh.SITE = 'MIT' ) SELECT ab.FCLT_BUILDING_KEY,
    ab.BUILDING_NAME_LONG, MAX(fwr.ASSIGNABLE_AREA) - MIN(fwr.ASSIGNABLE_AREA) AS
    assignable_area_range, VARIANCE(fwr.ASSIGNABLE_AREA) AS assignable_area_variance
    FROM academic_buildings ab JOIN floors_with_rooms fwr ON ab.FCLT_BUILDING_KEY
    = fwr.FCLT_BUILDING_KEY GROUP BY ab.FCLT_BUILDING_KEY, ab.BUILDING_NAME_LONG )
    SELECT ic.BUILDING_NAME_LONG, ic.assignable_area_range, ic.assignable_area_variance,
    COUNT(fr.FCLT_ROOM_KEY) AS total_room_count, ic.FCLT_BUILDING_KEY FROM inner_cte
    ic LEFT JOIN FCLT_ROOMS fr ON ic.FCLT_BUILDING_KEY = fr.FCLT_BUILDING_KEY GROUP
    BY ic.BUILDING_NAME_LONG, ic.assignable_area_range, ic.assignable_area_variance,
    ic.FCLT_BUILDING_KEY ) SELECT s1.BUILDING_NAME_LONG, s1.FLOOR, s1.area_range,
    s1.area_variance, s2.assignable_area_range, s2.assignable_area_variance, s2.total_room_count
    FROM subq1 s1 JOIN subq2 s2 ON s1.BUILDING_NAME_LONG = s2.BUILDING_NAME_LONG AND
    s1.FCLT_BUILDING_KEY = s2.FCLT_BUILDING_KEY ORDER BY s1.BUILDING_NAME_LONG, s1.FLOOR
  category: Facility Space Analysis
  default_granularity: one row per floor of each MIT academic building with high assignable
    area
- id: dw_1888
  name: Cambridge Academic Building History Statistics Matched with MIT Room Area
    Dispersion
  desc: For each academic building in Cambridge, MA (excluding the Stata building),
    with more than 1 room and a non-null building name, and that is also an academic
    building at MIT with more than 10 rooms, show the building key, building name,
    building type, the number of historical records, the total assignable area across
    all historical records, the average number of rooms per historical record, the
    range, variance, and standard deviation (using STDDEV only and never STDDEV_POP)
    of the areas of its rooms, and the total assignable area of the building at MIT,
    considering only buildings that satisfy all these criteria. Do not return any
    rounded answers.
  sql: WITH subq1 AS ( WITH inner_cte AS ( SELECT b.FCLT_BUILDING_KEY, b.BUILDING_NAME,
    b.BUILDING_TYPE, COUNT(h.FCLT_BUILDING_HIST_KEY) AS hist_record_count, SUM(h.ASSIGNABLE_AREA)
    AS total_assignable_area FROM FCLT_BUILDING_ADDRESS a JOIN FCLT_BUILDING b ON
    a.FCLT_BUILDING_KEY = b.FCLT_BUILDING_KEY JOIN FCLT_BUILDING_HIST h ON b.FCLT_BUILDING_KEY
    = h.FCLT_BUILDING_KEY WHERE a.CITY = 'CAMBRIDGE' AND a.STATE = 'MA' AND b.NUM_OF_ROOMS
    > 1 AND b.BUILDING_NAME IS NOT NULL AND b.BUILDING_TYPE = 'ACADEMIC' AND b.FCLT_BUILDING_KEY
    <> 32 GROUP BY b.FCLT_BUILDING_KEY, b.BUILDING_NAME, b.BUILDING_TYPE ) SELECT
    ic.FCLT_BUILDING_KEY, ic.BUILDING_NAME, ic.BUILDING_TYPE, ic.hist_record_count,
    ic.total_assignable_area, AVG(h.NUM_OF_ROOMS) AS avg_hist_num_of_rooms FROM inner_cte
    ic JOIN FCLT_BUILDING_HIST h ON ic.FCLT_BUILDING_KEY = h.FCLT_BUILDING_KEY GROUP
    BY ic.FCLT_BUILDING_KEY, ic.BUILDING_NAME, ic.BUILDING_TYPE, ic.hist_record_count,
    ic.total_assignable_area ), subq2 AS ( WITH inner_cte AS ( SELECT b.BUILDING_NAME,
    MAX(r.AREA) - MIN(r.AREA) AS area_range, VARIANCE(r.AREA) AS area_variance, STDDEV(r.AREA)
    AS area_stddev FROM FCLT_BUILDING b JOIN FCLT_ROOMS r ON b.FCLT_BUILDING_KEY =
    r.FCLT_BUILDING_KEY WHERE b.SITE = 'MIT' AND b.BUILDING_TYPE = 'ACADEMIC' GROUP
    BY b.BUILDING_NAME HAVING COUNT(r.FCLT_ROOM_KEY) > 10 ) SELECT inner_cte.BUILDING_NAME,
    inner_cte.area_range, inner_cte.area_variance, inner_cte.area_stddev, b.ASSIGNABLE_AREA
    FROM inner_cte JOIN FCLT_BUILDING b ON inner_cte.BUILDING_NAME = b.BUILDING_NAME
    ORDER BY inner_cte.area_range DESC ) SELECT s1.FCLT_BUILDING_KEY, s1.BUILDING_NAME,
    s1.BUILDING_TYPE, s1.hist_record_count, s1.total_assignable_area, s1.avg_hist_num_of_rooms,
    s2.area_range, s2.area_variance, s2.area_stddev, s2.ASSIGNABLE_AREA AS mit_assignable_area
    FROM subq1 s1 JOIN subq2 s2 ON s1.BUILDING_NAME = s2.BUILDING_NAME;
  category: Facility Space Analysis
  default_granularity: one row per building satisfying both Cambridge-history and
    MIT room criteria
- id: dw_2596
  name: Top 10 Buildings by Historical Record Count with Building Type and Campus
    Sector
  desc: For the top 10 building names with the highest number of historical records,
    list the building name, the number of historical records, the building type, and
    the campus sector. Do not repeat the building name if it is the same as the previous
    row. Sort the table by the number of historical records in descending order. Do
    not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT f.BUILDING_NAME, COUNT(h.FCLT_BUILDING_HIST_KEY)
    AS hist_count FROM FCLT_BUILDING f JOIN FCLT_BUILDING_HIST h ON f.COST_COLLECTOR_KEY
    = h.COST_COLLECTOR_KEY GROUP BY f.BUILDING_NAME ORDER BY hist_count DESC LIMIT
    10 ) SELECT CASE WHEN LAG(inner_cte.BUILDING_NAME) OVER (ORDER BY inner_cte.hist_count
    DESC, inner_cte.BUILDING_NAME) = inner_cte.BUILDING_NAME THEN NULL ELSE inner_cte.BUILDING_NAME
    END AS building_name, inner_cte.hist_count, f.BUILDING_TYPE, f.CAMPUS_SECTOR FROM
    inner_cte LEFT JOIN FCLT_BUILDING f ON inner_cte.BUILDING_NAME = f.BUILDING_NAME
    ORDER BY inner_cte.hist_count DESC, inner_cte.BUILDING_NAME;
  category: Facility Space Analysis
  default_granularity: one row per top-10 building name by history record count
- id: dw_3332
  name: Union of Large-Area Rooms with Windowed Floor Minimums and E-Building Rooms
    with DLC Minimum Areas
  desc: 'List all rooms that either have an area greater than 400 or are in buildings
    starting with ''E'' and have area greater than 50. For each room, show the building
    room identifier, floor number, major use description, organization name, building
    name, building type, and the minimum floor number in a window of 3 preceding and
    1 following row ordered by the building key (for rooms with area greater than
    400); or show the building room identifier, room key, area, organization name,
    department code, DLC key, and the minimum area value over each DLC key group ordered
    by DLC key (for rooms in buildings starting with ''E'' and area greater than 50).
    Indicate the source of each row as either ''AreaRooms'' or ''E_BuildingRooms''.
    The columns are: building room identifier, floor number, major use description,
    organization name, building name, building type, minimum floor number in window,
    room key, area, department code, DLC key, minimum area in DLC window, and source.
    Do not return any rounded answers.'
  sql: WITH AreaRooms AS ( SELECT t0.BUILDING_ROOM, t1.FLOOR, t0.MAJOR_USE_DESC, t0.ORGANIZATION_NAME,
    t2.BUILDING_NAME, t2.BUILDING_TYPE, MIN(t1.FLOOR) OVER (ORDER BY t2.FCLT_BUILDING_KEY
    ROWS BETWEEN 3 PRECEDING AND 1 FOLLOWING) AS window_column, t0.FCLT_ORGANIZATION_KEY,
    t2.FCLT_BUILDING_KEY FROM FCLT_ROOMS t0 JOIN FCLT_FLOOR t1 ON t0.FCLT_BUILDING_KEY
    = t1.FCLT_BUILDING_KEY JOIN FCLT_BUILDING t2 ON t1.FCLT_BUILDING_KEY = t2.FCLT_BUILDING_KEY
    WHERE t0.AREA > 400 ), E_BuildingRooms AS ( SELECT t2.BUILDING_ROOM, t2.FCLT_ROOM_KEY,
    t2.AREA, t2.ORGANIZATION_NAME, t2.DEPT_CODE, t1.DLC_KEY, min(t2.AREA) OVER (PARTITION
    BY t1.DLC_KEY ORDER BY t1.DLC_KEY) AS window_column, t2.FCLT_ORGANIZATION_KEY,
    t2.FCLT_BUILDING_KEY FROM FCLT_ORG_DLC_KEY t1 JOIN FCLT_ORGANIZATION t0 ON t1.FCLT_ORGANIZATION_KEY
    = t0.FCLT_ORGANIZATION_KEY JOIN FCLT_ROOMS t2 ON t0.FCLT_ORGANIZATION_KEY = t2.FCLT_ORGANIZATION_KEY
    WHERE t2.BUILDING_ROOM LIKE 'E%' AND t2.AREA > 50 ), CombinedRooms AS ( SELECT
    ar.BUILDING_ROOM, ar.FLOOR, ar.MAJOR_USE_DESC, ar.ORGANIZATION_NAME, ar.BUILDING_NAME,
    ar.BUILDING_TYPE, ar.window_column AS area_window_min_floor, NULL AS FCLT_ROOM_KEY,
    NULL AS AREA, NULL AS DEPT_CODE, NULL AS DLC_KEY, NULL AS dlc_window_min_area,
    'AreaRooms' AS Source FROM AreaRooms ar UNION ALL SELECT eb.BUILDING_ROOM, NULL
    AS FLOOR, NULL AS MAJOR_USE_DESC, eb.ORGANIZATION_NAME, NULL AS BUILDING_NAME,
    NULL AS BUILDING_TYPE, NULL AS area_window_min_floor, eb.FCLT_ROOM_KEY, eb.AREA,
    eb.DEPT_CODE, eb.DLC_KEY, eb.window_column AS dlc_window_min_area, 'E_BuildingRooms'
    AS Source FROM E_BuildingRooms eb ) SELECT BUILDING_ROOM, FLOOR, MAJOR_USE_DESC,
    ORGANIZATION_NAME, BUILDING_NAME, BUILDING_TYPE, area_window_min_floor, FCLT_ROOM_KEY,
    AREA, DEPT_CODE, DLC_KEY, dlc_window_min_area, Source FROM CombinedRooms ORDER
    BY BUILDING_ROOM;
  category: Facility Space Analysis
  default_granularity: one row per room from either the large-area branch or the E-building
    DLC branch
- id: dw_3410
  name: Large Rooms in High-Room-Count Buildings with Space Unit Organization Number
    Dispersion
  desc: 'For rooms with an area greater than 300 and located in buildings with more
    than 100 rooms, show the building''s long name, the room''s full name, the room''s
    area, and the row number within a window of 2 preceding and 1 following rows ordered
    by the building''s long name, along with the name of the space unit, the associated
    organization name, and both the variance and standard deviation (using STDDEV
    only and never STDDEV_POP) of the organization numbers for all organizations linked
    to that space unit (considering only space units with a non-null DLC key and organizations
    with assignable status), where the room and the space unit share the same organization
    key. List the columns in the following order: building''s long name, room''s full
    name, room''s area, window row number, space unit name, organization name, organization
    number variance, and organization number standard deviation (using STDDEV only
    and never STDDEV_POP). Do not return any rounded answers.'
  sql: WITH rooms_windowed AS ( SELECT t1.BUILDING_NAME_LONG, t0.ROOM_FULL_NAME, t0.AREA,
    t0.FCLT_ORGANIZATION_KEY, ROW_NUMBER() OVER (ORDER BY t1.BUILDING_NAME_LONG ROWS
    BETWEEN 2 PRECEDING AND 1 FOLLOWING) AS window_column FROM FCLT_ROOMS t0 JOIN
    FCLT_BUILDING t1 ON t0.FCLT_BUILDING_KEY = t1.FCLT_BUILDING_KEY WHERE t0.AREA
    > 300 AND t1.NUM_OF_ROOMS > 100 ), space_unit_org_stats AS ( SELECT s.SPACE_UNIT,
    o.ORGANIZATION_NAME, VARIANCE(o.ORGANIZATION_NUMBER) AS org_number_variance, STDDEV(o.ORGANIZATION_NUMBER)
    AS org_number_stddev, o.FCLT_ORGANIZATION_KEY FROM FCLT_ORG_DLC_KEY d JOIN FCLT_ORGANIZATION
    o ON d.FCLT_ORGANIZATION_KEY = o.FCLT_ORGANIZATION_KEY JOIN SPACE_UNIT s ON o.FCLT_ORGANIZATION_KEY
    = s.FCLT_ORGANIZATION_KEY WHERE s.DLC_KEY IS NOT NULL AND o.ASSIGNABLE = 1 GROUP
    BY s.SPACE_UNIT, o.ORGANIZATION_NAME, o.FCLT_ORGANIZATION_KEY ORDER BY org_number_variance
    DESC ) SELECT rw.BUILDING_NAME_LONG, rw.ROOM_FULL_NAME, rw.AREA, rw.window_column,
    suos.SPACE_UNIT, suos.ORGANIZATION_NAME, suos.org_number_variance, suos.org_number_stddev
    FROM rooms_windowed rw JOIN space_unit_org_stats suos ON rw.FCLT_ORGANIZATION_KEY
    = suos.FCLT_ORGANIZATION_KEY
  category: Facility Space Analysis
  default_granularity: one row per large room matched with its organization's space
    unit statistics
- id: dw_5455
  name: MIT Residential Building Minimum Room Count and Average Height with Address
    Street Number Filter
  desc: What are the minimum number of rooms and the average building height for each
    building that is used as a residence, where the number of rooms is between 10
    and 400 or the building height is at least 30, and the street number in the building
    address is between 40 and 27000, and only for buildings at MIT? Do not return
    any rounded answers.
  sql: SELECT fb.FCLT_BUILDING_KEY, MIN(fb.NUM_OF_ROOMS) AS min_num_of_rooms, AVG(fb.BUILDING_HEIGHT)
    AS avg_building_height FROM FCLT_BUILDING fb JOIN FCLT_BUILDING_ADDRESS fba ON
    fb.FCLT_BUILDING_KEY = fba.FCLT_BUILDING_KEY WHERE fb.BUILDING_TYPE = 'RESIDENT'
    AND fb.SITE = 'MIT' AND ( (fb.NUM_OF_ROOMS BETWEEN 10 AND 400) OR (fb.BUILDING_HEIGHT
    >= 30) ) AND fba.STREET_NUMBER BETWEEN 40 AND 27000 GROUP BY fb.FCLT_BUILDING_KEY
    ;
  category: Facility Space Analysis
  default_granularity: one row per residential building at MIT
- id: dw_488
  name: MIT Academic Building Use with Largest Room Area Variance and Largest Total
    Area Building
  desc: Among all academic buildings at MIT, which building use type has the largest
    variance in room area, and what is the name of the building with the largest total
    room area for that use type? Show the building use, the area variance, and the
    building name with the largest total room area for that use type. Do not return
    any rounded answers.
  sql: WITH inner_cte AS ( SELECT b.BUILDING_USE, VARIANCE(r.AREA) AS area_variance,
    STDDEV(r.AREA) AS area_stddev FROM FCLT_ROOMS r JOIN FCLT_BUILDING_HIST b ON r.FCLT_BUILDING_KEY
    = b.FCLT_BUILDING_KEY WHERE r.AREA IS NOT NULL AND b.BUILDING_USE IS NOT NULL
    AND b.BUILDING_TYPE = 'ACADEMIC' AND b.SITE = 'MIT' GROUP BY b.BUILDING_USE )
    SELECT ic.BUILDING_USE, ic.area_variance, bh.BUILDING_NAME_LONG AS building_with_largest_area
    FROM inner_cte ic JOIN ( SELECT b.BUILDING_USE, b.BUILDING_NAME_LONG, SUM(r.AREA)
    AS total_area, ROW_NUMBER() OVER (PARTITION BY b.BUILDING_USE ORDER BY SUM(r.AREA)
    DESC) AS rn FROM FCLT_ROOMS r JOIN FCLT_BUILDING_HIST b ON r.FCLT_BUILDING_KEY
    = b.FCLT_BUILDING_KEY WHERE r.AREA IS NOT NULL AND b.BUILDING_USE IS NOT NULL
    AND b.BUILDING_TYPE = 'ACADEMIC' AND b.SITE = 'MIT' GROUP BY b.BUILDING_USE, b.BUILDING_NAME_LONG
    ) bh ON ic.BUILDING_USE = bh.BUILDING_USE AND bh.rn = 1 ORDER BY ic.area_variance
    DESC LIMIT 1;
  category: Facility Space Analysis
  default_granularity: one row for the building use type with the highest room area
    variance
- id: dw_385
  name: Stata Building Non-Storage Rooms Above Floor Average Area with Windowed Moving
    Average by Floor Sort Sequence
  desc: For rooms in the Stata building (building 32) in buildings with an access
    level of 2, show the room key, building key, floor, major use description, area,
    and the average area over a window of 2 preceding and 2 following rows grouped
    by the floor's sort sequence and ordered by the room's area, but only include
    rooms whose area is greater than the average area for their floor. Exclude rooms
    whose major use description includes 'STORAGE'. Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT fr.FCLT_ROOM_KEY, fr.FCLT_BUILDING_KEY, fr.FLOOR,
    fr.MAJOR_USE_DESC, fr.AREA, ff.FLOOR_SORT_SEQUENCE FROM FCLT_ROOMS fr JOIN FCLT_FLOOR
    ff ON fr.FCLT_BUILDING_KEY = ff.FCLT_BUILDING_KEY AND fr.FLOOR = ff.FLOOR WHERE
    fr.FCLT_BUILDING_KEY = '32' AND ff.ACCESS_LEVEL = 2 AND fr.MAJOR_USE_DESC NOT
    LIKE '%STORAGE%' ) SELECT i.FCLT_ROOM_KEY, i.FCLT_BUILDING_KEY, i.FLOOR, i.MAJOR_USE_DESC,
    i.AREA, AVG(i.AREA) OVER ( PARTITION BY i.FLOOR_SORT_SEQUENCE ORDER BY i.AREA
    ROWS BETWEEN 2 PRECEDING AND 2 FOLLOWING ) AS avg_area_window FROM inner_cte i
    JOIN ( SELECT FLOOR_SORT_SEQUENCE, AVG(AREA) AS avg_floor_area FROM inner_cte
    GROUP BY FLOOR_SORT_SEQUENCE ) favg ON i.FLOOR_SORT_SEQUENCE = favg.FLOOR_SORT_SEQUENCE
    WHERE i.AREA > favg.avg_floor_area ORDER BY i.FLOOR_SORT_SEQUENCE, i.AREA;
  category: Facility Space Analysis
  default_granularity: one row per non-storage room in the selected building whose
    area exceeds its floor's average area
- id: dw_3890
  name: Access-Level-1 Room Counts per Major Use with Grand Totals Matched with Above-Parent-Average
    Organization Number Windows
  desc: For each major use description, list the building-room identifier, area, major
    use description, and assign row numbers within a window of 2 preceding and 1 following
    rows ordered by the major use description, as well as the organization name, department
    name, department code, department long name, department level, and the average
    organization number in a window of 2 preceding and 2 following rows grouped by
    the organization parent, ordered by the organization name, but only include those
    organizations whose organization number is greater than the average organization
    number of their parent group. For each major use description, include a grand
    total row for all rooms in the format of (null, null, major use description, total
    rooms) and only include rooms whose organization matches the filtered organizations.
    Do not return any rounded answers.
  sql: WITH inner_cte1 AS ( SELECT t1.BUILDING_ROOM, t1.AREA, t0.DESCRIPTION, t1.FCLT_ORGANIZATION_KEY,
    ROW_NUMBER() OVER (ORDER BY t0.DESCRIPTION ROWS BETWEEN 2 PRECEDING AND 1 FOLLOWING)
    AS window_column FROM FCLT_MAJOR_USE t0 JOIN FCLT_ROOMS t1 ON t0.FCLT_MAJOR_USE_KEY
    = t1.FCLT_MAJOR_USE_KEY WHERE t1.ACCESS_LEVEL = 1 ), RoomCounts AS ( SELECT DESCRIPTION,
    COUNT(*) AS total_rooms FROM inner_cte1 GROUP BY DESCRIPTION ), RoomMajorUse AS
    ( SELECT ic.BUILDING_ROOM, ic.AREA, ic.DESCRIPTION, ic.FCLT_ORGANIZATION_KEY,
    ic.window_column FROM inner_cte1 ic UNION ALL SELECT NULL AS BUILDING_ROOM, NULL
    AS AREA, rc.DESCRIPTION, NULL AS FCLT_ORGANIZATION_KEY, rc.total_rooms AS window_column
    FROM RoomCounts rc ), inner_cte2 AS ( SELECT t2.ORGANIZATION_NAME, t2.HR_DEPARTMENT_NAME,
    t1.HR_DEPARTMENT_CODE, t1.HR_DEPARTMENT_NAME_LONG, t1.HR_ORG_UNIT_LEVEL, t2.ORG_PARENT,
    t2.ORGANIZATION_NUMBER, t2.FCLT_ORGANIZATION_KEY, AVG(t2.ORGANIZATION_NUMBER)
    OVER ( PARTITION BY t2.ORG_PARENT ORDER BY t2.ORGANIZATION_NAME ROWS BETWEEN 2
    PRECEDING AND 2 FOLLOWING ) AS window_column FROM MASTER_DEPT_HIERARCHY t0 JOIN
    HR_ORG_UNIT t1 ON t0.DLC_KEY = t1.DLC_KEY JOIN FCLT_ORGANIZATION t2 ON t1.DLC_KEY
    = t2.DLC_KEY WHERE t2.FCLT_MAJOR_ORG_KEY = 230 ), FilteredOrgs AS ( SELECT i.ORGANIZATION_NAME,
    i.HR_DEPARTMENT_NAME, i.HR_DEPARTMENT_CODE, i.HR_DEPARTMENT_NAME_LONG, i.HR_ORG_UNIT_LEVEL,
    i.window_column, i.FCLT_ORGANIZATION_KEY FROM inner_cte2 i JOIN ( SELECT ORG_PARENT,
    AVG(ORGANIZATION_NUMBER) AS avg_org_num FROM inner_cte2 GROUP BY ORG_PARENT )
    a ON i.ORG_PARENT = a.ORG_PARENT WHERE i.ORGANIZATION_NUMBER > a.avg_org_num )
    SELECT rm.BUILDING_ROOM, rm.AREA, rm.DESCRIPTION, rm.window_column AS room_window_column,
    fo.ORGANIZATION_NAME, fo.HR_DEPARTMENT_NAME, fo.HR_DEPARTMENT_CODE, fo.HR_DEPARTMENT_NAME_LONG,
    fo.HR_ORG_UNIT_LEVEL, fo.window_column AS org_window_column FROM RoomMajorUse
    rm JOIN FilteredOrgs fo ON rm.FCLT_ORGANIZATION_KEY = fo.FCLT_ORGANIZATION_KEY
    ORDER BY rm.DESCRIPTION, rm.BUILDING_ROOM, fo.ORGANIZATION_NAME
  category: Facility Space and Organization Hierarchy Comprehensive Analysis
  default_granularity: one row per access-level-1 room (plus per-major-use grand total
    rows) matched to a filtered organization with above-parent-average organization
    number
- id: dw_4590
  name: Level-5 Organizations Ranked per HR Department with Large Assignable Room
    Minimum Area Windows and Area Deviation
  desc: For organizations with an organization level of 5, show the organization name,
    organization ID, DLC name, HR org unit title, HR department name, HR org unit
    level, and assign row numbers within each HR department name group ordered by
    organization name. For each such organization, for each room with area greater
    than 200 and assignable major use, show the building room, floor, room number,
    space ID, area, major use name, major use description, and the minimum area value
    over each major use group. Additionally, for each such room, show the HR org unit
    title and HR org unit level from the HR_ORG_UNIT table (joined via DLC_KEY), and
    the difference between the room's area and the minimum area for its major use.
    Order the results by HR department name, organization name, and major use. Do
    not return any rounded answers.
  sql: WITH inner_cte AS ( WITH OrgInfo AS ( SELECT t0.ORGANIZATION_NAME, t0.ORGANIZATION_ID,
    t1.DLC_NAME, t1.HR_ORG_UNIT_TITLE, t1.HR_DEPARTMENT_NAME, t1.HR_ORG_UNIT_LEVEL,
    ROW_NUMBER() OVER (PARTITION BY t1.HR_DEPARTMENT_NAME ORDER BY t0.ORGANIZATION_NAME)
    AS window_column, t0.FCLT_ORGANIZATION_KEY, t0.DLC_KEY FROM FCLT_ORGANIZATION
    t0 JOIN HR_ORG_UNIT t1 ON t0.DLC_KEY = t1.DLC_KEY WHERE t0.ORGANIZATION_LEVEL
    = 5 ), RoomInfo AS ( SELECT t1.BUILDING_ROOM, t1.FLOOR, t1.ROOM, t1.SPACE_ID,
    t1.AREA, t0.MAJOR_USE, t0.DESCRIPTION, min(t1.AREA) OVER (PARTITION BY t1.FCLT_MAJOR_USE_KEY
    ORDER BY t1.FCLT_MAJOR_USE_KEY) AS min_area_per_major_use, t1.FCLT_ORGANIZATION_KEY,
    t1.FCLT_MAJOR_USE_KEY FROM FCLT_MAJOR_USE t0 JOIN FCLT_ROOMS t1 ON t0.FCLT_MAJOR_USE_KEY
    = t1.FCLT_MAJOR_USE_KEY WHERE t1.AREA > 200 AND t0.ASSIGNABLE = 1 ) SELECT o.ORGANIZATION_NAME,
    o.ORGANIZATION_ID, o.DLC_NAME, o.HR_ORG_UNIT_TITLE, o.HR_DEPARTMENT_NAME, o.HR_ORG_UNIT_LEVEL,
    o.window_column, r.BUILDING_ROOM, r.FLOOR, r.ROOM, r.SPACE_ID, r.AREA, r.MAJOR_USE,
    r.DESCRIPTION, r.min_area_per_major_use, o.DLC_KEY, r.FCLT_MAJOR_USE_KEY, (r.AREA
    - r.min_area_per_major_use) AS area_deviation FROM OrgInfo o JOIN RoomInfo r ON
    o.FCLT_ORGANIZATION_KEY = r.FCLT_ORGANIZATION_KEY ) SELECT inner_cte.ORGANIZATION_NAME,
    inner_cte.ORGANIZATION_ID, inner_cte.DLC_NAME, inner_cte.HR_ORG_UNIT_TITLE, inner_cte.HR_DEPARTMENT_NAME,
    inner_cte.HR_ORG_UNIT_LEVEL, inner_cte.window_column, inner_cte.BUILDING_ROOM,
    inner_cte.FLOOR, inner_cte.ROOM, inner_cte.SPACE_ID, inner_cte.AREA, inner_cte.MAJOR_USE,
    inner_cte.DESCRIPTION, inner_cte.min_area_per_major_use, h.HR_ORG_UNIT_TITLE AS
    HR_ORG_UNIT_TITLE_FROM_HR, h.HR_ORG_UNIT_LEVEL AS HR_ORG_UNIT_LEVEL_FROM_HR, inner_cte.area_deviation
    FROM inner_cte LEFT JOIN HR_ORG_UNIT h ON inner_cte.DLC_KEY = h.DLC_KEY ORDER
    BY inner_cte.HR_DEPARTMENT_NAME, inner_cte.ORGANIZATION_NAME, inner_cte.MAJOR_USE;
  category: Facility Space and Organization Hierarchy Comprehensive Analysis
  default_granularity: one row per level-5 organization matched to each of its large
    assignable rooms, expanded by HR org unit rows sharing the DLC key
- id: dw_4627
  name: Level-5 Organizations Ranked per HR Department with Large Assignable Room
    Minimum Area Windows via Organization ID Match
  desc: 'For organizations with an organization level of 5, show the organization
    name, organization ID, DLC name, HR org unit title, HR department name, HR org
    unit level, and assign row numbers within each HR department name group ordered
    by organization name. For each such organization, for each room with area greater
    than 200 and assignable major use that belongs to the organization, show the building
    room, floor, room number, space ID, area, major use name, major use description,
    and the minimum area value over each major use group. Additionally, for each such
    room, show the HR org unit title and HR org unit level from the HR_ORG_UNIT table
    (joined via DLC_KEY). Present the results with the columns: organization name,
    organization ID, DLC name, HR org unit title, HR department name, HR org unit
    level, row number, building room, floor, room number, space ID, area, major use
    name, major use description, minimum area per major use, HR org unit title (from
    HR_ORG_UNIT), and HR org unit level (from HR_ORG_UNIT), in that order. Do not
    return any rounded answers.'
  sql: WITH inner_cte AS ( SELECT t0.ORGANIZATION_NAME, t0.ORGANIZATION_ID, t1.DLC_NAME,
    t1.HR_ORG_UNIT_TITLE, t1.HR_DEPARTMENT_NAME, t1.HR_ORG_UNIT_LEVEL, ROW_NUMBER()
    OVER (PARTITION BY t1.HR_DEPARTMENT_NAME ORDER BY t0.ORGANIZATION_NAME) AS window_column
    FROM FCLT_ORGANIZATION t0 JOIN HR_ORG_UNIT t1 ON t0.DLC_KEY = t1.DLC_KEY WHERE
    t0.ORGANIZATION_LEVEL = 5 ) SELECT o.ORGANIZATION_NAME, o.ORGANIZATION_ID, o.DLC_NAME,
    o.HR_ORG_UNIT_TITLE, o.HR_DEPARTMENT_NAME, o.HR_ORG_UNIT_LEVEL, o.window_column,
    r.BUILDING_ROOM, r.FLOOR, r.ROOM, r.SPACE_ID, r.AREA, r.MAJOR_USE, r.DESCRIPTION,
    r.min_area_per_major_use, h.HR_ORG_UNIT_TITLE AS hr_org_unit_title_from_hr, h.HR_ORG_UNIT_LEVEL
    AS hr_org_unit_level_from_hr FROM inner_cte o JOIN ( SELECT t1.BUILDING_ROOM,
    t1.FLOOR, t1.ROOM, t1.SPACE_ID, t1.AREA, t0.MAJOR_USE, t0.DESCRIPTION, min(t1.AREA)
    OVER (PARTITION BY t1.FCLT_MAJOR_USE_KEY ORDER BY t1.FCLT_MAJOR_USE_KEY) AS min_area_per_major_use,
    t1.FCLT_ORGANIZATION_KEY, t1.FCLT_MAJOR_USE_KEY FROM FCLT_MAJOR_USE t0 JOIN FCLT_ROOMS
    t1 ON t0.FCLT_MAJOR_USE_KEY = t1.FCLT_MAJOR_USE_KEY WHERE t1.AREA > 200 AND t0.ASSIGNABLE
    = 1 ) r ON o.ORGANIZATION_ID = r.FCLT_ORGANIZATION_KEY JOIN HR_ORG_UNIT h ON o.DLC_NAME
    = h.DLC_NAME
  category: Facility Space and Organization Hierarchy Comprehensive Analysis
  default_granularity: one row per level-5 organization matched to each large assignable
    room of the same organization key, expanded by HR org unit rows sharing the DLC
    name
- id: dw_1465
  name: Provost Area School of Science Department Organizations with Max Average Organization
    Number and Room Area Stddev
  desc: For each department in the Provost Area at the School of Science level, excluding
    the Biology department, and for each organization within those departments (excluding
    organizations with IDs '138' and '250'), show the department name, department
    code, organization name, organization ID, the maximum average organization number
    within each department code group, and the standard deviation (using STDDEV only
    and never STDDEV_POP) of the area of rooms assigned to the organization (considering
    only organizations with more than 5 rooms and excluding organizations named 'ADMISSIONS'),
    ordered by department name and organization name. Do not return any rounded answers.
  sql: WITH dept_max_avg_org AS ( WITH inner_cte AS ( SELECT t0.DLC_NAME, t0.DLC_CODE,
    t1.ORGANIZATION_NAME, t1.ORGANIZATION_ID, AVG(t1.ORGANIZATION_NUMBER) OVER (PARTITION
    BY t0.DLC_CODE ORDER BY t1.ORGANIZATION_SORT) AS avg_org_number FROM MASTER_DEPT_HIERARCHY
    t0 JOIN FCLT_ORGANIZATION t1 ON t0.DLC_KEY = t1.DLC_KEY WHERE t0.MASTER_DEPT_HIER_LEVEL_2_NAME
    = 'Provost Area' AND t0.MASTER_DEPT_HIER_LEVEL_3_NAME = 'School of Science' AND
    LOWER(t0.DLC_NAME) <> LOWER('Biology') AND t1.ORGANIZATION_ID NOT IN ('138', '250')
    ) SELECT DLC_NAME, DLC_CODE, ORGANIZATION_NAME, ORGANIZATION_ID, MAX(avg_org_number)
    AS max_avg_org_number FROM inner_cte GROUP BY DLC_NAME, DLC_CODE, ORGANIZATION_NAME,
    ORGANIZATION_ID ), org_area_stddev AS ( WITH inner_cte AS ( SELECT fo.ORGANIZATION_NAME,
    STDDEV(fr.AREA) AS area_stddev, fo.FCLT_ORGANIZATION_KEY FROM FCLT_ROOMS fr JOIN
    FCLT_ORGANIZATION fo ON fr.FCLT_ORGANIZATION_KEY = fo.FCLT_ORGANIZATION_KEY WHERE
    fo.ORGANIZATION_NAME <> 'ADMISSIONS' GROUP BY fo.ORGANIZATION_NAME, fo.FCLT_ORGANIZATION_KEY
    HAVING COUNT(fr.FCLT_ROOM_KEY) > 5 ) SELECT i.ORGANIZATION_NAME, fo.ORGANIZATION_NUMBER
    AS dept_code, i.area_stddev, fo.FCLT_ORGANIZATION_KEY FROM inner_cte i JOIN FCLT_ORGANIZATION
    fo ON i.FCLT_ORGANIZATION_KEY = fo.FCLT_ORGANIZATION_KEY ) SELECT d.DLC_NAME,
    d.DLC_CODE, d.ORGANIZATION_NAME, d.ORGANIZATION_ID, d.max_avg_org_number, o.area_stddev
    FROM dept_max_avg_org d JOIN FCLT_ORGANIZATION fo ON d.ORGANIZATION_ID = fo.ORGANIZATION_ID
    JOIN org_area_stddev o ON fo.FCLT_ORGANIZATION_KEY = o.FCLT_ORGANIZATION_KEY ORDER
    BY d.DLC_NAME, d.ORGANIZATION_NAME
  category: Facility Space and Organization Hierarchy Comprehensive Analysis
  default_granularity: one row per School-of-Science department organization matched
    with its room area standard deviation
- id: dw_1864
  name: Level-5 Assignable Organization Space Units with Provost Area HR Department
    Statistics
  desc: For each organization whose organization level is 5 and is not 'ADMISSIONS',
    and for each organization and its corresponding HR department where the organization
    is assignable, the HR organization unit level is 'DEPARTMENTS', the organization
    is not 'Cambridge-MIT Institute', and the organization is in the 'Provost Area'
    top-level HR hierarchy, but excluding organizations with organization IDs '138'
    and '250', show the organization name, description, the corresponding space unit
    name, the total number of space units associated with each organization, the HR
    department name, the number of organizations, and the minimum organization number.
    Do not return any rounded answers.
  sql: WITH org_space_units AS ( SELECT ORGANIZATION_NAME, DESCRIPTION, SPACE_UNIT,
    COUNT(SPACE_UNIT) OVER (PARTITION BY ORGANIZATION_NAME) AS total_space_units,
    DLC_KEY FROM ( SELECT t0.ORGANIZATION_NAME, t0.DESCRIPTION, t1.SPACE_UNIT, ROW_NUMBER()
    OVER (ORDER BY t1.SPACE_UNIT ROWS BETWEEN 2 PRECEDING AND 1 FOLLOWING) AS window_column,
    t0.DLC_KEY FROM FCLT_ORGANIZATION t0 JOIN SPACE_UNIT t1 ON t0.DLC_KEY = t1.DLC_KEY
    WHERE t0.ORGANIZATION_LEVEL = 5 AND t0.ORGANIZATION_NAME <> 'ADMISSIONS' AND t0.ORGANIZATION_ID
    NOT IN ('138', '250') ) inner_cte ), org_hr_dept AS ( SELECT ic.ORGANIZATION,
    ic.HR_DEPARTMENT_NAME, ic.organization_count, ic.min_organization_number, f.DLC_KEY
    FROM ( SELECT f.ORGANIZATION, h.HR_DEPARTMENT_NAME, COUNT(f.FCLT_ORGANIZATION_KEY)
    AS organization_count, MIN(f.ORGANIZATION_NUMBER) AS min_organization_number FROM
    FCLT_ORGANIZATION f JOIN HR_ORG_UNIT h ON f.HR_DEPARTMENT_CODE_OLD = h.HR_DEPARTMENT_CODE_OLD
    WHERE f.ASSIGNABLE = 1 AND h.HR_ORG_UNIT_LEVEL = 'DEPARTMENTS' AND f.ORGANIZATION_NAME
    NOT IN ('CAMBRIDGE-MIT INST') AND f.ORGANIZATION_ID NOT IN ('138', '250') GROUP
    BY f.ORGANIZATION, h.HR_DEPARTMENT_NAME ) ic JOIN HR_ORG_UNIT h2 ON ic.HR_DEPARTMENT_NAME
    = h2.HR_DEPARTMENT_NAME JOIN FCLT_ORGANIZATION f ON ic.ORGANIZATION = f.ORGANIZATION
    WHERE h2.ORG_HIER_TOP_LEVEL_NAME = 'Provost Area' ) SELECT osu.ORGANIZATION_NAME,
    osu.DESCRIPTION, osu.SPACE_UNIT, osu.total_space_units, ohd.HR_DEPARTMENT_NAME,
    ohd.organization_count, ohd.min_organization_number FROM org_space_units osu JOIN
    org_hr_dept ohd ON osu.DLC_KEY = ohd.DLC_KEY;
  category: Facility Space and Organization Hierarchy Comprehensive Analysis
  default_granularity: one row per level-5 organization space unit matched with its
    Provost Area HR department statistics
- id: dw_2559
  name: Office-Named DLCs with Assignable Organization Counts, Provost Area Department
    Max Organization Number, Space Unit, and Earliest Load Date
  desc: For each DLC whose DLC name contains the word 'Office', is not the biology
    department, and has at least one assignable organization, what are the DLC key,
    DLC name, the number of unique organizations, the total number of assignable organizations,
    the department name, the maximum organization number, the name of the space unit
    associated with that department, and the earliest warehouse load date among its
    organizations, considering only departments in the "Provost Area" with a maximum
    organization number greater than 50000 and excluding the "Political Science" department
    (Course 17)? Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT d.DLC_KEY, o.DLC_NAME, COUNT(DISTINCT o.FCLT_ORGANIZATION_KEY)
    AS organization_count, SUM(CASE WHEN o.ASSIGNABLE = 1 THEN 1 ELSE 0 END) AS assignable_organization_count
    FROM FCLT_ORG_DLC_KEY d JOIN FCLT_ORGANIZATION o ON d.DLC_KEY = o.DLC_KEY WHERE
    o.ASSIGNABLE = 1 AND o.DLC_NAME LIKE '%Office%' AND LOWER(o.DLC_NAME) != LOWER('Biology')
    GROUP BY d.DLC_KEY, o.DLC_NAME ), Dept_Max_Org_Space AS ( SELECT mdh.DLC_KEY,
    mdh.DLC_NAME AS department, MAX(fo.ORGANIZATION_NUMBER) AS max_organization_number,
    su.SPACE_UNIT AS space_unit_name FROM MASTER_DEPT_HIERARCHY mdh JOIN FCLT_ORGANIZATION
    fo ON mdh.DLC_KEY = fo.DLC_KEY LEFT JOIN SPACE_UNIT su ON fo.DLC_KEY = su.DLC_KEY
    WHERE mdh.MASTER_DEPT_HIER_LEVEL_2_NAME = 'Provost Area' AND fo.ORGANIZATION_NUMBER
    > 50000 AND mdh.DLC_NAME <> 'Political Science' GROUP BY mdh.DLC_KEY, mdh.DLC_NAME,
    su.SPACE_UNIT ), Org_Earliest_Load AS ( SELECT o.DLC_KEY, MIN(o.WAREHOUSE_LOAD_DATE)
    AS earliest_warehouse_load_date FROM FCLT_ORGANIZATION o GROUP BY o.DLC_KEY )
    SELECT ic.DLC_KEY, ic.DLC_NAME, ic.organization_count, ic.assignable_organization_count,
    dmos.department, dmos.max_organization_number, dmos.space_unit_name, oel.earliest_warehouse_load_date
    FROM inner_cte ic JOIN Dept_Max_Org_Space dmos ON ic.DLC_KEY = dmos.DLC_KEY LEFT
    JOIN Org_Earliest_Load oel ON ic.DLC_KEY = oel.DLC_KEY;
  category: Facility Space and Organization Hierarchy Comprehensive Analysis
  default_granularity: one row per Office-named DLC matched with Provost Area department
    space unit and load date statistics
- id: dw_3153
  name: D_MECHE Level-5 Organizations with Parent Organization Names and Descriptions
  desc: Among all organizations with a DLC key of 'D_MECHE' and an organization level
    of 5, what are the names and descriptions of these organizations, and for each,
    what is the name and description of their parent organization? Do not return any
    rounded answers.
  sql: WITH inner_cte AS ( SELECT FCLT_ORGANIZATION.FCLT_ORGANIZATION_KEY, FCLT_ORGANIZATION.ORGANIZATION_NAME,
    FCLT_ORGANIZATION.DESCRIPTION, FCLT_ORGANIZATION.FCLT_ORG_PARENT_KEY FROM FCLT_ORG_DLC_KEY
    JOIN FCLT_ORGANIZATION ON FCLT_ORG_DLC_KEY.FCLT_ORGANIZATION_KEY = FCLT_ORGANIZATION.FCLT_ORGANIZATION_KEY
    WHERE FCLT_ORG_DLC_KEY.DLC_KEY = 'D_MECHE' AND FCLT_ORGANIZATION.ORGANIZATION_LEVEL
    = 5 ) SELECT inner_cte.ORGANIZATION_NAME AS Org_Name, inner_cte.DESCRIPTION AS
    Org_Description, parent_org.ORGANIZATION_NAME AS Parent_Org_Name, parent_org.DESCRIPTION
    AS Parent_Org_Description FROM inner_cte LEFT JOIN FCLT_ORGANIZATION parent_org
    ON inner_cte.FCLT_ORG_PARENT_KEY = parent_org.FCLT_ORGANIZATION_KEY;
  category: Organization Hierarchy Analysis
  default_granularity: one row per D_MECHE level-5 organization with its parent organization
    attributes
- default_granularity: one row per large space unit matched with its Provost Area
    HR department rank
  desc: For each space unit with a space unit key greater than 100000 that is associated
    with a department in the "Provost Area", show the space unit code, the organization
    name, the HR department name, the sum of space unit keys within each warehouse
    load date group, the HR department code, the school area name, and the rank of
    the department within its school area based on department code. Present the results
    ordered by school area name, department rank within school area, and space unit
    code. Do not return any rounded answers.
  id: dw_3342
  name: Large Space Units with Provost Area Department School-Area Ranks and Load-Date
    Key Sums
  sql: WITH ProvostDepartments AS ( SELECT t1.HR_DEPARTMENT_CODE, t1.HR_DEPARTMENT_NAME,
    t1.ORG_HIER_SCHOOL_AREA_NAME, RANK() OVER (PARTITION BY t1.ORG_HIER_SCHOOL_AREA_NAME
    ORDER BY t1.HR_DEPARTMENT_CODE) AS window_column FROM MASTER_DEPT_HIERARCHY t0
    INNER JOIN HR_ORG_UNIT t1 ON t0.DLC_KEY = t1.DLC_KEY WHERE t0.MASTER_DEPT_HIER_LEVEL_2_NAME
    = 'Provost Area' ), LargeSpaceUnits AS ( SELECT t0.SPACE_UNIT_CODE, t1.ORGANIZATION_NAME,
    t2.HR_DEPARTMENT_NAME, SUM(t0.SPACE_UNIT_KEY) OVER (PARTITION BY t0.WAREHOUSE_LOAD_DATE
    ORDER BY t0.SPACE_UNIT_KEY) AS window_column, t2.HR_DEPARTMENT_CODE FROM SPACE_UNIT
    t0 JOIN FCLT_ORGANIZATION t1 ON t0.DLC_KEY = t1.DLC_KEY JOIN HR_ORG_UNIT t2 ON
    t1.DLC_KEY = t2.DLC_KEY WHERE t0.SPACE_UNIT_KEY > 100000 ) SELECT lsu.SPACE_UNIT_CODE,
    lsu.ORGANIZATION_NAME, lsu.HR_DEPARTMENT_NAME, lsu.window_column AS space_unit_sum_within_load_date,
    pd.HR_DEPARTMENT_CODE, pd.ORG_HIER_SCHOOL_AREA_NAME, pd.window_column AS department_rank_within_school_area
    FROM LargeSpaceUnits lsu JOIN ProvostDepartments pd ON lsu.HR_DEPARTMENT_CODE
    = pd.HR_DEPARTMENT_CODE ORDER BY pd.ORG_HIER_SCHOOL_AREA_NAME, pd.window_column,
    lsu.SPACE_UNIT_CODE;
  category: Facility Space and Organization Hierarchy Comprehensive Analysis
- default_granularity: one row per level-5 organization matched with a Provost Area
    department hierarchy row sharing DLC key and HR department name
  desc: For organizations with an organization level of 5 and departments in the "Provost
    Area" with a non-null department code, show the organization name, organization
    ID, DLC name, HR org unit title, HR department name, HR org unit level, the row
    number within each HR department name group ordered by organization name, the
    department's long name, the corresponding hierarchy level 3 name from the master
    department hierarchy, and the row number within a window of 2 preceding and 1
    following rows ordered by the department name. Do not return any rounded answers.
  id: dw_3452
  name: Level-5 Organizations Ranked per HR Department with Provost Area Department
    Hierarchy Window Row Numbers
  sql: WITH OrgLevel5 AS ( SELECT t0.ORGANIZATION_NAME, t0.ORGANIZATION_ID, t1.DLC_NAME,
    t1.HR_ORG_UNIT_TITLE, t1.HR_DEPARTMENT_NAME, t1.HR_ORG_UNIT_LEVEL, ROW_NUMBER()
    OVER (PARTITION BY t1.HR_DEPARTMENT_NAME ORDER BY t0.ORGANIZATION_NAME) AS window_column,
    t1.DLC_KEY FROM FCLT_ORGANIZATION t0 JOIN HR_ORG_UNIT t1 ON t0.DLC_KEY = t1.DLC_KEY
    WHERE t0.ORGANIZATION_LEVEL = 5 ), DeptProvostArea AS ( SELECT t1.HR_DEPARTMENT_NAME,
    t1.HR_DEPARTMENT_NAME_LONG, t0.MASTER_DEPT_HIER_LEVEL_3_NAME, ROW_NUMBER() OVER
    (ORDER BY t1.HR_DEPARTMENT_NAME ROWS BETWEEN 2 PRECEDING AND 1 FOLLOWING) AS window_column,
    t1.DLC_KEY FROM MASTER_DEPT_HIERARCHY t0 JOIN HR_ORG_UNIT t1 ON t0.DLC_KEY = t1.DLC_KEY
    WHERE t1.ORG_HIER_TOP_LEVEL_NAME = 'Provost Area' AND t1.HR_DEPARTMENT_CODE IS
    NOT NULL ) SELECT o.ORGANIZATION_NAME, o.ORGANIZATION_ID, o.DLC_NAME, o.HR_ORG_UNIT_TITLE,
    o.HR_DEPARTMENT_NAME, o.HR_ORG_UNIT_LEVEL, o.window_column AS org_window_column,
    d.HR_DEPARTMENT_NAME_LONG, d.MASTER_DEPT_HIER_LEVEL_3_NAME, d.window_column AS
    dept_window_column FROM OrgLevel5 o JOIN DeptProvostArea d ON o.DLC_KEY = d.DLC_KEY
    AND o.HR_DEPARTMENT_NAME = d.HR_DEPARTMENT_NAME
  category: Organization Hierarchy Analysis
- default_granularity: one row per Provost Area department hierarchy row matched with
    a large space unit of the same DLC
  desc: For each department in the "Provost Area" with a non-null department code,
    show the department name, the department's long name, the corresponding hierarchy
    level 3 name from the master department hierarchy, the row number within a window
    of 2 preceding and 1 following rows ordered by the department name, and for each
    matching space unit with a space unit key greater than 100000, show the space
    unit code, the organization name, the HR department name from the space unit,
    and the sum of space unit keys within each warehouse load date group ordered by
    space unit key. Present the results ordered by department name and space unit
    code. Do not return any rounded answers.
  id: dw_3490
  name: Provost Area Department Hierarchy Windows Matched with Large Space Unit Load-Date
    Key Sums
  sql: WITH DeptWindowed AS ( SELECT t1.HR_DEPARTMENT_NAME, t1.HR_DEPARTMENT_NAME_LONG,
    t0.MASTER_DEPT_HIER_LEVEL_3_NAME, ROW_NUMBER() OVER (ORDER BY t1.HR_DEPARTMENT_NAME
    ROWS BETWEEN 2 PRECEDING AND 1 FOLLOWING) AS window_column, t1.DLC_KEY FROM MASTER_DEPT_HIERARCHY
    t0 JOIN HR_ORG_UNIT t1 ON t0.DLC_KEY = t1.DLC_KEY WHERE t1.ORG_HIER_TOP_LEVEL_NAME
    = 'Provost Area' AND t1.HR_DEPARTMENT_CODE IS NOT NULL ), SpaceUnitWindowed AS
    ( SELECT t0.SPACE_UNIT_CODE, t1.ORGANIZATION_NAME, t2.HR_DEPARTMENT_NAME, SUM(t0.SPACE_UNIT_KEY)
    OVER (PARTITION BY t0.WAREHOUSE_LOAD_DATE ORDER BY t0.SPACE_UNIT_KEY) AS window_column,
    t2.DLC_KEY FROM SPACE_UNIT t0 JOIN FCLT_ORGANIZATION t1 ON t0.DLC_KEY = t1.DLC_KEY
    JOIN HR_ORG_UNIT t2 ON t1.DLC_KEY = t2.DLC_KEY WHERE t0.SPACE_UNIT_KEY > 100000
    ) SELECT d.HR_DEPARTMENT_NAME, d.HR_DEPARTMENT_NAME_LONG, d.MASTER_DEPT_HIER_LEVEL_3_NAME,
    d.window_column AS dept_window_column, s.SPACE_UNIT_CODE, s.ORGANIZATION_NAME,
    s.HR_DEPARTMENT_NAME AS spaceunit_hr_department_name, s.window_column AS spaceunit_window_column
    FROM DeptWindowed d JOIN SpaceUnitWindowed s ON d.DLC_KEY = s.DLC_KEY ORDER BY
    d.HR_DEPARTMENT_NAME, s.SPACE_UNIT_CODE
  category: Facility Space and Organization Hierarchy Comprehensive Analysis
- default_granularity: one row per assignable level-5 organization matched with a
    Provost Area department hierarchy row sharing DLC key and HR department name
  desc: 'For each organization and department in the Provost Area with a non-null
    department code, where the organization level is 5 and assignable is 1, show the
    organization name, organization key, department name, department code, the average
    organization key within each organization key group ordered by department code,
    the department''s long name, the corresponding hierarchy level 3 name from the
    master department hierarchy, and the row number within a window of 2 preceding
    and 1 following rows ordered by the department name. The columns should be shown
    in the following order: organization name, organization key, department name,
    department code, the average organization key window value, department''s long
    name, hierarchy level 3 name, and the department hierarchy row number. Do not
    return any rounded answers.'
  id: dw_3692
  name: Assignable Level-5 Organization Key Windows with Provost Area Department Hierarchy
    Row Numbers
  sql: WITH org_avg_keys AS ( SELECT t0.ORGANIZATION_NAME, t0.FCLT_ORGANIZATION_KEY,
    t1.HR_DEPARTMENT_NAME, t1.HR_DEPARTMENT_CODE, AVG(t0.FCLT_ORGANIZATION_KEY) OVER
    (PARTITION BY t0.FCLT_ORGANIZATION_KEY ORDER BY t1.HR_DEPARTMENT_CODE) AS window_column,
    t0.DLC_KEY FROM FCLT_ORGANIZATION t0 JOIN HR_ORG_UNIT t1 ON t0.DLC_KEY = t1.DLC_KEY
    WHERE t0.ORGANIZATION_LEVEL = 5 AND t0.ASSIGNABLE = 1 ), dept_hierarchy_rows AS
    ( SELECT t1.HR_DEPARTMENT_NAME, t1.HR_DEPARTMENT_NAME_LONG, t0.MASTER_DEPT_HIER_LEVEL_3_NAME,
    ROW_NUMBER() OVER (ORDER BY t1.HR_DEPARTMENT_NAME ROWS BETWEEN 2 PRECEDING AND
    1 FOLLOWING) AS window_column, t1.DLC_KEY FROM MASTER_DEPT_HIERARCHY t0 JOIN HR_ORG_UNIT
    t1 ON t0.DLC_KEY = t1.DLC_KEY WHERE t1.ORG_HIER_TOP_LEVEL_NAME = 'Provost Area'
    AND t1.HR_DEPARTMENT_CODE IS NOT NULL ) SELECT oak.ORGANIZATION_NAME, oak.FCLT_ORGANIZATION_KEY,
    oak.HR_DEPARTMENT_NAME, oak.HR_DEPARTMENT_CODE, oak.window_column AS org_avg_key_window,
    dhr.HR_DEPARTMENT_NAME_LONG, dhr.MASTER_DEPT_HIER_LEVEL_3_NAME, dhr.window_column
    AS dept_hierarchy_rownum FROM org_avg_keys oak JOIN dept_hierarchy_rows dhr ON
    oak.DLC_KEY = dhr.DLC_KEY AND oak.HR_DEPARTMENT_NAME = dhr.HR_DEPARTMENT_NAME;
  category: Organization Hierarchy Analysis
- default_granularity: one row per warehouse-load-date space unit rollup row matched
    with a floor-2 access-level-1 room of the same space unit
  desc: For each warehouse load date, list the space unit code, organization name,
    HR department name, the HR org unit title, the sum of space unit keys within each
    warehouse load date group (including a grand total row with nulls and the total
    sum), and for each, show the building room, space usage, space unit name, and
    the total number of rooms in the same space unit on floor 2 with access level
    1 (only including space units with more than 1 such room), for space units with
    a space unit key greater than 100000. Do not return any rounded answers.
  id: dw_3916
  name: Large Space Unit Load-Date Key Sum Rollup with Floor-2 Access-Level-1 Room
    Counts per Space Unit
  sql: WITH subq1 AS ( WITH inner_cte AS ( SELECT t0.SPACE_UNIT_CODE, t1.ORGANIZATION_NAME,
    t2.HR_DEPARTMENT_NAME, t0.WAREHOUSE_LOAD_DATE, t2.HR_ORG_UNIT_TITLE, t0.SPACE_UNIT_KEY
    FROM SPACE_UNIT t0 JOIN FCLT_ORGANIZATION t1 ON t0.DLC_KEY = t1.DLC_KEY JOIN HR_ORG_UNIT
    t2 ON t1.DLC_KEY = t2.DLC_KEY WHERE t0.SPACE_UNIT_KEY > 100000 ) SELECT inner_cte.WAREHOUSE_LOAD_DATE,
    inner_cte.SPACE_UNIT_CODE, inner_cte.ORGANIZATION_NAME, inner_cte.HR_DEPARTMENT_NAME,
    inner_cte.HR_ORG_UNIT_TITLE, SUM(inner_cte.SPACE_UNIT_KEY) AS total_space_unit_keys
    FROM inner_cte GROUP BY inner_cte.WAREHOUSE_LOAD_DATE, inner_cte.SPACE_UNIT_CODE,
    inner_cte.ORGANIZATION_NAME, inner_cte.HR_DEPARTMENT_NAME, inner_cte.HR_ORG_UNIT_TITLE
    WITH ROLLUP HAVING SUM(inner_cte.SPACE_UNIT_KEY) > 0 ORDER BY inner_cte.WAREHOUSE_LOAD_DATE,
    inner_cte.SPACE_UNIT_CODE ), subq2 AS ( WITH inner_cte AS ( SELECT t1.BUILDING_ROOM,
    t1.SPACE_USAGE, t0.SPACE_UNIT, ROW_NUMBER() OVER (ORDER BY t1.BUILDING_ROOM ROWS
    BETWEEN 2 PRECEDING AND 1 FOLLOWING) AS window_column FROM SPACE_UNIT t0 JOIN
    ZPM_ROOMS_LOAD t1 ON t0.SPACE_UNIT_CODE = t1.SPACE_UNIT_CODE WHERE t1.FLOOR =
    2 AND t1.ACCESS_LEVEL = 1 ) SELECT ic.BUILDING_ROOM, ic.SPACE_USAGE, ic.SPACE_UNIT,
    su_counts.ROOM_COUNT FROM inner_cte ic JOIN ( SELECT t0.SPACE_UNIT, COUNT(*) AS
    ROOM_COUNT FROM SPACE_UNIT t0 JOIN ZPM_ROOMS_LOAD t1 ON t0.SPACE_UNIT_CODE = t1.SPACE_UNIT_CODE
    WHERE t1.FLOOR = 2 AND t1.ACCESS_LEVEL = 1 GROUP BY t0.SPACE_UNIT HAVING COUNT(*)
    > 1 ) su_counts ON ic.SPACE_UNIT = su_counts.SPACE_UNIT ) SELECT s1.WAREHOUSE_LOAD_DATE,
    s1.SPACE_UNIT_CODE, s1.ORGANIZATION_NAME, s1.HR_DEPARTMENT_NAME, s1.HR_ORG_UNIT_TITLE,
    s1.total_space_unit_keys, s2.BUILDING_ROOM, s2.SPACE_USAGE, s2.SPACE_UNIT, s2.ROOM_COUNT
    FROM subq1 s1 JOIN SPACE_UNIT su ON s1.SPACE_UNIT_CODE = su.SPACE_UNIT_CODE JOIN
    subq2 s2 ON su.SPACE_UNIT = s2.SPACE_UNIT ORDER BY s1.WAREHOUSE_LOAD_DATE, s1.SPACE_UNIT_CODE,
    s2.BUILDING_ROOM
  category: Facility Space and Organization Hierarchy Comprehensive Analysis
- default_granularity: one row per Sloan-area standard-hierarchy department matched
    with a large space unit of the same DLC
  desc: For departments in the "Sloan School of Management" area with a hierarchy
    type of "Standard Hierarchy", show the department code, department name, the dense
    rank of each department considering the current and 2 preceding rows ordered by
    the department's long name, and the corresponding DLC name from the MASTER_DEPT_HIERARCHY
    table, along with, for each such department, the space unit code, organization
    name, HR department name from the space unit, the sum of space unit keys within
    each warehouse load date group, and the HR org unit title for space units with
    a space unit key greater than 100000, where the department and space unit share
    the same DLC key. Present the results in the order of department code and space
    unit code. Do not return any rounded answers.
  id: dw_3919
  name: Sloan Area Standard-Hierarchy Department Dense Ranks with Large Space Unit
    Load-Date Key Sums
  sql: WITH DeptSloan AS ( WITH inner_cte AS ( SELECT t1.HR_DEPARTMENT_CODE, t1.HR_DEPARTMENT_NAME,
    dense_rank() OVER (ORDER BY t1.HR_DEPARTMENT_NAME_LONG ROWS BETWEEN 2 PRECEDING
    AND CURRENT ROW) AS window_column, t1.DLC_KEY FROM MASTER_DEPT_HIERARCHY t0 JOIN
    HR_ORG_UNIT t1 ON t0.DLC_KEY = t1.DLC_KEY WHERE t0.HIERARCHY_TYPE = 'Standard
    Hierarchy' AND t1.ORG_HIER_SCHOOL_AREA_NAME = 'Sloan School of Management Area'
    ) SELECT i.HR_DEPARTMENT_CODE, i.HR_DEPARTMENT_NAME, i.window_column, m.DLC_NAME,
    i.DLC_KEY FROM inner_cte i JOIN MASTER_DEPT_HIERARCHY m ON i.DLC_KEY = m.DLC_KEY
    ), SpaceUnitSum AS ( WITH inner_cte AS ( SELECT t0.SPACE_UNIT_CODE, t1.ORGANIZATION_NAME,
    t2.HR_DEPARTMENT_NAME, SUM(t0.SPACE_UNIT_KEY) OVER (PARTITION BY t0.WAREHOUSE_LOAD_DATE
    ORDER BY t0.SPACE_UNIT_KEY) AS window_column, t1.DLC_KEY FROM SPACE_UNIT t0 JOIN
    FCLT_ORGANIZATION t1 ON t0.DLC_KEY = t1.DLC_KEY JOIN HR_ORG_UNIT t2 ON t1.DLC_KEY
    = t2.DLC_KEY WHERE t0.SPACE_UNIT_KEY > 100000 ) SELECT inner_cte.SPACE_UNIT_CODE,
    inner_cte.ORGANIZATION_NAME, inner_cte.HR_DEPARTMENT_NAME, inner_cte.window_column,
    t3.HR_ORG_UNIT_TITLE, inner_cte.DLC_KEY FROM inner_cte JOIN HR_ORG_UNIT t3 ON
    inner_cte.DLC_KEY = t3.DLC_KEY ) SELECT d.HR_DEPARTMENT_CODE, d.HR_DEPARTMENT_NAME,
    d.window_column AS dept_dense_rank, d.DLC_NAME, s.SPACE_UNIT_CODE, s.ORGANIZATION_NAME,
    s.HR_DEPARTMENT_NAME AS space_hr_department_name, s.window_column AS space_sum,
    s.HR_ORG_UNIT_TITLE FROM DeptSloan d JOIN SpaceUnitSum s ON d.DLC_KEY = s.DLC_KEY
    ORDER BY d.HR_DEPARTMENT_CODE, s.SPACE_UNIT_CODE;
  category: Facility Space and Organization Hierarchy Comprehensive Analysis
- default_granularity: one row per 150-sqft-room space unit matched with organization
    number statistics of its major organization's HR departments
  desc: For rooms with a square footage of 150, show the space unit code, space unit
    name, and the maximum rank within each space unit code group, and for each of
    those space units, show the major organization, top-level HR organization name,
    HR department name, the average, variance, and standard deviation (using STDDEV
    only and never STDDEV_POP) of the organization numbers for each HR department
    name, considering only organizations that are assignable and have a non-null organization
    number. The results should include the space unit code, space unit name, maximum
    rank, major organization, top-level HR organization name, HR department name,
    average organization number, organization number variance, and organization number
    standard deviation (using STDDEV only and never STDDEV_POP), in that order. Do
    not return any rounded answers.
  id: dw_4025
  name: 150-Sqft Room Space Unit Max Ranks with Assignable Organization Number Dispersion
    per HR Department
  sql: WITH space_unit_max_rank AS ( WITH inner_cte AS ( SELECT sd.BUILDING_ROOM,
    sd.ROOM_NUMBER, su.SPACE_UNIT_CODE, su.SPACE_UNIT, RANK() OVER (PARTITION BY su.SPACE_UNIT_CODE
    ORDER BY sd.BUILDING_ROOM) AS window_column FROM SPACE_DETAIL sd JOIN SPACE_UNIT
    su ON sd.SPACE_UNIT_KEY = su.SPACE_UNIT_KEY WHERE sd.ROOM_SQUARE_FOOTAGE = 150
    ) SELECT SPACE_UNIT_CODE, SPACE_UNIT, MAX(window_column) AS max_rank FROM inner_cte
    GROUP BY SPACE_UNIT_CODE, SPACE_UNIT ), org_stats_by_dept AS ( WITH inner_cte
    AS ( SELECT F.MAJOR_ORG, H.ORG_HIER_TOP_LEVEL_NAME, AVG(F.ORGANIZATION_NUMBER)
    AS avg_org_number, VARIANCE(F.ORGANIZATION_NUMBER) AS org_number_variance, STDDEV(F.ORGANIZATION_NUMBER)
    AS org_number_stddev FROM FCLT_ORGANIZATION F JOIN HR_ORG_UNIT H ON F.HR_DEPARTMENT_CODE_OLD
    = H.HR_DEPARTMENT_CODE_OLD WHERE F.ASSIGNABLE = 1 AND F.ORGANIZATION_NUMBER IS
    NOT NULL GROUP BY F.MAJOR_ORG, H.ORG_HIER_TOP_LEVEL_NAME ) SELECT icte.MAJOR_ORG,
    icte.ORG_HIER_TOP_LEVEL_NAME, H.HR_DEPARTMENT_NAME, AVG(F.ORGANIZATION_NUMBER)
    AS avg_org_number, VARIANCE(F.ORGANIZATION_NUMBER) AS org_number_variance, STDDEV(F.ORGANIZATION_NUMBER)
    AS org_number_stddev FROM inner_cte icte JOIN FCLT_ORGANIZATION F ON icte.MAJOR_ORG
    = F.MAJOR_ORG JOIN HR_ORG_UNIT H ON F.HR_DEPARTMENT_CODE_OLD = H.HR_DEPARTMENT_CODE_OLD
    AND icte.ORG_HIER_TOP_LEVEL_NAME = H.ORG_HIER_TOP_LEVEL_NAME WHERE F.ASSIGNABLE
    = 1 AND F.ORGANIZATION_NUMBER IS NOT NULL GROUP BY icte.MAJOR_ORG, icte.ORG_HIER_TOP_LEVEL_NAME,
    H.HR_DEPARTMENT_NAME ORDER BY org_number_variance DESC ) SELECT s.SPACE_UNIT_CODE,
    s.SPACE_UNIT, s.max_rank, o.MAJOR_ORG, o.ORG_HIER_TOP_LEVEL_NAME, o.HR_DEPARTMENT_NAME,
    o.avg_org_number, o.org_number_variance, o.org_number_stddev FROM space_unit_max_rank
    s JOIN SPACE_UNIT su ON s.SPACE_UNIT_CODE = su.SPACE_UNIT_CODE JOIN FCLT_ORGANIZATION
    fo ON su.FCLT_ORGANIZATION_KEY = fo.FCLT_ORGANIZATION_KEY JOIN org_stats_by_dept
    o ON fo.MAJOR_ORG = o.MAJOR_ORG
  category: Facility Space and Organization Hierarchy Comprehensive Analysis
- default_granularity: one row per floor-2 space-planning room with its organization
    and HR department attributes plus the highest access-level-1 floor of its space
    usage
  desc: For rooms on floor 2, show the building room, space usage, the organization
    name, the HR org unit title, the department name, the minimum access level in
    a window of 3 preceding and 1 following row ordered by the building component,
    the department's long name, the DLC name, and the highest floor among rooms with
    access level 1 for each space usage group. Do not return any rounded answers.
  id: dw_4033
  name: Floor-2 Rooms Access Level Windows with Organization HR Attributes and Highest
    Access-Level-1 Floor per Space Usage
  sql: WITH subq1 AS ( WITH inner_cte AS ( SELECT t1.BUILDING_ROOM, t1.BUILDING_COMPONENT,
    t1.FLOOR, t1.SPACE_USAGE, t1.SPACE_UNIT_CODE, t0.ORGANIZATION_NAME FROM FCLT_ORGANIZATION
    t0 JOIN ZPM_ROOMS_LOAD t1 ON t0.HR_ORG_UNIT_ID = t1.HR_ORG_UNIT_ID WHERE t1.ACCESS_LEVEL
    = 1 ) SELECT SPACE_USAGE, MAX(FLOOR) AS highest_floor FROM inner_cte GROUP BY
    SPACE_USAGE ), subq2 AS ( WITH inner_cte AS ( SELECT t0.BUILDING_ROOM, t0.SPACE_USAGE,
    t1.ORGANIZATION_NAME, t2.HR_ORG_UNIT_TITLE, t2.HR_DEPARTMENT_NAME, MIN(t0.ACCESS_LEVEL)
    OVER ( ORDER BY t0.BUILDING_COMPONENT ROWS BETWEEN 3 PRECEDING AND 1 FOLLOWING
    ) AS window_column, t2.HR_ORG_UNIT_ID FROM ZPM_ROOMS_LOAD t0 JOIN FCLT_ORGANIZATION
    t1 ON t0.HR_ORG_UNIT_ID = t1.HR_ORG_UNIT_ID JOIN HR_ORG_UNIT t2 ON t1.HR_ORG_UNIT_ID
    = t2.HR_ORG_UNIT_ID WHERE t0.FLOOR = 2 ) SELECT inner_cte.BUILDING_ROOM, inner_cte.SPACE_USAGE,
    inner_cte.ORGANIZATION_NAME, inner_cte.HR_ORG_UNIT_TITLE, inner_cte.HR_DEPARTMENT_NAME,
    inner_cte.window_column, t2.HR_DEPARTMENT_NAME_LONG, t2.DLC_NAME FROM inner_cte
    JOIN HR_ORG_UNIT t2 ON inner_cte.HR_ORG_UNIT_ID = t2.HR_ORG_UNIT_ID ) SELECT s2.BUILDING_ROOM,
    s2.SPACE_USAGE, s2.ORGANIZATION_NAME, s2.HR_ORG_UNIT_TITLE, s2.HR_DEPARTMENT_NAME,
    s2.window_column, s2.HR_DEPARTMENT_NAME_LONG, s2.DLC_NAME, s1.highest_floor FROM
    subq2 s2 LEFT JOIN subq1 s1 ON s2.SPACE_USAGE = s1.SPACE_USAGE;
  category: Facility Space and Organization Hierarchy Comprehensive Analysis
- default_granularity: one row per space unit with floor-2 access-level-1 rooms matched
    with each floor-2 room's access level deviation from its HR department average
  desc: For rooms on floor 2 with access level 1, show the space unit, the maximum
    row number (within a window of 2 preceding and 1 following rows ordered by building
    room) for each space unit, the building room, the organization name, the department
    name, and the difference between the access level of the room and the average
    access level for that department. Do not return any rounded answers.
  id: dw_4271
  name: Floor-2 Access-Level-1 Room Space Unit Max Row Numbers with Department Access
    Level Deviations
  sql: WITH inner_cte1 AS ( SELECT t1.BUILDING_ROOM, t1.SPACE_USAGE, t0.SPACE_UNIT,
    ROW_NUMBER() OVER (ORDER BY t1.BUILDING_ROOM ROWS BETWEEN 2 PRECEDING AND 1 FOLLOWING)
    AS window_column, t0.SPACE_UNIT_CODE FROM SPACE_UNIT t0 JOIN ZPM_ROOMS_LOAD t1
    ON t0.SPACE_UNIT_CODE = t1.SPACE_UNIT_CODE WHERE t1.FLOOR = 2 AND t1.ACCESS_LEVEL
    = 1 ), subq1 AS ( SELECT SPACE_UNIT, MAX(window_column) AS max_window_row_number,
    SPACE_UNIT_CODE FROM inner_cte1 GROUP BY SPACE_UNIT, SPACE_UNIT_CODE ), inner_cte2
    AS ( SELECT t0.BUILDING_ROOM, t1.ORGANIZATION_NAME, t2.HR_DEPARTMENT_NAME, t0.ACCESS_LEVEL,
    t0.SPACE_UNIT_CODE FROM ZPM_ROOMS_LOAD t0 JOIN FCLT_ORGANIZATION t1 ON t0.HR_ORG_UNIT_ID
    = t1.HR_ORG_UNIT_ID JOIN HR_ORG_UNIT t2 ON t1.HR_ORG_UNIT_ID = t2.HR_ORG_UNIT_ID
    WHERE t0.FLOOR = 2 ), dept_avg AS ( SELECT HR_DEPARTMENT_NAME, AVG(ACCESS_LEVEL)
    AS avg_access_level FROM inner_cte2 GROUP BY HR_DEPARTMENT_NAME ), subq2 AS (
    SELECT i.BUILDING_ROOM, i.ORGANIZATION_NAME, i.HR_DEPARTMENT_NAME, (i.ACCESS_LEVEL
    - d.avg_access_level) AS access_level_deviation, i.SPACE_UNIT_CODE FROM inner_cte2
    i JOIN dept_avg d ON i.HR_DEPARTMENT_NAME = d.HR_DEPARTMENT_NAME ) SELECT s1.SPACE_UNIT,
    s1.max_window_row_number, s2.BUILDING_ROOM, s2.ORGANIZATION_NAME, s2.HR_DEPARTMENT_NAME,
    s2.access_level_deviation FROM subq1 s1 JOIN subq2 s2 ON s1.SPACE_UNIT_CODE =
    s2.SPACE_UNIT_CODE ORDER BY s1.SPACE_UNIT, s2.BUILDING_ROOM;
  category: Facility Space and Organization Hierarchy Comprehensive Analysis
- default_granularity: one row per assignable organization with high HR department
    id matched with a space-unit-code-97500 space unit row of the same organization
  desc: For each organization that is assignable and has a department code above 100000,
    and for which there exists a space unit with space unit code equal to 97500, show
    the organization key, organization name, department name, the number of HR org
    units, the total of their department IDs, the latest warehouse load date from
    HR_ORG_UNIT, the space unit name, the DLC name, the DLC key from the organization,
    the minimum space unit code in a window of 3 preceding and 1 following row ordered
    by the facility organization key, and the total number of space units per organization,
    in that order. Do not return any rounded answers.
  id: dw_4330
  name: Assignable Organizations with High HR Department IDs Matched with Space Unit
    97500 Window Statistics
  sql: WITH org_hr_stats AS ( WITH inner_cte AS ( SELECT f.FCLT_ORGANIZATION_KEY,
    f.ORGANIZATION_NAME, h.HR_DEPARTMENT_NAME, COUNT(h.HR_ORG_UNIT_KEY) AS hr_org_unit_count,
    SUM(h.HR_DEPARTMENT_ID) AS total_department_id FROM FCLT_ORGANIZATION f JOIN HR_ORG_UNIT
    h ON f.HR_DEPARTMENT_CODE_OLD = h.HR_DEPARTMENT_CODE_OLD WHERE f.ASSIGNABLE =
    1 AND h.HR_DEPARTMENT_ID > 100000 GROUP BY f.FCLT_ORGANIZATION_KEY, f.ORGANIZATION_NAME,
    h.HR_DEPARTMENT_NAME ) SELECT i.FCLT_ORGANIZATION_KEY, i.ORGANIZATION_NAME, i.HR_DEPARTMENT_NAME,
    i.hr_org_unit_count, i.total_department_id, MAX(h.WAREHOUSE_LOAD_DATE) AS latest_hr_org_unit_load_date
    FROM inner_cte i JOIN HR_ORG_UNIT h ON i.HR_DEPARTMENT_NAME = h.HR_DEPARTMENT_NAME
    GROUP BY i.FCLT_ORGANIZATION_KEY, i.ORGANIZATION_NAME, i.HR_DEPARTMENT_NAME, i.hr_org_unit_count,
    i.total_department_id ), space_unit_stats AS ( WITH inner_cte AS ( SELECT t2.SPACE_UNIT
    AS space_unit_name, t1.ORGANIZATION_NAME AS organization_name, t1.DLC_NAME AS
    dlc_name, t1.DLC_KEY AS org_dlc_key, MIN(t2.SPACE_UNIT_CODE) OVER (ORDER BY t2.FCLT_ORGANIZATION_KEY
    ROWS BETWEEN 3 PRECEDING AND 1 FOLLOWING) AS window_min_space_unit_code, t1.FCLT_ORGANIZATION_KEY
    FROM FCLT_ORG_DLC_KEY t0 JOIN FCLT_ORGANIZATION t1 ON t0.DLC_KEY = t1.DLC_KEY
    JOIN SPACE_UNIT t2 ON t1.DLC_KEY = t2.DLC_KEY WHERE t2.SPACE_UNIT_CODE = 97500
    ) SELECT inner_cte.space_unit_name, inner_cte.organization_name, inner_cte.dlc_name,
    inner_cte.org_dlc_key, inner_cte.window_min_space_unit_code, org_unit_counts.total_space_units,
    inner_cte.FCLT_ORGANIZATION_KEY FROM inner_cte JOIN ( SELECT t1.ORGANIZATION_NAME,
    COUNT(DISTINCT t2.SPACE_UNIT_KEY) AS total_space_units FROM FCLT_ORG_DLC_KEY t0
    JOIN FCLT_ORGANIZATION t1 ON t0.DLC_KEY = t1.DLC_KEY JOIN SPACE_UNIT t2 ON t1.DLC_KEY
    = t2.DLC_KEY GROUP BY t1.ORGANIZATION_NAME ) AS org_unit_counts ON inner_cte.organization_name
    = org_unit_counts.ORGANIZATION_NAME ) SELECT o.FCLT_ORGANIZATION_KEY, o.ORGANIZATION_NAME,
    o.HR_DEPARTMENT_NAME, o.hr_org_unit_count, o.total_department_id, o.latest_hr_org_unit_load_date,
    s.space_unit_name, s.dlc_name, s.org_dlc_key, s.window_min_space_unit_code, s.total_space_units
    FROM org_hr_stats o JOIN space_unit_stats s ON o.FCLT_ORGANIZATION_KEY = s.FCLT_ORGANIZATION_KEY
  category: Facility Space and Organization Hierarchy Comprehensive Analysis
- default_granularity: one row per Provost Area department rank matched with a space-unit-97500
    supervisor usage statistics row of the same DLC
  desc: For each department in the "Provost Area" that is associated with a space
    unit with space unit code 97500, show the department code, department name, school
    area name, the rank of each department within its school area based on department
    code, the corresponding DLC name, the space unit name, space unit code, associated
    organization name, department count, number of supervisees, and the highest research
    volume ever recorded for each department count group. Do not return any rounded
    answers.
  id: dw_4452
  name: Provost Area Department School-Area Ranks with Space Unit 97500 Supervisor
    Usage Statistics
  sql: WITH inner_cte1 AS ( SELECT t1.HR_DEPARTMENT_CODE, t1.HR_DEPARTMENT_NAME, t1.ORG_HIER_SCHOOL_AREA_NAME,
    RANK() OVER (PARTITION BY t1.ORG_HIER_SCHOOL_AREA_NAME ORDER BY t1.HR_DEPARTMENT_CODE)
    AS window_column, t1.DLC_KEY FROM MASTER_DEPT_HIERARCHY t0 INNER JOIN HR_ORG_UNIT
    t1 ON t0.DLC_KEY = t1.DLC_KEY WHERE t0.MASTER_DEPT_HIER_LEVEL_2_NAME = 'Provost
    Area' ), DeptRanked AS ( SELECT inner_cte1.HR_DEPARTMENT_CODE, inner_cte1.HR_DEPARTMENT_NAME,
    inner_cte1.ORG_HIER_SCHOOL_AREA_NAME, inner_cte1.window_column, t2.DLC_NAME, inner_cte1.DLC_KEY
    FROM inner_cte1 INNER JOIN HR_ORG_UNIT t2 ON inner_cte1.DLC_KEY = t2.DLC_KEY ),
    inner_cte2 AS ( SELECT t1.SPACE_UNIT AS space_unit_name, t1.SPACE_UNIT_CODE, t0.ORGANIZATION_NAME,
    t2.DEPT_COUNT, t2.NUM_OF_SUPERVISEES, t2.RESEARCH_VOLUME, t1.DLC_KEY FROM FCLT_ORGANIZATION
    t0 JOIN SPACE_UNIT t1 ON t0.DLC_KEY = t1.DLC_KEY JOIN SPACE_SUPERVISOR_USAGE t2
    ON t1.DLC_KEY = t2.DEPT_NAMES WHERE t1.SPACE_UNIT_CODE = 97500 ), SpaceStats AS
    ( SELECT space_unit_name, SPACE_UNIT_CODE, ORGANIZATION_NAME, DEPT_COUNT, NUM_OF_SUPERVISEES,
    MAX(RESEARCH_VOLUME) AS highest_research_volume, DLC_KEY FROM inner_cte2 GROUP
    BY space_unit_name, SPACE_UNIT_CODE, ORGANIZATION_NAME, DEPT_COUNT, NUM_OF_SUPERVISEES,
    DLC_KEY ) SELECT d.HR_DEPARTMENT_CODE, d.HR_DEPARTMENT_NAME, d.ORG_HIER_SCHOOL_AREA_NAME,
    d.window_column, d.DLC_NAME, s.space_unit_name, s.SPACE_UNIT_CODE, s.ORGANIZATION_NAME,
    s.DEPT_COUNT, s.NUM_OF_SUPERVISEES, s.highest_research_volume FROM DeptRanked
    d JOIN SpaceStats s ON d.DLC_KEY = s.DLC_KEY ORDER BY d.HR_DEPARTMENT_CODE, s.space_unit_name;
  category: Facility Space and Organization Hierarchy Comprehensive Analysis
- default_granularity: one row per S H&SS organization space unit rollup row (including
    SUBTOTAL and TOTAL rows) with supervisor usage statistics
  desc: For each organization whose parent is 'S H&SS' and that is associated with
    a space unit with space unit code 97500, list the organization name, description,
    HR org unit title, row number within a window of 2 preceding and 1 following rows
    ordered by the organization name, the space unit name, space unit code, department
    count, number of supervisees, the average department count within each department
    count group ordered by number of supervisees, and the total square footage for
    each organization. Include subtotals for each organization (the corresponding
    organization name field is 'SUBTOTAL') and a grand total across all organizations
    (the corresponding organization name field is 'TOTAL'). Do not repeat the organization
    name if it is the same as the previous row. Sort the table by organization name
    and space unit name. Do not return any rounded answers.
  id: dw_4612
  name: S H&SS Organization Rollup with Space Unit 97500 Supervisor Usage Statistics
    and Total Square Footage
  sql: WITH inner_cte AS ( WITH OrgWindowed AS ( SELECT t0.ORGANIZATION_NAME, t0.DESCRIPTION,
    t1.HR_ORG_UNIT_TITLE, ROW_NUMBER() OVER (ORDER BY t0.ORGANIZATION_NAME ROWS BETWEEN
    2 PRECEDING AND 1 FOLLOWING) AS window_column, t0.DLC_KEY FROM FCLT_ORGANIZATION
    t0 JOIN HR_ORG_UNIT t1 ON t0.HR_ORG_UNIT_ID = t1.HR_ORG_UNIT_ID WHERE t0.ORG_PARENT
    = 'S H&SS' ), SpaceUnitStats AS ( SELECT t1.SPACE_UNIT AS space_unit_name, t1.SPACE_UNIT_CODE,
    t0.ORGANIZATION_NAME, t2.DEPT_COUNT, t2.NUM_OF_SUPERVISEES, AVG(t2.DEPT_COUNT)
    OVER (PARTITION BY t2.DEPT_COUNT ORDER BY t2.NUM_OF_SUPERVISEES) AS avg_dept_count_within_group,
    t2.SQFT, t1.DLC_KEY FROM FCLT_ORGANIZATION t0 JOIN SPACE_UNIT t1 ON t0.DLC_KEY
    = t1.DLC_KEY JOIN SPACE_SUPERVISOR_USAGE t2 ON t1.DLC_KEY = t2.DEPT_NAMES WHERE
    t1.SPACE_UNIT_CODE = 97500 ) SELECT ow.ORGANIZATION_NAME, ow.DESCRIPTION, ow.HR_ORG_UNIT_TITLE,
    ow.window_column, sus.space_unit_name, sus.SPACE_UNIT_CODE, sus.DEPT_COUNT, sus.NUM_OF_SUPERVISEES,
    sus.avg_dept_count_within_group, sus.SQFT FROM OrgWindowed ow JOIN SpaceUnitStats
    sus ON ow.DLC_KEY = sus.DLC_KEY ) SELECT CASE WHEN LAG(ORGANIZATION_NAME) OVER
    (ORDER BY org_sort, space_unit_name) = ORGANIZATION_NAME THEN NULL ELSE ORGANIZATION_NAME
    END AS organization_name, DESCRIPTION, HR_ORG_UNIT_TITLE, window_column, space_unit_name,
    SPACE_UNIT_CODE, DEPT_COUNT, NUM_OF_SUPERVISEES, avg_dept_count_within_group,
    SQFT, SUM(SQFT) OVER (PARTITION BY ORGANIZATION_NAME) AS total_sqft_per_org FROM
    ( SELECT CASE WHEN GROUPING(ORGANIZATION_NAME) = 1 AND GROUPING(space_unit_name)
    = 1 THEN 'zzz' ELSE ORGANIZATION_NAME END AS org_sort, CASE WHEN GROUPING(ORGANIZATION_NAME)
    = 0 AND GROUPING(space_unit_name) = 1 THEN 'SUBTOTAL' WHEN GROUPING(ORGANIZATION_NAME)
    = 1 AND GROUPING(space_unit_name) = 1 THEN 'TOTAL' ELSE ORGANIZATION_NAME END
    AS ORGANIZATION_NAME, DESCRIPTION, HR_ORG_UNIT_TITLE, window_column, CASE WHEN
    GROUPING(ORGANIZATION_NAME) = 0 AND GROUPING(space_unit_name) = 1 THEN 'zzz' ELSE
    space_unit_name END AS space_unit_sort, space_unit_name, SPACE_UNIT_CODE, DEPT_COUNT,
    NUM_OF_SUPERVISEES, avg_dept_count_within_group, SQFT FROM inner_cte GROUP BY
    ORGANIZATION_NAME, DESCRIPTION, HR_ORG_UNIT_TITLE, window_column, space_unit_name,
    SPACE_UNIT_CODE, DEPT_COUNT, NUM_OF_SUPERVISEES, avg_dept_count_within_group,
    SQFT WITH ROLLUP ) tbl ORDER BY org_sort, space_unit_sort;
  category: Facility Space and Organization Hierarchy Comprehensive Analysis
- default_granularity: one row per level-5 organization space unit matched with a
    floor-2 space-planning room sharing the space unit code
  desc: For each organization with an organization level of 5 and for rooms on floor
    2 that are associated via space unit code, show the organization name, organization
    key, description, space unit, space unit key, the average organization key within
    each organization key group ordered by space unit key, the building room, space
    usage, the HR org unit title, the department name, the minimum access level in
    a window of 3 preceding and 1 following row ordered by the building component,
    and the HR org unit level and department code for each room, ordered by organization
    name and building room. Do not return any rounded answers.
  id: dw_4773
  name: Level-5 Organization Space Units Matched with Floor-2 Rooms via Space Unit
    Code and HR Department Attributes
  sql: WITH inner_cte AS ( WITH OrgLevel5 AS ( SELECT t0.ORGANIZATION_NAME, t0.FCLT_ORGANIZATION_KEY,
    t0.DESCRIPTION, t1.SPACE_UNIT, t1.SPACE_UNIT_KEY, AVG(t0.FCLT_ORGANIZATION_KEY)
    OVER (PARTITION BY t0.FCLT_ORGANIZATION_KEY ORDER BY t1.SPACE_UNIT_KEY) AS window_column
    FROM FCLT_ORGANIZATION t0 JOIN SPACE_UNIT t1 ON t0.FCLT_ORGANIZATION_KEY = t1.FCLT_ORGANIZATION_KEY
    WHERE t0.ORGANIZATION_LEVEL = 5 ), RoomsFloor2 AS ( SELECT t0.BUILDING_ROOM, t0.SPACE_USAGE,
    t1.ORGANIZATION_NAME, t2.HR_ORG_UNIT_TITLE, t2.HR_DEPARTMENT_NAME, MIN(t0.ACCESS_LEVEL)
    OVER (ORDER BY t0.BUILDING_COMPONENT ROWS BETWEEN 3 PRECEDING AND 1 FOLLOWING)
    AS window_column, t0.SPACE_UNIT_CODE, t0.HR_ORG_UNIT_ID FROM ZPM_ROOMS_LOAD t0
    JOIN FCLT_ORGANIZATION t1 ON t0.HR_ORG_UNIT_ID = t1.HR_ORG_UNIT_ID JOIN HR_ORG_UNIT
    t2 ON t1.HR_ORG_UNIT_ID = t2.HR_ORG_UNIT_ID WHERE t0.FLOOR = 2 ), CombinedResults
    AS ( SELECT o.ORGANIZATION_NAME, o.FCLT_ORGANIZATION_KEY, o.DESCRIPTION, o.SPACE_UNIT,
    o.SPACE_UNIT_KEY, o.window_column AS org_window_column, r.BUILDING_ROOM, r.SPACE_USAGE,
    r.HR_ORG_UNIT_TITLE, r.HR_DEPARTMENT_NAME, r.window_column AS room_window_column,
    r.HR_ORG_UNIT_ID FROM OrgLevel5 o JOIN SPACE_UNIT su ON o.SPACE_UNIT_KEY = su.SPACE_UNIT_KEY
    JOIN RoomsFloor2 r ON su.SPACE_UNIT_CODE = r.SPACE_UNIT_CODE ) SELECT cr.ORGANIZATION_NAME,
    cr.FCLT_ORGANIZATION_KEY, cr.DESCRIPTION, cr.SPACE_UNIT, cr.SPACE_UNIT_KEY, cr.org_window_column,
    cr.BUILDING_ROOM, cr.SPACE_USAGE, cr.HR_ORG_UNIT_TITLE, cr.HR_DEPARTMENT_NAME,
    cr.room_window_column, h.HR_ORG_UNIT_LEVEL, h.HR_DEPARTMENT_CODE FROM CombinedResults
    cr JOIN HR_ORG_UNIT h ON cr.HR_ORG_UNIT_ID = h.HR_ORG_UNIT_ID ) SELECT * FROM
    inner_cte ORDER BY ORGANIZATION_NAME, BUILDING_ROOM;
  category: Facility Space and Organization Hierarchy Comprehensive Analysis
- id: dw_3235
  name: Provost Area Department Facility Organization Counts with HR Org Unit Count
    Dispersion
  desc: For each department name and its corresponding facility organization key where
    the department is in the Provost Area, provide the number of organizations, the
    minimum department hierarchy level 3 code, the range, variance, and standard deviation
    (using STDDEV only and never STDDEV_POP) of the number of HR organization units
    per facility organization (considering only those with a non-null DLC key and
    where the hierarchy type is 'Standard Hierarchy'), listing the results in order
    by department name and facility organization key. Do not return any rounded answers.
  sql: WITH ProvostAreaDepts AS ( SELECT m.DLC_NAME, f.FCLT_ORGANIZATION_KEY, COUNT(f.FCLT_ORGANIZATION_KEY)
    AS org_count, MIN(m.MASTER_DEPT_HIER_LEVEL_3_CODE) AS min_level3_code FROM MASTER_DEPT_HIERARCHY
    m JOIN FCLT_ORG_DLC_KEY f ON m.DLC_KEY = f.DLC_KEY WHERE m.MASTER_DEPT_HIER_LEVEL_2_NAME
    = 'Provost Area' GROUP BY m.DLC_NAME, f.FCLT_ORGANIZATION_KEY ), FacilityOrgStats
    AS ( SELECT f.FCLT_ORGANIZATION_KEY, MAX(hr_unit_count) - MIN(hr_unit_count) AS
    org_unit_count_range, VARIANCE(hr_unit_count) AS org_unit_count_variance, STDDEV(hr_unit_count)
    AS org_unit_count_stddev FROM FCLT_ORG_DLC_KEY f JOIN MASTER_DEPT_HIERARCHY m
    ON f.DLC_KEY = m.DLC_KEY JOIN ( SELECT h.DLC_KEY, COUNT(*) AS hr_unit_count FROM
    HR_ORG_UNIT h WHERE h.DLC_KEY IS NOT NULL GROUP BY h.DLC_KEY ) AS hr_stats ON
    m.DLC_KEY = hr_stats.DLC_KEY WHERE f.DLC_KEY IS NOT NULL AND m.HIERARCHY_TYPE
    = 'Standard Hierarchy' GROUP BY f.FCLT_ORGANIZATION_KEY ORDER BY org_unit_count_range
    DESC ), CombinedProvostFacility AS ( SELECT p.DLC_NAME, p.FCLT_ORGANIZATION_KEY,
    p.org_count, p.min_level3_code, f.org_unit_count_range, f.org_unit_count_variance,
    f.org_unit_count_stddev FROM ProvostAreaDepts p JOIN FacilityOrgStats f ON p.FCLT_ORGANIZATION_KEY
    = f.FCLT_ORGANIZATION_KEY ) SELECT * FROM CombinedProvostFacility ORDER BY DLC_NAME,
    FCLT_ORGANIZATION_KEY;
  category: Facility Space and Organization Hierarchy Comprehensive Analysis
  default_granularity: one row per Provost Area department name and facility organization
    key with HR org unit count dispersion statistics
- id: dw_4776
  name: Large Rooms of Provost Area Departments with Windowed Area Averages and Department
    School-Area Ranks
  desc: For rooms with an area greater than 300 that are associated with departments
    in the "Provost Area", show the building-room identifier, floor number, major
    use description, organization name, DLC key, the average area in a window of 2
    preceding and 2 following rows grouped by department code and ordered by area,
    the department code, department name, school area name, and the rank of each department
    within its school area based on department code. Additionally, include the department's
    full name from the HR organization unit and the department's hierarchy level 3
    name from the master department hierarchy. Present the results ordered by building-room
    identifier and department code. Do not return any rounded answers.
  sql: WITH inner_cte AS ( WITH RoomStats AS ( SELECT t1.BUILDING_ROOM, t1.FLOOR,
    t1.MAJOR_USE_DESC, t1.ORGANIZATION_NAME, t0.DLC_KEY, t1.DEPT_CODE, AVG(t1.AREA)
    OVER (PARTITION BY t1.DEPT_CODE ORDER BY t1.AREA ROWS BETWEEN 2 PRECEDING AND
    2 FOLLOWING) AS window_avg_area FROM FCLT_ORG_DLC_KEY t0 JOIN FCLT_ROOMS t1 ON
    t0.FCLT_ORGANIZATION_KEY = t1.FCLT_ORGANIZATION_KEY WHERE t1.AREA > 300 ), ProvostDepts
    AS ( SELECT t1.HR_DEPARTMENT_CODE, t1.HR_DEPARTMENT_NAME, t1.ORG_HIER_SCHOOL_AREA_NAME,
    t1.DLC_KEY, RANK() OVER (PARTITION BY t1.ORG_HIER_SCHOOL_AREA_NAME ORDER BY t1.HR_DEPARTMENT_CODE)
    AS window_column FROM MASTER_DEPT_HIERARCHY t0 INNER JOIN HR_ORG_UNIT t1 ON t0.DLC_KEY
    = t1.DLC_KEY WHERE t0.MASTER_DEPT_HIER_LEVEL_2_NAME = 'Provost Area' ) SELECT
    rs.BUILDING_ROOM, rs.FLOOR, rs.MAJOR_USE_DESC, rs.ORGANIZATION_NAME, rs.DLC_KEY,
    rs.window_avg_area, pd.HR_DEPARTMENT_CODE, pd.HR_DEPARTMENT_NAME, pd.ORG_HIER_SCHOOL_AREA_NAME,
    pd.window_column FROM RoomStats rs JOIN ProvostDepts pd ON rs.DLC_KEY = pd.DLC_KEY
    ) SELECT icte.BUILDING_ROOM, icte.FLOOR, icte.MAJOR_USE_DESC, icte.ORGANIZATION_NAME,
    icte.DLC_KEY, icte.window_avg_area, icte.HR_DEPARTMENT_CODE, icte.HR_DEPARTMENT_NAME,
    icte.ORG_HIER_SCHOOL_AREA_NAME, icte.window_column, hou.HR_DEPARTMENT_NAME_LONG
    AS DEPARTMENT_FULL_NAME, mdh.MASTER_DEPT_HIER_LEVEL_3_NAME AS DEPT_HIERARCHY_LVL3_NAME
    FROM inner_cte icte LEFT JOIN HR_ORG_UNIT hou ON icte.DLC_KEY = hou.DLC_KEY AND
    icte.HR_DEPARTMENT_CODE = hou.HR_DEPARTMENT_CODE LEFT JOIN MASTER_DEPT_HIERARCHY
    mdh ON icte.DLC_KEY = mdh.DLC_KEY ORDER BY icte.BUILDING_ROOM, icte.HR_DEPARTMENT_CODE
  category: Facility Space and Organization Hierarchy Comprehensive Analysis
  default_granularity: one row per large room of a Provost Area department matched
    with the department's HR org unit and master hierarchy attributes
- id: dw_2844
  name: 2021JA IAP Categories with 5+ Activities and Total Max Enrollment
  desc: For each subject category that had at least 5 activities in the 2021JA term,
    show the subject category key, the category name, the number of activities, the
    total maximum enrollment across those activities, and the description of the subject
    category. Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT c.IAP_SUBJECT_CATEGORY_KEY, c.IAP_CATEGORY_NAME,
    COUNT(d.ACTIVITY_TITLE) AS activity_count, SUM(d.MAX_ENROLLMENT) AS total_max_enrollment
    FROM IAP_SUBJECT_CATEGORY c JOIN IAP_SUBJECT_DETAIL d ON c.IAP_SUBJECT_CATEGORY_KEY
    = d.IAP_SUBJECT_CATEGORY_KEY WHERE d.TERM_CODE = '2021JA' GROUP BY c.IAP_SUBJECT_CATEGORY_KEY,
    c.IAP_CATEGORY_NAME HAVING COUNT(d.ACTIVITY_TITLE) >= 5 ) SELECT inner_cte.IAP_SUBJECT_CATEGORY_KEY,
    inner_cte.IAP_CATEGORY_NAME, inner_cte.activity_count, inner_cte.total_max_enrollment,
    c.IAP_CATEGORY_DESC FROM inner_cte JOIN IAP_SUBJECT_CATEGORY c ON inner_cte.IAP_SUBJECT_CATEGORY_KEY
    = c.IAP_SUBJECT_CATEGORY_KEY;
  category: IAP Activity Analysis
  default_granularity: one row per IAP subject category with at least 5 activities
    in the term
- id: dw_2574
  name: IAP Activity Counts and Term Date Bounds per Category and Enrollment Type
  desc: For each subject category and enrollment type where the maximum enrollment
    is greater than 10, provide the number of activities, the earliest start date
    of the corresponding academic term, and the latest end date of the corresponding
    academic term. Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT d.IAP_SUBJECT_CATEGORY_KEY, d.ENROLLMENT_TYPE, COUNT(d.ACTIVITY_TITLE)
    AS activity_count, MIN(t.START_DATE) AS earliest_start_date FROM IAP_SUBJECT_DETAIL
    d JOIN TIME_DAY t ON d.TERM_CODE = t.ACADEMIC_TERM_CODE WHERE d.MAX_ENROLLMENT
    > 10 GROUP BY d.IAP_SUBJECT_CATEGORY_KEY, d.ENROLLMENT_TYPE ) SELECT c.IAP_SUBJECT_CATEGORY_KEY,
    c.ENROLLMENT_TYPE, c.activity_count, c.earliest_start_date, MAX(t.END_DATE) AS
    latest_end_date FROM inner_cte c JOIN IAP_SUBJECT_DETAIL d ON c.IAP_SUBJECT_CATEGORY_KEY
    = d.IAP_SUBJECT_CATEGORY_KEY AND c.ENROLLMENT_TYPE = d.ENROLLMENT_TYPE JOIN TIME_DAY
    t ON d.TERM_CODE = t.ACADEMIC_TERM_CODE GROUP BY c.IAP_SUBJECT_CATEGORY_KEY, c.ENROLLMENT_TYPE,
    c.activity_count, c.earliest_start_date;
  category: IAP Activity and Academic Term Comprehensive Analysis
  default_granularity: one row per IAP subject category and enrollment type combination
- id: dw_2603
  name: 2021JA Non-Cancelled IAP Activities with Calendar Fiscal Year and Row Number
    Window
  desc: For IAP subject activities in the term "2021JA" that are not cancelled, show
    the activity title, enrollment type, calendar date, and the fiscal year of the
    calendar date, and assign row numbers within a window of 2 preceding and 1 following
    rows ordered by activity title. Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT t0.ACTIVITY_TITLE, t0.ENROLLMENT_TYPE, t1.CALENDAR_DATE,
    ROW_NUMBER() OVER (ORDER BY t0.ACTIVITY_TITLE ROWS BETWEEN 2 PRECEDING AND 1 FOLLOWING)
    AS window_column FROM IAP_SUBJECT_DETAIL t0 JOIN TIME_DAY t1 ON t0.TERM_CODE =
    t1.ACADEMIC_TERM_CODE WHERE t0.TERM_CODE = '2021JA' AND t0.IS_CANCELLED = 'N'
    ) SELECT inner_cte.ACTIVITY_TITLE, inner_cte.ENROLLMENT_TYPE, inner_cte.CALENDAR_DATE,
    t1.FISCAL_YEAR, inner_cte.window_column FROM inner_cte JOIN TIME_DAY t1 ON inner_cte.CALENDAR_DATE
    = t1.CALENDAR_DATE
  category: IAP Activity and Academic Term Comprehensive Analysis
  default_granularity: one row per IAP activity per calendar date in the term
- id: dw_2737
  name: IAP Max Enrollment Statistics per Person Role with Capacity Classification
  desc: For each person role, provide the person role name, the average, range, and
    variance of the maximum enrollment values for the activities they lead (considering
    only activities that are not cancelled and have a specified maximum enrollment),
    and indicate whether the average maximum enrollment for that role is 'HIGH_CAPACITY'
    (at least 20% greater than the overall average), 'LOW_CAPACITY' (at least 20%
    less than the overall average), or 'AVERAGE'. Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT p.PERSON_ROLE, AVG(d.MAX_ENROLLMENT) AS avg_max_enrollment,
    MAX(d.MAX_ENROLLMENT) - MIN(d.MAX_ENROLLMENT) AS max_enrollment_range, VARIANCE(d.MAX_ENROLLMENT)
    AS max_enrollment_variance FROM IAP_SUBJECT_PERSON p JOIN IAP_SUBJECT_DETAIL d
    ON p.IAP_SUBJECT_PERSON_KEY = d.IAP_SUBJECT_PERSON_KEY WHERE d.IS_CANCELLED =
    'N' AND d.MAX_ENROLLMENT IS NOT NULL GROUP BY p.PERSON_ROLE ) SELECT cte.PERSON_ROLE,
    cte.avg_max_enrollment, cte.max_enrollment_range, cte.max_enrollment_variance,
    CASE WHEN cte.avg_max_enrollment > overall.avg_enrollment * 1.2 THEN 'HIGH_CAPACITY'
    WHEN cte.avg_max_enrollment < overall.avg_enrollment * 0.8 THEN 'LOW_CAPACITY'
    ELSE 'AVERAGE' END AS capacity_category FROM inner_cte cte CROSS JOIN ( SELECT
    AVG(d.MAX_ENROLLMENT) AS avg_enrollment FROM IAP_SUBJECT_DETAIL d WHERE d.IS_CANCELLED
    = 'N' AND d.MAX_ENROLLMENT IS NOT NULL ) overall ORDER BY cte.max_enrollment_range
    DESC;
  category: IAP Activity Analysis
  default_granularity: one row per IAP person role
- id: dw_1965
  name: 2017JA Chemistry TIP Subjects with Course Materials Enrollment Windows and
    Per-Faculty Max Enrollment
  desc: For subjects offered in the term '2017JA' by the Chemistry department (Course
    5) that have course materials, show the subject title, the number of enrolled
    students, the responsible faculty name, the offering department name, the department
    full name, the school name, the minimum number of enrolled students in a window
    of 3 preceding and 1 following row ordered by the department code, the subject
    code, the subject code description, the minimum number of enrolled students over
    each subject code group ordered by subject code, and the maximum number of enrolled
    students for each responsible faculty across all their Chemistry subjects in that
    term. Do not return any rounded answers.
  category: Textbook Material and Enrollment Comprehensive Analysis
  sql: WITH inner_cte AS ( WITH Subquery1 AS ( SELECT t0.SUBJECT_TITLE, t0.NUM_ENROLLED_STUDENTS,
    t0.RESPONSIBLE_FACULTY_NAME, t0.OFFER_DEPT_NAME, t1.DEPARTMENT_FULL_NAME, t1.SCHOOL_NAME,
    t0.OFFER_DEPT_CODE, MIN(t0.NUM_ENROLLED_STUDENTS) OVER ( ORDER BY t1.DEPARTMENT_CODE
    ROWS BETWEEN 3 PRECEDING AND 1 FOLLOWING ) AS window_column FROM TIP_SUBJECT_OFFERED
    t0 JOIN STUDENT_DEPARTMENT t1 ON t0.OFFER_DEPT_CODE = t1.DEPARTMENT_CODE WHERE
    t0.TERM_CODE = '2017JA' AND t0.OFFER_DEPT_NAME = 'Chemistry' AND t0.IS_NO_COURSE_MATERIAL
    = 'N' ), Subquery2 AS ( SELECT t0.SUBJECT_TITLE, t0.NUM_ENROLLED_STUDENTS, t0.OFFER_DEPT_NAME,
    t1.DEPARTMENT_FULL_NAME, t2.SUBJECT_CODE, t2.SUBJECT_CODE_DESC, t1.DEPARTMENT_CODE,
    min(t0.NUM_ENROLLED_STUDENTS) OVER ( PARTITION BY t2.SUBJECT_CODE ORDER BY t2.SUBJECT_CODE
    ) AS window_column FROM TIP_SUBJECT_OFFERED t0 JOIN SIS_DEPARTMENT t1 ON t0.OFFER_DEPT_CODE
    = t1.DEPARTMENT_CODE JOIN SIS_SUBJECT_CODE t2 ON t1.DEPARTMENT_CODE = t2.DEPARTMENT_CODE
    WHERE t0.TERM_CODE = '2017JA' AND t0.OFFER_DEPT_NAME = 'Chemistry' AND t0.IS_NO_COURSE_MATERIAL
    = 'N' ORDER BY t2.SUBJECT_CODE ) SELECT s1.SUBJECT_TITLE, s1.NUM_ENROLLED_STUDENTS,
    s1.RESPONSIBLE_FACULTY_NAME, s1.OFFER_DEPT_NAME, s1.DEPARTMENT_FULL_NAME, s1.SCHOOL_NAME,
    s1.window_column AS min_enrolled_window, s2.SUBJECT_CODE, s2.SUBJECT_CODE_DESC,
    s2.window_column AS min_enrolled_by_code FROM Subquery1 s1 JOIN Subquery2 s2 ON
    s1.SUBJECT_TITLE = s2.SUBJECT_TITLE AND s1.NUM_ENROLLED_STUDENTS = s2.NUM_ENROLLED_STUDENTS
    AND s1.OFFER_DEPT_NAME = s2.OFFER_DEPT_NAME AND s1.DEPARTMENT_FULL_NAME = s2.DEPARTMENT_FULL_NAME
    AND s1.OFFER_DEPT_CODE = s2.DEPARTMENT_CODE ) SELECT icte.*, mf.max_enrolled_by_faculty
    FROM inner_cte icte JOIN ( SELECT RESPONSIBLE_FACULTY_NAME, MAX(NUM_ENROLLED_STUDENTS)
    AS max_enrolled_by_faculty FROM TIP_SUBJECT_OFFERED WHERE TERM_CODE = '2017JA'
    AND OFFER_DEPT_NAME = 'Chemistry' AND IS_NO_COURSE_MATERIAL = 'N' GROUP BY RESPONSIBLE_FACULTY_NAME
    ) mf ON icte.RESPONSIBLE_FACULTY_NAME = mf.RESPONSIBLE_FACULTY_NAME ;
  default_granularity: one row per 2017JA Chemistry TIP subject with course materials,
    enriched with subject-code and faculty-level enrollment aggregates
- id: dw_2590
  name: Mathematics Hayden Library Instructors Ranked by Distinct Course Count
  desc: Among all instructors who have taught courses in the "18 - Mathematics" department
    and in the "Hayden" unit, list each instructor's MIT ID, the total number of distinct
    courses they have taught in that department and unit, and their dense rank among
    all such instructors based on the number of courses taught (with ties sharing
    the same rank), ordered from most to least courses taught. Do not return any rounded
    answers.
  sql: WITH inner_cte AS ( SELECT t1.MIT_ID, t0.COURSE_NAME FROM LIBRARY_COURSE_INSTRUCTOR
    t0 JOIN SE_PERSON t1 ON t0.INSTRUCTOR_NAME = t1.FULL_NAME WHERE t0.DEPARTMENT
    = '18 - Mathematics' AND t0.UNIT = 'Hayden' ) SELECT icte.MIT_ID, COUNT(DISTINCT
    icte.COURSE_NAME) AS Num_Courses_Taught, DENSE_RANK() OVER (ORDER BY COUNT(DISTINCT
    icte.COURSE_NAME) DESC) AS Instructor_Rank FROM inner_cte icte GROUP BY icte.MIT_ID
    ORDER BY Num_Courses_Taught DESC
  category: Library Reserve Instructor Teaching Analysis
  default_granularity: one row per instructor (MIT_ID) within the filtered department
    and library unit
- id: dw_2850
  name: Status-U Reserve Catalog Key Variance by Term and Department with Rollup Totals
  desc: For each term and department, what is the term, department, and the variance
    of the reserve catalog keys for courses in that department and term where the
    material status is 'U'? Include subtotals for each term (the corresponding term
    field is 'SUBTOTAL') and a grand total across all terms (the corresponding term
    field is 'TOTAL'). Do not repeat the term if it is the same as the previous row.
    Sort the table by term and department. Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT lci.DEPARTMENT, lrmd.TERM_CODE, VARIANCE(lrmd.LIBRARY_RESERVE_CATALOG_KEY)
    AS catalog_key_variance FROM LIBRARY_COURSE_INSTRUCTOR lci JOIN LIBRARY_RESERVE_MATRL_DETAIL
    lrmd ON lci.LIBRARY_COURSE_INSTRUCTOR_KEY = lrmd.LIBRARY_COURSE_INSTRUCTOR_KEY
    WHERE lrmd.LIBRARY_MATERIAL_STATUS_KEY = 'U' GROUP BY lci.DEPARTMENT, lrmd.TERM_CODE
    ) SELECT CASE WHEN LAG(term) OVER (ORDER BY term_sort, term, dept_sort) = term
    THEN NULL ELSE term END AS term, dept, catalog_key_variance FROM ( SELECT CASE
    WHEN GROUPING(TERM_CODE) = 1 AND GROUPING(DEPARTMENT) = 1 THEN 'zzz' ELSE TERM_CODE
    END AS term_sort, CASE WHEN GROUPING(TERM_CODE) = 0 AND GROUPING(DEPARTMENT) =
    1 THEN 'SUBTOTAL' WHEN GROUPING(TERM_CODE) = 1 AND GROUPING(DEPARTMENT) = 1 THEN
    'TOTAL' ELSE TERM_CODE END AS term, CASE WHEN GROUPING(TERM_CODE) = 0 AND GROUPING(DEPARTMENT)
    = 1 THEN 'zzz' ELSE DEPARTMENT END AS dept_sort, DEPARTMENT AS dept, VARIANCE(LIBRARY_RESERVE_CATALOG_KEY)
    AS catalog_key_variance FROM ( SELECT lci.DEPARTMENT, lrmd.TERM_CODE, lrmd.LIBRARY_RESERVE_CATALOG_KEY
    FROM LIBRARY_COURSE_INSTRUCTOR lci JOIN LIBRARY_RESERVE_MATRL_DETAIL lrmd ON lci.LIBRARY_COURSE_INSTRUCTOR_KEY
    = lrmd.LIBRARY_COURSE_INSTRUCTOR_KEY WHERE lrmd.LIBRARY_MATERIAL_STATUS_KEY =
    'U' ) base GROUP BY TERM_CODE, DEPARTMENT WITH ROLLUP ) tbltmp ORDER BY term_sort,
    dept_sort;
  category: Library Reserve and Course Instructor Comprehensive Analysis
  default_granularity: one row per term and department, plus per-term subtotal rows
    and a grand total row
- id: dw_3234
  name: Top 10 TIP Material Statuses by Material Count with 2009SP Library Reserve
    Status Counts
  desc: For the top 10 material statuses by the number of materials, what is the material
    status description, the count of materials for each status, the associated library
    material status, and the count of reserve catalog items for each library material
    status for term code '2009SP'? Do not return any rounded answers.
  sql: WITH TopMaterialStatuses AS ( SELECT tms.TIP_MATERIAL_STATUS, COUNT(td.TIP_MATERIAL_KEY)
    AS material_count FROM TIP_DETAIL td JOIN TIP_MATERIAL_STATUS tms ON td.TIP_MATERIAL_STATUS_KEY
    = tms.TIP_MATERIAL_STATUS_KEY GROUP BY tms.TIP_MATERIAL_STATUS ORDER BY material_count
    DESC LIMIT 10 ), ReserveCounts AS ( SELECT lms.LIBRARY_MATERIAL_STATUS, COUNT(lrmd.LIBRARY_RESERVE_CATALOG_KEY)
    AS reserve_count, lrmd.LIBRARY_MATERIAL_STATUS_KEY FROM LIBRARY_MATERIAL_STATUS
    lms JOIN LIBRARY_RESERVE_MATRL_DETAIL lrmd ON lms.LIBRARY_MATERIAL_STATUS_KEY
    = lrmd.LIBRARY_MATERIAL_STATUS_KEY WHERE lrmd.TERM_CODE = '2009SP' GROUP BY lms.LIBRARY_MATERIAL_STATUS,
    lrmd.LIBRARY_MATERIAL_STATUS_KEY ORDER BY reserve_count DESC ) SELECT tms.TIP_MATERIAL_STATUS,
    tms.material_count, rc.LIBRARY_MATERIAL_STATUS, rc.reserve_count FROM TopMaterialStatuses
    tms JOIN TIP_MATERIAL_STATUS tms2 ON tms.TIP_MATERIAL_STATUS = tms2.TIP_MATERIAL_STATUS
    JOIN TIP_DETAIL td ON td.TIP_MATERIAL_STATUS_KEY = tms2.TIP_MATERIAL_STATUS_KEY
    JOIN LIBRARY_RESERVE_MATRL_DETAIL lrmd ON td.SUBJECT_ID = lrmd.SUBJECT_ID AND
    td.TERM_CODE = lrmd.TERM_CODE JOIN ReserveCounts rc ON lrmd.LIBRARY_MATERIAL_STATUS_KEY
    = rc.LIBRARY_MATERIAL_STATUS_KEY
  category: Library Reserve and Textbook Material Comprehensive Analysis
  default_granularity: one row per top material status matched with library reserve
    material status of term 2009SP
- id: dw_1221
  name: 2014FA Chemistry Library Subjects Windowed Enrollment with Department Reserve
    Enrollment Average and Normalized Ratio
  desc: For subjects offered in the term '2014FA' by the Chemistry department, show
    the subject title from the library, the number of enrolled students in the library
    subject, the responsible faculty name from the TIP subject, the offer department
    name from the TIP subject, and the minimum number of enrolled students in the
    library subject within a window of 3 preceding and 1 following row ordered by
    the TIP subject's responsible faculty MIT ID, as well as the average and standard
    deviation (using STDDEV only and never STDDEV_POP) of the number of enrolled students
    in courses with at least one reserved library material and a material status of
    'U' offered by either the Chemistry or Biology department, and calculate the normalized
    enrollment ratio (the number of enrolled students in the library subject divided
    by the average enrollment for the department, rounded to two decimal places).
    List the results in descending order of normalized enrollment ratio.
  sql: WITH Subquery1 AS ( SELECT l.SUBJECT_TITLE, l.NUM_ENROLLED_STUDENTS, t.RESPONSIBLE_FACULTY_NAME,
    t.OFFER_DEPT_NAME, MIN(l.NUM_ENROLLED_STUDENTS) OVER (ORDER BY t.RESPONSIBLE_FACULTY_MIT_ID
    ROWS BETWEEN 3 PRECEDING AND 1 FOLLOWING) AS window_column, t.RESPONSIBLE_FACULTY_MIT_ID
    FROM LIBRARY_SUBJECT_OFFERED l JOIN TIP_SUBJECT_OFFERED t ON l.TERM_CODE = t.TERM_CODE
    WHERE l.TERM_CODE = '2014FA' AND t.OFFER_DEPT_NAME = 'Chemistry' ), Subquery2
    AS ( SELECT t.OFFER_DEPT_NAME, AVG(t.NUM_ENROLLED_STUDENTS) AS avg_enrollment,
    STDDEV(t.NUM_ENROLLED_STUDENTS) AS enrollment_stddev FROM LIBRARY_RESERVE_MATRL_DETAIL
    l JOIN TIP_SUBJECT_OFFERED t ON l.TERM_CODE = t.TERM_CODE WHERE l.LIBRARY_MATERIAL_STATUS_KEY
    = 'U' AND t.OFFER_DEPT_NAME IN ('Chemistry', 'Biology') GROUP BY t.OFFER_DEPT_NAME
    ORDER BY enrollment_stddev DESC ) SELECT s1.SUBJECT_TITLE, s1.NUM_ENROLLED_STUDENTS,
    s1.RESPONSIBLE_FACULTY_NAME, s1.OFFER_DEPT_NAME, s1.window_column, s2.avg_enrollment,
    s2.enrollment_stddev, ROUND(s1.NUM_ENROLLED_STUDENTS / NULLIF(s2.avg_enrollment,
    0), 2) AS normalized_enrollment_ratio FROM Subquery1 s1 JOIN Subquery2 s2 ON s1.OFFER_DEPT_NAME
    = s2.OFFER_DEPT_NAME ORDER BY normalized_enrollment_ratio DESC;
  category: Library Reserve and Textbook Material Comprehensive Analysis
  default_granularity: one row per 2014FA Chemistry library subject offering matched
    with department-level reserve enrollment statistics
- id: dw_2895
  name: Subjects with Status-U Library Reserve and Required Textbooks Min Status,
    Record Totals, and Latest Load Dates
  desc: For each subject that has a library material status of 'U' and a tip material
    status of 'RQ', what is the minimum library material status key, the total record
    count, and the most recent warehouse load date from both the library reserve and
    tip detail tables? Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT lrmd.SUBJECT_ID, MIN(lrmd.LIBRARY_MATERIAL_STATUS_KEY)
    AS min_material_status, SUM(td.RECORD_COUNT) AS total_records FROM LIBRARY_RESERVE_MATRL_DETAIL
    lrmd JOIN TIP_DETAIL td ON lrmd.SUBJECT_ID = td.SUBJECT_ID WHERE lrmd.LIBRARY_MATERIAL_STATUS_KEY
    = 'U' AND td.TIP_MATERIAL_STATUS_KEY = 'RQ' GROUP BY lrmd.SUBJECT_ID ) SELECT
    inner_cte.SUBJECT_ID, inner_cte.min_material_status, inner_cte.total_records,
    MAX(lrmd.WAREHOUSE_LOAD_DATE) AS latest_library_warehouse_date, MAX(td.WAREHOUSE_LOAD_DATE)
    AS latest_tip_warehouse_date FROM inner_cte JOIN LIBRARY_RESERVE_MATRL_DETAIL
    lrmd ON inner_cte.SUBJECT_ID = lrmd.SUBJECT_ID JOIN TIP_DETAIL td ON inner_cte.SUBJECT_ID
    = td.SUBJECT_ID WHERE lrmd.LIBRARY_MATERIAL_STATUS_KEY = 'U' AND td.TIP_MATERIAL_STATUS_KEY
    = 'RQ' GROUP BY inner_cte.SUBJECT_ID, inner_cte.min_material_status, inner_cte.total_records
    ORDER BY inner_cte.total_records DESC;
  category: Library Reserve and Textbook Material Comprehensive Analysis
  default_granularity: one row per subject having both status-U library reserve materials
    and required (RQ) textbooks
- category: Library Reserve and Enrollment Comprehensive Analysis
  default_granularity: one row per top reserved subject title matched with degree-granting
    department enrollment dispersion
  desc: For the top 10 subject titles by the number of reserved library materials
    for subjects offered in the term '2009SP', what are the subject title, the offering
    department name, the variance and standard deviation (using STDDEV only and never
    STDDEV_POP) of the number of enrolled students in subjects offered by that department
    (considering only departments that grant degrees and subjects with a non-null
    subject code description), and the count of reserved materials? Please provide
    the subject title, the offering department name, the variance, the standard deviation
    (using STDDEV only and never STDDEV_POP), and the count of reserved materials,
    in that order. Do not return any rounded answers.
  entity_type: metric
  id: dw_3356
  name: Top 10 Reserved-Material Subjects in 2009SP with Degree-Granting Department
    Enrollment Variance and Stddev
  sql: WITH DepartmentEnrollmentStats AS ( SELECT d.DEPARTMENT_NAME, d.DEPARTMENT_CODE,
    VARIANCE(t.NUM_ENROLLED_STUDENTS) AS enrolled_students_variance, STDDEV(t.NUM_ENROLLED_STUDENTS)
    AS enrolled_students_stddev FROM TIP_SUBJECT_OFFERED t JOIN SIS_DEPARTMENT d ON
    t.OFFER_DEPT_CODE = d.DEPARTMENT_CODE JOIN SIS_SUBJECT_CODE s ON d.DEPARTMENT_CODE
    = s.DEPARTMENT_CODE WHERE d.IS_DEGREE_GRANTING = 'Y' AND s.SUBJECT_CODE_DESC IS
    NOT NULL GROUP BY d.DEPARTMENT_NAME, d.DEPARTMENT_CODE ORDER BY enrolled_students_variance
    DESC ), TopReservedSubjects AS ( SELECT s.SUBJECT_TITLE, s.OFFER_DEPT_NAME, s.OFFER_DEPT_CODE,
    COUNT(l.LIBRARY_RESERVE_CATALOG_KEY) AS reserved_materials FROM LIBRARY_RESERVE_MATRL_DETAIL
    l JOIN TIP_DETAIL t ON l.SUBJECT_ID = t.SUBJECT_ID JOIN SUBJECT_OFFERED_SUMMARY
    s ON t.SUBJECT_ID = s.SUBJECT_ID WHERE l.TERM_CODE = '2009SP' GROUP BY s.SUBJECT_TITLE,
    s.OFFER_DEPT_NAME, s.OFFER_DEPT_CODE ORDER BY reserved_materials DESC LIMIT 10
    ) SELECT trs.SUBJECT_TITLE, trs.OFFER_DEPT_NAME, des.enrolled_students_variance,
    des.enrolled_students_stddev, trs.reserved_materials FROM TopReservedSubjects
    trs JOIN DepartmentEnrollmentStats des ON trs.OFFER_DEPT_CODE = des.DEPARTMENT_CODE
    ORDER BY trs.reserved_materials DESC;
- category: Library Reserve and Enrollment Comprehensive Analysis
  default_granularity: one row per status-U reserve material of an above-average-enrollment
    Engineering department
  desc: 'For each department in the School of Engineering where the total number of
    students enrolled in courses offered by that department is greater than the average
    total enrollment across all Engineering departments (and the total enrollment
    is greater than 50), show the department name and total enrollment, and for each
    such department, show the library reserve material details with material status
    key equal to ''U'', including the library course instructor key, library reserve
    catalog key, term code, subject ID, the tip material key, tip material status
    key, tip ISBN, the subject title, the minimum tip material status key in a window
    of 3 preceding and 1 following row ordered by the number of enrolled students,
    as well as the responsible faculty name and the offer department name, for materials
    offered by that department. The columns should be: department name, total enrollment,
    library course instructor key, library reserve catalog key, term code, subject
    ID, tip material key, tip material status key, tip ISBN, subject title, windowed
    minimum tip material status key, responsible faculty name, and offer department
    name. Do not return any rounded answers.'
  entity_type: metric
  id: dw_3868
  name: Above-Average Engineering Department Enrollments with Status-U Reserve Material
    and Textbook Details
  sql: WITH engineering_dept_enrollment AS ( WITH inner_cte AS ( SELECT s.DEPARTMENT_NAME,
    SUM(t.NUM_ENROLLED_STUDENTS) AS total_enrollment FROM SIS_DEPARTMENT s JOIN TIP_SUBJECT_OFFERED
    t ON s.DEPARTMENT_CODE = t.OFFER_DEPT_CODE JOIN STUDENT_DEPARTMENT d ON t.OFFER_DEPT_CODE
    = d.DEPARTMENT_CODE WHERE s.SCHOOL_NAME = 'Engineering' GROUP BY s.DEPARTMENT_NAME
    HAVING SUM(t.NUM_ENROLLED_STUDENTS) > 50 ) SELECT i.DEPARTMENT_NAME, i.total_enrollment
    FROM inner_cte i JOIN ( SELECT AVG(total_enrollment) AS avg_enrollment FROM (
    SELECT s.DEPARTMENT_NAME, SUM(t.NUM_ENROLLED_STUDENTS) AS total_enrollment FROM
    SIS_DEPARTMENT s JOIN TIP_SUBJECT_OFFERED t ON s.DEPARTMENT_CODE = t.OFFER_DEPT_CODE
    JOIN STUDENT_DEPARTMENT d ON t.OFFER_DEPT_CODE = d.DEPARTMENT_CODE WHERE s.SCHOOL_NAME
    = 'Engineering' GROUP BY s.DEPARTMENT_NAME HAVING SUM(t.NUM_ENROLLED_STUDENTS)
    > 50 ) sub ) a ON i.total_enrollment > a.avg_enrollment ), library_reserve_materials
    AS ( WITH inner_cte AS ( SELECT l.LIBRARY_COURSE_INSTRUCTOR_KEY, l.LIBRARY_RESERVE_CATALOG_KEY,
    l.TERM_CODE, l.SUBJECT_ID, t.TIP_MATERIAL_KEY, t.TIP_MATERIAL_STATUS_KEY, t.ISBN,
    s.SUBJECT_TITLE, MIN(t.TIP_MATERIAL_STATUS_KEY) OVER ( ORDER BY s.NUM_ENROLLED_STUDENTS
    ROWS BETWEEN 3 PRECEDING AND 1 FOLLOWING ) AS window_column, s.TIP_SUBJECT_OFFERED_KEY
    FROM LIBRARY_RESERVE_MATRL_DETAIL l JOIN TIP_DETAIL t ON l.SUBJECT_ID = t.SUBJECT_ID
    JOIN TIP_SUBJECT_OFFERED s ON t.SUBJECT_ID = s.SUBJECT_ID WHERE l.LIBRARY_MATERIAL_STATUS_KEY
    = 'U' ) SELECT inner_cte.LIBRARY_COURSE_INSTRUCTOR_KEY, inner_cte.LIBRARY_RESERVE_CATALOG_KEY,
    inner_cte.TERM_CODE, inner_cte.SUBJECT_ID, inner_cte.TIP_MATERIAL_KEY, inner_cte.TIP_MATERIAL_STATUS_KEY,
    inner_cte.ISBN, inner_cte.SUBJECT_TITLE, inner_cte.window_column, s.RESPONSIBLE_FACULTY_NAME,
    s.OFFER_DEPT_NAME, s.OFFER_DEPT_CODE FROM inner_cte JOIN TIP_SUBJECT_OFFERED s
    ON inner_cte.TIP_SUBJECT_OFFERED_KEY = s.TIP_SUBJECT_OFFERED_KEY ) SELECT ede.DEPARTMENT_NAME,
    ede.total_enrollment, lrm.LIBRARY_COURSE_INSTRUCTOR_KEY, lrm.LIBRARY_RESERVE_CATALOG_KEY,
    lrm.TERM_CODE, lrm.SUBJECT_ID, lrm.TIP_MATERIAL_KEY, lrm.TIP_MATERIAL_STATUS_KEY,
    lrm.ISBN, lrm.SUBJECT_TITLE, lrm.window_column, lrm.RESPONSIBLE_FACULTY_NAME,
    lrm.OFFER_DEPT_NAME FROM engineering_dept_enrollment ede JOIN library_reserve_materials
    lrm ON ede.DEPARTMENT_NAME = lrm.OFFER_DEPT_NAME
- category: Library Reserve and Student Directory Comprehensive Analysis
  default_granularity: one row per 2009SP status-U reserve material matched with an
    Electrical Eng & Computer Sci course and enrolled student
  desc: For each library reserve material detail with material status key 'U' and
    term code '2009SP', show the course instructor key, reserve catalog key, subject
    offered key, the responsible faculty name, and the row number within a window
    of 2 preceding and 1 following rows ordered by the responsible faculty name from
    the associated subject offered, and for each matching course in the "Electrical
    Eng & Computer Sci" department, show the course description, course level, the
    full name and email address of students enrolled, and the row number within each
    course level group ordered by the student's last name. Do not return any rounded
    answers.
  entity_type: metric
  id: dw_4458
  name: 2009SP Status-U Reserve Materials Windowed Faculty Row Numbers with EECS Course
    Student Directory Details
  sql: WITH subq1 AS ( WITH inner_cte AS ( SELECT t0.LIBRARY_COURSE_INSTRUCTOR_KEY,
    t0.LIBRARY_RESERVE_CATALOG_KEY, t0.LIBRARY_SUBJECT_OFFERED_KEY, t1.RESPONSIBLE_FACULTY_NAME,
    t0.SUBJECT_ID FROM LIBRARY_RESERVE_MATRL_DETAIL t0 JOIN TIP_SUBJECT_OFFERED t1
    ON t0.SUBJECT_ID = t1.SUBJECT_ID WHERE t0.LIBRARY_MATERIAL_STATUS_KEY = 'U' AND
    t0.TERM_CODE = '2009SP' ) SELECT inner_cte.LIBRARY_COURSE_INSTRUCTOR_KEY, inner_cte.LIBRARY_RESERVE_CATALOG_KEY,
    inner_cte.LIBRARY_SUBJECT_OFFERED_KEY, inner_cte.RESPONSIBLE_FACULTY_NAME, inner_cte.SUBJECT_ID,
    ROW_NUMBER() OVER (ORDER BY inner_cte.RESPONSIBLE_FACULTY_NAME ROWS BETWEEN 2
    PRECEDING AND 1 FOLLOWING) AS window_column FROM inner_cte ), subq2 AS ( WITH
    inner_cte AS ( SELECT t2.FULL_NAME, t2.EMAIL_ADDRESS, t1.DEPARTMENT_NAME, t0.COURSE_DESCRIPTION,
    t0.COURSE_LEVEL, t2.DEPARTMENT, ROW_NUMBER() OVER (PARTITION BY t0.COURSE_LEVEL
    ORDER BY t2.LAST_NAME) AS window_column FROM SIS_COURSE_DESCRIPTION t0 JOIN SIS_DEPARTMENT
    t1 ON t0.DEPARTMENT = t1.DEPARTMENT_CODE JOIN MIT_STUDENT_DIRECTORY t2 ON t1.DEPARTMENT_CODE
    = t2.DEPARTMENT WHERE t1.DEPARTMENT_NAME = 'Electrical Eng & Computer Sci' ) SELECT
    inner_cte.COURSE_DESCRIPTION, inner_cte.COURSE_LEVEL, inner_cte.FULL_NAME, inner_cte.EMAIL_ADDRESS,
    inner_cte.DEPARTMENT, inner_cte.window_column FROM inner_cte ORDER BY inner_cte.COURSE_DESCRIPTION,
    inner_cte.COURSE_LEVEL, inner_cte.window_column ) SELECT s1.LIBRARY_COURSE_INSTRUCTOR_KEY,
    s1.LIBRARY_RESERVE_CATALOG_KEY, s1.LIBRARY_SUBJECT_OFFERED_KEY, s1.RESPONSIBLE_FACULTY_NAME,
    s1.window_column AS faculty_window_column, s2.COURSE_DESCRIPTION, s2.COURSE_LEVEL,
    s2.FULL_NAME, s2.EMAIL_ADDRESS, s2.window_column AS student_window_column FROM
    subq1 s1 JOIN TIP_SUBJECT_OFFERED tso ON s1.SUBJECT_ID = tso.SUBJECT_ID JOIN SIS_DEPARTMENT
    sd ON tso.OFFER_DEPT_CODE = sd.DEPARTMENT_CODE JOIN subq2 s2 ON sd.DEPARTMENT_CODE
    = s2.DEPARTMENT
- id: dw_1165
  name: Library-TIP Matched Subjects by Faculty or Enrollment with Degree-Granting
    Graduate Department Enrollment Dispersion
  desc: For each subject where the responsible faculty MIT ID in the library subject
    offered table is 928034000 or the number of enrolled students in the tip subject
    offered table is greater than 5, and where the offer department name in the tip
    subject offered table is either 'Chemistry' or 'Biology', show the subject title
    from the library subject offered table, the offer department name from the tip
    subject offered table, the term code from both tables, the number of enrolled
    students from both tables, and the minimum number of enrolled students in the
    tip subject offered table over each master subject ID group. Additionally, for
    the department offering the subject, show the department name, the range of enrolled
    students, and the variance of enrolled students in the subjects offered by that
    department, considering only departments that grant degrees, courses that are
    at the graduate level, and excluding the Biology department. Present the results
    ordered by subject title and department name. Do not return any rounded answers.
  sql: WITH Subquery1 AS ( SELECT lso.SUBJECT_TITLE, tso.OFFER_DEPT_NAME, lso.TERM_CODE
    AS LIBRARY_TERM_CODE, tso.TERM_CODE AS TIP_TERM_CODE, lso.NUM_ENROLLED_STUDENTS
    AS LIBRARY_NUM_ENROLLED, tso.NUM_ENROLLED_STUDENTS AS TIP_NUM_ENROLLED, MIN(tso.NUM_ENROLLED_STUDENTS)
    OVER (PARTITION BY tso.MASTER_SUBJECT_ID) AS MIN_TIP_NUM_ENROLLED, tso.OFFER_DEPT_CODE
    FROM LIBRARY_SUBJECT_OFFERED lso JOIN TIP_SUBJECT_OFFERED tso ON lso.MASTER_SUBJECT_ID
    = tso.MASTER_SUBJECT_ID WHERE ( lso.RESPONSIBLE_FACULTY_MIT_ID = 928034000 OR
    tso.NUM_ENROLLED_STUDENTS > 5 ) AND tso.OFFER_DEPT_NAME IN ('Chemistry', 'Biology')
    ), Subquery2 AS ( SELECT sd.DEPARTMENT_NAME, MAX(tso.NUM_ENROLLED_STUDENTS) -
    MIN(tso.NUM_ENROLLED_STUDENTS) AS enrolled_range, VARIANCE(tso.NUM_ENROLLED_STUDENTS)
    AS enrolled_variance, sd.DEPARTMENT_CODE FROM TIP_SUBJECT_OFFERED tso JOIN SIS_DEPARTMENT
    sd ON tso.OFFER_DEPT_CODE = sd.DEPARTMENT_CODE JOIN SIS_COURSE_DESCRIPTION scd
    ON sd.DEPARTMENT_CODE = scd.DEPARTMENT WHERE sd.IS_DEGREE_GRANTING = 'Y' AND scd.COURSE_LEVEL
    = 'G' AND sd.DEPARTMENT_CODE <> '7' GROUP BY sd.DEPARTMENT_NAME, sd.DEPARTMENT_CODE
    ), CombinedResults AS ( SELECT s1.SUBJECT_TITLE, s1.OFFER_DEPT_NAME, s1.LIBRARY_TERM_CODE,
    s1.TIP_TERM_CODE, s1.LIBRARY_NUM_ENROLLED, s1.TIP_NUM_ENROLLED, s1.MIN_TIP_NUM_ENROLLED,
    s2.DEPARTMENT_NAME, s2.enrolled_range, s2.enrolled_variance FROM Subquery1 s1
    JOIN Subquery2 s2 ON s1.OFFER_DEPT_CODE = s2.DEPARTMENT_CODE ) SELECT SUBJECT_TITLE,
    OFFER_DEPT_NAME, LIBRARY_TERM_CODE, TIP_TERM_CODE, LIBRARY_NUM_ENROLLED, TIP_NUM_ENROLLED,
    MIN_TIP_NUM_ENROLLED, DEPARTMENT_NAME, enrolled_range, enrolled_variance FROM
    CombinedResults ORDER BY SUBJECT_TITLE, DEPARTMENT_NAME;
  category: Library Reserve and Textbook Material Comprehensive Analysis
  default_granularity: one row per library-TIP matched subject offering per degree-granting
    graduate department
- id: dw_2591
  name: 2014FA Enrolled Library Subjects with TIP Material Status and 3-Row Min Total
    Units
  desc: For all subjects in the 2014FA term with at least one enrolled student, show
    the subject title, offering department name, responsible faculty name, the TIP
    material status key, the total number of units, and the minimum total number of
    units in a window of 3 preceding and 1 following row ordered by the course number,
    along with the cluster type description and the HGN code description for each
    subject. Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT lso.SUBJECT_TITLE, lso.OFFER_DEPT_NAME, lso.RESPONSIBLE_FACULTY_NAME,
    td.TIP_MATERIAL_STATUS_KEY, sos.TOTAL_UNITS, MIN(sos.TOTAL_UNITS) OVER ( ORDER
    BY sos.COURSE_NUMBER ROWS BETWEEN 3 PRECEDING AND 1 FOLLOWING ) AS window_column,
    sos.SUBJECT_ID FROM LIBRARY_SUBJECT_OFFERED lso JOIN TIP_DETAIL td ON lso.SUBJECT_ID
    = td.SUBJECT_ID JOIN SUBJECT_OFFERED_SUMMARY sos ON td.SUBJECT_ID = sos.SUBJECT_ID
    WHERE lso.TERM_CODE = '2014FA' AND lso.NUM_ENROLLED_STUDENTS > 0 ) SELECT inner_cte.SUBJECT_TITLE,
    inner_cte.OFFER_DEPT_NAME, inner_cte.RESPONSIBLE_FACULTY_NAME, inner_cte.TIP_MATERIAL_STATUS_KEY,
    inner_cte.TOTAL_UNITS, inner_cte.window_column, sos.CLUSTER_TYPE_DESC, sos.HGN_CODE_DESC
    FROM inner_cte JOIN SUBJECT_OFFERED_SUMMARY sos ON inner_cte.SUBJECT_ID = sos.SUBJECT_ID
    AND sos.TERM_CODE = '2014FA'
  category: Library Reserve and Textbook Material Comprehensive Analysis
  default_granularity: one row per 2014FA library subject with textbook material matched
    to its subject offering summary
- id: dw_4812
  name: Top 10 Degree-Granting Department Subject Code and Course Number Combinations
    by Unique Library Subject Count
  desc: From the top 10 combinations of department name, subject code, and course
    number (where the department is degree granting and the number of enrolled students
    in the subject summary is greater than 2) with the highest number of unique library
    subjects offered, display the department name, subject code, number of subject
    codes, minimum department budget code, course number, number of unique library
    subjects offered, minimum total units, the subject title with the most enrolled
    students for that course, and the corresponding number of enrolled students. Do
    not return any rounded answers.
  sql: WITH inner_cte AS ( WITH DeptSubjectStats AS ( SELECT d.DEPARTMENT_NAME, s.SUBJECT_CODE,
    COUNT(s.SUBJECT_CODE) AS subject_code_count, MIN(d.DEPT_BUDGET_CODE) AS min_dept_budget_code
    FROM SIS_DEPARTMENT d JOIN SIS_SUBJECT_CODE s ON d.DEPARTMENT_CODE = s.DEPARTMENT_CODE
    WHERE d.IS_DEGREE_GRANTING = 'Y' GROUP BY d.DEPARTMENT_NAME, s.SUBJECT_CODE ),
    DeptCourseStats AS ( SELECT l.OFFER_DEPT_NAME, l.COURSE_NUMBER, COUNT(DISTINCT
    l.LIBRARY_SUBJECT_OFFERED_KEY) AS subject_count, MIN(s.TOTAL_UNITS) AS min_total_units
    FROM LIBRARY_SUBJECT_OFFERED l JOIN TIP_DETAIL t ON l.SUBJECT_ID = t.SUBJECT_ID
    JOIN SUBJECT_OFFERED_SUMMARY s ON t.SUBJECT_ID = s.SUBJECT_ID WHERE s.NUM_ENROLLED_STUDENTS
    > 2 GROUP BY l.OFFER_DEPT_NAME, l.COURSE_NUMBER ) SELECT dss.DEPARTMENT_NAME,
    dss.SUBJECT_CODE, dss.subject_code_count, dss.min_dept_budget_code, dcs.COURSE_NUMBER,
    dcs.subject_count, dcs.min_total_units FROM DeptSubjectStats dss JOIN SIS_SUBJECT_CODE
    ssc ON dss.SUBJECT_CODE = ssc.SUBJECT_CODE JOIN DeptCourseStats dcs ON dss.DEPARTMENT_NAME
    = dcs.OFFER_DEPT_NAME AND ssc.COURSE_NUMBER = dcs.COURSE_NUMBER ), SubjectMaxEnroll
    AS ( SELECT l.OFFER_DEPT_NAME, l.COURSE_NUMBER, s.SUBJECT_TITLE, s.NUM_ENROLLED_STUDENTS,
    ROW_NUMBER() OVER (PARTITION BY l.OFFER_DEPT_NAME, l.COURSE_NUMBER ORDER BY s.NUM_ENROLLED_STUDENTS
    DESC) AS rn FROM LIBRARY_SUBJECT_OFFERED l JOIN TIP_DETAIL t ON l.SUBJECT_ID =
    t.SUBJECT_ID JOIN SUBJECT_OFFERED_SUMMARY s ON t.SUBJECT_ID = s.SUBJECT_ID WHERE
    s.NUM_ENROLLED_STUDENTS > 2 ) SELECT ic.DEPARTMENT_NAME, ic.SUBJECT_CODE, ic.subject_code_count,
    ic.min_dept_budget_code, ic.COURSE_NUMBER, ic.subject_count, ic.min_total_units,
    sme.SUBJECT_TITLE AS Top_Subject_Title, sme.NUM_ENROLLED_STUDENTS AS Top_Subject_Enrollment
    FROM inner_cte ic LEFT JOIN SubjectMaxEnroll sme ON ic.DEPARTMENT_NAME = sme.OFFER_DEPT_NAME
    AND ic.COURSE_NUMBER = sme.COURSE_NUMBER AND sme.rn = 1 ORDER BY ic.subject_count
    DESC LIMIT 10;
  category: Library Reserve and Course Catalog Comprehensive Analysis
  default_granularity: one row per top-10 department/subject-code/course-number combination
    with its highest-enrollment subject
- id: dw_100
  name: Top 5 Departments by Graduate Student Average Office Phone with Highest-Phone
    Student
  desc: Among all departments, which are the top 5 departments with the highest average
    office phone number among graduate students (student year 'G') who have a non-null
    office phone number? For each of these departments, show the department name,
    the average and standard deviation (using STDDEV only and never STDDEV_POP) of
    office phone numbers, and the full name and office phone number of the graduate
    student in that department with the highest office phone number. Do not return
    any rounded answers.
  sql: WITH inner_cte AS ( SELECT sd.DEPARTMENT_NAME, msd.DEPARTMENT, AVG(msd.OFFICE_PHONE)
    AS avg_office_phone, STDDEV(msd.OFFICE_PHONE) AS stddev_office_phone FROM SIS_DEPARTMENT
    sd JOIN MIT_STUDENT_DIRECTORY msd ON sd.DEPARTMENT_CODE = msd.DEPARTMENT JOIN
    SIS_ADMIN_DEPARTMENT sad ON msd.DEPARTMENT = sad.SIS_ADMIN_DEPARTMENT_CODE WHERE
    msd.STUDENT_YEAR = 'G' AND msd.OFFICE_PHONE IS NOT NULL GROUP BY sd.DEPARTMENT_NAME,
    msd.DEPARTMENT ) SELECT icte.DEPARTMENT_NAME, icte.avg_office_phone, icte.stddev_office_phone,
    msd.FULL_NAME AS Top_Student, msd.OFFICE_PHONE AS Top_Office_Phone FROM inner_cte
    icte JOIN ( SELECT msd.DEPARTMENT, msd.FULL_NAME, msd.OFFICE_PHONE FROM MIT_STUDENT_DIRECTORY
    msd WHERE msd.STUDENT_YEAR = 'G' AND msd.OFFICE_PHONE IS NOT NULL ) msd ON icte.DEPARTMENT
    = msd.DEPARTMENT AND msd.OFFICE_PHONE = ( SELECT MAX(msd2.OFFICE_PHONE) FROM MIT_STUDENT_DIRECTORY
    msd2 WHERE msd2.DEPARTMENT = msd.DEPARTMENT AND msd2.STUDENT_YEAR = 'G' AND msd2.OFFICE_PHONE
    IS NOT NULL ) ORDER BY icte.avg_office_phone DESC LIMIT 5;
  category: Student Directory Analysis
  default_granularity: one row per top-5 department by average graduate student office
    phone
- id: dw_463
  name: EECS Course-6 Students Min MIT ID and Average Department Number with Email
  desc: For each student in the Electrical Engineering and Computer Science department
    whose MIT ID is between 921145998 and 999756146 or whose department number is
    at least 4, and whose department number is between 4 and 6, and whose department
    number is 6, what are their minimum MIT ID, average department number, and email
    address? Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT sp.FULL_NAME AS student_name, MIN(sp.MIT_ID) AS
    min_mit_id, AVG(msd.DEPARTMENT) AS avg_department_number FROM SE_PERSON sp JOIN
    MIT_STUDENT_DIRECTORY msd ON sp.FULL_NAME = msd.FULL_NAME WHERE ( (sp.MIT_ID BETWEEN
    921145998 AND 999756146) OR (msd.DEPARTMENT >= 4) ) AND msd.DEPARTMENT BETWEEN
    4 AND 6 AND sp.ORGANIZATION = 'Electrical Engineering-Computer Science' AND msd.DEPARTMENT
    = 6 GROUP BY sp.FULL_NAME ) SELECT ic.student_name, ic.min_mit_id, ic.avg_department_number,
    msd.EMAIL_ADDRESS FROM inner_cte ic JOIN MIT_STUDENT_DIRECTORY msd ON ic.student_name
    = msd.FULL_NAME;
  category: Person Master and Student Directory Comprehensive Analysis
  default_granularity: one row per matched student full name
- category: Course Catalog and Student Directory Comprehensive Analysis
  default_granularity: one row per Mathematics graduate student, unioned with department-level
    CIP statistics rows for Mathematics departments without such students
  desc: Show the department name, department full name, student full name, student
    email address, dense rank over the school code, CIP program code range, and CIP
    program code variance for all graduate students in degree-granting Mathematics
    departments, as well as for all Mathematics departments that are degree granting
    and have at least one course with a non-null CIP program code, including the CIP
    program code range and variance for those departments even if they have no such
    students. List the results ordered by department full name and student full name.
    Do not return any rounded answers.
  id: dw_1033
  name: Math Graduate Students School Dense Ranks Unioned with Department CIP Code
    Range-Variance
  sql: WITH StudentInfo AS ( SELECT sd.DEPT_NAME_IN_COMMENCEMENT_BK AS department_name,
    sd.DEPARTMENT_FULL_NAME AS department_full_name, msd.FULL_NAME AS student_full_name,
    msd.EMAIL_ADDRESS AS student_email_address, DENSE_RANK() OVER (ORDER BY sd.SCHOOL_CODE)
    AS school_code_dense_rank, sd.DEPARTMENT_CODE FROM MIT_STUDENT_DIRECTORY msd JOIN
    SIS_DEPARTMENT sd ON msd.DEPARTMENT = sd.DEPARTMENT_CODE WHERE msd.STUDENT_YEAR
    = 'G' AND sd.IS_DEGREE_GRANTING = 'Y' AND sd.DEPARTMENT_CODE = '18' ), DepartmentCIPStats
    AS ( SELECT sd.DEPARTMENT_CODE, sd.DEPARTMENT_FULL_NAME, MAX(scd.CIP_PROGRAM_CODE)
    - MIN(scd.CIP_PROGRAM_CODE) AS cip_code_range, VARIANCE(scd.CIP_PROGRAM_CODE)
    AS cip_code_variance FROM SIS_COURSE_DESCRIPTION scd JOIN SIS_DEPARTMENT sd ON
    scd.DEPARTMENT = sd.DEPARTMENT_CODE WHERE scd.IS_DEGREE_GRANTING = 'Y' AND scd.CIP_PROGRAM_CODE
    IS NOT NULL AND sd.DEPARTMENT_NAME = 'Mathematics' GROUP BY sd.DEPARTMENT_CODE,
    sd.DEPARTMENT_FULL_NAME ), CombinedResults AS ( SELECT si.department_name, si.department_full_name,
    si.student_full_name, si.student_email_address, si.school_code_dense_rank, dcs.cip_code_range,
    dcs.cip_code_variance FROM StudentInfo si LEFT JOIN DepartmentCIPStats dcs ON
    si.DEPARTMENT_CODE = dcs.DEPARTMENT_CODE UNION ALL SELECT NULL AS department_name,
    dcs.DEPARTMENT_FULL_NAME AS department_full_name, NULL AS student_full_name, NULL
    AS student_email_address, NULL AS school_code_dense_rank, dcs.cip_code_range,
    dcs.cip_code_variance FROM DepartmentCIPStats dcs WHERE dcs.DEPARTMENT_CODE NOT
    IN (SELECT DEPARTMENT_CODE FROM StudentInfo) ) SELECT department_name, department_full_name,
    student_full_name, student_email_address, school_code_dense_rank, cip_code_range,
    cip_code_variance FROM CombinedResults ORDER BY department_full_name, student_full_name;
- category: Subject Offering and Student Directory Comprehensive Analysis
  default_granularity: one row per Mathematics department combining subject unit statistics
    with graduate student counts
  desc: For the Mathematics department (Course 18), provide the department name, the
    average and standard deviation (using STDDEV only and never STDDEV_POP) of the
    total units for subjects offered by that department (considering only subjects
    with more than 0 total units and at least 1 enrolled student), the number of graduate
    students in the department, and the most recent warehouse load date for those
    students, considering only departments that are degree granting and students whose
    year is 'G'. Do not return any rounded answers.
  id: dw_1212
  name: Math Department Subject Unit Average-Stddev with Graduate Student Count and
    Latest Load Date
  sql: WITH DeptUnits AS ( SELECT d.DEPARTMENT_NAME, AVG(s.TOTAL_UNITS) AS avg_total_units,
    STDDEV(s.TOTAL_UNITS) AS stddev_total_units FROM SIS_DEPARTMENT d JOIN SUBJECT_OFFERED_SUMMARY
    s ON d.DEPARTMENT_CODE = s.OFFER_DEPT_CODE WHERE s.TOTAL_UNITS > 0 AND s.NUM_ENROLLED_STUDENTS
    >= 1 AND d.DEPARTMENT_NAME = 'Mathematics' AND d.DEPARTMENT_CODE = '18' GROUP
    BY d.DEPARTMENT_NAME ORDER BY stddev_total_units DESC ), DeptStudents AS ( SELECT
    sd.DEPARTMENT_NAME, COUNT(msd.FULL_NAME) AS student_count, MAX(msd.WAREHOUSE_LOAD_DATE)
    AS latest_student_load FROM SIS_DEPARTMENT sd JOIN MIT_STUDENT_DIRECTORY msd ON
    sd.DEPARTMENT_CODE = msd.DEPARTMENT JOIN SIS_ADMIN_DEPARTMENT sad ON msd.DEPARTMENT
    = sad.SIS_ADMIN_DEPARTMENT_CODE WHERE sd.IS_DEGREE_GRANTING = 'Y' AND msd.STUDENT_YEAR
    = 'G' AND sd.DEPARTMENT_NAME = 'Mathematics' AND sd.DEPARTMENT_CODE = '18' GROUP
    BY sd.DEPARTMENT_NAME ORDER BY student_count DESC LIMIT 10 ) SELECT du.DEPARTMENT_NAME,
    du.avg_total_units, du.stddev_total_units, ds.student_count, ds.latest_student_load
    FROM DeptUnits du JOIN DeptStudents ds ON du.DEPARTMENT_NAME = ds.DEPARTMENT_NAME;
- category: Subject Offering and Student Directory Comprehensive Analysis
  default_granularity: one row per department/school enrollment statistic (plus per-school
    rollup rows), left joined with Mathematics students named Peter
  desc: 'For each department and school, provide the department name, school name,
    the average, range, and variance of the number of enrolled students in subjects
    offered by that department, and the total enrolled students, considering only
    departments that grant degrees and subjects with at least one enrolled student.
    Additionally, for each school, include a grand total for all departments in that
    school in the format of (null department name, school name, nulls for statistics,
    and total enrolled students). For students whose first name is ''Peter'' and who
    are in the Mathematics department, also show their last name, email address, student
    year, and the minimum department budget code in a window of 3 preceding and 1
    following row ordered by the student''s full name, as well as the department full
    name and department last activity date. The results include all these columns
    in the following order: department name, school name, average enrolled students,
    range of enrolled students, variance of enrolled students, total enrolled students,
    last name, email address, student year, windowed minimum department budget code,
    department full name, and department last activity date. Do not return any rounded
    answers.'
  id: dw_1350
  name: Degree-Granting Department TIP Enrollment Statistics with School Rollups and
    Math Peter Student Budget Code Windows
  sql: WITH inner_cte1 AS ( SELECT sd.DEPARTMENT_NAME, sd.SCHOOL_NAME, tso.NUM_ENROLLED_STUDENTS
    FROM SIS_DEPARTMENT sd JOIN TIP_SUBJECT_OFFERED tso ON sd.DEPARTMENT_CODE = tso.OFFER_DEPT_CODE
    WHERE sd.IS_DEGREE_GRANTING = 'Y' AND tso.NUM_ENROLLED_STUDENTS >= 1 ), DepartmentStats
    AS ( SELECT DEPARTMENT_NAME, SCHOOL_NAME, AVG(NUM_ENROLLED_STUDENTS) AS avg_enrolled_students,
    MAX(NUM_ENROLLED_STUDENTS) - MIN(NUM_ENROLLED_STUDENTS) AS range_enrolled_students,
    VARIANCE(NUM_ENROLLED_STUDENTS) AS var_enrolled_students, SUM(NUM_ENROLLED_STUDENTS)
    AS total_enrolled_students FROM inner_cte1 GROUP BY DEPARTMENT_NAME, SCHOOL_NAME
    ), SchoolRollup AS ( SELECT NULL AS DEPARTMENT_NAME, SCHOOL_NAME, NULL AS avg_enrolled_students,
    NULL AS range_enrolled_students, NULL AS var_enrolled_students, SUM(total_enrolled_students)
    AS total_enrolled_students FROM DepartmentStats GROUP BY SCHOOL_NAME ), inner_cte2
    AS ( SELECT t1.LAST_NAME, t1.EMAIL_ADDRESS, t1.STUDENT_YEAR, t1.DEPARTMENT_NAME,
    t0.SCHOOL_NAME, MIN(t0.DEPT_BUDGET_CODE) OVER (ORDER BY t1.FULL_NAME ROWS BETWEEN
    3 PRECEDING AND 1 FOLLOWING) AS window_column FROM SIS_DEPARTMENT t0 JOIN MIT_STUDENT_DIRECTORY
    t1 ON t0.DEPARTMENT_CODE = t1.DEPARTMENT WHERE t1.FIRST_NAME = 'Peter' AND t0.DEPARTMENT_NAME
    = 'Mathematics' ) SELECT ds.DEPARTMENT_NAME, ds.SCHOOL_NAME, ds.avg_enrolled_students,
    ds.range_enrolled_students, ds.var_enrolled_students, ds.total_enrolled_students,
    ic2.LAST_NAME, ic2.EMAIL_ADDRESS, ic2.STUDENT_YEAR, ic2.window_column, sd.DEPARTMENT_FULL_NAME,
    sd.DEPARTMENT_LAST_ACTIVITY_DATE FROM (SELECT * FROM DepartmentStats UNION ALL
    SELECT * FROM SchoolRollup) ds LEFT JOIN inner_cte2 ic2 ON ds.DEPARTMENT_NAME
    = ic2.DEPARTMENT_NAME AND ds.SCHOOL_NAME = ic2.SCHOOL_NAME LEFT JOIN SIS_DEPARTMENT
    sd ON ds.DEPARTMENT_NAME = sd.DEPARTMENT_NAME ORDER BY ds.SCHOOL_NAME, ds.DEPARTMENT_NAME,
    ic2.LAST_NAME ;
- category: Subject Offering and Student Directory Comprehensive Analysis
  default_granularity: one row per top-10 department subject-code group matched with
    a Kevin-named Course-6 student course
  desc: For the top 10 degree-granting departments (excluding 'Political Science'
    and Course 17) that have offered at least one subject in the 'Engineering' school,
    list the department name, school name, subject code description, the total number
    of subjects they offered, and the average number of enrolled students per subject,
    and for each such department, show the full names, email addresses, student years,
    department full names, course descriptions, course levels, the minimum course
    level in a window of 3 preceding and 1 following row ordered by the student's
    last name, and the corresponding subject code and subject code description for
    each course taken by students named 'Kevin' in 'Electrical Eng & Computer Sci'
    (Course 6). Do not return any rounded answers.
  id: dw_1474
  name: Top 10 Engineering Degree-Granting Department Subject Counts with Kevin EECS
    Student Course Windows
  sql: WITH TopDepartments AS ( WITH inner_cte AS ( SELECT d.DEPARTMENT_NAME, d.SCHOOL_NAME,
    s.SUBJECT_CODE_DESC, COUNT(sos.SUBJECT_OFFERED_SUMMARY_KEY) AS num_subjects FROM
    SIS_SUBJECT_CODE s JOIN SIS_DEPARTMENT d ON s.DEPARTMENT_CODE = d.DEPARTMENT_CODE
    JOIN SUBJECT_OFFERED_SUMMARY sos ON d.DEPARTMENT_CODE = sos.OFFER_DEPT_CODE WHERE
    d.IS_DEGREE_GRANTING = 'Y' AND sos.OFFER_SCHOOL_NAME = 'Engineering' AND d.DEPARTMENT_NAME
    <> 'Political Science' AND d.DEPARTMENT_CODE <> '17' GROUP BY d.DEPARTMENT_NAME,
    d.SCHOOL_NAME, s.SUBJECT_CODE_DESC ) SELECT ic.DEPARTMENT_NAME, ic.SCHOOL_NAME,
    ic.SUBJECT_CODE_DESC, ic.num_subjects, AVG(sos.NUM_ENROLLED_STUDENTS) AS avg_enrollment,
    d.DEPARTMENT_CODE FROM inner_cte ic JOIN SIS_DEPARTMENT d ON ic.DEPARTMENT_NAME
    = d.DEPARTMENT_NAME AND ic.SCHOOL_NAME = d.SCHOOL_NAME JOIN SUBJECT_OFFERED_SUMMARY
    sos ON d.DEPARTMENT_CODE = sos.OFFER_DEPT_CODE GROUP BY ic.DEPARTMENT_NAME, ic.SCHOOL_NAME,
    ic.SUBJECT_CODE_DESC, ic.num_subjects, d.DEPARTMENT_CODE ORDER BY ic.num_subjects
    DESC LIMIT 10 ), KevinStudents AS ( WITH inner_cte AS ( SELECT t2.FULL_NAME, t2.EMAIL_ADDRESS,
    t2.STUDENT_YEAR, t1.DEPARTMENT_FULL_NAME, t0.COURSE_DESCRIPTION, t0.COURSE_LEVEL,
    MIN(t0.COURSE_LEVEL) OVER (ORDER BY t2.LAST_NAME ROWS BETWEEN 3 PRECEDING AND
    1 FOLLOWING) AS window_column, t0.COURSE, t1.DEPARTMENT_CODE FROM SIS_COURSE_DESCRIPTION
    t0 JOIN SIS_DEPARTMENT t1 ON t0.DEPARTMENT = t1.DEPARTMENT_CODE JOIN MIT_STUDENT_DIRECTORY
    t2 ON t1.DEPARTMENT_CODE = t2.DEPARTMENT WHERE t2.DEPARTMENT_NAME = 'Electrical
    Eng & Computer Sci' AND t2.FIRST_NAME = 'Kevin' AND t2.DEPARTMENT = '6' ) SELECT
    inner_cte.FULL_NAME, inner_cte.EMAIL_ADDRESS, inner_cte.STUDENT_YEAR, inner_cte.DEPARTMENT_FULL_NAME,
    inner_cte.COURSE_DESCRIPTION, inner_cte.COURSE_LEVEL, inner_cte.window_column,
    sc.SUBJECT_CODE, sc.SUBJECT_CODE_DESC, inner_cte.DEPARTMENT_CODE FROM inner_cte
    JOIN SIS_SUBJECT_CODE sc ON inner_cte.COURSE = sc.COURSE_NUMBER ) SELECT td.DEPARTMENT_NAME,
    td.SCHOOL_NAME, td.SUBJECT_CODE_DESC, td.num_subjects, td.avg_enrollment, ks.FULL_NAME,
    ks.EMAIL_ADDRESS, ks.STUDENT_YEAR, ks.DEPARTMENT_FULL_NAME, ks.COURSE_DESCRIPTION,
    ks.COURSE_LEVEL, ks.window_column, ks.SUBJECT_CODE, ks.SUBJECT_CODE_DESC FROM
    TopDepartments td JOIN KevinStudents ks ON td.DEPARTMENT_CODE = ks.DEPARTMENT_CODE
    ORDER BY td.DEPARTMENT_NAME, ks.FULL_NAME;
- category: Subject Offering and Student Directory Comprehensive Analysis
  default_granularity: one row per Course-6 student matched with a Course-6 Engineering
    subject offering
  desc: 'For students whose department is ''6'' and whose department name is ''Electrical
    Eng & Computer Sci'', show their first name, last name, department name, student
    year, the corresponding department''s full name, the administrative department
    name, and the average department phone number in a window of 2 preceding and 2
    following rows grouped by the administrative department name and ordered by the
    student''s first name. Additionally, for each subject offered in the ''Engineering''
    school with total units greater than 0 and only for subjects in the ''Electrical
    Eng & Computer Sci'' department (Course 6), where the student''s department matches
    the subject''s offer department code, show the subject title, total units, subject
    department name, course description, and the dense rank over the offer department
    code ordered by offer department code. Finally, for each such subject, include
    the corresponding department''s school name and whether the total units are ''HIGH_LOAD''
    (at least 12), ''LOW_LOAD'' (at most 6), or ''MEDIUM_LOAD'' (otherwise). Present
    the columns in the following order: first name, last name, department name, student
    year, department full name, administrative department name, average department
    phone number (windowed), subject title, total units, subject department name,
    course description, dense rank (windowed), department school name, and subject
    load category. Do not return any rounded answers.'
  id: dw_1983
  name: EECS Students Windowed Admin Department Phone Averages with Engineering Subject
    Load Categories
  sql: WITH inner_cte AS ( SELECT sd.FIRST_NAME, sd.LAST_NAME, sd.DEPARTMENT_NAME,
    sd.STUDENT_YEAR, sd.DEPARTMENT_FULL_NAME, sd.SIS_ADMIN_DEPARTMENT_NAME, sd.window_column
    AS student_window_column, sbd.SUBJECT_TITLE, sbd.TOTAL_UNITS, sbd.DEPARTMENT_NAME
    AS SUBJECT_DEPARTMENT_NAME, sbd.COURSE_DESCRIPTION, sbd.window_column AS subject_window_column,
    sbd.OFFER_DEPT_CODE FROM ( SELECT t1.FIRST_NAME, t1.LAST_NAME, t1.DEPARTMENT_NAME,
    t1.STUDENT_YEAR, t0.DEPARTMENT_FULL_NAME, t2.SIS_ADMIN_DEPARTMENT_NAME, AVG(t2.DEPARTMENT_PHONE_NUMBER)
    OVER ( PARTITION BY t2.SIS_ADMIN_DEPARTMENT_NAME ORDER BY t1.FIRST_NAME ROWS BETWEEN
    2 PRECEDING AND 2 FOLLOWING ) AS window_column, t1.DEPARTMENT FROM SIS_DEPARTMENT
    t0 JOIN MIT_STUDENT_DIRECTORY t1 ON t0.DEPARTMENT_CODE = t1.DEPARTMENT JOIN SIS_ADMIN_DEPARTMENT
    t2 ON t1.DEPARTMENT = t2.SIS_ADMIN_DEPARTMENT_CODE WHERE t1.DEPARTMENT = '6' AND
    t1.DEPARTMENT_NAME = 'Electrical Eng & Computer Sci' ) sd JOIN ( SELECT t2.SUBJECT_TITLE,
    t2.TOTAL_UNITS, t1.DEPARTMENT_NAME, t1.COURSE_DESCRIPTION, DENSE_RANK() OVER (PARTITION
    BY t2.OFFER_DEPT_CODE ORDER BY t2.OFFER_DEPT_CODE) AS window_column, t2.OFFER_DEPT_CODE,
    t1.SCHOOL_NAME FROM SIS_SUBJECT_CODE t0 JOIN SIS_COURSE_DESCRIPTION t1 ON t0.SUBJECT_CODE
    = t1.COURSE JOIN SUBJECT_OFFERED_SUMMARY t2 ON t1.COURSE = t2.COURSE_NUMBER WHERE
    t2.OFFER_SCHOOL_NAME = 'Engineering' AND t2.TOTAL_UNITS > 0 AND t1.DEPARTMENT_NAME
    = 'Electrical Eng & Computer Sci' ) sbd ON sd.DEPARTMENT = sbd.OFFER_DEPT_CODE
    ) SELECT inner_cte.FIRST_NAME, inner_cte.LAST_NAME, inner_cte.DEPARTMENT_NAME,
    inner_cte.STUDENT_YEAR, inner_cte.DEPARTMENT_FULL_NAME, inner_cte.SIS_ADMIN_DEPARTMENT_NAME,
    inner_cte.student_window_column, inner_cte.SUBJECT_TITLE, inner_cte.TOTAL_UNITS,
    inner_cte.SUBJECT_DEPARTMENT_NAME, inner_cte.COURSE_DESCRIPTION, inner_cte.subject_window_column,
    d.SCHOOL_NAME, CASE WHEN inner_cte.TOTAL_UNITS >= 12 THEN 'HIGH_LOAD' WHEN inner_cte.TOTAL_UNITS
    <= 6 THEN 'LOW_LOAD' ELSE 'MEDIUM_LOAD' END AS SUBJECT_LOAD_CATEGORY FROM inner_cte
    JOIN SIS_DEPARTMENT d ON inner_cte.OFFER_DEPT_CODE = d.DEPARTMENT_CODE ORDER BY
    inner_cte.FIRST_NAME, inner_cte.SUBJECT_TITLE;
- category: Subject Offering and Student Directory Comprehensive Analysis
  default_granularity: one row per offer department code of the matched EECS subjects
    and students
  desc: For each subject offered in the 'Engineering' school with total units greater
    than 0 and only for subjects in the 'Electrical Eng & Computer Sci' department
    (Course 6), show the subject title, total units, department name, course description,
    and dense rank over the offer department code ordered by offer department code,
    along with the first name, last name, department name, student year, corresponding
    department's full name, administrative department name, and the average department
    phone number in a window of 2 preceding and 2 following rows grouped by the administrative
    department name and ordered by the student's first name, for students whose department
    is '6' and whose department name is 'Electrical Eng & Computer Sci', where the
    subject's offer department code matches the student's department. Then, for each
    offer department code, provide the maximum total units among these subjects and
    the count of distinct student years among the matched students. Do not return
    any rounded answers.
  id: dw_2240
  name: EECS Engineering Subject Max Units and Distinct Student Year Counts per Offer
    Department
  sql: WITH inner_cte AS ( WITH subject_summary AS ( SELECT t2.SUBJECT_TITLE, t2.TOTAL_UNITS,
    t1.DEPARTMENT_NAME, t1.COURSE_DESCRIPTION, DENSE_RANK() OVER (PARTITION BY t2.OFFER_DEPT_CODE
    ORDER BY t2.OFFER_DEPT_CODE) AS window_column, t2.OFFER_DEPT_CODE FROM SIS_SUBJECT_CODE
    t0 JOIN SIS_COURSE_DESCRIPTION t1 ON t0.SUBJECT_CODE = t1.COURSE JOIN SUBJECT_OFFERED_SUMMARY
    t2 ON t1.COURSE = t2.COURSE_NUMBER WHERE t2.OFFER_SCHOOL_NAME = 'Engineering'
    AND t2.TOTAL_UNITS > 0 AND t1.DEPARTMENT_NAME = 'Electrical Eng & Computer Sci'
    ), student_summary AS ( SELECT t1.FIRST_NAME, t1.LAST_NAME, t1.DEPARTMENT_NAME,
    t1.STUDENT_YEAR, t0.DEPARTMENT_FULL_NAME, t2.SIS_ADMIN_DEPARTMENT_NAME, AVG(t2.DEPARTMENT_PHONE_NUMBER)
    OVER ( PARTITION BY t2.SIS_ADMIN_DEPARTMENT_NAME ORDER BY t1.FIRST_NAME ROWS BETWEEN
    2 PRECEDING AND 2 FOLLOWING ) AS window_column, t1.DEPARTMENT FROM SIS_DEPARTMENT
    t0 JOIN MIT_STUDENT_DIRECTORY t1 ON t0.DEPARTMENT_CODE = t1.DEPARTMENT JOIN SIS_ADMIN_DEPARTMENT
    t2 ON t1.DEPARTMENT = t2.SIS_ADMIN_DEPARTMENT_CODE WHERE t1.DEPARTMENT = '6' AND
    t1.DEPARTMENT_NAME = 'Electrical Eng & Computer Sci' ) SELECT ss.SUBJECT_TITLE,
    ss.TOTAL_UNITS, ss.DEPARTMENT_NAME, ss.COURSE_DESCRIPTION, ss.window_column AS
    subject_window_rank, ss.OFFER_DEPT_CODE, st.FIRST_NAME, st.LAST_NAME, st.DEPARTMENT_NAME
    AS student_department_name, st.STUDENT_YEAR, st.DEPARTMENT_FULL_NAME, st.SIS_ADMIN_DEPARTMENT_NAME,
    st.window_column AS student_window_avg_phone FROM subject_summary ss JOIN student_summary
    st ON ss.OFFER_DEPT_CODE = st.DEPARTMENT ) SELECT OFFER_DEPT_CODE, MAX(TOTAL_UNITS)
    AS max_total_units, COUNT(DISTINCT student_year) AS distinct_student_years FROM
    inner_cte GROUP BY OFFER_DEPT_CODE;
- category: Person Master and Student Directory Comprehensive Analysis
  default_granularity: one row per employee type and department name combination of
    graduate students
  desc: For each employee type and department name where the student year is 'G',
    show the number of people, the minimum MIT ID, and the list of unique office locations
    for those employees. Do not return any rounded answers.
  id: dw_2759
  name: Graduate Student Employee Type Department Counts with Min MIT ID and Unique
    Office Locations
  sql: WITH inner_cte AS ( SELECT sp.EMPLOYEE_TYPE, msd.DEPARTMENT_NAME, COUNT(sp.MIT_ID)
    AS person_count, MIN(sp.MIT_ID) AS min_mit_id FROM SE_PERSON sp JOIN MIT_STUDENT_DIRECTORY
    msd ON sp.FULL_NAME = msd.FULL_NAME WHERE msd.STUDENT_YEAR = 'G' GROUP BY sp.EMPLOYEE_TYPE,
    msd.DEPARTMENT_NAME ) SELECT inner_cte.EMPLOYEE_TYPE, inner_cte.DEPARTMENT_NAME,
    inner_cte.person_count, inner_cte.min_mit_id, GROUP_CONCAT(DISTINCT sp.OFFICE_LOCATION)
    AS unique_office_locations FROM inner_cte JOIN SE_PERSON sp ON sp.EMPLOYEE_TYPE
    = inner_cte.EMPLOYEE_TYPE JOIN MIT_STUDENT_DIRECTORY msd ON sp.FULL_NAME = msd.FULL_NAME
    AND msd.DEPARTMENT_NAME = inner_cte.DEPARTMENT_NAME AND msd.STUDENT_YEAR = 'G'
    GROUP BY inner_cte.EMPLOYEE_TYPE, inner_cte.DEPARTMENT_NAME, inner_cte.person_count,
    inner_cte.min_mit_id;
- category: Subject Offering and Student Directory Comprehensive Analysis
  default_granularity: one row per degree-granting department that offered Engineering-school
    subjects in 2021
  desc: For each department that is degree-granting and offered at least one subject
    in the School of Engineering in 2021, provide the department code, department
    name, department full name, the number of subjects offered, the total number of
    enrolled students in those subjects, and the total number of active graduate students
    with an office location assigned in that department. Do not return any rounded
    answers.
  id: dw_3237
  name: 2021 Engineering Degree-Granting Department Subject Counts with Active Graduate
    Student Office Totals
  sql: WITH DeptSubjects AS ( SELECT d.DEPARTMENT_CODE, d.DEPARTMENT_NAME, d.DEPARTMENT_FULL_NAME,
    COUNT(s.SUBJECT_OFFERED_SUMMARY_KEY) AS subject_count, SUM(s.NUM_ENROLLED_STUDENTS)
    AS total_enrollment FROM SIS_DEPARTMENT d JOIN SUBJECT_OFFERED_SUMMARY s ON d.DEPARTMENT_CODE
    = s.OFFER_DEPT_CODE WHERE d.IS_DEGREE_GRANTING = 'Y' AND s.OFFER_SCHOOL_NAME =
    'Engineering' AND s.TERM_CODE LIKE '2021%' GROUP BY d.DEPARTMENT_CODE, d.DEPARTMENT_NAME,
    d.DEPARTMENT_FULL_NAME ), DeptActiveGradStudents AS ( SELECT m.DEPARTMENT_NAME,
    m.DEPARTMENT, COUNT(*) AS total_active_grad_students FROM SE_PERSON s JOIN MIT_STUDENT_DIRECTORY
    m ON s.FULL_NAME = m.FULL_NAME WHERE s.IS_ACTIVE = 'Y' AND m.STUDENT_YEAR = 'G'
    AND m.OFFICE_LOCATION IS NOT NULL GROUP BY m.DEPARTMENT_NAME, m.DEPARTMENT HAVING
    COUNT(*) > 0 ) SELECT ds.DEPARTMENT_CODE, ds.DEPARTMENT_NAME, ds.DEPARTMENT_FULL_NAME,
    ds.subject_count, ds.total_enrollment, dag.total_active_grad_students FROM DeptSubjects
    ds LEFT JOIN SIS_DEPARTMENT d ON ds.DEPARTMENT_CODE = d.DEPARTMENT_CODE LEFT JOIN
    DeptActiveGradStudents dag ON d.DEPARTMENT_CODE = dag.DEPARTMENT ORDER BY ds.DEPARTMENT_NAME;
- category: Subject Offering and Student Directory Comprehensive Analysis
  default_granularity: one row per 2017JA subject offering matched with an above-average-last-name
    EECS student
  desc: For subjects offered in the term '2017JA', and for students in the "Electrical
    Eng & Computer Sci" department whose last name is alphabetically after the average
    last name (in terms of ASCII value) within their course level group, show the
    subject title, number of enrolled students, offering department name, department
    full name, subject code, subject code description, the minimum number of enrolled
    students over each subject code group, the school name, department phone number,
    the student's full name, email address, department name, course description, course
    level, and the student's row number within their course level group ordered by
    last name. Order the results by subject code, course level, and student row number
    within course level. Do not return any rounded answers.
  id: dw_3969
  name: 2017JA Subject Enrollment Windows Matched with Above-Average-Last-Name EECS
    Student Row Numbers
  sql: WITH subq1 AS ( WITH inner_cte AS ( SELECT t0.SUBJECT_TITLE, t0.NUM_ENROLLED_STUDENTS,
    t0.OFFER_DEPT_NAME, t1.DEPARTMENT_FULL_NAME, t2.SUBJECT_CODE, t2.SUBJECT_CODE_DESC,
    min(t0.NUM_ENROLLED_STUDENTS) OVER (PARTITION BY t2.SUBJECT_CODE ORDER BY t2.SUBJECT_CODE)
    AS window_column, t1.DEPARTMENT_CODE FROM TIP_SUBJECT_OFFERED t0 JOIN SIS_DEPARTMENT
    t1 ON t0.OFFER_DEPT_CODE = t1.DEPARTMENT_CODE JOIN SIS_SUBJECT_CODE t2 ON t1.DEPARTMENT_CODE
    = t2.DEPARTMENT_CODE WHERE t0.TERM_CODE = '2017JA' ) SELECT inner_cte.SUBJECT_TITLE,
    inner_cte.NUM_ENROLLED_STUDENTS, inner_cte.OFFER_DEPT_NAME, inner_cte.DEPARTMENT_FULL_NAME,
    inner_cte.SUBJECT_CODE, inner_cte.SUBJECT_CODE_DESC, inner_cte.window_column,
    sd.SCHOOL_NAME, ad.DEPARTMENT_PHONE_NUMBER, inner_cte.DEPARTMENT_CODE FROM inner_cte
    LEFT JOIN SIS_DEPARTMENT sd ON inner_cte.OFFER_DEPT_NAME = sd.DEPARTMENT_NAME
    LEFT JOIN SIS_ADMIN_DEPARTMENT ad ON sd.DEPARTMENT_CODE = ad.SIS_ADMIN_DEPARTMENT_CODE
    ), subq2 AS ( WITH inner_cte AS ( SELECT t2.FULL_NAME, t2.EMAIL_ADDRESS, t1.DEPARTMENT_NAME,
    t0.COURSE_DESCRIPTION, t0.COURSE_LEVEL, t2.LAST_NAME, t1.DEPARTMENT_CODE FROM
    SIS_COURSE_DESCRIPTION t0 JOIN SIS_DEPARTMENT t1 ON t0.DEPARTMENT = t1.DEPARTMENT_CODE
    JOIN MIT_STUDENT_DIRECTORY t2 ON t1.DEPARTMENT_CODE = t2.DEPARTMENT WHERE t1.DEPARTMENT_NAME
    = 'Electrical Eng & Computer Sci' ), avg_lastname_cte AS ( SELECT COURSE_LEVEL,
    AVG(ASCII(SUBSTR(LAST_NAME, 1, 1))) AS avg_ascii FROM inner_cte GROUP BY COURSE_LEVEL
    ) SELECT i.FULL_NAME, i.EMAIL_ADDRESS, i.DEPARTMENT_NAME, i.COURSE_DESCRIPTION,
    i.COURSE_LEVEL, ROW_NUMBER() OVER (PARTITION BY i.COURSE_LEVEL ORDER BY i.LAST_NAME)
    AS window_column, i.DEPARTMENT_CODE FROM inner_cte i JOIN avg_lastname_cte a ON
    i.COURSE_LEVEL = a.COURSE_LEVEL WHERE ASCII(SUBSTR(i.LAST_NAME, 1, 1)) > a.avg_ascii
    ) SELECT s1.SUBJECT_TITLE, s1.NUM_ENROLLED_STUDENTS, s1.OFFER_DEPT_NAME, s1.DEPARTMENT_FULL_NAME,
    s1.SUBJECT_CODE, s1.SUBJECT_CODE_DESC, s1.window_column AS MIN_NUM_ENROLLED_STUDENTS_OVER_SUBJECT_CODE,
    s1.SCHOOL_NAME, s1.DEPARTMENT_PHONE_NUMBER, s2.FULL_NAME, s2.EMAIL_ADDRESS, s2.DEPARTMENT_NAME,
    s2.COURSE_DESCRIPTION, s2.COURSE_LEVEL, s2.window_column AS STUDENT_ROW_NUMBER_WITHIN_COURSE_LEVEL
    FROM subq1 s1 JOIN subq2 s2 ON s1.DEPARTMENT_CODE = s2.DEPARTMENT_CODE ORDER BY
    s1.SUBJECT_CODE, s2.COURSE_LEVEL, s2.window_column;
- id: dw_2956
  name: Active Moira Mailing List Member Rollup with Per-List Min MIT ID and Deduplicated
    List Keys
  desc: For all active Moira lists that are also Moira mailing lists, show the list
    key, list name, whether the list is public, the member's full name, the member's
    MIT ID, the last update date, and the minimum MIT ID value over each list key
    group. Include subtotals for each list key (the corresponding list key field is
    'SUBTOTAL') and a grand total across all lists (the corresponding list key field
    is 'TOTAL'). Do not repeat the list key if it is the same as the previous row.
    Sort the table by list key and list name. Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT t0.MOIRA_LIST_KEY, t0.MOIRA_LIST_NAME, t0.IS_PUBLIC,
    t1.MOIRA_LIST_MEMBER_FULL_NAME, t1.MOIRA_LIST_MEMBER_MIT_ID, t1.LAST_UPDATE_DATE,
    min(t1.MOIRA_LIST_MEMBER_MIT_ID) OVER (PARTITION BY t0.MOIRA_LIST_KEY ORDER BY
    t0.MOIRA_LIST_KEY) AS min_mit_id FROM MOIRA_LIST t0 JOIN MOIRA_LIST_DETAIL t1
    ON t0.MOIRA_LIST_KEY = t1.MOIRA_LIST_KEY WHERE t0.IS_ACTIVE = 'Y' AND t0.IS_MOIRA_MAILING_LIST
    = 'Y' ) SELECT CASE WHEN LAG(list_key) OVER (ORDER BY list_key_sort, list_name_sort)
    = list_key THEN NULL ELSE list_key END AS list_key, list_name, is_public, member_full_name,
    member_mit_id, last_update_date, min_mit_id FROM ( SELECT CASE WHEN GROUPING(MOIRA_LIST_KEY)
    = 1 AND GROUPING(MOIRA_LIST_NAME) = 1 THEN 'zzz' ELSE MOIRA_LIST_KEY END AS list_key_sort,
    CASE WHEN GROUPING(MOIRA_LIST_KEY) = 0 AND GROUPING(MOIRA_LIST_NAME) = 1 THEN
    'SUBTOTAL' WHEN GROUPING(MOIRA_LIST_KEY) = 1 AND GROUPING(MOIRA_LIST_NAME) = 1
    THEN 'TOTAL' ELSE MOIRA_LIST_KEY END AS list_key, CASE WHEN GROUPING(MOIRA_LIST_KEY)
    = 0 AND GROUPING(MOIRA_LIST_NAME) = 1 THEN 'zzz' ELSE MOIRA_LIST_NAME END AS list_name_sort,
    MOIRA_LIST_NAME AS list_name, MAX(IS_PUBLIC) AS is_public, MAX(MOIRA_LIST_MEMBER_FULL_NAME)
    AS member_full_name, MAX(MOIRA_LIST_MEMBER_MIT_ID) AS member_mit_id, MAX(LAST_UPDATE_DATE)
    AS last_update_date, MIN(min_mit_id) AS min_mit_id FROM inner_cte GROUP BY MOIRA_LIST_KEY,
    MOIRA_LIST_NAME WITH ROLLUP ) tbl ORDER BY list_key_sort, list_name_sort;
  category: Mailing List Membership Analysis
  default_granularity: one row per list key/list name rollup level (detail, SUBTOTAL
    per list key, TOTAL grand total)
- id: dw_2901
  name: Moira List Members Updated on a Date Classified Against Owner-Type Average
    MIT ID
  desc: For each Moira list member whose last update date is '18-DEC-24', show the
    Moira list key, the member's full name, the owner's type, the member's MIT ID,
    the list owner, the last update date, and whether the member's MIT ID is above
    or below the average MIT ID for their owner type. If it's above, label as 'ABOVE_AVERAGE',
    if below, label as 'BELOW_AVERAGE', otherwise 'AVERAGE'. Do not return any rounded
    answers.
  sql: WITH inner_cte AS ( SELECT d.MOIRA_LIST_KEY, d.MOIRA_LIST_MEMBER_FULL_NAME,
    o.OWNER_TYPE, d.MOIRA_LIST_MEMBER_MIT_ID, o.OWNER, d.LAST_UPDATE_DATE FROM MOIRA_LIST_DETAIL
    d JOIN MOIRA_LIST_OWNER o ON d.MOIRA_LIST_OWNER_KEY = o.MOIRA_LIST_OWNER_KEY WHERE
    d.LAST_UPDATE_DATE = '18-DEC-24' ), avg_mit_id AS ( SELECT OWNER_TYPE, AVG(MOIRA_LIST_MEMBER_MIT_ID)
    AS avg_mit_id FROM inner_cte GROUP BY OWNER_TYPE ) SELECT i.MOIRA_LIST_KEY, i.MOIRA_LIST_MEMBER_FULL_NAME,
    i.OWNER_TYPE, i.MOIRA_LIST_MEMBER_MIT_ID, i.OWNER, i.LAST_UPDATE_DATE, CASE WHEN
    i.MOIRA_LIST_MEMBER_MIT_ID > a.avg_mit_id THEN 'ABOVE_AVERAGE' WHEN i.MOIRA_LIST_MEMBER_MIT_ID
    < a.avg_mit_id THEN 'BELOW_AVERAGE' ELSE 'AVERAGE' END AS mit_id_category FROM
    inner_cte i JOIN avg_mit_id a ON i.OWNER_TYPE = a.OWNER_TYPE;
  category: Mailing List Membership Analysis
  default_granularity: one row per Moira list membership record updated on the given
    date, labeled against its owner-type average member MIT ID
- id: dw_1954
  name: 2019FA Chemistry TIP Subjects Windowed Min Enrollment with Department Subject
    Code Statistics
  desc: For subjects offered in the term '2019FA' with more than 0 enrolled students,
    offered by the Chemistry department (Course 5), and only including courses that
    have course materials, show the subject title, offering department name, school
    name, department full name, and the minimum number of enrolled students in a window
    of 3 preceding and 1 following row ordered by the department name. Additionally,
    for the same department, provide the department name, the average and standard
    deviation (using STDDEV only and never STDDEV_POP) of the number of unique subject
    codes associated with its courses that are offered by degree-granting departments,
    but only include departments other than 'Mathematics' (Course 18). Also, for each
    of these departments, show the total number of courses offered by the department
    in the '2019FA' term that have at least one enrolled student and have course materials.
    Present the subject title, offering department name, school name, department full
    name, windowed minimum enrolled students, department name, average number of unique
    subject codes, standard deviation (using STDDEV only and never STDDEV_POP) of
    unique subject codes, and the total number of such courses, in that order. Do
    not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT t0.SUBJECT_TITLE, t0.OFFER_DEPT_NAME, t0.OFFER_SCHOOL_NAME,
    t1.DEPARTMENT_FULL_NAME, MIN(t0.NUM_ENROLLED_STUDENTS) OVER (ORDER BY t1.DEPARTMENT_NAME
    ROWS BETWEEN 3 PRECEDING AND 1 FOLLOWING) AS window_column, t1.DEPARTMENT_CODE
    FROM TIP_SUBJECT_OFFERED t0 JOIN SIS_DEPARTMENT t1 ON t0.OFFER_DEPT_CODE = t1.DEPARTMENT_CODE
    JOIN SIS_ADMIN_DEPARTMENT t2 ON t1.DEPARTMENT_CODE = t2.SIS_ADMIN_DEPARTMENT_CODE
    WHERE t0.TERM_CODE = '2019FA' AND t0.NUM_ENROLLED_STUDENTS > 0 AND t0.OFFER_DEPT_NAME
    = 'Chemistry' AND t0.IS_NO_COURSE_MATERIAL = 'N' ), course_counts AS ( SELECT
    t1.DEPARTMENT_CODE, COUNT(DISTINCT t0.MASTER_COURSE_NUMBER) AS total_courses FROM
    TIP_SUBJECT_OFFERED t0 JOIN SIS_DEPARTMENT t1 ON t0.OFFER_DEPT_CODE = t1.DEPARTMENT_CODE
    WHERE t0.TERM_CODE = '2019FA' AND t0.NUM_ENROLLED_STUDENTS > 0 AND t0.IS_NO_COURSE_MATERIAL
    = 'N' GROUP BY t1.DEPARTMENT_CODE ), subject_code_stats AS ( SELECT d.DEPARTMENT_NAME,
    AVG(subj_count) AS avg_subject_codes, STDDEV(subj_count) AS stddev_subject_codes,
    d.DEPARTMENT_CODE FROM ( SELECT cd.DEPARTMENT, COUNT(DISTINCT sc.SUBJECT_CODE)
    AS subj_count FROM SIS_COURSE_DESCRIPTION cd JOIN SIS_DEPARTMENT d ON cd.DEPARTMENT
    = d.DEPARTMENT_CODE JOIN SIS_SUBJECT_CODE sc ON d.DEPARTMENT_CODE = sc.DEPARTMENT_CODE
    WHERE d.IS_DEGREE_GRANTING = 'Y' AND d.DEPARTMENT_NAME != 'Mathematics' GROUP
    BY cd.COURSE, cd.DEPARTMENT ) course_subjects JOIN SIS_DEPARTMENT d ON course_subjects.DEPARTMENT
    = d.DEPARTMENT_CODE WHERE d.DEPARTMENT_CODE != '18' GROUP BY d.DEPARTMENT_NAME,
    d.DEPARTMENT_CODE ) SELECT icte.SUBJECT_TITLE, icte.OFFER_DEPT_NAME, icte.OFFER_SCHOOL_NAME,
    icte.DEPARTMENT_FULL_NAME, icte.window_column, scs.DEPARTMENT_NAME, scs.avg_subject_codes,
    scs.stddev_subject_codes, cc.total_courses FROM inner_cte icte JOIN subject_code_stats
    scs ON icte.DEPARTMENT_CODE = scs.DEPARTMENT_CODE JOIN course_counts cc ON icte.DEPARTMENT_CODE
    = cc.DEPARTMENT_CODE ORDER BY icte.SUBJECT_TITLE, scs.avg_subject_codes DESC
  category: Subject Offering and Course Catalog Comprehensive Analysis
  default_granularity: one row per 2019FA Chemistry TIP subject with course materials
    matched with department-level subject code statistics
- id: dw_2224
  name: Math Subject Code School Budget Code Windows with Non-Math Admin Department
    Clearing Cost Statistics
  desc: For each subject code where the department is degree granting and the department
    is Mathematics, and for each department that is degree granting and is not the
    Mathematics department (Course 18), show the subject code, subject code description,
    mathematics department name, school name, the average department budget code within
    each school, the administrative department name, the average clearing cost collector,
    the variance of the clearing cost collector, the standard deviation (using STDDEV
    only and never STDDEV_POP) of the clearing cost collector, and the most recent
    activity date for the administrative department. Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT scm.SUBJECT_CODE, scm.SUBJECT_CODE_DESC, scm.DEPARTMENT_NAME
    AS mathematics_department_name, scm.SCHOOL_NAME, scm.avg_dept_budget_code, ads.DEPARTMENT_NAME
    AS admin_department_name, ads.avg_clearing_cost_collector, ads.clearing_cost_collector_variance,
    ads.clearing_cost_collector_stddev FROM ( SELECT t1.SUBJECT_CODE, t1.SUBJECT_CODE_DESC,
    t0.DEPARTMENT_NAME, t1.SCHOOL_NAME, AVG(t0.DEPT_BUDGET_CODE) OVER (PARTITION BY
    t1.SCHOOL_NAME ORDER BY t0.DEPARTMENT_NAME) AS avg_dept_budget_code FROM SIS_DEPARTMENT
    t0 JOIN SIS_SUBJECT_CODE t1 ON t0.SCHOOL_CODE = t1.SCHOOL_CODE WHERE t0.IS_DEGREE_GRANTING
    = 'Y' AND t0.DEPARTMENT_NAME = 'Mathematics' ORDER BY t0.DEPARTMENT_NAME ) scm
    CROSS JOIN ( SELECT d.DEPARTMENT_NAME, AVG(a.CLEARING_COST_COLLECTOR) AS avg_clearing_cost_collector,
    VARIANCE(a.CLEARING_COST_COLLECTOR) AS clearing_cost_collector_variance, STDDEV(a.CLEARING_COST_COLLECTOR)
    AS clearing_cost_collector_stddev, MAX(a.LAST_ACTIVITY_DATE) AS most_recent_activity_date
    FROM SIS_DEPARTMENT d JOIN SIS_ADMIN_DEPARTMENT a ON d.DEPARTMENT_CODE = a.SIS_ADMIN_DEPARTMENT_CODE
    WHERE d.IS_DEGREE_GRANTING = 'Y' AND d.DEPARTMENT_NAME != 'Mathematics' AND d.DEPARTMENT_CODE
    != '18' GROUP BY d.DEPARTMENT_NAME ORDER BY clearing_cost_collector_variance DESC
    ) ads ) SELECT inner_cte.SUBJECT_CODE, inner_cte.SUBJECT_CODE_DESC, inner_cte.mathematics_department_name,
    inner_cte.SCHOOL_NAME, inner_cte.avg_dept_budget_code, inner_cte.admin_department_name,
    inner_cte.avg_clearing_cost_collector, inner_cte.clearing_cost_collector_variance,
    inner_cte.clearing_cost_collector_stddev, ads2.most_recent_activity_date FROM
    inner_cte JOIN ( SELECT d.DEPARTMENT_NAME, MAX(a.LAST_ACTIVITY_DATE) AS most_recent_activity_date
    FROM SIS_DEPARTMENT d JOIN SIS_ADMIN_DEPARTMENT a ON d.DEPARTMENT_CODE = a.SIS_ADMIN_DEPARTMENT_CODE
    WHERE d.IS_DEGREE_GRANTING = 'Y' AND d.DEPARTMENT_NAME != 'Mathematics' AND d.DEPARTMENT_CODE
    != '18' GROUP BY d.DEPARTMENT_NAME ) ads2 ON inner_cte.admin_department_name =
    ads2.DEPARTMENT_NAME;
  category: Course Catalog and Department Analysis
  default_granularity: one row per Mathematics subject code crossed with each non-Mathematics
    degree-granting administrative department
- id: dw_4208
  name: 2016SP Engineering School Subject Row Numbers Matched with 2017JA TIP Subject
    Enrollment Windows
  desc: For subjects offered in the term '2016SP' with a school code of 'E', and for
    subjects offered in the term '2017JA', show the subject title, department name,
    course description, the number of enrolled students in 2016SP, the row number
    within a window of 2 preceding and 1 following rows ordered by subject title,
    the number of enrolled students in 2017JA, the offering department name, department
    full name, subject code, subject code description, the minimum number of enrolled
    students over each subject code group in 2017JA, the school name, and the department
    phone number. Order the results by subject title and subject code. Do not return
    any rounded answers.
  sql: WITH inner_cte1 AS ( SELECT t2.SUBJECT_TITLE, t1.DEPARTMENT_NAME, t1.COURSE_DESCRIPTION,
    ROW_NUMBER() OVER (ORDER BY t2.SUBJECT_TITLE ROWS BETWEEN 2 PRECEDING AND 1 FOLLOWING)
    AS window_column FROM SIS_SUBJECT_CODE t0 JOIN SIS_COURSE_DESCRIPTION t1 ON t0.COURSE_NUMBER
    = t1.COURSE JOIN SUBJECT_OFFERED_SUMMARY t2 ON t1.COURSE = t2.COURSE_NUMBER WHERE
    t2.TERM_CODE = '2016SP' AND t0.SCHOOL_CODE = 'E' ), cte1 AS ( SELECT inner_cte.SUBJECT_TITLE,
    inner_cte.DEPARTMENT_NAME, inner_cte.COURSE_DESCRIPTION, t2.NUM_ENROLLED_STUDENTS,
    inner_cte.window_column, t2.OFFER_DEPT_CODE FROM inner_cte1 inner_cte JOIN SUBJECT_OFFERED_SUMMARY
    t2 ON inner_cte.SUBJECT_TITLE = t2.SUBJECT_TITLE AND t2.TERM_CODE = '2016SP' ),
    inner_cte2 AS ( SELECT t0.SUBJECT_TITLE, t0.NUM_ENROLLED_STUDENTS, t0.OFFER_DEPT_NAME,
    t1.DEPARTMENT_FULL_NAME, t2.SUBJECT_CODE, t2.SUBJECT_CODE_DESC, min(t0.NUM_ENROLLED_STUDENTS)
    OVER (PARTITION BY t2.SUBJECT_CODE ORDER BY t2.SUBJECT_CODE) AS window_column
    FROM TIP_SUBJECT_OFFERED t0 JOIN SIS_DEPARTMENT t1 ON t0.OFFER_DEPT_CODE = t1.DEPARTMENT_CODE
    JOIN SIS_SUBJECT_CODE t2 ON t1.DEPARTMENT_CODE = t2.DEPARTMENT_CODE WHERE t0.TERM_CODE
    = '2017JA' ), cte2 AS ( SELECT inner_cte.SUBJECT_TITLE, inner_cte.NUM_ENROLLED_STUDENTS,
    inner_cte.OFFER_DEPT_NAME, inner_cte.DEPARTMENT_FULL_NAME, inner_cte.SUBJECT_CODE,
    inner_cte.SUBJECT_CODE_DESC, inner_cte.window_column, sd.SCHOOL_NAME, ad.DEPARTMENT_PHONE_NUMBER,
    sd.DEPARTMENT_CODE FROM inner_cte2 inner_cte LEFT JOIN SIS_DEPARTMENT sd ON inner_cte.OFFER_DEPT_NAME
    = sd.DEPARTMENT_NAME LEFT JOIN SIS_ADMIN_DEPARTMENT ad ON sd.DEPARTMENT_CODE =
    ad.SIS_ADMIN_DEPARTMENT_CODE ) SELECT cte1.SUBJECT_TITLE, cte1.DEPARTMENT_NAME,
    cte1.COURSE_DESCRIPTION, cte1.NUM_ENROLLED_STUDENTS AS NUM_ENROLLED_STUDENTS_2016SP,
    cte1.window_column AS WINDOW_COLUMN_2016SP, cte2.NUM_ENROLLED_STUDENTS AS NUM_ENROLLED_STUDENTS_2017JA,
    cte2.OFFER_DEPT_NAME, cte2.DEPARTMENT_FULL_NAME, cte2.SUBJECT_CODE, cte2.SUBJECT_CODE_DESC,
    cte2.window_column AS MIN_ENROLLED_STUDENTS_OVER_SUBJECT_CODE_2017JA, cte2.SCHOOL_NAME,
    cte2.DEPARTMENT_PHONE_NUMBER FROM cte1 JOIN cte2 ON cte1.OFFER_DEPT_CODE = cte2.DEPARTMENT_CODE
    ORDER BY cte1.SUBJECT_TITLE, cte2.SUBJECT_CODE;
  category: Enrollment and Subject Offering Comprehensive Analysis
  default_granularity: one row per 2016SP Engineering-school subject matched with
    a 2017JA TIP subject of the same offer department
- id: dw_2639
  name: 2016SP Engineering School Subjects Total Units Minus Lecture Units
  desc: For subjects offered in the term '2016SP' with a school code of 'E', show
    the subject title, department name, course description, and the difference between
    the total units and lecture units for each subject. Do not return any rounded
    answers.
  sql: WITH inner_cte AS ( SELECT t2.SUBJECT_TITLE, t1.DEPARTMENT_NAME, t1.COURSE_DESCRIPTION,
    t2.TOTAL_UNITS, t2.LECTURE_UNITS FROM SIS_SUBJECT_CODE t0 JOIN SIS_COURSE_DESCRIPTION
    t1 ON t0.COURSE_NUMBER = t1.COURSE JOIN SUBJECT_OFFERED_SUMMARY t2 ON t1.COURSE
    = t2.COURSE_NUMBER WHERE t2.TERM_CODE = '2016SP' AND t0.SCHOOL_CODE = 'E' ) SELECT
    SUBJECT_TITLE, DEPARTMENT_NAME, COURSE_DESCRIPTION, (TOTAL_UNITS - LECTURE_UNITS)
    AS units_minus_lecture FROM inner_cte;
  category: Subject Offering and Course Catalog Comprehensive Analysis
  default_granularity: one row per 2016SP Engineering-school subject offering
- id: dw_3273
  name: Engineering 12-Unit Courses Row Numbers with Subject Dense Ranks by Total
    Units
  desc: For courses in the School of Engineering with a total of 12 units, display
    the course number, course description, subject title, total units, offering department
    name, the row number of the course within its offering department ordered by course
    number, and the dense rank of the subject (considering the current and 2 preceding
    rows ordered by total units) if available. Do not return any rounded answers.
  sql: WITH course_windowed AS ( SELECT t0.COURSE AS course_number, t0.COURSE_DESCRIPTION,
    t1.SUBJECT_TITLE, t1.TOTAL_UNITS, t1.OFFER_DEPT_NAME, ROW_NUMBER() OVER (PARTITION
    BY t1.OFFER_DEPT_NAME ORDER BY t0.COURSE) AS window_column FROM SIS_COURSE_DESCRIPTION
    t0 JOIN SUBJECT_OFFERED_SUMMARY t1 ON t0.COURSE = t1.COURSE_NUMBER WHERE t0.SCHOOL_NAME
    = 'Engineering' AND t1.TOTAL_UNITS = 12 ), subject_dense_ranked AS ( SELECT t2.SUBJECT_TITLE,
    dense_rank() OVER (ORDER BY t2.TOTAL_UNITS ROWS BETWEEN 2 PRECEDING AND CURRENT
    ROW) AS window_column, t2.OFFER_DEPT_CODE FROM SIS_SUBJECT_CODE t0 JOIN SIS_DEPARTMENT
    t1 ON t0.DEPARTMENT_CODE = t1.DEPARTMENT_CODE JOIN SUBJECT_OFFERED_SUMMARY t2
    ON t1.DEPARTMENT_CODE = t2.OFFER_DEPT_CODE WHERE t1.SCHOOL_NAME = 'Engineering'
    ) SELECT cw.course_number, cw.COURSE_DESCRIPTION, cw.SUBJECT_TITLE, cw.TOTAL_UNITS,
    cw.OFFER_DEPT_NAME, cw.window_column AS course_row_number, sdr.window_column AS
    subject_dense_rank FROM course_windowed cw LEFT JOIN subject_dense_ranked sdr
    ON cw.SUBJECT_TITLE = sdr.SUBJECT_TITLE ORDER BY cw.OFFER_DEPT_NAME, cw.course_number;
  category: Subject Offering and Course Catalog Comprehensive Analysis
  default_granularity: one row per Engineering 12-unit course matched with dense-ranked
    Engineering subject offerings
- category: Subject Offering and Enrollment Comprehensive Analysis
  default_granularity: one row per 2019FA TIP subject matched with an Engineering
    12-unit course of the same offer department
  desc: For subjects offered in the term '2019FA' with more than 0 enrolled students,
    and for courses in the 'Engineering' school with a total of 12 units, show the
    subject title, offer department name, department full name, number of enrolled
    students, the average number of enrolled students in a window of 2 preceding and
    2 following rows grouped by the school code, the course number, course description,
    course subject title, total units, course offering department name, and the row
    number of the course within each offering department ordered by course number,
    for cases where the subject and course are from the same offering department.
    Order the results by subject title and course number. Do not return any rounded
    answers.
  id: dw_3794
  name: 2019FA TIP Subject Enrollment Windows Matched with Engineering 12-Unit Course
    Row Numbers
  sql: WITH SubjectStats AS ( SELECT t0.SUBJECT_TITLE, t0.OFFER_DEPT_NAME, t1.DEPARTMENT_FULL_NAME,
    t0.NUM_ENROLLED_STUDENTS, AVG(t0.NUM_ENROLLED_STUDENTS) OVER ( PARTITION BY t1.SCHOOL_CODE
    ORDER BY t0.SUBJECT_TITLE ROWS BETWEEN 2 PRECEDING AND 2 FOLLOWING ) AS window_column,
    t0.OFFER_DEPT_CODE FROM TIP_SUBJECT_OFFERED t0 JOIN SIS_DEPARTMENT t1 ON t0.OFFER_DEPT_CODE
    = t1.DEPARTMENT_CODE WHERE t0.TERM_CODE = '2019FA' AND t0.NUM_ENROLLED_STUDENTS
    > 0 ), EngineeringCourses AS ( SELECT t0.COURSE AS course_number, t0.COURSE_DESCRIPTION,
    t1.SUBJECT_TITLE AS course_subject_title, t1.TOTAL_UNITS, t1.OFFER_DEPT_NAME,
    ROW_NUMBER() OVER (PARTITION BY t1.OFFER_DEPT_NAME ORDER BY t0.COURSE) AS window_column,
    t1.OFFER_DEPT_CODE FROM SIS_COURSE_DESCRIPTION t0 JOIN SUBJECT_OFFERED_SUMMARY
    t1 ON t0.COURSE = t1.COURSE_NUMBER WHERE t0.SCHOOL_NAME = 'Engineering' AND t1.TOTAL_UNITS
    = 12 ) SELECT s.SUBJECT_TITLE, s.OFFER_DEPT_NAME, s.DEPARTMENT_FULL_NAME, s.NUM_ENROLLED_STUDENTS,
    s.window_column AS avg_enrolled_window, e.course_number, e.COURSE_DESCRIPTION,
    e.course_subject_title, e.TOTAL_UNITS, e.OFFER_DEPT_NAME AS course_offer_dept_name,
    e.window_column AS course_row_number FROM SubjectStats s JOIN EngineeringCourses
    e ON s.OFFER_DEPT_CODE = e.OFFER_DEPT_CODE ORDER BY s.SUBJECT_TITLE, e.course_number
- category: Course Catalog and Department Analysis
  default_granularity: one row per Engineering degree-granting course
  desc: For courses in the School of Engineering that are degree granting, show the
    course description, department name, the dense rank of each course considering
    the current and 2 preceding rows ordered by the department's budget code, the
    subject code description, and the row number of each course within a window of
    2 preceding and 1 following rows ordered by course description. Do not return
    any rounded answers.
  id: dw_3828
  name: Engineering Degree-Granting Courses Budget Code Dense Ranks with Subject Code
    Description Row Numbers
  sql: WITH Subquery1 AS ( SELECT t0.COURSE_DESCRIPTION, t1.DEPARTMENT_NAME, dense_rank()
    OVER (ORDER BY t1.DEPT_BUDGET_CODE ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) AS
    window_column, t0.COURSE FROM SIS_COURSE_DESCRIPTION t0 JOIN SIS_DEPARTMENT t1
    ON t0.DEPARTMENT = t1.DEPARTMENT_CODE WHERE t1.SCHOOL_NAME = 'Engineering' AND
    t1.IS_DEGREE_GRANTING = 'Y' ), Subquery2 AS ( SELECT t1.COURSE_DESCRIPTION, t1.DEPARTMENT_NAME,
    t0.SUBJECT_CODE_DESC, ROW_NUMBER() OVER (ORDER BY t1.COURSE_DESCRIPTION ROWS BETWEEN
    2 PRECEDING AND 1 FOLLOWING) AS window_column, t1.COURSE FROM SIS_SUBJECT_CODE
    t0 JOIN SIS_COURSE_DESCRIPTION t1 ON t0.SUBJECT_CODE = t1.COURSE WHERE t1.SCHOOL_NAME
    = 'Engineering' AND t1.IS_DEGREE_GRANTING = 'Y' ) SELECT s1.COURSE_DESCRIPTION,
    s1.DEPARTMENT_NAME, s1.window_column AS dense_rank_by_budget_code, s2.SUBJECT_CODE_DESC,
    s2.window_column AS row_number_by_course_description FROM Subquery1 s1 JOIN Subquery2
    s2 ON s1.COURSE = s2.COURSE ORDER BY s1.COURSE_DESCRIPTION
- category: Subject Offering and Course Catalog Comprehensive Analysis
  default_granularity: one row per 2016SP degree-granting department (with grand total
    rows) matched with a top-5 Engineering 12-unit-course department
  desc: For each department that grants degrees and offered subjects in the term '2016SP',
    and is also among the top 5 offering departments in the 'Engineering' school with
    the most 12-unit courses, list the department code, department name, the number
    of subjects offered, the total units for those subjects, the offering department
    name, the number of qualifying 12-unit courses, and the course number and description
    of the most recently added 12-unit course in each department. For each department,
    also include a grand total row for the number of subjects and total units in the
    format (department code, null, total subjects, total units, ...). Do not return
    any rounded answers.
  id: dw_4234
  name: 2016SP Degree-Granting Department Subject Rollups Matched with Top-5 Engineering
    12-Unit Course Departments
  sql: WITH inner_cte1 AS ( SELECT t2.SUBJECT_ID, dense_rank() OVER (ORDER BY t2.TOTAL_UNITS
    ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) window_column FROM SIS_COURSE_DESCRIPTION
    t0 JOIN SIS_DEPARTMENT t1 ON t0.DEPARTMENT = t1.DEPARTMENT_CODE JOIN SUBJECT_OFFERED_SUMMARY
    t2 ON t1.DEPARTMENT_CODE = t2.OFFER_DEPT_CODE WHERE t2.TERM_CODE = '2016SP' AND
    t1.IS_DEGREE_GRANTING = 'Y' ), DeptSubjectSummary AS ( SELECT t1.DEPARTMENT_CODE,
    t1.DEPARTMENT_NAME, COUNT(DISTINCT t2.SUBJECT_ID) AS num_subjects, SUM(t2.TOTAL_UNITS)
    AS total_units FROM SIS_DEPARTMENT t1 JOIN SUBJECT_OFFERED_SUMMARY t2 ON t1.DEPARTMENT_CODE
    = t2.OFFER_DEPT_CODE WHERE t1.IS_DEGREE_GRANTING = 'Y' AND t2.TERM_CODE = '2016SP'
    GROUP BY t1.DEPARTMENT_CODE, t1.DEPARTMENT_NAME ), DeptSummaryWithName AS ( SELECT
    dss.DEPARTMENT_CODE, dss.DEPARTMENT_NAME, dss.num_subjects, dss.total_units FROM
    DeptSubjectSummary dss UNION ALL SELECT dss.DEPARTMENT_CODE, NULL AS DEPARTMENT_NAME,
    SUM(dss.num_subjects) AS num_subjects, SUM(dss.total_units) AS total_units FROM
    DeptSubjectSummary dss GROUP BY dss.DEPARTMENT_CODE ), inner_cte2 AS ( SELECT
    t0.COURSE AS course_number, t0.COURSE_DESCRIPTION, t1.SUBJECT_TITLE, t1.TOTAL_UNITS,
    t1.OFFER_DEPT_NAME, t1.OFFER_DEPT_CODE, t0.LAST_ACTIVITY_DATE FROM SIS_COURSE_DESCRIPTION
    t0 JOIN SUBJECT_OFFERED_SUMMARY t1 ON t0.COURSE = t1.COURSE_NUMBER WHERE t0.SCHOOL_NAME
    = 'Engineering' AND t1.TOTAL_UNITS = 12 ), TopDepts AS ( SELECT ic.OFFER_DEPT_NAME,
    ic.OFFER_DEPT_CODE, COUNT(*) AS num_courses, ic_recent.course_number AS most_recent_course_number,
    ic_recent.COURSE_DESCRIPTION AS most_recent_course_description FROM inner_cte2
    ic JOIN ( SELECT OFFER_DEPT_NAME, OFFER_DEPT_CODE, course_number, COURSE_DESCRIPTION,
    LAST_ACTIVITY_DATE, ROW_NUMBER() OVER (PARTITION BY OFFER_DEPT_NAME ORDER BY LAST_ACTIVITY_DATE
    DESC) AS rn FROM inner_cte2 ) ic_recent ON ic.OFFER_DEPT_NAME = ic_recent.OFFER_DEPT_NAME
    AND ic.OFFER_DEPT_CODE = ic_recent.OFFER_DEPT_CODE AND ic_recent.rn = 1 GROUP
    BY ic.OFFER_DEPT_NAME, ic.OFFER_DEPT_CODE, ic_recent.course_number, ic_recent.COURSE_DESCRIPTION
    ORDER BY num_courses DESC LIMIT 5 ) SELECT dsw.DEPARTMENT_CODE, dsw.DEPARTMENT_NAME,
    dsw.num_subjects, dsw.total_units, td.OFFER_DEPT_NAME, td.num_courses, td.most_recent_course_number,
    td.most_recent_course_description FROM DeptSummaryWithName dsw JOIN TopDepts td
    ON dsw.DEPARTMENT_CODE = td.OFFER_DEPT_CODE ORDER BY dsw.DEPARTMENT_CODE, dsw.DEPARTMENT_NAME
- category: Course Catalog and Subject Offering Comprehensive Analysis
  default_granularity: one row per degree-granting subject code description status
    per school (with rollup totals) matched with 2016SP Engineering-school subject
    offerings
  desc: 'For each subject code where the department is degree granting, show the subject
    code, subject code description, department name, school name, the number of subject
    codes per school name, and whether the subject code description is present (''Has
    Description'') or missing (''No Description''). For each school name, include
    a grand total for all subject codes in the format of (null, null, null, school
    name, null, total subject codes). Additionally, for subjects offered in the term
    ''2016SP'' with a school code of ''E'', show the subject title, course description,
    the offering department name, and assign row numbers within a window of 2 preceding
    and 1 following rows ordered by subject title. Present all columns in the following
    order: subject code, subject code description, department name, school name, description
    status, total subject codes, subject title, course description, offering department
    name, and window column. Do not return any rounded answers.'
  id: dw_4490
  name: Degree-Granting Subject Code Description Status Rollup by School with 2016SP
    Engineering Subject Row Numbers
  sql: WITH inner_cte1 AS ( SELECT t1.SUBJECT_CODE, t1.SUBJECT_CODE_DESC, t0.DEPARTMENT_NAME,
    t1.SCHOOL_NAME FROM SIS_DEPARTMENT t0 JOIN SIS_SUBJECT_CODE t1 ON t0.SCHOOL_CODE
    = t1.SCHOOL_CODE WHERE t0.IS_DEGREE_GRANTING = 'Y' ), SubjectCodeVisibility AS
    ( SELECT SUBJECT_CODE, SUBJECT_CODE_DESC, DEPARTMENT_NAME, SCHOOL_NAME, CASE WHEN
    SUBJECT_CODE_DESC IS NOT NULL AND SUBJECT_CODE_DESC <> 'nan' THEN 'Has Description'
    ELSE 'No Description' END AS description_status FROM inner_cte1 ), RollupResults
    AS ( SELECT SCHOOL_NAME, description_status, COUNT(*) AS total_subject_codes FROM
    SubjectCodeVisibility GROUP BY SCHOOL_NAME, description_status WITH ROLLUP HAVING
    COUNT(*) > 0 ), SubjectCodeSummary AS ( SELECT scv.SUBJECT_CODE, scv.SUBJECT_CODE_DESC,
    scv.DEPARTMENT_NAME, rr.SCHOOL_NAME, rr.description_status, rr.total_subject_codes
    FROM RollupResults rr LEFT JOIN ( SELECT DISTINCT SUBJECT_CODE, SUBJECT_CODE_DESC,
    DEPARTMENT_NAME, SCHOOL_NAME, description_status FROM SubjectCodeVisibility )
    scv ON rr.SCHOOL_NAME = scv.SCHOOL_NAME AND rr.description_status = scv.description_status
    ), inner_cte2 AS ( SELECT t2.SUBJECT_TITLE, t1.DEPARTMENT_NAME, t1.COURSE_DESCRIPTION,
    ROW_NUMBER() OVER (ORDER BY t2.SUBJECT_TITLE ROWS BETWEEN 2 PRECEDING AND 1 FOLLOWING)
    AS window_column, t2.OFFER_DEPT_NAME FROM SIS_SUBJECT_CODE t0 JOIN SIS_COURSE_DESCRIPTION
    t1 ON t0.COURSE_NUMBER = t1.COURSE JOIN SUBJECT_OFFERED_SUMMARY t2 ON t1.COURSE
    = t2.COURSE_NUMBER WHERE t2.TERM_CODE = '2016SP' AND t0.SCHOOL_CODE = 'E' ), SubjectOfferSummary
    AS ( SELECT inner_cte2.SUBJECT_TITLE, inner_cte2.DEPARTMENT_NAME, inner_cte2.COURSE_DESCRIPTION,
    inner_cte2.OFFER_DEPT_NAME, inner_cte2.window_column FROM inner_cte2 JOIN SUBJECT_OFFERED_SUMMARY
    t2 ON inner_cte2.SUBJECT_TITLE = t2.SUBJECT_TITLE WHERE t2.TERM_CODE = '2016SP'
    ) SELECT scs.SUBJECT_CODE, scs.SUBJECT_CODE_DESC, scs.DEPARTMENT_NAME, scs.SCHOOL_NAME,
    scs.description_status, scs.total_subject_codes, sos.SUBJECT_TITLE, sos.COURSE_DESCRIPTION,
    sos.OFFER_DEPT_NAME, sos.window_column FROM SubjectCodeSummary scs LEFT JOIN SIS_DEPARTMENT
    sd ON scs.DEPARTMENT_NAME = sd.DEPARTMENT_NAME LEFT JOIN SUBJECT_OFFERED_SUMMARY
    so ON sd.DEPARTMENT_CODE = so.OFFER_DEPT_CODE LEFT JOIN SubjectOfferSummary sos
    ON so.SUBJECT_TITLE = sos.SUBJECT_TITLE ORDER BY scs.SCHOOL_NAME, scs.description_status,
    sos.SUBJECT_TITLE;
- id: dw_1689
  name: School Highest Department Average TIP Enrollment with 2019FA Chemistry Course-Material
    Subject Dense Ranks
  desc: For each school, what is the school name and the highest average number of
    enrolled students per department (among its degree-granting departments, excluding
    Chemistry, and only considering subjects with at least one enrolled student),
    and for each subject offered by the Chemistry department in the 2019FA term that
    has course materials, what is the subject title, the dense rank of the subject
    considering the current and 2 preceding rows ordered by the number of enrolled
    students descending, the full name of the offering department, and the school
    name of the Chemistry department? List the school name and highest average enrolled
    students per department first, followed by the Chemistry subject title, dense
    rank, department full name, and Chemistry school name. Do not return any rounded
    answers.
  sql: WITH dept_enrollment_stats AS ( SELECT sd.DEPARTMENT_NAME, sd.SCHOOL_NAME,
    AVG(tso.NUM_ENROLLED_STUDENTS) AS avg_enrolled, MAX(tso.NUM_ENROLLED_STUDENTS)
    - MIN(tso.NUM_ENROLLED_STUDENTS) AS range_enrolled, VARIANCE(tso.NUM_ENROLLED_STUDENTS)
    AS var_enrolled FROM SIS_DEPARTMENT sd JOIN TIP_SUBJECT_OFFERED tso ON sd.DEPARTMENT_CODE
    = tso.OFFER_DEPT_CODE WHERE sd.IS_DEGREE_GRANTING = 'Y' AND tso.NUM_ENROLLED_STUDENTS
    >= 1 AND tso.OFFER_DEPT_NAME <> 'Chemistry' GROUP BY sd.DEPARTMENT_NAME, sd.SCHOOL_NAME
    ), school_max_avg_enrollment AS ( SELECT SCHOOL_NAME, MAX(avg_enrolled) AS highest_avg_enrolled_per_dept
    FROM dept_enrollment_stats GROUP BY SCHOOL_NAME ), chemistry_subjects_ranked AS
    ( SELECT inner_cte.SUBJECT_TITLE, inner_cte.dense_rank_num_enrolled, inner_cte.DEPARTMENT_FULL_NAME,
    sd.SCHOOL_NAME FROM ( SELECT tso.SUBJECT_TITLE, DENSE_RANK() OVER ( ORDER BY tso.NUM_ENROLLED_STUDENTS
    DESC ROWS BETWEEN 2 PRECEDING AND CURRENT ROW ) AS dense_rank_num_enrolled, sd.DEPARTMENT_FULL_NAME,
    tso.OFFER_DEPT_CODE FROM TIP_SUBJECT_OFFERED tso JOIN STUDENT_DEPARTMENT sd ON
    tso.OFFER_DEPT_CODE = sd.DEPARTMENT_CODE WHERE tso.TERM_CODE = '2019FA' AND tso.OFFER_DEPT_NAME
    = 'Chemistry' AND tso.IS_NO_COURSE_MATERIAL = 'N' ) inner_cte JOIN STUDENT_DEPARTMENT
    sd ON inner_cte.OFFER_DEPT_CODE = sd.DEPARTMENT_CODE ) SELECT smax.SCHOOL_NAME,
    smax.highest_avg_enrolled_per_dept, csr.SUBJECT_TITLE, csr.dense_rank_num_enrolled,
    csr.DEPARTMENT_FULL_NAME, csr.SCHOOL_NAME AS chemistry_school_name FROM school_max_avg_enrollment
    smax CROSS JOIN chemistry_subjects_ranked csr;
  category: Enrollment and Subject Offering Comprehensive Analysis
  default_granularity: one row per school-level highest department average enrollment
    cross joined with each 2019FA Chemistry TIP subject having course materials
- id: dw_3644
  name: 2012SU 1-Unit Subject Row Numbers per Department with Department Offered Summary
    Unit Average-Stddev
  desc: For subjects offered in the 2012SU term with a total of 1 unit, show the subject
    title from the summary, the course number from the offered table, the subject
    title from the offered summary, the department name from the summary, the offer
    department name from the offered summary, the row number within each department
    name group ordered by subject title from the summary, and for each department,
    also provide the average and standard deviation (using STDDEV only and never STDDEV_POP)
    of the total units for subjects offered by that department (considering only subjects
    with more than 0 total units and at least 1 enrolled student). List the results
    ordered by department name and row number. Do not return any rounded answers.
  sql: WITH subq1 AS ( SELECT t2.SUBJECT_TITLE AS summary_subject_title, t1.COURSE_NUMBER,
    t0.SUBJECT_TITLE AS offered_summary_subject_title, t2.DEPARTMENT_NAME, t0.OFFER_DEPT_NAME,
    ROW_NUMBER() OVER (PARTITION BY t2.DEPARTMENT_NAME ORDER BY t2.SUBJECT_TITLE)
    AS window_column FROM SUBJECT_OFFERED_SUMMARY t0 JOIN SUBJECT_OFFERED t1 ON t0.SUBJECT_ID_SORT
    = t1.SUBJECT_ID_SORT JOIN SUBJECT_SUMMARY t2 ON t1.SUBJECT_ID_SORT = t2.SUBJECT_ID_SORT
    WHERE t1.TERM_CODE = '2012SU' AND t2.TOTAL_UNITS = 1 ), subq2 AS ( SELECT d.DEPARTMENT_NAME,
    AVG(s.TOTAL_UNITS) AS avg_total_units, STDDEV(s.TOTAL_UNITS) AS stddev_total_units
    FROM SIS_DEPARTMENT d JOIN SUBJECT_OFFERED_SUMMARY s ON d.DEPARTMENT_CODE = s.OFFER_DEPT_CODE
    WHERE s.TOTAL_UNITS > 0 AND s.NUM_ENROLLED_STUDENTS >= 1 GROUP BY d.DEPARTMENT_NAME
    ORDER BY stddev_total_units DESC ) SELECT subq1.summary_subject_title, subq1.COURSE_NUMBER,
    subq1.offered_summary_subject_title, subq1.DEPARTMENT_NAME, subq1.OFFER_DEPT_NAME,
    subq1.window_column, subq2.avg_total_units, subq2.stddev_total_units FROM subq1
    LEFT JOIN subq2 ON subq1.DEPARTMENT_NAME = subq2.DEPARTMENT_NAME ORDER BY subq1.DEPARTMENT_NAME,
    subq1.window_column;
  category: Enrollment and Subject Offering Comprehensive Analysis
  default_granularity: one row per 2012SU 1-unit subject (via SUBJECT_ID_SORT chain
    across offering tables) left joined with its department's total-units average
    and standard deviation
- id: dw_4527
  name: 2021 Engineering Degree-Granting Department Enrollment Dispersion with Above-Average
    Subject Details
  desc: For each department that is degree-granting and offered at least one subject
    in the School of Engineering in 2021, provide the department code, department
    name, department full name, the number of subjects offered, the total number of
    enrolled students in those subjects, the variance and standard deviation (using
    STDDEV only and never STDDEV_POP) of the number of enrolled students in subjects
    offered by that department (considering only subjects with a non-null subject
    code description), and, for each subject in 2021 offered by these departments
    in the School of Engineering, list the subject id, subject title, and the number
    of enrolled students, but only include subjects where the number of enrolled students
    exceeds the average enrollment for that department in 2021. Do not return any
    rounded answers.
  sql: WITH inner_cte AS ( WITH eng_dept_2021_summary AS ( SELECT d.DEPARTMENT_CODE,
    d.DEPARTMENT_NAME, d.DEPARTMENT_FULL_NAME, COUNT(s.SUBJECT_OFFERED_SUMMARY_KEY)
    AS subject_count, SUM(s.NUM_ENROLLED_STUDENTS) AS total_enrollment FROM SIS_DEPARTMENT
    d JOIN SUBJECT_OFFERED_SUMMARY s ON d.DEPARTMENT_CODE = s.OFFER_DEPT_CODE WHERE
    d.IS_DEGREE_GRANTING = 'Y' AND s.OFFER_SCHOOL_NAME = 'Engineering' AND s.TERM_CODE
    LIKE '2021%' GROUP BY d.DEPARTMENT_CODE, d.DEPARTMENT_NAME, d.DEPARTMENT_FULL_NAME
    ), dept_enrollment_stats AS ( SELECT d.DEPARTMENT_CODE, d.DEPARTMENT_NAME, VARIANCE(t.NUM_ENROLLED_STUDENTS)
    AS enrolled_students_variance, STDDEV(t.NUM_ENROLLED_STUDENTS) AS enrolled_students_stddev
    FROM TIP_SUBJECT_OFFERED t JOIN SIS_DEPARTMENT d ON t.OFFER_DEPT_CODE = d.DEPARTMENT_CODE
    JOIN SIS_SUBJECT_CODE s ON d.DEPARTMENT_CODE = s.DEPARTMENT_CODE WHERE d.IS_DEGREE_GRANTING
    = 'Y' AND s.SUBJECT_CODE_DESC IS NOT NULL GROUP BY d.DEPARTMENT_CODE, d.DEPARTMENT_NAME
    ) SELECT e.DEPARTMENT_CODE, e.DEPARTMENT_NAME, e.DEPARTMENT_FULL_NAME, e.subject_count,
    e.total_enrollment, d.enrolled_students_variance, d.enrolled_students_stddev FROM
    eng_dept_2021_summary e JOIN dept_enrollment_stats d ON e.DEPARTMENT_CODE = d.DEPARTMENT_CODE
    ), dept_avg_enrollment AS ( SELECT s.OFFER_DEPT_CODE, AVG(s.NUM_ENROLLED_STUDENTS)
    AS avg_enrollment FROM SUBJECT_OFFERED_SUMMARY s JOIN SIS_DEPARTMENT d ON s.OFFER_DEPT_CODE
    = d.DEPARTMENT_CODE WHERE d.IS_DEGREE_GRANTING = 'Y' AND s.OFFER_SCHOOL_NAME =
    'Engineering' AND s.TERM_CODE LIKE '2021%' GROUP BY s.OFFER_DEPT_CODE ) SELECT
    i.DEPARTMENT_CODE, i.DEPARTMENT_NAME, i.DEPARTMENT_FULL_NAME, i.subject_count,
    i.total_enrollment, i.enrolled_students_variance, i.enrolled_students_stddev,
    s.SUBJECT_ID, s.SUBJECT_TITLE, s.NUM_ENROLLED_STUDENTS FROM inner_cte i JOIN SUBJECT_OFFERED_SUMMARY
    s ON i.DEPARTMENT_CODE = s.OFFER_DEPT_CODE JOIN dept_avg_enrollment a ON s.OFFER_DEPT_CODE
    = a.OFFER_DEPT_CODE WHERE s.OFFER_SCHOOL_NAME = 'Engineering' AND s.TERM_CODE
    LIKE '2021%' AND s.NUM_ENROLLED_STUDENTS > a.avg_enrollment ORDER BY i.DEPARTMENT_CODE,
    s.NUM_ENROLLED_STUDENTS DESC;
  category: Enrollment and Subject Offering Comprehensive Analysis
  default_granularity: one row per 2021 Engineering subject with above-department-average
    enrollment within its degree-granting department summary
- id: dw_2528
  name: Stata Building Per-Floor Largest Room with Room-Level Square Footage and Floor
    Average
  desc: For each floor in the Stata building (building 32), what is the largest room
    square footage and the name of the building room with that largest square footage
    for rooms loaded into the warehouse on 19-DEC-24 with a largest room square footage
    greater than 100, and for each space unit on that floor with a room square footage
    greater than 10, what are the building room name, room number, room square footage,
    the average room square footage within the floor, and the floor's warehouse load
    date? List the results showing floor name, largest room name, largest room square
    footage, building room name, room number, room square footage, average room square
    footage per floor, and floor warehouse load date, ordered by floor name and room
    square footage. Do not return any rounded answers.
  sql: WITH inner_cte AS ( WITH largest_room_per_floor AS ( SELECT sf.FLOOR_NAME,
    sd.BUILDING_ROOM_NAME, sd.ROOM_SQUARE_FOOTAGE, sd.FLOOR_KEY FROM SPACE_DETAIL
    sd JOIN SPACE_FLOOR sf ON sd.FLOOR_KEY = sf.FLOOR_KEY WHERE sd.BUILDING_KEY =
    32 AND sd.WAREHOUSE_LOAD_DATE = '19-DEC-24' AND sd.ROOM_SQUARE_FOOTAGE > 100 AND
    sd.ROOM_SQUARE_FOOTAGE = ( SELECT MAX(sd2.ROOM_SQUARE_FOOTAGE) FROM SPACE_DETAIL
    sd2 WHERE sd2.BUILDING_KEY = 32 AND sd2.FLOOR_KEY = sd.FLOOR_KEY AND sd2.WAREHOUSE_LOAD_DATE
    = '19-DEC-24' ) ORDER BY sf.FLOOR_NAME ), room_and_avg_per_floor AS ( SELECT sd.BUILDING_ROOM_NAME,
    sd.ROOM_NUMBER, sd.ROOM_SQUARE_FOOTAGE, sf.FLOOR_NAME, AVG(sd2.ROOM_SQUARE_FOOTAGE)
    AS AVG_ROOM_SQUARE_FOOTAGE_PER_FLOOR, sd.FLOOR_KEY FROM SPACE_DETAIL sd JOIN SPACE_FLOOR
    sf ON sd.FLOOR_KEY = sf.FLOOR_KEY JOIN SPACE_DETAIL sd2 ON sd2.FLOOR_KEY = sd.FLOOR_KEY
    WHERE sd.BUILDING_KEY = 32 AND sd.ROOM_SQUARE_FOOTAGE > 10 GROUP BY sd.BUILDING_ROOM_NAME,
    sd.ROOM_NUMBER, sd.ROOM_SQUARE_FOOTAGE, sf.FLOOR_NAME, sd.FLOOR_KEY ORDER BY sd.ROOM_SQUARE_FOOTAGE
    ) SELECT lrf.FLOOR_NAME, lrf.BUILDING_ROOM_NAME AS LARGEST_ROOM_NAME, lrf.ROOM_SQUARE_FOOTAGE
    AS LARGEST_ROOM_SQUARE_FOOTAGE, raf.BUILDING_ROOM_NAME, raf.ROOM_NUMBER, raf.ROOM_SQUARE_FOOTAGE,
    raf.AVG_ROOM_SQUARE_FOOTAGE_PER_FLOOR, sf.WAREHOUSE_LOAD_DATE AS FLOOR_WAREHOUSE_LOAD_DATE
    FROM largest_room_per_floor lrf JOIN room_and_avg_per_floor raf ON lrf.FLOOR_NAME
    = raf.FLOOR_NAME JOIN SPACE_FLOOR sf ON lrf.FLOOR_NAME = sf.FLOOR_NAME ORDER BY
    lrf.FLOOR_NAME, raf.ROOM_SQUARE_FOOTAGE ) SELECT * FROM inner_cte;
  category: Facility Space Analysis
  default_granularity: one row per room (square footage > 10) matched to its floor's
    largest room (square footage > 100, loaded 19-DEC-24) in building 32
- id: dw_2616
  name: Large Rooms Above-Average Total Room Counter per Building Room with Floor
    Count and Space Usage
  desc: For each space unit with a room square footage greater than 100, what is the
    building room, building room name, space usage, the number of distinct floors
    it appears on, and the total room counter, but only include those where the total
    room counter is greater than the average room counter across all space units with
    room square footage greater than 100? Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT sd.BUILDING_ROOM, sd.BUILDING_ROOM_NAME, su.SPACE_USAGE,
    COUNT(DISTINCT sd.FLOOR_KEY) AS floor_count, SUM(sd.ROOM_COUNTER) AS total_room_counter
    FROM SPACE_DETAIL sd JOIN SPACE_USAGE su ON sd.SPACE_USAGE_KEY = su.SPACE_USAGE_KEY
    WHERE sd.ROOM_SQUARE_FOOTAGE > 100 GROUP BY sd.BUILDING_ROOM, sd.BUILDING_ROOM_NAME,
    su.SPACE_USAGE ) SELECT BUILDING_ROOM, BUILDING_ROOM_NAME, SPACE_USAGE, floor_count,
    total_room_counter FROM inner_cte WHERE total_room_counter > ( SELECT AVG(total_room_counter)
    FROM ( SELECT SUM(sd.ROOM_COUNTER) AS total_room_counter FROM SPACE_DETAIL sd
    WHERE sd.ROOM_SQUARE_FOOTAGE > 100 GROUP BY sd.BUILDING_ROOM, sd.BUILDING_ROOM_NAME,
    sd.SPACE_USAGE_KEY ) sub )
  category: Facility Space Analysis
  default_granularity: one row per building room and space usage with room square
    footage > 100 and above-average total room counter
- id: dw_2780
  name: Room 21E Windowed Minimum Square Footage with Dual Warehouse Load Dates
  desc: For rooms with a room number of '21E', show the building room, room square
    footage, building component, space usage, and the minimum room square footage
    in a window of 3 preceding and 1 following row ordered by building key. Also,
    include the warehouse load date from both the SPACE_DETAIL and SPACE_USAGE tables.
    Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT t0.BUILDING_ROOM, t0.ROOM_SQUARE_FOOTAGE, t0.BUILDING_COMPONENT,
    t1.SPACE_USAGE, MIN(t0.ROOM_SQUARE_FOOTAGE) OVER (ORDER BY t0.BUILDING_KEY ROWS
    BETWEEN 3 PRECEDING AND 1 FOLLOWING) AS window_column, t0.WAREHOUSE_LOAD_DATE
    AS space_detail_load_date, t1.WAREHOUSE_LOAD_DATE AS space_usage_load_date FROM
    SPACE_DETAIL t0 JOIN SPACE_USAGE t1 ON t0.SPACE_USAGE_KEY = t1.SPACE_USAGE_KEY
    WHERE t0.ROOM_NUMBER = '21E' ) SELECT * FROM inner_cte;
  category: Facility Space Analysis
  default_granularity: one row per room with room number '21E'
- id: dw_4162
  name: Room 21E Windowed Min Square Footage Matched with Access-Level-1 Rooms of
    the Same Space Unit Code
  desc: For rooms with a room number of '21E' and for rooms with an access level of
    1 in the same space unit code, show the building room, room square footage, building
    component, space usage, the minimum room square footage in a window of 3 preceding
    and 1 following row ordered by building key, the warehouse load date from both
    the SPACE_DETAIL and SPACE_USAGE tables, the floor, space unit code, space unit
    name, the average floor within each space unit code group, and the total number
    of rooms per space unit code. List the results ordered by building room and floor.
    Do not return any rounded answers.
  sql: WITH Room21E AS ( SELECT t0.BUILDING_ROOM, t0.ROOM_SQUARE_FOOTAGE, t0.BUILDING_COMPONENT,
    t1.SPACE_USAGE, MIN(t0.ROOM_SQUARE_FOOTAGE) OVER (ORDER BY t0.BUILDING_KEY ROWS
    BETWEEN 3 PRECEDING AND 1 FOLLOWING) AS window_column, t0.WAREHOUSE_LOAD_DATE
    AS space_detail_load_date, t1.WAREHOUSE_LOAD_DATE AS space_usage_load_date, t0.SPACE_UNIT_KEY
    FROM SPACE_DETAIL t0 JOIN SPACE_USAGE t1 ON t0.SPACE_USAGE_KEY = t1.SPACE_USAGE_KEY
    WHERE t0.ROOM_NUMBER = '21E' ), AccessLevel1Rooms AS ( SELECT t1.BUILDING_ROOM,
    t1.FLOOR, t1.SPACE_USAGE, t1.SPACE_UNIT_CODE, t0.SPACE_UNIT, AVG(t1.FLOOR) OVER
    (PARTITION BY t1.SPACE_UNIT_CODE ORDER BY t1.FLOOR) AS avg_floor FROM SPACE_UNIT
    t0 JOIN ZPM_ROOMS_LOAD t1 ON t0.SPACE_UNIT_CODE = t1.SPACE_UNIT_CODE WHERE t1.ACCESS_LEVEL
    = 1 ), RoomCounts AS ( SELECT t1.SPACE_UNIT_CODE, COUNT(*) AS Total_Rooms FROM
    ZPM_ROOMS_LOAD t1 WHERE t1.ACCESS_LEVEL = 1 GROUP BY t1.SPACE_UNIT_CODE ) SELECT
    r21.BUILDING_ROOM, r21.ROOM_SQUARE_FOOTAGE, r21.BUILDING_COMPONENT, r21.SPACE_USAGE,
    r21.window_column, r21.space_detail_load_date, r21.space_usage_load_date, al1.FLOOR,
    al1.SPACE_UNIT_CODE, al1.SPACE_UNIT, al1.avg_floor, rc.Total_Rooms FROM Room21E
    r21 JOIN SPACE_UNIT su ON r21.SPACE_UNIT_KEY = su.SPACE_UNIT_KEY JOIN AccessLevel1Rooms
    al1 ON su.SPACE_UNIT_CODE = al1.SPACE_UNIT_CODE JOIN RoomCounts rc ON al1.SPACE_UNIT_CODE
    = rc.SPACE_UNIT_CODE ORDER BY r21.BUILDING_ROOM, al1.FLOOR;
  category: Facility Space Analysis
  default_granularity: one row per room 21E matched with each access-level-1 room
    of the same space unit code
- id: dw_2896
  name: Two-Supervisee Supervisor Records with 5-Row Windowed Average Square Footage
    Above 200 per Facility Organization
  desc: For each facility organization, show the research volume, department names,
    square footage, MIT ID, and the average square footage in a window of 2 preceding
    and 2 following rows (grouped by facility organization key and ordered by research
    volume) for space supervisor usage records where the number of supervisees is
    2, and only include those records where the average square footage in the window
    is greater than 200. Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT t0.RESEARCH_VOLUME, t0.DEPT_NAMES, t0.SQFT, t0.MIT_ID,
    AVG(t0.SQFT) OVER ( PARTITION BY t1.FCLT_ORGANIZATION_KEY ORDER BY t0.RESEARCH_VOLUME
    ROWS BETWEEN 2 PRECEDING AND 2 FOLLOWING ) AS window_column FROM SPACE_SUPERVISOR_USAGE
    t0 JOIN SPACE_UNIT t1 ON t0.DEPT_NAMES = t1.DLC_KEY WHERE t0.NUM_OF_SUPERVISEES
    = 2 ) SELECT RESEARCH_VOLUME, DEPT_NAMES, SQFT, MIT_ID, window_column FROM inner_cte
    WHERE window_column > 200;
  category: Facility Space Analysis
  default_granularity: one row per supervisor usage record with 2 supervisees whose
    5-row windowed average square footage (per facility organization, ordered by research
    volume) exceeds 200
- id: dw_4640
  name: 2017JA Subject Enrollment Windows with Department Enrollment Coefficient of
    Variation and School Code
  desc: For each subject offered in the term '2017JA', what is the subject title,
    the number of enrolled students, the responsible faculty name, the offering department
    name, the department full name, the school name, the minimum number of enrolled
    students in a window of 3 preceding and 1 following row ordered by the department
    code, the coefficient of variation (using STDDEV only and never STDDEV_POP) of
    the number of enrolled students in the subjects offered by that department (considering
    only subjects with at least one enrolled student), and the department's school
    code? Do not return any rounded answers.
  sql: WITH inner_cte AS ( WITH DeptVariation AS ( SELECT sd.DEPARTMENT_NAME, STDDEV(tso.NUM_ENROLLED_STUDENTS)
    / NULLIF(AVG(tso.NUM_ENROLLED_STUDENTS), 0) AS coefficient_of_variation FROM TIP_SUBJECT_OFFERED
    tso JOIN STUDENT_DEPARTMENT sd ON tso.OFFER_DEPT_CODE = sd.DEPARTMENT_CODE WHERE
    tso.NUM_ENROLLED_STUDENTS > 0 GROUP BY sd.DEPARTMENT_NAME HAVING AVG(tso.NUM_ENROLLED_STUDENTS)
    > 0 ORDER BY coefficient_of_variation DESC ), Subjects2017JA AS ( SELECT t0.SUBJECT_TITLE,
    t0.NUM_ENROLLED_STUDENTS, t0.RESPONSIBLE_FACULTY_NAME, t0.OFFER_DEPT_NAME, t1.DEPARTMENT_FULL_NAME,
    t1.SCHOOL_NAME, t1.DEPARTMENT_NAME, t1.DEPARTMENT_CODE, MIN(t0.NUM_ENROLLED_STUDENTS)
    OVER ( ORDER BY t1.DEPARTMENT_CODE ROWS BETWEEN 3 PRECEDING AND 1 FOLLOWING )
    AS window_column FROM TIP_SUBJECT_OFFERED t0 JOIN STUDENT_DEPARTMENT t1 ON t0.OFFER_DEPT_CODE
    = t1.DEPARTMENT_CODE WHERE t0.TERM_CODE = '2017JA' ) SELECT s.SUBJECT_TITLE, s.NUM_ENROLLED_STUDENTS,
    s.RESPONSIBLE_FACULTY_NAME, s.OFFER_DEPT_NAME, s.DEPARTMENT_FULL_NAME, s.SCHOOL_NAME,
    s.window_column, dv.coefficient_of_variation, sd.SCHOOL_CODE FROM Subjects2017JA
    s LEFT JOIN DeptVariation dv ON s.DEPARTMENT_NAME = dv.DEPARTMENT_NAME JOIN STUDENT_DEPARTMENT
    sd ON s.DEPARTMENT_CODE = sd.DEPARTMENT_CODE ) SELECT * FROM inner_cte;
  category: Enrollment and Subject Offering Comprehensive Analysis
  default_granularity: one row per 2017JA TIP subject offering enriched with department-level
    enrollment coefficient of variation and school code
- id: dw_2771
  name: Count of 2011FA Subjects with 10+ Enrolled Students Having TIP Subjects with
    5+ Enrolled
  desc: For subjects offered in 2011 with more than 10 enrolled students, how many
    had a corresponding TIP subject with more than 5 enrolled students? Do not return
    any rounded answers.
  sql: WITH inner_cte AS ( SELECT COUNT(*) AS num_subjects FROM SUBJECT_OFFERED so
    JOIN TIP_SUBJECT_OFFERED tso ON so.SUBJECT_ID_SORT = tso.SUBJECT_ID_SORT WHERE
    so.TERM_CODE = '2011FA' AND tso.NUM_ENROLLED_STUDENTS > 5 ) SELECT COUNT(*) AS
    num_subjects_with_more_than_10_enrolled FROM SUBJECT_OFFERED so JOIN TIP_SUBJECT_OFFERED
    tso ON so.SUBJECT_ID_SORT = tso.SUBJECT_ID_SORT WHERE so.TERM_CODE = '2011FA'
    AND so.NUM_ENROLLED_STUDENTS > 10 AND tso.NUM_ENROLLED_STUDENTS > 5;
  category: Enrollment Analysis
  default_granularity: single count row
  category_note: The inner_cte CTE is computed but not referenced by the final SELECT;
    retained verbatim per the source SQL.
- id: dw_3078
  name: 3+ Unit Subject Section Counts, Min Enrollment, and Average Lab Units by Title
    and Department
  desc: For each subject title and department name where the total units are greater
    than 3, give the number of offered sections, the minimum number of enrolled students,
    and the average lab units for those subjects. Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT sos.SUBJECT_TITLE, ss.DEPARTMENT_NAME, COUNT(so.SUBJECT_KEY)
    AS section_count, MIN(so.NUM_ENROLLED_STUDENTS) AS min_enrolled FROM SUBJECT_OFFERED_SUMMARY
    sos JOIN SUBJECT_OFFERED so ON sos.SUBJECT_ID = so.SUBJECT_ID JOIN SUBJECT_SUMMARY
    ss ON so.SUBJECT_ID = ss.SUBJECT_ID WHERE sos.TOTAL_UNITS > 3 GROUP BY sos.SUBJECT_TITLE,
    ss.DEPARTMENT_NAME ) SELECT inner_cte.SUBJECT_TITLE, inner_cte.DEPARTMENT_NAME,
    inner_cte.section_count, inner_cte.min_enrolled, AVG(ss.LAB_UNITS) AS avg_lab_units
    FROM inner_cte JOIN SUBJECT_SUMMARY ss ON inner_cte.SUBJECT_TITLE = ss.SUBJECT_TITLE
    AND inner_cte.DEPARTMENT_NAME = ss.DEPARTMENT_NAME GROUP BY inner_cte.SUBJECT_TITLE,
    inner_cte.DEPARTMENT_NAME, inner_cte.section_count, inner_cte.min_enrolled;
  category: Subject Offering and Enrollment Comprehensive Analysis
  default_granularity: one row per subject title per department name
- category: Subject Offering Analysis
  default_granularity: one row per 2012SU 1-unit subject matched with its cluster-S
    offering row
  desc: For subjects offered in the 2012SU term that have a total of 1 unit and also
    have a cluster type of 'S', show the subject title from the summary, the course
    number from the offered table, the subject title from the offered summary, the
    department name from the summary, the offer department name from the offered summary,
    the row number within each department name group ordered by subject title from
    the summary, the subject title from SUBJECT_OFFERED, the offer department name
    from SUBJECT_OFFERED, the total units from SUBJECT_SUMMARY, and the row number
    within a window of 2 preceding and 1 following rows ordered by the subject title
    from SUBJECT_OFFERED. Do not return any rounded answers.
  id: dw_3482
  name: 2012SU 1-Unit Cluster-S Subjects Department Row Numbers with Windowed Subject
    Title Row Numbers
  sql: WITH Subq1 AS ( SELECT t2.SUBJECT_TITLE AS summary_subject_title, t1.COURSE_NUMBER,
    t0.SUBJECT_TITLE AS offered_summary_subject_title, t2.DEPARTMENT_NAME, t0.OFFER_DEPT_NAME,
    ROW_NUMBER() OVER (PARTITION BY t2.DEPARTMENT_NAME ORDER BY t2.SUBJECT_TITLE)
    AS window_column, t1.SUBJECT_ID FROM SUBJECT_OFFERED_SUMMARY t0 JOIN SUBJECT_OFFERED
    t1 ON t0.SUBJECT_ID_SORT = t1.SUBJECT_ID_SORT JOIN SUBJECT_SUMMARY t2 ON t1.SUBJECT_ID_SORT
    = t2.SUBJECT_ID_SORT WHERE t1.TERM_CODE = '2012SU' AND t2.TOTAL_UNITS = 1 ), Subq2
    AS ( SELECT t0.SUBJECT_TITLE, t0.OFFER_DEPT_NAME, t1.TOTAL_UNITS, ROW_NUMBER()
    OVER (ORDER BY t0.SUBJECT_TITLE ROWS BETWEEN 2 PRECEDING AND 1 FOLLOWING) AS window_column,
    t0.SUBJECT_ID FROM SUBJECT_OFFERED t0 JOIN SUBJECT_SUMMARY t1 ON t0.SUBJECT_ID
    = t1.SUBJECT_ID WHERE t0.TERM_CODE = '2012SU' AND t1.CLUSTER_TYPE = 'S' ) SELECT
    s1.summary_subject_title, s1.COURSE_NUMBER, s1.offered_summary_subject_title,
    s1.DEPARTMENT_NAME, s1.OFFER_DEPT_NAME, s1.window_column AS summary_window_column,
    s2.SUBJECT_TITLE AS offered_subject_title, s2.OFFER_DEPT_NAME AS offered_offer_dept_name,
    s2.TOTAL_UNITS AS offered_total_units, s2.window_column AS offered_window_column
    FROM Subq1 s1 JOIN Subq2 s2 ON s1.SUBJECT_ID = s2.SUBJECT_ID
- category: Enrollment Analysis
  default_granularity: single count row
  desc: How many subjects offered by the Harvard Cross-Enrollment Program in 2012
    had more than 5 enrolled students and were offered by the Chemistry department?
    Do not return any rounded answers.
  id: dw_5364
  name: Count of 2012 Cross-Enrollment and Chemistry TIP Subjects with 5+ Enrolled
    Students
  sql: SELECT COUNT(*) AS harvard_cross_enrollment_2012_subjects FROM TIP_SUBJECT_OFFERED
    tso JOIN SUBJECT_OFFERED so ON tso.MASTER_SUBJECT_ID_SORT = so.MASTER_SUBJECT_ID_SORT
    JOIN SUBJECT_SUMMARY ss ON so.MASTER_SUBJECT_ID_SORT = ss.MASTER_SUBJECT_ID_SORT
    WHERE tso.OFFER_DEPT_NAME = 'Harvard Cross-Enrollment Prog' AND tso.TERM_CODE
    = '2012' AND tso.NUM_ENROLLED_STUDENTS > 5 AND tso.OFFER_DEPT_NAME = 'Chemistry';
  category_note: The two OFFER_DEPT_NAME equality filters on the same TIP_SUBJECT_OFFERED
    column are mutually exclusive, so this count is structurally zero; retained verbatim
    per the source SQL. TERM_CODE = '2012' does not follow the YYYYTT term-code format,
    so it matches no term rows; also retained verbatim.
- category: Subject Offering Analysis
  default_granularity: single count row
  desc: How many subjects offered in 2012 as part of the Harvard Cross-Enrollment
    Program, in either the Chemistry or Biology departments, had a total of more than
    1 unit? Do not return any rounded answers.
  id: dw_5377
  name: Count of 2012 Cross-Enrollment Chemistry-or-Biology Subjects with More Than
    1 Unit
  sql: SELECT COUNT(*) AS harvard_cross_enrollment_2012_subjects FROM SUBJECT_OFFERED
    JOIN SUBJECT_SUMMARY ON SUBJECT_OFFERED.SUBJECT_SUMMARY_KEY = SUBJECT_SUMMARY.SUBJECT_SUMMARY_KEY
    WHERE SUBJECT_OFFERED.TERM_CODE LIKE '2012%' AND SUBJECT_OFFERED.OFFER_DEPT_NAME
    = 'Harvard Cross-Enrollment Prog' AND SUBJECT_SUMMARY.TOTAL_UNITS > 1 AND SUBJECT_OFFERED.OFFER_DEPT_NAME
    IN ('Chemistry', 'Biology');
  category_note: The OFFER_DEPT_NAME equality filter ('Harvard Cross-Enrollment Prog')
    and the IN ('Chemistry','Biology') filter on the same column are mutually exclusive,
    so this count is structurally zero; retained verbatim per the source SQL.
- category: Enrollment Analysis
  default_granularity: single count row
  desc: How many subjects offered in 2012 had more than 5 enrolled students, belonged
    to the Harvard Cross-Enrollment Program department, and were either in the Chemistry
    or Biology department? Do not return any rounded answers.
  id: dw_5421
  name: Count of 2012SU Cross-Enrollment Chemistry-or-Biology TIP Subjects with 5+
    Enrolled Students
  sql: SELECT COUNT(*) AS num_subjects FROM TIP_SUBJECT_OFFERED tso JOIN SUBJECT_OFFERED
    so ON tso.MASTER_SUBJECT_ID = so.MASTER_SUBJECT_ID JOIN SUBJECT_SUMMARY ss ON
    so.MASTER_SUBJECT_ID = ss.MASTER_SUBJECT_ID WHERE tso.TERM_CODE = '2012SU' AND
    tso.NUM_ENROLLED_STUDENTS > 5 AND tso.OFFER_DEPT_NAME = 'Harvard Cross-Enrollment
    Prog' AND tso.OFFER_DEPT_NAME IN ('Chemistry', 'Biology');
  category_note: The OFFER_DEPT_NAME equality filter ('Harvard Cross-Enrollment Prog')
    and the IN ('Chemistry','Biology') filter on the same TIP_SUBJECT_OFFERED column
    are mutually exclusive, so this count is structurally zero; retained verbatim
    per the source SQL.
- category: Subject Offering Analysis
  default_granularity: single count row
  desc: How many subjects offered in the same term as a TIP subject had "Harvard Cross-Enrollment
    Prog" as the offering department, were not for graduate credit, and were also
    offered by the Chemistry department? Do not return any rounded answers.
  id: dw_5545
  name: Count of Non-Graduate-Credit Cross-Enrollment and Chemistry Subjects in TIP
    Terms
  sql: SELECT COUNT(*) AS harvard_non_grad_subjects FROM SUBJECT_OFFERED JOIN TIP_SUBJECT_OFFERED
    ON SUBJECT_OFFERED.TERM_CODE = TIP_SUBJECT_OFFERED.TERM_CODE WHERE SUBJECT_OFFERED.OFFER_DEPT_NAME
    = 'Harvard Cross-Enrollment Prog' AND SUBJECT_OFFERED.HGN_CODE_DESC = 'Not for
    graduate credit' AND SUBJECT_OFFERED.OFFER_DEPT_NAME = 'Chemistry';
  category_note: The two OFFER_DEPT_NAME equality filters on the same SUBJECT_OFFERED
    column are mutually exclusive, so this count is structurally zero; retained verbatim
    per the source SQL. The TERM_CODE-only join to TIP_SUBJECT_OFFERED fans out section
    rows across all TIP subjects of the same term.
- id: dw_2735
  name: Fiscal Year Min Calendar Month and Calendar Year Sum for 2020FA Term Months
  desc: For each fiscal year, what is the minimum calendar month and the sum of calendar
    years from TIME_MONTH for months that have at least one corresponding day in TIME_DAY
    with the academic term code '2020FA'? Show only fiscal years where such months
    exist. Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT MIN(tm.CALENDAR_MONTH) AS min_calendar_month, SUM(tm.CALENDAR_YEAR)
    AS total_calendar_years, tm.FISCAL_YEAR FROM TIME_MONTH tm JOIN TIME_DAY td ON
    tm.FISCAL_PERIOD = td.FISCAL_PERIOD WHERE td.ACADEMIC_TERM_CODE = '2020FA' GROUP
    BY tm.FISCAL_YEAR ) SELECT inner_cte.FISCAL_YEAR, inner_cte.min_calendar_month,
    inner_cte.total_calendar_years FROM inner_cte ORDER BY inner_cte.FISCAL_YEAR;
  category: Fiscal Calendar Analysis
  default_granularity: one row per fiscal year containing months of the 2020FA academic
    term
- id: dw_3131
  name: Fiscal Period Calendar Year Variance with High/Low/Average Classification
  desc: For each fiscal period, what is the fiscal period description, the variance
    of the calendar year for all days in that period where the academic year is not
    null, and whether the variance is 'HIGH_VARIANCE' (at least 20% greater than the
    average variance across all periods), 'LOW_VARIANCE' (at least 20% less than the
    average), or 'AVERAGE'? Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT TIME_MONTH.FISCAL_PERIOD, TIME_MONTH.FISCAL_PERIOD_DESCRIPTION,
    VARIANCE(TIME_DAY.CALENDAR_YEAR) AS calendar_year_variance FROM TIME_MONTH JOIN
    TIME_DAY ON TIME_MONTH.FISCAL_PERIOD = TIME_DAY.FISCAL_PERIOD WHERE TIME_DAY.ACADEMIC_YEAR
    IS NOT NULL GROUP BY TIME_MONTH.FISCAL_PERIOD, TIME_MONTH.FISCAL_PERIOD_DESCRIPTION
    ) SELECT inner_cte.FISCAL_PERIOD, inner_cte.FISCAL_PERIOD_DESCRIPTION, inner_cte.calendar_year_variance,
    CASE WHEN inner_cte.calendar_year_variance > avg_stats.avg_variance * 1.2 THEN
    'HIGH_VARIANCE' WHEN inner_cte.calendar_year_variance < avg_stats.avg_variance
    * 0.8 THEN 'LOW_VARIANCE' ELSE 'AVERAGE' END AS variance_category FROM inner_cte
    CROSS JOIN ( SELECT AVG(calendar_year_variance) AS avg_variance FROM inner_cte
    ) avg_stats ORDER BY inner_cte.calendar_year_variance DESC;
  category: Fiscal Calendar Analysis
  default_granularity: one row per fiscal period with days having a non-null academic
    year
- id: dw_2614
  name: Fiscal Quarter and Month Attributes with Calendar Month Window Average Comparison
  desc: For fiscal quarters in the year 2026, show the fiscal year, fiscal quarter
    code, quarter start date, calendar year, calendar period description, calendar
    month name, the average calendar month (as a number) in a window of 2 preceding
    and 2 following rows grouped by the fiscal period, and indicate whether the current
    calendar month is above, below, or at the window average. Order by the fiscal
    year. Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT t0.FISCAL_YEAR, t0.FY_QUARTER_CODE, t0.QUARTER_START_DATE,
    t0.CALENDAR_YEAR, t1.CALENDAR_PERIOD_DESCRIPTION, t1.CALENDAR_MONTH_NAME, t1.CALENDAR_MONTH,
    AVG(t1.CALENDAR_MONTH) OVER ( PARTITION BY t1.FISCAL_PERIOD ORDER BY t0.FISCAL_YEAR
    ROWS BETWEEN 2 PRECEDING AND 2 FOLLOWING ) AS window_avg FROM TIME_QUARTER t0
    JOIN TIME_MONTH t1 ON t0.FISCAL_YEAR = t1.FISCAL_YEAR WHERE t0.FISCAL_YEAR = 2026
    ) SELECT inner_cte.FISCAL_YEAR, inner_cte.FY_QUARTER_CODE, inner_cte.QUARTER_START_DATE,
    inner_cte.CALENDAR_YEAR, inner_cte.CALENDAR_PERIOD_DESCRIPTION, inner_cte.CALENDAR_MONTH_NAME,
    inner_cte.window_avg, CASE WHEN inner_cte.CALENDAR_MONTH > inner_cte.window_avg
    THEN 'ABOVE_AVERAGE' WHEN inner_cte.CALENDAR_MONTH < inner_cte.window_avg THEN
    'BELOW_AVERAGE' ELSE 'AT_AVERAGE' END AS month_vs_window FROM inner_cte ORDER
    BY inner_cte.FISCAL_YEAR;
  category: Fiscal Calendar Analysis
  default_granularity: one row per fiscal quarter and fiscal month combination within
    the filtered fiscal year
- id: dw_2913
  name: Material Info Source Record Totals and Average New Shelf Price with High/Low
    Records Classification
  desc: For each material information source, provide the material information source,
    the total number of records for materials published after 2010 and with a new
    shelf price greater than 10, the average new shelf price for those materials as
    a benchmark, and categorize the total records as 'HIGH_RECORDS' if at least 20%
    greater than the benchmark record count across all sources, 'LOW_RECORDS' if at
    least 20% less, or 'AVERAGE' otherwise. Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT m.MATERIAL_INFO_SOURCE, SUM(d.RECORD_COUNT) AS total_records
    FROM TIP_DETAIL d JOIN TIP_MATERIAL m ON d.TIP_MATERIAL_KEY = m.TIP_MATERIAL_KEY
    WHERE m.YEAR > 2010 AND m.NEW_SHELF_PRICE > 10 GROUP BY m.MATERIAL_INFO_SOURCE
    HAVING SUM(d.RECORD_COUNT) > 0 ), benchmark_cte AS ( SELECT m.MATERIAL_INFO_SOURCE,
    AVG(m.NEW_SHELF_PRICE) AS avg_new_shelf_price FROM TIP_DETAIL d JOIN TIP_MATERIAL
    m ON d.TIP_MATERIAL_KEY = m.TIP_MATERIAL_KEY WHERE m.YEAR > 2010 AND m.NEW_SHELF_PRICE
    > 10 GROUP BY m.MATERIAL_INFO_SOURCE ), overall_benchmark AS ( SELECT AVG(total_records)
    AS avg_total_records FROM inner_cte ) SELECT i.MATERIAL_INFO_SOURCE, i.total_records,
    b.avg_new_shelf_price, CASE WHEN i.total_records > ob.avg_total_records * 1.2
    THEN 'HIGH_RECORDS' WHEN i.total_records < ob.avg_total_records * 0.8 THEN 'LOW_RECORDS'
    ELSE 'AVERAGE' END AS records_category FROM inner_cte i JOIN benchmark_cte b ON
    i.MATERIAL_INFO_SOURCE = b.MATERIAL_INFO_SOURCE CROSS JOIN overall_benchmark ob;
  category: Textbook Material Analysis
  default_granularity: one row per material information source
- id: dw_2989
  name: Material Status and Publisher Material Counts with Used Price Benchmark Classification
  desc: For each material status and publisher where the new shelf price is greater
    than 50, provide the number of materials and the minimum used shelf price, and
    also show the average new shelf price for that publisher and status as a benchmark,
    along with a category indicating if the minimum used shelf price is at least 10%
    less than the average new shelf price ('LOW_USED_PRICE'), at least 10% more ('HIGH_USED_PRICE'),
    or otherwise 'AVERAGE_USED_PRICE'. Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT d.TIP_MATERIAL_STATUS_KEY, m.PUBLISHER, COUNT(m.TIP_MATERIAL_KEY)
    AS material_count, MIN(m.USED_SHELF_PRICE) AS min_used_price FROM TIP_DETAIL d
    JOIN TIP_MATERIAL m ON d.TIP_MATERIAL_KEY = m.TIP_MATERIAL_KEY WHERE m.NEW_SHELF_PRICE
    > 50 GROUP BY d.TIP_MATERIAL_STATUS_KEY, m.PUBLISHER ) SELECT i.TIP_MATERIAL_STATUS_KEY,
    i.PUBLISHER, i.material_count, i.min_used_price, s.avg_new_shelf_price AS benchmark_new_shelf_price,
    CASE WHEN i.min_used_price < s.avg_new_shelf_price * 0.9 THEN 'LOW_USED_PRICE'
    WHEN i.min_used_price > s.avg_new_shelf_price * 1.1 THEN 'HIGH_USED_PRICE' ELSE
    'AVERAGE_USED_PRICE' END AS used_price_category FROM inner_cte i JOIN ( SELECT
    d.TIP_MATERIAL_STATUS_KEY, m.PUBLISHER, AVG(m.NEW_SHELF_PRICE) AS avg_new_shelf_price
    FROM TIP_DETAIL d JOIN TIP_MATERIAL m ON d.TIP_MATERIAL_KEY = m.TIP_MATERIAL_KEY
    WHERE m.NEW_SHELF_PRICE > 50 GROUP BY d.TIP_MATERIAL_STATUS_KEY, m.PUBLISHER )
    s ON i.TIP_MATERIAL_STATUS_KEY = s.TIP_MATERIAL_STATUS_KEY AND i.PUBLISHER = s.PUBLISHER;
  category: Textbook Material Analysis
  default_granularity: one row per TIP material status key per publisher
concepts:
- id: concept_academic_term_dimension
  name: Academic Term Dimension
  desc: 'Tables describing academic terms and their calendar/status attributes. They
    jointly answer questions about when terms run, which academic/financial-aid/degree
    year a term belongs to, and whether a term is current, previous, future, or regular.
    Coverage differs: the full historical term list, the status-tracked term subset,
    and the three-row relative term parameter reference.'
  tables:
  - ACADEMIC_TERMS
  - ACADEMIC_TERMS_ALL
  - ACADEMIC_TERM_PARAMETER
  comparisons:
  - dimension: Row coverage
    ACADEMIC_TERMS: Terms with full status tracking (subset of all terms)
    ACADEMIC_TERMS_ALL: All terms known to the warehouse (superset of ACADEMIC_TERMS)
    ACADEMIC_TERM_PARAMETER: 'Exactly 3 rows: current, previous, and upcoming term'
  - dimension: Unique columns
    ACADEMIC_TERMS: IS_REGULAR_TERM, TERM_STATUS ('Previous'/'Current'/'Future'/'Unspecified'),
      ADD_DATE, DROP_DATE
    ACADEMIC_TERMS_ALL: No IS_REGULAR_TERM/TERM_STATUS/ADD_DATE/DROP_DATE; shares
      TERM_STATUS_INDICATOR, FINANCIAL_AID_YEAR, DEGREE_YEAR
    ACADEMIC_TERM_PARAMETER: TERM_PARAMETER name (SIS_CURRENT_TERM/SIS_PREVIOUS_TERM/SIS_UPCOMING_TERM),
      TERM_INDICATOR ('C'/'P'/'F'), TERM_LAST_DAY_BEFORE_NEXT_TERM
  - dimension: Typical role in queries
    ACADEMIC_TERMS: Filtering by regular-term flag or term status; term start/end
      dates and registration milestones
    ACADEMIC_TERMS_ALL: Source of academic year, academic year description, financial
      aid year, degree year for windowed/running-sum statistics
    ACADEMIC_TERM_PARAMETER: Resolving relative term references ('current term', 'previous
      term', term indicator 'C'/'P') to concrete term codes
  - dimension: Join keys
    ACADEMIC_TERMS: TERM_CODE, ACADEMIC_TERMS_KEY
    ACADEMIC_TERMS_ALL: TERM_CODE, ACADEMIC_TERMS_KEY
    ACADEMIC_TERM_PARAMETER: TERM_CODE
  decision_guide:
    Questions needing IS_REGULAR_TERM or TERM_STATUS ('Previous'/'Current'/'Future') filtering: Use
      ACADEMIC_TERMS; these columns exist only there.
    ? Questions needing academic year, financial aid year, or degree year attributes
      over the widest term coverage, or joining fact tables whose terms may not be
      status-tracked
    : Use ACADEMIC_TERMS_ALL, optionally joined to ACADEMIC_TERMS on TERM_CODE when
      regular-term/status flags are also needed.
    Questions referring to 'the current term', 'the previous term', 'the upcoming term', or term indicator 'C'/'P'/'F': Use
      ACADEMIC_TERM_PARAMETER to resolve the relative reference to a TERM_CODE, then
      join ACADEMIC_TERMS for full attributes.
    Questions needing registration milestones (add date, drop date, first day of classes, last day of final exam): Use
      ACADEMIC_TERMS (ADD_DATE/DROP_DATE only exist there; other milestone dates exist
      in both ACADEMIC_TERMS and ACADEMIC_TERMS_ALL).
- id: concept_subject_offering_facts
  name: Subject Offering Fact Tables
  desc: 'Fact tables recording subjects offered per term from different business processes:
    the course catalog (planned catalog attributes), the registrar''s section/subject
    offering records (actual sections and enrollment), subject-level summaries (final
    enrollment statistics), the textbook information program (subjects tracked for
    course materials), and library reserve processing (subjects with library reserve
    activity). They share subject identity (SUBJECT_ID, TERM_CODE) and department
    attribution but differ in granularity, enrollment semantics, and available measures.'
  tables:
  - COURSE_CATALOG_SUBJECT_OFFERED
  - SUBJECT_OFFERED
  - SUBJECT_OFFERED_SUMMARY
  - SUBJECT_SUMMARY
  - TIP_SUBJECT_OFFERED
  - LIBRARY_SUBJECT_OFFERED
  comparisons:
  - dimension: Granularity
    COURSE_CATALOG_SUBJECT_OFFERED: Subject offering per term/academic year (catalog
      record, includes section flags)
    SUBJECT_OFFERED: Subject section per term (finest grain, SECTION_ID)
    SUBJECT_OFFERED_SUMMARY: Subject per term (rollup of sections)
    SUBJECT_SUMMARY: Subject or cluster per term
    TIP_SUBJECT_OFFERED: Subject per term within textbook program scope
    LIBRARY_SUBJECT_OFFERED: Subject per term within library reserve scope
  - dimension: Enrollment measures
    COURSE_CATALOG_SUBJECT_OFFERED: None (catalog attributes only)
    SUBJECT_OFFERED: NUM_ENROLLED_STUDENTS, SUBJECT_ENROLLMENT_NUMBER, SECTION_ENROLLMENT_NUMBER,
      CLUSTER_ENROLLMENT_NUMBER
    SUBJECT_OFFERED_SUMMARY: NUM_ENROLLED_STUDENTS, SUBJECT_ENROLLMENT_NUMBER, CLUSTER_ENROLLMENT_NUMBER
    SUBJECT_SUMMARY: SUBJECT_ENROLLMENT_NUMBER plus first-week/fifth-week and credit/listener
      enrollment splits
    TIP_SUBJECT_OFFERED: NUM_ENROLLED_STUDENTS
    LIBRARY_SUBJECT_OFFERED: NUM_ENROLLED_STUDENTS
  - dimension: Unit measures
    COURSE_CATALOG_SUBJECT_OFFERED: LECTURE_UNITS, LAB_UNITS, PREPARATION_UNITS, DESIGN_UNITS,
      TOTAL_UNITS, IS_VARIABLE_UNITS
    SUBJECT_OFFERED: None
    SUBJECT_OFFERED_SUMMARY: TOTAL_UNITS, LECTURE_UNITS, LAB_UNITS, PREPARATION_UNITS
    SUBJECT_SUMMARY: TOTAL_UNITS, LECTURE_UNITS, LAB_UNITS, PREP_UNITS, DESIGN_UNITS
    TIP_SUBJECT_OFFERED: None
    LIBRARY_SUBJECT_OFFERED: None
  - dimension: Distinctive attributes
    COURSE_CATALOG_SUBJECT_OFFERED: HGN_DESC level, GRADE_TYPE/GRADE_RULE, HASS/GIR
      attributes, IS_OFFERED_* flags, MEET_PLACE (room key), ACADEMIC_YEAR, EFFECTIVE_TERM_CODE
    SUBJECT_OFFERED: IS_REPEATABLE_SUBJECT, CLUSTER_TYPE, section flags, FORM_TYPE,
      EVALUATE_THIS_SUBJECT
    SUBJECT_OFFERED_SUMMARY: OFFER_SCHOOL_NAME, COURSE_NUMBER, cluster info at subject
      level
    SUBJECT_SUMMARY: SCHOOL_CODE/SCHOOL_NAME, SUBJECT_GROUP_ID, SUBJECT_OR_CLUSTER,
      detailed weekly enrollment
    TIP_SUBJECT_OFFERED: IS_NO_COURSE_MATERIAL flag; parent of TIP_DETAIL materials
    LIBRARY_SUBJECT_OFFERED: COURSE_NUMBER/COURSE_NUMBER_DESC; parent of LIBRARY_RESERVE_MATRL_DETAIL
  - dimension: Department column naming
    COURSE_CATALOG_SUBJECT_OFFERED: DEPARTMENT_CODE / DEPARTMENT_NAME
    SUBJECT_OFFERED: OFFER_DEPT_CODE / OFFER_DEPT_NAME
    SUBJECT_OFFERED_SUMMARY: OFFER_DEPT_CODE / OFFER_DEPT_NAME
    SUBJECT_SUMMARY: DEPARTMENT_CODE / DEPARTMENT_NAME
    TIP_SUBJECT_OFFERED: OFFER_DEPT_CODE / OFFER_DEPT_NAME
    LIBRARY_SUBJECT_OFFERED: OFFER_DEPT_CODE / OFFER_DEPT_NAME
  decision_guide:
    ? Questions about credit units, grading type/rules, HGN level (undergraduate/graduate),
      HASS/GIR attributes, or term offering flags (fall/spring/IAP/summer)
    : Use COURSE_CATALOG_SUBJECT_OFFERED; it is the only offering table carrying full
      catalog attributes.
    Questions about actual section-level offerings, repeatability, cluster type, or section flags: Use
      SUBJECT_OFFERED (section grain); roll up via SUBJECT_OFFERED_SUMMARY when subject-level
      totals are needed.
    ? Questions about final enrollment statistics, weekly enrollment snapshots, credit
      vs listener counts, subject groups, or school-level unit statistics
    : Use SUBJECT_SUMMARY.
    Questions about textbooks/course materials per subject (required/optional status, ISBN, record counts): Start
      from TIP_SUBJECT_OFFERED (subject scope, IS_NO_COURSE_MATERIAL) joined to TIP_DETAIL
      (material rows).
    Questions about library reserve materials, reserve counts per subject, or library course numbers: Start
      from LIBRARY_SUBJECT_OFFERED joined to LIBRARY_RESERVE_MATRL_DETAIL.
    ? Questions about subject-level units with offering department/school (e.g. Engineering
      school enrollment totals by department)
    : Use SUBJECT_OFFERED_SUMMARY, which carries both TOTAL_UNITS and OFFER_SCHOOL_NAME.
- id: concept_course_catalog_sources
  name: Course Catalog Sources
  desc: 'Tables providing catalog-level subject attributes (titles, unit structure,
    grading rules, HGN level, requirement attributes, offering-term flags) from different
    source systems: the warehouse course catalog, the CIS course catalog feed, and
    the Drupal course catalog feed. They answer the same catalog-attribute questions
    but differ in source system, extra columns, and join paths to department/subject-code
    lookups.'
  tables:
  - COURSE_CATALOG_SUBJECT_OFFERED
  - CIS_COURSE_CATALOG
  - DRUPAL_COURSE_CATALOG
  comparisons:
  - dimension: Source system
    COURSE_CATALOG_SUBJECT_OFFERED: Warehouse course catalog fact table
    CIS_COURSE_CATALOG: CIS (course information system) catalog feed
    DRUPAL_COURSE_CATALOG: Drupal publishing-system catalog feed
  - dimension: Distinctive columns
    COURSE_CATALOG_SUBJECT_OFFERED: TERM_CODE plus EFFECTIVE_TERM_CODE, MEET_PLACE
      room key, RESPONSIBLE_FACULTY columns
    CIS_COURSE_CATALOG: Same catalog attribute set keyed by ACADEMIC_YEAR/TERM_CODE;
      no MEET_PLACE/MEET_TIME
    DRUPAL_COURSE_CATALOG: Adds SO_SUBJECT_ID, SO_TERM_CODE, SO_TERM_DESCRIPTION,
      SO_CLUSTER_TYPE linking to registrar subject offerings
  - dimension: Typical join paths
    COURSE_CATALOG_SUBJECT_OFFERED: TERM_CODE/EFFECTIVE_TERM_CODE to term tables;
      SUBJECT_CODE to SIS_SUBJECT_CODE/SIS_COURSE_DESCRIPTION; DEPARTMENT_CODE to
      SIS_DEPARTMENT; MEET_PLACE to FCLT_ROOMS
    CIS_COURSE_CATALOG: DEPARTMENT_CODE to SIS_SUBJECT_CODE for subject-code/department
      resolution
    DRUPAL_COURSE_CATALOG: SO_* columns to subject offering tables; catalog attributes
      used directly
  - dimension: Usage in queries
    COURSE_CATALOG_SUBJECT_OFFERED: Default choice for unit statistics, HGN level,
      grade rules, offering flags
    CIS_COURSE_CATALOG: Used when subject titles must be resolved through SIS_SUBJECT_CODE
      department groupings
    DRUPAL_COURSE_CATALOG: Used when catalog data must be tied back to registrar offering
      records via SO_* keys
  decision_guide:
    Questions about units, grade type/rule, HGN level, HASS/GIR attributes, or IS_OFFERED_* flags of subjects: Use
      COURSE_CATALOG_SUBJECT_OFFERED as the default catalog source; it also carries
      MEET_PLACE for location analysis.
    ? Questions that resolve subjects through SIS subject codes by department (e.g.
      counting subjects per department from the CIS feed)
    : Use CIS_COURSE_CATALOG joined to SIS_SUBJECT_CODE on DEPARTMENT_CODE.
    ? Questions that need catalog attributes tied to registrar subject offering records
      (cluster type, offering term description)
    : Use DRUPAL_COURSE_CATALOG via its SO_SUBJECT_ID / SO_TERM_CODE columns.
- id: concept_department_dimension
  name: Department and School Dimension
  desc: 'Lookup tables describing academic departments and their school attribution:
    the SIS department dimension, the student-facing department lookup, and the SIS
    administrative department (contact information). They answer questions about department
    names, full names, school code/name, degree-granting status, budget codes, and
    department phone numbers, but differ in attribute coverage.'
  tables:
  - SIS_DEPARTMENT
  - STUDENT_DEPARTMENT
  - SIS_ADMIN_DEPARTMENT
  comparisons:
  - dimension: Attribute coverage
    SIS_DEPARTMENT: 'Richest: DEPARTMENT_FULL_NAME, SCHOOL_CODE/SCHOOL_NAME, DEPT_BUDGET_CODE,
      IS_DEGREE_GRANTING, commencement-book names, DLC key'
    STUDENT_DEPARTMENT: 'Minimal: code, name, full name, school code/name only'
    SIS_ADMIN_DEPARTMENT: 'Administrative contact: department phone area code/number,
      clearing cost collector'
  - dimension: Degree-granting and school filtering
    SIS_DEPARTMENT: Supports IS_DEGREE_GRANTING and SCHOOL_NAME filters directly
    STUDENT_DEPARTMENT: Only school code/name attribution, no degree-granting flag
    SIS_ADMIN_DEPARTMENT: No school or degree-granting attributes
  - dimension: Typical join path
    SIS_DEPARTMENT: DEPARTMENT_CODE = offering tables' DEPARTMENT_CODE/OFFER_DEPT_CODE;
      also joins SIS_COURSE_DESCRIPTION.DEPARTMENT and SIS_ADMIN_DEPARTMENT.SIS_ADMIN_DEPARTMENT_CODE
    STUDENT_DEPARTMENT: DEPARTMENT_CODE = TIP_SUBJECT_OFFERED.OFFER_DEPT_CODE and
      other offering department codes
    SIS_ADMIN_DEPARTMENT: SIS_ADMIN_DEPARTMENT_CODE = SIS_DEPARTMENT.DEPARTMENT_CODE
  - dimension: Budget/finance attributes
    SIS_DEPARTMENT: DEPT_BUDGET_CODE available for budget-based ranking
    STUDENT_DEPARTMENT: None
    SIS_ADMIN_DEPARTMENT: CLEARING_COST_COLLECTOR
  decision_guide:
    Questions filtering departments by school (e.g. 'School of Engineering') or degree-granting status: Use
      SIS_DEPARTMENT; it carries SCHOOL_NAME and IS_DEGREE_GRANTING.
    Questions needing only department full name and school name for offering departments (e.g. TIP subject offerings): STUDENT_DEPARTMENT
      suffices and is the lighter lookup; SIS_DEPARTMENT also works.
    Questions needing department phone numbers or administrative contact details: Join
      SIS_ADMIN_DEPARTMENT via SIS_DEPARTMENT.DEPARTMENT_CODE = SIS_ADMIN_DEPARTMENT_CODE.
    Questions ranking or grouping departments by budget code: Use SIS_DEPARTMENT.DEPT_BUDGET_CODE.
- id: concept_course_material_programs
  name: Course Material and Library Reserve Domain
  desc: 'Tables covering course material provisioning: the Textbook Information Program
    (TIP) tracking textbook adoption status per subject offering, and library reserve
    processing tracking catalog items placed on reserve for subjects. They jointly
    answer questions about which subjects have course materials/textbooks, material
    status (TIP statuses such as ''RQ'' Required, ''EO'' Electronic options; library
    statuses such as ''U'' Unknown, ''Y'' Required Course Material), ISBNs, record
    counts, and reserve catalog item attributes. The two programs are linked by SUBJECT_ID
    + TERM_CODE.'
  tables:
  - TIP_SUBJECT_OFFERED
  - TIP_DETAIL
  - TIP_MATERIAL
  - TIP_MATERIAL_STATUS
  - LIBRARY_SUBJECT_OFFERED
  - LIBRARY_RESERVE_MATRL_DETAIL
  - LIBRARY_RESERVE_CATALOG
  - LIBRARY_MATERIAL_STATUS
  - LIBRARY_COURSE_INSTRUCTOR
  comparisons:
  - dimension: Business process
    TIP_SUBJECT_OFFERED / TIP_DETAIL / TIP_MATERIAL / TIP_MATERIAL_STATUS: 'Textbook
      program: subjects tracked for textbook adoption, material rows with status and
      ISBN, material bibliographic details, status decoding'
    ? LIBRARY_SUBJECT_OFFERED / LIBRARY_RESERVE_MATRL_DETAIL / LIBRARY_RESERVE_CATALOG
      / LIBRARY_MATERIAL_STATUS / LIBRARY_COURSE_INSTRUCTOR
    : 'Library reserve: subjects in reserve processing, reserve material detail rows,
      catalog item bibliographic records, status decoding, instructor assignments'
  - dimension: Status semantics
    TIP_MATERIAL_STATUS_KEY: '12 statuses decoded by TIP_MATERIAL_STATUS: ''RQ'' =
      Required, ''EO'' = Electronic options, ''RC'' = Recommended, ''PC'' = Val-u
      option, ''BR'' = Bookstore recommends, ''CL'' = Go to class first, ''NM'' =
      Course has no materials, ''U'' = Unknown, plus NULL-description keys ''NL''/''NS''/''NB''/blank'
    LIBRARY_MATERIAL_STATUS_KEY: '6 statuses decoded by LIBRARY_MATERIAL_STATUS: ''U''
      = Unknown, ''R'' = NULL description, ''N'' = Non-Required Course Material, ''O''
      = Reserve only, ''X'' = No Required Textbook, ''Y'' = Required Course Material'
  - dimension: Count measures
    TIP_DETAIL: COUNT(TIP_MATERIAL_KEY) or RECORD_COUNT for material-count statistics
      per status/subject
    LIBRARY_RESERVE_MATRL_DETAIL: COUNT(LIBRARY_RESERVE_CATALOG_KEY) for reserve catalog
      item counts per status/subject; LIBRARY_RESERVE_CATALOG.RECORD_COUNTER is a
      catalog record counter
  - dimension: Parent-child structure
    TIP_SUBJECT_OFFERED → TIP_DETAIL: TIP_SUBJECT_OFFERED_KEY / SUBJECT_ID links subject
      rows to material rows
    LIBRARY_SUBJECT_OFFERED → LIBRARY_RESERVE_MATRL_DETAIL → LIBRARY_RESERVE_CATALOG: LIBRARY_SUBJECT_OFFERED_KEY
      and LIBRARY_RESERVE_CATALOG_KEY chain subjects to reserve items
  decision_guide:
    Questions about required/optional textbooks, ISBNs, or whether subjects have course materials: Use
      TIP_SUBJECT_OFFERED (IS_NO_COURSE_MATERIAL flag) with TIP_DETAIL (TIP_MATERIAL_STATUS_KEY
      'RQ'/'EO').
    Questions about library reserve items, reserve counts per subject, or catalog titles/authors: Use
      LIBRARY_RESERVE_MATRL_DETAIL joined to LIBRARY_RESERVE_CATALOG, scoped by LIBRARY_SUBJECT_OFFERED.
    Questions about enrollment of subjects within the textbook program or library reserve scope: Use
      TIP_SUBJECT_OFFERED.NUM_ENROLLED_STUDENTS or LIBRARY_SUBJECT_OFFERED.NUM_ENROLLED_STUDENTS
      respectively; these are program-specific snapshots, not the official SUBJECT_SUMMARY
      enrollment.
    Questions about textbook prices, editions, or publishers: Use TIP_MATERIAL via
      TIP_DETAIL.TIP_MATERIAL_KEY.
    Questions about instructors of courses with reserve materials: Use LIBRARY_COURSE_INSTRUCTOR
      via LIBRARY_RESERVE_MATRL_DETAIL.LIBRARY_COURSE_INSTRUCTOR_KEY.
    Questions about required textbooks, ISBNs, or whether subjects have course materials: Use
      TIP_SUBJECT_OFFERED (IS_NO_COURSE_MATERIAL flag) with TIP_DETAIL (TIP_MATERIAL_STATUS_KEY,
      e.g. 'RQ' Required).
    Questions combining textbook material statuses with library reserve statuses: Join
      TIP_DETAIL and LIBRARY_RESERVE_MATRL_DETAIL on SUBJECT_ID + TERM_CODE, decode
      each status via its own lookup table, and aggregate each side separately; never
      equate the two status key columns.
- id: concept_iap_activities
  name: IAP Activity Domain
  desc: 'Tables describing Independent Activities Period (IAP) activities offered
    in January terms: activity details (title, enrollment type, max enrollment, fee,
    cancellation flags), sessions (location, date, times), sponsors (name, type),
    categories, and persons. They jointly answer questions about IAP activity counts,
    enrollment capacity, fees, session scheduling, and sponsorship.'
  tables:
  - IAP_SUBJECT_DETAIL
  - IAP_SUBJECT_SESSION
  - IAP_SUBJECT_SPONSOR
  - IAP_SUBJECT_CATEGORY
  - IAP_SUBJECT_PERSON
  comparisons:
  - dimension: Granularity
    IAP_SUBJECT_DETAIL: One row per IAP activity per term (fact table)
    IAP_SUBJECT_SESSION: One row per session of an activity
    IAP_SUBJECT_SPONSOR: One row per sponsor
    IAP_SUBJECT_CATEGORY: One row per activity category
    IAP_SUBJECT_PERSON: One row per person associated with an activity
  - dimension: Key measures/attributes
    IAP_SUBJECT_DETAIL: MAX_ENROLLMENT, FEE, ENROLLMENT_TYPE, IS_CANCELLED, IS_MULTIPLE_SESSION,
      PREREG_DEADLINE, PREREQUISITES
    IAP_SUBJECT_SESSION: SESSION_LOCATION, SESSION_DATE, SESSION_START_TIME/END_TIME,
      SESSION_SEQUENCE
    IAP_SUBJECT_SPONSOR: SPONSOR_NAME, SPONSOR_TYPE
    IAP_SUBJECT_CATEGORY: IAP_CATEGORY_NAME, IAP_CATEGORY_DESC
    IAP_SUBJECT_PERSON: PERSON_NAME, PERSON_ROLE, PERSON_EMAIL, PERSON_ORGANIZATION
  - dimension: Linkage
    IAP_SUBJECT_DETAIL: 'Holds FKs: IAP_SUBJECT_SESSION_KEY, IAP_SUBJECT_SPONSOR_KEY,
      IAP_SUBJECT_CATEGORY_KEY, IAP_SUBJECT_PERSON_KEY; TERM_CODE joins term tables
      and TIME_DAY.ACADEMIC_TERM_CODE'
    IAP_SUBJECT_SESSION: Referenced by IAP_SUBJECT_DETAIL.IAP_SUBJECT_SESSION_KEY
    IAP_SUBJECT_SPONSOR: Referenced by IAP_SUBJECT_DETAIL.IAP_SUBJECT_SPONSOR_KEY
    IAP_SUBJECT_CATEGORY: Referenced by IAP_SUBJECT_DETAIL.IAP_SUBJECT_CATEGORY_KEY
    IAP_SUBJECT_PERSON: Referenced by IAP_SUBJECT_DETAIL.IAP_SUBJECT_PERSON_KEY
  decision_guide:
    Questions about IAP activity enrollment capacity, fees, cancellation, or enrollment type: Use
      IAP_SUBJECT_DETAIL; filter IS_CANCELLED='N' for active activities.
    Questions about where/when IAP sessions take place (location, session times): Join
      IAP_SUBJECT_DETAIL to IAP_SUBJECT_SESSION via IAP_SUBJECT_SESSION_KEY.
    Questions about who sponsors IAP activities or sponsor types: Join IAP_SUBJECT_DETAIL
      to IAP_SUBJECT_SPONSOR via IAP_SUBJECT_SPONSOR_KEY.
    Questions grouping IAP activities by category: Join IAP_SUBJECT_DETAIL to IAP_SUBJECT_CATEGORY
      via IAP_SUBJECT_CATEGORY_KEY.
    Questions about IAP term timing (January terms): Join IAP_SUBJECT_DETAIL.TERM_CODE
      (JA suffix) to ACADEMIC_TERMS/ACADEMIC_TERMS_ALL or TIME_DAY.ACADEMIC_TERM_CODE.
    ? Questions about who leads or contacts IAP activities, or statistics per person
      role (Activity leader / Session leader / Contact person)
    : Join IAP_SUBJECT_DETAIL to IAP_SUBJECT_PERSON via IAP_SUBJECT_PERSON_KEY; note
      one key can hold multiple role rows so activity rows may fan out.
- id: concept_room_space_inventory
  name: Room and Space Inventory
  desc: 'Tables recording the physical room inventory and its space assignment: SPACE_DETAIL
    (rooms assigned to space units with usage classification and square footage),
    FCLT_ROOMS (facilities room inventory with use classifications, organization assignment,
    and area in square meters), FAC_ROOMS (the FAC_* family room snapshot with the
    same structure as FCLT_ROOMS but FAC_* keys), and ZPM_ROOMS_LOAD (space-planning
    room load feed with floor, space usage text, access level, and space unit code
    / HR org unit id links). They jointly answer questions about how many rooms exist,
    room sizes, room usage, and which organization/space unit occupies rooms, but
    differ in assignment perspective, key family, and area units.'
  tables:
  - SPACE_DETAIL
  - FCLT_ROOMS
  - FAC_ROOMS
  - ZPM_ROOMS_LOAD
  comparisons:
  - dimension: Business perspective
    differences: SPACE_DETAIL records rooms from the space-assignment perspective
      (which space unit each room is allocated to, with SPACE_USAGE_KEY usage code);
      FCLT_ROOMS and FAC_ROOMS record rooms from the facilities inventory perspective
      (major/minor use descriptions, primary and minor organization occupancy); ZPM_ROOMS_LOAD
      records rooms from the space-planning load perspective (space usage text, floor,
      access level, occupying HR org unit).
  - dimension: Key family and join paths
    differences: SPACE_DETAIL joins SPACE_UNIT/SPACE_FLOOR/SPACE_USAGE and FCLT_BUILDING
      via BUILDING_KEY; FCLT_ROOMS joins FCLT_BUILDING via FCLT_BUILDING_KEY and FCLT_ORGANIZATION
      via FCLT_ORGANIZATION_KEY, and is referenced by COURSE_CATALOG_SUBJECT_OFFERED.MEET_PLACE;
      FAC_ROOMS joins the FAC_* family (FAC_BUILDING, FAC_FLOOR, FAC_ORGANIZATION);
      ZPM_ROOMS_LOAD joins SPACE_UNIT via SPACE_UNIT_CODE and FCLT_ORGANIZATION/HR_ORG_UNIT
      via HR_ORG_UNIT_ID (no building/floor keys).
  - dimension: Area measure and units
    differences: SPACE_DETAIL.ROOM_SQUARE_FOOTAGE is in square feet; FCLT_ROOMS.AREA
      and FAC_ROOMS.AREA are in square meters; ZPM_ROOMS_LOAD carries no area measure
      at all. Unit choice matters for size thresholds and averages.
  - dimension: Room counting semantics
    differences: SPACE_DETAIL supports counting rooms per space unit or per building
      via BUILDING_ROOM rows (and ROOM_COUNTER=1 per row); FCLT_BUILDING also carries
      a precomputed NUM_OF_ROOMS attribute per building, while FCLT_ROOMS/FAC_ROOMS/ZPM_ROOMS_LOAD
      require COUNT over room rows.
  - dimension: Usage classification detail
    differences: SPACE_DETAIL uses a coded SPACE_USAGE_KEY decoded by SPACE_USAGE;
      FCLT_ROOMS/FAC_ROOMS carry denormalized MAJOR_USE_DESC/USE_DESC/MINOR_USE_DESC
      text classifications plus ACCESS_LEVEL and coordinates; ZPM_ROOMS_LOAD carries
      a free-text SPACE_USAGE (e.g. 'DSGN STUDIO', 'CONF RM') plus ACCESS_LEVEL and
      a text FLOOR that can hold labels such as 'G9'.
  decision_guide:
    Counting rooms per space unit or finding the building with the most rooms in a space unit: 'Use
      SPACE_DETAIL: it is the only table keyed by SPACE_UNIT_KEY, so room counts can
      be grouped by space unit and by BUILDING_KEY directly.'
    ? Room area statistics in square meters, use-classification filters (e.g. classrooms),
      or linking class meeting places to rooms
    : 'Use FCLT_ROOMS: it carries AREA in square meters, denormalized use descriptions,
      and FCLT_ROOM_KEY referenced by COURSE_CATALOG_SUBJECT_OFFERED.MEET_PLACE.'
    Room analysis that must stay inside the FAC_* key family (FAC_BUILDING/FAC_FLOOR/FAC_ORGANIZATION): 'Use
      FAC_ROOMS: it mirrors FCLT_ROOMS structure but joins FAC_* family tables via
      FAC_ROOM_KEY/BUILDING_KEY/ORGANIZATION_KEY.'
    Room occupancy by organization hierarchy (level, parent organization): Use FCLT_ROOMS
      joined to FCLT_ORGANIZATION via FCLT_ORGANIZATION_KEY, SPACE_DETAIL joined via
      SPACE_UNIT to SPACE_UNIT.FCLT_ORGANIZATION_KEY when the space-assignment view
      is required, or ZPM_ROOMS_LOAD joined to FCLT_ORGANIZATION via HR_ORG_UNIT_ID
      for the space-planning view.
    Room analysis by floor, space usage text, or access level linked to space units or HR org units (no area needed): 'Use
      ZPM_ROOMS_LOAD: it links rooms to SPACE_UNIT via SPACE_UNIT_CODE and to organizations/HR
      units via HR_ORG_UNIT_ID.'
- id: concept_facility_organization_dimension
  name: Facility Organization Dimension
  desc: 'Organization dimension tables describing the institute''s hierarchical organization
    tree used for facilities/space attribution: FCLT_ORGANIZATION (keyed by FCLT_ORGANIZATION_KEY,
    with DLC_KEY/DLC_NAME) and FAC_ORGANIZATION (keyed by ORGANIZATION_KEY, with D_CODE).
    They answer the same questions about organization names, hierarchy levels, parent/major
    organizations, assignable flags, and HR cross-references, but belong to different
    table families and coverage.'
  tables:
  - FCLT_ORGANIZATION
  - FAC_ORGANIZATION
  comparisons:
  - dimension: Key family
    differences: FCLT_ORGANIZATION uses FCLT_ORGANIZATION_KEY/FCLT_ORG_PARENT_KEY/FCLT_MAJOR_ORG_KEY
      and is referenced by SPACE_UNIT and FCLT_ROOMS; FAC_ORGANIZATION uses ORGANIZATION_KEY/ORG_PARENT_KEY/MAJOR_ORG_KEY
      and is referenced by FAC_ROOMS.
  - dimension: Coverage
    differences: FCLT_ORGANIZATION holds more organizations (180 rows) than FAC_ORGANIZATION
      (169 rows); key values overlap almost entirely, so FCLT_ORGANIZATION is the
      broader dimension.
  - dimension: DLC attribution columns
    differences: FCLT_ORGANIZATION carries both DLC_KEY and DLC_NAME plus an HR_DEPARTMENT_NAME;
      FAC_ORGANIZATION carries only D_CODE (no DLC name column).
  - dimension: Shared structure
    differences: Both share ORGANIZATION_ID/ORGANIZATION/ORGANIZATION_NAME, ORGANIZATION_LEVEL
      (1-6, level 5 = department/DLC), ORGANIZATION_NUMBER, ORGANIZATION_SORT, ASSIGNABLE,
      COURSE, DESCRIPTION, and HR cross-reference columns.
  decision_guide:
    Organization level, name, description, or hierarchy questions linked to space units or FCLT rooms: 'Use
      FCLT_ORGANIZATION: it joins SPACE_UNIT.FCLT_ORGANIZATION_KEY and FCLT_ROOMS.FCLT_ORGANIZATION_KEY
      and has the widest organization coverage.'
    Organization questions inside the FAC_* family (FAC_ROOMS occupancy, FAC_BUILDING analysis): 'Use
      FAC_ORGANIZATION: FAC_ROOMS.ORGANIZATION_KEY references it directly.'
    DLC name reporting for an organization: 'Use FCLT_ORGANIZATION: it is the only
      one carrying DLC_NAME alongside DLC_KEY.'
- id: concept_space_unit_dimension
  name: Space Unit Dimension
  desc: 'Space unit lookup tables identifying the organizational units that receive
    space allocation: SPACE_UNIT (with FCLT_ORGANIZATION_KEY organization attribution)
    and SPACE_UNIT2 (identity/name only). They answer the same space-unit identity
    questions but differ in organization linkage and coverage.'
  tables:
  - SPACE_UNIT
  - SPACE_UNIT2
  comparisons:
  - dimension: Organization attribution
    differences: SPACE_UNIT carries FCLT_ORGANIZATION_KEY linking each space unit
      to its owning organization in FCLT_ORGANIZATION; SPACE_UNIT2 has no organization
      key, only space unit identity and DLC_KEY.
  - dimension: Coverage
    differences: SPACE_UNIT holds more space units (150 rows) than SPACE_UNIT2 (139
      rows); every SPACE_UNIT2 key also exists in SPACE_UNIT, so SPACE_UNIT2 is a
      subset.
  - dimension: Join role
    differences: Both join SPACE_DETAIL via SPACE_UNIT_KEY; only SPACE_UNIT can bridge
      SPACE_DETAIL rooms to organization attributes (level, parent, description).
  decision_guide:
    Space unit analysis that needs organization attributes (organization level, name, description): 'Use
      SPACE_UNIT: it is the only space unit table carrying FCLT_ORGANIZATION_KEY for
      the organization join.'
    Space unit name/code lookup only, or queries restricted to the SPACE_UNIT2 subset: 'Use
      SPACE_UNIT2: it provides SPACE_UNIT_KEY/CODE/NAME and DLC_KEY without organization
      linkage.'
    Counting rooms per space unit or ranking space units by room count: Join SPACE_DETAIL
      to SPACE_UNIT on SPACE_UNIT_KEY (preferred for full coverage and organization
      attribution).
- id: concept_cip_program_classification
  name: CIP Program Classification
  desc: Lookup tables of the Classification of Instructional Programs (CIP) used to
    classify courses/instructional programs into two-digit categories, four-digit
    series, and six-digit program codes, with revision version years (1990/2000/2010/2020).
    CIP holds the current single-version classification (one row per program code,
    with a change NOTE), while CIP_WITH_VERSION preserves every revision of each program
    code across versions. Both join to SIS_COURSE_DESCRIPTION via PROGRAM_CODE = CIP_PROGRAM_CODE
    to attribute courses to CIP programs and categories.
  tables:
  - CIP
  - CIP_WITH_VERSION
  comparisons:
  - dimension: Granularity
    CIP: One row per six-digit program code (3,059 rows / 3,059 distinct codes); each
      code carries exactly one VERSION value
    CIP_WITH_VERSION: One row per program code per revision version year (6,350 rows
      / 2,759 distinct codes); the same code appears under multiple versions
  - dimension: Version semantics
    CIP: VERSION is the single CIP revision the code belongs to; filters like VERSION
      > 2000 select codes classified in later revisions without row duplication
    CIP_WITH_VERSION: VERSION enumerates all revisions a code existed in; joining
      without a version filter multiplies rows per code
  - dimension: Unique columns
    CIP: Has NOTE (change note per code, e.g. '(2020) No substantive changes'); no
      surrogate key
    CIP_WITH_VERSION: Has CIP_WITH_VERSION_KEY surrogate key (code + version); no
      NOTE column
  - dimension: Join fan-out with SIS_COURSE_DESCRIPTION
    CIP: PROGRAM_CODE = CIP_PROGRAM_CODE matches ~597 course rows (one match per course)
    CIP_WITH_VERSION: Same key matches ~2,474 course rows because a course's program
      code can match several version rows
  decision_guide:
    ? Questions about program categories, program titles, four-digit codes, version
      filters (e.g. version after 2000), or counting courses per CIP category
    : 'Use CIP: one row per program code, so joins to SIS_COURSE_DESCRIPTION do not
      duplicate course rows and version filters are unambiguous'
    ? Questions about how a program's classification changed across CIP revisions,
      or needing historical category/four-digit titles of a program code in a specific
      version year
    : Use CIP_WITH_VERSION filtered on the target VERSION, since it preserves every
      revision of each program code
    Questions needing the change note of a program code (e.g. whether a code had substantive changes in the 2020 revision): Use
      CIP, the only table carrying the NOTE column
- id: concept_person_directory
  name: Person and Employee Directory Domain
  desc: 'Tables describing people of the institute keyed by MIT_ID: the primary employee
    directory (contact details, titles, HR department), the Drupal-sourced employee
    feed (employee group/type, appointment flags, HR org unit), the person master
    table (payroll rank, position title, active flag), the HR faculty roster (appointment
    type, terminal degree, emeritus status), the OPA current-person snapshot (HR job/appointment
    attributes, faculty flag, sabbatical), and the student directory (students with
    department attribution and student year). They jointly answer questions about
    who a person is, their contact details, job/appointment attributes, and whether
    they are employee, faculty, or student; responsible faculty in subject offering
    tables resolve to these tables via RESPONSIBLE_FACULTY_MIT_ID = MIT_ID.'
  tables:
  - EMPLOYEE_DIRECTORY
  - DRUPAL_EMPLOYEE_DIRECTORY
  - SE_PERSON
  - HR_FACULTY_ROSTER
  - OPA_PERSON_CURRENT
  - MIT_STUDENT_DIRECTORY
  comparisons:
  - dimension: Population covered
    details: EMPLOYEE_DIRECTORY, DRUPAL_EMPLOYEE_DIRECTORY, SE_PERSON, OPA_PERSON_CURRENT
      cover employees/people; HR_FACULTY_ROSTER covers faculty only; MIT_STUDENT_DIRECTORY
      covers students only.
  - dimension: Contact attributes
    details: EMPLOYEE_DIRECTORY and DRUPAL_EMPLOYEE_DIRECTORY carry email, office
      phone, and office location; OPA_PERSON_CURRENT carries email only; SE_PERSON
      carries office location only; HR_FACULTY_ROSTER and MIT_STUDENT_DIRECTORY (phone
      often null) carry limited contact data.
  - dimension: HR/appointment attributes
    details: OPA_PERSON_CURRENT is richest for HR job attributes (job id/title, payroll
      rank, employment percent, faculty flag, sabbatical dates); HR_FACULTY_ROSTER
      adds appointment type, terminal degree, endowed chair, emeritus status; DRUPAL_EMPLOYEE_DIRECTORY
      adds employee group/type and additional/dual appointment flags; SE_PERSON carries
      payroll rank and position title; EMPLOYEE_DIRECTORY carries directory/primary
      titles and HR department number/name.
  - dimension: Name variants
    details: Only EMPLOYEE_DIRECTORY carries preferred names, Kerberos name, and name-known-by
      variants; the others carry legal name components only.
  - dimension: Department attribution
    details: MIT_STUDENT_DIRECTORY.DEPARTMENT stores the academic department code
      joining to SIS_DEPARTMENT.DEPARTMENT_CODE; EMPLOYEE_DIRECTORY.DEPARTMENT_NUMBER/DEPARTMENT_NAME
      are HR organizational units, not academic department codes.
  decision_guide:
    Resolving a subject offering's responsible faculty name, email, or office phone: Use
      EMPLOYEE_DIRECTORY via RESPONSIBLE_FACULTY_MIT_ID = MIT_ID; it is the only feed
      combining full name, email, and office phone for faculty.
    Counting students belonging to an academic department: Use MIT_STUDENT_DIRECTORY
      joined to SIS_DEPARTMENT on DEPARTMENT = DEPARTMENT_CODE; employee tables do
      not cover students.
    Analyzing faculty appointment type, terminal degree, or emeritus status: Use HR_FACULTY_ROSTER;
      these attributes exist only in the faculty roster.
    Analyzing HR job attributes, employment percent, faculty flag, or sabbatical status of current people: Use
      OPA_PERSON_CURRENT; it is the current-person HR snapshot.
    Needing employee group/type or additional/dual appointment flags from the Drupal source: Use
      DRUPAL_EMPLOYEE_DIRECTORY; these columns are absent from EMPLOYEE_DIRECTORY.
    Looking up a person's payroll rank, position title, or active status: Use SE_PERSON,
      the general person master table.
    Resolving a library course instructor's name to an MIT_ID: Use SE_PERSON via LIBRARY_COURSE_INSTRUCTOR.INSTRUCTOR_NAME
      = SE_PERSON.FULL_NAME; library instructor records carry no person key, only
      the name text.
    Combining student directory records with person master attributes (e.g. graduate students who are also employees): Join
      MIT_STUDENT_DIRECTORY to SE_PERSON on FULL_NAME; there is no shared person key
      between the student directory and the employee/person tables, so the name-based
      join excludes students whose names do not exactly match a SE_PERSON.FULL_NAME
      value.
- comparisons:
  - dimension: Table family
    differences: FCLT_MAJOR_USE and FCLT_MAJOR_USE_HIST use FCLT_MAJOR_USE_KEY and
      join FCLT_ROOMS; FAC_MAJOR_USE uses MAJOR_USE_KEY and joins FAC_ROOMS. The two
      families must not be mixed in one query.
  - dimension: Time coverage
    differences: FCLT_MAJOR_USE and FAC_MAJOR_USE hold the current classification
      snapshot (one row per code); FCLT_MAJOR_USE_HIST holds one row per code per
      fiscal period (FISCAL_PERIOD, e.g. 201505), preserving historical code/description/assignable
      values.
  - dimension: Key structure
    differences: FCLT_MAJOR_USE_HIST adds a composite FCLT_MAJOR_USE_HIST_KEY ('CODE-PERIOD')
      and the FISCAL_PERIOD column; the other two tables have only the plain major
      use key.
  - dimension: Shared attributes
    differences: All three carry MAJOR_USE (short code, e.g. 'CLASSRMS'), DESCRIPTION
      (e.g. 'CLASSROOMS'), and ASSIGNABLE (1/0 assignable-space flag) with the same
      value semantics.
  decision_guide:
    Decoding the major use of rooms in the facilities room inventory: Use FCLT_MAJOR_USE
      joined to FCLT_ROOMS on FCLT_MAJOR_USE_KEY to obtain MAJOR_USE/DESCRIPTION/ASSIGNABLE.
    Decoding the major use of rooms in the FAC family room snapshot: Use FAC_MAJOR_USE
      joined to FAC_ROOMS on MAJOR_USE_KEY.
    Analyzing how a room use classification changed over fiscal periods: Use FCLT_MAJOR_USE_HIST
      filtered by FISCAL_PERIOD; join to FCLT_MAJOR_USE on FCLT_MAJOR_USE_KEY to compare
      against the current classification.
    Filtering rooms to assignable-space use categories: Join the room table to its
      family's major use lookup and filter ASSIGNABLE = 1.
  desc: Lookup tables classifying rooms by major use (classrooms, offices, laboratories,
    residential, circulation, etc.) with a short code, description, and assignable-space
    flag. They cover the current classification in the FCLT and FAC table families
    and the fiscal-period historical classification in the FCLT family, jointly answering
    questions about what a room is primarily used for and whether that use counts
    as assignable space.
  id: concept_room_major_use_classification
  name: Room Major Use Classification
  tables:
  - FCLT_MAJOR_USE
  - FAC_MAJOR_USE
  - FCLT_MAJOR_USE_HIST
- id: concept_building_inventory
  name: Building Inventory
  desc: 'Tables recording the physical building inventory and its attributes (number/name,
    type, ownership, site, campus sector, access level, gross/assignable/non-assignable
    areas, number of rooms, key dates): the current FCLT_* family snapshot, its fiscal-period
    history (in two date-format variants), the FAC_* family snapshot, and the lightweight
    space-domain building lookup. They jointly answer questions about building characteristics,
    areas, and room counts, but differ in time coverage, table family, attribute richness,
    and area units.'
  tables:
  - FCLT_BUILDING
  - FCLT_BUILDING_HIST
  - FCLT_BUILDING_HIST_1
  - FAC_BUILDING
  - BUILDINGS
  comparisons:
  - dimension: Time coverage
    differences: FCLT_BUILDING, FAC_BUILDING, and BUILDINGS are current snapshots
      (one row per building); FCLT_BUILDING_HIST and FCLT_BUILDING_HIST_1 carry one
      row per building per fiscal period (201505-201906, ~48 periods), enabling trend
      and dispersion statistics (stddev/variance of assignable area, room counts)
      across historical records.
  - dimension: Table family and join paths
    differences: FCLT_BUILDING/FCLT_BUILDING_HIST join the FCLT_* family (FCLT_ROOMS,
      FCLT_FLOOR, FCLT_BUILDING_ADDRESS via FCLT_BUILDING_KEY); FAC_BUILDING joins
      the FAC_* family (FAC_ROOMS, FAC_FLOOR, FAC_BUILDING_ADDRESS via FAC_BUILDING_KEY);
      BUILDINGS joins the space domain (SPACE_DETAIL via BUILDING_KEY). FCLT_BUILDING_KEY,
      FAC_BUILDING_KEY, and BUILDINGS.BUILDING_KEY share the same building-number
      value domain.
  - dimension: Attribute richness
    differences: FCLT_BUILDING, FCLT_BUILDING_HIST, FCLT_BUILDING_HIST_1, and FAC_BUILDING
      carry full classification attributes (BUILDING_TYPE ACADEMIC/SERVICE/RESIDENT,
      OWNERSHIP_TYPE OWNED/LEASED, SITE, CAMPUS_SECTOR, ACCESS_LEVEL_CODE, OCCUPANCY_CLASS,
      BUILDING_HEIGHT, DATE_BUILT); BUILDINGS only carries key/number, name, single-text
      street and mailing addresses, and square-footage measures.
  - dimension: Area units
    differences: FCLT_*/FAC_* building tables measure EXT_GROSS_AREA/ASSIGNABLE_AREA/NON_ASSIGNABLE_AREA
      in square meters; BUILDINGS measures BLDG_GROSS_SQUARE_FOOTAGE/BLDG_ASSIGNABLE_SQUARE_FOOTAGE
      in square feet. Unit choice matters for area thresholds and averages.
  - dimension: Date column formats
    differences: FCLT_BUILDING and FCLT_BUILDING_HIST store DATE_BUILT/DATE_ACQUIRED/DATE_OCCUPIED
      as MM/DD/YYYY strings; FCLT_BUILDING_HIST_1 is identical to FCLT_BUILDING_HIST
      except these dates are stored as DD-MON-YY strings (e.g. '25-APR-03').
  - dimension: Alternative join keys to history
    differences: FCLT_BUILDING joins FCLT_BUILDING_HIST primarily on FCLT_BUILDING_KEY,
      but COST_CENTER_CODE and COST_COLLECTOR_KEY are also valid join keys (used when
      counting historical records per cost collector); ACCESS_LEVEL_CODE joins associate
      buildings sharing the same access level with history attributes.
  decision_guide:
    Current building attributes, type/site/ownership filters, or current area and room-count values: 'Use
      FCLT_BUILDING: the current FCLT_* family snapshot with full classification attributes
      and square-meter areas.'
    ? Historical trends, per-fiscal-period values, or dispersion statistics (stddev/variance/count)
      across a building's history records
    : 'Use FCLT_BUILDING_HIST: one row per building per fiscal period; count its rows
      for ''number of historical records'' and aggregate ASSIGNABLE_AREA/NUM_OF_ROOMS
      across periods.'
    Building history where dates must appear in DD-MON-YY format: 'Use FCLT_BUILDING_HIST_1:
      identical to FCLT_BUILDING_HIST except DATE_BUILT/DATE_ACQUIRED/DATE_OCCUPIED
      formatting.'
    Building analysis that must stay inside the FAC_* key family (FAC_ROOMS/FAC_FLOOR/FAC_ORGANIZATION): 'Use
      FAC_BUILDING: mirrors FCLT_BUILDING attributes but joins via FAC_BUILDING_KEY.'
    Building name/address text and square-footage measures for space-assignment reporting: 'Use
      BUILDINGS: the space-domain lookup referenced by SPACE_DETAIL via BUILDING_KEY,
      with square-footage (not square-meter) measures.'
- id: concept_floor_inventory
  name: Floor Inventory
  desc: 'Tables recording the floor level of buildings: the current FCLT_* family
    floor inventory with floor areas, the FAC_* family floor snapshot with the same
    structure, the fiscal-period historical floor table, and the lightweight space-domain
    floor lookup. They jointly answer questions about floor numbers and per-floor
    assignable/non-assignable areas, but differ in time coverage, table family, and
    attribute richness.'
  tables:
  - FCLT_FLOOR
  - FCLT_FLOOR_HIST
  - FAC_FLOOR
  - SPACE_FLOOR
  comparisons:
  - dimension: Time coverage
    differences: FCLT_FLOOR, FAC_FLOOR, and SPACE_FLOOR are current snapshots; FCLT_FLOOR_HIST
      carries one row per floor per fiscal period (201505-201602), enabling historical
      floor-area comparison.
  - dimension: Table family and join paths
    differences: FCLT_FLOOR joins FCLT_BUILDING via FCLT_BUILDING_KEY and FCLT_ROOMS
      via FCLT_FLOOR_KEY; FAC_FLOOR joins FAC_BUILDING via BUILDING_KEY and FAC_ROOMS
      via FLOOR_KEY; SPACE_FLOOR joins SPACE_DETAIL via FLOOR_KEY; FCLT_FLOOR_HIST
      joins both FCLT_BUILDING (FCLT_BUILDING_KEY) and FCLT_FLOOR (FCLT_FLOOR_KEY).
  - dimension: Attribute richness
    differences: FCLT_FLOOR, FCLT_FLOOR_HIST, and FAC_FLOOR carry floor area measures
      (EXT_GROSS_AREA, ASSIGNABLE_AREA, NON_ASSIGNABLE_AREA in square meters), sort
      sequence, level, wing, and access level; SPACE_FLOOR only carries floor key,
      floor label, and floor name without any area measures.
  - dimension: Floor identification
    differences: FCLT_FLOOR.FCLT_FLOOR_KEY is formatted '<building key>-<floor>' (e.g.
      '14-4'); FCLT_ROOMS can match floors either via FCLT_FLOOR_KEY or via the composite
      (FCLT_BUILDING_KEY, FLOOR) pair; SPACE_FLOOR uses an independent FLOOR_KEY value
      domain tied to SPACE_DETAIL.
  decision_guide:
    ? Per-floor area aggregation (assignable/non-assignable totals, dispersion across
      floors) or floor-number filtering in the facilities domain
    : Use FCLT_FLOOR joined to FCLT_BUILDING via FCLT_BUILDING_KEY; it carries square-meter
      floor areas and floor labels.
    Historical per-fiscal-period floor areas: 'Use FCLT_FLOOR_HIST: the only floor
      table with a FISCAL_PERIOD time dimension.'
    Floor analysis inside the FAC_* key family: 'Use FAC_FLOOR: mirrors FCLT_FLOOR
      structure but joins FAC_BUILDING/FAC_ROOMS via BUILDING_KEY/FLOOR_KEY.'
    Floor name/label for space-assignment reporting: 'Use SPACE_FLOOR: the lightweight
      lookup referenced by SPACE_DETAIL; it has no area measures, so area questions
      must go to FCLT_FLOOR or FAC_FLOOR.'
- id: concept_building_address
  name: Building Address
  desc: 'Tables recording the postal/street addresses of buildings: the current FCLT_*
    family address table (multiple purpose-typed address rows per building), its fiscal-period
    historical counterpart, the FAC_* family address snapshot, and the single-text
    address fields of the space-domain BUILDINGS lookup. They jointly answer questions
    about where a building is located (street number/name, city, state, postal code),
    but differ in time coverage, address decomposition, and table family.'
  tables:
  - FCLT_BUILDING_ADDRESS
  - FCLT_BUILDING_ADDRESS_HIST
  - FAC_BUILDING_ADDRESS
  - BUILDINGS
  comparisons:
  - dimension: Time coverage
    differences: FCLT_BUILDING_ADDRESS, FAC_BUILDING_ADDRESS, and BUILDINGS are current
      snapshots; FCLT_BUILDING_ADDRESS_HIST carries one row per address record per
      fiscal period, enabling historical address comparison.
  - dimension: Address decomposition
    differences: FCLT_BUILDING_ADDRESS, FCLT_BUILDING_ADDRESS_HIST, and FAC_BUILDING_ADDRESS
      decompose the address into structured components (STREET_NUMBER, STREET_NUMBER_SUFFIX,
      PRE_DIRECTIONAL, STREET_NAME, STREET_SUFFIX, POST_DIRECTIONAL, CITY, STATE,
      POSTAL_CODE) plus ADDRESS_PURPOSE ('STREET', 'MAIL', 'PARCL1'-'PARCL3', 'E911_1'-'E911_5')
      and IS_E911_ADDRESS; BUILDINGS stores only unstructured BUILDING_STREET_ADDRESS
      and BUILDING_MAILING_ADDRESS text fields.
  - dimension: Table family and join paths
    differences: FCLT_BUILDING_ADDRESS(_HIST) join FCLT_BUILDING via FCLT_BUILDING_KEY
      (BUILDING_NUMBER is an alternative match); FAC_BUILDING_ADDRESS joins FAC_BUILDING
      via BUILDING_KEY = FAC_BUILDING_KEY; BUILDINGS is referenced by SPACE_DETAIL
      via BUILDING_KEY.
  - dimension: Row multiplicity
    differences: All three structured address tables hold multiple rows per building
      (one per address purpose), so joining buildings to addresses can multiply building
      rows; BUILDINGS holds exactly one row per building.
  decision_guide:
    Filtering buildings by city/state or reporting structured address components (street number, street name, postal code): Use
      FCLT_BUILDING_ADDRESS joined to FCLT_BUILDING via FCLT_BUILDING_KEY; expect
      multiple address rows per building (one per ADDRESS_PURPOSE).
    Historical per-fiscal-period address values: 'Use FCLT_BUILDING_ADDRESS_HIST:
      the only address table with a FISCAL_PERIOD time dimension.'
    Address lookup inside the FAC_* key family: Use FAC_BUILDING_ADDRESS joined to
      FAC_BUILDING via BUILDING_KEY.
    Displaying a building's full street/mailing address as text for space-assignment reporting: Use
      BUILDINGS.BUILDING_STREET_ADDRESS / BUILDING_MAILING_ADDRESS; no structured
      components are available there.
- id: concept_dept_hr_org_hierarchy
  name: Department and HR Organization Hierarchy
  desc: 'Tables describing the institute''s department/lab/center (DLC) and HR organization
    hierarchies: the HR organization unit dimension in two feed variants (HR_ORG_UNIT,
    HR_ORG_UNIT_NEW), the master department standard hierarchy path (MASTER_DEPT_HIERARCHY),
    its DLC-to-administrative-object link table (MASTER_DEPT_HIERARCHY_LINKS), and
    the direct-parent department lookup (MASTER_DEPT_DCODE_PARENT). They jointly answer
    questions about which HR department/area a DLC or organization belongs to, the
    hierarchy path or parent of a department, and HR department names/codes/levels,
    and are joined to FCLT_ORGANIZATION via DLC_KEY for facilities/space attribution.
    They differ in hierarchy representation (full path vs direct parent vs HR unit
    attributes), unit coverage, and companion columns.'
  tables:
  - HR_ORG_UNIT
  - HR_ORG_UNIT_NEW
  - MASTER_DEPT_HIERARCHY
  - MASTER_DEPT_HIERARCHY_LINKS
  - MASTER_DEPT_DCODE_PARENT
  comparisons:
  - dimension: Granularity and business object
    detail: HR_ORG_UNIT and HR_ORG_UNIT_NEW hold one row per HR organization unit
      (641 and 691 rows respectively); MASTER_DEPT_HIERARCHY holds one row per DLC
      (310 rows) with its 5-level standard hierarchy path; MASTER_DEPT_HIERARCHY_LINKS
      holds one row per DLC-to-linked-object association (fund centers, profit centers,
      facilities orgs, org units); MASTER_DEPT_DCODE_PARENT holds one row per department
      code with only its direct parent.
  - dimension: Hierarchy representation
    detail: HR_ORG_UNIT carries the HR hierarchy path levels 1-7 plus school-area/top-level/root
      names and a unit level classification (ALL MIT, TOP LEVEL, DEPARTMENTS, SUB
      DEPARTMENT, ORGANIZATION LEVEL, NON HIERARCHY ORG UNITS); HR_ORG_UNIT_NEW carries
      only levels 1-5; MASTER_DEPT_HIERARCHY carries the master standard-hierarchy
      path levels 1-5 by code and name; MASTER_DEPT_DCODE_PARENT carries no path,
      only the immediate parent code/name.
  - dimension: Coverage and feed differences
    detail: HR_ORG_UNIT_NEW is the newer feed with more units (691 vs 641, including
      50 units absent from HR_ORG_UNIT) but lacks HR_DEPARTMENT_ID, DLC_NAME, and
      hierarchy levels 6-7, and adds HR_DEPARTMENT_ABBR; HR_ORG_UNIT is required when
      DLC_NAME or the deeper path is needed. MASTER_DEPT_HIERARCHY covers only DLCs
      placed in the 'Standard Hierarchy'; MASTER_DEPT_DCODE_PARENT covers 340 department
      codes including some outside that hierarchy.
  - dimension: DLC cross-reference columns
    detail: HR_ORG_UNIT carries DLC_KEY and DLC_NAME (DLC_KEY null for 133 units,
      and one DLC_KEY may map to multiple HR unit rows); HR_ORG_UNIT_NEW carries only
      DLC_KEY (possibly composite like 'D_DSL:HQ'); MASTER_DEPT_HIERARCHY and MASTER_DEPT_HIERARCHY_LINKS
      carry DLC_KEY/DLC_CODE as their primary DLC identity; MASTER_DEPT_DCODE_PARENT
      uses D_CODE/D_NAME naming for the same value domain.
  - dimension: Companion attributes
    detail: Only the HR_ORG_UNIT tables carry HR department identifiers/codes (HR_ORG_UNIT_ID,
      HR_DEPARTMENT_CODE 'HR-NNNNNN', HR_DEPARTMENT_CODE_OLD) and department name
      variants (short/long/alpha) used for HR department reporting; only MASTER_DEPT_HIERARCHY_LINKS
      carries linked administrative object keys/codes and link type classification.
  decision_guide:
    HR org unit title, HR org unit level, HR department name/code/long name for a facilities organization or DLC: Use
      HR_ORG_UNIT joined via DLC_KEY; it is the only table carrying DLC_NAME alongside
      the HR department attributes and the full levels 1-7 path.
    HR department attributes for units missing from the older feed, or when the newer unit coverage is required: Use
      HR_ORG_UNIT_NEW; it holds 50 units absent from HR_ORG_UNIT but lacks DLC_NAME
      and hierarchy levels 6-7.
    School/area placement or full standard-hierarchy path of a DLC, or restricting analysis to DLCs in the standard hierarchy: Use
      MASTER_DEPT_HIERARCHY (levels 1-5 codes and names per DLC).
    Fund center, profit center, facilities organization, or other administrative object linked to a DLC: Use
      MASTER_DEPT_HIERARCHY_LINKS filtered by LINK_TYPE_CODE (FC, PMIT, FORG, ORG2,
      ORGU, SIS, BAG).
    Direct parent department of a department code (single-level parent lookup): Use
      MASTER_DEPT_DCODE_PARENT (PARENT_D_CODE/PARENT_D_NAME); use MASTER_DEPT_HIERARCHY
      instead when the multi-level path is needed.
- comparisons:
  - dimension: Granularity
    details: MOIRA_LIST is one row per list; MOIRA_LIST_DETAIL is one row per list
      member (a list fans out to many member rows); MOIRA_LIST_OWNER is one row per
      owner entity independent of any single list.
  - dimension: Business content
    details: MOIRA_LIST carries list identity and type flags (IS_ACTIVE, IS_MOIRA_MAILING_LIST,
      IS_MOIRA_GROUP, IS_NFS_GROUP, IS_PUBLIC, IS_HIDDEN); MOIRA_LIST_DETAIL carries
      member identity (login, full name, MIT ID) and membership maintenance data (LAST_UPDATE_DATE,
      COUNTER); MOIRA_LIST_OWNER carries only owner name and owner type (LIST/USER/KERBEROS).
  - dimension: Join role
    details: MOIRA_LIST_KEY originates in MOIRA_LIST and is the foreign key in MOIRA_LIST_DETAIL;
      MOIRA_LIST_OWNER_KEY originates in MOIRA_LIST_OWNER and is the foreign key in
      MOIRA_LIST_DETAIL; member MIT ID/login in MOIRA_LIST_DETAIL links outward to
      person tables (EMPLOYEE_DIRECTORY.MIT_ID / KRB_NAME).
  - dimension: Filtering scope
    details: List-status/type filters (active, mailing list, public, hidden) can only
      be applied in MOIRA_LIST; membership recency filters (last update date) only
      in MOIRA_LIST_DETAIL; owner-type classification only in MOIRA_LIST_OWNER.
  decision_guide:
    Classifying or counting owners of Moira lists by owner type (list/user/Kerberos): Query
      MOIRA_LIST_OWNER, optionally joined from MOIRA_LIST_DETAIL via MOIRA_LIST_OWNER_KEY.
    Finding which lists a specific person belongs to, or listing member names/MIT IDs per list: Query
      MOIRA_LIST_DETAIL (member login, full name, MIT ID, last update date), joining
      MOIRA_LIST on MOIRA_LIST_KEY when list name or list type flags are needed; person
      attributes resolve via EMPLOYEE_DIRECTORY on MIT_ID or KRB_NAME.
    Reporting list-level attributes or filtering lists by status/type (active, mailing list, public, hidden): Query
      MOIRA_LIST, which holds one row per list with all type/status flags; join MOIRA_LIST_DETAIL
      on MOIRA_LIST_KEY only when member information is required.
  desc: 'Tables of the Moira mailing-list/group domain: the list master (one row per
    list with name, description, active flag, and type flags such as mailing list,
    group, NFS group, public, hidden), the membership detail (one row per list member
    with member login, full name, MIT ID, and last update date), and the owner lookup
    (one row per owner entity with owner name and owner type LIST/USER/KERBEROS).
    They jointly answer questions about which lists exist and their properties, who
    belongs to a list, and who owns a list; MOIRA_LIST is the parent of MOIRA_LIST_DETAIL
    via MOIRA_LIST_KEY, and MOIRA_LIST_OWNER is referenced by MOIRA_LIST_DETAIL via
    MOIRA_LIST_OWNER_KEY.'
  id: concept_moira_mailing_lists
  name: Moira Mailing List Domain
  tables:
  - MOIRA_LIST
  - MOIRA_LIST_DETAIL
  - MOIRA_LIST_OWNER
- id: concept_time_dimension
  name: Fiscal and Academic Time Dimension
  desc: 'Time dimension tables of the warehouse at three granularities: TIME_DAY (one
    row per calendar date, with fiscal/calendar year and period, academic year, financial
    aid year, day of week, and the academic term code/description of the day), TIME_MONTH
    (one row per fiscal period in YYYYMM format, covering fiscal years 1996-2035,
    with fiscal quarter, calendar month, academic term, and financial aid year mappings),
    and TIME_QUARTER (one row per fiscal quarter, covering fiscal years 2000-2035,
    with quarter dates, payroll certification deadlines, and quarter status flags).
    They jointly answer questions about when fiscal periods/quarters/days run, which
    fiscal/calendar/academic year a date or month belongs to, and how day-level records
    roll up to months and quarters. They link to each other via FISCAL_PERIOD (day-month),
    FY_QUARTER_CODE (month-quarter), and FISCAL_YEAR (month-quarter association within
    the same fiscal year, fanning out months across all quarters of the year), and
    to the academic term tables via TIME_DAY.ACADEMIC_TERM_CODE or TIME_MONTH.ACADEMIC_TERM
    = TERM_CODE.'
  tables:
  - TIME_DAY
  - TIME_MONTH
  - TIME_QUARTER
  comparisons:
  - dimension: Granularity
    detail: TIME_DAY is one row per calendar date (10,000 days); TIME_MONTH is one
      row per fiscal period/month (640 periods); TIME_QUARTER is one row per fiscal
      quarter (144 quarters). Aggregations must pick the granularity the question
      asks for.
  - dimension: Time coverage
    detail: TIME_MONTH covers fiscal years 1996-2035; TIME_QUARTER covers fiscal years
      2000-2035; TIME_DAY covers a 10,000-day window whose fiscal periods overlap
      TIME_MONTH on 480 periods, so day-month joins only match within the overlapping
      range.
  - dimension: Academic linkage
    detail: TIME_DAY carries ACADEMIC_TERM_CODE/ACADEMIC_TERM_DESCRIPTION per day
      (279 distinct term codes) and joins fact tables' TERM_CODE; TIME_MONTH carries
      ACADEMIC_TERM/ACADEMIC_TERM_DESCRIPTION per month (141 terms); TIME_QUARTER
      has no academic term columns and is purely fiscal/payroll-oriented.
  - dimension: Unique attributes
    detail: Only TIME_DAY has CALENDAR_DATE and DAY_OF_WEEK; only TIME_MONTH has CALENDAR_MONTH/CALENDAR_MONTH_NAME,
      period descriptions, and closing/current/previous period flags; only TIME_QUARTER
      has quarter certification open/expected/due dates and current/next/previous/past/future
      quarter flags.
  decision_guide:
    Day-level calendar attributes (calendar date, day of week) or matching a term's days via TERM_CODE = ACADEMIC_TERM_CODE: Use
      TIME_DAY; it is the only day-grain table and carries the academic term code
      per day.
    ? Fiscal-period/month statistics (fiscal period description, calendar month, month
      start/end dates) or rolling days up to months
    : Use TIME_MONTH, joined to TIME_DAY on FISCAL_PERIOD when day-level filters (e.g.
      academic term code of days) are involved.
    Fiscal-quarter attributes (quarter dates, payroll certification deadlines, quarter status flags): Use
      TIME_QUARTER, reached from TIME_MONTH via FY_QUARTER_CODE.
    Attaching fiscal year of a specific calendar date to activity records: Use TIME_DAY.FISCAL_YEAR
      via CALENDAR_DATE or via TERM_CODE = ACADEMIC_TERM_CODE.
column_concepts:
- id: column_concept_term_code
  name: Term Code
  desc: Term code columns in YYYYTT format (e.g. '2025FA', '2019SP', '2021JA', '2012SU';
    TT = FA Fall, SP Spring, JA January/IAP, SU Summer) appearing across term dimension
    and fact tables. They are the universal join key linking subject offerings, textbook
    materials, library reserves, and IAP activities to term attributes.
  columns:
  - ACADEMIC_TERMS.TERM_CODE
  - ACADEMIC_TERMS_ALL.TERM_CODE
  - ACADEMIC_TERM_PARAMETER.TERM_CODE
  - COURSE_CATALOG_SUBJECT_OFFERED.TERM_CODE
  - COURSE_CATALOG_SUBJECT_OFFERED.EFFECTIVE_TERM_CODE
  - SUBJECT_OFFERED.TERM_CODE
  - SUBJECT_OFFERED_SUMMARY.TERM_CODE
  - SUBJECT_SUMMARY.TERM_CODE
  - TIP_DETAIL.TERM_CODE
  - TIP_SUBJECT_OFFERED.TERM_CODE
  - LIBRARY_SUBJECT_OFFERED.TERM_CODE
  - LIBRARY_RESERVE_MATRL_DETAIL.TERM_CODE
  - IAP_SUBJECT_DETAIL.TERM_CODE
  - TIME_DAY.ACADEMIC_TERM_CODE
  comparisons:
  - dimension: Semantics
    TERM_CODE (fact tables): The term in which the offering/material/activity record
      exists
    EFFECTIVE_TERM_CODE (COURSE_CATALOG_SUBJECT_OFFERED): The term from which the
      catalog attributes take effect; may differ from the record's TERM_CODE
    TIME_DAY.ACADEMIC_TERM_CODE: The academic term a calendar day belongs to
  - dimension: Join behavior
    TERM_CODE: Direct equality join between fact tables and ACADEMIC_TERMS/ACADEMIC_TERMS_ALL
    EFFECTIVE_TERM_CODE: Joined to ACADEMIC_TERMS.TERM_CODE when catalog attributes
      must be evaluated as of the term they became effective
    ACADEMIC_TERM_CODE: Joined to term tables' TERM_CODE or to fact tables' TERM_CODE
      for calendar attributes
  decision_guide:
    Filtering subject offerings by the term they are offered in: Use the fact table's
      TERM_CODE.
    Filtering catalog attributes by when they took effect (e.g. regular-term status of the effective term): Use
      COURSE_CATALOG_SUBJECT_OFFERED.EFFECTIVE_TERM_CODE joined to ACADEMIC_TERMS.TERM_CODE.
    Attaching calendar day attributes (day of week, fiscal year) to terms or IAP activities: Use
      TIME_DAY.ACADEMIC_TERM_CODE or TIME_DAY.CALENDAR_DATE = TERM_START_DATE.
    Resolving 'current/previous/upcoming term' references: Use ACADEMIC_TERM_PARAMETER.TERM_CODE
      with TERM_INDICATOR.
- id: column_concept_subject_id
  name: Subject Identifier
  desc: Subject identifier columns shared across catalog, registrar, textbook-program,
    and library tables. SUBJECT_ID is the cross-domain subject join key in 'CODE.NUMBER'
    format (e.g. '18.01'); it appears in every subject-related fact table but at different
    grains and program scopes.
  columns:
  - COURSE_CATALOG_SUBJECT_OFFERED.SUBJECT_ID
  - SUBJECT_OFFERED.SUBJECT_ID
  - SUBJECT_OFFERED_SUMMARY.SUBJECT_ID
  - SUBJECT_SUMMARY.SUBJECT_ID
  - TIP_DETAIL.SUBJECT_ID
  - TIP_SUBJECT_OFFERED.SUBJECT_ID
  - LIBRARY_SUBJECT_OFFERED.SUBJECT_ID
  - LIBRARY_RESERVE_MATRL_DETAIL.SUBJECT_ID
  comparisons:
  - dimension: Format
    detail: SUBJECT_CODE + '.' + SUBJECT_NUMBER in all tables, e.g. '18.01'; can be
      reconstructed via CONCAT(SUBJECT_CODE, '.', SUBJECT_NUMBER)
  - dimension: Grain difference
    detail: 'COURSE_CATALOG_SUBJECT_OFFERED: catalog offering scope, one SUBJECT_ID
      may repeat across terms/academic years; SUBJECT_OFFERED: section scope, same
      SUBJECT_ID appears once per section; SUBJECT_SUMMARY / SUBJECT_OFFERED_SUMMARY:
      subject scope per term, one row per SUBJECT_ID per term; TIP and LIBRARY tables:
      program scope, SUBJECT_ID present only if the subject is tracked by that program'
  decision_guide:
    Joining textbook materials or library reserves to catalog/summary subject attributes: Match
      on SUBJECT_ID (plus TERM_CODE when term scope matters).
    Joining catalog offerings that only expose SUBJECT_CODE/SUBJECT_NUMBER to SUBJECT_ID-based tables: Reconstruct
      SUBJECT_ID as CONCAT(SUBJECT_CODE, '.', SUBJECT_NUMBER).
    Counting distinct subjects per term/department: Use COUNT(DISTINCT SUBJECT_ID)
      on a subject-grain table (SUBJECT_SUMMARY or SUBJECT_OFFERED_SUMMARY) to avoid
      section/program duplication.
- id: column_concept_department_name
  name: Department Name
  desc: Department name columns across subject offering, catalog, lookup, employee,
    and library reserve instructor tables. Two academic naming conventions exist (DEPARTMENT_NAME
    vs OFFER_DEPT_NAME) with the same academic value domain; LIBRARY_COURSE_INSTRUCTOR.DEPARTMENT
    also holds academic departments but in a 'COURSE_NUMBER - Department Name' prefixed
    format (e.g. '18 - Mathematics'); EMPLOYEE_DIRECTORY.DEPARTMENT_NAME shares the
    column name but holds the HR organizational unit name (different value domain).
    Choosing the right one depends on the table family, the value format, whether
    the department is the catalog owner or the actual offering department, and whether
    an academic or HR department is meant.
  columns:
  - COURSE_CATALOG_SUBJECT_OFFERED.DEPARTMENT_NAME
  - SUBJECT_SUMMARY.DEPARTMENT_NAME
  - SUBJECT_OFFERED.OFFER_DEPT_NAME
  - SUBJECT_OFFERED_SUMMARY.OFFER_DEPT_NAME
  - TIP_SUBJECT_OFFERED.OFFER_DEPT_NAME
  - LIBRARY_SUBJECT_OFFERED.OFFER_DEPT_NAME
  - SIS_DEPARTMENT.DEPARTMENT_NAME
  - STUDENT_DEPARTMENT.DEPARTMENT_NAME
  - SIS_COURSE_DESCRIPTION.DEPARTMENT_NAME
  - SIS_SUBJECT_CODE.DEPARTMENT_NAME
  - EMPLOYEE_DIRECTORY.DEPARTMENT_NAME
  - LIBRARY_COURSE_INSTRUCTOR.DEPARTMENT
  - MIT_STUDENT_DIRECTORY.DEPARTMENT_NAME
  - SE_PERSON.ORGANIZATION
  comparisons:
  - dimension: Naming convention
    detail: DEPARTMENT_NAME is used by catalog/summary tables (COURSE_CATALOG_SUBJECT_OFFERED,
      SUBJECT_SUMMARY), department/course lookup tables, and the student directory
      (MIT_STUDENT_DIRECTORY); OFFER_DEPT_NAME is used by offering/program tables
      (SUBJECT_OFFERED, SUBJECT_OFFERED_SUMMARY, TIP_SUBJECT_OFFERED, LIBRARY_SUBJECT_OFFERED)
      and denotes the department that actually offers the subject; LIBRARY_COURSE_INSTRUCTOR
      uses the plain column name DEPARTMENT for the course's academic department;
      SE_PERSON uses ORGANIZATION for the person's organizational unit
  - dimension: Value format
    detail: Catalog, summary, offering, student-directory, and lookup tables store
      plain department names (e.g. 'Mathematics', 'Chemistry', 'Electrical Eng & Computer
      Sci'); LIBRARY_COURSE_INSTRUCTOR.DEPARTMENT stores a 'COURSE_NUMBER - Department
      Name' prefixed format (e.g. '18 - Mathematics', '06 - Electrical Eng & Computer
      Sci'), with some unprefixed values (e.g. 'Architecture'), so it is not directly
      comparable to plain-name columns without stripping the prefix
  - dimension: Academic vs HR/organization value domain
    detail: Catalog, summary, offering, library, student-directory, and lookup tables
      share the academic department domain; EMPLOYEE_DIRECTORY.DEPARTMENT_NAME is
      the HR organizational unit name and has a different domain (e.g. 'Lincoln Laboratory',
      'Department of Physics'), where some values coincide with academic names but
      many do not, and some carry a 'Department of ...' prefix; SE_PERSON.ORGANIZATION
      holds organizational unit names that may use different naming variants than
      the academic domain for the same unit (e.g. 'Electrical Engineering-Computer
      Science' vs the academic 'Electrical Eng & Computer Sci'), so equality filters
      across the two conventions must use each table's own variant
  - dimension: Companion code column
    detail: Catalog/summary tables carry DEPARTMENT_CODE joining SIS_DEPARTMENT.DEPARTMENT_CODE;
      offering/program tables carry OFFER_DEPT_CODE joining SIS_DEPARTMENT.DEPARTMENT_CODE
      or STUDENT_DEPARTMENT.DEPARTMENT_CODE; MIT_STUDENT_DIRECTORY carries DEPARTMENT
      (the academic department code) joining SIS_DEPARTMENT.DEPARTMENT_CODE, which
      is the reliable join key instead of the name; LIBRARY_COURSE_INSTRUCTOR has
      no department code column, only the prefixed name text; EMPLOYEE_DIRECTORY carries
      DEPARTMENT_NUMBER (HR department number) and SE_PERSON carries no department
      code, neither joining to SIS_DEPARTMENT.DEPARTMENT_CODE
  decision_guide:
    Filtering subjects by department in catalog or summary analysis: Use COURSE_CATALOG_SUBJECT_OFFERED.DEPARTMENT_NAME
      or SUBJECT_SUMMARY.DEPARTMENT_NAME.
    Filtering by department in section-level, textbook-program, or library analysis: Use
      the OFFER_DEPT_NAME column of SUBJECT_OFFERED / SUBJECT_OFFERED_SUMMARY / TIP_SUBJECT_OFFERED
      / LIBRARY_SUBJECT_OFFERED.
    Joining fact tables to department dimension attributes (school, full name, degree-granting): 'Prefer
      code joins: DEPARTMENT_CODE / OFFER_DEPT_CODE = SIS_DEPARTMENT.DEPARTMENT_CODE;
      name equality joins are used when codes are unavailable.'
    Matching departments across a DEPARTMENT_NAME table and an OFFER_DEPT_NAME table: The
      values are directly comparable (same academic name domain), e.g. joining SUBJECT_SUMMARY.DEPARTMENT_NAME
      to TIP_SUBJECT_OFFERED.OFFER_DEPT_NAME.
    ? Filtering employees by their HR organizational unit (e.g. names containing 'Department',
      or HR units like 'Political Science')
    : Use EMPLOYEE_DIRECTORY.DEPARTMENT_NAME; do not join it to SIS_DEPARTMENT.DEPARTMENT_CODE,
      and pair it with DEPARTMENT_NUMBER for HR grouping.
    Filtering by department in section-level, textbook-program, or library subject analysis: Use
      the OFFER_DEPT_NAME column of SUBJECT_OFFERED / SUBJECT_OFFERED_SUMMARY / TIP_SUBJECT_OFFERED
      / LIBRARY_SUBJECT_OFFERED.
    Filtering library reserve course instructors by academic department or library unit: Use
      LIBRARY_COURSE_INSTRUCTOR.DEPARTMENT with the prefixed value format (e.g. '18
      - Mathematics'); do not compare it directly to plain department-name columns.
    Filtering students by their academic department: Use MIT_STUDENT_DIRECTORY.DEPARTMENT
      (code) joined to SIS_DEPARTMENT.DEPARTMENT_CODE for reliable matching, or MIT_STUDENT_DIRECTORY.DEPARTMENT_NAME
      for direct name filters; the name shares the academic domain with SIS_DEPARTMENT.DEPARTMENT_NAME.
    Filtering a person master (SE_PERSON) record by organizational unit such as an academic department: Use
      SE_PERSON.ORGANIZATION with its own naming variant (e.g. 'Electrical Engineering-Computer
      Science'); do not equate it directly to MIT_STUDENT_DIRECTORY.DEPARTMENT_NAME
      or SIS_DEPARTMENT.DEPARTMENT_NAME, which use the academic variant (e.g. 'Electrical
      Eng & Computer Sci').
- columns:
  - SUBJECT_OFFERED.NUM_ENROLLED_STUDENTS
  - SUBJECT_OFFERED_SUMMARY.NUM_ENROLLED_STUDENTS
  - SUBJECT_SUMMARY.SUBJECT_ENROLLMENT_NUMBER
  - TIP_SUBJECT_OFFERED.NUM_ENROLLED_STUDENTS
  - LIBRARY_SUBJECT_OFFERED.NUM_ENROLLED_STUDENTS
  - SUBJECT_OFFERED.SUBJECT_ENROLLMENT_NUMBER
  - SUBJECT_OFFERED_SUMMARY.SUBJECT_ENROLLMENT_NUMBER
  comparisons:
  - dimension: Measure meaning
    detail: NUM_ENROLLED_STUDENTS is the headcount of students enrolled (present in
      SUBJECT_OFFERED at section grain, SUBJECT_OFFERED_SUMMARY at subject grain,
      and in TIP/LIBRARY program snapshots); SUBJECT_ENROLLMENT_NUMBER is the official
      subject enrollment number recorded by the registrar (SUBJECT_SUMMARY, SUBJECT_OFFERED,
      SUBJECT_OFFERED_SUMMARY)
  - dimension: Grain
    detail: SUBJECT_OFFERED.NUM_ENROLLED_STUDENTS is per section; SUBJECT_OFFERED_SUMMARY.NUM_ENROLLED_STUDENTS
      is per subject per term; SUBJECT_SUMMARY.SUBJECT_ENROLLMENT_NUMBER is the final
      subject-level enrollment with weekly/credit/listener breakdowns available in
      sibling columns
  - dimension: Program scope
    detail: TIP_SUBJECT_OFFERED and LIBRARY_SUBJECT_OFFERED enrollment values are
      snapshots within the textbook-program and library-reserve scopes respectively
      and may not cover all subjects
  decision_guide:
    Questions about official subject enrollment (e.g. 'subject enrollment number greater than 10'): Use
      SUBJECT_SUMMARY.SUBJECT_ENROLLMENT_NUMBER.
    Questions about number of enrolled students per subject offering or per department totals: Use
      NUM_ENROLLED_STUDENTS from SUBJECT_OFFERED_SUMMARY (subject grain) or SUBJECT_OFFERED
      (section grain, needs aggregation).
    Questions about enrollment of subjects within the textbook program or library reserve scope: Use
      TIP_SUBJECT_OFFERED.NUM_ENROLLED_STUDENTS or LIBRARY_SUBJECT_OFFERED.NUM_ENROLLED_STUDENTS
      respectively.
    Questions needing enrollment timing (first week, fifth week) or credit vs listener splits: Use
      SUBJECT_SUMMARY's SUBJECT_ENROLLMENT_FIRST_WEEK / FIFTH_WEEK and *_CREDIT /
      *_LISTEN columns.
  desc: 'Enrollment measure columns across subject offering, summary, textbook-program,
    and library tables. Two families exist: NUM_ENROLLED_STUDENTS (student headcount
    snapshots) and SUBJECT_ENROLLMENT_NUMBER (official registrar enrollment), at section,
    subject, or program scope.'
  id: column_concept_enrollment_measures
  name: Enrollment Measures
- columns:
  - COURSE_CATALOG_SUBJECT_OFFERED.TOTAL_UNITS
  - SUBJECT_SUMMARY.TOTAL_UNITS
  - SUBJECT_OFFERED_SUMMARY.TOTAL_UNITS
  - CIS_COURSE_CATALOG.TOTAL_UNITS
  - DRUPAL_COURSE_CATALOG.TOTAL_UNITS
  comparisons:
  - dimension: Source process
    detail: COURSE_CATALOG_SUBJECT_OFFERED.TOTAL_UNITS is the catalog-declared unit
      value per offering; SUBJECT_SUMMARY.TOTAL_UNITS and SUBJECT_OFFERED_SUMMARY.TOTAL_UNITS
      are registrar subject-level values; CIS/DRUPAL catalog feeds carry their own
      copies
  - dimension: Companion unit columns
    detail: All these tables also expose LECTURE_UNITS, LAB_UNITS, and preparation
      units (PREPARATION_UNITS except SUBJECT_SUMMARY which uses PREP_UNITS); DESIGN_UNITS
      exists in COURSE_CATALOG_SUBJECT_OFFERED, SUBJECT_SUMMARY, CIS and DRUPAL catalogs
      but not in SUBJECT_OFFERED_SUMMARY
  - dimension: Variability flag
    detail: COURSE_CATALOG_SUBJECT_OFFERED.IS_VARIABLE_UNITS marks subjects whose
      units vary; analyses of fixed-unit statistics typically filter IS_VARIABLE_UNITS='N'
  decision_guide:
    ? Unit statistics (avg/stddev/variance/geometric mean) over catalog offerings,
      optionally split by lecture/lab/design or filtered by variable-units flag
    : Use COURSE_CATALOG_SUBJECT_OFFERED.TOTAL_UNITS with its companion unit columns.
    Unit statistics tied to actual enrollment records or subject groups per term: Use
      SUBJECT_SUMMARY.TOTAL_UNITS.
    Unit statistics at subject-offering rollup level with offering department/school: Use
      SUBJECT_OFFERED_SUMMARY.TOTAL_UNITS.
    Fixed-unit analyses excluding variable-unit subjects: Filter COURSE_CATALOG_SUBJECT_OFFERED.IS_VARIABLE_UNITS
      = 'N'.
  desc: Total credit unit columns replicated across catalog and registrar subject
    tables. They represent the same business quantity (total credit units of a subject)
    but come from different processes and pair with different companion unit columns.
  id: column_concept_total_units
  name: Total Credit Units
- columns:
  - TIP_DETAIL.TIP_MATERIAL_STATUS_KEY
  - TIP_MATERIAL_STATUS.TIP_MATERIAL_STATUS_KEY
  - LIBRARY_RESERVE_MATRL_DETAIL.LIBRARY_MATERIAL_STATUS_KEY
  - LIBRARY_MATERIAL_STATUS.LIBRARY_MATERIAL_STATUS_KEY
  comparisons:
  - dimension: Program
    detail: TIP_MATERIAL_STATUS_KEY belongs to the textbook program (decoded by TIP_MATERIAL_STATUS);
      LIBRARY_MATERIAL_STATUS_KEY belongs to library reserve processing (decoded by
      LIBRARY_MATERIAL_STATUS). The two key domains are independent and must not be
      joined to each other.
  - dimension: Value domains
    detail: 'TIP statuses: ''RQ'' = Required, ''EO'' = Electronic options, ''RC''
      = Recommended, ''PC'' = Val-u option, ''BR'' = Bookstore recommends, ''CL''
      = Go to class first, ''NM'' = Course has no materials, ''U'' = Unknown, plus
      ''NL''/''NS''/''NB''/blank keys with NULL descriptions. Library statuses: ''U''
      = Unknown, ''R'' = NULL description, ''N'' = Non-Required Course Material, ''O''
      = Reserve only, ''X'' = No Required Textbook, ''Y'' = Required Course Material.
      Both domains contain ''U'' but it means ''Unknown'' in each program independently.'
  - dimension: Usage pattern
    detail: Fact-side filtering uses the key columns on TIP_DETAIL / LIBRARY_RESERVE_MATRL_DETAIL
      directly; the lookup tables provide human-readable status text when needed.
      Grouping by the description column instead of the key merges statuses with NULL
      or identical descriptions.
  - dimension: Cross-domain equality risk
    detail: Some warehouse analyses equate TIP_MATERIAL_STATUS_KEY with LIBRARY_MATERIAL_STATUS_KEY
      to attach per-status statistics across the two programs. Because the value domains
      are independent, such an equality only matches on coincidental code overlap
      (e.g. 'U') and carries semantic risk; results should be interpreted as code-level
      matching, not as a true business relationship between textbook status and library
      reserve status.
  decision_guide:
    Questions about required or optional textbooks: Filter TIP_DETAIL.TIP_MATERIAL_STATUS_KEY
      IN ('RQ','EO'); 'RQ' for required only.
    Questions about library reserve material status: Filter/group LIBRARY_RESERVE_MATRL_DETAIL.LIBRARY_MATERIAL_STATUS_KEY
      (e.g. 'U' Unknown, 'Y' Required Course Material); decode text via LIBRARY_MATERIAL_STATUS.
    Questions needing status description text rather than codes: Join TIP_MATERIAL_STATUS
      or LIBRARY_MATERIAL_STATUS on the respective key; note that description columns
      contain NULLs for some keys.
    Matching reserve materials to textbook materials: Match via SUBJECT_ID + TERM_CODE
      (or TIP_MATERIAL_KEY paths) between TIP_DETAIL and LIBRARY_RESERVE_MATRL_DETAIL,
      never by equating the two status key columns.
    Questions about required textbooks or textbook material statuses: Filter/group
      TIP_DETAIL.TIP_MATERIAL_STATUS_KEY (e.g. 'RQ' for Required); decode text via
      TIP_MATERIAL_STATUS.
  desc: 'Material status key columns of the textbook program (TIP) and library reserve
    program. Both are coded status references decoded by their own lookup tables (key
    value equals code value), with independent value domains: TIP statuses (''RQ''
    Required, ''EO'' Electronic options, ''RC'' Recommended, ''PC'' Val-u option,
    ''BR'' Bookstore recommends, ''CL'' Go to class first, ''NM'' Course has no materials,
    ''U'' Unknown, plus NULL-description keys) vs library reserve statuses (''U''
    Unknown, ''R'' null description, ''N'' Non-Required Course Material, ''O'' Reserve
    only, ''X'' No Required Textbook, ''Y'' Required Course Material).'
  id: column_concept_material_status_key
  name: Material Status Key
- columns:
  - ACADEMIC_TERMS.ACADEMIC_YEAR
  - ACADEMIC_TERMS_ALL.ACADEMIC_YEAR
  - COURSE_CATALOG_SUBJECT_OFFERED.ACADEMIC_YEAR
  - TIME_DAY.ACADEMIC_YEAR
  - TIME_DAY.FISCAL_YEAR
  - TIME_DAY.CALENDAR_YEAR
  - TIME_MONTH.ACADEMIC_YEAR
  - TIME_MONTH.FISCAL_YEAR
  - TIME_MONTH.CALENDAR_YEAR
  - TIME_MONTH.FINANCIAL_AID_YEAR
  - TIME_QUARTER.FISCAL_YEAR
  - TIME_QUARTER.CALENDAR_YEAR
  - ACADEMIC_TERMS.FINANCIAL_AID_YEAR
  - ACADEMIC_TERMS_ALL.FINANCIAL_AID_YEAR
  - ACADEMIC_TERMS.DEGREE_YEAR
  comparisons:
  - dimension: Year system
    detail: ACADEMIC_YEAR is the academic year a term/offering/date belongs to; FISCAL_YEAR
      is the institute fiscal year (MIT fiscal year starts in July, so a fiscal year
      spans two calendar years); CALENDAR_YEAR is the natural calendar year; FINANCIAL_AID_YEAR
      is the aid year a term/month maps to; DEGREE_YEAR is the degree-conferral year
      a term maps to. These year systems do not always coincide for the same term
      or date.
  - dimension: Location
    detail: 'Term tables (ACADEMIC_TERMS/ACADEMIC_TERMS_ALL) carry academic/financial-aid/degree
      years per term; COURSE_CATALOG_SUBJECT_OFFERED carries its own ACADEMIC_YEAR
      per catalog record; the time dimension tables carry year systems at their own
      granularity: TIME_DAY (fiscal/calendar/academic year per day), TIME_MONTH (fiscal/calendar/academic/aid
      year per month), TIME_QUARTER (fiscal/calendar year per quarter, no academic
      year).'
  - dimension: Grouping behavior
    detail: Grouping offerings by catalog ACADEMIC_YEAR vs joining to term tables'
      ACADEMIC_YEAR can yield different groupings when a catalog record's TERM_CODE
      and ACADEMIC_YEAR disagree; grouping time-dimension rows by FISCAL_YEAR vs CALENDAR_YEAR
      yields different period assignments for dates between January and June.
  decision_guide:
    Yearly statistics over subject offerings: Group by COURSE_CATALOG_SUBJECT_OFFERED.ACADEMIC_YEAR
      when the question says 'academic year YYYY' for offerings; join term tables
      for term-status filters.
    Yearly statistics over terms themselves (e.g. degree year geometric means, financial aid year partitions): Use
      ACADEMIC_TERMS / ACADEMIC_TERMS_ALL year columns (DEGREE_YEAR, FINANCIAL_AID_YEAR).
    Matching IAP activity dates to academic years via calendar: Use TIME_DAY.FISCAL_YEAR
      or TIME_DAY.ACADEMIC_YEAR through TERM_CODE = ACADEMIC_TERM_CODE.
    Windowed running sums partitioned by aid year: Use ACADEMIC_TERMS_ALL.FINANCIAL_AID_YEAR
      as the partition key.
    Fiscal-year or calendar-month statistics over months/days: Use TIME_MONTH.FISCAL_YEAR
      / TIME_MONTH.CALENDAR_YEAR (month grain) or TIME_DAY.CALENDAR_YEAR (day grain),
      joined on FISCAL_PERIOD when both grains are needed.
  desc: 'Year columns across term, catalog, and time dimension tables representing
    different year systems: academic year, fiscal year, financial aid year, and degree
    year. Selecting the correct year system is essential for yearly grouping and partitioning.'
  id: column_concept_year_columns
  name: Academic and Fiscal Year Columns
- columns:
  - SPACE_UNIT.SPACE_UNIT_KEY
  - SPACE_UNIT2.SPACE_UNIT_KEY
  - SPACE_DETAIL.SPACE_UNIT_KEY
  comparisons:
  - dimension: Role
    differences: In SPACE_UNIT and SPACE_UNIT2 it is the primary identity of the space
      unit dimension; in SPACE_DETAIL it is a foreign key assigning each room to a
      space unit.
  - dimension: Organization linkage
    differences: Only SPACE_UNIT.SPACE_UNIT_KEY rows carry FCLT_ORGANIZATION_KEY,
      so joining SPACE_DETAIL through SPACE_UNIT (not SPACE_UNIT2) reaches organization
      attributes.
  - dimension: Coverage
    differences: SPACE_DETAIL references 66 distinct space unit keys; SPACE_UNIT covers
      all of them plus unused units, SPACE_UNIT2 is a subset of SPACE_UNIT.
  decision_guide:
    Grouping room counts by space unit with organization attributes: Join SPACE_DETAIL.SPACE_UNIT_KEY
      to SPACE_UNIT.SPACE_UNIT_KEY, then to FCLT_ORGANIZATION via SPACE_UNIT.FCLT_ORGANIZATION_KEY.
    Space unit name lookup without organization context: Either SPACE_UNIT or SPACE_UNIT2
      resolves SPACE_DETAIL.SPACE_UNIT_KEY to a name; prefer SPACE_UNIT for full coverage.
  desc: Space unit key columns identifying the organizational space-assignment unit
    across the space dimension and fact tables. SPACE_UNIT_KEY is the join key linking
    SPACE_DETAIL room rows to space unit identity (name/code) and, through SPACE_UNIT,
    to the owning facilities organization.
  id: column_concept_space_unit_key
  name: Space Unit Key
- columns:
  - SPACE_DETAIL.BUILDING_ROOM
  - FCLT_ROOMS.BUILDING_ROOM
  - ZPM_ROOMS_LOAD.BUILDING_ROOM
  comparisons:
  - dimension: Table perspective
    differences: In SPACE_DETAIL it identifies a room within a space-unit assignment
      row (counting rows gives rooms per space unit/building); in FCLT_ROOMS it identifies
      a room within the facilities inventory with use classifications and organization
      occupancy; in ZPM_ROOMS_LOAD it identifies a room within the space-planning
      load feed with floor, space usage text, and access level.
  - dimension: Coverage
    differences: FCLT_ROOMS has more distinct building-room values (9,872) than SPACE_DETAIL
      (9,332); only about 2,666 values match textually between the two tables, so
      cross-table room matching on BUILDING_ROOM is unreliable. ZPM_ROOMS_LOAD holds
      10,000 room rows from the space-planning feed.
  - dimension: Companion columns
    differences: SPACE_DETAIL pairs it with ROOM_NUMBER, ROOM_SQUARE_FOOTAGE (sq ft),
      ROOM_COUNTER; FCLT_ROOMS pairs it with ROOM, ROOM_FULL_NAME, AREA (sq m), use
      descriptions; ZPM_ROOMS_LOAD pairs it with BUILDING_COMPONENT, FLOOR (text,
      can be labels like 'G9'), SPACE_USAGE, ACCESS_LEVEL.
  decision_guide:
    Counting rooms per space unit or per building: Use SPACE_DETAIL.BUILDING_ROOM
      with COUNT, grouped by SPACE_UNIT_KEY/BUILDING_KEY.
    Room-level analysis with usage classification or square-meter area: Use FCLT_ROOMS.BUILDING_ROOM
      alongside MAJOR_USE_DESC/AREA.
    Matching the same physical room across space assignment and facilities inventory: Do
      not rely on BUILDING_ROOM text equality alone (low overlap); prefer key-based
      joins within each table family.
    Room-level analysis by floor, space usage text, or access level with space unit / HR org unit linkage: Use
      ZPM_ROOMS_LOAD.BUILDING_ROOM alongside FLOOR/SPACE_USAGE/ACCESS_LEVEL.
  desc: Combined building-room identifier columns (e.g. '1-080') appearing in both
    the space assignment fact table and the facilities room inventory. They identify
    the same physical room concept but come from different business processes with
    different coverage and companion measures.
  id: column_concept_building_room
  name: Building Room Identifier
- columns:
  - FCLT_ORGANIZATION.FCLT_ORGANIZATION_KEY
  - SPACE_UNIT.FCLT_ORGANIZATION_KEY
  - FCLT_ROOMS.FCLT_ORGANIZATION_KEY
  - FCLT_ROOMS.FCLT_MINOR_ORGANIZATION_KEY
  - FAC_ORGANIZATION.ORGANIZATION_KEY
  - FAC_ROOMS.ORGANIZATION_KEY
  comparisons:
  - dimension: Key family
    differences: 'FCLT_ORGANIZATION_KEY (FCLT_* family) and ORGANIZATION_KEY (FAC_*
      family) share the same value domain but must be joined within their own family:
      SPACE_UNIT/FCLT_ROOMS use FCLT_ORGANIZATION_KEY, FAC_ROOMS uses ORGANIZATION_KEY.'
  - dimension: Primary vs secondary occupancy
    differences: FCLT_ROOMS.FCLT_ORGANIZATION_KEY is the primary occupying organization;
      FCLT_ROOMS.FCLT_MINOR_ORGANIZATION_KEY is the secondary organization, both referencing
      FCLT_ORGANIZATION.
  - dimension: Dimension vs foreign key
    differences: FCLT_ORGANIZATION.FCLT_ORGANIZATION_KEY and FAC_ORGANIZATION.ORGANIZATION_KEY
      are dimension identities; the others are foreign keys attributing space units
      or rooms to organizations.
  decision_guide:
    Attributing space units to organizations (e.g. filtering by organization level): Join
      SPACE_UNIT.FCLT_ORGANIZATION_KEY to FCLT_ORGANIZATION.FCLT_ORGANIZATION_KEY.
    Attributing rooms to their occupying organization in the FCLT_* family: Use FCLT_ROOMS.FCLT_ORGANIZATION_KEY
      (primary) or FCLT_MINOR_ORGANIZATION_KEY (secondary) against FCLT_ORGANIZATION.
    Room organization attribution inside the FAC_* family: Use FAC_ROOMS.ORGANIZATION_KEY
      against FAC_ORGANIZATION.ORGANIZATION_KEY.
  desc: Facility organization key columns attributing space units and rooms to organizations
    in the hierarchical organization tree. Two naming conventions exist across table
    families (FCLT_ORGANIZATION_KEY in FCLT_*/SPACE_* tables vs ORGANIZATION_KEY in
    FAC_* tables) with the same value domain.
  id: column_concept_facility_organization_key
  name: Facility Organization Key
- columns:
  - CIS_HASS_ATTRIBUTE.HASS_ATTRIBUTE
  - COURSE_CATALOG_SUBJECT_OFFERED.HASS_ATTRIBUTE
  - COURSE_CATALOG_SUBJECT_OFFERED.HASS_ATTRIBUTE_DESC
  - CIS_COURSE_CATALOG.HASS_ATTRIBUTE
  - CIS_COURSE_CATALOG.HASS_ATTRIBUTE_DESC
  - DRUPAL_COURSE_CATALOG.HASS_ATTRIBUTE
  - DRUPAL_COURSE_CATALOG.HASS_ATTRIBUTE_DESC
  - CIS_HASS_ATTRIBUTE.DESCRIPTION_ON_FORM
  - CIS_HASS_ATTRIBUTE.DESCRIPTION_IN_BULLETIN
  comparisons:
  - dimension: Role
    detail: CIS_HASS_ATTRIBUTE.HASS_ATTRIBUTE is the lookup key; COURSE_CATALOG_SUBJECT_OFFERED/CIS_COURSE_CATALOG/DRUPAL_COURSE_CATALOG
      carry HASS_ATTRIBUTE as the coded foreign key on each subject record
  - dimension: Description source
    detail: 'Catalog tables embed HASS_ATTRIBUTE_DESC (equal to the registration-form
      wording); the lookup offers two distinct variants: DESCRIPTION_ON_FORM (''HASS
      Arts'', ''Arts + Humanities'') and DESCRIPTION_IN_BULLETIN (''HASS-A'', ''HASS-A,
      HASS-H''). Questions mentioning ''as shown on the form'' or ''in the bulletin''
      require the lookup columns'
  - dimension: Population coverage
    detail: COURSE_CATALOG_SUBJECT_OFFERED populates HASS_ATTRIBUTE for a subset of
      subjects (e.g. HA, HA,HH, HE, HH, HS); DRUPAL_COURSE_CATALOG populates fewer
      codes (HS, HE, HH); CIS_COURSE_CATALOG has no populated HASS_ATTRIBUTE values,
      so HASS analyses use COURSE_CATALOG_SUBJECT_OFFERED
  - dimension: Uniqueness
    detail: 'In CIS_HASS_ATTRIBUTE a code can appear twice (once per CIS_ATTRIBUTE_GROUP:
      ''H'' for students entering Fall 2010 or later, ''G'' for prior students, e.g.
      ''HE''), so joining on HASS_ATTRIBUTE alone may duplicate rows'
  decision_guide:
    Which subjects carry a given HASS attribute, or HASS-grouped unit/offering statistics: Use
      COURSE_CATALOG_SUBJECT_OFFERED.HASS_ATTRIBUTE (the only catalog feed with broadly
      populated HASS codes), joined to CIS_HASS_ATTRIBUTE for decoding.
    HASS attribute description as shown on the registration form: Use CIS_HASS_ATTRIBUTE.DESCRIPTION_ON_FORM
      (or the equivalent catalog-embedded HASS_ATTRIBUTE_DESC).
    HASS attribute description as printed in the bulletin: Use CIS_HASS_ATTRIBUTE.DESCRIPTION_IN_BULLETIN;
      this variant exists only in the lookup table.
    HASS attribute meaning for students entering before vs. Fall 2010 or later: Filter
      CIS_HASS_ATTRIBUTE.CIS_ATTRIBUTE_GROUP ('G' vs 'H') to avoid duplicate rows
      per code.
  desc: 'HASS (Humanities, Arts, and Social Sciences) attribute code and description
    columns. The code columns appear in the three course catalog feeds and in the
    CIS_HASS_ATTRIBUTE lookup; description columns exist in three variants: the catalog-embedded
    HASS_ATTRIBUTE_DESC, the lookup''s DESCRIPTION_ON_FORM (registration-form wording),
    and DESCRIPTION_IN_BULLETIN (short bulletin wording). Selecting the right description
    variant depends on the wording requested by the question.'
  id: column_concept_hass_attribute
  name: HASS Attribute Code and Descriptions
- id: column_concept_building_type_site
  name: Building Type and Site Classification
  desc: 'Building classification columns replicated across the current and historical
    building tables of both table families: BUILDING_TYPE (''ACADEMIC'', ''SERVICE'',
    ''RESIDENT'') and SITE (''MIT'', ''BATES'', ''LINC'', ''BOS'', etc.). They carry
    the same value domain but differ in time semantics: the building-table columns
    are the current classification, while the history-table columns are the classification
    recorded at each fiscal period, so filtering by one versus the other can select
    different building sets.'
  columns:
  - FCLT_BUILDING.BUILDING_TYPE
  - FCLT_BUILDING.SITE
  - FCLT_BUILDING_HIST.BUILDING_TYPE
  - FCLT_BUILDING_HIST.SITE
  - FCLT_BUILDING_HIST_1.BUILDING_TYPE
  - FCLT_BUILDING_HIST_1.SITE
  - FAC_BUILDING.BUILDING_TYPE
  - FAC_BUILDING.SITE
  comparisons:
  - dimension: Time semantics
    differences: FCLT_BUILDING/FAC_BUILDING columns hold the current classification
      (one value per building); FCLT_BUILDING_HIST(_1) columns hold the classification
      per fiscal period, so a building can appear with different types/sites across
      its history rows.
  - dimension: Row multiplicity when filtering
    differences: Filtering on the history columns multiplies result rows by the number
      of fiscal periods per building; filtering on the building-table columns keeps
      one row per building.
  - dimension: Table family
    differences: FCLT_* columns join the FCLT_* family via FCLT_BUILDING_KEY; FAC_BUILDING
      columns join the FAC_* family via FAC_BUILDING_KEY.
  decision_guide:
    Questions about current academic/residential buildings or buildings at a site (e.g. 'academic buildings at MIT'): 'Prefer
      FCLT_BUILDING.BUILDING_TYPE and FCLT_BUILDING.SITE: one row per building, no
      period duplication.'
    ? Questions explicitly referencing building history records or per-fiscal-period
      classification (e.g. 'buildings that were academic in the history', history-based
      room counts)
    : Use FCLT_BUILDING_HIST.BUILDING_TYPE / FCLT_BUILDING_HIST.SITE so the filter
      applies to each historical record.
    Same classification questions inside the FAC_* family: Use FAC_BUILDING.BUILDING_TYPE
      / FAC_BUILDING.SITE.
- id: column_concept_num_of_rooms
  name: Building Number of Rooms
  desc: NUM_OF_ROOMS columns recording how many rooms a building contains, replicated
    across the current and historical building tables of both families. The building-table
    columns hold the current room count (one value per building); the history-table
    columns hold the room count at each fiscal period, used for room-count statistics
    (average, range, variance, minimum) across a building's history records.
  columns:
  - FCLT_BUILDING.NUM_OF_ROOMS
  - FCLT_BUILDING_HIST.NUM_OF_ROOMS
  - FCLT_BUILDING_HIST_1.NUM_OF_ROOMS
  - FAC_BUILDING.NUM_OF_ROOMS
  comparisons:
  - dimension: Time semantics
    differences: FCLT_BUILDING/FAC_BUILDING NUM_OF_ROOMS is the current count; FCLT_BUILDING_HIST(_1)
      NUM_OF_ROOMS is the per-fiscal-period count, so aggregates over it (AVG/MIN/MAX/VARIANCE)
      describe the building's history records, not its current state.
  - dimension: Aggregation behavior
    differences: Grouping by building over the history column yields one value per
      fiscal period row; over the building column each building contributes exactly
      one value.
  - dimension: Alternative room counting
    differences: Instead of these precomputed attributes, room counts can also be
      derived by COUNT over FCLT_ROOMS rows per FCLT_BUILDING_KEY or over SPACE_DETAIL
      rows per BUILDING_KEY; the precomputed columns and the counted values may differ.
  decision_guide:
    Questions referencing 'the number of rooms in building history records' or statistics of room counts over history: Use
      FCLT_BUILDING_HIST.NUM_OF_ROOMS.
    Questions about a building's current room count or size filters like 'buildings with more than 100 rooms': Use
      FCLT_BUILDING.NUM_OF_ROOMS.
    Exact room inventory counts (per use, per organization, per floor): Count FCLT_ROOMS
      rows instead of using the precomputed NUM_OF_ROOMS attribute.
- id: column_concept_assignable_area
  name: Assignable Area Measures
  desc: 'Assignable-area measure columns at different granularity levels and time
    semantics: building-level current and per-fiscal-period assignable area, floor-level
    assignable area, and the space-domain assignable square footage. All FCLT_*/FAC_*
    columns are in square meters; BUILDINGS.BLDG_ASSIGNABLE_SQUARE_FOOTAGE is in square
    feet. Choosing the right column determines whether the measure is a building total,
    a floor total, a historical value, or a space-assignment figure.'
  columns:
  - FCLT_BUILDING.ASSIGNABLE_AREA
  - FCLT_BUILDING_HIST.ASSIGNABLE_AREA
  - FCLT_BUILDING_HIST_1.ASSIGNABLE_AREA
  - FCLT_FLOOR.ASSIGNABLE_AREA
  - FCLT_FLOOR_HIST.ASSIGNABLE_AREA
  - FAC_BUILDING.ASSIGNABLE_AREA
  - FAC_FLOOR.ASSIGNABLE_AREA
  - BUILDINGS.BLDG_ASSIGNABLE_SQUARE_FOOTAGE
  comparisons:
  - dimension: Granularity
    differences: Building columns give one assignable-area total per building (per
      fiscal period for history); floor columns give the assignable area of each floor;
      summing floor assignable areas per building approximates but may not equal the
      building-level value.
  - dimension: Time semantics
    differences: FCLT_BUILDING/FAC_BUILDING are current values; FCLT_BUILDING_HIST(_1)
      and FCLT_FLOOR_HIST carry per-fiscal-period values used for stddev/variance/sum
      across history records.
  - dimension: Units
    differences: All FCLT_*/FAC_* assignable-area columns are square meters; BUILDINGS.BLDG_ASSIGNABLE_SQUARE_FOOTAGE
      is square feet.
  - dimension: Companion measures
    differences: Each table pairs ASSIGNABLE_AREA with NON_ASSIGNABLE_AREA and EXT_GROSS_AREA
      at the same granularity, so assignable/non-assignable comparisons must stay
      within one table.
  decision_guide:
    Total assignable area of a building (current): Use FCLT_BUILDING.ASSIGNABLE_AREA.
    Assignable area statistics across a building's history records (stddev, sum, min over fiscal periods): Use
      FCLT_BUILDING_HIST.ASSIGNABLE_AREA.
    Assignable area of each floor, or floor-level thresholds (e.g. floors with assignable area above a value): Use
      FCLT_FLOOR.ASSIGNABLE_AREA joined to FCLT_BUILDING via FCLT_BUILDING_KEY.
    Assignable square footage for space-assignment reporting: Use BUILDINGS.BLDG_ASSIGNABLE_SQUARE_FOOTAGE,
      keeping in mind it is in square feet.
- id: column_concept_access_level
  name: Access Level Columns
  desc: 'Access level columns recorded at three granularity levels of the facilities
    domain plus the space-planning room feed: building-level ACCESS_LEVEL_CODE/ACCESS_LEVEL_NAME
    (current and per-fiscal-period history), floor-level ACCESS_LEVEL, and room-level
    ACCESS_LEVEL (FCLT_ROOMS, FAC_ROOMS, ZPM_ROOMS_LOAD). They share a numeric value
    domain (observed 0-3) but describe the access restriction of different physical
    objects or come from different feeds, so filters and joins must target the granularity
    and table family the question refers to.'
  columns:
  - FCLT_BUILDING.ACCESS_LEVEL_CODE
  - FCLT_BUILDING.ACCESS_LEVEL_NAME
  - FCLT_BUILDING_HIST.ACCESS_LEVEL_CODE
  - FCLT_BUILDING_HIST.ACCESS_LEVEL_NAME
  - FCLT_FLOOR.ACCESS_LEVEL
  - FCLT_ROOMS.ACCESS_LEVEL
  - FAC_BUILDING.ACCESS_LEVEL_CODE
  - FAC_FLOOR.ACCESS_LEVEL
  - FAC_ROOMS.ACCESS_LEVEL
  - ZPM_ROOMS_LOAD.ACCESS_LEVEL
  comparisons:
  - dimension: Granularity
    differences: Building columns classify the whole building (one code per building);
      floor columns classify each floor; room columns classify each individual room.
      A building with access level 2 can contain rooms with access level 1.
  - dimension: Code vs name
    differences: At building level the code (ACCESS_LEVEL_CODE, integer) and name
      (ACCESS_LEVEL_NAME, string) carry the same numeric value in current data; joins
      and filters typically use the code.
  - dimension: Time semantics
    differences: FCLT_BUILDING_HIST.ACCESS_LEVEL_CODE is the per-fiscal-period building
      access level and can be joined to FCLT_BUILDING.ACCESS_LEVEL_CODE to associate
      buildings sharing an access level with history attributes; the other columns
      are current values.
  - dimension: Room-level feed differences
    differences: FCLT_ROOMS.ACCESS_LEVEL and FAC_ROOMS.ACCESS_LEVEL belong to the
      facilities room inventories (with area and use keys); ZPM_ROOMS_LOAD.ACCESS_LEVEL
      belongs to the space-planning feed (with space usage text and SPACE_UNIT_CODE/HR_ORG_UNIT_ID
      links but no area), so room access-level statistics differ depending on the
      chosen feed.
  decision_guide:
    Rooms restricted by access level (e.g. 'rooms with access level 1 or 2'): Use
      FCLT_ROOMS.ACCESS_LEVEL (numeric); FAC_ROOMS.ACCESS_LEVEL for the FAC_* family.
    Building-level access classification or grouping buildings by access level: Use
      FCLT_BUILDING.ACCESS_LEVEL_CODE (with ACCESS_LEVEL_NAME for display).
    Access level of a specific floor: Use FCLT_FLOOR.ACCESS_LEVEL.
    History-based access level analysis (per fiscal period): Use FCLT_BUILDING_HIST.ACCESS_LEVEL_CODE.
    Room access level analysis combined with floor, space usage text, or space unit / HR org unit linkage: Use
      ZPM_ROOMS_LOAD.ACCESS_LEVEL.
- id: column_concept_dlc_key
  name: DLC Key (Department/Lab/Center)
  desc: 'Department/Lab/Center key columns (values like ''D_AEROASTRO'', ''D_IDSS'',
    ''D_BIOLOGY'') identifying a DLC across the facilities, HR, space, and academic-department
    domains. They are the universal cross-domain join key linking facilities organizations
    and space units to HR organization units, the master department hierarchy, and
    academic departments. Naming and completeness vary: DLC_KEY in most tables, D_CODE
    in MASTER_DEPT_DCODE_PARENT, DLC_CODE in the master hierarchy tables; some columns
    carry composite values (''D_DSL:HQ'') or nulls.'
  columns:
  - FCLT_ORGANIZATION.DLC_KEY
  - FCLT_ORG_DLC_KEY.DLC_KEY
  - HR_ORG_UNIT.DLC_KEY
  - HR_ORG_UNIT_NEW.DLC_KEY
  - MASTER_DEPT_HIERARCHY.DLC_KEY
  - MASTER_DEPT_HIERARCHY_LINKS.DLC_KEY
  - MASTER_DEPT_DCODE_PARENT.D_CODE
  - SPACE_UNIT.DLC_KEY
  - SPACE_UNIT2.DLC_KEY
  - SIS_DEPARTMENT.DLC_KEY
  - SPACE_SUPERVISOR_USAGE.DEPT_NAMES
  comparisons:
  - dimension: Naming convention
    detail: DLC_KEY is used by FCLT_ORGANIZATION, FCLT_ORG_DLC_KEY, HR_ORG_UNIT, HR_ORG_UNIT_NEW,
      MASTER_DEPT_HIERARCHY, MASTER_DEPT_HIERARCHY_LINKS, SPACE_UNIT, SPACE_UNIT2,
      and SIS_DEPARTMENT; MASTER_DEPT_DCODE_PARENT names the same value domain D_CODE
      (with PARENT_D_CODE for the parent); MASTER_DEPT_HIERARCHY/LINKS additionally
      carry DLC_CODE holding the same value as DLC_KEY; SPACE_SUPERVISOR_USAGE names
      it DEPT_NAMES despite holding DLC key values, not department names.
  - dimension: Uniqueness and fan-out behavior
    detail: In MASTER_DEPT_HIERARCHY the DLC_KEY is unique per DLC (one row per DLC);
      in HR_ORG_UNIT one DLC_KEY may appear on multiple HR org unit rows (join fans
      out); in FCLT_ORGANIZATION multiple organizations can share a DLC_KEY; in FCLT_ORG_DLC_KEY
      it is an assignment bridge where non-null values mark organizations with a DLC
      assignment; in SPACE_SUPERVISOR_USAGE multiple supervisors can share the same
      DEPT_NAMES value, so joining DEPT_NAMES = DLC_KEY fans out on both sides.
  - dimension: Nullability and value format
    detail: HR_ORG_UNIT.DLC_KEY is null for units without a DLC assignment (133 of
      641 rows); HR_ORG_UNIT_NEW.DLC_KEY and SPACE_UNIT.DLC_KEY may contain composite
      values like 'D_DSL:HQ' that do not match plain DLC keys; SPACE_SUPERVISOR_USAGE.DEPT_NAMES
      holds a comma-separated list of DLC keys when DEPT_COUNT > 1 (e.g. 'D_IDSS,D_LIDS'),
      so only single-department rows match a plain DLC key join; SIS_DEPARTMENT.DLC_KEY
      is populated for all 122 department rows.
  - dimension: Companion name column
    detail: FCLT_ORGANIZATION, HR_ORG_UNIT, and MASTER_DEPT_HIERARCHY carry a DLC_NAME
      alongside the key; SPACE_UNIT/SPACE_UNIT2, FCLT_ORG_DLC_KEY, HR_ORG_UNIT_NEW,
      SIS_DEPARTMENT, and SPACE_SUPERVISOR_USAGE carry only the key, so DLC name reporting
      requires joining one of the name-carrying tables.
  decision_guide:
    Attaching HR department attributes (unit title, department name/code, level) to a facilities organization: Join
      FCLT_ORGANIZATION.DLC_KEY = HR_ORG_UNIT.DLC_KEY; expect possible row fan-out
      when a DLC maps to multiple HR org units.
    Reporting the DLC name of an organization or space unit: Use FCLT_ORGANIZATION.DLC_KEY
      (carries DLC_NAME) or join HR_ORG_UNIT/MASTER_DEPT_HIERARCHY for DLC_NAME; SPACE_UNIT/SPACE_UNIT2
      keys alone have no name column.
    Restricting analysis to DLCs placed in the standard department hierarchy or reporting their hierarchy path: Join
      on MASTER_DEPT_HIERARCHY.DLC_KEY; use MASTER_DEPT_DCODE_PARENT.D_CODE for the
      same value domain when only the direct parent is needed.
    Filtering organizations that have a DLC assignment before DLC-level room statistics: Use
      FCLT_ORG_DLC_KEY.DLC_KEY IS NOT NULL as the assignment filter, then join FCLT_ORGANIZATION.
    Linking an academic department to its facilities organization or HR unit: Use
      SIS_DEPARTMENT.DLC_KEY = FCLT_ORGANIZATION.DLC_KEY (or HR_ORG_UNIT.DLC_KEY);
      all SIS_DEPARTMENT rows carry a DLC key.
    Attributing supervisor space-usage statistics (supervisees, square footage, research volume) to a DLC or space unit: Join
      SPACE_SUPERVISOR_USAGE.DEPT_NAMES = SPACE_UNIT.DLC_KEY (or another DLC_KEY column);
      despite its name, DEPT_NAMES holds DLC key values, and only single-department
      rows (DEPT_COUNT = 1) match a plain DLC key.
- id: column_concept_office_location
  name: Person Office Location
  desc: OFFICE_LOCATION columns recording where a person's office/desk is, replicated
    across the person-directory tables (SE_PERSON, MIT_STUDENT_DIRECTORY, EMPLOYEE_DIRECTORY,
    DRUPAL_EMPLOYEE_DIRECTORY). All hold a building or building-room text identifier
    in the same value domain as FCLT_ROOMS.BUILDING_ROOM, but they describe different
    populations (employee/person master vs student vs primary employee directory vs
    Drupal employee feed) and differ sharply in non-null coverage and in how many
    values are building-room ('BLDG-ROOM') versus building-only ('BLDG'). Choosing
    the right column determines whose office is reported and whether room-level joins
    to FCLT_ROOMS succeed.
  columns:
  - SE_PERSON.OFFICE_LOCATION
  - MIT_STUDENT_DIRECTORY.OFFICE_LOCATION
  - EMPLOYEE_DIRECTORY.OFFICE_LOCATION
  - DRUPAL_EMPLOYEE_DIRECTORY.OFFICE_LOCATION
  comparisons:
  - dimension: Population described
    detail: SE_PERSON.OFFICE_LOCATION is the office of a person-master record (employees
      and students who are also employees); MIT_STUDENT_DIRECTORY.OFFICE_LOCATION
      is the office/desk of a student directory record; EMPLOYEE_DIRECTORY.OFFICE_LOCATION
      and DRUPAL_EMPLOYEE_DIRECTORY.OFFICE_LOCATION are the offices of institute employees
      from the primary and Drupal feeds respectively. The same person can carry different
      office values in different tables, so the column must match the population the
      question targets.
  - dimension: Non-null coverage
    detail: 'Coverage differs greatly: EMPLOYEE_DIRECTORY ~9,767/10,000 non-null,
      DRUPAL_EMPLOYEE_DIRECTORY ~8,950/10,000, SE_PERSON ~6,270/10,000, MIT_STUDENT_DIRECTORY
      only ~364/10,000. Student office locations are sparse, so student-office questions
      typically require an OFFICE_LOCATION IS NOT NULL filter and yield few rows.'
  - dimension: Value granularity (building-room vs building-only)
    detail: MIT_STUDENT_DIRECTORY values are all building-room form ('13-227B', '18-128B');
      SE_PERSON, EMPLOYEE_DIRECTORY, and DRUPAL_EMPLOYEE_DIRECTORY mix building-room
      values with building-only values (e.g. 'E23', '32', '46', 'NE49'). Building-only
      values cannot resolve to a specific room.
  - dimension: Room-level joinability to FCLT_ROOMS
    detail: Matching OFFICE_LOCATION to FCLT_ROOMS.BUILDING_ROOM succeeds for only
      a subset of distinct values (EMPLOYEE_DIRECTORY ~864, DRUPAL_EMPLOYEE_DIRECTORY
      ~861, SE_PERSON ~750, MIT_STUDENT_DIRECTORY ~65 distinct values match), so cross-table
      room attribution is partial and should not be assumed complete.
  decision_guide:
    Reporting the office location of employees with contact details (email/phone): Use
      EMPLOYEE_DIRECTORY.OFFICE_LOCATION (highest coverage) or DRUPAL_EMPLOYEE_DIRECTORY.OFFICE_LOCATION
      when Drupal-sourced attributes are needed.
    Reporting the office location of a person-master record (payroll rank, position title, active flag, employee type): Use
      SE_PERSON.OFFICE_LOCATION; this is the column used when grouping graduate/employee
      records by employee type and listing their offices.
    Reporting the office/desk location of students (e.g. graduate students with student year 'G'): Use
      MIT_STUDENT_DIRECTORY.OFFICE_LOCATION with an IS NOT NULL filter, since student
      office coverage is sparse.
    Joining a person's office to physical room attributes (floor, area, major use): Match
      OFFICE_LOCATION to FCLT_ROOMS.BUILDING_ROOM, but expect only partial matches;
      prefer the employee-directory columns for the best room-level hit rate.
- id: column_concept_master_subject_id
  name: Master Subject Identifier
  desc: Master subject identifier columns (MASTER_SUBJECT_ID and its sortable variant
    MASTER_SUBJECT_ID_SORT) replicated across the registrar offering tables, the subject
    summary, the textbook program, the library reserve program, and the CIS course
    catalog. For clustered subjects (e.g. joint or cross-listed offerings), the master
    subject identifier points to the leading subject of the cluster, so joining on
    it matches offerings that share the same master subject even when their own SUBJECT_ID
    differs. SUBJECT_ID/SUBJECT_ID_SORT identify the subject itself, while MASTER_SUBJECT_ID/MASTER_SUBJECT_ID_SORT
    identify the cluster's master; the _SORT columns are the sortable forms of the
    same values used for cross-table joins.
  columns:
  - SUBJECT_OFFERED.MASTER_SUBJECT_ID
  - SUBJECT_OFFERED.MASTER_SUBJECT_ID_SORT
  - SUBJECT_OFFERED_SUMMARY.MASTER_SUBJECT_ID
  - SUBJECT_OFFERED_SUMMARY.MASTER_SUBJECT_ID_SORT
  - SUBJECT_SUMMARY.MASTER_SUBJECT_ID
  - SUBJECT_SUMMARY.MASTER_SUBJECT_ID_SORT
  - TIP_SUBJECT_OFFERED.MASTER_SUBJECT_ID
  - TIP_SUBJECT_OFFERED.MASTER_SUBJECT_ID_SORT
  - LIBRARY_SUBJECT_OFFERED.MASTER_SUBJECT_ID
  - LIBRARY_SUBJECT_OFFERED.MASTER_SUBJECT_ID_SORT
  - CIS_COURSE_CATALOG.MASTER_SUBJECT_ID
  comparisons:
  - dimension: Identity scope
    detail: MASTER_SUBJECT_ID identifies the master subject of a cluster (shared by
      all clustered offerings); SUBJECT_ID identifies the individual subject. For
      non-clustered subjects the two coincide.
  - dimension: Sortable variant
    detail: MASTER_SUBJECT_ID_SORT is the sortable form of MASTER_SUBJECT_ID with
      the same matching semantics; cross-table joins use either variant (e.g. registrar-to-textbook
      joins on MASTER_SUBJECT_ID_SORT, catalog joins on MASTER_SUBJECT_ID).
  - dimension: Table coverage
    detail: Both variants exist in SUBJECT_OFFERED, SUBJECT_OFFERED_SUMMARY, SUBJECT_SUMMARY,
      TIP_SUBJECT_OFFERED, and LIBRARY_SUBJECT_OFFERED; CIS_COURSE_CATALOG carries
      only MASTER_SUBJECT_ID (no sort variant).
  - dimension: Grain
    detail: SUBJECT_OFFERED holds one master identifier per section row; SUBJECT_OFFERED_SUMMARY/SUBJECT_SUMMARY
      per subject row per term; TIP_SUBJECT_OFFERED and LIBRARY_SUBJECT_OFFERED per
      subject row per term within their program scope.
  decision_guide:
    Matching the same subject across the registrar, textbook, and library programs when subjects may be clustered: Join
      on MASTER_SUBJECT_ID or MASTER_SUBJECT_ID_SORT so clustered offerings resolve
      to their common master subject.
    Matching an individual subject (not its cluster) across tables: Use SUBJECT_ID
      / SUBJECT_ID_SORT instead of the master identifier columns.
    ? Joining offerings to CIS course catalog records of the master subject (e.g.
      checking catalog attributes like ACADEMIC_YEAR)
    : Use MASTER_SUBJECT_ID, since CIS_COURSE_CATALOG has no sort variant.
- id: column_concept_fiscal_period
  name: Fiscal Period Code
  desc: 'Fiscal period code columns in YYYYMM format (e.g. ''199602'' = FY1996 period
    2, ''201505'') appearing in two distinct roles: as the primary key of the month-grain
    time dimension (TIME_MONTH.FISCAL_PERIOD, also mirrored in TIME_DAY.FISCAL_PERIOD
    for day-to-month linkage), and as the snapshot-period stamp of the facilities
    historical tables (FCLT_BUILDING_HIST, FCLT_BUILDING_HIST_1, FCLT_BUILDING_ADDRESS_HIST,
    FCLT_FLOOR_HIST, FCLT_ROOMS_HIST, FCLT_MAJOR_USE_HIST). Both roles share the same
    YYYYMM value domain, but the time dimension uses it for calendar grouping while
    the history tables use it to mark when a facilities snapshot was taken.'
  columns:
  - TIME_MONTH.FISCAL_PERIOD
  - TIME_DAY.FISCAL_PERIOD
  - FCLT_BUILDING_HIST.FISCAL_PERIOD
  - FCLT_BUILDING_HIST_1.FISCAL_PERIOD
  - FCLT_BUILDING_ADDRESS_HIST.FISCAL_PERIOD
  - FCLT_FLOOR_HIST.FISCAL_PERIOD
  - FCLT_ROOMS_HIST.FISCAL_PERIOD
  - FCLT_MAJOR_USE_HIST.FISCAL_PERIOD
  comparisons:
  - dimension: Role
    detail: In TIME_MONTH it identifies the month record itself (one row per period);
      in TIME_DAY it attributes each calendar day to its fiscal month and is the join
      key to TIME_MONTH; in FCLT_*_HIST tables it stamps the fiscal period at which
      the facilities snapshot (building/floor/room/address/classification) was recorded.
  - dimension: Coverage
    detail: TIME_MONTH covers fiscal periods 199601-203516 (640 periods); TIME_DAY's
      fiscal periods overlap TIME_MONTH on 480 periods; the facilities history tables
      currently cover only period 201505 (FCLT_ROOMS_HIST, FCLT_MAJOR_USE_HIST), 201505-201602
      (FCLT_FLOOR_HIST), or 201505-201906 (FCLT_BUILDING_HIST, FCLT_BUILDING_HIST_1).
  - dimension: Join behavior
    detail: TIME_DAY.FISCAL_PERIOD = TIME_MONTH.FISCAL_PERIOD fans out one month row
      to all its days; joining history-table FISCAL_PERIOD values to TIME_MONTH resolves
      the snapshot period's calendar attributes but only matches within the overlapping
      period range.
  decision_guide:
    Month-level fiscal statistics or rolling days up to fiscal months: Join TIME_DAY.FISCAL_PERIOD
      to TIME_MONTH.FISCAL_PERIOD.
    Historical facilities snapshots per fiscal period (area/room-count trends): Use
      the FCLT_*_HIST table's own FISCAL_PERIOD as the snapshot stamp; join to TIME_MONTH
      only when the snapshot period's calendar attributes are needed.
    Filtering records of a specific fiscal month: Apply the YYYYMM filter on the FISCAL_PERIOD
      column of whichever table carries the grain required (day, month, or history
      snapshot).
