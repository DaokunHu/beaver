    target_column: FAC_BUILDING_KEY
- id: join_facrooms_facorg
  source_entity_type: table
  source_entity_id: FAC_ROOMS
  target_entity_type: table
  target_entity_id: FAC_ORGANIZATION
  relation_type: joins
  desc: FAC_ROOMS joins FAC_ORGANIZATION on ORGANIZATION_KEY to obtain organization
    hierarchy attributes for the organization occupying each room.
  columns:
  - source_column: ORGANIZATION_KEY
    target_column: ORGANIZATION_KEY
- id: join_facrooms_facfloor
  source_entity_type: table
  source_entity_id: FAC_ROOMS
  target_entity_type: table
  target_entity_id: FAC_FLOOR
  relation_type: joins
  desc: FAC_ROOMS joins FAC_FLOOR on FLOOR_KEY to obtain floor-level attributes (floor
    areas, level, wing, access) for rooms.
  columns:
  - source_column: FLOOR_KEY
    target_column: FLOOR_KEY
- id: join_fcltorg_dlc
  source_entity_type: table
  source_entity_id: FCLT_ORGANIZATION
  target_entity_type: table
  target_entity_id: FCLT_ORG_DLC_KEY
  relation_type: joins
  desc: FCLT_ORGANIZATION joins FCLT_ORG_DLC_KEY on DLC_KEY or on FCLT_ORGANIZATION_KEY
    to map organizations to their department/lab/center keys, e.g. to filter organizations
    that have a non-null DLC key assignment before aggregating room statistics.
  columns:
  - source_column: DLC_KEY
    target_column: DLC_KEY
  - source_column: FCLT_ORGANIZATION_KEY
    target_column: FCLT_ORGANIZATION_KEY
- id: join_cip_scd
  source_entity_type: table
  source_entity_id: CIP
