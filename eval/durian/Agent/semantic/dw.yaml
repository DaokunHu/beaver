    LIVING_GROUP_TYPE_DESC:
      desc: ''
    VALID_FROM_DATE:
      desc: ''
    VALID_THRU_DATE:
      desc: ''
    LAST_ACTIVITY_DATE:
      desc: ''
    WAREHOUSE_LOAD_DATE:
      desc: ''
- id: SPACE_DETAIL
  name: SPACE_DETAIL
  desc: 'Space assignment detail fact table: one row per physical room assigned to
    a space unit, with building/floor/space-unit/space-usage keys, room identifiers
    (building-room number and name, room number), room square footage, room counter,
    and building component. Used to count rooms per space unit or per building, and
    to analyze room size and usage distribution. Joins to SPACE_UNIT via SPACE_UNIT_KEY,
    FCLT_BUILDING via BUILDING_KEY, SPACE_FLOOR via FLOOR_KEY, and SPACE_USAGE via
    SPACE_USAGE_KEY.'
  columns:
    BUILDING_KEY:
      desc: Foreign key to FCLT_BUILDING.FCLT_BUILDING_KEY; the building containing
        the room; used to find the building with the most rooms within a space unit
    FLOOR_KEY:
      desc: Foreign key to SPACE_FLOOR.FLOOR_KEY; the floor the room is on
    SPACE_UNIT_KEY:
      desc: Foreign key to SPACE_UNIT.SPACE_UNIT_KEY; the space unit the room is assigned
        to
    SPACE_USAGE_KEY:
      desc: Foreign key to SPACE_USAGE.SPACE_USAGE_KEY; the usage classification of
        the room (e.g. classroom, office, lab)
    BUILDING_ROOM:
      desc: Combined building-room identifier, e.g. '1-080'; counting rows of this
        column gives the number of rooms per space unit/building
    BUILDING_ROOM_NAME:
      desc: Room name (usually identical to BUILDING_ROOM)
    ROOM_NUMBER:
      desc: Room number within the building, e.g. '80', '82F'
    ROOM_SQUARE_FOOTAGE:
      desc: 'Room area in square feet (note: FCLT_ROOMS.AREA is in square meters)'
    ROOM_COUNTER:
      desc: Room count indicator; equals 1 for every room row, so SUM(ROOM_COUNTER)
        also yields room counts
    BUILDING_COMPONENT:
      desc: Building component identifier the room belongs to
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per room assigned to a space unit
  entity:
    columns:
      WAREHOUSE_LOAD_DATE:
        desc: ETL warehouse load date of the room assignment record, stored as DD-MON-YY
          text (e.g. '19-DEC-24'); all current rows carry '19-DEC-24'. This is the
          room-side load date used to filter which room snapshot to analyze; it is
          distinct from SPACE_FLOOR.WAREHOUSE_LOAD_DATE (the floor lookup record's
          load date), which is the column to report when a question asks for the floor's
          warehouse load date.
  reason: Case dw_2528 filters rooms on SPACE_DETAIL.WAREHOUSE_LOAD_DATE='19-DEC-24'
    while reporting the floor's warehouse load date from SPACE_FLOOR; the two same-named
    columns are confusing and their difference (room snapshot load date vs floor lookup
    load date, DD-MON-YY text format) must be documented per column description rules.
- id: SPACE_FLOOR
  name: SPACE_FLOOR
  desc: 'Space-domain floor lookup table: one row per floor key with the floor number/label
    and floor name. Referenced by SPACE_DETAIL via FLOOR_KEY to attach floor identity
    to assigned rooms; a lightweight floor reference without the area measures carried
    by FCLT_FLOOR or FAC_FLOOR.'
  columns:
    FLOOR_KEY:
      desc: Surrogate key of the floor; joins to SPACE_DETAIL.FLOOR_KEY
    FLOOR:
      desc: Floor number/label within the building
    FLOOR_NAME:
      desc: Display name of the floor
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per floor key
  entity:
    columns:
      FLOOR_NAME:
        desc: Display name of the floor; unique across floor keys in current data
          (49 distinct names for 49 rows), so it is safe as a join/group key when
          combining per-floor derived results (e.g. matching each floor's largest
          room back to floor-level attributes).
      WAREHOUSE_LOAD_DATE:
        desc: ETL warehouse load date of the floor lookup record, stored as DD-MON-YY
          text (e.g. '19-DEC-24'); all current rows carry '19-DEC-24'. This is the
          column to report when a question asks for the floor's warehouse load date;
          it is distinct from SPACE_DETAIL.WAREHOUSE_LOAD_DATE, which is the room-side
          load date used to filter room assignment snapshots.
  reason: Case dw_2528 reports SPACE_FLOOR.WAREHOUSE_LOAD_DATE as the floor's warehouse
    load date and joins derived per-floor results on FLOOR_NAME; documenting the load-date
    column distinction from SPACE_DETAIL and the verified uniqueness of FLOOR_NAME
    prevents wrong-column selection and unfounded fan-out concerns.
- id: SPACE_SUPERVISOR_USAGE
  name: SPACE_SUPERVISOR_USAGE
  desc: 'Space supervisor usage fact table: one row per supervisor (MIT_ID) recording
    how much space they supervise and for how many departments: department count,
    department DLC key list (comma-separated when multiple), number of supervisees,
    supervised square footage, research volume, and derived ratio measures (sqft per
    supervisee, sqft per research volume, research volume per sqft). Joins to SPACE_UNIT
    and other DLC-carrying tables via DEPT_NAMES = DLC_KEY (only single-department
    rows match); used for supervisor space-usage and research-volume statistics per
    department/DLC.'
  columns:
    MIT_ID:
      desc: MIT ID of the supervisor; one row per supervisor
    DEPT_COUNT:
      desc: Number of departments (DLCs) the supervisor's space spans; observed values
        1-4
    DEPT_NAMES:
      desc: DLC key(s) of the supervised departments, e.g. 'D_CEE'; comma-separated
        list when DEPT_COUNT > 1 (e.g. 'D_IDSS,D_LIDS'). Single-value rows join to
        DLC key columns such as SPACE_UNIT.DLC_KEY
    NUM_OF_SUPERVISEES:
      desc: Number of supervisees under the supervisor; observed range 1-121
    SQFT:
      desc: Total square footage of space supervised
    RESEARCH_VOLUME:
      desc: Research volume attributed to the supervisor's space; can be negative
    SQFT_PER_SUPERVISEE:
      desc: 'Derived ratio: supervised square footage per supervisee'
    SQFT_PER_RES_VOL:
      desc: 'Derived ratio: supervised square footage per unit of research volume'
    RES_VOL_PER_SQFT:
      desc: 'Derived ratio: research volume per square foot of supervised space'
    default_granularity: one row per supervisor
  default_granularity: one row per supervisor
- id: SPACE_UNIT
  name: SPACE_UNIT
  desc: 'Space unit dimension table: one row per space unit (an organizational space-assignment
    unit such as a department, program, or office that receives space allocation),
    with space unit key/code, space unit name, the facilities organization it belongs
    to, and DLC key. Bridges FCLT_ORGANIZATION (organization attribution) and SPACE_DETAIL
    (rooms assigned to the space unit); used to group room counts and space statistics
    by space unit.'
  columns:
    FCLT_ORGANIZATION_KEY:
      desc: Foreign key to FCLT_ORGANIZATION.FCLT_ORGANIZATION_KEY; the organization
        that owns/occupies this space unit
    SPACE_UNIT_KEY:
      desc: Surrogate key of the space unit; joins to SPACE_DETAIL.SPACE_UNIT_KEY
        and SPACE_UNIT2.SPACE_UNIT_KEY; used for partitioning/ordering in space analyses
    SPACE_UNIT_CODE:
      desc: Business code of the space unit (same numeric value as the key in current
        data)
    SPACE_UNIT:
      desc: Name of the space unit, e.g. 'Physics', 'Technology & Policy Program'
    DLC_KEY:
      desc: Department/Lab/Center key, e.g. 'D_PHYSICS'; may contain composite values
        like 'D_DSL:HQ'
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per space unit
- id: SPACE_UNIT2
  name: SPACE_UNIT2
  desc: Alternative space unit lookup table containing space unit key, code, name,
    and DLC key, but without the FCLT_ORGANIZATION_KEY organization attribution present
    in SPACE_UNIT. Holds fewer space units than SPACE_UNIT; used when only space unit
    identity/name is needed without organization linkage.
  columns:
    SPACE_UNIT_KEY:
      desc: Surrogate key of the space unit; same value domain as SPACE_UNIT.SPACE_UNIT_KEY
        and referenced by SPACE_DETAIL.SPACE_UNIT_KEY
    SPACE_UNIT_CODE:
      desc: Business code of the space unit
    SPACE_UNIT:
      desc: Name of the space unit
    DLC_KEY:
      desc: Department/Lab/Center key of the space unit
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date
  default_granularity: one row per space unit
- id: SPACE_USAGE
  name: SPACE_USAGE
  desc: 'Space usage classification lookup table: one row per space usage key with
    its usage name (e.g. classroom, office, lab usage categories). Referenced by SPACE_DETAIL
    via SPACE_USAGE_KEY to decode the usage classification of assigned rooms.'
  columns:
    SPACE_USAGE_KEY:
      desc: Surrogate key of the space usage classification; joins to SPACE_DETAIL.SPACE_USAGE_KEY
    SPACE_USAGE:
      desc: Name of the space usage classification
    WAREHOUSE_LOAD_DATE:
      desc: ETL warehouse load date of the space usage classification lookup record,
        stored as DD-MON-YY text (e.g. '19-DEC-24'); all current rows carry '19-DEC-24'.
        This is the usage-lookup-side load date; it is distinct from SPACE_DETAIL.WAREHOUSE_LOAD_DATE
        (the room assignment record's load date) and SPACE_FLOOR.WAREHOUSE_LOAD_DATE
        (the floor lookup record's load date). When a question asks for warehouse
        load dates from multiple space tables, report each table's own column separately.
  default_granularity: one row per space usage classification
