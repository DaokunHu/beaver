  source_entity_id: EMPLOYEE_DIRECTORY
  target_entity_type: table
  target_entity_id: MOIRA_LIST_DETAIL
  relation_type: joins
  desc: EMPLOYEE_DIRECTORY joins MOIRA_LIST_DETAIL on MIT_ID = MOIRA_LIST_MEMBER_MIT_ID
