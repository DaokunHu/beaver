- id: ZIP_CANADA
  name: ZIP_CANADA
  desc: 6 columns in total
  columns:
    POSTAL_CODE:
      desc: ''
    CITY_NAME:
      desc: ''
    CITY_TYPE:
      desc: ''
    PROVINCE_ABBR:
      desc: ''
    PROVINCE_NAME:
