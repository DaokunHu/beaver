- id: agents
  name: agents
  desc: Neutron agent (service process) registry. One row per running Neutron service
    agent (DHCP agent, L3 agent, metadata agent, Open vSwitch/Linux bridge agent,
    etc.) recording the host it runs on, its binary name, agent_type, RPC topic, administrative
    up/down state, started-at and heartbeat timestamps, a JSON configurations blob,
    current load and availability zone. Agents are referenced by binding tables such
    as networkdhcpagentbindings, routerl3agentbindings and poolloadbalanceragentbindings.
    Neutron-side counterpart of Nova's services table; the two belong to different
    services, use different identifier types (UUID vs integer) and different disable
    semantics.
  columns:
    id:
      desc: UUID primary key of the agent record
    agent_type:
      desc: Type of the Neutron agent, e.g. DHCP agent, L3 agent, Metadata agent,
        Open vSwitch agent; used to classify agents by role
    binary:
      desc: Name of the agent executable/daemon, e.g. neutron-dhcp-agent, neutron-l3-agent
    topic:
      desc: RPC topic the agent listens on
    host:
      desc: Name of the host machine on which this agent runs
    admin_state_up:
      desc: 'Administrative state flag: 1 = agent is administratively up and eligible
        for scheduling, 0 = disabled by an operator'
      default: '1'
    created_at:
      desc: Timestamp when the agent record was created
    started_at:
      desc: Timestamp when the agent process was started
    heartbeat_timestamp:
      desc: Timestamp of the most recent heartbeat received from the agent; used to
        judge whether the agent is alive
    description:
      desc: Free-text description of the agent
    configurations:
      desc: JSON blob of agent-reported configuration (bridge mappings, interface
        driver, extensions, etc.)
    load:
      desc: Current load counter reported by the agent, used for scheduling decisions
        (e.g. number of networks served by a DHCP agent)
      default: '0'
    availability_zone:
      desc: Availability zone the agent belongs to, used for AZ-aware scheduling
    resource_versions:
      desc: JSON blob of resource type versions supported by the agent
  default_granularity: one row per Neutron agent process
  synonyms:
  - neutron agents
  - network service agents
