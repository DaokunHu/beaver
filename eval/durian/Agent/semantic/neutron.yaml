- id: COMPUTE_NODES
  name: COMPUTE_NODES
  desc: Nova compute node inventory table. One row per compute node (hypervisor) reported
    by a compute service, recording hypervisor type/version, host name, capacity (vCPUs,
    memory, local disk), current usage, free resources, allocation ratios and the
    compute node UUID used to correlate with placement resource providers.
  default_granularity: one row per compute node
  columns:
    created_at:
      desc: Timestamp when the compute node record was created
    updated_at:
      desc: Timestamp of the last update to the compute node record
    deleted_at:
      desc: Timestamp when the record was soft-deleted; NULL if active
    id:
      desc: Primary key integer ID of the compute node
    service_id:
      desc: ID of the compute service that reports this compute node
    vcpus:
      desc: Total number of virtual CPUs available on the compute node
    memory_mb:
      desc: Total RAM in MB available on the compute node
    local_gb:
      desc: Total local disk in GB available on the compute node
    vcpus_used:
      desc: Number of virtual CPUs currently consumed by instances
    memory_mb_used:
      desc: RAM in MB currently consumed by instances
    local_gb_used:
      desc: Local disk in GB currently consumed by instances
    hypervisor_type:
      desc: Type of hypervisor running on the compute node, e.g. QEMU, Xen, Hyper-V;
        used to classify nodes by virtualization technology
    hypervisor_version:
      desc: Numeric version of the hypervisor software
    cpu_info:
      desc: JSON/text description of the CPU model and features
    disk_available_least:
      desc: Smallest amount of disk (GB) guaranteed available for new instances
    free_ram_mb:
      desc: Currently free RAM in MB on the compute node
    free_disk_gb:
      desc: Currently free local disk in GB on the compute node
    current_workload:
      desc: Current workload metric reported by the hypervisor
    running_vms:
      desc: Number of virtual machines currently running on the compute node
    hypervisor_hostname:
      desc: Hostname of the hypervisor as reported by the virtualization layer; may
        differ from the Nova host name
    deleted:
      desc: 'Soft-delete flag: 0 = active record, non-zero = deleted'
    host_ip:
      desc: IP address of the compute host
    supported_instances:
      desc: JSON/text list of instance types supported on this node
    pci_stats:
      desc: JSON/text statistics of PCI devices available and used
    metrics:
      desc: JSON/text custom metrics reported for scheduling
    extra_resources:
      desc: JSON/text extra resources reported by the compute node
    stats:
      desc: JSON/text aggregated statistics of the compute node
    numa_topology:
      desc: JSON/text NUMA topology of the compute node
    host:
      desc: Name of the Nova compute host on which this compute node runs; join key
        to host membership tables such as AGGREGATE_HOSTS.HOST
    ram_allocation_ratio:
      desc: Ratio used to over/under-commit RAM when scheduling
    cpu_allocation_ratio:
      desc: Ratio used to over/under-commit vCPUs when scheduling
    uuid:
      desc: Globally unique identifier (UUID) of the compute node; matches RESOURCE_PROVIDERS.UUID
        in the placement service for the same physical compute resource
    disk_allocation_ratio:
      desc: Ratio used to over/under-commit local disk when scheduling
- id: RESOURCE_PROVIDERS
  name: RESOURCE_PROVIDERS
  desc: Placement service resource provider registry. One row per resource provider
    (a physical compute node, storage or network resource pool) that can supply inventory
    of resources; the provider UUID correlates with the compute node UUID in Nova.
  default_granularity: one row per resource provider
  columns:
    id:
      desc: Primary key integer ID of the resource provider
    uuid:
      desc: Globally unique identifier of the resource provider; for compute resource
        providers it equals COMPUTE_NODES.UUID of the corresponding compute node
    name:
      desc: Human-readable name of the resource provider, usually the compute host
        name
    generation:
      desc: Generation counter incremented on each inventory/allocation change, used
        for concurrency control
    can_host:
      desc: 'Flag indicating whether this provider can host instances: 1 = can host,
        0 = cannot'
- id: AGGREGATE_HOSTS
  name: AGGREGATE_HOSTS
  desc: Membership mapping between host aggregates and compute hosts. Each row assigns
    one host to one aggregate, allowing a host to belong to multiple aggregates; used
    to filter compute nodes by aggregate membership.
  default_granularity: one row per (aggregate, host) membership
  columns:
    created_at:
      desc: Timestamp when the membership row was created
    updated_at:
      desc: Timestamp of the last update to the membership row
    deleted_at:
      desc: Timestamp when the membership was soft-deleted; NULL if active
    id:
      desc: Primary key integer ID of the membership row
    host:
      desc: Name of the compute host that is a member of the aggregate; join key to
        COMPUTE_NODES.HOST
    aggregate_id:
      desc: ID of the host aggregate the host belongs to; references AGGREGATES.ID
    deleted:
      desc: 'Soft-delete flag: 0 = active membership, non-zero = deleted'
- id: AGGREGATES
  name: AGGREGATES
  desc: Host aggregate definitions in Nova. Each aggregate is a logical grouping of
    compute hosts (e.g. by hardware type or availability zone) with a name and UUID;
    membership of hosts is recorded in AGGREGATE_HOSTS.
  default_granularity: one row per host aggregate
  columns:
    created_at:
      desc: Timestamp when the aggregate was created
    updated_at:
      desc: Timestamp of the last update to the aggregate
    deleted_at:
      desc: Timestamp when the aggregate was soft-deleted; NULL if active
    id:
      desc: Primary key integer ID of the aggregate; referenced by AGGREGATE_HOSTS.AGGREGATE_ID
    name:
      desc: Human-readable name of the host aggregate
    deleted:
      desc: 'Soft-delete flag: 0 = active aggregate, non-zero = deleted'
    uuid:
      desc: Globally unique identifier of the aggregate
- id: SHADOW_COMPUTE_NODES
  name: SHADOW_COMPUTE_NODES
  desc: Shadow copy of the compute node inventory used during online database migrations.
    Same column structure as COMPUTE_NODES; holds transitional rows and is not the
    authoritative source for compute node queries.
  default_granularity: one row per compute node (migration shadow copy)
  columns:
    created_at:
      desc: Timestamp when the shadow record was created
    updated_at:
      desc: Timestamp of the last update to the shadow record
    deleted_at:
      desc: Timestamp when the shadow record was soft-deleted; NULL if active
    id:
      desc: Integer ID of the compute node copied from COMPUTE_NODES.ID
    service_id:
      desc: ID of the compute service that reported the compute node
    vcpus:
      desc: Total virtual CPUs on the compute node
    memory_mb:
      desc: Total RAM in MB on the compute node
    local_gb:
      desc: Total local disk in GB on the compute node
    vcpus_used:
      desc: Virtual CPUs consumed by instances
    memory_mb_used:
      desc: RAM in MB consumed by instances
    local_gb_used:
      desc: Local disk in GB consumed by instances
    hypervisor_type:
      desc: Type of hypervisor, e.g. QEMU; mirrors COMPUTE_NODES.HYPERVISOR_TYPE
    hypervisor_version:
      desc: Numeric version of the hypervisor
    cpu_info:
      desc: CPU model and feature description
    disk_available_least:
      desc: Smallest guaranteed available disk in GB
    free_ram_mb:
      desc: Currently free RAM in MB
    free_disk_gb:
      desc: Currently free disk in GB
    current_workload:
      desc: Current workload metric
    running_vms:
      desc: Number of running virtual machines
    hypervisor_hostname:
      desc: Hypervisor hostname
    deleted:
      desc: Soft-delete flag
    host_ip:
      desc: IP address of the compute host
    supported_instances:
      desc: Supported instance types
    pci_stats:
      desc: PCI device statistics
    metrics:
      desc: Custom scheduling metrics
    extra_resources:
      desc: Extra resources reported
    stats:
      desc: Aggregated node statistics
    numa_topology:
      desc: NUMA topology description
    host:
      desc: Nova compute host name; mirrors COMPUTE_NODES.HOST
    ram_allocation_ratio:
      desc: RAM allocation ratio
    cpu_allocation_ratio:
      desc: CPU allocation ratio
    uuid:
      desc: UUID of the compute node; mirrors COMPUTE_NODES.UUID
    disk_allocation_ratio:
      desc: Disk allocation ratio
- id: RESOURCE_PROVIDER_AGGREGATES
  name: RESOURCE_PROVIDER_AGGREGATES
  desc: Placement-side mapping between resource providers and placement aggregates.
    Links RESOURCE_PROVIDERS.ID to a placement aggregate UUID, representing provider
    grouping in the placement service as opposed to Nova host aggregates.
  default_granularity: one row per (resource provider, placement aggregate) pair
  columns:
    resource_provider_id:
      desc: ID of the resource provider; references RESOURCE_PROVIDERS.ID
    aggregate_id:
      desc: Placement aggregate UUID that the resource provider belongs to
- id: INSTANCES
  name: INSTANCES
  desc: Authoritative Nova server (virtual machine) registry. One row per instance
    recording identity (UUID, display name, hostname), ownership (user/project), placement
    (host, node, availability zone, cell), resource sizing (memory_mb, vcpus, root_gb,
    ephemeral_gb, instance_type_id), lifecycle states (vm_state, task_state, power_state)
    and lifecycle timestamps. Extended attributes live in INSTANCE_EXTRA, cached network
    info in INSTANCE_INFO_CACHES, and metadata in INSTANCE_METADATA / INSTANCE_SYSTEM_METADATA.
  default_granularity: one row per instance (including soft-deleted rows)
  synonyms:
  - servers
  - virtual machines
  - VMs
  - nova instances
  columns:
    created_at:
      desc: Timestamp when the instance record was created
    updated_at:
      desc: Timestamp of the last update to the instance record
    deleted_at:
      desc: Timestamp when the instance was soft-deleted; NULL if active
    id:
      desc: Integer primary key of the instance row; internal DB identifier, distinct
        from the UUID used by other tables
    internal_id:
      desc: Legacy internal integer instance identifier
    user_id:
      desc: ID of the user who owns/launched the instance
    project_id:
      desc: ID of the project (tenant) that owns the instance
    image_ref:
      desc: Reference (UUID or URI) of the Glance image the instance was booted from
    kernel_id:
      desc: Reference of the kernel image, if any
    ramdisk_id:
      desc: Reference of the ramdisk image, if any
    launch_index:
      desc: Index of the instance within a multi-instance launch request
    key_name:
      desc: Name of the SSH key pair injected into the instance
    key_data:
      desc: Public key data of the injected SSH key pair
    power_state:
      desc: Numeric hypervisor power state of the instance (e.g. running, shutdown)
    vm_state:
      desc: Lifecycle VM state string such as active, stopped, resized, error
    memory_mb:
      desc: RAM in MB allocated to this instance from its flavor; per-instance sizing,
        not host capacity
    vcpus:
      desc: Number of virtual CPUs allocated to this instance from its flavor
    hostname:
      desc: Hostname of the instance as reported by the guest; may differ from display_name
    host:
      desc: Nova compute host on which the instance is currently running
    user_data:
      desc: Base64 user-data passed to the instance at boot (cloud-init)
    reservation_id:
      desc: ID grouping instances launched in the same reservation
    scheduled_at:
      desc: Timestamp when the scheduler placed the instance
    launched_at:
      desc: Timestamp when the instance was first booted
    terminated_at:
      desc: Timestamp when the instance was terminated
    display_name:
      desc: User-visible name of the instance; frequently used for REGEXP/LIKE name-pattern
        filtering
    display_description:
      desc: User-visible description of the instance
    availability_zone:
      desc: Availability zone in which the instance was launched, e.g. nova or flare3
    locked:
      desc: Flag indicating the instance is locked against non-admin operations
    os_type:
      desc: Operating system type of the instance
    launched_on:
      desc: Legacy text record of the host the instance launched on
    instance_type_id:
      desc: Integer ID referencing the instance type (flavor) used to boot the instance
    vm_mode:
      desc: Virtualization mode of the instance (e.g. hvm, xen)
    uuid:
      desc: Globally unique instance UUID; the join key referenced by INSTANCE_EXTRA.INSTANCE_UUID,
        INSTANCE_INFO_CACHES.INSTANCE_UUID, INSTANCE_SYSTEM_METADATA.INSTANCE_UUID,
        INSTANCE_METADATA.INSTANCE_UUID and MIGRATIONS.INSTANCE_UUID
    architecture:
      desc: CPU architecture of the instance (e.g. x86_64)
    root_device_name:
      desc: Device name of the root disk inside the guest
    access_ip_v4:
      desc: IPv4 access address advertised for the instance
    access_ip_v6:
      desc: IPv6 access address advertised for the instance
    config_drive:
      desc: Config drive volume ID or flag attached to the instance
    task_state:
      desc: Current in-progress task such as spawning, migrating, resizing; NULL when
        idle
    default_ephemeral_device:
      desc: Default device name for the ephemeral disk
    default_swap_device:
      desc: Default device name for the swap disk
    progress:
      desc: Percentage progress of the current task/build
    auto_disk_config:
      desc: Flag indicating automatic disk partitioning was requested
    shutdown_terminate:
      desc: 'Flag: terminate the instance when the reservation shuts down'
    disable_terminate:
      desc: 'Flag: prevent termination of the instance'
    root_gb:
      desc: Root disk size in GB from the flavor
    ephemeral_gb:
      desc: Ephemeral disk size in GB from the flavor
    cell_name:
      desc: Name of the cell that manages the instance
    node:
      desc: Hypervisor node name on the compute host running the instance
    deleted:
      desc: 'Soft-delete flag: 0 = active record, non-zero = deleted'
    locked_by:
      desc: Who locked the instance (owner or admin)
    cleaned:
      desc: Flag indicating resource cleanup was performed
    ephemeral_key_uuid:
      desc: UUID of the ephemeral encryption key
- id: INSTANCE_EXTRA
  name: INSTANCE_EXTRA
  desc: Extended instance attributes stored as serialized JSON documents, one row
    per instance UUID. Holds the flavor snapshot (old/new/cur), NUMA topology placement
    of the instance, PCI requests, vCPU model and migration context; used when queries
    need flavor or NUMA details without joining instance type tables.
  default_granularity: one row per instance UUID
  synonyms:
  - instance extra attributes
  - flavor json
  - numa topology
  columns:
    created_at:
      desc: Timestamp when the extra record was created
    updated_at:
      desc: Timestamp of the last update
    deleted_at:
      desc: Soft-delete timestamp; NULL if active
    deleted:
      desc: 'Soft-delete flag: 0 = active'
    id:
      desc: Integer primary key of the extra row
    instance_uuid:
      desc: UUID of the instance; joins to INSTANCES.UUID
    numa_topology:
      desc: JSON describing how the instance's vCPUs/memory are pinned across host
        NUMA nodes; NULL when no NUMA pinning is used
    pci_requests:
      desc: JSON of PCI device requests (e.g. SR-IOV) for the instance
    flavor:
      desc: JSON snapshot of the instance flavor with old/new/cur sections, containing
        flavorid, name, memory_mb, vcpus, root_gb, ephemeral_gb, swap and extra_specs
    vcpu_model:
      desc: JSON description of the vCPU model exposed to the guest
    migration_context:
      desc: JSON context preserved across resize/migration operations
- id: INSTANCE_INFO_CACHES
  name: INSTANCE_INFO_CACHES
  desc: Cache of the last-known network configuration for each instance. One row per
    instance UUID holding the serialized network_info JSON (ports, networks, subnets,
    fixed/floating IPs, MAC addresses, vif type and details) as last computed by Nova;
    used to report instance networking without calling the network service.
  default_granularity: one row per instance UUID
  synonyms:
  - instance network info cache
  - network_info
  columns:
    created_at:
      desc: Timestamp when the cache row was created
    updated_at:
      desc: Timestamp when the cached network info was last refreshed
    deleted_at:
      desc: Soft-delete timestamp; NULL if active
    id:
      desc: Integer primary key of the cache row
    network_info:
      desc: 'JSON array of the instance''s virtual interfaces: each entry carries
        port id, MAC address, network label, subnets with IPs/DNS/routes/gateway,
        vnic_type and plug details; empty array when the instance has no attached
        ports'
    instance_uuid:
      desc: UUID of the instance the cached network info belongs to; joins to INSTANCES.UUID
    deleted:
      desc: 'Soft-delete flag: 0 = active'
- id: INSTANCE_SYSTEM_METADATA
  name: INSTANCE_SYSTEM_METADATA
  desc: System-managed key/value metadata attached to instances. One row per (instance
    UUID, key) pair; keys are prefixed by their origin, most commonly image_* properties
    copied from the Glance image at boot (image_image_type, image_disk_format, image_container_format,
    image_min_ram, image_min_disk, image_base_image_ref, image_owner_id, image_user_id,
    image_image_state, image_image_location) plus operational keys such as clean_attempts.
    Used to filter or classify instances by image properties.
  default_granularity: one row per instance UUID and metadata key
  synonyms:
  - system metadata
  - image properties
  - instance sysmeta
  columns:
    created_at:
      desc: Timestamp when the metadata row was created
    updated_at:
      desc: Timestamp of the last update to the metadata value
    deleted_at:
      desc: Soft-delete timestamp; NULL if active
    id:
      desc: Integer primary key of the metadata row; COUNT(id) is used to count metadata
        rows per instance/key
    instance_uuid:
      desc: UUID of the instance owning the metadata; joins to INSTANCES.UUID
    key:
      desc: Metadata key name, e.g. image_image_type for the image type property,
        image_min_ram, image_disk_format, clean_attempts
    value:
      desc: Metadata value stored as a string for the given key
    deleted:
      desc: 'Soft-delete flag: 0 = active'
- id: MIGRATIONS
  name: MIGRATIONS
  desc: History of instance migration operations in Nova. One row per migration/resize/live-migration/evacuation
    attempt, recording source and destination compute hosts and nodes, migration type,
    status, the instance UUID, old/new instance type IDs for resizes, and progress
    counters for memory and disk transfer (total/processed/remaining). Memory and
    disk progress columns are populated only for live migrations; they are NULL for
    resize, cold migration and evacuation rows.
  default_granularity: one row per migration operation
  synonyms:
  - live migration records
  - resize history
  - instance migrations
  columns:
    created_at:
      desc: Timestamp when the migration record was created
    updated_at:
      desc: Timestamp of the last status/progress update
    deleted_at:
      desc: Soft-delete timestamp; NULL if active
    id:
      desc: Integer primary key of the migration row
    source_compute:
      desc: Compute host the instance was migrated from
    dest_compute:
      desc: Compute host the instance was migrated to
    dest_host:
      desc: Destination host address/name at the hypervisor level
    status:
      desc: Migration status such as queued, running, completed, confirmed, error,
        cancelled, reverted
    instance_uuid:
      desc: UUID of the migrated instance; joins to INSTANCES.UUID
    old_instance_type_id:
      desc: Instance type ID before the migration (relevant for resizes)
    new_instance_type_id:
      desc: Instance type ID after the migration (relevant for resizes)
    source_node:
      desc: Hypervisor node on the source compute host
    dest_node:
      desc: Hypervisor node on the destination compute host
    deleted:
      desc: 'Soft-delete flag: 0 = active'
    migration_type:
      desc: 'Type of migration: live-migration, migration (cold), resize or evacuation;
        NULL on legacy rows'
    hidden:
      desc: Flag indicating the migration is hidden from user-facing listings
    memory_total:
      desc: Total memory in bytes to transfer during a live migration; NULL for non-live
        migration types, so aggregations like STDDEV only consider live-migration
        rows
    memory_processed:
      desc: Memory in bytes already transferred during the live migration
    memory_remaining:
      desc: Memory in bytes still to transfer during the live migration
    disk_total:
      desc: Total disk in bytes to transfer; NULL for non-live migration types
    disk_processed:
      desc: Disk in bytes already transferred
    disk_remaining:
      desc: Disk in bytes still to transfer
- id: INSTANCE_METADATA
  name: INSTANCE_METADATA
  desc: User-defined key/value metadata attached to instances via the server metadata
    API. One row per (instance UUID, key) pair; unlike INSTANCE_SYSTEM_METADATA, keys
    are chosen freely by users and are not prefixed with image_ properties.
  default_granularity: one row per instance UUID and metadata key
  synonyms:
  - user metadata
  - server metadata
  columns:
    created_at:
      desc: Timestamp when the metadata row was created
    updated_at:
      desc: Timestamp of the last update to the metadata value
    deleted_at:
      desc: Soft-delete timestamp; NULL if active
    id:
      desc: Integer primary key of the metadata row
    key:
      desc: User-defined metadata key name
    value:
      desc: User-defined metadata value
    instance_uuid:
      desc: UUID of the instance owning the metadata; joins to INSTANCES.UUID
    deleted:
      desc: 'Soft-delete flag: 0 = active'
- id: SHADOW_INSTANCES
  name: SHADOW_INSTANCES
  desc: Shadow copy of the instance registry used during online database migrations.
    Same column structure as INSTANCES; holds transitional/archived rows (in this
    deployment all rows are marked deleted) and is not the authoritative source for
    instance queries.
  default_granularity: one row per instance (migration shadow copy)
  synonyms:
  - instance shadow table
  columns:
    created_at:
      desc: Timestamp when the shadow record was created
    updated_at:
      desc: Timestamp of the last update to the shadow record
    deleted_at:
      desc: Soft-delete timestamp; NULL if active
    id:
      desc: Integer ID copied from INSTANCES.ID
    internal_id:
      desc: Legacy internal integer instance identifier
    user_id:
      desc: Owning user ID
    project_id:
      desc: Owning project ID
    image_ref:
      desc: Image reference the instance booted from
    kernel_id:
      desc: Kernel image reference
    ramdisk_id:
      desc: Ramdisk image reference
    launch_index:
      desc: Launch index within a reservation
    key_name:
      desc: SSH key pair name
    key_data:
      desc: SSH public key data
    power_state:
      desc: Numeric power state
    vm_state:
      desc: Lifecycle VM state
    memory_mb:
      desc: RAM in MB allocated to the instance; mirrors INSTANCES.MEMORY_MB
    vcpus:
      desc: Virtual CPUs allocated to the instance; mirrors INSTANCES.VCPUS
    hostname:
      desc: Guest hostname; mirrors INSTANCES.HOSTNAME
    host:
      desc: Compute host running the instance
    user_data:
      desc: Cloud-init user data
    reservation_id:
      desc: Reservation grouping ID
    scheduled_at:
      desc: Scheduling timestamp
    launched_at:
      desc: Launch timestamp
    terminated_at:
      desc: Termination timestamp
    display_name:
      desc: User-visible instance name; mirrors INSTANCES.DISPLAY_NAME
    display_description:
      desc: User-visible description
    availability_zone:
      desc: Availability zone of the instance; mirrors INSTANCES.AVAILABILITY_ZONE
    locked:
      desc: Lock flag
    os_type:
      desc: Operating system type
    launched_on:
      desc: Legacy launch host record
    instance_type_id:
      desc: Instance type (flavor) ID
    vm_mode:
      desc: Virtualization mode
    uuid:
      desc: Instance UUID; mirrors INSTANCES.UUID
    architecture:
      desc: CPU architecture
    root_device_name:
      desc: Root disk device name
    access_ip_v4:
      desc: IPv4 access address
    access_ip_v6:
      desc: IPv6 access address
    config_drive:
      desc: Config drive reference
    task_state:
      desc: In-progress task state
    default_ephemeral_device:
      desc: Default ephemeral device name
    default_swap_device:
      desc: Default swap device name
    progress:
      desc: Task progress percentage
    auto_disk_config:
      desc: Automatic disk config flag
    shutdown_terminate:
      desc: Terminate-on-shutdown flag
    disable_terminate:
      desc: Termination-disabled flag
    root_gb:
      desc: Root disk GB
    ephemeral_gb:
      desc: Ephemeral disk GB
    cell_name:
      desc: Managing cell name
    node:
      desc: Hypervisor node name
    deleted:
      desc: Soft-delete flag; in this deployment all shadow rows carry a non-zero
        value
    locked_by:
      desc: Lock owner (owner or admin)
    cleaned:
      desc: Cleanup performed flag
    ephemeral_key_uuid:
      desc: Ephemeral encryption key UUID
- id: ALL_INSTANCES
  name: ALL_INSTANCES
  desc: Database view that unions INSTANCES with SHADOW_INSTANCES, exposing the identical
    column set. Provides a combined live-plus-shadow instance listing; row counts
    can double-cover instances present in both tables and it cannot be joined to satellite
    tables more reliably than INSTANCES itself.
  default_granularity: one row per instance across live and shadow registries (union,
    deduplicated)
  synonyms:
  - combined instances view
  columns:
    created_at:
      desc: Timestamp when the instance record was created
    updated_at:
      desc: Timestamp of the last update
    deleted_at:
      desc: Soft-delete timestamp; NULL if active
    id:
      desc: Integer instance ID from either INSTANCES or SHADOW_INSTANCES
    internal_id:
      desc: Legacy internal integer identifier
    user_id:
      desc: Owning user ID
    project_id:
      desc: Owning project ID
    image_ref:
      desc: Image reference
    kernel_id:
      desc: Kernel image reference
    ramdisk_id:
      desc: Ramdisk image reference
    launch_index:
      desc: Launch index within a reservation
    key_name:
      desc: SSH key pair name
    key_data:
      desc: SSH public key data
    power_state:
      desc: Numeric power state
    vm_state:
      desc: Lifecycle VM state
    memory_mb:
      desc: RAM in MB allocated to the instance
    vcpus:
      desc: Virtual CPUs allocated to the instance
    hostname:
      desc: Guest hostname
    host:
      desc: Compute host running the instance
    user_data:
      desc: Cloud-init user data
    reservation_id:
      desc: Reservation grouping ID
    scheduled_at:
      desc: Scheduling timestamp
    launched_at:
      desc: Launch timestamp
    terminated_at:
      desc: Termination timestamp
    display_name:
      desc: User-visible instance name
    display_description:
      desc: User-visible description
    availability_zone:
      desc: Availability zone of the instance
    locked:
      desc: Lock flag
    os_type:
      desc: Operating system type
    launched_on:
      desc: Legacy launch host record
    instance_type_id:
      desc: Instance type (flavor) ID
    vm_mode:
      desc: Virtualization mode
    uuid:
      desc: Instance UUID
    architecture:
      desc: CPU architecture
    root_device_name:
      desc: Root disk device name
    access_ip_v4:
      desc: IPv4 access address
    access_ip_v6:
      desc: IPv6 access address
    config_drive:
      desc: Config drive reference
    task_state:
      desc: In-progress task state
    default_ephemeral_device:
      desc: Default ephemeral device name
    default_swap_device:
      desc: Default swap device name
    progress:
      desc: Task progress percentage
    auto_disk_config:
      desc: Automatic disk config flag
    shutdown_terminate:
      desc: Terminate-on-shutdown flag
    disable_terminate:
      desc: Termination-disabled flag
    root_gb:
      desc: Root disk GB
    ephemeral_gb:
      desc: Ephemeral disk GB
    cell_name:
      desc: Managing cell name
    node:
      desc: Hypervisor node name
    deleted:
      desc: Soft-delete flag
    locked_by:
      desc: Lock owner
    cleaned:
      desc: Cleanup performed flag
    ephemeral_key_uuid:
      desc: Ephemeral encryption key UUID
- id: SECURITY_GROUPS
  name: SECURITY_GROUPS
  desc: Nova legacy security group definitions. One row per security group recording
    its name, description, owning user and project, and a soft-delete flag. Its firewall
    rules live in SECURITY_GROUP_RULES (linked via parent_group_id) and instance membership
    in SECURITY_GROUP_INSTANCE_ASSOCIATION. This is the Nova-side counterpart of the
    Neutron securitygroups table; the two belong to different services and use different
    identifier types.
  default_granularity: one row per Nova security group (including soft-deleted rows)
  synonyms:
  - nova security groups
  - nova firewall groups
  columns:
    created_at:
      desc: Timestamp when the security group was created
    updated_at:
      desc: Timestamp of the last update to the security group
    deleted_at:
      desc: Timestamp when the security group was soft-deleted; NULL if active
    id:
      desc: Integer primary key of the security group; referenced by SECURITY_GROUP_RULES.parent_group_id
        and SECURITY_GROUP_INSTANCE_ASSOCIATION.security_group_id
    name:
      desc: User-visible security group name; not unique across projects (the same
        name can appear for different user/project owners)
    description:
      desc: Free-text description of the security group
    user_id:
      desc: ID of the user who owns the security group
    project_id:
      desc: ID of the project (tenant) that owns the security group
    deleted:
      desc: 'Soft-delete flag: 0 = active record, non-zero = deleted'
- id: SECURITY_GROUP_RULES
  name: SECURITY_GROUP_RULES
  desc: Nova legacy security group rules. One row per ingress rule of a Nova security
    group, recording the IP protocol, the from_port/to_port port-range bounds, the
    source CIDR or a referenced source security group, and the owning group via parent_group_id.
    Port-range size (to_port - from_port) is a common analysis target; for ICMP rules
    the bounds carry type/code semantics and can be negative. Nova-side counterpart
    of the Neutron securitygrouprules table.
  default_granularity: one row per Nova security group rule (including soft-deleted
    rows)
  synonyms:
  - nova security group rules
  - nova firewall rules
  columns:
    created_at:
      desc: Timestamp when the rule was created
    updated_at:
      desc: Timestamp of the last update to the rule
    deleted_at:
      desc: Timestamp when the rule was soft-deleted; NULL if active
    id:
      desc: Integer primary key of the rule
    parent_group_id:
      desc: Integer ID of the security group this rule belongs to; foreign key to
        SECURITY_GROUPS.id
    protocol:
      desc: IP protocol the rule applies to, e.g. tcp, udp, icmp
    from_port:
      desc: Lower bound of the port range (start port); for ICMP rules this is the
        ICMP type and can be -1
    to_port:
      desc: Upper bound of the port range (end port); for ICMP rules this is the ICMP
        code; to_port - from_port gives the port-range size
    cidr:
      desc: Source IP prefix (CIDR) the rule allows traffic from
    group_id:
      desc: Integer ID of another security group used as the traffic source instead
        of a CIDR; NULL when cidr is used
    deleted:
      desc: 'Soft-delete flag: 0 = active record, non-zero = deleted'
- id: INSTANCE_TYPES
  name: INSTANCE_TYPES
  desc: Nova instance type (flavor) definitions. One row per flavor recording its
    name and public flavorid, resource sizing template (memory_mb, vcpus, swap, vcpu_weight,
    rxtx_factor, root_gb, ephemeral_gb), the disabled flag controlling whether the
    flavor can be used for new boots, the is_public visibility flag, and a soft-delete
    flag. Referenced by INSTANCES.instance_type_id; per-flavor extra specs and project
    access restrictions live in separate satellite tables. This is the flavor definition
    template, whereas INSTANCES stores the sizing actually allocated to each running
    server.
  default_granularity: one row per instance type / flavor (including soft-deleted
    rows)
  synonyms:
  - flavors
  - instance types
  - nova flavors
  columns:
    created_at:
      desc: Timestamp when the instance type was created
    updated_at:
      desc: Timestamp of the last update to the instance type
    deleted_at:
      desc: Timestamp when the instance type was soft-deleted; NULL if active
    name:
      desc: Human-readable flavor name, e.g. m1.small-style names used in the API
    id:
      desc: Integer primary key of the instance type; referenced by INSTANCES.instance_type_id
    memory_mb:
      desc: RAM in MB defined by this flavor template; the per-flavor definition,
        distinct from the per-instance allocation in INSTANCES.memory_mb and the host
        capacity in COMPUTE_NODES.memory_mb
    vcpus:
      desc: Number of virtual CPUs defined by this flavor template; distinct from
        per-instance INSTANCES.vcpus and host capacity COMPUTE_NODES.vcpus
    swap:
      desc: Swap space in MB defined by the flavor
    vcpu_weight:
      desc: Optional weight for vCPU scheduling priority
    flavorid:
      desc: Public flavor identifier string exposed by the API; distinct from the
        internal integer id
    rxtx_factor:
      desc: Network bandwidth scaling factor applied to the flavor
    root_gb:
      desc: Root disk size in GB defined by the flavor
    ephemeral_gb:
      desc: Ephemeral disk size in GB defined by the flavor
    disabled:
      desc: 'Boolean flag: true/disabled flavors cannot be used to boot new instances;
        queries about enabled instance types filter disabled = false'
    is_public:
      desc: 'Boolean visibility flag: public flavors are usable by all projects, private
        ones only via explicit project access grants'
    deleted:
      desc: 'Soft-delete flag: 0 = active record, non-zero = deleted'
- id: SECURITY_GROUP_INSTANCE_ASSOCIATION
  name: SECURITY_GROUP_INSTANCE_ASSOCIATION
  desc: Membership mapping between Nova legacy security groups and instances. One
    row per (security group, instance UUID) assignment, allowing an instance to belong
    to multiple groups; used to determine which instances are protected by a given
    Nova security group. Nova-side counterpart of Neutron's port-level securitygroupportbindings.
  default_granularity: one row per (security group, instance) membership (including
    soft-deleted rows)
  synonyms:
  - nova security group membership
  - instance security group assignment
  columns:
    created_at:
      desc: Timestamp when the membership was created
    updated_at:
      desc: Timestamp of the last update to the membership
    deleted_at:
      desc: Timestamp when the membership was soft-deleted; NULL if active
    id:
      desc: Integer primary key of the membership row
    security_group_id:
      desc: Integer ID of the Nova security group; foreign key to SECURITY_GROUPS.id
    instance_uuid:
      desc: UUID of the associated instance; references INSTANCES.uuid
    deleted:
      desc: 'Soft-delete flag: 0 = active record, non-zero = deleted'
- id: QUOTA_USAGES
  name: QUOTA_USAGES
  desc: Nova quota usage accounting table. One row per (project, user, resource) tracking
    how much of a compute-related resource (cores, ram, instances, gigabytes, volumes,
    floating_ips, etc.) is currently consumed (in_use) and how much is temporarily
    held by pending reservations (reserved). until_refresh counts down remaining reservation
    operations before the usage is recomputed from live data. Rows are soft-deleted
    via the deleted column (deleted = 0 marks active rows). Pending reservation deltas
    against a usage row are recorded in RESERVATIONS (linked by RESERVATIONS.usage_id).
    This is the Nova-side counterpart of the Neutron quotausages table; the two belong
    to different services and cover different resource vocabularies.
  columns:
    created_at:
      desc: Timestamp when the quota usage row was created.
    updated_at:
      desc: Timestamp of the last update to the quota usage row.
    deleted_at:
      desc: Timestamp when the row was soft-deleted; NULL for active rows.
    id:
      desc: '[PK] Auto-increment integer surrogate key of the quota usage row; referenced
        by RESERVATIONS.usage_id.'
    project_id:
      desc: ID of the OpenStack project (tenant) that owns this resource usage.
    resource:
      desc: Name of the quota resource being accounted, e.g. cores, ram, instances,
        gigabytes, volumes, floating_ips, security_groups, server_groups.
    in_use:
      desc: Number of units of the resource currently in use (committed consumption)
        by the project/user.
    reserved:
      desc: Number of units of the resource currently held by active (unexpired, non-deleted)
        reservations for pending operations.
    until_refresh:
      desc: Countdown of remaining reservation operations before Nova recomputes this
        usage row from live data; NULL when no refresh is scheduled.
    deleted:
      desc: 'Soft-delete flag: 0 for active rows; non-zero (set to the row id) for
        deleted rows.'
    user_id:
      desc: ID of the user whose consumption is tracked; NULL when usage is tracked
        at project level only.
    default_granularity: null
  synonyms:
  - nova quota usages
  - compute quota usage
  default_granularity: one row per (project, user, resource) usage record
- id: RESERVATIONS
  name: RESERVATIONS
  desc: Nova quota reservation table. One row per temporary resource reservation created
    while an API operation (e.g. server boot) is pending, holding delta units of a
    resource (cores, ram, instances, etc.) for a project/user until the expire timestamp.
    Each reservation references the quota usage row it charges against via usage_id
    (RESERVATIONS.usage_id = QUOTA_USAGES.id) and carries its own resource name and
    signed delta (positive = amount held). uuid is the externally visible reservation
    identifier. Rows are soft-deleted via the deleted column. This is the Nova-side
    counterpart of the Neutron reservations/resourcedeltas pair; the two belong to
    different services and are unrelated.
  columns:
    created_at:
      desc: Timestamp when the reservation was created.
    updated_at:
      desc: Timestamp of the last update to the reservation row.
    deleted_at:
      desc: Timestamp when the reservation was soft-deleted; NULL for active rows.
    id:
      desc: '[PK] Auto-increment integer surrogate key of the reservation row.'
    uuid:
      desc: UUID string identifying the reservation externally (returned to API clients).
    usage_id:
      desc: Foreign key to QUOTA_USAGES.id, the quota usage row this reservation charges
        its delta against.
    project_id:
      desc: ID of the OpenStack project (tenant) holding the reservation.
    resource:
      desc: Name of the quota resource being reserved, e.g. cores, ram, instances;
        matches the resource of the referenced usage row.
    delta:
      desc: Signed number of resource units held by this reservation (positive = units
        reserved against the quota).
    expire:
      desc: Timestamp at which the reservation expires and its delta is released back
        if the operation did not commit.
    deleted:
      desc: 'Soft-delete flag: 0 for active rows; non-zero (set to the row id) for
        deleted rows.'
    user_id:
      desc: ID of the user who triggered the operation that created the reservation.
    default_granularity: null
  synonyms:
  - nova reservations
  - compute quota reservations
  default_granularity: one row per reservation of one resource unit amount
- id: QUOTAS
  name: QUOTAS
  desc: Nova quota limit definition table. One row per (project, resource) recording
    the hard_limit, the maximum number of units of a compute-related resource (cores,
    ram, instances, etc.) the project is allowed to consume. Actual consumption is
    tracked separately in QUOTA_USAGES (in_use + reserved), which can be compared
    against these limits. Rows are soft-deleted via the deleted column. This is the
    Nova-side counterpart of the Neutron quotas table; the two belong to different
    services and cover different resource vocabularies.
  columns:
    id:
      desc: '[PK] Auto-increment integer surrogate key of the quota limit row.'
    created_at:
      desc: Timestamp when the quota limit row was created.
    updated_at:
      desc: Timestamp of the last update to the quota limit row.
    deleted_at:
      desc: Timestamp when the row was soft-deleted; NULL for active rows.
    project_id:
      desc: ID of the OpenStack project (tenant) the limit applies to.
    resource:
      desc: Name of the quota resource being limited, e.g. cores, ram, instances.
    hard_limit:
      desc: Maximum number of resource units the project may consume; NULL when no
        explicit limit is set.
    deleted:
      desc: 'Soft-delete flag: 0 for active rows; non-zero for deleted rows.'
  synonyms:
  - nova quotas
  - compute quota limits
  default_granularity: one row per (project, resource) quota limit
- id: services
  name: services
  desc: Nova service process registry. One row per running OpenStack compute service
    daemon (nova-compute, nova-scheduler, nova-conductor, etc.) recording the host
    it runs on, its binary name, RPC topic, heartbeat report count, last-seen-up timestamp,
    and an administratively disabled flag with reason. Referenced by COMPUTE_NODES.service_id
    for compute workers; rows are soft-deleted via the deleted column. This is the
    Nova-side service registry and is unrelated to Neutron's agents table, which tracks
    Neutron service agents.
  default_granularity: one row per Nova service process (including soft-deleted rows)
  synonyms:
  - nova services
  - compute service registry
  columns:
    created_at:
      desc: Timestamp when the service record was created
    updated_at:
      desc: Timestamp of the last update to the service record
    deleted_at:
      desc: Timestamp when the service record was soft-deleted; NULL if active
    id:
      desc: Integer primary key of the service record; referenced by COMPUTE_NODES.service_id
        for compute workers
    host:
      desc: Name of the host machine on which this service daemon runs
    binary:
      desc: Name of the service executable/daemon, e.g. nova-compute, nova-scheduler,
        nova-conductor; used to classify rows by service role
    topic:
      desc: RPC topic the service listens on, e.g. compute, scheduler, conductor
    report_count:
      desc: Cumulative number of heartbeat reports the service has sent to the database
    disabled:
      desc: 'Boolean administrative flag: true/1 = the service is disabled and will
        not be scheduled for work'
    disabled_reason:
      desc: Free-text reason recorded when the service was administratively disabled;
        NULL when not disabled
    last_seen_up:
      desc: Timestamp of the most recent heartbeat received from the service; used
        to judge whether the service is alive
    forced_down:
      desc: Boolean flag indicating the service was forcibly marked down by an operator
        instead of via heartbeat timeout
    version:
      desc: Internal version number of the service record schema
    deleted:
      desc: 'Soft-delete flag: 0 = active record, non-zero = deleted'
