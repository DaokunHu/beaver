- id: quotas
  name: quotas
  desc: Neutron quota limit definition table. One row per (tenant, resource) recording
    the limit, the maximum number of units of a network resource the tenant may consume;
    -1 means unlimited. Actual consumption is tracked in quotausages. This is the
    Neutron-side counterpart of the Nova QUOTAS table; the two belong to different
    services, use different key types (UUID id here vs integer id in Nova) and cover
    different resource vocabularies.
  columns:
    id:
      desc: '[PK] UUID string identifying the quota limit row.'
    tenant_id:
      desc: '[INDEX] ID of the OpenStack tenant (project) the limit applies to.'
    resource:
      desc: Name of the Neutron resource being limited, e.g. network, subnet, port,
        floatingip, security_group_rule.
    limit:
      desc: Maximum number of resource units the tenant may consume; -1 indicates
        unlimited.
- id: quotausages
  name: quotausages
  desc: Neutron quota usage accounting table. One row per (tenant, resource) tracking
    how many units of a network resource (port, network, subnet, security_group, floatingip,
    router, etc.) are in use and how many are held by pending Neutron reservations.
    The dirty flag marks rows whose in_use count needs recomputation. This is the
    Neutron-side counterpart of the Nova QUOTA_USAGES table; the two belong to different
    services, use different key structures (tenant_id+resource composite key here
    vs integer surrogate id in Nova) and cover different resource vocabularies.
  columns:
    tenant_id:
      desc: '[PK] ID of the OpenStack tenant (project) owning this network resource
        usage.'
    resource:
      desc: '[PK] Name of the Neutron resource being accounted, e.g. port, network,
        subnet, security_group, floatingip, router.'
    dirty:
      desc: Flag (0/1) indicating the in_use counter is stale and must be recomputed
        from live resources.
      default: '0'
    in_use:
      desc: Number of units of the network resource currently in use by the tenant.
      default: '0'
    reserved:
      desc: Number of units of the network resource held by pending Neutron reservations.
      default: '0'
- id: reservations
  name: reservations
  desc: Neutron quota reservation header table. One row per pending reservation, identified
    by a UUID string, recording the owning tenant and the expiration time after which
    the reservation is released. The reserved resource name and amount are stored
    separately in resourcedeltas (linked by resourcedeltas.reservation_id = reservations.id).
    This is the Neutron-side counterpart of the Nova RESERVATIONS table; unlike Nova's
    single-table design, Neutron splits reservation identity (here) from resource
    deltas (resourcedeltas), and the two services' rows are unrelated.
  columns:
    id:
      desc: '[PK] UUID string identifying the reservation; referenced by resourcedeltas.reservation_id.'
    tenant_id:
      desc: ID of the OpenStack tenant (project) holding the reservation.
    expiration:
      desc: Timestamp at which the reservation expires and its deltas are released
        if the operation did not commit.
- id: resourcedeltas
  name: resourcedeltas
  desc: Neutron reservation resource delta table. One row per (reservation, resource)
    recording the signed amount of a network resource held by a pending reservation.
    Complements the reservations table, which stores only reservation identity, tenant
    and expiration; together they form the Neutron equivalent of Nova's single RESERVATIONS
    table.
  columns:
    resource:
      desc: '[PK] Name of the Neutron resource whose units are held, e.g. port, network,
        subnet.'
    reservation_id:
      desc: '[PK] UUID of the owning reservation; foreign key to reservations.id.'
    amount:
      desc: Signed number of resource units held by this reservation delta.
