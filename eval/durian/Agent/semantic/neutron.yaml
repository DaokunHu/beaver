metrics:
- id: metric_qemu_compute_nodes_with_resource_provider_in_aggregate
  name: QEMU Compute Nodes with Resource Provider in Host Aggregate
  desc: 'Counts compute nodes that run the QEMU hypervisor type, are linked to a placement
    resource provider via matching UUID, and whose host belongs to a given host aggregate.
    Question: How many compute nodes have the QEMU hypervisor type, are linked to
    a resource provider (matching on UUID), and belong to aggregate ID 1? Do not return
    any rounded answers.'
  category: Compute Node and Host Aggregate Comprehensive Analysis
  sql: SELECT COUNT(*) AS qemu_compute_nodes_with_resource_provider FROM COMPUTE_NODES
    cn JOIN RESOURCE_PROVIDERS rp ON cn.UUID = rp.UUID JOIN AGGREGATE_HOSTS ah ON
    ah.HOST = cn.HOST WHERE cn.HYPERVISOR_TYPE = 'QEMU' AND ah.AGGREGATE_ID = '1';
  default_granularity: single total count
- id: metric_flare_instance_details_and_prime_migration_memory_stddev
  name: Flare AZ Instance Details Combined with Prime Migration Memory Stddev
  desc: 'Combined listing of (1) instances in availability zone ''flare3'' whose display
    name matches the ''flare'' pattern, enriched with flavor/NUMA/network_info JSON
    from INSTANCE_EXTRA and INSTANCE_INFO_CACHES plus a per-vCPU minimum memory window
    value, and (2) display names matching ''prime'' that have more than one ''image_image_type''
    system-metadata row, with the sample standard deviation (STDDEV) of MIGRATIONS.MEMORY_TOTAL;
    each combined row is annotated with a reason label and the total count of ''image_image_type''
    system-metadata rows for the instance. Question: For the combined output of (1)
    instances in availability zone ''flare3'' whose display name matches the pattern
    ''flare'' (including instance UUID, hostname, display name, memory_mb, vcpus,
    flavor/NUMA/network_info JSON fields, and the per-vCPU minimum memory window value)
    and (2) instance display names matching ''prime'' that have more than one ''image_image_type''
    system-metadata row along with the standard deviation (using STDDEV only and never
    STDDEV_POP) of MIGRATIONS.MEMORY_TOTAL, additionally show the total number of
    ''image_image_type'' system-metadata rows for each included instance (or display
    name group) and keep the reason label indicating why each row was included. Do
    not return any rounded answers.'
  category: Instance Profile and Migration Comprehensive Analysis
  sql: WITH inner_cte AS (WITH FlareInstances AS (SELECT i.UUID AS instance_uuid,
    i.HOSTNAME AS hostname, i.DISPLAY_NAME AS display_name, i.MEMORY_MB AS memory_mb,
    i.VCPUS AS vcpus, ie.FLAVOR AS flavor_json, ie.NUMA_TOPOLOGY AS numa_topology_json,
    iic.NETWORK_INFO AS network_info_json, MIN(i.MEMORY_MB) OVER (PARTITION BY i.VCPUS
    ORDER BY i.VCPUS) AS window_column FROM INSTANCES AS i JOIN INSTANCE_EXTRA AS
    ie ON ie.INSTANCE_UUID = i.UUID JOIN INSTANCE_INFO_CACHES AS iic ON iic.INSTANCE_UUID
    = i.UUID WHERE i.AVAILABILITY_ZONE = 'flare3' AND i.DISPLAY_NAME REGEXP 'flare'),
    PrimeMigrationStddev AS (SELECT i.display_name, STDDEV(m.memory_total) AS memory_total_stddev
    FROM migrations AS m JOIN instances AS i ON m.instance_uuid = i.uuid JOIN instance_system_metadata
    AS ism ON i.uuid = ism.instance_uuid WHERE ism.key = 'image_image_type' AND i.display_name
    REGEXP 'prime' GROUP BY i.display_name HAVING COUNT(ism.id) > 1 ORDER BY memory_total_stddev
    DESC), CombinedResults AS ( SELECT fi.instance_uuid, fi.hostname, fi.display_name,
    fi.memory_mb, fi.vcpus, fi.flavor_json, fi.numa_topology_json, fi.network_info_json,
    fi.window_column, NULL AS memory_total_stddev, 'Flare AZ Instance Details' AS
    reason FROM FlareInstances fi UNION ALL SELECT NULL AS instance_uuid, NULL AS
    hostname, pms.display_name, NULL AS memory_mb, NULL AS vcpus, NULL AS flavor_json,
    NULL AS numa_topology_json, NULL AS network_info_json, NULL AS window_column,
    pms.memory_total_stddev, 'Prime Migration Memory Stddev' AS reason FROM PrimeMigrationStddev
    pms ) SELECT * FROM CombinedResults ORDER BY reason, display_name, instance_uuid)
    SELECT ic.*, COUNT(ism2.id) AS image_image_type_metadata_rows FROM inner_cte ic
    LEFT JOIN instances i2 ON i2.uuid = ic.instance_uuid LEFT JOIN instance_system_metadata
    ism2 ON ism2.instance_uuid = i2.uuid AND ism2.key = 'image_image_type' GROUP BY
    ic.instance_uuid, ic.hostname, ic.display_name, ic.memory_mb, ic.vcpus, ic.flavor_json,
    ic.numa_topology_json, ic.network_info_json, ic.window_column, ic.memory_total_stddev,
    ic.reason ORDER BY ic.reason, ic.display_name, ic.instance_uuid;
  default_granularity: one row per included instance (flare branch) or per display-name
    group (prime branch)
- id: metric_instance_system_metadata_rows_by_key
  name: Instance System Metadata Row Count by Key
  desc: 'Classification statistic over INSTANCE_SYSTEM_METADATA: counts active system-metadata
    rows per key (e.g. image_image_type, image_min_ram, image_disk_format, clean_attempts),
    showing which image-derived and operational properties are recorded and how widely
    they are populated across instances.'
  category: Instance Metadata Analysis
  sql: SELECT key, COUNT(*) AS metadata_rows, COUNT(DISTINCT instance_uuid) AS instances_covered
    FROM INSTANCE_SYSTEM_METADATA WHERE deleted = 0 GROUP BY key ORDER BY metadata_rows
    DESC;
  default_granularity: one row per metadata key
- id: metric_instance_resource_totals_by_availability_zone
  name: Instance Resource Totals by Availability Zone
  desc: 'Aggregation over INSTANCES: per availability zone, counts active instances
    and sums/averages their allocated memory_mb, vcpus, root_gb and ephemeral_gb,
    showing how instance resource sizing is distributed across availability zones.'
  category: Instance Resource Analysis
  sql: SELECT availability_zone, COUNT(*) AS instance_count, SUM(memory_mb) AS total_memory_mb,
    AVG(memory_mb) AS avg_memory_mb, SUM(vcpus) AS total_vcpus, AVG(vcpus) AS avg_vcpus,
    SUM(root_gb) AS total_root_gb, SUM(ephemeral_gb) AS total_ephemeral_gb FROM INSTANCES
    WHERE deleted = 0 GROUP BY availability_zone ORDER BY instance_count DESC;
  default_granularity: one row per availability zone
- id: metric_migration_memory_transfer_stats_by_type_status
  name: Migration Memory Transfer Statistics by Type and Status
  desc: 'Aggregation over MIGRATIONS: per migration_type and status, counts migration
    rows and computes average, minimum, maximum and sample standard deviation (STDDEV)
    of MEMORY_TOTAL, MEMORY_PROCESSED and MEMORY_REMAINING; only live-migration rows
    carry non-NULL memory counters, so other types show NULL statistics.'
  category: Migration Analysis
  sql: SELECT migration_type, status, COUNT(*) AS migration_count, AVG(memory_total)
    AS avg_memory_total, MIN(memory_total) AS min_memory_total, MAX(memory_total)
    AS max_memory_total, STDDEV(memory_total) AS stddev_memory_total, AVG(memory_processed)
    AS avg_memory_processed, AVG(memory_remaining) AS avg_memory_remaining FROM MIGRATIONS
    WHERE deleted = 0 GROUP BY migration_type, status ORDER BY migration_count DESC;
  default_granularity: one row per migration type and status combination
- id: metric_forge_shelved_offloaded_instances_above_zone_avg_memory_with_migration_summary
  name: Forge Shelved-Offloaded Instances Above Zone Average Memory with Migration
    Summary
  desc: 'Combined listing of (1) instances with display name ''forge'' in VM state
    ''shelved_offloaded'' whose MEMORY_MB exceeds the average ''forge'' memory of
    their availability zone, enriched with INSTANCE_INFO_CACHES id/network_info and
    a per-project minimum memory window value, and (2) a ''shelved_offloaded'' migration
    summary over completed migrations (minimum instance memory, total MEMORY_PROCESSED,
    and whether any related instance has a non-deleted network info cache row). Question:
    For instances with display name "forge" that are in the "shelved_offloaded" VM
    state and have memory (MB) greater than the average "forge" memory (MB) in their
    availability zone, list the instance details (ID, UUID, user ID, project ID, hostname,
    VM/power state, memory, vCPUs, availability zone, instance-info-cache ID and network
    info, and the per-project minimum memory window value) along with the "shelved_offloaded"
    migration summary for completed migrations (minimum instance memory, total migration
    memory processed, and whether any related instances have a non-deleted network
    info cache record). Do not return any rounded answers.'
  category: Instance Profile and Migration Comprehensive Analysis
  sql: WITH q1 AS (WITH inner_cte AS (SELECT i.ID AS instance_id, i.UUID AS instance_uuid,
    i.USER_ID, i.PROJECT_ID, i.HOSTNAME, i.VM_STATE, i.POWER_STATE, i.MEMORY_MB, i.VCPUS,
    i.AVAILABILITY_ZONE, c.ID AS info_cache_id, c.NETWORK_INFO, MIN(i.MEMORY_MB) OVER
    (PARTITION BY i.PROJECT_ID ORDER BY i.PROJECT_ID) AS window_column FROM INSTANCES
    AS i JOIN INSTANCE_INFO_CACHES AS c ON i.UUID = c.INSTANCE_UUID WHERE i.DISPLAY_NAME
    = 'forge'), ZoneAverages AS ( SELECT i2.AVAILABILITY_ZONE, AVG(i2.MEMORY_MB *
    1.0) AS avg_zone_memory_mb FROM INSTANCES AS i2 WHERE i2.DISPLAY_NAME = 'forge'
    GROUP BY i2.AVAILABILITY_ZONE ) SELECT inner_cte.instance_id, inner_cte.instance_uuid,
    inner_cte.USER_ID, inner_cte.PROJECT_ID, inner_cte.HOSTNAME, inner_cte.VM_STATE,
    inner_cte.POWER_STATE, inner_cte.MEMORY_MB, inner_cte.VCPUS, inner_cte.AVAILABILITY_ZONE,
    inner_cte.info_cache_id, inner_cte.NETWORK_INFO, inner_cte.window_column FROM
    inner_cte JOIN ZoneAverages za ON za.AVAILABILITY_ZONE = inner_cte.AVAILABILITY_ZONE
    WHERE inner_cte.MEMORY_MB > za.avg_zone_memory_mb), q2 AS (WITH inner_cte AS (
    SELECT MIN(i.MEMORY_MB) AS min_instance_memory_mb, SUM(m.MEMORY_PROCESSED) AS
    total_migration_memory_processed FROM MIGRATIONS m JOIN INSTANCES i ON m.INSTANCE_UUID
    = i.UUID JOIN INSTANCE_INFO_CACHES ic ON i.UUID = ic.INSTANCE_UUID WHERE m.STATUS
    = 'completed' AND i.VM_STATE = 'shelved_offloaded' ) SELECT i.VM_STATE AS vm_state,
    inner_cte.min_instance_memory_mb, inner_cte.total_migration_memory_processed,
    CASE WHEN EXISTS ( SELECT 1 FROM MIGRATIONS m2 JOIN INSTANCES i2 ON m2.INSTANCE_UUID
    = i2.UUID JOIN INSTANCE_INFO_CACHES ic2 ON i2.UUID = ic2.INSTANCE_UUID WHERE m2.STATUS
    = 'completed' AND i2.VM_STATE = 'shelved_offloaded' AND ic2.DELETED = 0 ) THEN
    'Yes' ELSE 'No' END AS has_network_info_cache FROM inner_cte JOIN INSTANCES i
    ON i.VM_STATE = 'shelved_offloaded' GROUP BY i.VM_STATE, inner_cte.min_instance_memory_mb,
    inner_cte.total_migration_memory_processed) SELECT q1.instance_id, q1.instance_uuid,
    q1.user_id, q1.project_id, q1.hostname, q1.vm_state, q1.power_state, q1.memory_mb,
    q1.vcpus, q1.availability_zone, q1.info_cache_id, q1.network_info, q1.window_column
    AS min_memory_mb_within_project, q2.min_instance_memory_mb AS shelved_offloaded_min_instance_memory_mb,
    q2.total_migration_memory_processed, q2.has_network_info_cache FROM q1 LEFT JOIN
    q2 ON q2.vm_state = q1.vm_state WHERE q1.vm_state = 'shelved_offloaded' ORDER
    BY q1.availability_zone, q1.project_id, q1.instance_id;
  default_granularity: one row per qualifying shelved_offloaded 'forge' instance
- id: metric_top_2014_launch_groups_by_max_memory_with_forge_extra_check
  name: Top 2014 Launch Groups by Max Memory with Forge Instance-Extra Checks
  desc: 'For the top 10 (display name, launched-at) groups of instances launched in
    2014 with maximum MEMORY_MB above 16000, reports the group''s max memory, whether
    any instance in the group has a non-empty NUMA_TOPOLOGY in INSTANCE_EXTRA, how
    many instances in the group are named ''forge'', and whether any of those ''forge''
    instances has an INSTANCE_EXTRA row marked deleted. Question: For each of the
    top 10 (display name, launched-at timestamp) groups with the highest maximum memory
    among instances launched in 2014 (only keeping groups where that maximum exceeds
    16000 MB), show the group’s display name, launched-at timestamp, maximum memory,
    whether any instance in the group has a non-empty NUMA topology recorded, how
    many instances in that group are the display name ''forge'', and whether any of
    those ''forge'' instances has an instance-extra record marked as deleted. Do not
    return any rounded answers.'
  category: Instance Resource Analysis
  sql: WITH top_groups_2014 AS ( WITH inner_cte AS ( SELECT i.DISPLAY_NAME, MAX(i.MEMORY_MB)
    AS max_memory_mb, i.LAUNCHED_AT FROM INSTANCE_EXTRA ie JOIN INSTANCES i ON ie.INSTANCE_UUID
    = i.UUID JOIN INSTANCE_INFO_CACHES ic ON i.UUID = ic.INSTANCE_UUID WHERE EXTRACT(YEAR
    FROM i.LAUNCHED_AT) = 2014 GROUP BY i.DISPLAY_NAME, i.LAUNCHED_AT HAVING MAX(i.MEMORY_MB)
    > 16000 ) SELECT inner_cte.DISPLAY_NAME, inner_cte.LAUNCHED_AT, inner_cte.max_memory_mb,
    CASE WHEN EXISTS ( SELECT 1 FROM INSTANCES i2 JOIN INSTANCE_EXTRA ie2 ON ie2.INSTANCE_UUID
    = i2.UUID WHERE i2.DISPLAY_NAME = inner_cte.DISPLAY_NAME AND i2.LAUNCHED_AT =
    inner_cte.LAUNCHED_AT AND ie2.NUMA_TOPOLOGY IS NOT NULL AND ie2.NUMA_TOPOLOGY
    <> '' ) THEN 'Yes' ELSE 'No' END AS has_numa_topology FROM inner_cte ORDER BY
    inner_cte.max_memory_mb DESC LIMIT 10 ), forge_instances AS ( WITH inner_cte AS
    ( SELECT i.UUID AS instance_uuid, i.DISPLAY_NAME AS display_name, i.VM_STATE AS
    vm_state, i.MEMORY_MB AS memory_mb, i.VCPUS AS vcpus, ie.ID AS instance_extra_id,
    ie.CREATED_AT AS instance_extra_created_at, iic.NETWORK_INFO AS network_info,
    MIN(ie.ID) OVER ( ORDER BY i.MEMORY_MB ROWS BETWEEN 3 PRECEDING AND 1 FOLLOWING
    ) AS window_column FROM INSTANCES AS i JOIN INSTANCE_EXTRA AS ie ON ie.INSTANCE_UUID
    = i.UUID JOIN INSTANCE_INFO_CACHES AS iic ON iic.INSTANCE_UUID = i.UUID WHERE
    i.DISPLAY_NAME = 'forge' ) SELECT ic.instance_uuid, ic.display_name, ic.vm_state,
    ic.memory_mb, ic.vcpus, ic.instance_extra_id, ic.instance_extra_created_at, ic.network_info,
    ic.window_column, CASE WHEN EXISTS ( SELECT 1 FROM INSTANCE_EXTRA ie2 JOIN INSTANCES
    i2 ON i2.UUID = ie2.INSTANCE_UUID WHERE i2.UUID = ic.instance_uuid AND ie2.DELETED
    <> 0 ) THEN 'Yes' ELSE 'No' END AS has_deleted_instance_extra FROM inner_cte ic
    ) SELECT tg.DISPLAY_NAME AS group_display_name, tg.LAUNCHED_AT AS group_launched_at,
    tg.max_memory_mb AS group_max_memory_mb, tg.has_numa_topology AS group_has_numa_topology,
    COUNT(fi.instance_uuid) AS forge_instance_count_in_group, MAX(CASE WHEN fi.has_deleted_instance_extra
    = 'Yes' THEN 1 ELSE 0 END) AS any_forge_instance_has_deleted_instance_extra FROM
    top_groups_2014 tg LEFT JOIN INSTANCES i ON i.DISPLAY_NAME = tg.DISPLAY_NAME AND
    i.LAUNCHED_AT = tg.LAUNCHED_AT LEFT JOIN forge_instances fi ON fi.instance_uuid
    = i.UUID GROUP BY tg.DISPLAY_NAME, tg.LAUNCHED_AT, tg.max_memory_mb, tg.has_numa_topology
    ORDER BY tg.max_memory_mb DESC;
  default_granularity: one row per (display name, launched-at) group among the top
    10 by max memory
- id: metric_prime_cache_update_variability_and_flare3_memory_deviation
  name: Prime Cache-Update Variability Combined with Flare3 Memory Deviation
  desc: 'Combined result set of (1) each non-deleted instance display name matching
    ''prime'' with the coefficient of variation (STDDEV/AVG) of its instance-info-cache
    update latency relative to instance creation, benchmarked against the overall
    average coefficient of variation and categorized as HIGH/LOW/AVERAGE_VARIABILITY
    at ±50% thresholds, and (2) each instance in availability zone ''flare3'' whose
    display name matches ''flare'' with its MEMORY_MB deviation from the overall average
    memory; each row carries a reason label identifying which rule produced it. Question:
    List (1) each non-deleted instance display name matching the pattern ''prime''
    with its cache-update time coefficient of variation (using STDDEV only and never
    STDDEV_POP), the overall average coefficient of variation (using STDDEV only and
    never STDDEV_POP) as a benchmark, and a variability category, and (2) each instance
    in availability zone ''flare3'' whose display name matches the pattern ''flare''
    with its deviation from the overall average memory (using that overall average
    as the benchmark), returning a combined result set with a reason indicating which
    rule produced each row. Do not return any rounded answers. Categorize each display
    name as ''HIGH_VARIABILITY'' (at least 50% above the benchmark), ''LOW_VARIABILITY''
    (at least 50% below the benchmark), or ''AVERAGE_VARIABILITY''.'
  category: Instance Profile and Migration Comprehensive Analysis
  sql: WITH prime_variability AS ( WITH inner_cte AS ( SELECT i.display_name, STDDEV(c.updated_at
    - i.created_at) / NULLIF(AVG(c.updated_at - i.created_at), 0) AS coefficient_of_variation
    FROM instances AS i JOIN instance_extra AS e ON e.instance_uuid = i.uuid JOIN
    instance_info_caches AS c ON c.instance_uuid = i.uuid WHERE i.deleted = 0 AND
    i.display_name REGEXP 'prime' GROUP BY i.display_name HAVING AVG(c.updated_at
    - i.created_at) > 0 ORDER BY coefficient_of_variation DESC ), avg_cte AS ( SELECT
    AVG(coefficient_of_variation) AS avg_coefficient_of_variation FROM inner_cte )
    SELECT ic.display_name, ic.coefficient_of_variation, ac.avg_coefficient_of_variation
    AS benchmark, CASE WHEN ic.coefficient_of_variation > ac.avg_coefficient_of_variation
    * 1.5 THEN 'HIGH_VARIABILITY' WHEN ic.coefficient_of_variation < ac.avg_coefficient_of_variation
    * 0.5 THEN 'LOW_VARIABILITY' ELSE 'AVERAGE_VARIABILITY' END AS variability_category
    FROM inner_cte ic CROSS JOIN avg_cte ac ORDER BY ic.coefficient_of_variation DESC
    ), flare_memory AS ( WITH inner_cte AS ( SELECT i.UUID AS instance_uuid, i.HOSTNAME
    AS hostname, i.MEMORY_MB AS memory_mb, ie.ID AS instance_extra_id, ie.CREATED_AT
    AS instance_extra_created_at, AVG(i.MEMORY_MB) OVER ( PARTITION BY i.VM_STATE
    ORDER BY i.MEMORY_MB ROWS BETWEEN 2 PRECEDING AND 2 FOLLOWING ) AS window_column
    FROM INSTANCES AS i JOIN INSTANCE_EXTRA AS ie ON ie.INSTANCE_UUID = i.UUID JOIN
    INSTANCE_INFO_CACHES AS iic ON iic.INSTANCE_UUID = i.UUID WHERE i.AVAILABILITY_ZONE
    = 'flare3' AND i.DISPLAY_NAME REGEXP 'flare' ORDER BY i.MEMORY_MB ), overall_avg
    AS ( SELECT AVG(memory_mb) AS overall_avg_memory_mb FROM inner_cte ) SELECT ic.instance_uuid,
    ic.hostname, ic.memory_mb, ic.instance_extra_id, ic.instance_extra_created_at,
    ic.window_column, oa.overall_avg_memory_mb, (ic.memory_mb - oa.overall_avg_memory_mb)
    AS deviation_from_overall_avg_memory_mb FROM inner_cte ic CROSS JOIN overall_avg
    oa ORDER BY ic.memory_mb ), CombinedResults AS ( SELECT pv.display_name AS entity_name,
    pv.coefficient_of_variation AS metric_value, pv.benchmark AS benchmark_value,
    pv.variability_category AS category, 'Prime display-name cache-update variability'
    AS reason FROM prime_variability pv UNION ALL SELECT fm.instance_uuid AS entity_name,
    fm.deviation_from_overall_avg_memory_mb AS metric_value, fm.overall_avg_memory_mb
    AS benchmark_value, CASE WHEN fm.deviation_from_overall_avg_memory_mb > 0 THEN
    'ABOVE_OVERALL_AVG' WHEN fm.deviation_from_overall_avg_memory_mb < 0 THEN 'BELOW_OVERALL_AVG'
    ELSE 'AT_OVERALL_AVG' END AS category, 'Flare3 instance memory deviation' AS reason
    FROM flare_memory fm ) SELECT entity_name, metric_value, benchmark_value, category,
    reason FROM CombinedResults ORDER BY entity_name;
  default_granularity: one row per prime display name (variability branch) or per
    flare3 instance (memory deviation branch)
- id: metric_blaze8_host_root_gb_variability_rollup_with_migration_status
  name: Blaze8-12 Host Root-GB Variability Rollup by Image Type and Migration Activity
  desc: 'For instances on host ''blaze8-12'' (non-deleted INSTANCE_INFO_CACHES rows
    and non-deleted INSTANCE_SYSTEM_METADATA entries with key ''image_image_type''),
    computes per display name the coefficient of variation (STDDEV/AVG) of ROOT_GB,
    labels the host''s migration activity as Active/Inactive based on whether any
    non-deleted migration touching the host is still in progress, and aggregates the
    average coefficient of variation and row count by image type, migration status
    and display name WITH ROLLUP subtotals and a grand total; additionally attaches,
    for display names matching ''prime'', the maximum MEMORY_TOTAL of completed migrations
    when greater than 0. Question: For instances running on host ''blaze8-12'' (using
    only non-deleted instance info cache rows and non-deleted system metadata entries
    for key ''image_image_type''), show the image type, host migration activity label
    (Active/Inactive), instance display name, the average coefficient of variation
    (using STDDEV only and never STDDEV_POP) of root disk size (GB) with rollup subtotals
    and a grand total, the row count, and (when the display name matches REGEXP ''prime'')
    the maximum completed-migration memory_total observed for that display name (only
    when that maximum is greater than 0). Do not return any rounded answers.'
  category: Instance Profile and Migration Comprehensive Analysis
  sql: WITH q1 AS ( WITH inner_cte AS ( SELECT i.display_name, STDDEV(i.root_gb) /
    NULLIF(AVG(i.root_gb), 0) AS coefficient_of_variation FROM instances AS i JOIN
    instance_system_metadata AS ism ON ism.instance_uuid = i.uuid JOIN instance_info_caches
    AS iic ON i.uuid = iic.instance_uuid WHERE ism.key = 'image_image_type' AND iic.deleted
    = 0 AND i.host = 'blaze8-12' GROUP BY i.display_name HAVING AVG(i.root_gb) > 0
    ORDER BY coefficient_of_variation DESC ), Enriched AS ( SELECT ic.display_name,
    ism2.value AS image_type, CASE WHEN EXISTS ( SELECT 1 FROM migrations m WHERE
    (m.source_compute = i.host OR m.dest_compute = i.host) AND m.deleted = 0 AND m.status
    NOT IN ('completed', 'failed', 'error') ) THEN 'Active' ELSE 'Inactive' END AS
    host_migration_status, ic.coefficient_of_variation FROM inner_cte ic JOIN instances
    i ON i.display_name = ic.display_name AND i.host = 'blaze8-12' JOIN instance_system_metadata
    ism2 ON ism2.instance_uuid = i.uuid AND ism2.key = 'image_image_type' AND ism2.deleted
    = 0 JOIN instance_info_caches iic2 ON iic2.instance_uuid = i.uuid AND iic2.deleted
    = 0 ) SELECT CASE WHEN GROUPING(image_type) = 1 THEN 'GRAND TOTAL' ELSE image_type
    END AS image_type, CASE WHEN GROUPING(host_migration_status) = 1 AND GROUPING(image_type)
    = 0 THEN 'SUBTOTAL' ELSE host_migration_status END AS host_migration_status, CASE
    WHEN GROUPING(display_name) = 1 AND GROUPING(host_migration_status) = 0 THEN 'SUBTOTAL'
    ELSE display_name END AS display_name, AVG(coefficient_of_variation) AS avg_coefficient_of_variation,
    COUNT(*) AS row_count FROM Enriched GROUP BY image_type, host_migration_status,
    display_name WITH ROLLUP ), q2 AS ( WITH inner_cte AS (SELECT i.display_name,
    MAX(m.memory_total) AS max_memory_total, m.status FROM instances i JOIN migrations
    m ON i.uuid = m.instance_uuid WHERE m.status = 'completed' AND i.display_name
    REGEXP 'prime' GROUP BY i.display_name, m.status HAVING MAX(m.memory_total) >
    0) SELECT inner_cte.display_name, MAX(inner_cte.max_memory_total) AS max_completed_migration_memory_total
    FROM inner_cte GROUP BY inner_cte.display_name ) SELECT q1.image_type, q1.host_migration_status,
    q1.display_name, q1.avg_coefficient_of_variation, q1.row_count, q2.max_completed_migration_memory_total
    FROM q1 LEFT JOIN q2 ON q2.display_name = q1.display_name ORDER BY q1.image_type,
    q1.host_migration_status, q1.display_name;
  default_granularity: one row per (image type, host migration status, display name)
    combination plus rollup subtotal and grand total rows
- id: metric_prime_completed_migration_memory_and_instance_memory_double_threshold
  name: Prime Instances Passing Both Migration Memory and Instance Memory Thresholds
  desc: 'For instances whose display name matches ''prime'' with completed migrations,
    returns only instances satisfying two conditions simultaneously: (1) at least
    one (display name, migration status, created-at) group whose maximum MEMORY_TOTAL
    exceeds the overall average of those per-group maxima (and is > 0), and (2) an
    average instance MEMORY_MB (for completed, non-deleted instances) exceeding the
    overall average of those per-instance averages; shows display name, migration
    status, per-group max MEMORY_TOTAL, migration created timestamp, minimum migration
    ID and average instance memory. Question: For instances whose display name matches
    the regular expression ''prime'' and that have completed migrations, return only
    those instances that (1) have at least one (display name, migration status, created-at)
    group whose maximum migration MEMORY_TOTAL is greater than the overall average
    of these per-group maxima (and greater than 0), and (2) have an average instance
    MEMORY_MB (for completed, not-deleted instances) greater than the overall average
    of those per-instance averages; show the instance display name, migration status,
    per-group maximum MEMORY_TOTAL, migration created timestamp, minimum migration
    ID, and average instance memory (MB). Do not return any rounded answers.'
  category: Instance Profile and Migration Comprehensive Analysis
  sql: WITH Q1_inner_cte AS ( WITH inner_cte AS ( SELECT i.display_name, m.status,
    MAX(m.memory_total) AS max_memory_total, m.created_at FROM migrations m JOIN instances
    i ON m.instance_uuid = i.uuid JOIN instance_info_caches ic ON i.uuid = ic.instance_uuid
    WHERE m.status = 'completed' AND i.display_name REGEXP 'prime' GROUP BY i.display_name,
    m.status, m.created_at HAVING MAX(m.memory_total) > 0 ), AvgOfGroupMax AS ( SELECT
    AVG(inner_cte.max_memory_total * 1.0) AS avg_group_max_memory_total FROM inner_cte
    ) SELECT inner_cte.display_name, inner_cte.status, inner_cte.max_memory_total,
    inner_cte.created_at FROM inner_cte WHERE inner_cte.max_memory_total > (SELECT
    avg_group_max_memory_total FROM AvgOfGroupMax) ), Q2_inner_cte AS ( WITH inner_cte
    AS ( SELECT i.DISPLAY_NAME, MIN(m.ID) AS min_migration_id, AVG(i.MEMORY_MB) AS
    avg_instance_memory_mb FROM MIGRATIONS m JOIN INSTANCES i ON m.INSTANCE_UUID =
    i.UUID JOIN INSTANCE_SYSTEM_METADATA ism ON i.UUID = ism.INSTANCE_UUID WHERE m.STATUS
    = 'completed' AND i.DELETED = 0 AND i.DISPLAY_NAME REGEXP 'prime' GROUP BY i.DISPLAY_NAME
    ) SELECT inner_cte.DISPLAY_NAME, inner_cte.min_migration_id, inner_cte.avg_instance_memory_mb
    FROM inner_cte WHERE inner_cte.avg_instance_memory_mb > ( SELECT AVG(inner_cte2.avg_instance_memory_mb)
    FROM inner_cte AS inner_cte2 ) ) SELECT q1.display_name, q1.status, q1.max_memory_total,
    q1.created_at, q2.min_migration_id, q2.avg_instance_memory_mb FROM Q1_inner_cte
    q1 JOIN Q2_inner_cte q2 ON q1.display_name = q2.DISPLAY_NAME;
  default_granularity: one row per qualifying (display name, migration status, created-at)
    group
- id: metric_blaze8_top10_display_names_memory_and_migration_context_with_memory_remaining_cov
  name: Blaze8-12 Top Display Names by Average Memory with Migration Context and Memory-Remaining
    Variability
  desc: 'For the top 10 instance display names on host ''blaze8-12'' (non-deleted
    instances with power state 4, linked through INSTANCE_EXTRA and INSTANCE_INFO_CACHES
    by UUID), reports each display name''s minimum instance ID, average MEMORY_MB,
    and whether any instance in the group has a non-empty MIGRATION_CONTEXT in INSTANCE_EXTRA;
    additionally attaches, when available, the coefficient of variation (STDDEV/AVG)
    of MEMORY_REMAINING for completed migrations of that display name (restricted
    to instances with an ''image_image_type'' system-metadata row on the host) and
    its deviation from the overall average coefficient of variation across all such
    instances on ''blaze8-12''. Question: For the top 10 instance display names on
    host ''blaze8-12'' (considering only instances that are not deleted and have power
    state 4, using the UUID links between INSTANCES, INSTANCE_EXTRA, and INSTANCE_INFO_CACHES),
    return each display name along with its minimum instance ID, average memory (MB),
    whether any instance in that display-name group has a non-empty migration context
    in INSTANCE_EXTRA, and (when available) the coefficient of variation (using STDDEV
    only and never STDDEV_POP) of memory_remaining for completed migrations of that
    display name plus its deviation from the overall average coefficient of variation
    (using STDDEV only and never STDDEV_POP) across all such instances on ''blaze8-12''.
    Do not return any rounded answers.'
  category: Instance Profile and Migration Comprehensive Analysis
  sql: WITH q1 AS ( WITH inner_cte AS ( SELECT MIN(i.ID) AS min_instance_id, AVG(i.MEMORY_MB)
    AS avg_memory_mb FROM INSTANCES i JOIN INSTANCE_EXTRA ie ON ie.INSTANCE_UUID =
    i.UUID JOIN INSTANCE_INFO_CACHES ic ON ic.INSTANCE_UUID = i.UUID WHERE i.DELETED
    = 0 AND i.POWER_STATE = 4 AND i.HOST = 'blaze8-12' GROUP BY i.DISPLAY_NAME ) SELECT
    i.DISPLAY_NAME AS display_name, inner_cte.min_instance_id, inner_cte.avg_memory_mb,
    CASE WHEN EXISTS ( SELECT 1 FROM INSTANCES i2 JOIN INSTANCE_EXTRA ie2 ON ie2.INSTANCE_UUID
    = i2.UUID JOIN INSTANCE_INFO_CACHES ic2 ON ic2.INSTANCE_UUID = i2.UUID WHERE i2.DELETED
    = 0 AND i2.POWER_STATE = 4 AND i2.HOST = 'blaze8-12' AND i2.DISPLAY_NAME = i.DISPLAY_NAME
    AND ie2.MIGRATION_CONTEXT IS NOT NULL AND ie2.MIGRATION_CONTEXT <> '' ) THEN 'Yes'
    ELSE 'No' END AS has_migration_context FROM inner_cte JOIN INSTANCES i ON i.ID
    = inner_cte.min_instance_id ORDER BY inner_cte.avg_memory_mb DESC LIMIT 10 ),
    q2 AS ( WITH inner_cte AS ( SELECT i.display_name, STDDEV(m.memory_remaining)
    / NULLIF(AVG(m.memory_remaining), 0) AS coefficient_of_variation FROM migrations
    AS m JOIN instances AS i ON m.instance_uuid = i.uuid JOIN instance_system_metadata
    AS ism ON i.uuid = ism.instance_uuid WHERE m.status = 'completed' AND ism.key
    = 'image_image_type' AND i.host = 'blaze8-12' GROUP BY i.display_name HAVING AVG(m.memory_remaining)
    > 0 ORDER BY coefficient_of_variation DESC ), avg_cov AS ( SELECT AVG(coefficient_of_variation)
    AS avg_coefficient_of_variation FROM inner_cte ) SELECT ic.display_name, ic.coefficient_of_variation,
    (ic.coefficient_of_variation - ac.avg_coefficient_of_variation) AS deviation_from_avg_coefficient_of_variation
    FROM inner_cte ic CROSS JOIN avg_cov ac ORDER BY ic.coefficient_of_variation DESC
    ) SELECT q1.display_name, q1.min_instance_id, q1.avg_memory_mb, q1.has_migration_context,
    q2.coefficient_of_variation, q2.deviation_from_avg_coefficient_of_variation FROM
    q1 LEFT JOIN q2 ON q2.display_name = q1.display_name ORDER BY q1.avg_memory_mb
    DESC;
  default_granularity: one row per top-10 display name by average memory
- id: metric_instance_memory_dispersion_by_vm_state_with_pci_requests
  name: Instance Memory Dispersion by VM State for Instances with PCI Requests
  desc: 'Aggregation over INSTANCES joined to INSTANCE_EXTRA: per VM state, computes
    the average, range (max-min) and variance of MEMORY_MB for instances whose INSTANCE_EXTRA.PCI_REQUESTS
    is non-empty (not ''[]''), and cross-joins the overall average of the per-VM-state
    average memory as a benchmark. Question: For each VM state, show the VM state,
    the average/range/variance of instance memory (in MB) for instances that have
    a non-empty PCI requests value recorded in the instance extra table, along with
    the overall average of the per-VM-state average memory across all VM states. Do
    not return any rounded answers.'
  category: Instance Resource Analysis
  sql: WITH inner_cte AS ( SELECT i.VM_STATE AS vm_state, AVG(i.MEMORY_MB) AS avg_memory_mb,
    MAX(i.MEMORY_MB) - MIN(i.MEMORY_MB) AS memory_mb_range, VARIANCE(i.MEMORY_MB)
    AS memory_mb_variance FROM INSTANCES AS i JOIN INSTANCE_EXTRA AS ie ON i.UUID
    = ie.INSTANCE_UUID WHERE ie.PCI_REQUESTS <> '[]' GROUP BY i.VM_STATE ORDER BY
    memory_mb_range DESC ) SELECT inner_cte.vm_state, inner_cte.avg_memory_mb, inner_cte.memory_mb_range,
    inner_cte.memory_mb_variance, overall_avg.avg_of_avg_memory_mb FROM inner_cte
    JOIN ( SELECT AVG(avg_memory_mb) AS avg_of_avg_memory_mb FROM inner_cte ) AS overall_avg;
  default_granularity: one row per VM state
- id: metric_blaze8_completed_migrations_running_sum_by_instance_type
  name: Blaze8-12 Completed Migrations with Running Sum of Migration IDs by Instance
    Type
  desc: 'For completed migrations whose instance is hosted on ''blaze8-12'', lists
    migration ID, instance display name and INSTANCE_INFO_CACHES ID together with
    a running sum of migration IDs within each instance type (partitioned by INSTANCES.INSTANCE_TYPE_ID,
    ordered by migration ID), keeping only rows whose running sum exceeds the average
    running-sum value across all such rows. Question: For migrations whose status
    is "completed" and whose instance is hosted on "blaze8-12", list the migration
    ID, the instance display name, and the instance info cache ID, along with the
    running sum of migration IDs within each instance type (partitioned by the instance’s
    INSTANCE_TYPE_ID) ordered by migration ID, but only include rows where this running
    sum is greater than the average running-sum value across all such rows. Do not
    return any rounded answers.'
  category: Migration Analysis
  sql: WITH inner_cte AS ( SELECT m.ID AS migration_id, i.DISPLAY_NAME AS instance_display_name,
    c.ID AS instance_info_cache_id, SUM(m.ID) OVER (PARTITION BY i.INSTANCE_TYPE_ID
    ORDER BY m.ID) AS window_column FROM MIGRATIONS AS m JOIN INSTANCES AS i ON m.INSTANCE_UUID
    = i.UUID JOIN INSTANCE_INFO_CACHES AS c ON i.UUID = c.INSTANCE_UUID WHERE m.STATUS
    = 'completed' AND i.HOST = 'blaze8-12' ) SELECT migration_id, instance_display_name,
    instance_info_cache_id, window_column FROM inner_cte WHERE window_column > (SELECT
    AVG(window_column) FROM inner_cte);
  default_granularity: one row per qualifying completed migration
- id: metric_top10_display_names_memory_variance_with_image_type_metadata_profile
  name: Top Display Names by Memory Variance with Image-Type Metadata Profile
  desc: 'From the top 10 instance display names with the highest VARIANCE of MEMORY_MB
    (computed over instances with non-deleted INSTANCE_INFO_CACHES rows), shows each
    display name''s memory variance and sample standard deviation (STDDEV), joined
    to per-instance details for non-deleted instances having an ''image_image_type''
    system-metadata row: instance UUID, availability zone, count of metadata entries,
    total vCPUs, and whether the instance has a config drive enabled. Question: From
    the top 10 instance display names with the highest variance in instance memory
    (considering only non-deleted instance info cache records), display the instance
    display name, its memory variance and standard deviation (using STDDEV only and
    never STDDEV_POP), and for each matching non-deleted instance that has system
    metadata key = ''image_image_type'' also show the instance UUID, availability
    zone, metadata entry count, total vCPUs, and whether the instance has a config
    drive enabled. Do not return any rounded answers.'
  category: Instance Resource Analysis
  sql: WITH inner_cte AS ( WITH mem_stats AS ( SELECT i.display_name, VARIANCE(i.memory_mb)
    AS memory_mb_variance, STDDEV(i.memory_mb) AS memory_mb_stddev FROM instances
    AS i JOIN instance_info_caches AS ic ON i.uuid = ic.instance_uuid WHERE ic.deleted
    = 0 GROUP BY i.display_name ORDER BY memory_mb_variance DESC ), meta_vcpu AS (
    SELECT i.uuid AS instance_uuid, i.display_name, i.availability_zone, COUNT(ism.id)
    AS metadata_entry_count, SUM(i.vcpus) AS total_vcpus FROM instance_extra ie JOIN
    instances i ON ie.instance_uuid = i.uuid JOIN instance_system_metadata ism ON
    i.uuid = ism.instance_uuid WHERE i.deleted = 0 AND ism.key = 'image_image_type'
    GROUP BY i.uuid, i.display_name, i.availability_zone ), top10_by_variance AS (
    SELECT display_name, memory_mb_variance, memory_mb_stddev FROM mem_stats ORDER
    BY memory_mb_variance DESC LIMIT 10 ) SELECT t.display_name, t.memory_mb_variance,
    t.memory_mb_stddev, mv.instance_uuid, mv.availability_zone, mv.metadata_entry_count,
    mv.total_vcpus FROM top10_by_variance AS t JOIN meta_vcpu AS mv ON t.display_name
    = mv.display_name ORDER BY t.memory_mb_variance DESC ) SELECT c.display_name,
    c.memory_mb_variance, c.memory_mb_stddev, c.instance_uuid, c.availability_zone,
    c.metadata_entry_count, c.total_vcpus, CASE WHEN i.config_drive IN ('True', 'true',
    '1', 1) THEN 'Yes' ELSE 'No' END AS has_config_drive FROM inner_cte AS c JOIN
    instances AS i ON i.uuid = c.instance_uuid ORDER BY c.memory_mb_variance DESC;
  default_granularity: one row per instance among the top-10 display names by memory
    variance
- id: metric_blaze8_combined_memory_summary_above_overall_average_display_names
  name: Blaze8-12 Combined Instance Memory Summary Filtered by Above-Average Display
    Names
  desc: 'Combined instance memory summary for host ''blaze8-12'' of two branches:
    (1) high-vCPU instances (VCPUS > 8) counted with minimum MEMORY_MB per VM_STATE
    and DISPLAY_NAME, and (2) MEMORY_MB variance and sample standard deviation (STDDEV)
    per DISPLAY_NAME for instances with a non-deleted ''image_image_type'' system-metadata
    key; only rows whose DISPLAY_NAME has a higher average MEMORY_MB than the overall
    average MEMORY_MB across all rows in the combined summary are kept, each row labeled
    with its inclusion reason. Question: For host ''blaze8-12'', return the combined
    instance memory summary (high-vCPU instance counts/minimum memory by VM_STATE
    and DISPLAY_NAME, plus MEMORY_MB variance/standard deviation (using STDDEV only
    and never STDDEV_POP) by DISPLAY_NAME for instances with a non-deleted ''image_image_type''
    system metadata key), but only include rows whose DISPLAY_NAME has a higher average
    MEMORY_MB than the overall average MEMORY_MB across all rows in that combined
    summary. Do not return any rounded answers.'
  category: Instance Resource Analysis
  sql: WITH inner_cte AS ( WITH HighVcpuInstancesByStateAndName AS ( SELECT i.VM_STATE,
    i.DISPLAY_NAME, COUNT(i.UUID) AS instance_count, MIN(i.MEMORY_MB) AS min_memory_mb
    FROM INSTANCES AS i JOIN INSTANCE_EXTRA AS ie ON i.UUID = ie.INSTANCE_UUID WHERE
    i.VCPUS > 8 AND i.host = 'blaze8-12' GROUP BY i.VM_STATE, i.DISPLAY_NAME ), ImageTypeMetadataMemoryStatsByName
    AS ( SELECT i.DISPLAY_NAME, VARIANCE(i.MEMORY_MB) AS memory_mb_variance, STDDEV(i.MEMORY_MB)
    AS memory_mb_stddev FROM INSTANCES AS i JOIN INSTANCE_SYSTEM_METADATA AS ism ON
    ism.INSTANCE_UUID = i.UUID JOIN INSTANCE_INFO_CACHES AS iic ON i.UUID = iic.INSTANCE_UUID
    WHERE ism.KEY = 'image_image_type' AND ism.DELETED = 0 AND i.HOST = 'blaze8-12'
    GROUP BY i.DISPLAY_NAME ORDER BY memory_mb_variance DESC ), CombinedInstanceMemorySummary
    AS ( SELECT hv.VM_STATE, hv.DISPLAY_NAME, hv.instance_count, hv.min_memory_mb,
    NULL AS memory_mb_variance, NULL AS memory_mb_stddev, 'High VCPU Instances' AS
    reason FROM HighVcpuInstancesByStateAndName hv UNION ALL SELECT NULL AS VM_STATE,
    ms.DISPLAY_NAME, NULL AS instance_count, NULL AS min_memory_mb, ms.memory_mb_variance,
    ms.memory_mb_stddev, 'Has image_image_type Metadata' AS reason FROM ImageTypeMetadataMemoryStatsByName
    ms ) SELECT * FROM CombinedInstanceMemorySummary ORDER BY DISPLAY_NAME, VM_STATE,
    reason ), DisplayNameAverages AS ( SELECT i.DISPLAY_NAME, AVG(i.MEMORY_MB * 1.0)
    AS avg_memory_mb_for_name FROM INSTANCES i WHERE i.HOST = 'blaze8-12' GROUP BY
    i.DISPLAY_NAME ), OverallCombinedAverage AS ( SELECT AVG(COALESCE(d.avg_memory_mb_for_name,
    0) * 1.0) AS overall_avg_memory_mb FROM inner_cte s JOIN DisplayNameAverages d
    ON d.DISPLAY_NAME = s.DISPLAY_NAME ) SELECT s.*, d.avg_memory_mb_for_name FROM
    inner_cte s JOIN DisplayNameAverages d ON d.DISPLAY_NAME = s.DISPLAY_NAME WHERE
    d.avg_memory_mb_for_name > (SELECT overall_avg_memory_mb FROM OverallCombinedAverage)
    ORDER BY s.DISPLAY_NAME, s.VM_STATE, s.reason;
  default_granularity: one row per combined-summary branch entry (VM state + display
    name, or display name) passing the above-average filter
- id: metric_prime_blaze8_migration_memory_stddev_and_root_gb_cov
  name: 'Prime Instances on Blaze8-12: Migration Memory Stddev, Root-GB Coefficient
    of Variation and Disk Stddev'
  desc: 'For instance display names matching ''prime'' on host ''blaze8-12'' with
    at least 2 ''image_image_type'' system-metadata rows, shows per display name (1)
    the sample standard deviation (STDDEV) of MIGRATIONS.MEMORY_TOTAL across its migrations,
    (2) the coefficient of variation (STDDEV/AVG) of ROOT_GB, and (3) the sample standard
    deviation (STDDEV) of MIGRATIONS.DISK_TOTAL across its migrations. Question: For
    instance display names that match <code>''prime''</code> and are on host <code>blaze8-12</code>,
    and considering only system-metadata rows where the key is <code>''image_image_type''</code>
    (with at least 2 such metadata rows for the instance), show each instance display
    name along with (1) the standard deviation (using STDDEV only and never STDDEV_POP)
    of <code>MIGRATIONS.MEMORY_TOTAL</code> across its migrations and (2) the coefficient
    of variation (using STDDEV only and never STDDEV_POP) of its <code>ROOT_GB</code>;
    additionally, include the standard deviation (using STDDEV only and never STDDEV_POP)
    of <code>MIGRATIONS.DISK_TOTAL</code> across its migrations. Do not return any
    rounded answers.'
  category: Instance Profile and Migration Comprehensive Analysis
  sql: WITH inner_cte AS ( WITH sq1 AS ( SELECT i.display_name, STDDEV(m.memory_total)
    AS memory_total_stddev FROM migrations AS m JOIN instances AS i ON m.instance_uuid
    = i.uuid JOIN instance_system_metadata AS ism ON i.uuid = ism.instance_uuid WHERE
    ism.key = 'image_image_type' AND i.display_name REGEXP 'prime' GROUP BY i.display_name
    HAVING COUNT(ism.id) > 1 ORDER BY memory_total_stddev DESC ), sq2 AS ( SELECT
    i.display_name, STDDEV(i.root_gb) / NULLIF(AVG(i.root_gb), 0) AS coefficient_of_variation
    FROM instances AS i JOIN instance_system_metadata AS ism ON i.uuid = ism.instance_uuid
    WHERE ism.key = 'image_image_type' AND i.host = 'blaze8-12' GROUP BY i.display_name
    HAVING AVG(i.root_gb) > 0 ORDER BY coefficient_of_variation DESC ) SELECT sq1.display_name,
    sq1.memory_total_stddev, sq2.coefficient_of_variation FROM sq1 JOIN sq2 ON sq1.display_name
    = sq2.display_name ORDER BY sq1.memory_total_stddev DESC ) SELECT inner_cte.display_name,
    inner_cte.memory_total_stddev, inner_cte.coefficient_of_variation, STDDEV(m.disk_total)
    AS disk_total_stddev FROM inner_cte JOIN instances AS i ON i.display_name = inner_cte.display_name
    JOIN migrations AS m ON m.instance_uuid = i.uuid GROUP BY inner_cte.display_name,
    inner_cte.memory_total_stddev, inner_cte.coefficient_of_variation ORDER BY inner_cte.memory_total_stddev
    DESC;
  default_granularity: one row per qualifying prime display name
- id: metric_prime_display_names_completed_migration_dispersion_by_dest_compute
  name: 'Prime Display Names: Completed Migration Count Dispersion by Destination
    Compute'
  desc: 'For the top 10 instance display names matching ''prime'' that have a non-empty
    KEY_NAME, reports each display name''s total number of completed migrations together
    with the range, variance and sample standard deviation (STDDEV) of per-instance
    completed-migration counts (counted per destination compute host), keeping only
    display names whose migration-count range is greater than 0. Question: For the
    top 10 instance display names matching the pattern ''prime'' that have a non-empty
    key name, show each display name’s total number of completed migrations, along
    with the range, variance, and standard deviation (using STDDEV only and never
    STDDEV_POP) of completed-migration counts per instance (counted per destination
    compute), but only include display names whose migration-count range is greater
    than 0. Do not return any rounded answers.'
  category: Migration Analysis
  sql: WITH InstanceMigrationDispersion AS (SELECT i.display_name, MAX(migration_count)
    - MIN(migration_count) AS migration_count_range, VARIANCE(migration_count) AS
    migration_count_variance, STDDEV(migration_count) AS migration_count_stddev FROM
    instances AS i JOIN instance_extra AS ie ON i.uuid = ie.instance_uuid JOIN ( SELECT
    m.instance_uuid, m.dest_compute, COUNT(*) AS migration_count FROM migrations AS
    m WHERE m.status = 'completed' GROUP BY m.instance_uuid, m.dest_compute ) AS mig_stats
    ON i.uuid = mig_stats.instance_uuid WHERE i.display_name REGEXP 'prime' GROUP
    BY i.display_name ORDER BY migration_count_range DESC), TopCompletedMigrations
    AS (SELECT i.display_name, COUNT(m.id) AS completed_migrations FROM migrations
    AS m JOIN instances AS i ON m.instance_uuid = i.uuid JOIN instance_extra AS ie
    ON i.uuid = ie.instance_uuid WHERE m.status = 'completed' AND i.key_name IS NOT
    NULL AND i.key_name <> '' AND i.display_name REGEXP 'prime' GROUP BY i.display_name
    ORDER BY completed_migrations DESC LIMIT 10) SELECT tcm.display_name, tcm.completed_migrations,
    imd.migration_count_range, imd.migration_count_variance, imd.migration_count_stddev
    FROM TopCompletedMigrations tcm JOIN InstanceMigrationDispersion imd ON tcm.display_name
    = imd.display_name WHERE imd.migration_count_range > 0 ORDER BY tcm.completed_migrations
    DESC;
  default_granularity: one row per qualifying prime display name among the top 10
    by completed migration count
- id: metric_blaze8_high_memory_vm_states_with_active_migration_status
  name: Blaze8-12 High-Memory VM States with Active Migration Status and Memory Ratio
  desc: 'For host ''blaze8-12'', identifies VM states whose total instance MEMORY_MB
    (over non-deleted instances) exceeds the host''s overall average instance memory
    plus one sample standard deviation (STDDEV), and joins each such VM state with
    its active (non-hidden) migration statuses — excluding terminal statuses accepted/confirmed/reverted/error/failed/completed
    — reporting the number of instances involved, the minimum migration MEMORY_TOTAL,
    the VM state''s total instance memory, and the ratio of minimum migration MEMORY_TOTAL
    to total instance memory. Question: For host "blaze8-12", for each VM state whose
    total instance memory (across non-deleted instances) is greater than the host’s
    overall average instance memory plus one standard deviation (using STDDEV only
    and never STDDEV_POP), list the VM state along with each active (non-hidden) migration
    status for that VM state, the number of instances involved in those migrations,
    the minimum migration MEMORY_TOTAL, the total instance memory for the VM state,
    and the ratio of minimum migration MEMORY_TOTAL to total instance memory.'
  category: Instance Profile and Migration Comprehensive Analysis
  sql: WITH ActiveMigrationsByState AS ( SELECT i.VM_STATE AS vm_state, m.STATUS AS
    migration_status, COUNT(i.ID) AS instance_count, MIN(m.MEMORY_TOTAL) AS min_memory_total
    FROM INSTANCES i JOIN MIGRATIONS m ON i.UUID = m.INSTANCE_UUID WHERE m.HIDDEN
    = 0 AND m.STATUS NOT IN ('accepted', 'confirmed', 'reverted', 'error', 'failed',
    'completed') GROUP BY i.VM_STATE, m.STATUS ), HighMemoryStatesOnHost AS ( SELECT
    i.vm_state, SUM(i.memory_mb) AS total_memory_mb FROM instances AS i JOIN instance_extra
    AS ie ON i.uuid = ie.instance_uuid WHERE i.deleted = 0 AND i.host = 'blaze8-12'
    GROUP BY i.vm_state HAVING SUM(i.memory_mb) > ( SELECT AVG(i2.memory_mb) + STDDEV(i2.memory_mb)
    FROM instances AS i2 JOIN instance_extra AS ie2 ON i2.uuid = ie2.instance_uuid
    WHERE i2.deleted = 0 AND i2.host = 'blaze8-12' ) ) SELECT hm.vm_state, am.migration_status,
    am.instance_count, am.min_memory_total, hm.total_memory_mb, ROUND(am.min_memory_total
    / NULLIF(hm.total_memory_mb, 0), 4) AS MinMigrationMemory_to_TotalInstanceMemory_Ratio
    FROM HighMemoryStatesOnHost hm JOIN ActiveMigrationsByState am ON hm.vm_state
    = am.vm_state ORDER BY MinMigrationMemory_to_TotalInstanceMemory_Ratio DESC;
  default_granularity: one row per (VM state, active migration status) combination
    on the host
- id: metric_blaze8_completed_migrations_with_memory_stats_by_display_name
  name: Blaze8-12 Completed Migrations with Per-Type Minimum Memory Window and Display-Name
    Memory Stats
  desc: 'For host ''blaze8-12'', lists all completed migrations with migration ID,
    instance UUID, migration type, source/destination compute, destination host, instance
    display name, VM state, MEMORY_MB, vCPUs and INSTANCE_EXTRA record ID, including
    a per-migration-type minimum MEMORY_TOTAL window value, and attaches by instance
    display name the VARIANCE and sample standard deviation (STDDEV) of instance MEMORY_MB
    for instances having a non-deleted ''image_image_type'' system-metadata entry.
    Question: For host ''blaze8-12'', list all completed migrations (migration id,
    instance UUID, migration type, source compute, destination compute, destination
    host, instance display name, VM state, memory MB, vcpus, and instance extra record
    id), including the per-migration-type minimum MEMORY_TOTAL (as a window value),
    and also attach (by instance display name) the variance and standard deviation
    (using STDDEV only and never STDDEV_POP) of instance MEMORY_MB for instances that
    have a non-deleted system metadata entry with KEY = ''image_image_type''. Do not
    return any rounded answers.'
  category: Instance Profile and Migration Comprehensive Analysis
  sql: WITH CompletedMigrationsOnBlaze AS (SELECT m.ID AS migration_id, m.INSTANCE_UUID,
    m.MIGRATION_TYPE, m.SOURCE_COMPUTE, m.DEST_COMPUTE, m.DEST_HOST, i.DISPLAY_NAME,
    i.VM_STATE, i.MEMORY_MB, i.VCPUS, ie.ID AS instance_extra_id, m.MEMORY_TOTAL,
    MIN(m.MEMORY_TOTAL) OVER (PARTITION BY m.MIGRATION_TYPE ORDER BY m.MIGRATION_TYPE)
    AS window_column FROM MIGRATIONS AS m JOIN INSTANCES AS i ON m.INSTANCE_UUID =
    i.UUID JOIN INSTANCE_EXTRA AS ie ON i.UUID = ie.INSTANCE_UUID WHERE m.STATUS =
    'completed' AND i.HOST = 'blaze8-12'), MemoryStatsByDisplayNameOnBlaze AS (SELECT
    i.DISPLAY_NAME, VARIANCE(i.MEMORY_MB) AS memory_mb_variance, STDDEV(i.MEMORY_MB)
    AS memory_mb_stddev FROM INSTANCES AS i JOIN INSTANCE_SYSTEM_METADATA AS ism ON
    ism.INSTANCE_UUID = i.UUID JOIN INSTANCE_INFO_CACHES AS iic ON i.UUID = iic.INSTANCE_UUID
    WHERE ism.KEY = 'image_image_type' AND ism.DELETED = 0 AND i.HOST = 'blaze8-12'
    GROUP BY i.DISPLAY_NAME ORDER BY memory_mb_variance DESC), CombinedResults AS
    ( SELECT cm.migration_id, cm.INSTANCE_UUID, cm.MIGRATION_TYPE, cm.SOURCE_COMPUTE,
    cm.DEST_COMPUTE, cm.DEST_HOST, cm.DISPLAY_NAME, cm.VM_STATE, cm.MEMORY_MB, cm.VCPUS,
    cm.instance_extra_id, cm.MEMORY_TOTAL, cm.window_column, ms.memory_mb_variance,
    ms.memory_mb_stddev FROM CompletedMigrationsOnBlaze cm LEFT JOIN MemoryStatsByDisplayNameOnBlaze
    ms ON ms.DISPLAY_NAME = cm.DISPLAY_NAME ) SELECT * FROM CombinedResults ORDER
    BY migration_id, DISPLAY_NAME;
  default_granularity: one row per completed migration on the host
- id: metric_security_group_port_range_cov_above_overall_avg_with_enabled_instance_types
  name: Security Groups with Above-Average Port-Range Coefficient of Variation (Enabled
    Instance Types Considered)
  desc: 'Per Nova security group name, computes the coefficient of variation (STDDEV/AVG,
    sample standard deviation only) of rule port-range sizes (to_port - from_port)
    over non-deleted groups and non-deleted rules, cross-joined with enabled instance
    types (INSTANCE_TYPES.disabled = false), keeping groups with a positive average
    port-range size; returns only groups whose coefficient of variation exceeds the
    overall average coefficient of variation across all such groups, ordered descending.
    Question: For each security group, list the security group name and its coefficient
    of variation (using STDDEV only and never STDDEV_POP) of rule port-range sizes
    (standard deviation (using STDDEV only and never STDDEV_POP) of (to_port − from_port)
    divided by the average of (to_port − from_port)), but only return those security
    groups whose coefficient of variation (using STDDEV only and never STDDEV_POP)
    is greater than the overall average coefficient of variation (using STDDEV only
    and never STDDEV_POP) across all non-deleted security groups and non-deleted rules,
    considering only enabled instance types (instance_types.disabled = false). Do
    not return any rounded answers.'
  category: Security Group Analysis
  sql: WITH inner_cte AS (SELECT sg.name, STDDEV(sgr.to_port - sgr.from_port) / NULLIF(AVG(sgr.to_port
    - sgr.from_port), 0) AS coefficient_of_variation FROM SECURITY_GROUPS AS sg JOIN
    SECURITY_GROUP_RULES AS sgr ON sg.id = sgr.parent_group_id JOIN INSTANCE_TYPES
    AS it ON 1 = 1 WHERE sg.deleted = 0 AND sgr.deleted = 0 AND it.disabled = false
    GROUP BY sg.name HAVING AVG(sgr.to_port - sgr.from_port) > 0 ORDER BY coefficient_of_variation
    DESC), OverallAvg AS ( SELECT AVG(inner_cte.coefficient_of_variation) AS avg_cov
    FROM inner_cte ) SELECT inner_cte.name, inner_cte.coefficient_of_variation FROM
    inner_cte WHERE inner_cte.coefficient_of_variation > (SELECT avg_cov FROM OverallAvg)
    ORDER BY inner_cte.coefficient_of_variation DESC;
  default_granularity: one row per security group name whose port-range coefficient
    of variation exceeds the overall average
- id: metric_instance_type_offerings_by_disabled_public_flags
  name: Instance Type Offerings by Disabled and Public Flags
  desc: 'Classification statistic over INSTANCE_TYPES: per (disabled, is_public) combination
    of non-deleted instance types, counts flavors and computes average memory_mb,
    vcpus, root_gb and ephemeral_gb, showing how the flavor catalog is split between
    enabled/disabled and public/private offerings and how sizing differs across those
    segments. Question: For each combination of the disabled flag and the is_public
    flag among non-deleted instance types, show the number of instance types and the
    average memory (MB), vCPUs, root disk (GB) and ephemeral disk (GB). Do not return
    any rounded answers.'
  category: Instance Type Analysis
  sql: SELECT disabled, is_public, COUNT(*) AS instance_type_count, AVG(memory_mb)
    AS avg_memory_mb, AVG(vcpus) AS avg_vcpus, AVG(root_gb) AS avg_root_gb, AVG(ephemeral_gb)
    AS avg_ephemeral_gb FROM INSTANCE_TYPES WHERE deleted = 0 GROUP BY disabled, is_public;
  default_granularity: one row per (disabled, is_public) combination
- id: metric_neutron_security_group_rules_by_direction_ethertype_protocol
  name: Neutron Security Group Rule Counts by Direction, Ethertype and Protocol
  desc: 'Classification statistic over Neutron securitygrouprules: per (direction,
    ethertype, protocol) combination, counts rules and computes the average port-range
    size (port_range_max - port_range_min) for rules that specify a port range, showing
    how firewall rules are distributed across ingress/egress traffic, IP versions
    and protocols. Question: For each combination of direction, ethertype and protocol
    in the Neutron security group rules, show the number of rules and the average
    port-range size (port_range_max - port_range_min) over rules where both bounds
    are present. Do not return any rounded answers.'
  category: Security Group Analysis
  sql: SELECT direction, ethertype, protocol, COUNT(*) AS rule_count, AVG(port_range_max
    - port_range_min) AS avg_port_range_size FROM securitygrouprules GROUP BY direction,
    ethertype, protocol ORDER BY rule_count DESC;
  default_granularity: one row per (direction, ethertype, protocol) combination
- id: metric_quota_usages_with_reservations_max_delta_window_above_resource_avg_in_use
  name: Quota Usage Records with Matched Reservations, Next-2-Row Max Delta Window,
    Above Per-Resource Average In-Use
  desc: 'For each non-deleted Nova quota usage row that has a matching reservation
    (RESERVATIONS.usage_id = QUOTA_USAGES.id), lists the quota usage id, project id,
    resource, in_use, reserved and reservation UUID together with the maximum reservation
    delta over a window of the current row and the next 2 rows ordered by reservation
    id; keeps only rows whose in_use exceeds the average in_use of the same resource
    across all non-deleted quota usage records. Question: For each quota usage record
    that has a matching reservation, show the quota usage id, project id, resource,
    in-use amount, reserved amount, and the reservation UUID, and also compute the
    maximum reservation delta considering the current row and the next 2 rows when
    rows are ordered by reservation id. Only include rows where the in-use amount
    is greater than the average in-use amount for the same resource across all non-deleted
    quota usage records. Do not return any rounded answers.'
  category: Quota Usage and Reservation Analysis
  sql: WITH inner_cte AS ( SELECT q.ID AS quota_usage_id, q.PROJECT_ID, q.RESOURCE,
    q.IN_USE, q.RESERVED, r.UUID AS reservation_uuid, MAX(r.DELTA) OVER (ORDER BY
    r.ID ROWS BETWEEN CURRENT ROW AND 2 FOLLOWING) AS max_delta_next_2 FROM QUOTA_USAGES
    AS q JOIN RESERVATIONS AS r ON q.ID = r.USAGE_ID WHERE q.DELETED = 0 ), ResourceInUseAverages
    AS ( SELECT q2.RESOURCE, AVG(q2.IN_USE * 1.0) AS avg_in_use FROM QUOTA_USAGES
    AS q2 WHERE q2.DELETED = 0 GROUP BY q2.RESOURCE ) SELECT i.quota_usage_id, i.PROJECT_ID,
    i.RESOURCE, i.IN_USE, i.RESERVED, i.reservation_uuid, i.max_delta_next_2 FROM
    inner_cte AS i JOIN ResourceInUseAverages AS a ON a.RESOURCE = i.RESOURCE WHERE
    i.IN_USE > ( SELECT a2.avg_in_use FROM ResourceInUseAverages AS a2 WHERE a2.RESOURCE
    = i.RESOURCE );
  default_granularity: one row per (quota usage, reservation) pair passing the per-resource
    average in_use filter
- id: metric_top10_projects_by_total_reserved_cores_delta_with_dense_rank_window_and_positive_reserved_flag
  name: Top 10 Projects by Total Reserved Cores Delta with Dense-Rank Window over
    Usage In-Use and Positive-Reserved Flag
  desc: 'Among Nova reservations for resource ''cores'' that expired before 2021-05-13
    16:53:07, ranks the top 10 projects by total reserved delta (SUM of RESERVATIONS.delta),
    and for each project also reports the maximum dense rank computed over a window
    of the current and 2 preceding rows ordered by the associated quota usage IN_USE
    value, plus a Yes/No flag for whether the project has any matching reservation
    whose quota usage RESERVED value is positive. Question: Among reservations whose
    resource is ''cores'' and that expired before 2021-05-13 16:53:07, show the top
    10 projects (by total reserved cores delta) along with the project ID, total reserved
    delta, the maximum dense rank (computed over the current and 2 preceding rows
    ordered by the associated quota usage IN_USE value), and whether the project has
    any reservation with a positive quota usage RESERVED value. Do not return any
    rounded answers.'
  category: Quota Usage and Reservation Analysis
  sql: WITH inner_cte AS ( SELECT t1.UUID, dense_rank() OVER ( ORDER BY t0.IN_USE
    ROWS BETWEEN 2 PRECEDING AND CURRENT ROW ) AS window_column FROM QUOTA_USAGES
    t0 JOIN RESERVATIONS t1 ON t0.ID = t1.USAGE_ID WHERE t1.RESOURCE = 'cores' AND
    t1.EXPIRE < '2021-05-13 16:53:07' ) SELECT r.PROJECT_ID AS project_id, SUM(r.DELTA)
    AS total_reserved_delta, MAX(i.window_column) AS max_dense_rank_in_project, CASE
    WHEN EXISTS ( SELECT 1 FROM RESERVATIONS r2 JOIN QUOTA_USAGES q2 ON q2.ID = r2.USAGE_ID
    WHERE r2.PROJECT_ID = r.PROJECT_ID AND r2.RESOURCE = 'cores' AND r2.EXPIRE < '2021-05-13
    16:53:07' AND q2.RESERVED > 0 ) THEN 'Yes' ELSE 'No' END AS has_any_positive_reserved_quota
    FROM inner_cte i JOIN RESERVATIONS r ON r.UUID = i.UUID JOIN QUOTA_USAGES q ON
    q.ID = r.USAGE_ID WHERE r.RESOURCE = 'cores' AND r.EXPIRE < '2021-05-13 16:53:07'
    GROUP BY r.PROJECT_ID ORDER BY total_reserved_delta DESC LIMIT 10;
  default_granularity: one row per project (top 10 by total reserved cores delta)
- id: metric_nova_quota_usage_in_use_reserved_by_resource
  name: Nova Quota Usage In-Use and Reserved Totals by Resource
  desc: 'Aggregation over QUOTA_USAGES: per resource (cores, ram, instances, floating_ips,
    etc.), counts active (non-deleted) usage rows and distinct projects, and sums/averages
    in_use and reserved units, showing how compute resource consumption and pending
    holds are distributed across resources.'
  category: Quota Usage and Reservation Analysis
  sql: SELECT q.resource, COUNT(*) AS usage_rows, COUNT(DISTINCT q.project_id) AS
    project_count, SUM(q.in_use) AS total_in_use, AVG(q.in_use) AS avg_in_use, SUM(q.reserved)
    AS total_reserved FROM QUOTA_USAGES q WHERE q.deleted = 0 GROUP BY q.resource
    ORDER BY total_in_use DESC;
  default_granularity: one row per resource
- id: metric_nova_reservation_delta_by_resource
  name: Nova Reservation Delta Totals by Resource
  desc: 'Aggregation over RESERVATIONS: per resource, counts reservation rows and
    computes total, average and maximum signed delta, showing how many units of each
    compute resource were held by reservations over time. Note that in this dataset
    all reservation rows are soft-deleted (deleted <> 0), so no deleted filter is
    applied.'
  category: Quota Usage and Reservation Analysis
  sql: SELECT r.resource, COUNT(*) AS reservation_count, SUM(r.delta) AS total_delta,
    AVG(r.delta) AS avg_delta, MAX(r.delta) AS max_delta FROM RESERVATIONS r GROUP
    BY r.resource ORDER BY total_delta DESC;
  default_granularity: one row per resource
- id: metric_nova_quota_hard_limit_by_resource
  name: Nova Quota Hard Limit Statistics by Resource
  desc: 'Aggregation over QUOTAS: per resource, counts active (non-deleted) quota
    limit rows and computes average, minimum and maximum hard_limit, showing how per-project
    quota caps are configured across compute resources; -1 values indicate unlimited
    grants.'
  category: Quota Usage and Reservation Analysis
  sql: SELECT resource, COUNT(*) AS quota_rows, AVG(hard_limit) AS avg_hard_limit,
    MIN(hard_limit) AS min_hard_limit, MAX(hard_limit) AS max_hard_limit FROM QUOTAS
    WHERE deleted = 0 GROUP BY resource ORDER BY avg_hard_limit DESC;
  default_granularity: one row per resource
- id: metric_neutron_quota_usage_by_resource_dirty
  name: Neutron Quota Usage by Resource and Dirty Flag
  desc: 'Classification statistic over Neutron quotausages: per (resource, dirty)
    combination, counts usage rows and sums in_use and reserved units, showing how
    network resource consumption is distributed across resources and how many rows
    carry stale counters needing recomputation.'
  category: Quota Usage and Reservation Analysis
  sql: SELECT qu.resource, qu.dirty, COUNT(*) AS usage_rows, SUM(qu.in_use) AS total_in_use,
    SUM(qu.reserved) AS total_reserved FROM quotausages qu GROUP BY qu.resource, qu.dirty
    ORDER BY qu.resource, qu.dirty;
  default_granularity: one row per (resource, dirty flag)
- id: metric_neutron_reservation_deltas_by_resource
  name: Neutron Reservation Deltas by Resource
  desc: 'Aggregation over Neutron resourcedeltas joined to reservations: per resource,
    counts delta rows and computes total and average held amount, showing which network
    resources have pending reservation holds and their magnitude.'
  category: Quota Usage and Reservation Analysis
  sql: SELECT rd.resource, COUNT(*) AS delta_rows, SUM(rd.amount) AS total_amount,
    AVG(rd.amount) AS avg_amount FROM resourcedeltas rd JOIN reservations res ON rd.reservation_id
    = res.id GROUP BY rd.resource ORDER BY total_amount DESC;
  default_granularity: one row per resource
- category: Security Group Analysis
  default_granularity: one row per qualifying rule of the named security group (protocol,
    from_port combination)
  desc: 'For the Nova security group named ''aurum-xenon'', joins SECURITY_GROUPS
    with SECURITY_GROUP_RULES on parent_group_id and returns only rules whose from_port
    exceeds the average from_port of rules sharing the same protocol within that group;
    each returned rule shows group name, description, user ID, project ID, protocol,
    from/to port and CIDR, plus the minimum from_port over a window of 3 preceding
    and 1 following rows ordered by parent_group_id, the rule''s deviation from the
    overall average from_port across all rules of the group, and the running sum of
    from_port within the same protocol ordered by from_port. Question: For the security
    group named "aurum-xenon", return only those rules whose from-port is greater
    than the average from-port for their protocol, and for each such rule show the
    security group name, description, user ID, project ID, protocol, from port, to
    port, CIDR, the minimum from port over a window of 3 preceding and 1 following
    rule rows (ordered by the parent group ID), the rule''s deviation from the overall
    average from port across all "aurum-xenon" rules, and the running sum of from
    ports within the same protocol ordered by from port. Do not return any rounded
    answers.'
  id: metric_aurum_xenon_rules_above_protocol_avg_from_port_with_window_min_deviation_running_sum
  name: Aurum-Xenon Security Group Rules Above Protocol Average From-Port with Window
    Minimum, Deviation and Running Sum
  sql: WITH q1 AS ( WITH inner_cte AS (SELECT sg.NAME, sg.DESCRIPTION, sg.USER_ID,
    sg.PROJECT_ID, sgr.PROTOCOL, sgr.FROM_PORT, sgr.TO_PORT, sgr.CIDR, MIN(sgr.FROM_PORT)
    OVER ( ORDER BY sgr.PARENT_GROUP_ID ROWS BETWEEN 3 PRECEDING AND 1 FOLLOWING )
    AS window_column FROM SECURITY_GROUPS AS sg JOIN SECURITY_GROUP_RULES AS sgr ON
    sg.ID = sgr.PARENT_GROUP_ID WHERE sg.NAME = 'aurum-xenon'), avg_cte AS (SELECT
    AVG(FROM_PORT) AS avg_from_port FROM inner_cte) SELECT i.NAME, i.DESCRIPTION,
    i.USER_ID, i.PROJECT_ID, i.PROTOCOL, i.FROM_PORT, i.TO_PORT, i.CIDR, i.window_column,
    (i.FROM_PORT - a.avg_from_port) AS deviation_from_avg_from_port FROM inner_cte
    i CROSS JOIN avg_cte a ), q2 AS ( WITH inner_cte AS (SELECT sg.NAME AS security_group_name,
    sgr.PROTOCOL, sgr.FROM_PORT, SUM(sgr.FROM_PORT) OVER ( PARTITION BY sgr.PROTOCOL
    ORDER BY sgr.FROM_PORT ) AS window_column FROM SECURITY_GROUPS AS sg JOIN SECURITY_GROUP_RULES
    AS sgr ON sg.ID = sgr.PARENT_GROUP_ID WHERE sg.NAME = 'aurum-xenon'), ProtocolAverages
    AS ( SELECT sgr.PROTOCOL, AVG(sgr.FROM_PORT * 1.0) AS avg_from_port FROM SECURITY_GROUPS
    AS sg JOIN SECURITY_GROUP_RULES AS sgr ON sg.ID = sgr.PARENT_GROUP_ID WHERE sg.NAME
    = 'aurum-xenon' GROUP BY sgr.PROTOCOL ) SELECT i.security_group_name, i.PROTOCOL,
    i.FROM_PORT, i.window_column FROM inner_cte AS i JOIN ProtocolAverages AS pa ON
    pa.PROTOCOL = i.PROTOCOL WHERE i.FROM_PORT > pa.avg_from_port ) SELECT q1.NAME
    AS security_group_name, q1.DESCRIPTION, q1.USER_ID, q1.PROJECT_ID, q1.PROTOCOL,
    q1.FROM_PORT, q1.TO_PORT, q1.CIDR, q1.window_column AS min_from_port_window_3_preceding_1_following,
    q1.deviation_from_avg_from_port, q2.window_column AS running_sum_from_ports_within_protocol
    FROM q1 JOIN q2 ON q1.NAME = q2.security_group_name AND q1.PROTOCOL = q2.PROTOCOL
    AND q1.FROM_PORT = q2.FROM_PORT ORDER BY q1.PROTOCOL, q1.FROM_PORT;
- category: Security Group Analysis
  default_granularity: one row per (security group, protocol) combination, plus per-group
    subtotal rows and one grand-total row
  desc: 'Counts non-deleted Nova security group rules per (security group, protocol)
    over non-deleted groups and rules (SECURITY_GROUPS joined to SECURITY_GROUP_RULES
    on parent_group_id, both filtered deleted = 0), reporting group name, description,
    project ID, protocol and rule count, with GROUP BY ... WITH ROLLUP producing per-security-group
    subtotals and a grand total labeled via GROUPING(). Question: For each security
    group and rule protocol, list the security group name, description, project ID,
    the rule protocol, and the number of non-deleted rules. Also include subtotals
    per security group and a grand total, considering only non-deleted groups and
    rules. Do not return any rounded answers.'
  id: metric_security_group_rule_counts_by_protocol_with_rollup
  name: Non-Deleted Security Group Rule Counts by Group and Protocol with Rollup Subtotals
    and Grand Total
  sql: WITH inner_cte AS (SELECT sg.NAME, sg.DESCRIPTION, sg.PROJECT_ID, sgr.PROTOCOL,
    sgr.FROM_PORT, sgr.TO_PORT, sgr.CIDR, DENSE_RANK() OVER (PARTITION BY sg.ID ORDER
    BY sgr.ID) AS window_column FROM SECURITY_GROUPS sg JOIN SECURITY_GROUP_RULES
    sgr ON sg.ID = sgr.PARENT_GROUP_ID WHERE sg.DELETED = 0 AND sgr.DELETED = 0),
    RuleCounts AS ( SELECT NAME, DESCRIPTION, PROJECT_ID, PROTOCOL, COUNT(*) AS total_rules
    FROM inner_cte GROUP BY NAME, DESCRIPTION, PROJECT_ID, PROTOCOL ) SELECT CASE
    WHEN GROUPING(NAME) = 1 THEN 'GRAND TOTAL' ELSE NAME END AS security_group_name,
    CASE WHEN GROUPING(DESCRIPTION) = 1 AND GROUPING(NAME) = 0 THEN 'SUBTOTAL' ELSE
    DESCRIPTION END AS security_group_description, CASE WHEN GROUPING(PROJECT_ID)
    = 1 AND GROUPING(NAME) = 0 THEN 'SUBTOTAL' ELSE PROJECT_ID END AS project_id,
    CASE WHEN GROUPING(PROTOCOL) = 1 AND GROUPING(NAME) = 0 THEN 'SUBTOTAL' ELSE PROTOCOL
    END AS protocol, SUM(total_rules) AS total_rules FROM RuleCounts GROUP BY NAME,
    DESCRIPTION, PROJECT_ID, PROTOCOL WITH ROLLUP;
- category: Security Group and Service Comprehensive Analysis
  default_granularity: one row per qualifying tcp security group rule
  desc: 'Lists tcp-protocol Nova security group rules (SECURITY_GROUPS joined to SECURITY_GROUP_RULES
    on parent_group_id) together with the security group ID and name, rule ID, rule
    CIDR and the RANK of each rule within its group ordered by rule ID, cross-joined
    with the Nova services table restricted to binary = ''nova-scheduler''; keeps
    only rules whose rule ID exceeds the average rule ID across all such tcp rules.
    Question: For security group rules that use the tcp protocol, list the security
    group ID, security group name, rule ID, rule CIDR, and the rank of each rule within
    its security group ordered by rule ID, but only keep those rules whose rule ID
    is greater than the average rule ID among all such tcp rules for services where
    the binary is ''nova-scheduler''. Do not return any rounded answers.'
  id: metric_tcp_security_group_rules_ranked_above_avg_rule_id_with_nova_scheduler_service
  name: TCP Security Group Rules Ranked within Group and Above Average Rule ID (Nova-Scheduler
    Service Context)
  sql: WITH inner_cte AS ( SELECT sg.ID AS security_group_id, sg.NAME AS security_group_name,
    sgr.ID AS rule_id, sgr.CIDR AS rule_cidr, RANK() OVER (PARTITION BY sg.ID ORDER
    BY sgr.ID) AS window_column FROM SECURITY_GROUPS AS sg JOIN SECURITY_GROUP_RULES
    AS sgr ON sg.ID = sgr.PARENT_GROUP_ID JOIN services AS s ON s.binary = 'nova-scheduler'
    WHERE sgr.PROTOCOL = 'tcp' ) SELECT security_group_id, security_group_name, rule_id,
    rule_cidr, window_column FROM inner_cte WHERE rule_id > (SELECT AVG(rule_id) FROM
    inner_cte);
concepts:
- id: concept_compute_node_inventory
  name: Compute Node Inventory
  desc: Tables recording the inventory of Nova compute nodes (hypervisors), including
    capacity, usage, hypervisor type and host assignment. Covers the authoritative
    live inventory and its online-migration shadow copy, which share an identical
    column structure but differ in purpose and data completeness.
  tables:
  - COMPUTE_NODES
  - SHADOW_COMPUTE_NODES
  comparisons:
  - dimension: Data authority
    COMPUTE_NODES: Authoritative live inventory continuously updated by compute services
    SHADOW_COMPUTE_NODES: Transitional copy used during online database schema migrations;
      not authoritative
  - dimension: Data completeness
    COMPUTE_NODES: Full set of compute nodes with host names, UUIDs and capacity data
      populated
    SHADOW_COMPUTE_NODES: Only a small subset of rows copied during migration; host
      and uuid values may be NULL
  - dimension: Join availability
    COMPUTE_NODES: UUID joins to RESOURCE_PROVIDERS and HOST joins to AGGREGATE_HOSTS
      are meaningful
    SHADOW_COMPUTE_NODES: UUID/HOST often NULL, so joins to placement or aggregate
      tables yield no reliable matches
  - dimension: Typical usage
    COMPUTE_NODES: All operational and analytical queries about hypervisors, capacity
      and host aggregates
    SHADOW_COMPUTE_NODES: Database migration verification only
  decision_guide:
    How many compute nodes of a given hypervisor type exist / capacity and usage questions: 'Use
      COMPUTE_NODES: it is the authoritative inventory with complete host, uuid and
      capacity data'
    Correlating compute nodes with placement resource providers or host aggregates: 'Use
      COMPUTE_NODES: its uuid and host columns are populated and joinable, unlike
      the shadow copy'
    Verifying data copied during an online schema migration: 'Use SHADOW_COMPUTE_NODES:
      it holds the transitional rows written by the migration process'
- id: concept_host_aggregate_membership
  name: Host Aggregate Grouping
  desc: 'Tables describing aggregate grouping in the OpenStack control plane: Nova
    host aggregates (logical groups of compute hosts) and placement aggregates (groupings
    of resource providers). Covers aggregate definitions, host membership and resource
    provider membership, which use different keys and belong to different services.'
  tables:
  - AGGREGATES
  - AGGREGATE_HOSTS
  - RESOURCE_PROVIDER_AGGREGATES
  comparisons:
  - dimension: Business process
    AGGREGATES: Defines the aggregate itself (name, UUID)
    AGGREGATE_HOSTS: 'Nova-side membership: assigns compute hosts to a host aggregate'
    RESOURCE_PROVIDER_AGGREGATES: 'Placement-side membership: assigns resource providers
      to a placement aggregate'
  - dimension: Membership key
    AGGREGATES: Identified by integer id and uuid
    AGGREGATE_HOSTS: aggregate_id is the integer AGGREGATES.id; member is a host name
      string
    RESOURCE_PROVIDER_AGGREGATES: aggregate_id is a placement aggregate UUID string;
      member is resource_provider_id
  - dimension: Link to compute nodes
    AGGREGATES: Indirect, via AGGREGATE_HOSTS
    AGGREGATE_HOSTS: 'Direct: host column joins to COMPUTE_NODES.host'
    RESOURCE_PROVIDER_AGGREGATES: 'Indirect: via RESOURCE_PROVIDERS.id, whose uuid
      matches COMPUTE_NODES.uuid'
  - dimension: Granularity
    AGGREGATES: One row per aggregate
    AGGREGATE_HOSTS: One row per (aggregate, host) pair, with soft-delete flags
    RESOURCE_PROVIDER_AGGREGATES: One row per (resource provider, placement aggregate)
      pair
  decision_guide:
    Which compute nodes/hosts belong to a Nova host aggregate (by aggregate ID): 'Use
      AGGREGATE_HOSTS joined to COMPUTE_NODES on host: it is the Nova-side membership
      table keyed by integer aggregate id'
    Aggregate name or UUID lookup for a given aggregate ID: 'Use AGGREGATES: it holds
      the aggregate definitions referenced by AGGREGATE_HOSTS.aggregate_id'
    Grouping of placement resource providers by placement aggregate UUID: 'Use RESOURCE_PROVIDER_AGGREGATES
      joined to RESOURCE_PROVIDERS on resource_provider_id: it represents placement-service
      grouping, not Nova host aggregates'
- id: concept_instance_registry
  name: Instance Registry Sources
  desc: 'Tables/views recording the Nova server (virtual machine) registry: the authoritative
    live table, its online-migration shadow copy, and a combined union view. All three
    share an identical column structure but differ in purpose, data completeness and
    suitability as a join anchor for instance satellite tables.'
  tables:
  - INSTANCES
  - SHADOW_INSTANCES
  - ALL_INSTANCES
  comparisons:
  - dimension: Role
    details: INSTANCES is the authoritative live registry maintained by Nova; SHADOW_INSTANCES
      is a transitional copy used during online database migrations; ALL_INSTANCES
      is a read-only view defined as INSTANCES UNION SHADOW_INSTANCES.
  - dimension: Data completeness
    details: INSTANCES holds both active (deleted = 0) and soft-deleted instance rows;
      in this deployment SHADOW_INSTANCES contains only rows marked deleted (no active
      rows), while ALL_INSTANCES combines both and can therefore include duplicate
      UUIDs across sources.
  - dimension: Joinability with satellite tables
    details: Satellite tables (INSTANCE_EXTRA, INSTANCE_INFO_CACHES, INSTANCE_SYSTEM_METADATA,
      INSTANCE_METADATA, MIGRATIONS) reference instance UUIDs that exist in INSTANCES;
      joins anchored on SHADOW_INSTANCES or ALL_INSTANCES can miss or duplicate matches.
  - dimension: Mutability
    details: INSTANCES is continuously updated by Nova; SHADOW_INSTANCES changes only
      during migration operations; ALL_INSTANCES cannot be written to because it is
      a view.
  decision_guide:
    Questions about current instances, their names, availability zones, sizing (memory_mb/vcpus) or lifecycle states: 'Use
      INSTANCES: it is the authoritative live registry and the correct anchor for
      joins to instance satellite tables.'
    Questions that must also cover archived/transitional instance rows held by online migrations: Use
      ALL_INSTANCES to include both live and shadow rows, accepting possible UUID
      duplication; filter on deleted if only one population is wanted.
    Auditing the online-migration shadow population itself: Use SHADOW_INSTANCES directly;
      do not use it for general instance reporting because it holds no active rows
      in this deployment.
- id: concept_instance_metadata
  name: Instance Metadata Storage
  desc: 'Key/value metadata tables attached to instances: system-managed metadata
    copied from the boot image and Nova internals, versus user-defined metadata set
    through the server metadata API. Both are keyed by instance UUID plus a free-text
    key, but their key namespaces and business meanings differ.'
  tables:
  - INSTANCE_SYSTEM_METADATA
  - INSTANCE_METADATA
  comparisons:
  - dimension: Key origin
    details: INSTANCE_SYSTEM_METADATA keys are generated by Nova, mostly image_* properties
      copied from the Glance image at boot (image_image_type, image_disk_format, image_min_ram,
      image_min_disk, image_base_image_ref, image_owner_id) plus operational keys
      like clean_attempts; INSTANCE_METADATA keys are chosen freely by users.
  - dimension: Population volume
    details: INSTANCE_SYSTEM_METADATA is densely populated (tens of thousands of active
      rows, thousands of distinct instances); INSTANCE_METADATA is sparsely populated
      (only a handful of active rows in this deployment).
  - dimension: Typical usage
    details: INSTANCE_SYSTEM_METADATA is used to filter/classify instances by image
      properties (e.g. counting rows with key = 'image_image_type'); INSTANCE_METADATA
      is used for user tagging and scheduling hints.
  - dimension: Mutability
    details: INSTANCE_SYSTEM_METADATA is written by Nova internals and should not
      be edited by users; INSTANCE_METADATA is fully user-managed via the metadata
      API.
  decision_guide:
    Filtering or counting instances by image-derived properties such as image type, disk format or minimum RAM: Use
      INSTANCE_SYSTEM_METADATA with a key filter (e.g. key = 'image_image_type');
      these properties only exist there.
    Retrieving tags/labels that users attached to their servers: Use INSTANCE_METADATA;
      user-defined keys never appear in INSTANCE_SYSTEM_METADATA.
    Counting metadata rows per instance for a specific property: Use INSTANCE_SYSTEM_METADATA
      and COUNT(id) grouped by instance_uuid with the key filter, since one instance
      can accumulate multiple rows for image-related keys across rebuilds.
- id: concept_security_group_management
  name: Security Group Management (Nova Legacy vs Neutron)
  desc: 'Tables implementing security group (distributed firewall) management across
    two OpenStack services: the Nova legacy security group model (SECURITY_GROUPS,
    SECURITY_GROUP_RULES, SECURITY_GROUP_INSTANCE_ASSOCIATION) which applies groups
    to instances, and the Neutron security group model (securitygroups, securitygrouprules,
    securitygroupportbindings) which applies groups to network ports. Both models
    define groups and their allow-rules with port ranges, protocols and remote peers,
    but they are separate registries with different identifier types, rule capabilities
    and attachment granularity; rows in one are not related to rows in the other.'
  tables:
  - SECURITY_GROUPS
  - SECURITY_GROUP_RULES
  - SECURITY_GROUP_INSTANCE_ASSOCIATION
  - securitygroups
  - securitygrouprules
  - securitygroupportbindings
  comparisons:
  - dimension: Owning service and identifier type
    details: Nova tables use integer IDs (SECURITY_GROUPS.id, SECURITY_GROUP_RULES.parent_group_id);
      Neutron tables use UUIDs (securitygroups.id, securitygrouprules.security_group_id).
      An integer group ID and a UUID group ID never refer to the same object.
  - dimension: Rule capabilities
    details: Nova SECURITY_GROUP_RULES are ingress-only, IPv4-oriented, with from_port/to_port
      bounds and cidr or group_id as the remote peer, plus a soft-delete flag. Neutron
      securitygrouprules add explicit direction (ingress/egress) and ethertype (IPv4/IPv6),
      use port_range_min/port_range_max and remote_ip_prefix or remote_group_id, and
      have no soft-delete column.
  - dimension: Attachment granularity
    details: Nova attaches groups to instances via SECURITY_GROUP_INSTANCE_ASSOCIATION
      (instance_uuid → INSTANCES.uuid); Neutron attaches groups to ports via securitygroupportbindings
      (port_id → ports.id).
  - dimension: Lifecycle columns
    details: Nova tables carry created_at/updated_at/deleted_at/deleted soft-delete
      columns and must be filtered with deleted = 0; Neutron tables carry tenant_id
      and standard_attr_id instead and have no soft-delete flag.
  decision_guide:
    ? Questions about Nova security groups, their rules' from_port/to_port port ranges,
      or which instances belong to a Nova group (often with deleted = 0 filters)
    : 'Use SECURITY_GROUPS + SECURITY_GROUP_RULES (+ SECURITY_GROUP_INSTANCE_ASSOCIATION
      for instance membership): this is the Nova legacy integer-keyed model.'
    Questions about Neutron security groups, ingress/egress rules, IPv4/IPv6 ethertypes, or which ports a group is applied to: 'Use
      securitygroups + securitygrouprules + securitygroupportbindings: this is the
      Neutron UUID-keyed model with direction/ethertype support.'
    Questions mentioning 'security group' together with Nova instance tables (INSTANCES, INSTANCE_TYPES, MIGRATIONS): Prefer
      the Nova model (SECURITY_GROUPS family), which joins to INSTANCES via SECURITY_GROUP_INSTANCE_ASSOCIATION.instance_uuid
      = INSTANCES.uuid.
    Questions mentioning 'security group' together with Neutron network objects (networks, subnets, ports, routers): Prefer
      the Neutron model (securitygroups family), which joins to ports via securitygroupportbindings.
- id: concept_quota_accounting
  name: OpenStack Quota Accounting (Nova vs Neutron)
  desc: 'Tables implementing quota accounting in two OpenStack services: Nova''s compute-side
    quota model (QUOTAS limits, QUOTA_USAGES consumption, RESERVATIONS pending holds)
    and Neutron''s network-side quota model (quotas limits, quotausages consumption,
    reservations headers plus resourcedeltas amounts). Both models answer ''how much
    of a resource may a project consume, how much has it consumed, and how much is
    temporarily held'', but they are separate registries with different resource vocabularies,
    key structures and reservation designs; rows in one service are not related to
    rows in the other.'
  tables:
  - QUOTAS
  - QUOTA_USAGES
  - RESERVATIONS
  - quotas
  - quotausages
  - reservations
  - resourcedeltas
  comparisons:
  - dimension: Owning service and resource vocabulary
    nova_tables: 'QUOTAS / QUOTA_USAGES / RESERVATIONS cover compute resources: cores,
      ram, instances, gigabytes, volumes, floating_ips, server_groups.'
    neutron_tables: 'quotas / quotausages / reservations / resourcedeltas cover network
      resources: port, network, subnet, security_group, floatingip, router.'
  - dimension: Reservation design
    nova_tables: Single RESERVATIONS table carrying uuid, usage_id foreign key, resource,
      signed delta and expire timestamp in one row.
    neutron_tables: 'Split design: reservations stores only id (UUID), tenant_id and
      expiration; the resource name and signed amount live in resourcedeltas keyed
      by (resource, reservation_id).'
  - dimension: Usage table keys and linkage
    nova_tables: QUOTA_USAGES has an integer surrogate id as PK plus project_id/user_id/resource
      columns; RESERVATIONS link to it via usage_id.
    neutron_tables: quotausages uses a (tenant_id, resource) composite PK with no
      surrogate id; reservations link to usage only implicitly via tenant_id, with
      the resource carried on resourcedeltas.
  - dimension: Limit semantics
    nova_tables: QUOTAS.hard_limit is the per-(project, resource) maximum; NULL means
      no explicit limit.
    neutron_tables: quotas.limit is the per-(tenant, resource) maximum; -1 explicitly
      means unlimited.
  - dimension: Soft-delete and staleness handling
    nova_tables: Nova tables use a deleted column (0 = active) and QUOTA_USAGES.until_refresh
      as a countdown to recompute usage from live data.
    neutron_tables: Neutron tables have no deleted column; quotausages.dirty (0/1)
      flags stale in_use counters needing recomputation.
  decision_guide:
    ? Questions about compute resource consumption or holds (cores, ram, instances,
      volumes), e.g. reserved deltas per project or in_use vs averages per resource
    : Use Nova QUOTA_USAGES joined with RESERVATIONS on RESERVATIONS.usage_id = QUOTA_USAGES.id;
      filter deleted = 0 for active rows.
    Questions about network resource consumption or holds (ports, networks, subnets, security groups, floatingips): Use
      Neutron quotausages for consumption, quotas for limits, and reservations joined
      with resourcedeltas (resourcedeltas.reservation_id = reservations.id) for pending
      holds.
    Questions comparing a project's usage against its allowed limit: 'Pick the service
      matching the resource: Nova QUOTA_USAGES vs QUOTAS.hard_limit for compute resources;
      Neutron quotausages vs quotas.limit (join on tenant_id + resource) for network
      resources.'
    Questions about reservation expiry/expiration times: Nova RESERVATIONS.expire
      for compute reservations; Neutron reservations.expiration for network reservations.
      The column names differ (expire vs expiration) and the tables are unrelated.
- comparisons:
  - details: Nova services uses integer IDs (referenced by COMPUTE_NODES.service_id);
      Neutron agents uses UUID string IDs (referenced by binding tables such as networkdhcpagentbindings.dhcp_agent_id
      and routerl3agentbindings.l3_agent_id). The identifiers are never interchangeable.
    dimension: Owning service and identifier type
  - details: Nova services classifies daemons by binary (nova-compute, nova-scheduler,
      nova-conductor) and topic; Neutron agents classify by both binary (neutron-dhcp-agent,
      neutron-l3-agent) and a separate agent_type column (DHCP agent, L3 agent, Metadata
      agent), and additionally carry configurations JSON, load and availability_zone
      for scheduling.
    dimension: Role classification columns
  - details: Nova services uses a boolean disabled flag plus disabled_reason and forced_down;
      Neutron agents uses admin_state_up (1 = up) with no reason column. Liveness
      is tracked by last_seen_up in Nova versus heartbeat_timestamp/started_at in
      Neutron.
    dimension: Enable/disable and liveness semantics
  - details: Nova services rows are soft-deleted via a deleted column and must usually
      be filtered with deleted = 0; Neutron agents rows have no soft-delete flag and
      are removed physically.
    dimension: Lifecycle columns
  decision_guide:
    ? Questions about Nova daemons such as nova-compute, nova-scheduler or nova-conductor,
      their host, disabled state, heartbeat (last_seen_up), or linking compute nodes
      to the reporting service
    : Use the Nova services table (join COMPUTE_NODES.service_id = services.id); filter
      deleted = 0 for active records.
    ? Questions about Neutron agents (DHCP, L3, metadata, OVS/Linux bridge agents),
      which networks or routers are scheduled to which agent, agent availability zones
      or load
    : Use the Neutron agents table together with binding tables (networkdhcpagentbindings,
      routerl3agentbindings) via their agent-id columns = agents.id.
    Questions mentioning 'service' together with Nova compute/instance/security-group tables: Prefer
      the Nova services table; Neutron agents rows describe network agents and are
      unrelated to Nova objects.
    Questions mentioning 'agent' together with Neutron network objects (networks, routers, ports): Prefer
      the Neutron agents table; Nova services rows describe compute-side daemons only.
  desc: 'Tables registering the running service processes (daemons) of two OpenStack
    services: Nova''s services table (compute-side daemons such as nova-compute, nova-scheduler,
    nova-conductor, keyed by integer ID and referenced from COMPUTE_NODES.service_id)
    and Neutron''s agents table (network-side agents such as DHCP, L3, metadata and
    plugin agents, keyed by UUID and referenced from agent binding tables). Both answer
    ''which service process runs on which host, is it administratively enabled, and
    when did it last report a heartbeat'', but they are separate registries of different
    services with different identifier types, role-classification columns and disable
    semantics; rows in one are not related to rows in the other.'
  id: concept_service_process_registry
  name: Service Process Registry (Nova Services vs Neutron Agents)
  tables:
  - services
  - agents
column_concepts:
- id: column_concept_uuid_correlation
  name: UUID Cross-Service Correlation Key
  desc: UUID columns used to correlate the same underlying entity across Nova and
    placement services. A compute node's UUID equals its placement resource provider's
    UUID, enabling cross-service joins; aggregates also carry a UUID but identify
    a different kind of entity.
  columns:
  - COMPUTE_NODES.uuid
  - RESOURCE_PROVIDERS.uuid
  - SHADOW_COMPUTE_NODES.uuid
  - AGGREGATES.uuid
  comparisons:
  - dimension: Entity identified
    COMPUTE_NODES.uuid: The compute node (hypervisor) itself
    RESOURCE_PROVIDERS.uuid: The placement resource provider; for compute providers
      it equals the compute node UUID
    SHADOW_COMPUTE_NODES.uuid: Migration shadow copy of the compute node UUID; frequently
      NULL
    AGGREGATES.uuid: The host aggregate, not a compute resource
  - dimension: Join role
    COMPUTE_NODES.uuid: Source side of the compute-node-to-resource-provider join
    RESOURCE_PROVIDERS.uuid: Target side of the compute-node-to-resource-provider
      join
    SHADOW_COMPUTE_NODES.uuid: Not reliable for joins due to NULL values
    AGGREGATES.uuid: Used to reference the aggregate externally, not to link compute
      resources
  - dimension: Population
    COMPUTE_NODES.uuid: Populated for all live compute nodes
    RESOURCE_PROVIDERS.uuid: Populated for all registered providers
    SHADOW_COMPUTE_NODES.uuid: Often NULL in transitional rows
    AGGREGATES.uuid: Populated per aggregate definition
  decision_guide:
    Linking a compute node to its placement resource provider: 'Join COMPUTE_NODES.uuid
      = RESOURCE_PROVIDERS.uuid: this is the standard cross-service correlation for
      the same physical compute resource'
    Checking whether a compute node has a resource provider registered: Use RESOURCE_PROVIDERS.uuid
      as the existence side of the match against COMPUTE_NODES.uuid
    Identifying a host aggregate across services: 'Use AGGREGATES.uuid: aggregate
      UUIDs identify aggregates, never compute nodes'
- id: column_concept_aggregate_id
  name: Aggregate Identifier
  desc: Columns named aggregate_id that identify which aggregate a membership row
    refers to. Despite the shared name, the Nova host-aggregate membership uses the
    integer aggregate ID from AGGREGATES, while the placement membership uses a placement
    aggregate UUID string; they are not interchangeable.
  columns:
  - AGGREGATE_HOSTS.aggregate_id
  - RESOURCE_PROVIDER_AGGREGATES.aggregate_id
  comparisons:
  - dimension: Value type and meaning
    AGGREGATE_HOSTS.aggregate_id: Integer ID referencing AGGREGATES.id (Nova host
      aggregate)
    RESOURCE_PROVIDER_AGGREGATES.aggregate_id: Placement aggregate UUID string referencing
      a placement aggregate, not AGGREGATES.id
  - dimension: Membership scope
    AGGREGATE_HOSTS.aggregate_id: Groups compute hosts by host name
    RESOURCE_PROVIDER_AGGREGATES.aggregate_id: Groups placement resource providers
      by provider ID
  - dimension: Filter usage
    AGGREGATE_HOSTS.aggregate_id: Filter with an integer/string host aggregate ID
      to select hosts in that Nova aggregate
    RESOURCE_PROVIDER_AGGREGATES.aggregate_id: Filter with a placement aggregate UUID
  decision_guide:
    Questions about hosts or compute nodes belonging to a Nova host aggregate ID: 'Use
      AGGREGATE_HOSTS.aggregate_id: it keys on the integer Nova aggregate ID and joins
      to COMPUTE_NODES via host'
    Questions about resource providers grouped under a placement aggregate UUID: 'Use
      RESOURCE_PROVIDER_AGGREGATES.aggregate_id: it stores placement aggregate UUIDs
      and joins to RESOURCE_PROVIDERS via resource_provider_id'
- id: column_concept_instance_uuid_correlation
  name: Instance UUID Correlation Key
  desc: Columns that identify an instance by its UUID across Nova tables. INSTANCES.UUID
    is the authoritative instance identifier; satellite tables (extended attributes,
    network info cache, system/user metadata, migration history) reference it via
    INSTANCE_UUID columns, enabling one-to-one or one-to-many joins back to the instance
    registry.
  columns:
  - INSTANCES.uuid
  - INSTANCE_EXTRA.instance_uuid
  - INSTANCE_INFO_CACHES.instance_uuid
  - INSTANCE_SYSTEM_METADATA.instance_uuid
  - INSTANCE_METADATA.instance_uuid
  - MIGRATIONS.instance_uuid
  comparisons:
  - dimension: Direction of reference
    details: INSTANCES.UUID defines the instance; every other listed column is a foreign
      reference pointing back to it.
  - dimension: Cardinality per instance
    details: INSTANCE_EXTRA and INSTANCE_INFO_CACHES hold at most one row per instance_uuid;
      INSTANCE_SYSTEM_METADATA and INSTANCE_METADATA hold one row per (instance_uuid,
      key); MIGRATIONS holds one row per migration attempt, so many rows per instance_uuid.
  - dimension: Join fan-out risk
    details: Joining INSTANCES to INSTANCE_SYSTEM_METADATA or MIGRATIONS multiplies
      rows (per key or per migration); joins to INSTANCE_EXTRA/INSTANCE_INFO_CACHES
      are safe one-to-one enrichments.
  decision_guide:
    Enriching instances with flavor JSON, NUMA topology or cached network info: Join
      on INSTANCE_EXTRA.instance_uuid / INSTANCE_INFO_CACHES.instance_uuid = INSTANCES.uuid;
      one-to-one, no row multiplication.
    Counting or filtering instances by metadata properties: Join INSTANCE_SYSTEM_METADATA.instance_uuid
      or INSTANCE_METADATA.instance_uuid to INSTANCES.uuid and always constrain the
      key column, then aggregate with COUNT/GROUP BY to absorb the per-key fan-out.
    Analyzing migration history per instance: Join MIGRATIONS.instance_uuid to INSTANCES.uuid;
      expect multiple migration rows per instance and aggregate (e.g. STDDEV of memory_total
      grouped by display_name) rather than treating the join as one-to-one.
- id: column_concept_memory_mb
  name: 'Memory MB: Instance Allocation vs Host Capacity'
  desc: 'Columns named memory_mb that measure RAM in megabytes at different levels:
    the RAM allocated to a single instance from its flavor, versus the total physical
    RAM capacity of a compute node (hypervisor). Despite the shared name and unit,
    they describe different entities and must not be interchanged or compared directly
    without aggregation semantics.'
  columns:
  - INSTANCES.memory_mb
  - SHADOW_INSTANCES.memory_mb
  - COMPUTE_NODES.memory_mb
  - SHADOW_COMPUTE_NODES.memory_mb
  - INSTANCE_TYPES.memory_mb
  comparisons:
  - dimension: Measured entity
    details: INSTANCES.memory_mb is the RAM assigned to one virtual machine; COMPUTE_NODES.memory_mb
      is the total RAM of a physical compute node; INSTANCE_TYPES.memory_mb is the
      RAM defined by a flavor template, i.e. the value copied onto instances booted
      from that flavor.
  - dimension: Typical magnitude
    details: Instance values are flavor-sized (e.g. 512–32768 MB); node values are
      host-sized totals that can host many instances; flavor values are the template
      catalog sizes.
  - dimension: Related usage columns
    details: COMPUTE_NODES pairs memory_mb with memory_mb_used/free_ram_mb for capacity
      accounting; INSTANCES has no such counterpart because it is itself the allocation;
      INSTANCE_TYPES pairs memory_mb with vcpus/root_gb/ephemeral_gb plus disabled/is_public
      flags describing the flavor offering.
  - dimension: Live vs shadow
    details: SHADOW_INSTANCES.memory_mb and SHADOW_COMPUTE_NODES.memory_mb mirror
      the live columns but belong to online-migration shadow copies and are not authoritative.
  decision_guide:
    ? Questions about how much RAM a server/instance has, or window/aggregation over
      instance memory (e.g. MIN(memory_mb) per vcpus group)
    : 'Use INSTANCES.memory_mb: it is the per-instance allocation.'
    Questions about compute node/host RAM capacity or remaining host memory: Use COMPUTE_NODES.memory_mb
      (with memory_mb_used/free_ram_mb for usage).
    Summing RAM consumed by instances on a host: Aggregate INSTANCES.memory_mb grouped
      by host; do not use COMPUTE_NODES.memory_mb, which is capacity, not consumption.
    Questions about flavor/instance-type RAM definitions, e.g. average memory of enabled or public flavors: 'Use
      INSTANCE_TYPES.memory_mb: it is the flavor template value, joined to instances
      via INSTANCES.instance_type_id when per-instance context is needed.'
- id: column_concept_vcpus
  name: 'vCPUs: Instance Allocation vs Host Capacity'
  desc: 'Columns named vcpus that count virtual CPUs at different levels: the number
    of vCPUs allocated to a single instance from its flavor, versus the total vCPU
    capacity of a compute node (hypervisor). Same name and unit, different measured
    entity.'
  columns:
  - INSTANCES.vcpus
  - SHADOW_INSTANCES.vcpus
  - COMPUTE_NODES.vcpus
  - SHADOW_COMPUTE_NODES.vcpus
  - INSTANCE_TYPES.vcpus
  comparisons:
  - dimension: Measured entity
    details: INSTANCES.vcpus is the vCPU count assigned to one virtual machine; COMPUTE_NODES.vcpus
      is the total vCPU capacity of a physical compute node; INSTANCE_TYPES.vcpus
      is the vCPU count defined by a flavor template.
  - dimension: Related usage columns
    details: COMPUTE_NODES pairs vcpus with vcpus_used and cpu_allocation_ratio for
      overcommit accounting; INSTANCES has no counterpart because it is itself the
      allocation; INSTANCE_TYPES pairs vcpus with vcpu_weight and other flavor sizing
      fields.
  - dimension: Live vs shadow
    details: SHADOW_INSTANCES.vcpus and SHADOW_COMPUTE_NODES.vcpus mirror the live
      columns but belong to online-migration shadow copies and are not authoritative.
  decision_guide:
    Questions about how many vCPUs a server/instance has, or partitioning/windowing instances by vCPU count: 'Use
      INSTANCES.vcpus: it is the per-instance allocation.'
    Questions about compute node vCPU capacity, usage or overcommit: Use COMPUTE_NODES.vcpus
      together with vcpus_used/cpu_allocation_ratio.
    Summing vCPUs consumed by instances on a host: Aggregate INSTANCES.vcpus grouped
      by host; do not use COMPUTE_NODES.vcpus, which is capacity.
    Questions about flavor/instance-type vCPU definitions, e.g. average vcpus of enabled flavors: 'Use
      INSTANCE_TYPES.vcpus: it is the flavor template value.'
- id: column_concept_numa_topology
  name: 'NUMA Topology: Instance Placement vs Host Layout'
  desc: 'Columns named numa_topology that store serialized NUMA information at different
    levels: the instance-side pinning of vCPUs/memory to host NUMA nodes (INSTANCE_EXTRA),
    versus the physical NUMA layout of a compute node (COMPUTE_NODES). Both are JSON/text
    but describe opposite sides of the placement relationship.'
  columns:
  - INSTANCE_EXTRA.numa_topology
  - COMPUTE_NODES.numa_topology
  - SHADOW_COMPUTE_NODES.numa_topology
  comparisons:
  - dimension: Described object
    details: INSTANCE_EXTRA.numa_topology records how one instance's vCPUs and memory
      are pinned across host NUMA cells; COMPUTE_NODES.numa_topology records the NUMA
      cells (cores, memory) physically available on a compute node.
  - dimension: Population
    details: INSTANCE_EXTRA.numa_topology is NULL for instances without NUMA pinning
      (common for small flavors); COMPUTE_NODES.numa_topology is reported by the hypervisor
      driver for the node.
  - dimension: Join context
    details: INSTANCE_EXTRA.numa_topology is reached via INSTANCE_EXTRA.instance_uuid
      = INSTANCES.uuid; COMPUTE_NODES.numa_topology is reached via the compute node/host
      of the instance.
  decision_guide:
    Questions about an instance's NUMA pinning or per-instance NUMA placement JSON: Use
      INSTANCE_EXTRA.numa_topology joined to INSTANCES by instance_uuid.
    Questions about the NUMA hardware layout or NUMA capacity of a compute node/hypervisor: Use
      COMPUTE_NODES.numa_topology.
    Comparing whether an instance's pinning fits a node's NUMA layout: 'Combine both:
      INSTANCE_EXTRA.numa_topology for the demand side and COMPUTE_NODES.numa_topology
      for the supply side, correlated through the instance''s host.'
- id: column_concept_security_group_port_range
  name: Security Group Rule Port-Range Bounds (Nova vs Neutron)
  desc: 'Columns storing the L4 port-range bounds of security group rules in the two
    security group models: Nova''s SECURITY_GROUP_RULES.from_port/to_port and Neutron''s
    securitygrouprules.port_range_min/port_range_max. Both express an inclusive port
    interval whose size is upper - lower, but they differ in NULL semantics, negative
    values and owning service.'
  columns:
  - SECURITY_GROUP_RULES.from_port
  - SECURITY_GROUP_RULES.to_port
  - securitygrouprules.port_range_min
  - securitygrouprules.port_range_max
  comparisons:
  - dimension: Owning model and key type
    details: from_port/to_port belong to Nova legacy rules (integer rule/group IDs,
      soft-delete flag); port_range_min/port_range_max belong to Neutron rules (UUIDs,
      no soft-delete).
  - dimension: NULL semantics
    details: Nova from_port/to_port are always populated for a rule (ICMP rules use
      -1/255-style type-code values); Neutron port_range_min/port_range_max are NULL
      when the rule imposes no port restriction or applies to all ports/ICMP.
  - dimension: Negative values
    details: Nova ICMP rules can carry from_port = -1 (ICMP type), so to_port - from_port
      may exceed 65535 or include negative bounds; Neutron stores ICMP type/code differently
      and port bounds are non-negative when present.
  - dimension: Typical analysis
    details: Port-range size is computed as to_port - from_port (Nova) or port_range_max
      - port_range_min (Neutron); the two expressions must not be mixed across models
      in one aggregation.
  decision_guide:
    ? Statistics over port-range sizes (e.g. STDDEV/AVG of to_port - from_port) for
      Nova security groups, usually with deleted = 0 filters
    : Use SECURITY_GROUP_RULES.from_port/to_port.
    Statistics or filters over Neutron rule port ranges, especially involving direction or ethertype: Use
      securitygrouprules.port_range_min/port_range_max, guarding against NULLs for
      all-port rules.
    Questions that must cover both firewall models: Compute each model's range size
      separately and union the results; never join the two rule tables on port columns.
- id: column_concept_quota_usage_amounts
  name: Quota Usage and Reservation Amount Columns
  desc: 'Numeric columns measuring quota quantities across the Nova and Neutron quota
    models: in_use/reserved on both services'' usage tables, the signed hold amount
    on reservation rows (RESERVATIONS.delta in Nova, resourcedeltas.amount in Neutron),
    and the allowed maximum (QUOTAS.hard_limit in Nova, quotas.limit in Neutron).
    Despite shared names, in_use/reserved measure different resource vocabularies
    per service, and the reservation amount columns live in structurally different
    tables.'
  columns:
  - QUOTA_USAGES.in_use
  - QUOTA_USAGES.reserved
  - quotausages.in_use
  - quotausages.reserved
  - RESERVATIONS.delta
  - resourcedeltas.amount
  - QUOTAS.hard_limit
  - quotas.limit
  comparisons:
  - dimension: Measured entity
    in_use: Units of the resource already committed/consumed (both services).
    reserved: Units temporarily held by pending reservations (both services).
    delta / amount: Signed units held by a single reservation row (Nova delta / Neutron
      amount).
    hard_limit / limit: Maximum units the project/tenant may consume (Nova hard_limit
      / Neutron limit).
  - dimension: Owning service
    nova_columns: QUOTA_USAGES.in_use/reserved, RESERVATIONS.delta, QUOTAS.hard_limit
      — compute resources (cores, ram, instances...).
    neutron_columns: quotausages.in_use/reserved, resourcedeltas.amount, quotas.limit
      — network resources (port, network, subnet...).
  - dimension: Special value semantics
    details: Neutron quotas.limit uses -1 for unlimited; Nova QUOTAS.hard_limit uses
      NULL when no explicit limit is set. Nova RESERVATIONS.delta and Neutron resourcedeltas.amount
      are signed (positive = units held).
  - dimension: Aggregation grain
    details: in_use/reserved are per (project/tenant, resource) balances; delta/amount
      are per-reservation increments that sum into the reserved balance; hard_limit/limit
      are per (project/tenant, resource) caps.
  decision_guide:
    How much of a compute resource is consumed or held for a project: Use QUOTA_USAGES.in_use
      (committed) and QUOTA_USAGES.reserved (held by pending reservations), filtered
      on deleted = 0.
    How much of a network resource is consumed or held for a tenant: Use quotausages.in_use
      and quotausages.reserved; the dirty flag indicates the in_use value may be stale.
    How many units a single pending operation holds: Use RESERVATIONS.delta for Nova
      operations, resourcedeltas.amount for Neutron operations; sum delta/amount per
      project or resource to get total holds.
    Whether usage exceeds the allowed quota: Compare in_use (+ reserved) against QUOTAS.hard_limit
      for Nova resources or quotas.limit for Neutron resources, matching on project/tenant
      and resource.
