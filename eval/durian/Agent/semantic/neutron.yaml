- id: securitygroupportbindings
  name: securitygroupportbindings
  desc: Membership mapping between Neutron security groups and ports. One row per
    (port, security group) assignment with a composite primary key, allowing a port
    to belong to multiple groups; Neutron applies security groups at port level. Neutron-side
    counterpart of Nova's instance-level SECURITY_GROUP_INSTANCE_ASSOCIATION.
  columns:
    port_id:
      desc: UUID of the Neutron port; part of the composite primary key, references
        ports.id
    security_group_id:
      desc: UUID of the security group applied to the port; part of the composite
        primary key, references securitygroups.id
  default_granularity: one row per (port, security group) membership
  synonyms:
  - neutron security group port bindings
- id: securitygrouprules
  name: securitygrouprules
  desc: Neutron security group rules. One row per rule of a Neutron security group,
    recording direction (ingress/egress), ethertype (IPv4/IPv6), protocol, the port_range_min/port_range_max
    bounds, and the remote peer given either as remote_ip_prefix (CIDR) or remote_group_id
    (another security group). Neutron-side counterpart of Nova's legacy SECURITY_GROUP_RULES;
    unlike Nova it has explicit direction and ethertype and no soft-delete flag.
  columns:
    tenant_id:
      desc: ID of the tenant (project) owning the rule
    id:
      desc: UUID primary key of the rule
    security_group_id:
      desc: UUID of the security group this rule belongs to; foreign key to securitygroups.id
    remote_group_id:
      desc: UUID of another security group used as the traffic source/destination
        peer; NULL when remote_ip_prefix is used
    direction:
      desc: 'Traffic direction the rule applies to: ingress or egress'
    ethertype:
      desc: Ethernet type / IP version the rule matches, e.g. IPv4 or IPv6
    protocol:
      desc: IP protocol the rule applies to, e.g. tcp, udp, icmp; NULL matches all
        protocols
    port_range_min:
      desc: Lower bound of the L4 port range; NULL means no lower restriction
    port_range_max:
      desc: Upper bound of the L4 port range; NULL means no upper restriction
    remote_ip_prefix:
      desc: Remote CIDR prefix the rule allows traffic to/from; NULL when remote_group_id
        is used
    standard_attr_id:
      desc: Foreign key to standardattributes.id providing the common attribute/description
        record for this resource
  default_granularity: one row per Neutron security group rule
  synonyms:
  - neutron security group rules
- id: securitygroups
  name: securitygroups
  desc: Neutron security group definitions. One row per security group with a UUID
    id, owning tenant_id, name and a standard_attr_id link to the standardattributes
    table. Groups are attached to Neutron ports via securitygroupportbindings and
    their rules live in securitygrouprules. This is the Neutron-side counterpart of
    Nova's legacy SECURITY_GROUPS table; the two belong to different services and
    use different identifier types (UUID vs integer).
  columns:
    tenant_id:
      desc: ID of the tenant (project) owning the security group
    id:
      desc: UUID primary key of the security group; referenced by securitygrouprules.security_group_id
        and securitygroupportbindings.security_group_id
    name:
      desc: User-visible security group name; not unique across tenants
    standard_attr_id:
      desc: Foreign key to standardattributes.id providing the common attribute/description
        record for this resource
  default_granularity: one row per Neutron security group
  synonyms:
  - neutron security groups
