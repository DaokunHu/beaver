- id: shadow_compute_nodes
  name: shadow_compute_nodes
  desc: Archived (shadow) copy of deleted compute_nodes rows in OpenStack Nova. Shares
    the same 33-column schema as compute_nodes (hardware capacity, usage, hypervisor
    type/version, host identity, allocation ratios, node UUID) but stores historical
    records of compute nodes that were removed from the live inventory. Used for audit
    and historical questions about deleted compute nodes rather than current fleet
    state.
  columns:
    created_at:
      desc: Timestamp when the original compute node record was created
    updated_at:
      desc: Timestamp of the last update to the original compute node record before
        archival
    deleted_at:
      desc: Timestamp when the compute node record was soft-deleted and archived
    id:
      desc: Surrogate key of the original compute node record preserved in the archive
    service_id:
      desc: Identifier of the nova-compute service that managed the archived compute
        node
    vcpus:
      desc: Total number of virtual CPUs that were available on the archived compute
        node
    memory_mb:
      desc: Total RAM capacity in megabytes of the archived compute node
    local_gb:
      desc: Total local ephemeral disk capacity in gigabytes of the archived compute
        node
    vcpus_used:
      desc: Number of vCPUs that were consumed on the archived compute node at deletion
        time
    memory_mb_used:
      desc: Amount of RAM in megabytes that was consumed on the archived compute node
        at deletion time
    local_gb_used:
      desc: Amount of local disk in gigabytes that was consumed on the archived compute
        node at deletion time
    hypervisor_type:
      desc: Type of hypervisor software (e.g., QEMU, Xen) that ran on the archived
        compute node
    hypervisor_version:
      desc: Numeric version code of the hypervisor software on the archived compute
        node
    cpu_info:
      desc: JSON text describing CPU capabilities reported for the archived compute
        node
    disk_available_least:
      desc: Smallest amount of disk available in gigabytes recorded for the archived
        compute node
    free_ram_mb:
      desc: Free RAM in megabytes recorded on the archived compute node
    free_disk_gb:
      desc: Free local disk in gigabytes recorded on the archived compute node
    current_workload:
      desc: Workload value reported for the archived compute node at deletion time
    running_vms:
      desc: Number of virtual machines that were running on the archived compute node
    hypervisor_hostname:
      desc: Hostname of the archived compute node as reported by the hypervisor layer
    deleted:
      desc: Soft-delete flag of the archived record
    host_ip:
      desc: IP address of the archived compute host
    supported_instances:
      desc: JSON text listing instance capabilities supported by the archived compute
        node
    pci_stats:
      desc: JSON text with PCI passthrough device statistics of the archived compute
        node
    metrics:
      desc: JSON text of scheduler metrics recorded for the archived compute node
    extra_resources:
      desc: JSON text of extra/custom resources recorded for the archived compute
        node
    stats:
      desc: JSON text of miscellaneous statistics recorded for the archived compute
        node
    numa_topology:
      desc: JSON text describing the NUMA topology of the archived compute node
    host:
      desc: Name of the Nova compute host on which the archived compute node ran;
        joins to shadow_aggregate_hosts.host for historical aggregate membership
    ram_allocation_ratio:
      desc: Over-commit ratio for RAM recorded for the archived compute node
    cpu_allocation_ratio:
      desc: Over-commit ratio for vCPUs recorded for the archived compute node
    uuid:
      desc: UUID of the archived compute node; equals the uuid of its former placement
        resource provider registration
    disk_allocation_ratio:
      desc: Over-commit ratio for local disk recorded for the archived compute node
