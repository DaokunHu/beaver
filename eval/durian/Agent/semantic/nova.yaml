- id: instance_types
  name: instance_types
  desc: 'Definition table of OpenStack Nova instance types (flavors). Each row is
    one flavor template describing the compute resources offered to instances: RAM
    (memory_mb), vCPUs, swap, root and ephemeral disk sizes, network rxtx_factor,
    plus visibility (is_public) and availability (disabled, deleted) flags. Instances
    reference a flavor via instances.instance_type_id, and migrations reference old/new
    flavors for resizes. Extra key/value flavor properties live in instance_type_extra_specs,
    and per-project visibility for private flavors in instance_type_projects. Archived
    deleted flavors go to shadow_instance_types.'
  columns:
    created_at:
      desc: Timestamp when the flavor was created.
    updated_at:
      desc: Timestamp of the last update to the flavor.
    deleted_at:
      desc: Timestamp when the flavor was soft-deleted; NULL while active.
    name:
      desc: '[INDEX] Human-readable flavor name (e.g. ''m1.tiny'', ''align.lyric'').'
    id:
      desc: '[AUTO_INCREMENT] [PK] Internal numeric flavor id, referenced by instances.instance_type_id
        and migrations.old_instance_type_id / new_instance_type_id.'
    memory_mb:
      desc: Amount of RAM in MB defined by the flavor. This is the template value,
        distinct from the RAM actually allocated to a running instance (instances.memory_mb).
    vcpus:
      desc: Number of virtual CPUs defined by the flavor.
    swap:
      desc: Size in MB of the swap disk defined by the flavor; 0 means no swap.
    vcpu_weight:
      desc: Optional weight for vCPU scheduling priority; NULL when not used.
    flavorid:
      desc: '[INDEX] Externally visible flavor identifier string (e.g. ''1'', ''3'')
        exposed through the API; distinct from the internal numeric id.'
    rxtx_factor:
      desc: Optional RX/TX network throughput factor (float) applied to the flavor's
        network bandwidth; 1.0 means no scaling.
    root_gb:
      desc: Size in GB of the root disk defined by the flavor.
    ephemeral_gb:
      desc: Size in GB of the ephemeral (extra temporary) disk defined by the flavor.
    disabled:
      desc: Boolean flag indicating whether the flavor is disabled for launching new
        instances (false/0 = enabled, true/1 = disabled). Used to restrict analyses
        to enabled instance types.
    is_public:
      desc: 'Boolean flag: true/1 means the flavor is visible to all projects, false/0
        means it is private and only exposed to projects listed in instance_type_projects.'
    deleted:
      desc: 'Soft-delete flag: 0 means active, non-zero (typically the row id) means
        deleted. Current-flavor queries should filter deleted = 0.'
- id: instances
  name: instances
  desc: Live registry of OpenStack Nova virtual machine instances. Each row represents
    one VM and carries its identity (uuid, display_name, hostname), ownership (user_id,
    project_id), placement (host, node, availability_zone, cell_name), allocated compute
    resources (memory_mb, vcpus, root_gb, ephemeral_gb, instance_type_id), boot source
    (image_ref, kernel_id, ramdisk_id), lifecycle and state fields (vm_state, power_state,
    task_state, scheduled_at, launched_at, terminated_at), and a soft-delete flag
    (deleted). Extended per-instance JSON attributes live in instance_extra (flavor,
    NUMA topology), instance_info_caches (network info), and key/value details in
    instance_system_metadata and instance_metadata. Archived deleted rows go to shadow_instances.
  columns:
    created_at:
      desc: Timestamp when the instance record was created.
    updated_at:
      desc: Timestamp of the last update to the instance record.
    deleted_at:
      desc: Timestamp when the instance record was soft-deleted; NULL for active records.
    id:
      desc: Auto-increment surrogate primary key of the instance row; not used for
        cross-table linkage (use uuid instead).
    internal_id:
      desc: Reserved internal numeric identifier, generally unused.
    user_id:
      desc: ID of the user who owns/created the instance.
    project_id:
      desc: ID of the project (tenant) that owns the instance; indexed for per-project
        queries.
    image_ref:
      desc: Reference (URL/UUID) of the boot image used to create the instance.
    kernel_id:
      desc: Reference of the kernel image associated with the instance, if any.
    ramdisk_id:
      desc: Reference of the ramdisk image associated with the instance, if any.
    launch_index:
      desc: Index of this instance within a multi-instance launch reservation (0-based).
    key_name:
      desc: Name of the SSH key pair injected into the instance at boot.
    key_data:
      desc: Public key data (text) injected into the instance for SSH access.
    power_state:
      desc: 'Numeric power state of the VM reported by the hypervisor: 0=NOSTATE,
        1=RUNNING, 3=PAUSED, 4=SHUTDOWN, 6=CRASHED, 7=SUSPENDED.'
    vm_state:
      desc: Lifecycle state string of the instance, e.g. active, stopped, paused,
        suspended, resized, error.
    memory_mb:
      desc: Memory (RAM) in MB actually allocated to this instance from its flavor
        at boot. Distinct from instance_types.memory_mb, which is the flavor template
        definition, and from migrations.memory_total, which is the memory volume of
        a migration transfer.
    vcpus:
      desc: Number of virtual CPUs allocated to this instance from its flavor.
    hostname:
      desc: Hostname reported by the instance's guest OS (normalized lowercase). May
        differ from display_name, which is the user-facing name; hostname is used
        for DNS/inside-the-guest identity.
    host:
      desc: Name of the compute host currently running the instance; indexed. Joins
        to compute_nodes.host / services.host.
    user_data:
      desc: Base64-encoded user data supplied at boot for config drive / cloud-init.
    reservation_id:
      desc: Identifier of the launch reservation batch when multiple instances are
        created in one request; indexed.
    scheduled_at:
      desc: Timestamp when the scheduler placed the instance on a host.
    launched_at:
      desc: Timestamp when the instance finished booting on the compute host.
    terminated_at:
      desc: Timestamp when the instance was terminated; indexed.
    display_name:
      desc: User-visible instance name (settable and renamable by the user). This
        is the name shown in the API/dashboard and the column used for name-pattern
        matching; it may differ from hostname and from display_description.
    display_description:
      desc: User-provided free-text description of the instance.
    availability_zone:
      desc: Availability zone in which the instance is scheduled (e.g. 'flare3');
        NULL when no zone was assigned.
    locked:
      desc: 'Boolean flag: 1 if the instance is locked against non-admin operations.'
    os_type:
      desc: Operating system type of the instance image (e.g. linux, windows).
    launched_on:
      desc: Host on which the instance was originally launched (historical; may differ
        from current host after migration).
    instance_type_id:
      desc: Foreign key to instance_types.id, the flavor the instance was booted with.
    vm_mode:
      desc: Virtualization mode of the guest (e.g. hvm, xen, exe).
    uuid:
      desc: Canonical instance UUID (unique). This is the identity used by all satellite
        tables (instance_extra, instance_info_caches, instance_system_metadata, instance_metadata,
        migrations) via their instance_uuid columns.
    architecture:
      desc: CPU architecture of the instance image (e.g. x86_64, i686).
    root_device_name:
      desc: Device name of the root disk inside the guest (e.g. /dev/sda1).
    access_ip_v4:
      desc: IPv4 access address advertised for the instance.
    access_ip_v6:
      desc: IPv6 access address advertised for the instance.
    config_drive:
      desc: Identifier/volume reference of the config drive attached to the instance.
    task_state:
      desc: Transient task state during an in-flight operation (e.g. spawning, migrating,
        resizing, powering-off); NULL when idle. Indexed.
    default_ephemeral_device:
      desc: Default device name for the ephemeral disk inside the guest.
    default_swap_device:
      desc: Default device name for the swap disk inside the guest.
    progress:
      desc: Build/operation progress percentage (0-100) for the current task.
    auto_disk_config:
      desc: 'Boolean: whether automatic disk configuration (auto-resize of root partition)
        is enabled.'
    shutdown_terminate:
      desc: 'Boolean: if 1, the instance is terminated instead of merely shut down
        on stop.'
    disable_terminate:
      desc: 'Boolean: if 1, termination of the instance is disabled.'
    root_gb:
      desc: Size of the root disk in GB allocated to the instance.
    ephemeral_gb:
      desc: Size of the ephemeral disk in GB allocated to the instance.
    cell_name:
      desc: Name of the Nova cell that manages this instance.
    node:
      desc: Hypervisor node name within the compute host on which the instance runs.
    deleted:
      desc: 'Soft-delete flag: 0 for active records; non-zero (usually the row id)
        for deleted records. Indexed.'
    locked_by:
      desc: 'Who locked the instance: enum ''owner'' or ''admin''; NULL if unlocked.'
    cleaned:
      desc: Internal flag indicating the record has been cleaned up by maintenance.
    ephemeral_key_uuid:
      desc: UUID of the ephemeral encryption key associated with the instance.
  default_granularity: one row per virtual machine instance
