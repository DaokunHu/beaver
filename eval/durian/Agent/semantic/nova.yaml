- id: instance_extra
  name: instance_extra
  desc: 'One-to-one extension table of instances holding large per-instance JSON documents
    that are too heavy for the main instances table: the full flavor definition (flavor),
    NUMA topology (numa_topology), PCI requests (pci_requests), vCPU model (vcpu_model),
    and migration context (migration_context). Linked to instances by instance_uuid
    = instances.uuid.'
  columns:
    created_at:
      desc: Timestamp when the extra record was created.
    updated_at:
      desc: Timestamp of the last update to the extra record.
    deleted_at:
      desc: Timestamp when the record was soft-deleted; NULL for active records.
    deleted:
      desc: 'Soft-delete flag: 0 for active records.'
    id:
      desc: Auto-increment surrogate primary key.
    instance_uuid:
      desc: Foreign key to instances.uuid; unique per instance (1:1). Indexed.
    numa_topology:
      desc: JSON document describing the NUMA topology assigned to the instance (cells,
        CPU pinning, memory placement).
    pci_requests:
      desc: JSON document describing PCI device requests (e.g. SR-IOV) required by
        the instance's flavor/image.
    flavor:
      desc: JSON document with the complete resolved flavor definition of the instance
        (id, name, memory_mb, vcpus, root_gb, ephemeral_gb, swap, rxtx_factor, extra_specs).
        Richer than instances.instance_type_id, which only references the flavor row.
    vcpu_model:
      desc: JSON document describing the virtual CPU model exposed to the guest.
    migration_context:
      desc: JSON document capturing context of an in-progress or last migration for
        the instance (old/new flavor, PCI/NUMA context).
  default_granularity: one row per instance (1:1 with instances)
