- id: shadow_migrations
  name: shadow_migrations
  desc: Archived (shadow) copy of deleted migrations rows in OpenStack Nova. Shares
    the same 22-column schema as migrations (source/destination compute hosts and
    nodes, status, migration type, old/new flavor ids, hidden flag, memory/disk transfer
    counters in MB) but stores historical migration attempts that were removed from
    the live table. Used for audit and historical questions about purged migrations
    rather than current migration activity.
  columns:
    created_at:
      desc: Timestamp when the archived migration record was originally created (migration
        start).
    updated_at:
      desc: Timestamp of the last status/progress update before archiving.
    deleted_at:
      desc: Timestamp when the migration record was deleted and archived.
    id:
      desc: Surrogate primary key carried over from the original migrations row.
    source_compute:
      desc: Name of the compute host the instance was migrated from.
    dest_compute:
      desc: Name of the compute host the instance was migrated to.
    dest_host:
      desc: Destination host identifier (may include hypervisor hostname) for the
        migration.
    status:
      desc: Migration status string at archive time, e.g. migrating, completed, error,
        cancelled, confirmed, reverted.
    instance_uuid:
      desc: Foreign key to the migrated instance's UUID (instances.uuid / shadow_instances.uuid);
        one instance can have many archived migration rows.
    old_instance_type_id:
      desc: Foreign key to instance_types.id for the flavor before the migration/resize.
    new_instance_type_id:
      desc: Foreign key to instance_types.id for the flavor after the migration/resize.
    source_node:
      desc: Hypervisor node on the source compute host.
    dest_node:
      desc: Hypervisor node on the destination compute host.
    deleted:
      desc: Soft-delete flag; non-zero for archived deleted records.
    migration_type:
      desc: 'Enum classifying the migration: ''migration'' (cold), ''resize'', ''live-migration'',
        ''evacuation''.'
    hidden:
      desc: 'Boolean: whether the migration was hidden from the standard migration
        list API.'
    memory_total:
      desc: Total amount of instance memory (MB) that had to be transferred during
        the migration.
    memory_processed:
      desc: Amount of memory (MB) already transferred when the record was archived.
    memory_remaining:
      desc: Amount of memory (MB) still to be transferred when the record was archived.
    disk_total:
      desc: Total amount of disk data (MB) to transfer during the migration.
    disk_processed:
      desc: Amount of disk data (MB) already transferred.
    disk_remaining:
      desc: Amount of disk data (MB) still to be transferred.
  default_granularity: one row per archived (deleted) migration attempt
