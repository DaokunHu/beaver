- id: aggregates
  name: aggregates
  desc: Definition table of OpenStack Nova host aggregates. Each row represents one
    aggregate used to group compute hosts for scheduling purposes, carrying the aggregate's
    numeric id, human-readable name, and UUID. Membership is stored separately in
    aggregate_hosts (by host name) and resource_provider_aggregates (by placement
    provider id), both referencing this table's id.
  columns:
    created_at:
      desc: Timestamp when the host aggregate was created
    updated_at:
      desc: Timestamp of the last update to the aggregate record
    deleted_at:
      desc: Timestamp when the aggregate was soft-deleted (NULL if active)
    id:
      desc: Auto-increment surrogate primary key of the aggregate; referenced by aggregate_hosts.aggregate_id
        and resource_provider_aggregates.aggregate_id
    name:
      desc: Human-readable name of the host aggregate
    deleted:
      desc: 'Soft-delete flag: 0 means active aggregate, non-zero means deleted'
    uuid:
      desc: Globally unique identifier (UUID) of the host aggregate, used for external/API
        references to the aggregate
- id: all_instances
  name: all_instances
  desc: Database view that UNIONs the live instances table with the archived shadow_instances
    table, exposing the identical 53-column instance schema. It is the single source
    for questions that must cover both current and deleted/archived virtual machines;
    for current-state questions the instances table alone is sufficient and cheaper.
  columns:
    created_at:
      desc: Timestamp when the instance record was created (from instances or shadow_instances).
    updated_at:
      desc: Timestamp of the last update to the instance record.
    deleted_at:
      desc: Timestamp when the instance record was soft-deleted; NULL for active records.
    id:
      desc: Surrogate primary key of the underlying instance row; can repeat across
        the live and archived halves of the union.
      default: '0'
    internal_id:
      desc: Reserved internal numeric identifier, generally unused.
    user_id:
      desc: ID of the user who owns/created the instance.
    project_id:
      desc: ID of the project (tenant) that owns the instance.
    image_ref:
      desc: Reference of the boot image used to create the instance.
    kernel_id:
      desc: Reference of the kernel image associated with the instance, if any.
    ramdisk_id:
      desc: Reference of the ramdisk image associated with the instance, if any.
    launch_index:
      desc: Index of this instance within a multi-instance launch reservation.
    key_name:
      desc: Name of the SSH key pair injected at boot.
    key_data:
      desc: Public key data injected into the instance.
    power_state:
      desc: 'Numeric hypervisor power state: 0=NOSTATE, 1=RUNNING, 3=PAUSED, 4=SHUTDOWN,
        6=CRASHED, 7=SUSPENDED.'
    vm_state:
      desc: Lifecycle state string, e.g. active, stopped, error.
    memory_mb:
      desc: Memory in MB allocated to the instance.
    vcpus:
      desc: Number of virtual CPUs allocated to the instance.
    hostname:
      desc: Hostname reported by the guest OS.
    host:
      desc: Compute host currently (or last) running the instance.
    user_data:
      desc: Base64-encoded user data supplied at boot.
    reservation_id:
      desc: Identifier of the launch reservation batch.
    scheduled_at:
      desc: Timestamp when the scheduler placed the instance.
    launched_at:
      desc: Timestamp when the instance finished booting.
    terminated_at:
      desc: Timestamp when the instance was terminated.
    display_name:
      desc: User-visible instance name.
    display_description:
      desc: User-provided description of the instance.
    availability_zone:
      desc: Availability zone in which the instance was scheduled.
    locked:
      desc: 'Boolean flag: 1 if locked against non-admin operations.'
    os_type:
      desc: Operating system type of the instance image.
    launched_on:
      desc: Host on which the instance was originally launched.
    instance_type_id:
      desc: Foreign key to instance_types.id (boot flavor).
    vm_mode:
      desc: Virtualization mode of the guest (hvm, xen, exe).
    uuid:
      desc: Canonical instance UUID; the identity shared with satellite tables' instance_uuid
        columns.
      default: ''
    architecture:
      desc: CPU architecture of the instance image.
    root_device_name:
      desc: Root disk device name inside the guest.
    access_ip_v4:
      desc: IPv4 access address advertised for the instance.
    access_ip_v6:
      desc: IPv6 access address advertised for the instance.
    config_drive:
      desc: Config drive identifier/volume reference.
    task_state:
      desc: Transient task state during an in-flight operation; NULL when idle.
    default_ephemeral_device:
      desc: Default ephemeral disk device name.
    default_swap_device:
      desc: Default swap device name.
    progress:
      desc: Build/operation progress percentage (0-100).
    auto_disk_config:
      desc: 'Boolean: automatic disk configuration enabled.'
    shutdown_terminate:
      desc: 'Boolean: terminate instead of shut down on stop.'
    disable_terminate:
      desc: 'Boolean: termination disabled.'
    root_gb:
      desc: Root disk size in GB.
    ephemeral_gb:
      desc: Ephemeral disk size in GB.
    cell_name:
      desc: Nova cell managing the instance.
    node:
      desc: Hypervisor node name within the compute host.
    deleted:
      desc: 'Soft-delete flag: 0 for active records; non-zero for deleted/archived
        records.'
    locked_by:
      desc: 'Who locked the instance: ''owner'' or ''admin''.'
    cleaned:
      desc: Internal maintenance cleanup flag.
    ephemeral_key_uuid:
      desc: UUID of the ephemeral encryption key.
  default_granularity: one row per instance across live and archived records
