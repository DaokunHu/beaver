- id: project_user_quotas
  name: project_user_quotas
  desc: Per-user quota overrides in OpenStack Nova. Each row sets a hard_limit for
    one resource for a specific (user, project) pair, overriding the project-level
    limit in quotas. Rows are soft-deleted via the deleted flag.
  columns:
    id:
      desc: '[AUTO_INCREMENT] [PK]'
    created_at:
      desc: ''
    updated_at:
      desc: ''
    deleted_at:
      desc: ''
    deleted:
      desc: ''
