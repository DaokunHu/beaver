- id: migrations
  name: migrations
  desc: Live record of OpenStack Nova instance migrations (cold migration, resize,
    live-migration, evacuation). Each row is one migration attempt for an instance,
    tracking source/destination compute hosts and nodes, migration status and type,
    the old/new flavor ids for resizes, and memory/disk transfer progress counters
    (memory_total/processed/remaining, disk_total/processed/remaining) in MB. An instance
    can have multiple migration rows, so joins to instances on instance_uuid fan out.
    Archived deleted migrations go to shadow_migrations.
  columns:
    created_at:
      desc: Timestamp when the migration record was created (migration start).
    updated_at:
      desc: Timestamp of the last status/progress update of the migration.
    deleted_at:
      desc: Timestamp when the record was soft-deleted; NULL for active records.
    id:
      desc: Auto-increment surrogate primary key of the migration row.
    source_compute:
      desc: Name of the compute host the instance is migrated from.
    dest_compute:
      desc: Name of the compute host the instance is migrated to.
    dest_host:
      desc: Destination host identifier (may include hypervisor hostname) for the
        migration.
    status:
      desc: Migration status string, e.g. migrating, completed, error, cancelled,
        confirmed, reverted.
    instance_uuid:
      desc: Foreign key to instances.uuid identifying the migrated instance; indexed.
        One instance can have many migration rows (1:N).
    old_instance_type_id:
      desc: Foreign key to instance_types.id for the flavor before the migration/resize.
    new_instance_type_id:
      desc: Foreign key to instance_types.id for the flavor after the migration/resize.
    source_node:
      desc: Hypervisor node on the source compute host.
    dest_node:
      desc: Hypervisor node on the destination compute host.
    deleted:
      desc: 'Soft-delete flag: 0 for active records; indexed.'
    migration_type:
      desc: 'Enum classifying the migration: ''migration'' (cold), ''resize'', ''live-migration'',
        ''evacuation''.'
    hidden:
      desc: 'Boolean: if 1 the migration is hidden from the standard migration list
        API (used e.g. for resize-confirm bookkeeping).'
    memory_total:
      desc: Total amount of instance memory (MB) that must be transferred during the
        migration; the denominator for migration progress. Distinct from instances.memory_mb
        (allocated RAM of the instance) though usually equal in value.
    memory_processed:
      desc: Amount of memory (MB) already transferred during the migration.
    memory_remaining:
      desc: Amount of memory (MB) still to be transferred during the migration.
    disk_total:
      desc: Total amount of disk data (MB) to transfer during the migration.
    disk_processed:
      desc: Amount of disk data (MB) already transferred.
    disk_remaining:
      desc: Amount of disk data (MB) still to be transferred.
  default_granularity: one row per migration attempt of an instance
