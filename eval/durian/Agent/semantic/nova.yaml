    protocol:
      desc: 'IP protocol of the default rule: ''tcp'', ''udp'', or ''icmp''.'
    from_port:
      desc: Lower bound of the default port range (ICMP type for icmp rules).
    to_port:
      desc: Upper bound of the default port range (ICMP code for icmp rules).
    cidr:
      desc: Source IPv4 CIDR block allowed by the default rule.
- id: security_group_instance_association
  name: security_group_instance_association
  desc: Membership mapping between Nova security groups and instances. Each row records
    that an instance (by UUID) is protected by a given security group (security_group_id
    references security_groups.id). One instance can belong to multiple groups and
    one group can cover multiple instances. Archived deleted associations go to shadow_security_group_instance_association.
  columns:
    created_at:
      desc: Timestamp when the association was created.
    updated_at:
      desc: Timestamp of the last update to the association.
    deleted_at:
      desc: Timestamp when the association was soft-deleted; NULL while active.
    id:
      desc: '[AUTO_INCREMENT] [PK] Numeric association id.'
    security_group_id:
      desc: '[INDEX] ID of the security group; references security_groups.id.'
    instance_uuid:
      desc: '[INDEX] UUID of the associated instance; matches instances.uuid.'
    deleted:
      desc: 'Soft-delete flag: 0 means active, non-zero means deleted.'
- id: security_group_rules
  name: security_group_rules
  desc: 'Live firewall rules attached to Nova security groups. Each row defines one
    ingress rule of a parent security group: protocol, port range (from_port..to_port),
    and the source, given either as a CIDR block or as another security group (group_id).
    Archived deleted rules go to shadow_security_group_rules; template rules for newly
    created groups live in security_group_default_rules instead.'
  columns:
    created_at:
      desc: Timestamp when the rule was created.
    updated_at:
      desc: Timestamp of the last update to the rule.
    deleted_at:
      desc: Timestamp when the rule was soft-deleted; NULL while active.
    id:
      desc: '[AUTO_INCREMENT] [PK] Numeric rule id.'
    parent_group_id:
      desc: '[INDEX] ID of the security group that owns this rule; references security_groups.id.'
    protocol:
      desc: 'IP protocol the rule applies to: ''tcp'', ''udp'', or ''icmp''.'
    from_port:
      desc: Lower bound of the port range (for tcp/udp); for icmp rules it carries
        the ICMP type and can be -1 (all types). Port-range size analyses typically
        compute to_port - from_port.
    to_port:
      desc: Upper bound of the port range (for tcp/udp); for icmp rules it carries
        the ICMP code. Wide ranges such as 1..65535 indicate allow-all rules.
    cidr:
      desc: Source IPv4 CIDR block the rule allows traffic from (e.g. '10.71.29.205/8');
        NULL when the rule's source is another security group.
    group_id:
      desc: '[INDEX] ID of the source security group allowed by this rule (group-to-group
        rule); references security_groups.id and is NULL when cidr is used.'
    deleted:
      desc: 'Soft-delete flag: 0 means active, non-zero means deleted. Current-rule
        queries should filter deleted = 0.'
- id: security_groups
  name: security_groups
  desc: Live registry of OpenStack Nova security groups. Each row is one named security
    group owned by a user/project, used as a firewall rule container for instances.
    Rules belonging to a group are stored in security_group_rules (via parent_group_id),
    group-to-instance membership is tracked in security_group_instance_association,
    and archived deleted groups go to shadow_security_groups.
  columns:
    created_at:
      desc: Timestamp when the security group was created.
    updated_at:
      desc: Timestamp of the last update to the security group.
    deleted_at:
      desc: Timestamp when the security group was soft-deleted; NULL while active.
    id:
      desc: '[AUTO_INCREMENT] [PK] Numeric security group id, referenced by security_group_rules.parent_group_id
        and security_group_instance_association.security_group_id.'
    name:
      desc: 'Human-readable security group name (e.g. ''aurum-xenon'', ''flare'').
        Not globally unique: the same name can appear under different users/projects,
        so grouping by name can merge groups from multiple projects.'
    description:
      desc: Free-text description of the security group.
    user_id:
      desc: ID of the user who owns the security group.
    project_id:
      desc: '[INDEX] ID of the project (tenant) the security group belongs to.'
    deleted:
      desc: 'Soft-delete flag: 0 means active, non-zero means deleted. Queries about
        current security groups should filter deleted = 0.'
- id: services
  name: services
  desc: Live registry of OpenStack Nova service processes. Each row is one Nova service
    instance (identified by binary such as nova-compute, nova-scheduler, nova-conductor,
    nova-cert, nova-consoleauth, nova-metadata) running on a host, with its RPC topic,
    heartbeat report count, last-seen-up timestamp, enabled/disabled state, and soft-delete
    flag. Used for questions about which Nova services run on which hosts, service
    availability, and filtering analyses by service binary.
  columns:
    created_at:
      desc: Timestamp when the service record was created.
    updated_at:
      desc: Timestamp of the last update to the service record.
    deleted_at:
      desc: Timestamp when the service was soft-deleted; NULL while active.
    id:
      desc: '[AUTO_INCREMENT] [PK] Numeric service id.'
    host:
      desc: '[INDEX] Name of the compute host on which this service process runs;
        shares the host-name value domain with compute_nodes.host and instances.host.'
    binary:
      desc: Name of the Nova service binary, e.g. 'nova-compute', 'nova-scheduler',
        'nova-conductor', 'nova-cert', 'nova-consoleauth', 'nova-metadata', 'nova-osapi_compute',
        'nova-ec2'. Used to filter analyses by service type.
    topic:
      desc: RPC topic the service listens on (e.g. 'compute', 'scheduler', 'conductor');
        NULL for API-facing services that do not consume a worker topic.
    report_count:
      desc: Number of heartbeat reports the service has sent; increases with each
        periodic report to the conductor.
    disabled:
      desc: 'Boolean flag: 0/false means the service is enabled, non-zero/true means
        it is administratively disabled.'
    deleted:
      desc: 'Soft-delete flag: 0 means active, non-zero means deleted. Current-service
        queries should filter deleted = 0.'
    disabled_reason:
      desc: Free-text reason recorded when the service was manually disabled; NULL
        when not disabled or no reason given.
    last_seen_up:
      desc: Timestamp of the last heartbeat received from the service; used to detect
        stale or down services.
    forced_down:
      desc: Boolean flag indicating the service was manually forced into a down state
        by an operator.
    version:
      desc: Version number of the service binary's object schema, used for rolling-upgrade
        compatibility checks.
  reason: The services table had an empty desc and empty column descriptions; case
    nova_390 filters services by binary = 'nova-scheduler', so the table and its columns
    (especially binary, topic, host) need clear business descriptions for retrieval
    and selection.
