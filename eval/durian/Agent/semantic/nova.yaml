- id: compute_nodes
  name: compute_nodes
  desc: Live inventory of OpenStack Nova compute nodes (hypervisors). Each row represents
    one compute node reported by a nova-compute service, covering hardware capacity
    (vCPUs, memory, local disk), current usage, hypervisor software type/version,
    host identity, allocation ratios, and the node UUID used to link with the placement
    service's resource providers.
  columns:
    created_at:
      desc: Timestamp when the compute node record was created
    updated_at:
      desc: Timestamp of the last update to the compute node record
    deleted_at:
      desc: Timestamp when the compute node record was soft-deleted (NULL if active)
    id:
      desc: Auto-increment surrogate primary key of the compute node record
    service_id:
      desc: Foreign key to services.id, the nova-compute service that manages/reports
        this compute node
    vcpus:
      desc: Total number of virtual CPUs (physical cores times threads) available
        on the compute node
    memory_mb:
      desc: Total RAM capacity of the compute node in megabytes
    local_gb:
      desc: Total local ephemeral disk capacity of the compute node in gigabytes
    vcpus_used:
      desc: Number of vCPUs currently consumed by instances running on the compute
        node
    memory_mb_used:
      desc: Amount of RAM in megabytes currently consumed by running instances
    local_gb_used:
      desc: Amount of local disk in gigabytes currently consumed by running instances
    hypervisor_type:
      desc: Type of hypervisor software running on the compute node (e.g., QEMU, Xen,
        Hyper-V); used to filter nodes by virtualization technology
    hypervisor_version:
      desc: Numeric version code of the hypervisor software
    cpu_info:
      desc: JSON text describing CPU capabilities (architecture, model, features,
        topology) reported by the hypervisor
    disk_available_least:
      desc: Smallest amount of disk available in gigabytes across the node's storage,
        used for scheduling safety
    free_ram_mb:
      desc: Currently free RAM in megabytes on the compute node
    free_disk_gb:
      desc: Currently free local disk in gigabytes on the compute node
    current_workload:
      desc: Current workload value reported for the compute node, used as a scheduling
        hint
    running_vms:
      desc: Number of virtual machines (instances) currently running on the compute
        node
    hypervisor_hostname:
      desc: Hostname of the compute node as reported by the hypervisor layer, may
        differ from the Nova host name
    deleted:
      desc: 'Soft-delete flag: 0 means active record, non-zero means the record is
        deleted'
    host_ip:
      desc: IP address of the compute host used for communication
    supported_instances:
      desc: JSON text listing instance capabilities (architectures, hypervisor types,
        VM modes) supported by the node
    pci_stats:
      desc: JSON text with PCI passthrough device statistics (available/claimed counts
        per vendor/product)
    metrics:
      desc: JSON text of scheduler metrics reported for the compute node
    extra_resources:
      desc: JSON text of extra/custom resources reported by the compute node
    stats:
      desc: JSON text of miscellaneous compute node statistics reported by the virt
        driver
    numa_topology:
      desc: JSON text describing the NUMA topology (cells, CPU/memory pinning) of
        the compute node
    host:
      desc: Name of the Nova compute host on which this node runs; the join key to
        aggregate_hosts.host and services.host for host-level associations
    ram_allocation_ratio:
      desc: Over-commit ratio for RAM used by the scheduler (allocated memory can
        exceed physical by this factor)
    cpu_allocation_ratio:
      desc: Over-commit ratio for vCPUs used by the scheduler
    uuid:
      desc: Globally unique identifier (UUID) of the compute node; matches resource_providers.uuid
        in the placement service, enabling compute-node-to-resource-provider linkage
    disk_allocation_ratio:
      desc: Over-commit ratio for local disk used by the scheduler
  default_granularity: one row per compute node
