- id: aggregate_hosts
  name: aggregate_hosts
  desc: Membership mapping between host aggregates and compute hosts in OpenStack
    Nova. Each row records that a host belongs to a given aggregate (aggregate_id
    references aggregates.id). A host can belong to multiple aggregates, so joining
    compute nodes to aggregates goes through this table on the host name.
  columns:
    created_at:
      desc: Timestamp when the host-aggregate membership was created
    updated_at:
      desc: Timestamp of the last update to the membership record
    deleted_at:
      desc: Timestamp when the membership was soft-deleted (NULL if active)
    id:
      desc: Auto-increment surrogate primary key of the membership record
    host:
      desc: Name of the compute host that is a member of the aggregate; joins to compute_nodes.host
        and services.host
    aggregate_id:
      desc: Identifier of the host aggregate (references aggregates.id) that the host
        belongs to
    deleted:
      desc: 'Soft-delete flag: 0 means active membership, non-zero means deleted'
  default_granularity: one row per (host, aggregate) membership
