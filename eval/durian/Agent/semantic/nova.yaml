- id: shadow_services
  name: shadow_services
  desc: Archived (shadow) copy of deleted services rows in OpenStack Nova. Shares
    the same 14-column schema as services (host, binary, topic, report_count, disabled
    state, last_seen_up, forced_down, version, soft-delete flag) but stores historical
    records of Nova service processes that were removed from the live registry. Used
    for audit and historical questions about decommissioned or purged Nova services
    rather than current service availability.
  columns:
    created_at:
      desc: Timestamp when the archived service record was created.
    updated_at:
      desc: Timestamp of the last update to the archived service record.
    deleted_at:
      desc: Timestamp when the service was soft-deleted and archived.
    id:
      desc: '[AUTO_INCREMENT] [PK] Numeric service id, matching the id the row had
        in the live services table.'
    host:
      desc: Name of the compute host on which the archived service process ran; shares
        the host-name value domain with compute_nodes.host and instances.host.
    binary:
      desc: Name of the Nova service binary (e.g. 'nova-compute', 'nova-scheduler',
        'nova-conductor') of the archived service.
    topic:
      desc: RPC topic the archived service listened on (e.g. 'compute', 'scheduler',
        'conductor'); NULL for API-facing services.
    report_count:
      desc: Number of heartbeat reports the archived service had sent before deletion.
    disabled:
      desc: Boolean flag recording whether the archived service was administratively
        disabled at deletion time.
    deleted:
      desc: 'Soft-delete flag: non-zero for all archived rows.'
    disabled_reason:
      desc: Free-text reason recorded when the archived service was manually disabled;
        NULL when not applicable.
    last_seen_up:
      desc: Timestamp of the last heartbeat received from the archived service before
        deletion.
    forced_down:
      desc: Boolean flag indicating the archived service had been manually forced
        into a down state.
    version:
      desc: Version number of the archived service binary's object schema.
  reason: shadow_services had an empty table desc and empty column descriptions; filled
    in following the same archived-copy pattern used by other shadow_* tables so historical
    service questions can select this table correctly.
