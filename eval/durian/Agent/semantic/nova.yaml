relationships:
- id: join_compute_nodes_resource_providers_uuid
  source_entity_type: table
  source_entity_id: compute_nodes
  target_entity_type: table
  target_entity_id: resource_providers
  relation_type: joins
  desc: A Nova compute node links to its placement resource provider by matching compute_nodes.uuid
    = resource_providers.uuid (1:1 for compute hosts).
  columns:
  - source_column: uuid
    target_column: uuid
- id: join_compute_nodes_aggregate_hosts_host
  source_entity_type: table
  source_entity_id: compute_nodes
  target_entity_type: table
  target_entity_id: aggregate_hosts
  relation_type: joins
  desc: 'A compute node joins to aggregate membership records by host name: compute_nodes.host
    = aggregate_hosts.host. A host may appear in multiple aggregates, so this join
    can fan out rows.'
  columns:
  - source_column: host
    target_column: host
- id: join_aggregate_hosts_aggregates_id
  source_entity_type: table
  source_entity_id: aggregate_hosts
  target_entity_type: table
  target_entity_id: aggregates
  relation_type: joins
  desc: 'Aggregate host membership references the aggregate definition: aggregate_hosts.aggregate_id
    = aggregates.id.'
  columns:
  - source_column: aggregate_id
    target_column: id
- id: join_compute_nodes_services_service_id
  source_entity_type: table
  source_entity_id: compute_nodes
  target_entity_type: table
  target_entity_id: services
  relation_type: joins
  desc: 'A compute node is managed by a nova-compute service: compute_nodes.service_id
    = services.id; alternatively they can be matched by host name (compute_nodes.host
    = services.host).'
  columns:
  - source_column: service_id
    target_column: id
  - source_column: host
    target_column: host
- id: join_resource_provider_aggregates_resource_providers_id
  source_entity_type: table
  source_entity_id: resource_provider_aggregates
  target_entity_type: table
  target_entity_id: resource_providers
  relation_type: joins
  desc: 'Placement-side aggregate membership links to the resource provider definition:
    resource_provider_aggregates.resource_provider_id = resource_providers.id.'
  columns:
  - source_column: resource_provider_id
    target_column: id
- id: join_resource_provider_aggregates_aggregates_id
  source_entity_type: table
  source_entity_id: resource_provider_aggregates
  target_entity_type: table
  target_entity_id: aggregates
  relation_type: joins
  desc: 'Placement-side aggregate membership references the aggregate definition:
    resource_provider_aggregates.aggregate_id = aggregates.id.'
  columns:
  - source_column: aggregate_id
    target_column: id
- id: join_shadow_compute_nodes_shadow_aggregate_hosts_host
  source_entity_type: table
  source_entity_id: shadow_compute_nodes
  target_entity_type: table
  target_entity_id: shadow_aggregate_hosts
  relation_type: joins
  desc: 'An archived compute node joins to archived aggregate membership records by
    host name: shadow_compute_nodes.host = shadow_aggregate_hosts.host. A host may
    appear in multiple archived memberships, so this join can fan out rows.'
  columns:
  - source_column: host
    target_column: host
- id: join_instances_instance_extra_uuid
  source_entity_type: table
  source_entity_id: instances
  target_entity_type: table
  target_entity_id: instance_extra
  relation_type: joins
  desc: 'An instance links 1:1 to its extended JSON attributes: instances.uuid = instance_extra.instance_uuid
    (flavor, numa_topology, pci_requests, vcpu_model, migration_context).'
  columns:
  - source_column: uuid
    target_column: instance_uuid
- id: join_instances_instance_info_caches_uuid
  source_entity_type: table
  source_entity_id: instances
  target_entity_type: table
  target_entity_id: instance_info_caches
  relation_type: joins
  desc: 'An instance links 1:1 to its cached network info: instances.uuid = instance_info_caches.instance_uuid
    (network_info JSON).'
  columns:
  - source_column: uuid
    target_column: instance_uuid
- id: join_instances_instance_system_metadata_uuid
  source_entity_type: table
  source_entity_id: instances
  target_entity_type: table
  target_entity_id: instance_system_metadata
  relation_type: joins
  desc: 'An instance links 1:N to its system-managed metadata rows: instances.uuid
    = instance_system_metadata.instance_uuid. Joins fan out one row per metadata key;
    filter on key (e.g. ''image_image_type'') to avoid multiplying results.'
  columns:
  - source_column: uuid
    target_column: instance_uuid
- id: join_instances_migrations_uuid
  source_entity_type: table
  source_entity_id: instances
  target_entity_type: table
  target_entity_id: migrations
  relation_type: joins
  desc: 'An instance links 1:N to its migration records: instances.uuid = migrations.instance_uuid.
    An instance may have zero, one, or many migration rows.'
  columns:
  - source_column: uuid
    target_column: instance_uuid
- id: join_instances_instance_types_flavor
  source_entity_type: table
  source_entity_id: instances
  target_entity_type: table
  target_entity_id: instance_types
  relation_type: joins
  desc: 'An instance references its boot flavor definition: instances.instance_type_id
    = instance_types.id (N:1). migrations.old_instance_type_id / new_instance_type_id
    also reference instance_types.id.'
  columns:
  - source_column: instance_type_id
    target_column: id
- id: join_instances_instance_metadata_uuid
  source_entity_type: table
  source_entity_id: instances
  target_entity_type: table
  target_entity_id: instance_metadata
  relation_type: joins
  desc: 'An instance links 1:N to its user-supplied metadata rows: instances.uuid
    = instance_metadata.instance_uuid. Joins fan out one row per user metadata key.'
  columns:
  - source_column: uuid
    target_column: instance_uuid
- id: join_migrations_instance_types_old_new
  source_entity_type: table
  source_entity_id: migrations
  target_entity_type: table
  target_entity_id: instance_types
  relation_type: joins
  desc: 'A migration references the flavor before and after the operation: migrations.old_instance_type_id
    = instance_types.id and migrations.new_instance_type_id = instance_types.id (both
    N:1; used for resize analysis).'
  columns:
  - source_column: old_instance_type_id
    target_column: id
  - source_column: new_instance_type_id
    target_column: id
- id: join_shadow_migrations_shadow_instances_uuid
  source_entity_type: table
  source_entity_id: shadow_migrations
  target_entity_type: table
  target_entity_id: shadow_instances
  relation_type: joins
  desc: 'An archived migration links to its archived instance record: shadow_migrations.instance_uuid
    = shadow_instances.uuid (N:1). The same instance_uuid may also match live instances.uuid
    when the instance still exists but the migration row was purged.'
  columns:
  - source_column: instance_uuid
    target_column: uuid
- id: join_security_group_rules_security_groups_parent
  source_entity_type: table
  source_entity_id: security_group_rules
  target_entity_type: table
  target_entity_id: security_groups
  relation_type: joins
  desc: 'A security group rule belongs to its owning security group: security_group_rules.parent_group_id
    = security_groups.id (N:1). One group can have many rules, so joining groups to
    rules fans out rows.'
  columns:
  - source_column: parent_group_id
    target_column: id
- id: join_security_group_rules_security_groups_source
  source_entity_type: table
  source_entity_id: security_group_rules
  target_entity_type: table
  target_entity_id: security_groups
  relation_type: joins
  desc: 'A group-to-group rule references the source security group it allows traffic
    from: security_group_rules.group_id = security_groups.id (N:1). group_id is NULL
    when the rule uses a cidr source instead.'
  columns:
  - source_column: group_id
    target_column: id
- id: join_sg_instance_association_security_groups
  source_entity_type: table
  source_entity_id: security_group_instance_association
  target_entity_type: table
  target_entity_id: security_groups
  relation_type: joins
  desc: 'A group-instance membership row references its security group: security_group_instance_association.security_group_id
    = security_groups.id (N:1).'
  columns:
  - source_column: security_group_id
    target_column: id
- id: join_sg_instance_association_instances
  source_entity_type: table
  source_entity_id: security_group_instance_association
  target_entity_type: table
  target_entity_id: instances
  relation_type: joins
  desc: 'A group-instance membership row references its instance by UUID: security_group_instance_association.instance_uuid
    = instances.uuid (N:1). An instance can appear in multiple membership rows (one
    per security group).'
  columns:
  - source_column: instance_uuid
    target_column: uuid
- id: join_shadow_sg_rules_shadow_sg_parent
  source_entity_type: table
  source_entity_id: shadow_security_group_rules
  target_entity_type: table
  target_entity_id: shadow_security_groups
  relation_type: joins
  desc: 'An archived security group rule belongs to its archived owning group: shadow_security_group_rules.parent_group_id
    = shadow_security_groups.id (N:1). The same parent_group_id may also match live
    security_groups.id when the group still exists but the rule row was purged.'
  columns:
  - source_column: parent_group_id
    target_column: id
- id: join_shadow_sg_assoc_shadow_sg
  source_entity_type: table
  source_entity_id: shadow_security_group_instance_association
  target_entity_type: table
  target_entity_id: shadow_security_groups
  relation_type: joins
  desc: 'An archived group-instance membership row references its archived security
    group: shadow_security_group_instance_association.security_group_id = shadow_security_groups.id
    (N:1). The same id may also match live security_groups.id when the group still
    exists but the membership row was purged.'
  columns:
  - source_column: security_group_id
    target_column: id
- id: join_shadow_sg_assoc_shadow_instances
  source_entity_type: table
  source_entity_id: shadow_security_group_instance_association
  target_entity_type: table
  target_entity_id: shadow_instances
  relation_type: joins
  desc: 'An archived group-instance membership row references its archived instance
    by UUID: shadow_security_group_instance_association.instance_uuid = shadow_instances.uuid
    (N:1). The same UUID may also match live instances.uuid when the instance still
    exists but the membership row was purged.'
  columns:
  - source_column: instance_uuid
    target_column: uuid
- id: join_reservations_to_quota_usages
  source_entity_type: table
  source_entity_id: reservations
  target_entity_type: table
  target_entity_id: quota_usages
  relation_type: joins
  desc: 'A reservation holds against a quota usage counter: reservations.usage_id
    = quota_usages.id. One usage counter (per project/user/resource) can have many
    reservations over time.'
  columns:
  - source_column: usage_id
    target_column: id
metrics:
- id: metric_qemu_compute_nodes_with_resource_provider_in_aggregate
  name: QEMU Compute Nodes with Resource Provider in Aggregate
  desc: Count of compute nodes that run a specified hypervisor type (e.g., QEMU),
    have a matching placement resource provider record (joined on UUID), and belong
    to a specified host aggregate (joined on host name). Returns an exact integer
    count without rounding.
  category: Compute Node Analysis
  default_granularity: one aggregate count over compute nodes
  sql: SELECT COUNT(*) AS qemu_compute_nodes_with_resource_provider FROM COMPUTE_NODES
    cn JOIN RESOURCE_PROVIDERS rp ON cn.UUID = rp.UUID JOIN AGGREGATE_HOSTS ah ON
    ah.HOST = cn.HOST WHERE cn.HYPERVISOR_TYPE = 'QEMU' AND ah.AGGREGATE_ID = '1';
  question: How many compute nodes have the QEMU hypervisor type, are linked to a
    resource provider (matching on UUID), and belong to aggregate ID 1? Do not return
    any rounded answers.
- id: metric_flare_instance_details_with_prime_migration_memory_stddev
  name: Flare AZ Instance Details Combined with Prime Migration Memory Stddev and
    image_image_type Metadata Counts
  desc: 'Combined (UNION ALL) output of two instance analyses plus a per-row count
    of ''image_image_type'' system-metadata rows: (1) instances in availability zone
    ''flare3'' whose display_name matches ''flare'', joined 1:1 to instance_extra
    (flavor JSON, numa_topology JSON) and instance_info_caches (network_info JSON),
    including a window column MIN(memory_mb) OVER (PARTITION BY vcpus ORDER BY vcpus)
    giving the per-vCPU-group minimum memory; (2) instances whose display_name matches
    ''prime'' having more than one ''image_image_type'' row in instance_system_metadata,
    with STDDEV (sample standard deviation, not STDDEV_POP) of migrations.memory_total
    grouped by display_name. Each row keeps a reason label (''Flare AZ Instance Details''
    or ''Prime Migration Memory Stddev'') and the total number of ''image_image_type''
    metadata rows for the included instance/display-name group via a LEFT JOIN back
    to instances and instance_system_metadata. No rounding is applied to any value.'
  category: Instance Configuration and Migration Memory Comprehensive Analysis
  sql: WITH inner_cte AS (WITH FlareInstances AS (SELECT i.UUID AS instance_uuid,
    i.HOSTNAME AS hostname, i.DISPLAY_NAME AS display_name, i.MEMORY_MB AS memory_mb,
    i.VCPUS AS vcpus, ie.FLAVOR AS flavor_json, ie.NUMA_TOPOLOGY AS numa_topology_json,
    iic.NETWORK_INFO AS network_info_json, MIN(i.MEMORY_MB) OVER (PARTITION BY i.VCPUS
    ORDER BY i.VCPUS) AS window_column FROM INSTANCES AS i JOIN INSTANCE_EXTRA AS
    ie ON ie.INSTANCE_UUID = i.UUID JOIN INSTANCE_INFO_CACHES AS iic ON iic.INSTANCE_UUID
    = i.UUID WHERE i.AVAILABILITY_ZONE = 'flare3' AND i.DISPLAY_NAME REGEXP 'flare'),
    PrimeMigrationStddev AS (SELECT i.display_name, STDDEV(m.memory_total) AS memory_total_stddev
    FROM migrations AS m JOIN instances AS i ON m.instance_uuid = i.uuid JOIN instance_system_metadata
    AS ism ON i.uuid = ism.instance_uuid WHERE ism.key = 'image_image_type' AND i.display_name
    REGEXP 'prime' GROUP BY i.display_name HAVING COUNT(ism.id) > 1 ORDER BY memory_total_stddev
    DESC), CombinedResults AS ( SELECT fi.instance_uuid, fi.hostname, fi.display_name,
    fi.memory_mb, fi.vcpus, fi.flavor_json, fi.numa_topology_json, fi.network_info_json,
    fi.window_column, NULL AS memory_total_stddev, 'Flare AZ Instance Details' AS
    reason FROM FlareInstances fi UNION ALL SELECT NULL AS instance_uuid, NULL AS
    hostname, pms.display_name, NULL AS memory_mb, NULL AS vcpus, NULL AS flavor_json,
    NULL AS numa_topology_json, NULL AS network_info_json, NULL AS window_column,
    pms.memory_total_stddev, 'Prime Migration Memory Stddev' AS reason FROM PrimeMigrationStddev
    pms ) SELECT * FROM CombinedResults ORDER BY reason, display_name, instance_uuid)
    SELECT ic.*, COUNT(ism2.id) AS image_image_type_metadata_rows FROM inner_cte ic
    LEFT JOIN instances i2 ON i2.uuid = ic.instance_uuid LEFT JOIN instance_system_metadata
    ism2 ON ism2.instance_uuid = i2.uuid AND ism2.key = 'image_image_type' GROUP BY
    ic.instance_uuid, ic.hostname, ic.display_name, ic.memory_mb, ic.vcpus, ic.flavor_json,
    ic.numa_topology_json, ic.network_info_json, ic.window_column, ic.memory_total_stddev,
    ic.reason ORDER BY ic.reason, ic.display_name, ic.instance_uuid;
  default_granularity: one row per included instance (flare branch) or per display_name
    group (prime branch), annotated with image_image_type metadata row count
  question: For the combined output of (1) instances in availability zone 'flare3'
    whose display name matches the pattern 'flare' (including instance UUID, hostname,
    display name, memory_mb, vcpus, flavor/NUMA/network_info JSON fields, and the
    per-vCPU minimum memory window value) and (2) instance display names matching
    'prime' that have more than one 'image_image_type' system-metadata row along with
    the standard deviation (using STDDEV only and never STDDEV_POP) of MIGRATIONS.MEMORY_TOTAL,
    additionally show the total number of 'image_image_type' system-metadata rows
    for each included instance (or display name group) and keep the reason label indicating
    why each row was included. Do not return any rounded answers.
- id: metric_migration_memory_total_stddev_by_display_name
  name: Migration Memory Total Stddev by Instance Display Name
  desc: Sample standard deviation (STDDEV, not STDDEV_POP) of migrations.memory_total
    for each instance display name, computed by joining migrations to instances on
    instance_uuid = uuid and grouping by display_name. Measures how much the total
    memory transferred varies across an instance's migration attempts. Returns exact
    unrounded values.
  category: Migration Memory Analysis
  sql: SELECT i.display_name, STDDEV(m.memory_total) AS memory_total_stddev FROM migrations
    AS m JOIN instances AS i ON m.instance_uuid = i.uuid GROUP BY i.display_name;
  default_granularity: one row per instance display name
- id: metric_instance_count_by_availability_zone
  name: Instance Count by Availability Zone
  desc: Number of instances per availability zone, counting instances grouped by availability_zone
    (NULL zone included as its own group). Used for distribution questions such as
    how many instances run in each availability zone.
  category: Instance Distribution Analysis
  sql: SELECT availability_zone, COUNT(*) AS instance_count FROM instances GROUP BY
    availability_zone;
  default_granularity: one row per availability zone
- id: metric_system_metadata_rows_by_key
  name: Instance System Metadata Row Count by Key
  desc: Number of instance_system_metadata rows per metadata key, counting rows grouped
    by key. Shows which system-managed keys (e.g. image_image_type, image_min_ram,
    network_allocated) exist and how many instances carry each.
  category: Instance Metadata Analysis
  sql: SELECT `key`, COUNT(*) AS row_count FROM instance_system_metadata GROUP BY
    `key`;
  default_granularity: one row per metadata key
- id: metric_forge_shelved_offloaded_above_zone_avg_memory_with_migration_summary
  name: Shelved-Offloaded Instances Above Zone Average Memory with Completed-Migration
    Summary
  desc: 'Two-part combined analysis of instance memory and migration activity. Part
    1: instances with a given display_name (e.g. ''forge'') whose memory_mb exceeds
    the average memory_mb of same-named instances within their availability_zone,
    restricted to a given vm_state (e.g. ''shelved_offloaded''); each row carries
    instance identity/ownership/state columns (id, uuid, user_id, project_id, hostname,
    vm_state, power_state, memory_mb, vcpus, availability_zone), the 1:1 instance_info_caches
    id and network_info, and a window value MIN(memory_mb) OVER (PARTITION BY project_id)
    giving the per-project minimum memory. Part 2: for completed migrations of instances
    in that vm_state, the minimum instance memory_mb, SUM(migrations.memory_processed),
    and a Yes/No flag whether any related instance has a non-deleted instance_info_caches
    row. The two parts are joined on vm_state. No rounding is applied.'
  category: Instance Memory and Migration Comprehensive Analysis
  default_granularity: one row per qualifying instance, each annotated with the vm_state-level
    migration summary
  question: For instances with display name "forge" that are in the "shelved_offloaded"
    VM state and have memory (MB) greater than the average "forge" memory (MB) in
    their availability zone, list the instance details (ID, UUID, user ID, project
    ID, hostname, VM/power state, memory, vCPUs, availability zone, instance-info-cache
    ID and network info, and the per-project minimum memory window value) along with
    the "shelved_offloaded" migration summary for completed migrations (minimum instance
    memory, total migration memory processed, and whether any related instances have
    a non-deleted network info cache record). Do not return any rounded answers.
  sql: WITH q1 AS (WITH inner_cte AS (SELECT i.ID AS instance_id, i.UUID AS instance_uuid,
    i.USER_ID, i.PROJECT_ID, i.HOSTNAME, i.VM_STATE, i.POWER_STATE, i.MEMORY_MB, i.VCPUS,
    i.AVAILABILITY_ZONE, c.ID AS info_cache_id, c.NETWORK_INFO, MIN(i.MEMORY_MB) OVER
    (PARTITION BY i.PROJECT_ID ORDER BY i.PROJECT_ID) AS window_column FROM INSTANCES
    AS i JOIN INSTANCE_INFO_CACHES AS c ON i.UUID = c.INSTANCE_UUID WHERE i.DISPLAY_NAME
    = 'forge'), ZoneAverages AS ( SELECT i2.AVAILABILITY_ZONE, AVG(i2.MEMORY_MB *
    1.0) AS avg_zone_memory_mb FROM INSTANCES AS i2 WHERE i2.DISPLAY_NAME = 'forge'
    GROUP BY i2.AVAILABILITY_ZONE ) SELECT inner_cte.instance_id, inner_cte.instance_uuid,
    inner_cte.USER_ID, inner_cte.PROJECT_ID, inner_cte.HOSTNAME, inner_cte.VM_STATE,
    inner_cte.POWER_STATE, inner_cte.MEMORY_MB, inner_cte.VCPUS, inner_cte.AVAILABILITY_ZONE,
    inner_cte.info_cache_id, inner_cte.NETWORK_INFO, inner_cte.window_column FROM
    inner_cte JOIN ZoneAverages za ON za.AVAILABILITY_ZONE = inner_cte.AVAILABILITY_ZONE
    WHERE inner_cte.MEMORY_MB > za.avg_zone_memory_mb), q2 AS (WITH inner_cte AS (
    SELECT MIN(i.MEMORY_MB) AS min_instance_memory_mb, SUM(m.MEMORY_PROCESSED) AS
    total_migration_memory_processed FROM MIGRATIONS m JOIN INSTANCES i ON m.INSTANCE_UUID
    = i.UUID JOIN INSTANCE_INFO_CACHES ic ON i.UUID = ic.INSTANCE_UUID WHERE m.STATUS
    = 'completed' AND i.VM_STATE = 'shelved_offloaded' ) SELECT i.VM_STATE AS vm_state,
    inner_cte.min_instance_memory_mb, inner_cte.total_migration_memory_processed,
    CASE WHEN EXISTS ( SELECT 1 FROM MIGRATIONS m2 JOIN INSTANCES i2 ON m2.INSTANCE_UUID
    = i2.UUID JOIN INSTANCE_INFO_CACHES ic2 ON i2.UUID = ic2.INSTANCE_UUID WHERE m2.STATUS
    = 'completed' AND i2.VM_STATE = 'shelved_offloaded' AND ic2.DELETED = 0 ) THEN
    'Yes' ELSE 'No' END AS has_network_info_cache FROM inner_cte JOIN INSTANCES i
    ON i.VM_STATE = 'shelved_offloaded' GROUP BY i.VM_STATE, inner_cte.min_instance_memory_mb,
    inner_cte.total_migration_memory_processed) SELECT q1.instance_id, q1.instance_uuid,
    q1.user_id, q1.project_id, q1.hostname, q1.vm_state, q1.power_state, q1.memory_mb,
    q1.vcpus, q1.availability_zone, q1.info_cache_id, q1.network_info, q1.window_column
    AS min_memory_mb_within_project, q2.min_instance_memory_mb AS shelved_offloaded_min_instance_memory_mb,
    q2.total_migration_memory_processed, q2.has_network_info_cache FROM q1 LEFT JOIN
    q2 ON q2.vm_state = q1.vm_state WHERE q1.vm_state = 'shelved_offloaded' ORDER
    BY q1.availability_zone, q1.project_id, q1.instance_id;
- id: metric_top_launch_groups_by_max_memory_with_numa_and_named_instance_counts
  name: Top Launch-Time Groups by Max Memory with NUMA Topology and Named-Instance
    Counts
  desc: 'Ranks (display_name, launched_at) groups of instances launched in a given
    year by MAX(memory_mb), keeping only groups above a memory threshold, limited
    to the top N. For each group it reports the display name, launched-at timestamp,
    and maximum memory, plus: a Yes/No flag whether any instance in the group has
    a non-empty instance_extra.numa_topology; the count of instances in the group
    matching a specific display name (e.g. ''forge''); and a 0/1 flag whether any
    of those named instances has an instance_extra record marked deleted. Uses 1:1
    joins to instance_extra and instance_info_caches on instance_uuid. No rounding
    is applied.'
  category: Instance Memory Analysis
  default_granularity: one row per (display_name, launched_at) group among the top
    N by max memory
  question: For each of the top 10 (display name, launched-at timestamp) groups with
    the highest maximum memory among instances launched in 2014 (only keeping groups
    where that maximum exceeds 16000 MB), show the group’s display name, launched-at
    timestamp, maximum memory, whether any instance in the group has a non-empty NUMA
    topology recorded, how many instances in that group are the display name 'forge',
    and whether any of those 'forge' instances has an instance-extra record marked
    as deleted. Do not return any rounded answers.
  sql: WITH top_groups_2014 AS ( WITH inner_cte AS ( SELECT i.DISPLAY_NAME, MAX(i.MEMORY_MB)
    AS max_memory_mb, i.LAUNCHED_AT FROM INSTANCE_EXTRA ie JOIN INSTANCES i ON ie.INSTANCE_UUID
    = i.UUID JOIN INSTANCE_INFO_CACHES ic ON i.UUID = ic.INSTANCE_UUID WHERE EXTRACT(YEAR
    FROM i.LAUNCHED_AT) = 2014 GROUP BY i.DISPLAY_NAME, i.LAUNCHED_AT HAVING MAX(i.MEMORY_MB)
    > 16000 ) SELECT inner_cte.DISPLAY_NAME, inner_cte.LAUNCHED_AT, inner_cte.max_memory_mb,
    CASE WHEN EXISTS ( SELECT 1 FROM INSTANCES i2 JOIN INSTANCE_EXTRA ie2 ON ie2.INSTANCE_UUID
    = i2.UUID WHERE i2.DISPLAY_NAME = inner_cte.DISPLAY_NAME AND i2.LAUNCHED_AT =
    inner_cte.LAUNCHED_AT AND ie2.NUMA_TOPOLOGY IS NOT NULL AND ie2.NUMA_TOPOLOGY
    <> '' ) THEN 'Yes' ELSE 'No' END AS has_numa_topology FROM inner_cte ORDER BY
    inner_cte.max_memory_mb DESC LIMIT 10 ), forge_instances AS ( WITH inner_cte AS
    ( SELECT i.UUID AS instance_uuid, i.DISPLAY_NAME AS display_name, i.VM_STATE AS
    vm_state, i.MEMORY_MB AS memory_mb, i.VCPUS AS vcpus, ie.ID AS instance_extra_id,
    ie.CREATED_AT AS instance_extra_created_at, iic.NETWORK_INFO AS network_info,
    MIN(ie.ID) OVER ( ORDER BY i.MEMORY_MB ROWS BETWEEN 3 PRECEDING AND 1 FOLLOWING
    ) AS window_column FROM INSTANCES AS i JOIN INSTANCE_EXTRA AS ie ON ie.INSTANCE_UUID
    = i.UUID JOIN INSTANCE_INFO_CACHES AS iic ON iic.INSTANCE_UUID = i.UUID WHERE
    i.DISPLAY_NAME = 'forge' ) SELECT ic.instance_uuid, ic.display_name, ic.vm_state,
    ic.memory_mb, ic.vcpus, ic.instance_extra_id, ic.instance_extra_created_at, ic.network_info,
    ic.window_column, CASE WHEN EXISTS ( SELECT 1 FROM INSTANCE_EXTRA ie2 JOIN INSTANCES
    i2 ON i2.UUID = ie2.INSTANCE_UUID WHERE i2.UUID = ic.instance_uuid AND ie2.DELETED
    <> 0 ) THEN 'Yes' ELSE 'No' END AS has_deleted_instance_extra FROM inner_cte ic
    ) SELECT tg.DISPLAY_NAME AS group_display_name, tg.LAUNCHED_AT AS group_launched_at,
    tg.max_memory_mb AS group_max_memory_mb, tg.has_numa_topology AS group_has_numa_topology,
    COUNT(fi.instance_uuid) AS forge_instance_count_in_group, MAX(CASE WHEN fi.has_deleted_instance_extra
    = 'Yes' THEN 1 ELSE 0 END) AS any_forge_instance_has_deleted_instance_extra FROM
    top_groups_2014 tg LEFT JOIN INSTANCES i ON i.DISPLAY_NAME = tg.DISPLAY_NAME AND
    i.LAUNCHED_AT = tg.LAUNCHED_AT LEFT JOIN forge_instances fi ON fi.instance_uuid
    = i.UUID GROUP BY tg.DISPLAY_NAME, tg.LAUNCHED_AT, tg.max_memory_mb, tg.has_numa_topology
    ORDER BY tg.max_memory_mb DESC;
- id: metric_cache_update_variability_and_memory_deviation_combined
  name: Cache-Update Time Variability by Display Name Combined with Memory Deviation
    from Overall Average
  desc: 'UNION ALL of two variability analyses with a reason label per row. Branch
    1: for non-deleted instances whose display_name matches a pattern, the coefficient
    of variation (STDDEV/AVG, sample STDDEV only, never STDDEV_POP) of the cache-update
    lag (instance_info_caches.updated_at - instances.created_at) per display name,
    benchmarked against the overall average coefficient of variation and categorized
    as HIGH_VARIABILITY (>1.5x benchmark), LOW_VARIABILITY (<0.5x benchmark), or AVERAGE_VARIABILITY.
    Branch 2: for instances in a given availability_zone whose display_name matches
    another pattern, each instance''s memory_mb deviation from the overall average
    memory_mb of that set, categorized ABOVE/BELOW/AT_OVERALL_AVG, including a window
    AVG(memory_mb) OVER (PARTITION BY vm_state ORDER BY memory_mb ROWS 2 PRECEDING
    TO 2 FOLLOWING). No rounding is applied.'
  category: Instance Cache Update and Memory Variability Comprehensive Analysis
  default_granularity: one row per display name (variability branch) or per instance
    (memory deviation branch), tagged with a reason label
  question: List (1) each non-deleted instance display name matching the pattern 'prime'
    with its cache-update time coefficient of variation (using STDDEV only and never
    STDDEV_POP), the overall average coefficient of variation (using STDDEV only and
    never STDDEV_POP) as a benchmark, and a variability category, and (2) each instance
    in availability zone 'flare3' whose display name matches the pattern 'flare' with
    its deviation from the overall average memory (using that overall average as the
    benchmark), returning a combined result set with a reason indicating which rule
    produced each row. Do not return any rounded answers. Categorize each display
    name as 'HIGH_VARIABILITY' (at least 50% above the benchmark), 'LOW_VARIABILITY'
    (at least 50% below the benchmark), or 'AVERAGE_VARIABILITY'.
  sql: WITH prime_variability AS ( WITH inner_cte AS ( SELECT i.display_name, STDDEV(c.updated_at
    - i.created_at) / NULLIF(AVG(c.updated_at - i.created_at), 0) AS coefficient_of_variation
    FROM instances AS i JOIN instance_extra AS e ON e.instance_uuid = i.uuid JOIN
    instance_info_caches AS c ON c.instance_uuid = i.uuid WHERE i.deleted = 0 AND
    i.display_name REGEXP 'prime' GROUP BY i.display_name HAVING AVG(c.updated_at
    - i.created_at) > 0 ORDER BY coefficient_of_variation DESC ), avg_cte AS ( SELECT
    AVG(coefficient_of_variation) AS avg_coefficient_of_variation FROM inner_cte )
    SELECT ic.display_name, ic.coefficient_of_variation, ac.avg_coefficient_of_variation
    AS benchmark, CASE WHEN ic.coefficient_of_variation > ac.avg_coefficient_of_variation
    * 1.5 THEN 'HIGH_VARIABILITY' WHEN ic.coefficient_of_variation < ac.avg_coefficient_of_variation
    * 0.5 THEN 'LOW_VARIABILITY' ELSE 'AVERAGE_VARIABILITY' END AS variability_category
    FROM inner_cte ic CROSS JOIN avg_cte ac ORDER BY ic.coefficient_of_variation DESC
    ), flare_memory AS ( WITH inner_cte AS ( SELECT i.UUID AS instance_uuid, i.HOSTNAME
    AS hostname, i.MEMORY_MB AS memory_mb, ie.ID AS instance_extra_id, ie.CREATED_AT
    AS instance_extra_created_at, AVG(i.MEMORY_MB) OVER ( PARTITION BY i.VM_STATE
    ORDER BY i.MEMORY_MB ROWS BETWEEN 2 PRECEDING AND 2 FOLLOWING ) AS window_column
    FROM INSTANCES AS i JOIN INSTANCE_EXTRA AS ie ON ie.INSTANCE_UUID = i.UUID JOIN
    INSTANCE_INFO_CACHES AS iic ON iic.INSTANCE_UUID = i.UUID WHERE i.AVAILABILITY_ZONE
    = 'flare3' AND i.DISPLAY_NAME REGEXP 'flare' ORDER BY i.MEMORY_MB ), overall_avg
    AS ( SELECT AVG(memory_mb) AS overall_avg_memory_mb FROM inner_cte ) SELECT ic.instance_uuid,
    ic.hostname, ic.memory_mb, ic.instance_extra_id, ic.instance_extra_created_at,
    ic.window_column, oa.overall_avg_memory_mb, (ic.memory_mb - oa.overall_avg_memory_mb)
    AS deviation_from_overall_avg_memory_mb FROM inner_cte ic CROSS JOIN overall_avg
    oa ORDER BY ic.memory_mb ), CombinedResults AS ( SELECT pv.display_name AS entity_name,
    pv.coefficient_of_variation AS metric_value, pv.benchmark AS benchmark_value,
    pv.variability_category AS category, 'Prime display-name cache-update variability'
    AS reason FROM prime_variability pv UNION ALL SELECT fm.instance_uuid AS entity_name,
    fm.deviation_from_overall_avg_memory_mb AS metric_value, fm.overall_avg_memory_mb
    AS benchmark_value, CASE WHEN fm.deviation_from_overall_avg_memory_mb > 0 THEN
    'ABOVE_OVERALL_AVG' WHEN fm.deviation_from_overall_avg_memory_mb < 0 THEN 'BELOW_OVERALL_AVG'
    ELSE 'AT_OVERALL_AVG' END AS category, 'Flare3 instance memory deviation' AS reason
    FROM flare_memory fm ) SELECT entity_name, metric_value, benchmark_value, category,
    reason FROM CombinedResults ORDER BY entity_name;
- id: metric_host_image_type_root_gb_variability_with_rollup_and_migration_memory_max
  name: Root Disk Size Variability by Image Type and Host Migration Activity with
    Rollup, Plus Max Completed-Migration Memory Total
  desc: For instances on a given compute host (using non-deleted instance_info_caches
    rows and non-deleted instance_system_metadata rows with key 'image_image_type'),
    computes per display_name the coefficient of variation (STDDEV/AVG, sample STDDEV
    only) of instances.root_gb, then aggregates AVG of that coefficient by (image_type,
    host_migration_status, display_name) WITH ROLLUP producing subtotals and a grand
    total, along with row counts. The host_migration_status label is 'Active' when
    any non-deleted migration touching the host (source_compute or dest_compute) is
    still in progress (status not completed/failed/error), else 'Inactive'. A second
    part attaches, per display_name matching a pattern, the MAX(migrations.memory_total)
    over completed migrations when that maximum is greater than 0. No rounding is
    applied.
  category: Instance Disk and Migration Memory Comprehensive Analysis
  default_granularity: one row per (image_type, host_migration_status, display_name)
    combination including ROLLUP subtotal and grand-total rows
  question: For instances running on host 'blaze8-12' (using only non-deleted instance
    info cache rows and non-deleted system metadata entries for key 'image_image_type'),
    show the image type, host migration activity label (Active/Inactive), instance
    display name, the average coefficient of variation (using STDDEV only and never
    STDDEV_POP) of root disk size (GB) with rollup subtotals and a grand total, the
    row count, and (when the display name matches REGEXP 'prime') the maximum completed-migration
    memory_total observed for that display name (only when that maximum is greater
    than 0). Do not return any rounded answers.
  sql: WITH q1 AS ( WITH inner_cte AS ( SELECT i.display_name, STDDEV(i.root_gb) /
    NULLIF(AVG(i.root_gb), 0) AS coefficient_of_variation FROM instances AS i JOIN
    instance_system_metadata AS ism ON ism.instance_uuid = i.uuid JOIN instance_info_caches
    AS iic ON i.uuid = iic.instance_uuid WHERE ism.key = 'image_image_type' AND iic.deleted
    = 0 AND i.host = 'blaze8-12' GROUP BY i.display_name HAVING AVG(i.root_gb) > 0
    ORDER BY coefficient_of_variation DESC ), Enriched AS ( SELECT ic.display_name,
    ism2.value AS image_type, CASE WHEN EXISTS ( SELECT 1 FROM migrations m WHERE
    (m.source_compute = i.host OR m.dest_compute = i.host) AND m.deleted = 0 AND m.status
    NOT IN ('completed', 'failed', 'error') ) THEN 'Active' ELSE 'Inactive' END AS
    host_migration_status, ic.coefficient_of_variation FROM inner_cte ic JOIN instances
    i ON i.display_name = ic.display_name AND i.host = 'blaze8-12' JOIN instance_system_metadata
    ism2 ON ism2.instance_uuid = i.uuid AND ism2.key = 'image_image_type' AND ism2.deleted
    = 0 JOIN instance_info_caches iic2 ON iic2.instance_uuid = i.uuid AND iic2.deleted
    = 0 ) SELECT CASE WHEN GROUPING(image_type) = 1 THEN 'GRAND TOTAL' ELSE image_type
    END AS image_type, CASE WHEN GROUPING(host_migration_status) = 1 AND GROUPING(image_type)
    = 0 THEN 'SUBTOTAL' ELSE host_migration_status END AS host_migration_status, CASE
    WHEN GROUPING(display_name) = 1 AND GROUPING(host_migration_status) = 0 THEN 'SUBTOTAL'
    ELSE display_name END AS display_name, AVG(coefficient_of_variation) AS avg_coefficient_of_variation,
    COUNT(*) AS row_count FROM Enriched GROUP BY image_type, host_migration_status,
    display_name WITH ROLLUP ), q2 AS ( WITH inner_cte AS (SELECT i.display_name,
    MAX(m.memory_total) AS max_memory_total, m.status FROM instances i JOIN migrations
    m ON i.uuid = m.instance_uuid WHERE m.status = 'completed' AND i.display_name
    REGEXP 'prime' GROUP BY i.display_name, m.status HAVING MAX(m.memory_total) >
    0) SELECT inner_cte.display_name, MAX(inner_cte.max_memory_total) AS max_completed_migration_memory_total
    FROM inner_cte GROUP BY inner_cte.display_name ) SELECT q1.image_type, q1.host_migration_status,
    q1.display_name, q1.avg_coefficient_of_variation, q1.row_count, q2.max_completed_migration_memory_total
    FROM q1 LEFT JOIN q2 ON q2.display_name = q1.display_name ORDER BY q1.image_type,
    q1.host_migration_status, q1.display_name;
- id: metric_prime_completed_migration_group_max_vs_avg_and_instance_memory_filter
  name: Pattern-Matched Instances with Completed Migrations Exceeding Overall Averages
    of Group Max Memory Total and Instance Memory
  desc: 'Two-filter analysis of instances whose display_name matches a pattern and
    that have completed migrations. Filter 1: per (display_name, migration status,
    migration created_at) group, MAX(migrations.memory_total) must exceed the overall
    average of those per-group maxima (and be > 0). Filter 2: per display_name, AVG(instances.memory_mb)
    over completed-migration, non-deleted instances must exceed the overall average
    of those per-instance averages. Output columns: display_name, migration status,
    per-group max memory_total, migration created timestamp, MIN(migrations.id), and
    average instance memory_mb. Filter 2 joins through instance_system_metadata on
    instance_uuid. No rounding is applied.'
  category: Migration Memory Analysis
  default_granularity: one row per qualifying (display_name, status, migration created_at)
    group joined to the display-name-level memory average
  question: For instances whose display name matches the regular expression 'prime'
    and that have completed migrations, return only those instances that (1) have
    at least one (display name, migration status, created-at) group whose maximum
    migration MEMORY_TOTAL is greater than the overall average of these per-group
    maxima (and greater than 0), and (2) have an average instance MEMORY_MB (for completed,
    not-deleted instances) greater than the overall average of those per-instance
    averages; show the instance display name, migration status, per-group maximum
    MEMORY_TOTAL, migration created timestamp, minimum migration ID, and average instance
    memory (MB). Do not return any rounded answers.
  sql: WITH Q1_inner_cte AS ( WITH inner_cte AS ( SELECT i.display_name, m.status,
    MAX(m.memory_total) AS max_memory_total, m.created_at FROM migrations m JOIN instances
    i ON m.instance_uuid = i.uuid JOIN instance_info_caches ic ON i.uuid = ic.instance_uuid
    WHERE m.status = 'completed' AND i.display_name REGEXP 'prime' GROUP BY i.display_name,
    m.status, m.created_at HAVING MAX(m.memory_total) > 0 ), AvgOfGroupMax AS ( SELECT
    AVG(inner_cte.max_memory_total * 1.0) AS avg_group_max_memory_total FROM inner_cte
    ) SELECT inner_cte.display_name, inner_cte.status, inner_cte.max_memory_total,
    inner_cte.created_at FROM inner_cte WHERE inner_cte.max_memory_total > (SELECT
    avg_group_max_memory_total FROM AvgOfGroupMax) ), Q2_inner_cte AS ( WITH inner_cte
    AS ( SELECT i.DISPLAY_NAME, MIN(m.ID) AS min_migration_id, AVG(i.MEMORY_MB) AS
    avg_instance_memory_mb FROM MIGRATIONS m JOIN INSTANCES i ON m.INSTANCE_UUID =
    i.UUID JOIN INSTANCE_SYSTEM_METADATA ism ON i.UUID = ism.INSTANCE_UUID WHERE m.STATUS
    = 'completed' AND i.DELETED = 0 AND i.DISPLAY_NAME REGEXP 'prime' GROUP BY i.DISPLAY_NAME
    ) SELECT inner_cte.DISPLAY_NAME, inner_cte.min_migration_id, inner_cte.avg_instance_memory_mb
    FROM inner_cte WHERE inner_cte.avg_instance_memory_mb > ( SELECT AVG(inner_cte2.avg_instance_memory_mb)
    FROM inner_cte AS inner_cte2 ) ) SELECT q1.display_name, q1.status, q1.max_memory_total,
    q1.created_at, q2.min_migration_id, q2.avg_instance_memory_mb FROM Q1_inner_cte
    q1 JOIN Q2_inner_cte q2 ON q1.display_name = q2.DISPLAY_NAME;
- id: metric_top_display_names_on_host_with_migration_context_and_memory_remaining_cv
  name: Top Display Names on a Host by Average Memory with Migration Context Flag
    and Memory-Remaining Coefficient of Variation
  desc: For non-deleted instances with a given power_state on a given compute host
    (joined 1:1 to instance_extra and instance_info_caches via instance_uuid), groups
    by display_name and ranks the top N by AVG(memory_mb), reporting MIN(instances.id),
    average memory, and a Yes/No flag whether any instance in the group has a non-empty
    instance_extra.migration_context. A second part computes, per display_name, the
    coefficient of variation (STDDEV/AVG, sample STDDEV only) of migrations.memory_remaining
    for completed migrations of instances on that host (restricted to instances with
    an 'image_image_type' system-metadata row), plus each value's deviation from the
    overall average coefficient of variation. The two parts are joined on display_name.
    No rounding is applied.
  category: Instance Memory and Migration Comprehensive Analysis
  default_granularity: one row per top-N display name on the host
  question: For the top 10 instance display names on host 'blaze8-12' (considering
    only instances that are not deleted and have power state 4, using the UUID links
    between INSTANCES, INSTANCE_EXTRA, and INSTANCE_INFO_CACHES), return each display
    name along with its minimum instance ID, average memory (MB), whether any instance
    in that display-name group has a non-empty migration context in INSTANCE_EXTRA,
    and (when available) the coefficient of variation (using STDDEV only and never
    STDDEV_POP) of memory_remaining for completed migrations of that display name
    plus its deviation from the overall average coefficient of variation (using STDDEV
    only and never STDDEV_POP) across all such instances on 'blaze8-12'. Do not return
    any rounded answers.
  sql: WITH q1 AS ( WITH inner_cte AS ( SELECT MIN(i.ID) AS min_instance_id, AVG(i.MEMORY_MB)
    AS avg_memory_mb FROM INSTANCES i JOIN INSTANCE_EXTRA ie ON ie.INSTANCE_UUID =
    i.UUID JOIN INSTANCE_INFO_CACHES ic ON ic.INSTANCE_UUID = i.UUID WHERE i.DELETED
    = 0 AND i.POWER_STATE = 4 AND i.HOST = 'blaze8-12' GROUP BY i.DISPLAY_NAME ) SELECT
    i.DISPLAY_NAME AS display_name, inner_cte.min_instance_id, inner_cte.avg_memory_mb,
    CASE WHEN EXISTS ( SELECT 1 FROM INSTANCES i2 JOIN INSTANCE_EXTRA ie2 ON ie2.INSTANCE_UUID
    = i2.UUID JOIN INSTANCE_INFO_CACHES ic2 ON ic2.INSTANCE_UUID = i2.UUID WHERE i2.DELETED
    = 0 AND i2.POWER_STATE = 4 AND i2.HOST = 'blaze8-12' AND i2.DISPLAY_NAME = i.DISPLAY_NAME
    AND ie2.MIGRATION_CONTEXT IS NOT NULL AND ie2.MIGRATION_CONTEXT <> '' ) THEN 'Yes'
    ELSE 'No' END AS has_migration_context FROM inner_cte JOIN INSTANCES i ON i.ID
    = inner_cte.min_instance_id ORDER BY inner_cte.avg_memory_mb DESC LIMIT 10 ),
    q2 AS ( WITH inner_cte AS ( SELECT i.display_name, STDDEV(m.memory_remaining)
    / NULLIF(AVG(m.memory_remaining), 0) AS coefficient_of_variation FROM migrations
    AS m JOIN instances AS i ON m.instance_uuid = i.uuid JOIN instance_system_metadata
    AS ism ON i.uuid = ism.instance_uuid WHERE m.status = 'completed' AND ism.key
    = 'image_image_type' AND i.host = 'blaze8-12' GROUP BY i.display_name HAVING AVG(m.memory_remaining)
    > 0 ORDER BY coefficient_of_variation DESC ), avg_cov AS ( SELECT AVG(coefficient_of_variation)
    AS avg_coefficient_of_variation FROM inner_cte ) SELECT ic.display_name, ic.coefficient_of_variation,
    (ic.coefficient_of_variation - ac.avg_coefficient_of_variation) AS deviation_from_avg_coefficient_of_variation
    FROM inner_cte ic CROSS JOIN avg_cov ac ORDER BY ic.coefficient_of_variation DESC
    ) SELECT q1.display_name, q1.min_instance_id, q1.avg_memory_mb, q1.has_migration_context,
    q2.coefficient_of_variation, q2.deviation_from_avg_coefficient_of_variation FROM
    q1 LEFT JOIN q2 ON q2.display_name = q1.display_name ORDER BY q1.avg_memory_mb
    DESC;
- id: metric_memory_stats_by_vm_state_for_pci_request_instances
  name: Instance Memory Statistics by VM State for Instances with PCI Requests
  desc: For instances that have a non-empty PCI requests value in instance_extra (pci_requests
    <> '[]'), computes per vm_state the average memory_mb, the memory_mb range (MAX
    - MIN), and the VARIANCE of memory_mb, joined 1:1 to instance_extra on uuid =
    instance_uuid. Also attaches the overall average of the per-VM-state average memory
    across all VM states as a benchmark column. No rounding is applied.
  category: Instance Memory Analysis
  default_granularity: one row per vm_state, each annotated with the overall average
    of per-state averages
  question: For each VM state, show the VM state, the average/range/variance of instance
    memory (in MB) for instances that have a non-empty PCI requests value recorded
    in the instance extra table, along with the overall average of the per-VM-state
    average memory across all VM states. Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT i.VM_STATE AS vm_state, AVG(i.MEMORY_MB) AS avg_memory_mb,
    MAX(i.MEMORY_MB) - MIN(i.MEMORY_MB) AS memory_mb_range, VARIANCE(i.MEMORY_MB)
    AS memory_mb_variance FROM INSTANCES AS i JOIN INSTANCE_EXTRA AS ie ON i.UUID
    = ie.INSTANCE_UUID WHERE ie.PCI_REQUESTS <> '[]' GROUP BY i.VM_STATE ORDER BY
    memory_mb_range DESC ) SELECT inner_cte.vm_state, inner_cte.avg_memory_mb, inner_cte.memory_mb_range,
    inner_cte.memory_mb_variance, overall_avg.avg_of_avg_memory_mb FROM inner_cte
    JOIN ( SELECT AVG(avg_memory_mb) AS avg_of_avg_memory_mb FROM inner_cte ) AS overall_avg;
- id: metric_completed_migration_running_sum_by_instance_type_above_average
  name: Completed Migrations on a Host with Running Sum of Migration IDs per Instance
    Type Above Average
  desc: 'For completed migrations whose instance runs on a given compute host, joins
    migrations to instances (instance_uuid = uuid) and to instance_info_caches (1:1
    on uuid), and computes a running sum of migration IDs within each instance type
    partition: SUM(migrations.id) OVER (PARTITION BY instances.instance_type_id ORDER
    BY migrations.id). Only rows whose running sum exceeds the average running-sum
    value across all such rows are returned, with migration id, instance display name,
    and instance info cache id. No rounding is applied.'
  category: Migration Analysis
  default_granularity: one row per completed migration on the host passing the running-sum
    threshold
  question: For migrations whose status is "completed" and whose instance is hosted
    on "blaze8-12", list the migration ID, the instance display name, and the instance
    info cache ID, along with the running sum of migration IDs within each instance
    type (partitioned by the instance’s INSTANCE_TYPE_ID) ordered by migration ID,
    but only include rows where this running sum is greater than the average running-sum
    value across all such rows. Do not return any rounded answers.
  sql: WITH inner_cte AS ( SELECT m.ID AS migration_id, i.DISPLAY_NAME AS instance_display_name,
    c.ID AS instance_info_cache_id, SUM(m.ID) OVER (PARTITION BY i.INSTANCE_TYPE_ID
    ORDER BY m.ID) AS window_column FROM MIGRATIONS AS m JOIN INSTANCES AS i ON m.INSTANCE_UUID
    = i.UUID JOIN INSTANCE_INFO_CACHES AS c ON i.UUID = c.INSTANCE_UUID WHERE m.STATUS
    = 'completed' AND i.HOST = 'blaze8-12' ) SELECT migration_id, instance_display_name,
    instance_info_cache_id, window_column FROM inner_cte WHERE window_column > (SELECT
    AVG(window_column) FROM inner_cte);
- id: metric_top_display_names_by_memory_variance_with_metadata_and_config_drive
  name: Top Display Names by Memory Variance with System Metadata Counts and Config
    Drive Flag
  desc: Ranks the top 10 instance display names by VARIANCE of instances.memory_mb
    (computed over instances joined to non-deleted instance_info_caches rows on uuid
    = instance_uuid), reporting each name's memory variance and sample standard deviation
    (STDDEV, never STDDEV_POP). For each matching non-deleted instance having an instance_system_metadata
    row with key 'image_image_type', also reports the instance UUID, availability
    zone, count of metadata entries, total vcpus, and a Yes/No flag whether the instance
    has a config drive enabled (instances.config_drive in 'True'/'true'/'1'/1). No
    rounding is applied.
  category: Instance Memory Analysis
  default_granularity: one row per (top-10 display name, matching instance uuid)
  question: From the top 10 instance display names with the highest variance in instance
    memory (considering only non-deleted instance info cache records), display the
    instance display name, its memory variance and standard deviation (using STDDEV
    only and never STDDEV_POP), and for each matching non-deleted instance that has
    system metadata key = 'image_image_type' also show the instance UUID, availability
    zone, metadata entry count, total vCPUs, and whether the instance has a config
    drive enabled. Do not return any rounded answers.
  sql: WITH inner_cte AS ( WITH mem_stats AS ( SELECT i.display_name, VARIANCE(i.memory_mb)
    AS memory_mb_variance, STDDEV(i.memory_mb) AS memory_mb_stddev FROM instances
    AS i JOIN instance_info_caches AS ic ON i.uuid = ic.instance_uuid WHERE ic.deleted
    = 0 GROUP BY i.display_name ORDER BY memory_mb_variance DESC ), meta_vcpu AS (
    SELECT i.uuid AS instance_uuid, i.display_name, i.availability_zone, COUNT(ism.id)
    AS metadata_entry_count, SUM(i.vcpus) AS total_vcpus FROM instance_extra ie JOIN
    instances i ON ie.instance_uuid = i.uuid JOIN instance_system_metadata ism ON
    i.uuid = ism.instance_uuid WHERE i.deleted = 0 AND ism.key = 'image_image_type'
    GROUP BY i.uuid, i.display_name, i.availability_zone ), top10_by_variance AS (
    SELECT display_name, memory_mb_variance, memory_mb_stddev FROM mem_stats ORDER
    BY memory_mb_variance DESC LIMIT 10 ) SELECT t.display_name, t.memory_mb_variance,
    t.memory_mb_stddev, mv.instance_uuid, mv.availability_zone, mv.metadata_entry_count,
    mv.total_vcpus FROM top10_by_variance AS t JOIN meta_vcpu AS mv ON t.display_name
    = mv.display_name ORDER BY t.memory_mb_variance DESC ) SELECT c.display_name,
    c.memory_mb_variance, c.memory_mb_stddev, c.instance_uuid, c.availability_zone,
    c.metadata_entry_count, c.total_vcpus, CASE WHEN i.config_drive IN ('True', 'true',
    '1', 1) THEN 'Yes' ELSE 'No' END AS has_config_drive FROM inner_cte AS c JOIN
    instances AS i ON i.uuid = c.instance_uuid ORDER BY c.memory_mb_variance DESC;
- id: metric_host_combined_memory_summary_filtered_by_display_name_average
  name: Combined Instance Memory Summary on a Host Filtered by Display-Name Average
    Above Overall Average
  desc: 'UNION ALL of two per-host memory summaries, then filtered by display-name
    averages. Branch 1: for instances with vcpus > 8 on a given host, per (vm_state,
    display_name) the instance count and MIN(memory_mb), joined 1:1 to instance_extra.
    Branch 2: for instances on the same host having a non-deleted instance_system_metadata
    row with key ''image_image_type'', per display_name the VARIANCE and sample STDDEV
    (never STDDEV_POP) of memory_mb, joined to instance_info_caches. Each branch row
    carries a reason label (''High VCPU Instances'' or ''Has image_image_type Metadata'').
    Only rows whose display_name has an average memory_mb higher than the overall
    average of display-name averages across the combined summary are kept, and that
    per-name average is shown. No rounding is applied.'
  category: Instance Memory Analysis
  default_granularity: one row per (branch, vm_state/display_name) combination passing
    the display-name average filter
  question: For host 'blaze8-12', return the combined instance memory summary (high-vCPU
    instance counts/minimum memory by VM_STATE and DISPLAY_NAME, plus MEMORY_MB variance/standard
    deviation (using STDDEV only and never STDDEV_POP) by DISPLAY_NAME for instances
    with a non-deleted 'image_image_type' system metadata key), but only include rows
    whose DISPLAY_NAME has a higher average MEMORY_MB than the overall average MEMORY_MB
    across all rows in that combined summary. Do not return any rounded answers.
  sql: WITH inner_cte AS ( WITH HighVcpuInstancesByStateAndName AS ( SELECT i.VM_STATE,
    i.DISPLAY_NAME, COUNT(i.UUID) AS instance_count, MIN(i.MEMORY_MB) AS min_memory_mb
    FROM INSTANCES AS i JOIN INSTANCE_EXTRA AS ie ON i.UUID = ie.INSTANCE_UUID WHERE
    i.VCPUS > 8 AND i.host = 'blaze8-12' GROUP BY i.VM_STATE, i.DISPLAY_NAME ), ImageTypeMetadataMemoryStatsByName
    AS ( SELECT i.DISPLAY_NAME, VARIANCE(i.MEMORY_MB) AS memory_mb_variance, STDDEV(i.MEMORY_MB)
    AS memory_mb_stddev FROM INSTANCES AS i JOIN INSTANCE_SYSTEM_METADATA AS ism ON
    ism.INSTANCE_UUID = i.UUID JOIN INSTANCE_INFO_CACHES AS iic ON i.UUID = iic.INSTANCE_UUID
    WHERE ism.KEY = 'image_image_type' AND ism.DELETED = 0 AND i.HOST = 'blaze8-12'
    GROUP BY i.DISPLAY_NAME ORDER BY memory_mb_variance DESC ), CombinedInstanceMemorySummary
    AS ( SELECT hv.VM_STATE, hv.DISPLAY_NAME, hv.instance_count, hv.min_memory_mb,
    NULL AS memory_mb_variance, NULL AS memory_mb_stddev, 'High VCPU Instances' AS
    reason FROM HighVcpuInstancesByStateAndName hv UNION ALL SELECT NULL AS VM_STATE,
    ms.DISPLAY_NAME, NULL AS instance_count, NULL AS min_memory_mb, ms.memory_mb_variance,
    ms.memory_mb_stddev, 'Has image_image_type Metadata' AS reason FROM ImageTypeMetadataMemoryStatsByName
    ms ) SELECT * FROM CombinedInstanceMemorySummary ORDER BY DISPLAY_NAME, VM_STATE,
    reason ), DisplayNameAverages AS ( SELECT i.DISPLAY_NAME, AVG(i.MEMORY_MB * 1.0)
    AS avg_memory_mb_for_name FROM INSTANCES i WHERE i.HOST = 'blaze8-12' GROUP BY
    i.DISPLAY_NAME ), OverallCombinedAverage AS ( SELECT AVG(COALESCE(d.avg_memory_mb_for_name,
    0) * 1.0) AS overall_avg_memory_mb FROM inner_cte s JOIN DisplayNameAverages d
    ON d.DISPLAY_NAME = s.DISPLAY_NAME ) SELECT s.*, d.avg_memory_mb_for_name FROM
    inner_cte s JOIN DisplayNameAverages d ON d.DISPLAY_NAME = s.DISPLAY_NAME WHERE
    d.avg_memory_mb_for_name > (SELECT overall_avg_memory_mb FROM OverallCombinedAverage)
    ORDER BY s.DISPLAY_NAME, s.VM_STATE, s.reason;
- id: metric_display_name_migration_and_root_disk_dispersion
  name: Migration Memory/Disk Dispersion and Root Disk Coefficient of Variation by
    Display Name
  desc: 'For instance display names matching a pattern, joins three dispersion measures
    on display_name: (1) sample STDDEV (never STDDEV_POP) of migrations.memory_total
    across the instance''s migrations, restricted to instances having more than one
    instance_system_metadata row with key ''image_image_type''; (2) coefficient of
    variation (STDDEV/AVG) of instances.root_gb for instances on a given host with
    an ''image_image_type'' metadata row; (3) sample STDDEV of migrations.disk_total
    across the instance''s migrations. No rounding is applied.'
  category: Migration Memory and Instance Disk Comprehensive Analysis
  default_granularity: one row per instance display name present in both dispersion
    branches
  question: For instance display names that match <code>'prime'</code> and are on
    host <code>blaze8-12</code>, and considering only system-metadata rows where the
    key is <code>'image_image_type'</code> (with at least 2 such metadata rows for
    the instance), show each instance display name along with (1) the standard deviation
    (using STDDEV only and never STDDEV_POP) of <code>MIGRATIONS.MEMORY_TOTAL</code>
    across its migrations and (2) the coefficient of variation (using STDDEV only
    and never STDDEV_POP) of its <code>ROOT_GB</code>; additionally, include the standard
    deviation (using STDDEV only and never STDDEV_POP) of <code>MIGRATIONS.DISK_TOTAL</code>
    across its migrations. Do not return any rounded answers.
  sql: WITH inner_cte AS ( WITH sq1 AS ( SELECT i.display_name, STDDEV(m.memory_total)
    AS memory_total_stddev FROM migrations AS m JOIN instances AS i ON m.instance_uuid
    = i.uuid JOIN instance_system_metadata AS ism ON i.uuid = ism.instance_uuid WHERE
    ism.key = 'image_image_type' AND i.display_name REGEXP 'prime' GROUP BY i.display_name
    HAVING COUNT(ism.id) > 1 ORDER BY memory_total_stddev DESC ), sq2 AS ( SELECT
    i.display_name, STDDEV(i.root_gb) / NULLIF(AVG(i.root_gb), 0) AS coefficient_of_variation
    FROM instances AS i JOIN instance_system_metadata AS ism ON i.uuid = ism.instance_uuid
    WHERE ism.key = 'image_image_type' AND i.host = 'blaze8-12' GROUP BY i.display_name
    HAVING AVG(i.root_gb) > 0 ORDER BY coefficient_of_variation DESC ) SELECT sq1.display_name,
    sq1.memory_total_stddev, sq2.coefficient_of_variation FROM sq1 JOIN sq2 ON sq1.display_name
    = sq2.display_name ORDER BY sq1.memory_total_stddev DESC ) SELECT inner_cte.display_name,
    inner_cte.memory_total_stddev, inner_cte.coefficient_of_variation, STDDEV(m.disk_total)
    AS disk_total_stddev FROM inner_cte JOIN instances AS i ON i.display_name = inner_cte.display_name
    JOIN migrations AS m ON m.instance_uuid = i.uuid GROUP BY inner_cte.display_name,
    inner_cte.memory_total_stddev, inner_cte.coefficient_of_variation ORDER BY inner_cte.memory_total_stddev
    DESC;
- id: metric_top_display_names_completed_migrations_with_per_dest_compute_dispersion
  name: Top Display Names by Completed Migration Count with Per-Destination-Compute
    Count Dispersion
  desc: 'For instance display names matching a pattern and having a non-empty instances.key_name,
    ranks the top 10 display names by total number of completed migrations (COUNT
    of migrations.id where status = ''completed'', joined to instances on instance_uuid
    = uuid and 1:1 to instance_extra). For each name it also reports the dispersion
    of completed-migration counts measured per (instance_uuid, dest_compute): the
    range (MAX - MIN), VARIANCE, and sample STDDEV (never STDDEV_POP) of those per-destination
    counts, keeping only display names whose range is greater than 0. No rounding
    is applied.'
  category: Migration Analysis
  default_granularity: one row per top-10 display name with non-zero migration-count
    range
  question: For the top 10 instance display names matching the pattern 'prime' that
    have a non-empty key name, show each display name’s total number of completed
    migrations, along with the range, variance, and standard deviation (using STDDEV
    only and never STDDEV_POP) of completed-migration counts per instance (counted
    per destination compute), but only include display names whose migration-count
    range is greater than 0. Do not return any rounded answers.
  sql: WITH InstanceMigrationDispersion AS (SELECT i.display_name, MAX(migration_count)
    - MIN(migration_count) AS migration_count_range, VARIANCE(migration_count) AS
    migration_count_variance, STDDEV(migration_count) AS migration_count_stddev FROM
    instances AS i JOIN instance_extra AS ie ON i.uuid = ie.instance_uuid JOIN ( SELECT
    m.instance_uuid, m.dest_compute, COUNT(*) AS migration_count FROM migrations AS
    m WHERE m.status = 'completed' GROUP BY m.instance_uuid, m.dest_compute ) AS mig_stats
    ON i.uuid = mig_stats.instance_uuid WHERE i.display_name REGEXP 'prime' GROUP
    BY i.display_name ORDER BY migration_count_range DESC), TopCompletedMigrations
    AS (SELECT i.display_name, COUNT(m.id) AS completed_migrations FROM migrations
    AS m JOIN instances AS i ON m.instance_uuid = i.uuid JOIN instance_extra AS ie
    ON i.uuid = ie.instance_uuid WHERE m.status = 'completed' AND i.key_name IS NOT
    NULL AND i.key_name <> '' AND i.display_name REGEXP 'prime' GROUP BY i.display_name
    ORDER BY completed_migrations DESC LIMIT 10) SELECT tcm.display_name, tcm.completed_migrations,
    imd.migration_count_range, imd.migration_count_variance, imd.migration_count_stddev
    FROM TopCompletedMigrations tcm JOIN InstanceMigrationDispersion imd ON tcm.display_name
    = imd.display_name WHERE imd.migration_count_range > 0 ORDER BY tcm.completed_migrations
    DESC;
- id: metric_high_memory_vm_states_with_active_migration_ratio
  name: High-Memory VM States on a Host with Active Migration Statuses and Memory
    Ratio
  desc: For a given compute host, identifies VM states whose total memory_mb across
    non-deleted instances (joined 1:1 to instance_extra) exceeds the host's overall
    average instance memory plus one sample standard deviation (STDDEV, never STDDEV_POP).
    For each qualifying VM state it lists every active (hidden = 0, status not in
    the terminal set accepted/confirmed/reverted/error/failed/completed) migration
    status, the number of instances involved, MIN(migrations.memory_total), the VM
    state's total instance memory, and the ratio of minimum migration memory_total
    to total instance memory (rounded to 4 decimals in this metric's ratio column
    only).
  category: Instance Memory and Migration Comprehensive Analysis
  default_granularity: one row per (vm_state, active migration status) on the host
  question: For host "blaze8-12", for each VM state whose total instance memory (across
    non-deleted instances) is greater than the host’s overall average instance memory
    plus one standard deviation (using STDDEV only and never STDDEV_POP), list the
    VM state along with each active (non-hidden) migration status for that VM state,
    the number of instances involved in those migrations, the minimum migration MEMORY_TOTAL,
    the total instance memory for the VM state, and the ratio of minimum migration
    MEMORY_TOTAL to total instance memory.
  sql: WITH ActiveMigrationsByState AS ( SELECT i.VM_STATE AS vm_state, m.STATUS AS
    migration_status, COUNT(i.ID) AS instance_count, MIN(m.MEMORY_TOTAL) AS min_memory_total
    FROM INSTANCES i JOIN MIGRATIONS m ON i.UUID = m.INSTANCE_UUID WHERE m.HIDDEN
    = 0 AND m.STATUS NOT IN ('accepted', 'confirmed', 'reverted', 'error', 'failed',
    'completed') GROUP BY i.VM_STATE, m.STATUS ), HighMemoryStatesOnHost AS ( SELECT
    i.vm_state, SUM(i.memory_mb) AS total_memory_mb FROM instances AS i JOIN instance_extra
    AS ie ON i.uuid = ie.instance_uuid WHERE i.deleted = 0 AND i.host = 'blaze8-12'
    GROUP BY i.vm_state HAVING SUM(i.memory_mb) > ( SELECT AVG(i2.memory_mb) + STDDEV(i2.memory_mb)
    FROM instances AS i2 JOIN instance_extra AS ie2 ON i2.uuid = ie2.instance_uuid
    WHERE i2.deleted = 0 AND i2.host = 'blaze8-12' ) ) SELECT hm.vm_state, am.migration_status,
    am.instance_count, am.min_memory_total, hm.total_memory_mb, ROUND(am.min_memory_total
    / NULLIF(hm.total_memory_mb, 0), 4) AS MinMigrationMemory_to_TotalInstanceMemory_Ratio
    FROM HighMemoryStatesOnHost hm JOIN ActiveMigrationsByState am ON hm.vm_state
    = am.vm_state ORDER BY MinMigrationMemory_to_TotalInstanceMemory_Ratio DESC;
- id: metric_completed_migrations_on_host_with_type_window_and_memory_stats
  name: Completed Migrations on a Host with Per-Migration-Type Minimum Memory Window
    and Display-Name Memory Dispersion
  desc: For a given compute host, lists all completed migrations joined to instances
    (instance_uuid = uuid) and 1:1 to instance_extra, showing migration id, instance
    uuid, migration type, source/destination compute, destination host, instance display
    name, vm_state, memory_mb, vcpus, instance_extra id, and a window value MIN(migrations.memory_total)
    OVER (PARTITION BY migration_type). Each row is additionally attached (by display_name)
    with the VARIANCE and sample STDDEV (never STDDEV_POP) of instances.memory_mb
    for host instances having a non-deleted instance_system_metadata entry with key
    'image_image_type' (joined to instance_info_caches). No rounding is applied.
  category: Migration Memory and Instance Memory Comprehensive Analysis
  default_granularity: one row per completed migration on the host
  question: For host 'blaze8-12', list all completed migrations (migration id, instance
    UUID, migration type, source compute, destination compute, destination host, instance
    display name, VM state, memory MB, vcpus, and instance extra record id), including
    the per-migration-type minimum MEMORY_TOTAL (as a window value), and also attach
    (by instance display name) the variance and standard deviation (using STDDEV only
    and never STDDEV_POP) of instance MEMORY_MB for instances that have a non-deleted
    system metadata entry with KEY = 'image_image_type'. Do not return any rounded
    answers.
  sql: WITH CompletedMigrationsOnBlaze AS (SELECT m.ID AS migration_id, m.INSTANCE_UUID,
    m.MIGRATION_TYPE, m.SOURCE_COMPUTE, m.DEST_COMPUTE, m.DEST_HOST, i.DISPLAY_NAME,
    i.VM_STATE, i.MEMORY_MB, i.VCPUS, ie.ID AS instance_extra_id, m.MEMORY_TOTAL,
    MIN(m.MEMORY_TOTAL) OVER (PARTITION BY m.MIGRATION_TYPE ORDER BY m.MIGRATION_TYPE)
    AS window_column FROM MIGRATIONS AS m JOIN INSTANCES AS i ON m.INSTANCE_UUID =
    i.UUID JOIN INSTANCE_EXTRA AS ie ON i.UUID = ie.INSTANCE_UUID WHERE m.STATUS =
    'completed' AND i.HOST = 'blaze8-12'), MemoryStatsByDisplayNameOnBlaze AS (SELECT
    i.DISPLAY_NAME, VARIANCE(i.MEMORY_MB) AS memory_mb_variance, STDDEV(i.MEMORY_MB)
    AS memory_mb_stddev FROM INSTANCES AS i JOIN INSTANCE_SYSTEM_METADATA AS ism ON
    i.UUID = ism.INSTANCE_UUID JOIN INSTANCE_INFO_CACHES AS iic ON i.UUID = iic.INSTANCE_UUID
    WHERE ism.KEY = 'image_image_type' AND ism.DELETED = 0 AND i.HOST = 'blaze8-12'
    GROUP BY i.DISPLAY_NAME ORDER BY memory_mb_variance DESC), CombinedResults AS
    ( SELECT cm.migration_id, cm.INSTANCE_UUID, cm.MIGRATION_TYPE, cm.SOURCE_COMPUTE,
    cm.DEST_COMPUTE, cm.DEST_HOST, cm.DISPLAY_NAME, cm.VM_STATE, cm.MEMORY_MB, cm.VCPUS,
    cm.instance_extra_id, cm.MEMORY_TOTAL, cm.window_column, ms.memory_mb_variance,
    ms.memory_mb_stddev FROM CompletedMigrationsOnBlaze cm LEFT JOIN MemoryStatsByDisplayNameOnBlaze
    ms ON ms.DISPLAY_NAME = cm.DISPLAY_NAME ) SELECT * FROM CombinedResults ORDER
    BY migration_id, DISPLAY_NAME;
- category: Security Group Rule Analysis
  default_granularity: one row per security group name
  desc: 'For each security group name, computes the coefficient of variation of rule
    port-range sizes: sample STDDEV (never STDDEV_POP) of (to_port - from_port) divided
    by AVG(to_port - from_port), over non-deleted security groups joined to their
    non-deleted rules (parent_group_id), restricted to groups whose average port-range
    size is positive, while considering only enabled instance types (instance_types.disabled
    = false, joined without a key condition). Only groups whose coefficient of variation
    exceeds the overall average coefficient of variation across all qualifying groups
    are returned, ordered by coefficient of variation descending. No rounding is applied.'
  id: metric_security_group_port_range_cv_above_overall_avg
  name: Security Groups with Port-Range Coefficient of Variation Above Overall Average
  sql: WITH inner_cte AS (SELECT sg.name, STDDEV(sgr.to_port - sgr.from_port) / NULLIF(AVG(sgr.to_port
    - sgr.from_port), 0) AS coefficient_of_variation FROM SECURITY_GROUPS AS sg JOIN
    SECURITY_GROUP_RULES AS sgr ON sg.id = sgr.parent_group_id JOIN INSTANCE_TYPES
    AS it ON 1 = 1 WHERE sg.deleted = 0 AND sgr.deleted = 0 AND it.disabled = false
    GROUP BY sg.name HAVING AVG(sgr.to_port - sgr.from_port) > 0 ORDER BY coefficient_of_variation
    DESC), OverallAvg AS ( SELECT AVG(inner_cte.coefficient_of_variation) AS avg_cov
    FROM inner_cte ) SELECT inner_cte.name, inner_cte.coefficient_of_variation FROM
    inner_cte WHERE inner_cte.coefficient_of_variation > (SELECT avg_cov FROM OverallAvg)
    ORDER BY inner_cte.coefficient_of_variation DESC;
- category: Security Group Rule Analysis
  default_granularity: one row per (security group name, protocol)
  desc: Number of active firewall rules per security group and protocol, counting
    non-deleted security_group_rules rows joined to non-deleted security_groups on
    parent_group_id = id, grouped by group name and protocol (tcp/udp/icmp). Used
    for questions about how many rules of each protocol a security group has.
  id: metric_security_group_rule_count_by_protocol
  name: Security Group Rule Count by Protocol
  sql: SELECT sg.name, sgr.protocol, COUNT(*) AS rule_count FROM security_groups AS
    sg JOIN security_group_rules AS sgr ON sg.id = sgr.parent_group_id WHERE sg.deleted
    = 0 AND sgr.deleted = 0 GROUP BY sg.name, sgr.protocol;
- category: Instance Type Analysis
  default_granularity: one row per disabled status
  desc: 'Flavor inventory summary of instance_types grouped by the disabled flag:
    number of flavors, average memory_mb, average vcpus, and average root_gb per disabled
    status, restricted to non-deleted flavors (deleted = 0). Used for questions about
    how many enabled/disabled flavors exist and their average resource sizes.'
  id: metric_instance_type_inventory_by_disabled_status
  name: Instance Type Inventory by Disabled Status
  sql: SELECT disabled, COUNT(*) AS flavor_count, AVG(memory_mb) AS avg_memory_mb,
    AVG(vcpus) AS avg_vcpus, AVG(root_gb) AS avg_root_gb FROM instance_types WHERE
    deleted = 0 GROUP BY disabled;
- category: Security Group Rule Analysis
  default_granularity: one row per project
  desc: Number of active security groups per owning project, counting non-deleted
    security_groups rows grouped by project_id, with the distinct number of group
    names per project. Used for questions about how many security groups each project
    owns.
  id: metric_security_group_count_by_project
  name: Security Group Count by Project
  sql: SELECT project_id, COUNT(*) AS group_count, COUNT(DISTINCT name) AS distinct_name_count
    FROM security_groups WHERE deleted = 0 GROUP BY project_id;
- id: metric_quota_usage_with_reservation_window_max_delta_above_resource_avg_in_use
  name: Quota Usage Records with Reservations, Forward-Window Max Delta, Filtered
    by Above-Average In-Use per Resource
  desc: For each non-deleted quota usage record that has a matching reservation (quota_usages.id
    = reservations.usage_id), reports the quota usage id, project id, resource, in_use,
    reserved, and the reservation uuid, plus a window column MAX(reservations.delta)
    OVER (ORDER BY reservations.id ROWS BETWEEN CURRENT ROW AND 2 FOLLOWING) giving
    the maximum reservation delta across the current row and the next 2 rows ordered
    by reservation id. Only rows whose in_use exceeds the average in_use of the same
    resource across all non-deleted quota usage records are kept; the per-resource
    average is computed in a CTE grouped by resource and applied via a correlated
    subquery. No rounding is applied.
  category: Quota Usage and Reservation Analysis
  sql: WITH inner_cte AS ( SELECT q.ID AS quota_usage_id, q.PROJECT_ID, q.RESOURCE,
    q.IN_USE, q.RESERVED, r.UUID AS reservation_uuid, MAX(r.DELTA) OVER (ORDER BY
    r.ID ROWS BETWEEN CURRENT ROW AND 2 FOLLOWING) AS max_delta_next_2 FROM QUOTA_USAGES
    AS q JOIN RESERVATIONS AS r ON q.ID = r.USAGE_ID WHERE q.DELETED = 0 ), ResourceInUseAverages
    AS ( SELECT q2.RESOURCE, AVG(q2.IN_USE * 1.0) AS avg_in_use FROM QUOTA_USAGES
    AS q2 WHERE q2.DELETED = 0 GROUP BY q2.RESOURCE ) SELECT i.quota_usage_id, i.PROJECT_ID,
    i.RESOURCE, i.IN_USE, i.RESERVED, i.reservation_uuid, i.max_delta_next_2 FROM
    inner_cte AS i JOIN ResourceInUseAverages AS a ON a.RESOURCE = i.RESOURCE WHERE
    i.IN_USE > ( SELECT a2.avg_in_use FROM ResourceInUseAverages AS a2 WHERE a2.RESOURCE
    = i.RESOURCE );
- id: metric_top_projects_by_reserved_delta_with_dense_rank_window_and_positive_reserved_flag
  name: Top Projects by Total Reserved Delta for Expiring Resource Reservations with
    Dense-Rank Window and Positive-Reserved Flag
  desc: For reservations of a given resource (e.g. 'cores') whose expire timestamp
    is earlier than a given cutoff, ranks the top 10 projects by SUM(reservations.delta)
    (total reserved delta). For each project it reports the project id, the total
    reserved delta, the maximum of a dense-rank window column DENSE_RANK() OVER (ORDER
    BY quota_usages.in_use ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) computed over
    reservations joined to their quota usage counters, and a Yes/No EXISTS flag whether
    the project has any reservation of the same resource before the same cutoff whose
    associated quota usage counter has reserved > 0. No rounding is applied.
  category: Quota Usage and Reservation Analysis
  sql: WITH inner_cte AS ( SELECT t1.UUID, dense_rank() OVER ( ORDER BY t0.IN_USE
    ROWS BETWEEN 2 PRECEDING AND CURRENT ROW ) AS window_column FROM QUOTA_USAGES
    t0 JOIN RESERVATIONS t1 ON t0.ID = t1.USAGE_ID WHERE t1.RESOURCE = 'cores' AND
    t1.EXPIRE < '2021-05-13 16:53:07' ) SELECT r.PROJECT_ID AS project_id, SUM(r.DELTA)
    AS total_reserved_delta, MAX(i.window_column) AS max_dense_rank_in_project, CASE
    WHEN EXISTS ( SELECT 1 FROM RESERVATIONS r2 JOIN QUOTA_USAGES q2 ON q2.ID = r2.USAGE_ID
    WHERE r2.PROJECT_ID = r.PROJECT_ID AND r2.RESOURCE = 'cores' AND r2.EXPIRE < '2021-05-13
    16:53:07' AND q2.RESERVED > 0 ) THEN 'Yes' ELSE 'No' END AS has_any_positive_reserved_quota
    FROM inner_cte i JOIN RESERVATIONS r ON r.UUID = i.UUID JOIN QUOTA_USAGES q ON
    q.ID = r.USAGE_ID WHERE r.RESOURCE = 'cores' AND r.EXPIRE < '2021-05-13 16:53:07'
    GROUP BY r.PROJECT_ID ORDER BY total_reserved_delta DESC LIMIT 10;
- id: metric_security_group_rule_from_port_window_min_deviation_and_protocol_running_sum
  name: Security Group Rules Above Protocol Average From-Port with Window Min, Deviation,
    and Running Sum
  desc: 'For the rules of a given security group name (e.g. ''aurum-xenon''), combines
    two window analyses joined on group name, protocol, and from_port. Part 1: for
    each rule of the group (security_groups joined to security_group_rules on id =
    parent_group_id), reports group name, description, user_id, project_id, protocol,
    from_port, to_port, cidr, a window column MIN(from_port) OVER (ORDER BY parent_group_id
    ROWS BETWEEN 3 PRECEDING AND 1 FOLLOWING), and the rule''s deviation of from_port
    from the overall average from_port across all of the group''s rules (CROSS JOIN
    with an AVG CTE). Part 2: keeps only rules whose from_port exceeds the average
    from_port of their own protocol within the group (per-protocol AVG CTE joined
    on protocol), and reports a running sum SUM(from_port) OVER (PARTITION BY protocol
    ORDER BY from_port). Results are ordered by protocol and from_port. No rounding
    is applied.'
  sql: WITH q1 AS ( WITH inner_cte AS (SELECT sg.NAME, sg.DESCRIPTION, sg.USER_ID,
    sg.PROJECT_ID, sgr.PROTOCOL, sgr.FROM_PORT, sgr.TO_PORT, sgr.CIDR, MIN(sgr.FROM_PORT)
    OVER ( ORDER BY sgr.PARENT_GROUP_ID ROWS BETWEEN 3 PRECEDING AND 1 FOLLOWING )
    AS window_column FROM SECURITY_GROUPS AS sg JOIN SECURITY_GROUP_RULES AS sgr ON
    sg.ID = sgr.PARENT_GROUP_ID WHERE sg.NAME = 'aurum-xenon'), avg_cte AS (SELECT
    AVG(FROM_PORT) AS avg_from_port FROM inner_cte) SELECT i.NAME, i.DESCRIPTION,
    i.USER_ID, i.PROJECT_ID, i.PROTOCOL, i.FROM_PORT, i.TO_PORT, i.CIDR, i.window_column,
    (i.FROM_PORT - a.avg_from_port) AS deviation_from_avg_from_port FROM inner_cte
    i CROSS JOIN avg_cte a ), q2 AS ( WITH inner_cte AS (SELECT sg.NAME AS security_group_name,
    sgr.PROTOCOL, sgr.FROM_PORT, SUM(sgr.FROM_PORT) OVER ( PARTITION BY sgr.PROTOCOL
    ORDER BY sgr.FROM_PORT ) AS window_column FROM SECURITY_GROUPS AS sg JOIN SECURITY_GROUP_RULES
    AS sgr ON sg.ID = sgr.PARENT_GROUP_ID WHERE sg.NAME = 'aurum-xenon'), ProtocolAverages
    AS ( SELECT sgr.PROTOCOL, AVG(sgr.FROM_PORT * 1.0) AS avg_from_port FROM SECURITY_GROUPS
    AS sg JOIN SECURITY_GROUP_RULES AS sgr ON sg.ID = sgr.PARENT_GROUP_ID WHERE sg.NAME
    = 'aurum-xenon' GROUP BY sgr.PROTOCOL ) SELECT i.security_group_name, i.PROTOCOL,
    i.FROM_PORT, i.window_column FROM inner_cte AS i JOIN ProtocolAverages AS pa ON
    pa.PROTOCOL = i.PROTOCOL WHERE i.FROM_PORT > pa.avg_from_port ) SELECT q1.NAME
    AS security_group_name, q1.DESCRIPTION, q1.USER_ID, q1.PROJECT_ID, q1.PROTOCOL,
    q1.FROM_PORT, q1.TO_PORT, q1.CIDR, q1.window_column AS min_from_port_window_3_preceding_1_following,
    q1.deviation_from_avg_from_port, q2.window_column AS running_sum_from_ports_within_protocol
    FROM q1 JOIN q2 ON q1.NAME = q2.security_group_name AND q1.PROTOCOL = q2.PROTOCOL
    AND q1.FROM_PORT = q2.FROM_PORT ORDER BY q1.PROTOCOL, q1.FROM_PORT;
  category: Security Group Rule Analysis
  default_granularity: one row per security group rule (of the given group) whose
    from_port is above its protocol average
- id: metric_security_group_rule_count_by_protocol_with_rollup
  name: Security Group Rule Count by Protocol with Subtotals and Grand Total (ROLLUP)
  desc: 'Counts non-deleted firewall rules per security group and protocol with hierarchical
    totals. An inner CTE joins non-deleted security_groups to non-deleted security_group_rules
    (id = parent_group_id) and computes DENSE_RANK() OVER (PARTITION BY group id ORDER
    BY rule id) as a window column; a RuleCounts CTE aggregates COUNT(*) per (group
    name, description, project_id, protocol). The final SELECT uses GROUP BY ... WITH
    ROLLUP and GROUPING() to label rows: per-protocol detail rows, ''SUBTOTAL'' rows
    per security group (protocol rolled up), and a ''GRAND TOTAL'' row (all columns
    rolled up), summing the rule counts. Used for questions asking rule counts per
    group and protocol together with per-group subtotals and an overall grand total.
    No rounding is applied.'
  sql: WITH inner_cte AS (SELECT sg.NAME, sg.DESCRIPTION, sg.PROJECT_ID, sgr.PROTOCOL,
    sgr.FROM_PORT, sgr.TO_PORT, sgr.CIDR, DENSE_RANK() OVER (PARTITION BY sg.ID ORDER
    BY sgr.ID) AS window_column FROM SECURITY_GROUPS sg JOIN SECURITY_GROUP_RULES
    sgr ON sg.ID = sgr.PARENT_GROUP_ID WHERE sg.DELETED = 0 AND sgr.DELETED = 0),
    RuleCounts AS ( SELECT NAME, DESCRIPTION, PROJECT_ID, PROTOCOL, COUNT(*) AS total_rules
    FROM inner_cte GROUP BY NAME, DESCRIPTION, PROJECT_ID, PROTOCOL ) SELECT CASE
    WHEN GROUPING(NAME) = 1 THEN 'GRAND TOTAL' ELSE NAME END AS security_group_name,
    CASE WHEN GROUPING(DESCRIPTION) = 1 AND GROUPING(NAME) = 0 THEN 'SUBTOTAL' ELSE
    DESCRIPTION END AS security_group_description, CASE WHEN GROUPING(PROJECT_ID)
    = 1 AND GROUPING(NAME) = 0 THEN 'SUBTOTAL' ELSE PROJECT_ID END AS project_id,
    CASE WHEN GROUPING(PROTOCOL) = 1 AND GROUPING(NAME) = 0 THEN 'SUBTOTAL' ELSE PROTOCOL
    END AS protocol, SUM(total_rules) AS total_rules FROM RuleCounts GROUP BY NAME,
    DESCRIPTION, PROJECT_ID, PROTOCOL WITH ROLLUP;
  category: Security Group Rule Analysis
  default_granularity: one row per (security group name, description, project_id,
    protocol), plus per-group SUBTOTAL rows and one GRAND TOTAL row
- id: metric_tcp_rule_rank_above_avg_rule_id_for_nova_scheduler_service
  name: TCP Security Group Rule Rank Within Group, Filtered by Rule ID Above Average
  desc: For tcp-protocol security group rules, ranks each rule within its security
    group and filters by rule id against an average threshold. An inner CTE joins
    security_groups to security_group_rules (id = parent_group_id) and cross-joins
    the services table restricted to a given service binary (services.binary = 'nova-scheduler',
    joined without a key condition, so each rule row is replicated per matching service
    row), keeping only rules with protocol = 'tcp', and computes RANK() OVER (PARTITION
    BY security group id ORDER BY rule id). The outer query returns security group
    id, group name, rule id, rule cidr, and the rank, keeping only rules whose rule
    id exceeds the average rule id across all such tcp rules. No rounding is applied.
  sql: WITH inner_cte AS ( SELECT sg.ID AS security_group_id, sg.NAME AS security_group_name,
    sgr.ID AS rule_id, sgr.CIDR AS rule_cidr, RANK() OVER (PARTITION BY sg.ID ORDER
    BY sgr.ID) AS window_column FROM SECURITY_GROUPS AS sg JOIN SECURITY_GROUP_RULES
    AS sgr ON sg.ID = sgr.PARENT_GROUP_ID JOIN services AS s ON s.binary = 'nova-scheduler'
    WHERE sgr.PROTOCOL = 'tcp' ) SELECT security_group_id, security_group_name, rule_id,
    rule_cidr, window_column FROM inner_cte WHERE rule_id > (SELECT AVG(rule_id) FROM
    inner_cte);
  category: Security Group Rule Analysis
  default_granularity: one row per tcp security group rule (per matching nova-scheduler
    service row) whose rule id is above the average tcp rule id
- id: metric_service_count_by_binary_and_disabled_status
  name: Nova Service Count by Binary and Disabled Status
  desc: 'Classification count of active Nova service processes: number of non-deleted
    services rows grouped by binary (nova-compute, nova-scheduler, nova-conductor,
    etc.) and disabled status, together with the number of distinct hosts running
    each binary and the average heartbeat report_count. Used for questions about how
    many services of each type are running, which binaries are enabled or administratively
    disabled, and on how many hosts each binary is deployed.'
  sql: SELECT binary, disabled, COUNT(*) AS service_count, COUNT(DISTINCT host) AS
    host_count, AVG(report_count) AS avg_report_count FROM services WHERE deleted
    = 0 GROUP BY binary, disabled ORDER BY binary, disabled;
  category: Service Availability Analysis
  default_granularity: one row per (binary, disabled status)
concepts:
- id: concept_compute_node_inventory
  name: Compute Node Inventory and Placement Resource Providers
  desc: 'Tables describing compute capacity in the cloud: Nova-side compute node records
    (hypervisor details, capacity, usage), their archived shadow copies, and placement-side
    resource provider registrations. Used for questions about compute nodes, hypervisors,
    host capacity, and provider linkage.'
  tables:
  - compute_nodes
  - shadow_compute_nodes
  - resource_providers
  comparisons:
  - dimension: Business process
    compute_nodes: Live Nova inventory reported by nova-compute services, with hypervisor
      type/version, vCPU/memory/disk capacity and usage, allocation ratios
    shadow_compute_nodes: Archived copy of deleted compute node rows, same 33-column
      schema, used for historical/audit queries of removed nodes
    resource_providers: Placement service registration of providers; only identity
      and concurrency fields (uuid, name, generation, can_host), no capacity or hypervisor
      details
  - dimension: Granularity / identity
    compute_nodes: One row per compute node; identified by uuid, associated to host
      name and managing service
    shadow_compute_nodes: One row per archived compute node; same identifiers as the
      original live row
    resource_providers: One row per resource provider; uuid is unique and equals the
      compute node uuid for compute hosts
  - dimension: Data currency
    compute_nodes: Continuously updated by the compute service; reflects current fleet
      state
    shadow_compute_nodes: Populated only when nodes are archived/deleted; not part
      of the live fleet
    resource_providers: Current placement registrations; a compute node exists here
      only if it was registered with placement
  - dimension: Typical metrics supported
    compute_nodes: Capacity/usage aggregation, hypervisor-type filtering, per-host
      counts
    shadow_compute_nodes: Historical counts of removed nodes
    resource_providers: Existence/linkage checks (e.g., nodes that have a provider),
      can_host filtering
  decision_guide:
    How many compute nodes of a hypervisor type exist / capacity and usage questions: 'Use
      compute_nodes: it is the live inventory carrying hypervisor_type, vcpus, memory_mb
      and usage columns'
    Which compute nodes are registered with the placement service / have a resource provider: Join
      compute_nodes to resource_providers on uuid; resource_providers alone has no
      hypervisor or capacity attributes
    Historical or audit questions about compute nodes that were deleted/archived: Use
      shadow_compute_nodes, which stores archived copies of removed compute node rows
    Counting providers that can host instances: Use resource_providers.can_host; this
      flag does not exist in compute_nodes
- id: concept_aggregate_membership
  name: Host Aggregate Membership
  desc: 'Tables expressing which entities belong to a host aggregate: aggregate_hosts
    maps Nova compute hosts to aggregates by host name, while resource_provider_aggregates
    maps placement resource providers to aggregates by provider id. Both reference
    aggregates.id via aggregate_id.'
  tables:
  - aggregate_hosts
  - resource_provider_aggregates
  - aggregates
  - shadow_aggregate_hosts
  comparisons:
  - dimension: Member identity
    aggregate_hosts: Member identified by host name (varchar), matching compute_nodes.host
      / services.host
    resource_provider_aggregates: Member identified by resource_provider_id, matching
      resource_providers.id
    aggregates: 'The aggregate itself: id, name, uuid, soft-delete flag'
    shadow_aggregate_hosts: Member identified by host name, matching shadow_compute_nodes.host;
      archived rows only
  - dimension: Schema richness
    aggregate_hosts: 7 columns including created_at/updated_at/deleted_at timestamps
      and soft-delete flag
    resource_provider_aggregates: Only 2 columns (resource_provider_id, aggregate_id),
      no timestamps or delete flag
    aggregates: 7 columns defining aggregate metadata (name, uuid)
    shadow_aggregate_hosts: Same 7-column schema as aggregate_hosts, populated only
      from deleted memberships
  - dimension: Linkage to compute nodes
    aggregate_hosts: Directly joinable to compute_nodes via host name
    resource_provider_aggregates: Reaches compute nodes only through resource_providers
      (provider id -> uuid -> compute_nodes.uuid)
    aggregates: Referenced by all membership tables via aggregate_id = aggregates.id
    shadow_aggregate_hosts: Joinable to shadow_compute_nodes via host name; not linked
      to live compute_nodes
  - dimension: Data currency
    aggregate_hosts: Live membership; reflects current host-to-aggregate assignments
    resource_provider_aggregates: Live placement-side membership tags
    aggregates: Live aggregate definitions
    shadow_aggregate_hosts: Historical archive of removed memberships; not part of
      current state
  decision_guide:
    Which hosts/compute nodes belong to aggregate X: Use aggregate_hosts joined to
      compute_nodes on host; this is the Nova-side membership keyed by host name
    Which resource providers are tagged with aggregate X: Use resource_provider_aggregates
      joined to resource_providers on resource_provider_id
    Aggregate name or UUID lookup: Use aggregates; membership tables only carry the
      numeric aggregate_id
    Historical/audit questions about hosts that formerly belonged to an aggregate: Use
      shadow_aggregate_hosts (optionally joined to shadow_compute_nodes on host);
      live aggregate_hosts no longer contains removed memberships
- id: concept_instance_record_tables
  name: Instance Records and Attribute Tables
  desc: 'Tables that jointly describe a Nova virtual machine instance: the live base
    record (instances), 1:1 extension tables holding heavy JSON attributes (instance_extra
    for flavor/NUMA/PCI, instance_info_caches for network info), key/value metadata
    tables (instance_system_metadata for system-written image_*/operational keys,
    instance_metadata for user-supplied keys), the union view of live+archived rows
    (all_instances), and the archived copy of deleted rows (shadow_instances). All
    satellite tables link to instances via instance_uuid = instances.uuid.'
  tables:
  - instances
  - instance_extra
  - instance_info_caches
  - instance_system_metadata
  - instance_metadata
  - all_instances
  - shadow_instances
  comparisons:
  - dimension: Content scope
    details: instances holds scalar identity/state/resource columns (uuid, display_name,
      hostname, memory_mb, vcpus, availability_zone, vm_state); instance_extra holds
      JSON documents (flavor, numa_topology, pci_requests, vcpu_model, migration_context);
      instance_info_caches holds only the network_info JSON; instance_system_metadata
      and instance_metadata hold key/value pairs; all_instances and shadow_instances
      mirror the instances schema.
  - dimension: Granularity and cardinality vs instances
    details: instance_extra and instance_info_caches are 1:1 with instances (safe
      joins, no fan-out); instance_system_metadata and instance_metadata are 1:N (one
      row per key, joins fan out and need key filters or GROUP BY); migrations-style
      1:N satellites behave the same way.
  - dimension: Live vs archived coverage
    details: instances contains current (including soft-deleted-flagged) rows; shadow_instances
      contains archived deleted rows; all_instances is a UNION view of both, so it
      is the only choice for questions spanning live and deleted history, while instances
      is correct for current-state questions.
  - dimension: Metadata ownership
    details: instance_system_metadata keys are written by Nova itself (mostly image_*
      properties copied from the boot image/flavor, e.g. image_image_type, plus operational
      keys like network_allocated); instance_metadata keys are set by the user. The
      same key name in the two tables has different provenance.
  - dimension: Flavor information location
    details: instances.instance_type_id only references the flavor row in instance_types;
      instance_extra.flavor carries the full resolved flavor JSON including extra_specs;
      instance_system_metadata carries flattened image_instance_type_* keys. Choose
      by whether a scalar reference, the full JSON, or individual image-copied values
      are needed.
  decision_guide:
    Questions about instance identity, state, size (memory_mb/vcpus), availability zone, display name: Use
      instances; it is the authoritative live record for scalar instance attributes.
    Questions needing the flavor JSON, NUMA topology, PCI requests or migration context of an instance: Use
      instance_extra joined on instance_uuid (1:1); these documents do not exist in
      instances.
    Questions about an instance's network interfaces / cached network info: Use instance_info_caches.network_info
      joined on instance_uuid (1:1).
    Questions filtering or counting system-written properties such as image_image_type, image_min_ram, network_allocated: Use
      instance_system_metadata with a key filter; count rows per instance_uuid when
      measuring how many metadata entries an instance has.
    Questions about user-defined tags/metadata on instances: Use instance_metadata,
      not instance_system_metadata, because its keys are user-supplied.
    Questions about deleted/archived instances or full history including removed VMs: Use
      all_instances (live+archived union) or shadow_instances (archived only); instances
      alone misses archived deleted rows.
- id: concept_migration_record_sources
  name: Instance Migration Record Sources
  desc: 'Tables and fields that carry information about instance migrations in OpenStack
    Nova: the live per-attempt migration log (migrations), its archived copy of deleted
    rows (shadow_migrations), and the per-instance migration context JSON snapshot
    embedded in instance_extra (migration_context). Questions about migration counts,
    statuses, memory/disk transfer volumes, or source/destination hosts must choose
    among these sources depending on whether live attempts, deleted history, or the
    instance-side context snapshot is needed.'
  tables:
  - migrations
  - shadow_migrations
  - instance_extra
  comparisons:
  - dimension: Granularity
    details: 'migrations and shadow_migrations: one row per migration attempt (an
      instance can have many); instance_extra.migration_context: at most one JSON
      snapshot per instance (1:1 with instances).'
  - dimension: Content
    details: 'migrations carries structured columns: status, migration_type, source_compute/dest_compute/dest_host,
      old/new instance_type_id, hidden flag, and memory_total/processed/remaining
      plus disk_total/processed/remaining counters in MB. instance_extra.migration_context
      only holds a JSON document with old/new flavor and PCI/NUMA context of an in-progress
      or last migration; it has no per-attempt status or transfer counters.'
  - dimension: Live vs archived coverage
    details: migrations contains current rows (with soft-delete flag deleted); shadow_migrations
      contains archived deleted migration rows and is the only source for removed
      migration history; instance_extra.migration_context reflects only the latest
      snapshot for still-existing instances.
  - dimension: Typical analytics
    details: Counts, status filters (e.g. 'completed'), memory/disk STDDEV/VARIANCE/SUM
      aggregations, and host-endpoint filters use migrations; existence checks of
      a recorded migration context per instance use instance_extra.migration_context
      IS NOT NULL AND <> ''; historical audits of purged migrations use shadow_migrations.
  decision_guide:
    How many migrations / which statuses / how much memory or disk was transferred per instance or host?: Use
      migrations, filtering on status (e.g. 'completed') and hidden as needed; aggregate
      memory_total/memory_processed/memory_remaining or disk_* per instance_uuid or
      display_name.
    Does an instance have any migration context recorded?: Use instance_extra.migration_context
      (non-NULL and non-empty check) joined 1:1 on instance_uuid; it cannot give per-attempt
      counts or statuses.
    Migration history of deleted/archived migration records: Use shadow_migrations;
      the live migrations table no longer holds purged rows.
    Resize before/after flavor analysis: Use migrations.old_instance_type_id / new_instance_type_id
      joined to instance_types.id; instance_extra.flavor only holds the current resolved
      flavor.
- comparisons:
  - dimension: Business role
    detail: security_groups defines the named group container; security_group_rules
      holds the actual rules attached to a group (parent_group_id); security_group_default_rules
      holds templates copied into newly created groups (no parent link); provider_fw_rules
      holds provider-injected global rules (no parent link); security_group_instance_association
      maps groups to instances.
  - dimension: Live vs archived
    detail: Each live table has a shadow_* counterpart storing purged/deleted rows
      with the same schema; shadow tables are only for historical/audit questions.
  - dimension: Port-range fields
    detail: from_port/to_port/cidr/protocol exist in security_group_rules, security_group_default_rules,
      provider_fw_rules, and shadow_security_group_rules; only security_group_rules
      additionally has parent_group_id and group_id (source-group rules).
  - dimension: Soft-delete filtering
    detail: All live and shadow tables carry a deleted flag; current-state questions
      must filter deleted = 0 on both security_groups and security_group_rules.
  decision_guide:
    Questions about which instances are protected by a security group: Use security_group_instance_association
      joined to security_groups (security_group_id = id) and instances (instance_uuid
      = uuid).
    Questions about rules of existing security groups (port ranges, protocols, cidr sources): Use
      security_group_rules joined to security_groups on parent_group_id = id, filtering
      deleted = 0 on both.
    Questions about default rule templates applied to new groups: Use security_group_default_rules;
      it has no parent_group_id because rows are group-independent templates.
    Questions about provider-level firewall rules: Use provider_fw_rules; these are
      global provider rules, not user security group rules.
    Historical/audit questions about deleted groups or rules: Use shadow_security_groups
      / shadow_security_group_rules, which archive purged rows.
  desc: 'Tables that jointly describe OpenStack Nova security groups and firewall
    rules: the group definitions (security_groups), rules attached to groups (security_group_rules),
    default rule templates copied into new groups (security_group_default_rules),
    provider-injected global firewall rules (provider_fw_rules), group-to-instance
    membership (security_group_instance_association), and the shadow_* archived copies
    of each live table. Questions about firewall rules, port ranges, allowed CIDRs,
    or group membership must choose among these sources depending on whether the rules
    belong to an existing group, are defaults, are provider-level, or are archived
    history.'
  id: concept_security_group_firewall_domain
  name: Security Group and Firewall Rule Domain
  tables:
  - security_groups
  - security_group_rules
  - security_group_default_rules
  - provider_fw_rules
  - security_group_instance_association
  - shadow_security_groups
  - shadow_security_group_rules
  - shadow_security_group_default_rules
  - shadow_security_group_instance_association
  - shadow_provider_fw_rules
- comparisons:
  - dimension: Business role
    details: quotas/project_user_quotas/quota_classes store configured hard limits
      (what is allowed); quota_usages stores actual consumption counters (in_use +
      reserved); reservations stores temporary holds (delta) against those counters
      pending commit or expiry.
  - dimension: Granularity
    details: 'quotas: one row per (project_id, resource); project_user_quotas: one
      row per (user_id, project_id, resource); quota_classes: one row per (class_name,
      resource); quota_usages: one row per (project_id, user_id, resource) counter;
      reservations: one row per reservation event, many per usage counter.'
  - dimension: Live vs archived
    details: Live tables (quotas, project_user_quotas, quota_classes, quota_usages,
      reservations) hold current state with soft-delete flags; shadow_* tables hold
      archived copies of deleted rows with identical schemas. In this database shadow_reservations
      contains ~1.3M historical rows while shadow_quota_usages is empty, so reservation
      history questions may need shadow_reservations.
  - dimension: Linkage
    details: reservations.usage_id references quota_usages.id; quota_usages, reservations,
      quotas, project_user_quotas and quota_classes share the same resource value
      domain (cores, ram, instances, gigabytes, volumes, floating_ips, fixed_ips,
      security_groups, server_groups) and project_id domain, but there is no foreign
      key between limits and usage - they align logically on (project_id, resource).
  decision_guide:
    How much of a resource is a project currently using or holding?: Use quota_usages
      (in_use, reserved); join reservations on usage_id = quota_usages.id for per-reservation
      detail such as delta, uuid, and expire.
    Which projects reserve the most of a resource before an expiration cutoff?: Use
      reservations (delta, expire, resource, project_id) joined to quota_usages for
      counter context; add shadow_reservations only when deleted/archived reservation
      history must be included.
    What is the maximum allowed amount of a resource for a project?: Use quotas for
      project-level hard_limit; project_user_quotas when the limit is user-specific;
      quota_classes for class-level defaults applied when no explicit quotas row exists.
    Questions about historical/deleted quota usage counters: Use shadow_quota_usages
      (note it is empty in this database); for historical/deleted reservations use
      shadow_reservations.
  desc: 'Tables that jointly implement OpenStack Nova quota management: configured
    limits (quotas for project-level hard limits, project_user_quotas for per-user
    overrides, quota_classes for class-level defaults), actual consumption counters
    (quota_usages with in_use and reserved per project/user/resource), temporary holds
    (reservations with signed delta and expire, referencing quota_usages via usage_id),
    and the shadow_* archived copies of deleted rows from each live table. Questions
    about resource limits, current usage, reserved amounts, reservation deltas, or
    quota enforcement must choose among these tables depending on whether configured
    limits, live counters, pending holds, or archived history are needed.'
  id: concept_quota_enforcement
  name: Quota Limits, Usage Counters and Reservations
  tables:
  - quota_usages
  - reservations
  - quotas
  - project_user_quotas
  - quota_classes
  - shadow_quota_usages
  - shadow_reservations
  - shadow_quotas
  - shadow_quota_classes
- id: concept_nova_service_registry
  name: Nova Service Process Registry
  desc: 'Tables that record OpenStack Nova service processes (nova-compute, nova-scheduler,
    nova-conductor, etc.) running on hosts: the live registry (services) and its archived
    copy of deleted rows (shadow_services). Questions about service availability,
    heartbeat staleness, disabled services, or filtering analyses by service binary
    must choose between the live table for current state and the shadow table for
    historical/audit questions.'
  tables:
  - services
  - shadow_services
  comparisons:
  - dimension: Live vs archived
    detail: services holds currently registered Nova service processes (filter deleted
      = 0 for active services); shadow_services holds rows purged from the live table
      and is only appropriate for historical/audit questions about decommissioned
      services.
  - dimension: Schema
    detail: Both share the same 14-column schema (host, binary, topic, report_count,
      disabled, disabled_reason, last_seen_up, forced_down, version, soft-delete flag),
      so the same filters apply; only the row population differs.
  - dimension: Join behavior
    detail: services joins to compute_nodes by host name or by compute_nodes.service_id
      = services.id; shadow_services has no maintained join to live tables and is
      queried standalone or against shadow_compute_nodes by host.
  decision_guide:
    Questions about which Nova services currently run on which hosts, service enabled/disabled state, or heartbeat freshness: Use
      services with deleted = 0; it is the live registry.
    Filtering another analysis by service binary (e.g. only when nova-scheduler exists): Use
      services restricted by binary; note such filters are often applied as a keyless
      join, replicating rows per matching service.
    Historical/audit questions about deleted or decommissioned service records: Use
      shadow_services, which archives purged rows from the live table.
column_concepts:
- id: column_concept_host_name
  name: Compute Host Name
  desc: Host-name columns that identify a Nova compute host across tables. They carry
    the same value domain (host names like 'scope-3', 'blaze8-12') and are the join
    keys linking compute nodes, services, aggregate membership, instance placement,
    and migration endpoints.
  columns:
  - compute_nodes.host
  - aggregate_hosts.host
  - services.host
  - instances.host
  - migrations.source_compute
  - migrations.dest_compute
  comparisons:
  - dimension: Role in its table
    compute_nodes.host: The host on which the compute node runs; one host may have
      multiple compute node rows
    aggregate_hosts.host: The host that is a member of an aggregate; one host may
      appear in multiple aggregates
    services.host: The host where a Nova service (e.g., nova-compute, nova-scheduler)
      runs
    instances.host: The compute host currently running the instance; changes after
      migration, so it reflects present placement, not launch host (instances.launched_on
      keeps the original)
    migrations.source_compute: The compute host the instance is migrated FROM in one
      migration attempt
    migrations.dest_compute: The compute host the instance is migrated TO in one migration
      attempt
  decision_guide:
    Filter compute nodes by aggregate membership: Join compute_nodes.host = aggregate_hosts.host
    Find the service managing a compute node: Join compute_nodes.host = services.host
      or compute_nodes.service_id = services.id
    Find instances currently running on a host: Filter instances.host = '<host name>';
      this is the current placement, use launched_on for the original launch host
    Find migrations touching a host (either direction): Filter migrations.source_compute
      = '<host>' OR migrations.dest_compute = '<host>'; a host can be an endpoint
      without hosting the instance now
    Link a migration endpoint to host inventory: Join migrations.source_compute /
      dest_compute to compute_nodes.host to get capacity or hypervisor details of
      the endpoint hosts
- id: column_concept_uuid_linkage
  name: Compute Node / Resource Provider UUID
  desc: UUID columns that link a Nova compute node to its placement resource provider.
    For compute hosts the two UUIDs are equal, making this the canonical cross-system
    identity join.
  columns:
  - compute_nodes.uuid
  - resource_providers.uuid
  comparisons:
  - dimension: Uniqueness
    compute_nodes.uuid: UUID of the compute node; nullable varchar(36), not enforced
      unique in this schema
    resource_providers.uuid: UUID of the resource provider; NOT NULL and UNIQUE
  decision_guide:
    Check whether a compute node is registered with placement: Join compute_nodes.uuid
      = resource_providers.uuid; nodes without a match are not registered
    Look up a provider by name: Use resource_providers.name (unique), then map to
      compute nodes via uuid
- id: column_concept_aggregate_id
  name: Aggregate Identifier
  desc: Columns identifying a host aggregate across membership and definition tables.
    aggregate_id in membership tables references aggregates.id.
  columns:
  - aggregate_hosts.aggregate_id
  - resource_provider_aggregates.aggregate_id
  - aggregates.id
  comparisons:
  - dimension: Role
    aggregate_hosts.aggregate_id: Foreign key on the host-membership side; indexed,
      NOT NULL
    resource_provider_aggregates.aggregate_id: Foreign key on the resource-provider-membership
      side; part of composite primary key
    aggregates.id: Primary key defining the aggregate itself
  decision_guide:
    Filter hosts by a specific aggregate: Use aggregate_hosts.aggregate_id
    Resolve aggregate name/uuid from an id: Join to aggregates on aggregates.id
- id: column_concept_instance_uuid
  name: Instance UUID Linkage
  desc: Columns carrying the canonical instance UUID used to link satellite tables
    to the instance record. instances.uuid is the authoritative identity; every per-instance
    satellite table (instance_extra, instance_info_caches, instance_system_metadata,
    instance_metadata, migrations) stores the same value in a column named instance_uuid.
    This is the standard join key for all instance-related multi-table queries.
  columns:
  - instances.uuid
  - instance_extra.instance_uuid
  - instance_info_caches.instance_uuid
  - instance_system_metadata.instance_uuid
  - instance_metadata.instance_uuid
  - migrations.instance_uuid
  - shadow_instances.uuid
  comparisons:
  - dimension: Role
    details: instances.uuid (and shadow_instances.uuid) is the source of truth, unique
      per instance; the instance_uuid columns are foreign-key references that may
      repeat (1:N tables) or appear exactly once (1:1 tables).
  - dimension: Fan-out behavior
    details: Joining on instance_uuid to instance_extra or instance_info_caches never
      multiplies rows (unique/1:1); joining to instance_system_metadata, instance_metadata,
      or migrations multiplies rows per key or per migration attempt and usually needs
      a key filter, aggregation, or DISTINCT.
  - dimension: Live vs archived
    details: instances.uuid covers live rows; shadow_instances.uuid covers archived
      deleted instances; satellite instance_uuid columns point at whichever copy existed
      when the row was written.
  decision_guide:
    Linking any per-instance attribute table to instance details: Join satellite.instance_uuid
      = instances.uuid; this is the only reliable instance linkage (numeric id columns
      are not shared).
    Counting rows per instance in 1:N satellites: Group by instance_uuid (e.g. COUNT
      of instance_system_metadata.id per instance_uuid) rather than joining back repeatedly,
      to avoid double counting.
    Including deleted instances in UUID-based analysis: Use shadow_instances.uuid
      or the all_instances view in place of instances.uuid.
- id: column_concept_memory_size
  name: Instance and Migration Memory Size Columns
  desc: 'Memory-size columns that are frequently confused because they share units
    (MB) but describe different things: the RAM allocated to an instance (instances.memory_mb),
    the flavor template''s defined RAM (instance_types.memory_mb), and the volume
    of memory transferred during a migration (migrations.memory_total / memory_processed
    / memory_remaining). Choosing the wrong one changes the business meaning of any
    aggregation.'
  columns:
  - instances.memory_mb
  - instance_types.memory_mb
  - migrations.memory_total
  - migrations.memory_processed
  - migrations.memory_remaining
  - instance_system_metadata.value
  comparisons:
  - dimension: Business meaning
    details: instances.memory_mb = RAM actually allocated to a running/existing VM;
      instance_types.memory_mb = RAM defined by the flavor template (applies to all
      instances of that flavor); migrations.memory_total = total memory that must
      be copied for one migration attempt; memory_processed/memory_remaining = progress
      counters within that transfer.
  - dimension: Granularity
    details: instances.memory_mb is per instance; instance_types.memory_mb is per
      flavor; migrations.memory_* are per migration attempt (an instance with several
      migrations has several values, so STDDEV/AVG over migrations measures variability
      across attempts, not across instances).
  - dimension: Typical analytics
    details: Use instances.memory_mb for capacity/allocation questions (sums, per-vCPU
      windows); use instance_types.memory_mb for flavor catalog questions; use migrations.memory_total
      for migration cost/variability statistics such as STDDEV per instance or display
      name.
  - dimension: Metadata mirror
    details: instance_system_metadata rows with key 'image_instance_type_memory_mb'
      store the image-copied flavor memory as a string value; it is a snapshot, not
      authoritative for current allocation.
  decision_guide:
    How much memory do instances (in a zone/project/host) use?: Use instances.memory_mb;
      it reflects actual per-instance allocation.
    What memory does a flavor define?: Use instance_types.memory_mb via instances.instance_type_id
      or the flavor name.
    How variable/large is memory transfer across migrations of an instance?: Use migrations.memory_total
      (with memory_processed/memory_remaining for progress); aggregate per instance_uuid
      or display_name across migration attempts.
    Memory recorded from the boot image metadata: Use instance_system_metadata.value
      where key = 'image_instance_type_memory_mb', understanding it is a launch-time
      snapshot string.
- columns:
  - security_group_rules.from_port
  - security_group_rules.to_port
  - security_group_default_rules.from_port
  - security_group_default_rules.to_port
  - provider_fw_rules.from_port
  - provider_fw_rules.to_port
  - shadow_security_group_rules.from_port
  - shadow_security_group_rules.to_port
  comparisons:
  - dimension: Rule ownership
    detail: security_group_rules.from_port/to_port belong to rules of a specific group
      (parent_group_id); security_group_default_rules and provider_fw_rules versions
      belong to group-independent templates/provider rules.
  - dimension: Live vs archived
    detail: shadow_security_group_rules.from_port/to_port hold the same values for
      purged rules and should only be used for historical questions.
  - dimension: Protocol dependence
    detail: 'In all tables the meaning depends on the sibling protocol column: numeric
      ports for tcp/udp, ICMP type/code (possibly -1) for icmp.'
  decision_guide:
    Historical port ranges of deleted rules: Use shadow_security_group_rules.from_port/to_port.
    Port ranges of default templates for new groups: Use security_group_default_rules.from_port/to_port.
    Port ranges of provider-injected global rules: Use provider_fw_rules.from_port/to_port.
    Port-range statistics of rules attached to existing security groups: Use security_group_rules.from_port/to_port
      (filter deleted = 0 and join parent_group_id to security_groups.id).
  desc: 'Firewall rule port-range columns shared by all rule-bearing tables in Nova:
    from_port and to_port define the inclusive port range a rule allows. For tcp/udp
    they are actual port numbers (e.g. 22..22, 1..65535); for icmp they carry the
    ICMP type and code (from_port may be -1 meaning all types). The port-range size
    used in dispersion statistics is (to_port - from_port). The same column pair exists
    in security_group_rules (rules of a group), security_group_default_rules (templates
    for new groups), provider_fw_rules (provider-level rules), and shadow_security_group_rules
    (archived rules).'
  id: column_concept_firewall_rule_port_range
  name: Firewall Rule Port Range (from_port / to_port)
- columns:
  - quota_usages.in_use
  - quota_usages.reserved
  - reservations.delta
  - quotas.hard_limit
  - project_user_quotas.hard_limit
  - quota_classes.hard_limit
  comparisons:
  - dimension: Meaning
    details: in_use = units already committed/consumed by the project; reserved =
      units held by pending reservations (aggregate of active deltas); delta = signed
      amount of a single reservation hold (positive reserving, negative releasing);
      hard_limit = configured maximum allowed units.
  - dimension: State vs event
    details: in_use, reserved and hard_limit are state values on a counter or limit
      row; delta is per-event on each reservation row and must be summed (SUM(delta))
      to compare with reserved.
  - dimension: Source table
    details: in_use/reserved live on quota_usages; delta lives on reservations (joined
      via usage_id = quota_usages.id); hard_limit lives on quotas (project), project_user_quotas
      (user override), or quota_classes (class default).
  - dimension: Sign and range
    details: in_use, reserved and hard_limit are non-negative counts; delta can be
      negative when a reservation releases units.
  decision_guide:
    How much of a resource is actually consumed by a project?: Use quota_usages.in_use.
    How much is temporarily held and not yet committed?: Use quota_usages.reserved
      for the counter total, or SUM(reservations.delta) over reservations joined by
      usage_id for per-reservation or filtered (e.g. by expire/resource) totals.
    Is a project over its allowed maximum?: Compare quota_usages.in_use + reserved
      against quotas.hard_limit (or project_user_quotas.hard_limit for user-specific
      limits, quota_classes.hard_limit for class defaults).
    Ranking projects by reservation activity: Aggregate reservations.delta (e.g. SUM
      or MAX in window frames ordered by reservations.id), not quota_usages.reserved
      which is a point-in-time counter.
  desc: 'Numeric resource-amount columns in the OpenStack Nova quota domain that are
    easily confused because they all measure units of the same resources (cores, ram,
    instances, etc.) but at different stages of quota enforcement: committed consumption
    (quota_usages.in_use), aggregated pending holds (quota_usages.reserved), a single
    reservation''s signed hold amount (reservations.delta), and configured maximum
    allowances (quotas.hard_limit, project_user_quotas.hard_limit, quota_classes.hard_limit).'
  id: column_concept_quota_resource_amount
  name: Quota Resource Amount Columns (in_use / reserved / delta / hard_limit)
