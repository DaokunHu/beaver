- id: instance_info_caches
  name: instance_info_caches
  desc: One-to-one cache table storing the serialized network information (network_info
    JSON) of each Nova instance, i.e. the cached view of the instance's virtual network
    interfaces, fixed/floating IPs and network bindings as last reported by the networking
    layer. Linked to instances by instance_uuid = instances.uuid.
  columns:
    created_at:
      desc: Timestamp when the cache record was created.
    updated_at:
      desc: Timestamp of the last refresh of the cached network info.
    deleted_at:
      desc: Timestamp when the record was soft-deleted; NULL for active records.
    id:
      desc: Auto-increment surrogate primary key.
    network_info:
      desc: 'JSON document caching the instance''s network information: virtual interfaces
        (VIFs), MAC/IP addresses, and network details.'
    instance_uuid:
      desc: Foreign key to instances.uuid; unique per instance (1:1).
    deleted:
      desc: 'Soft-delete flag: 0 for active records.'
  default_granularity: one row per instance (1:1 with instances)
- id: instance_metadata
  name: instance_metadata
  desc: User-supplied key/value metadata attached to each Nova instance. Unlike instance_system_metadata
    (written by Nova, mostly image_* properties), rows here are created and managed
    by the instance owner through the API for tagging and tooling purposes. One instance
    has many rows (one per key), linked by instance_uuid = instances.uuid. Archived
    deleted rows go to shadow_instance_metadata.
  columns:
    created_at:
      desc: Timestamp when the metadata row was created.
    updated_at:
      desc: Timestamp of the last update to the metadata row.
    deleted_at:
      desc: Timestamp when the row was soft-deleted; NULL for active rows.
    id:
      desc: Auto-increment surrogate primary key of the metadata row.
    key:
      desc: User-defined metadata key name.
    value:
      desc: User-defined metadata value string.
    instance_uuid:
      desc: Foreign key to instances.uuid identifying the owning instance; indexed.
        One instance has many user-metadata rows (1:N).
    deleted:
      desc: 'Soft-delete flag: 0 for active rows.'
  default_granularity: one row per (instance, user metadata key)
- id: instance_system_metadata
  name: instance_system_metadata
  desc: System-managed key/value metadata attached to each Nova instance. Unlike instance_metadata
    (user-supplied), rows here are written by Nova itself, predominantly image_* keys
    copied from the boot image and flavor at launch (e.g. image_image_type, image_min_ram,
    image_disk_format, image_instance_type_vcpus, image_owner_id) plus operational
    keys such as network_allocated and clean_attempts. One instance has many rows
    (one per key), so joins to instances on instance_uuid fan out. Archived deleted
    rows go to shadow_instance_system_metadata.
  columns:
    created_at:
      desc: Timestamp when the metadata row was created.
    updated_at:
      desc: Timestamp of the last update to the metadata row.
    deleted_at:
      desc: Timestamp when the row was soft-deleted; NULL for active rows.
    id:
      desc: Auto-increment surrogate primary key of the metadata row; counted when
        measuring how many metadata rows an instance has.
    instance_uuid:
      desc: Foreign key to instances.uuid identifying the owning instance; indexed.
        One instance has many system-metadata rows (1:N).
    key:
      desc: Metadata key name. Most keys are prefixed 'image_' and mirror properties
        of the boot image or flavor (e.g. 'image_image_type' = the image type/distribution
        recorded on the image, 'image_min_ram', 'image_instance_type_vcpus'); other
        keys are operational (e.g. 'network_allocated', 'clean_attempts').
    value:
      desc: String value associated with the metadata key.
    deleted:
      desc: 'Soft-delete flag: 0 for active rows.'
  default_granularity: one row per (instance, metadata key)
