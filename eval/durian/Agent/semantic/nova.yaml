      desc: '[INDEX]'
    project_id:
      desc: '[INDEX]'
    resource:
      desc: ''
    hard_limit:
      desc: ''
- id: provider_fw_rules
  name: provider_fw_rules
  desc: Firewall rules injected by the network provider (e.g. DHCP/ metadata service
    rules) in OpenStack Nova. Each row defines one provider-level rule (protocol,
    from_port..to_port range, source cidr) that applies globally rather than belonging
    to a user security group, so it carries no parent_group_id. User-defined group
    rules live in security_group_rules; archived deleted rows go to shadow_provider_fw_rules.
  columns:
    created_at:
      desc: Timestamp when the provider firewall rule was created.
    updated_at:
      desc: Timestamp of the last update to the rule.
    deleted_at:
      desc: Timestamp when the rule was soft-deleted; NULL while active.
    id:
      desc: '[AUTO_INCREMENT] [PK] Numeric provider firewall rule id.'
    protocol:
      desc: 'IP protocol of the rule: ''tcp'', ''udp'', or ''icmp''.'
    from_port:
      desc: Lower bound of the rule's port range (ICMP type for icmp rules).
    to_port:
      desc: Upper bound of the rule's port range (ICMP code for icmp rules).
    cidr:
      desc: Source IPv4 CIDR block the provider rule applies to.
    deleted:
      desc: 'Soft-delete flag: 0 means active, non-zero means deleted.'
- id: quota_classes
  name: quota_classes
  desc: Default quota class limits in OpenStack Nova. Each row defines a hard_limit
    for one resource under a named quota class (e.g. the 'default' class), applied
    to projects that have no explicit quotas row. Rows are soft-deleted via the deleted
    flag.
  columns:
    created_at:
      desc: ''
    updated_at:
      desc: ''
    deleted_at:
      desc: ''
    id:
      desc: '[AUTO_INCREMENT] [PK]'
    class_name:
      desc: '[INDEX]'
    resource:
      desc: ''
    hard_limit:
      desc: ''
    deleted:
      desc: ''
- id: quota_usages
  name: quota_usages
  desc: Live per-project (optionally per-user) resource usage counters in OpenStack
    Nova quota enforcement. Each row tracks one resource type (e.g. cores, ram, instances,
    gigabytes, volumes, floating_ips, fixed_ips, security_groups, server_groups) for
    one project, recording how much is currently in use (in_use) and how much is held
    by pending reservations (reserved). Reservations reference this table via reservations.usage_id.
    Rows are soft-deleted via the deleted flag (0 = active).
  columns:
    created_at:
      desc: Timestamp when the usage counter row was created.
    updated_at:
      desc: Timestamp of the last update to the usage counter.
    deleted_at:
      desc: Timestamp when the row was soft-deleted; NULL for active rows.
    id:
      desc: Auto-increment primary key of the usage counter; referenced by reservations.usage_id.
    project_id:
      desc: UUID of the project (tenant) that owns this resource usage counter.
    resource:
      desc: Name of the quota resource being counted, e.g. cores, ram, instances,
        gigabytes, volumes, floating_ips, fixed_ips, security_groups, server_groups.
        Same value domain as reservations.resource and quotas.resource.
    in_use:
      desc: Number of units of the resource currently in use by the project (committed
        consumption). Distinct from reserved, which counts pending reservation amounts.
    reserved:
      desc: Number of units of the resource currently held by unexpired reservations
        (sum of active reservation deltas not yet committed to in_use). Distinct from
        in_use and from reservations.delta.
    until_refresh:
      desc: Timestamp at which the in_use counter is next scheduled to be recomputed
        from actual resource counts; NULL when no refresh is scheduled.
    deleted:
      desc: 'Soft-delete flag: 0 means the row is active; a non-zero value (set to
        the row id) means deleted.'
    user_id:
      desc: UUID of the specific user the counter belongs to; NULL when the counter
        is project-wide.
  default_granularity: One row per (project_id, user_id, resource) usage counter
- id: quotas
  name: quotas
  desc: Per-project quota hard limits in OpenStack Nova. Each row sets the maximum
    allowed amount (hard_limit) of one resource (cores, ram, instances, etc.) for
    one project. Compared against quota_usages.in_use + reserved during quota enforcement.
    Rows are soft-deleted via the deleted flag.
  columns:
    id:
      desc: '[AUTO_INCREMENT] [PK]'
    created_at:
      desc: ''
    updated_at:
      desc: ''
    deleted_at:
      desc: ''
    project_id:
      desc: '[INDEX]'
    resource:
      desc: ''
    hard_limit:
      desc: ''
    deleted:
      desc: ''
- id: reservations
  name: reservations
  desc: Live table of pending quota reservations in OpenStack Nova. Each row represents
    one temporary hold against a quota usage counter (reservations.usage_id references
    quota_usages.id) for a specific resource and project, with a signed delta amount
    and an expiration timestamp after which the hold is rolled back. Used to track
    in-flight resource allocations (e.g. cores reserved while an instance boots).
    Rows are soft-deleted via the deleted flag.
  columns:
    created_at:
      desc: Timestamp when the reservation was created.
    updated_at:
      desc: Timestamp of the last update to the reservation.
    deleted_at:
      desc: Timestamp when the reservation was soft-deleted; NULL for active rows.
    id:
      desc: Auto-increment primary key of the reservation row; commonly used to order
        reservations chronologically in window computations.
    uuid:
      desc: Globally unique UUID identifying the reservation, used by clients to commit
        or roll back the reservation.
    usage_id:
      desc: 'Foreign key referencing quota_usages.id: the usage counter this reservation
        holds against.'
    project_id:
      desc: UUID of the project (tenant) that made the reservation.
    resource:
      desc: Name of the quota resource being reserved, e.g. cores, ram, instances.
        Same value domain as quota_usages.resource.
    delta:
      desc: 'Signed number of resource units held by this reservation: positive when
        reserving, negative when releasing. Aggregated into quota_usages.reserved
        while active.'
    expire:
      desc: Timestamp at which the reservation expires and its delta is rolled back
        if not committed.
    deleted:
      desc: 'Soft-delete flag: 0 means active; a non-zero value (set to the row id)
        means deleted.'
    user_id:
      desc: UUID of the user that made the reservation.
  default_granularity: One row per reservation event
- id: resource_provider_aggregates
  name: resource_provider_aggregates
  desc: Placement service membership mapping between resource providers and host aggregates.
    Each row records that a resource provider is tagged with a given aggregate (aggregate_id
    references aggregates.id, resource_provider_id references resource_providers.id).
    Unlike the Nova-side aggregate_hosts table, membership here is keyed by placement
    provider id rather than host name, and the table carries no timestamps or soft-delete
    flag.
  columns:
    resource_provider_id:
      desc: Identifier of the placement resource provider that belongs to the aggregate;
        references resource_providers.id. Part of the composite primary key.
    aggregate_id:
      desc: Identifier of the host aggregate the resource provider is tagged with;
        references aggregates.id. Part of the composite primary key.
    resource_provider_id_dup: null
- id: resource_providers
  name: resource_providers
  desc: Placement service registry of resource providers. Each resource provider is
    an entity that can supply inventory (compute hosts, storage pools, etc.). For
    compute hosts, the resource provider UUID equals the compute node UUID in compute_nodes,
    which is the linkage between Nova compute nodes and placement resource providers.
  columns:
    id:
      desc: Auto-increment surrogate primary key of the resource provider; referenced
        by resource_provider_aggregates.resource_provider_id and by inventory/allocation
        records
    uuid:
      desc: Unique UUID of the resource provider; for compute hosts it equals compute_nodes.uuid,
        serving as the join key between placement and Nova compute node records
    name:
      desc: Unique human-readable name of the resource provider, typically the compute
        host name
    generation:
      desc: Optimistic concurrency generation counter incremented on each inventory/allocation
        change
    can_host:
      desc: Flag indicating whether this resource provider can host instances (1 =
        yes, 0 = no)
    created_at:
      desc: Not present in this table; resource_providers has no timestamp columns
  default_granularity: one row per resource provider
